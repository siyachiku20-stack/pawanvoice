<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PawanVoice Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#32146b 0%,#130d29 40%,#070711 100%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  padding:25px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:100%;
  background:rgba(25,22,45,.88);
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;
  padding:30px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
  width:82px;
  height:82px;
  margin:auto;
  border-radius:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  background:linear-gradient(135deg,#8b4cff,#ff3d9a);
  box-shadow:0 10px 35px rgba(139,76,255,.4);
}

h1{
  text-align:center;
  margin-top:18px;
  font-size:30px;
}

.sub{
  text-align:center;
  color:#aaa;
  margin-top:7px;
  margin-bottom:28px;
}

label{
  display:block;
  margin:15px 3px 8px;
  color:#ddd;
  font-size:14px;
}

input{
  width:100%;
  height:52px;
  border:none;
  outline:none;
  border-radius:15px;
  padding:0 16px;
  color:white;
  background:#11101d;
  border:1px solid #302c46;
  font-size:15px;
}

input:focus{
  border-color:#914dff;
}

.dpbox{
  display:flex;
  gap:12px;
  align-items:center;
  margin-top:8px;
}

.dp{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  background:#29253b;
  border:2px solid #914dff;
}

.dpbox input{
  flex:1;
}

button{
  width:100%;
  height:54px;
  margin-top:25px;
  border:0;
  border-radius:16px;
  color:white;
  font-size:16px;
  font-weight:bold;
  background:linear-gradient(135deg,#8247ff,#f33d9c);
  box-shadow:0 10px 30px rgba(130,71,255,.3);
}

button:active{
  transform:scale(.98);
}

.note{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:18px;
}

#error{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  background:#481d2d;
  color:#ff9ab5;
  text-align:center;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<div class="card">

  <div class="logo">🎙️</div>

  <h1>PawanVoice</h1>

  <div class="sub">
    Meet • Talk • Make Friends
  </div>

  <label>Your Name</label>

  <input
    id="name"
    type="text"
    maxlength="20"
    placeholder="Enter your name"
  >

  <label>Choose User ID</label>

  <input
    id="userid"
    type="text"
    maxlength="20"
    placeholder="Example: pawan123"
  >

  <label>Profile Photo URL</label>

  <div class="dpbox">

    <img
      id="dpPreview"
      class="dp"
      src="https://i.pravatar.cc/150?img=12"
    >

    <input
      id="dp"
      type="url"
      placeholder="Paste photo URL"
      value="https://i.pravatar.cc/150?img=12"
    >

  </div>

  <button id="continueBtn">
    Continue
  </button>

  <div id="error"></div>

  <div class="note">
    Your profile will be saved to PawanVoice.
  </div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="/firebase.js"></script>

<script>

const nameInput = document.getElementById("name");
const userIdInput = document.getElementById("userid");
const dpInput = document.getElementById("dp");
const dpPreview = document.getElementById("dpPreview");
const errorBox = document.getElementById("error");
const continueBtn = document.getElementById("continueBtn");

dpInput.addEventListener("input", () => {

  if(dpInput.value.trim()){
    dpPreview.src = dpInput.value.trim();
  }

});

function showError(message){

  errorBox.innerText = message;
  errorBox.style.display = "block";

}

continueBtn.addEventListener("click", async () => {

  errorBox.style.display = "none";

  const name = nameInput.value.trim();
  const userId = userIdInput.value.trim().toLowerCase();
  const dp = dpInput.value.trim();

  if(name.length < 2){
    showError("Please enter your name.");
    return;
  }

  if(!/^[a-z0-9_]{4,20}$/.test(userId)){
    showError("User ID 4-20 characters: a-z, 0-9, _");
    return;
  }

  continueBtn.disabled = true;
  continueBtn.innerText = "Creating...";

  try{

    const ref = db.ref("users/" + userId);

    const snap = await ref.once("value");

    if(snap.exists()){

      const old = snap.val();

      if(old.name && old.name !== name){

        showError("This User ID is already taken.");
        continueBtn.disabled = false;
        continueBtn.innerText = "Continue";
        return;

      }

    }

    const userData = {
      userId:userId,
      name:name,
      dp:dp || "https://i.pravatar.cc/150?img=12",
      level:1,
      exp:0,
      coins:0,
      vip:0,
      online:true,
      updatedAt:Date.now()
    };

    await ref.set(userData);

    localStorage.setItem("pv_userId",userId);
    localStorage.setItem("pv_name",name);
    localStorage.setItem("pv_dp",userData.dp);

    window.location.href = "/index.html";

  }catch(error){

    console.error(error);

    showError(
      "Firebase connection failed. Check firebase.js API key and database."
    );

    continueBtn.disabled = false;
    continueBtn.innerText = "Continue";

  }

});

</script>

</body>
</html>
