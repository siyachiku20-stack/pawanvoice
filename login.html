<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PawanVoice Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#171044,#090716);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:92%;
  max-width:420px;
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  border-radius:25px;
  background:linear-gradient(135deg,#8d5cff,#ff4fa3);
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0 auto 20px;
  font-size:32px;
  font-weight:bold;
}

h1{
  margin:10px 0;
}

.subtitle{
  color:#aaa;
  margin-bottom:30px;
}

.card{
  background:rgba(255,255,255,.08);
  padding:22px;
  border-radius:22px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  border:none;
  border-radius:12px;
  background:#fff;
  color:#222;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#7b5cff,#ff4b9b);
  color:white;
  font-size:17px;
  font-weight:bold;
}

.status{
  margin-top:15px;
  color:#ccc;
  min-height:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">PV</div>

  <h1>PawanVoice</h1>

  <div class="subtitle">
    Voice • Friends • Party
  </div>

  <div class="card">

    <input
      id="name"
      type="text"
      maxlength="30"
      placeholder="Enter your name"
    >

    <input
      id="userId"
      type="text"
      maxlength="20"
      placeholder="Choose User ID"
    >

    <button onclick="continueApp()">
      Continue
    </button>

    <div id="status" class="status"></div>

  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script src="firebase.js"></script>

<script>

function cleanId(value){

  return value
    .toLowerCase()
    .replace(/[^a-z0-9_]/g,"")
    .substring(0,20);

}

async function continueApp(){

  const name =
    document.getElementById("name").value.trim();

  const userId =
    cleanId(document.getElementById("userId").value.trim());

  const status =
    document.getElementById("status");

  if(name.length < 2){

    status.textContent =
      "Please enter your name.";

    return;
  }

  if(userId.length < 4){

    status.textContent =
      "User ID must contain at least 4 characters.";

    return;
  }

  status.textContent = "Checking User ID...";

  try{

    const ref =
      database.ref("users/" + userId);

    const snapshot =
      await ref.once("value");

    if(snapshot.exists()){

      status.textContent =
        "This User ID is already taken.";

      return;
    }

    const user = {

      userId:userId,

      name:name,

      dp:"",

      level:1,

      exp:0,

      coins:0,

      vip:0,

      createdAt:Date.now()

    };

    await ref.set(user);

    localStorage.setItem(
      "pv_userId",
      userId
    );

    localStorage.setItem(
      "pv_name",
      name
    );

    localStorage.setItem(
      "pv_dp",
      ""
    );

    window.location.href =
      "index.html";

  }catch(error){

    console.error(error);

    status.textContent =
      "Firebase error: " + error.message;

  }

}

</script>

</body>
</html>
