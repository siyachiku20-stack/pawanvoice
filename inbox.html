<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PawanVoice Inbox</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#090b12;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:75px;
}

button,input{
  font:inherit;
}

.app{
  width:100%;
  max-width:760px;
  margin:auto;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#0e1119;
  border-bottom:1px solid #252b38;
  padding:12px;
}

.header-row{
  display:flex;
  align-items:center;
  gap:11px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#1a1f2b;
  color:#fff;
  font-size:26px;
}

.title{
  flex:1;
  font-size:20px;
  font-weight:800;
}

.header-dp{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  padding:12px;
  background:#0b0e16;
  overflow-x:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  position:relative;
  flex:0 0 auto;
  min-height:40px;
  padding:0 15px;
  border:1px solid #2b3140;
  border-radius:21px;
  background:#151925;
  color:#aeb5c5;
}

.tab.active{
  background:#ffca28;
  border-color:#ffca28;
  color:#171717;
  font-weight:800;
}

.badge{
  position:absolute;
  right:-4px;
  top:-7px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:12px;
  background:#ff3b55;
  color:#fff;
  font-size:9px;
  display:none;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.badge.show{
  display:flex;
}

/* CONTENT */

.content{
  padding:12px;
}

.section-title{
  color:#9da5b7;
  font-size:13px;
  font-weight:800;
  margin:5px 3px 10px;
}

.list{
  display:grid;
  gap:8px;
}

/* MESSAGE */

.message{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px;
  border:1px solid #252b38;
  border-radius:15px;
  background:#11141e;
  color:#fff;
  text-align:left;
}

.message:active{
  background:#181d28;
}

.dp{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
}

.info{
  min-width:0;
  flex:1;
}

.name-line{
  display:flex;
  align-items:center;
  gap:6px;
}

.name{
  min-width:0;
  font-size:14px;
  font-weight:800;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.last-message{
  margin-top:5px;
  color:#8d96a8;
  font-size:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.time{
  margin-top:5px;
  color:#626b7d;
  font-size:9px;
}

.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
  flex-shrink:0;
}

.unread{
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:12px;
  background:#ff3b55;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:800;
}

.arrow{
  color:#697386;
  font-size:18px;
}

/* REQUEST */

.request{
  background:#11141e;
  border:1px solid #252b38;
  border-radius:15px;
  padding:12px;
}

.request-top{
  display:flex;
  align-items:center;
  gap:11px;
}

.request-dp{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}

.request-info{
  min-width:0;
  flex:1;
}

.request-name{
  font-size:14px;
  font-weight:800;
}

.request-id{
  color:#687285;
  font-size:10px;
  margin-top:4px;
}

.request-text{
  color:#8d96a8;
  font-size:11px;
  margin-top:5px;
}

.request-buttons{
  display:flex;
  gap:8px;
  margin-top:11px;
}

.accept,
.reject{
  flex:1;
  min-height:40px;
  border:0;
  border-radius:10px;
  font-weight:800;
}

.accept{
  background:#ffca28;
  color:#171717;
}

.reject{
  background:#242936;
  color:#d7dbe3;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:40px 18px;
  background:#11141e;
  border:1px dashed #303646;
  border-radius:16px;
  color:#737d90;
  line-height:1.6;
}

.empty-icon{
  font-size:36px;
  margin-bottom:8px;
}

.loading{
  text-align:center;
  padding:40px;
  color:#737d90;
  font-size:12px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:#0e1119;
  border-top:1px solid #272d3a;
  z-index:30;
}

.bottom-inner{
  width:100%;
  max-width:760px;
  height:100%;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
}

.nav{
  position:relative;
  border:0;
  background:transparent;
  color:#838c9f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.nav.active{
  color:#ffca28;
}

.nav-icon{
  font-size:21px;
}

.nav-label{
  font-size:10px;
}

.bottom-badge{
  position:absolute;
  top:5px;
  right:calc(50% - 25px);
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:12px;
  background:#ff3b55;
  color:#fff;
  font-size:9px;
  display:none;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.bottom-badge.show{
  display:flex;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="header-row">

      <button
        class="back"
        type="button"
        onclick="goBack()"
      >
        ‹
      </button>

      <div class="title">
        📩 Inbox
      </div>

      <img
        id="headerDp"
        class="header-dp"
        src="https://i.pravatar.cc/200?img=12"
        alt="My profile"
      >

    </div>

  </header>


  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      data-tab="messages"
      type="button"
    >
      Messages
      <span
        id="messagesBadge"
        class="badge"
      ></span>
    </button>

    <button
      class="tab"
      data-tab="friends"
      type="button"
    >
      Friends
      <span
        id="friendsBadge"
        class="badge"
      ></span>
    </button>

    <button
      class="tab"
      data-tab="cp"
      type="button"
    >
      CP
      <span
        id="cpBadge"
        class="badge"
      ></span>
    </button>

    <button
      class="tab"
      data-tab="family"
      type="button"
    >
      Family
      <span
        id="familyBadge"
        class="badge"
      ></span>
    </button>

  </div>


  <!-- CONTENT -->

  <main
    id="content"
    class="content"
  >

    <div class="loading">
      Loading Inbox...
    </div>

  </main>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <div class="bottom-inner">

    <button
      class="nav"
      type="button"
      onclick="location.href='index.html'"
    >
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </button>


    <button
      class="nav active"
      type="button"
      onclick="location.href='inbox.html'"
    >

      <span class="nav-icon">
        📩
      </span>

      <span class="nav-label">
        Inbox
      </span>

      <span
        id="bottomBadge"
        class="bottom-badge"
      ></span>

    </button>


    <button
      class="nav"
      type="button"
      onclick="location.href='profile.html'"
    >
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </button>

  </div>

</nav>


<script>

/* =========================================
   PAWANVOICE INBOX
========================================= */

const DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const DEFAULT_DP =
  "https://i.pravatar.cc/200?img=12";


/* =========================================
   CURRENT USER
========================================= */

const currentUser = {

  userId:
    localStorage.getItem("pv_userId") ||
    "pawan",

  name:
    localStorage.getItem("pv_name") ||
    "Pawan User",

  dp:
    localStorage.getItem("pv_dp") ||
    DEFAULT_DP

};


/* =========================================
   STATE
========================================= */

let currentTab =
  "messages";

let privateMessages = [];

let friendRequests = [];

let cpRequests = [];

let familyInvites = [];

let loading = false;


/* =========================================
   ELEMENTS
========================================= */

const content =
  document.getElementById(
    "content"
  );

const headerDp =
  document.getElementById(
    "headerDp"
  );


headerDp.src =
  currentUser.dp ||
  DEFAULT_DP;

headerDp.onerror =
  function(){

    this.src =
      DEFAULT_DP;

  };


/* =========================================
   ESCAPE
========================================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================================
   TIME
========================================= */

function timeAgo(timestamp){

  const time =
    Number(timestamp || 0);

  if(!time){
    return "";
  }

  const diff =
    Date.now() -
    time;

  const minute =
    60 * 1000;

  const hour =
    60 * minute;

  const day =
    24 * hour;


  if(diff < minute){
    return "now";
  }


  if(diff < hour){

    return (
      Math.floor(
        diff / minute
      ) + "m"
    );

  }


  if(diff < day){

    return (
      Math.floor(
        diff / hour
      ) + "h"
    );

  }


  if(diff < 7 * day){

    return (
      Math.floor(
        diff / day
      ) + "d"
    );

  }


  return new Date(
    time
  ).toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short"
    }
  );

}


/* =========================================
   OBJECT → ARRAY
========================================= */

function objectToArray(data){

  if(
    !data ||
    typeof data !== "object"
  ){

    return [];

  }

  return Object.keys(data)
    .map(
      key => {

        const value =
          data[key];

        if(
          value &&
          typeof value === "object"
        ){

          return {
            requestId:key,
            ...value
          };

        }

        return {
          requestId:key,
          value:value
        };

      }
    );

}


/* =========================================
   LOAD PRIVATE MESSAGES
========================================= */

async function loadPrivateMessages(){

  try{

    const response =
      await fetch(
        DB +
        "/privateChats.json"
      );

    if(!response.ok){

      throw new Error(
        "Firebase HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    const conversations =
      new Map();


    if(data){

      Object.keys(data)
        .forEach(
          chatId => {

            const chat =
              data[chatId];

            if(
              !chat ||
              typeof chat !== "object"
            ){

              return;

            }


            Object.keys(chat)
              .forEach(
                messageId => {

                  const message =
                    chat[messageId];

                  if(
                    !message ||
                    typeof message !==
                    "object"
                  ){

                    return;

                  }


                  const senderId =
                    String(
                      message.senderId ||
                      ""
                    );

                  const receiverId =
                    String(
                      message.receiverId ||
                      ""
                    );


                  const myId =
                    String(
                      currentUser.userId
                    );


                  const isMine =
                    senderId === myId;

                  const isForMe =
                    receiverId === myId;


                  if(
                    !isMine &&
                    !isForMe
                  ){

                    return;

                  }


                  const otherId =
                    isMine
                      ? receiverId
                      : senderId;


                  if(!otherId){
                    return;
                  }


                  const old =
                    conversations.get(
                      otherId
                    );


                  const messageTime =
                    Number(
                      message.time || 0
                    );


                  const unread =
                    isForMe &&
                    message.read !== true
                      ? 1
                      : 0;


                  if(
                    !old ||
                    messageTime >
                    Number(
                      old.time || 0
                    )
                  ){

                    conversations.set(
                      otherId,
                      {

                        userId:
                          otherId,

                        name:
                          isMine
                            ? (
                                message.receiverName ||
                                "User"
                              )
                            : (
                                message.senderName ||
                                "User"
                              ),

                        dp:
                          isMine
                            ? (
                                message.receiverDp ||
                                DEFAULT_DP
                              )
                            : (
                                message.senderDp ||
                                DEFAULT_DP
                              ),

                        text:
                          message.text ||
                          "",

                        time:
                          messageTime,

                        unread:
                          unread

                      }
                    );

                  }
                  else if(unread){

                    old.unread =
                      Number(
                        old.unread || 0
                      ) + 1;

                  }

                }
              );

          }
        );

    }


    privateMessages =
      Array.from(
        conversations.values()
      )
      .sort(
        (a,b) =>
          Number(b.time || 0) -
          Number(a.time || 0)
      );


    /*
      Refresh name + DP from
      Firebase users collection.
    */

    await refreshMessageProfiles();


  }catch(error){

    console.error(
      "Private messages:",
      error
    );

    privateMessages = [];

  }

}


/* =========================================
   REFRESH MESSAGE PROFILES
========================================= */

async function refreshMessageProfiles(){

  await Promise.all(

    privateMessages.map(
      async item => {

        try{

          const response =
            await fetch(
              DB +
              "/users/" +
              encodeURIComponent(
                item.userId
              ) +
              ".json"
            );


          if(!response.ok){
            return;
          }


          const user =
            await response.json();


          if(user){

            item.name =
              user.name ||
              item.name ||
              "User";

            item.dp =
              user.dp ||
              item.dp ||
              DEFAULT_DP;

          }

        }catch(error){

          console.error(
            "User profile:",
            error
          );

        }

      }
    )

  );

}


/* =========================================
   LOAD REQUESTS
========================================= */

async function loadRequests(){

  const uid =
    encodeURIComponent(
      currentUser.userId
    );


  try{

    const results =
      await Promise.all([

        fetch(
          DB +
          "/friendRequests/" +
          uid +
          ".json"
        ),

        fetch(
          DB +
          "/cpRequests/" +
          uid +
          ".json"
        ),

        fetch(
          DB +
          "/familyInvites/" +
          uid +
          ".json"
        )

      ]);


    const friends =
      results[0].ok
        ? await results[0].json()
        : null;

    const cp =
      results[1].ok
        ? await results[1].json()
        : null;

    const family =
      results[2].ok
        ? await results[2].json()
        : null;


    friendRequests =
      objectToArray(
        friends
      );

    cpRequests =
      objectToArray(
        cp
      );

    familyInvites =
      objectToArray(
        family
      );


  }catch(error){

    console.error(
      "Inbox requests:",
      error
    );

    friendRequests = [];
    cpRequests = [];
    familyInvites = [];

  }

}


/* =========================================
   BADGE
========================================= */

function setBadge(
  id,
  count
){

  const element =
    document.getElementById(
      id
    );

  if(!element){
    return;
  }


  const n =
    Number(count || 0);


  if(n > 0){

    element.textContent =
      n > 99
        ? "99+"
        : String(n);

    element.classList.add(
      "show"
    );

  }else{

    element.textContent =
      "";

    element.classList.remove(
      "show"
    );

  }

}


/* =========================================
   UPDATE BADGES
========================================= */

function updateBadges(){

  const messages =
    privateMessages.reduce(
      (
        total,
        item
      ) =>
        total +
        Number(
          item.unread || 0
        ),
      0
    );


  const friends =
    friendRequests.length;

  const cp =
    cpRequests.length;

  const family =
    familyInvites.length;


  setBadge(
    "messagesBadge",
    messages
  );

  setBadge(
    "friendsBadge",
    friends
  );

  setBadge(
    "cpBadge",
    cp
  );

  setBadge(
    "familyBadge",
    family
  );


  setBadge(
    "bottomBadge",
    messages +
    friends +
    cp +
    family
  );

}


/* =========================================
   RENDER
========================================= */

function render(){

  updateBadges();


  if(
    currentTab ===
    "messages"
  ){

    renderMessages();

  }


  else if(
    currentTab ===
    "friends"
  ){

    renderFriends();

  }


  else if(
    currentTab ===
    "cp"
  ){

    renderCP();

  }


  else if(
    currentTab ===
    "family"
  ){

    renderFamily();

  }

}


/* =========================================
   RENDER MESSAGES
========================================= */

function renderMessages(){

  if(
    !privateMessages.length
  ){

    content.innerHTML = `

      <div class="section-title">
        Messages
      </div>

      <div class="empty">

        <div class="empty-icon">
          💬
        </div>

        No private messages yet.

        <br>

        When someone messages you,
        it will appear here.

      </div>

    `;

    return;

  }


  content.innerHTML = `

    <div class="section-title">
      Recent Messages
    </div>

    <div
      id="messageList"
      class="list"
    ></div>

  `;


  const list =
    document.getElementById(
      "messageList"
    );


  privateMessages.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "message";


      const unread =
        Number(
          item.unread || 0
        );


      button.innerHTML = `

        <img
          class="dp"
          src="${esc(
            item.dp ||
            DEFAULT_DP
          )}"
          alt="User"
          onerror="this.src='${DEFAULT_DP}'"
        >

        <div class="info">

          <div class="name-line">

            <div class="name">
              ${esc(
                item.name ||
                "User"
              )}
            </div>

          </div>

          <div class="last-message">
            ${esc(
              item.text ||
              "Message"
            )}
          </div>

          <div class="time">
            ${esc(
              timeAgo(
                item.time
              )
            )}
          </div>

        </div>

        <div class="right">

          ${
            unread > 0
              ? `
                <div class="unread">
                  ${
                    unread > 99
                      ? "99+"
                      : unread
                  }
                </div>
              `
              : ""
          }

          <div class="arrow">
            ›
          </div>

        </div>

      `;


      button.addEventListener(
        "click",
        () => {

          location.href =
            "chat.html?user=" +
            encodeURIComponent(
              item.userId
            );

        }
      );


      list.appendChild(
        button
      );

    }
  );

}


/* =========================================
   REQUEST HELPERS
========================================= */

function requestName(item){

  return (
    item.name ||
    item.senderName ||
    item.userName ||
    item.fromName ||
    "User"
  );

}


function requestUserId(item){

  return (
    item.userId ||
    item.senderId ||
    item.fromUserId ||
    item.uid ||
    ""
  );

}


function requestDp(item){

  return (
    item.dp ||
    item.senderDp ||
    item.userDp ||
    item.fromDp ||
    DEFAULT_DP
  );

}


/* =========================================
   RENDER FRIENDS
========================================= */

function renderFriends(){

  if(
    !friendRequests.length
  ){

    content.innerHTML = `

      <div class="section-title">
        Friend Requests
      </div>

      <div class="empty">

        <div class="empty-icon">
          👥
        </div>

        No friend requests.

      </div>

    `;

    return;

  }


  content.innerHTML = `

    <div class="section-title">
      Friend Requests
    </div>

    <div
      id="friendList"
      class="list"
    ></div>

  `;


  const list =
    document.getElementById(
      "friendList"
    );


  friendRequests.forEach(
    item => {

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "request";


      box.innerHTML = `

        <div class="request-top">

          <img
            class="request-dp"
            src="${esc(
              requestDp(item)
            )}"
            alt="User"
            onerror="this.src='${DEFAULT_DP}'"
          >

          <div class="request-info">

            <div class="request-name">
              ${esc(
                requestName(item)
              )}
            </div>

            <div class="request-id">
              ID:
              ${esc(
                requestUserId(item)
              )}
            </div>

            <div class="request-text">
              Wants to add you as a friend
            </div>

          </div>

        </div>

        <div class="request-buttons">

          <button
            class="accept"
            type="button"
            data-accept

/* =========================================
   ACCEPT CP
========================================= */

async function acceptCP(
  item
){

  const otherId =
    requestUserId(item);


  if(!otherId){

    alert(
      "User ID missing."
    );

    return;

  }


  try{

    const ids = [

      currentUser.userId,

      otherId

    ]
    .sort();


    const cpId =
      ids.join("__");


    const cpData = {

      cpId:

        cpId,

      user1:
        ids[0],

      user2:
        ids[1],

      user1Name:
        ids[0] ===
        currentUser.userId
          ? currentUser.name
          : requestName(item),

      user2Name:
        ids[1] ===
        currentUser.userId
          ? currentUser.name
          : requestName(item),

      user1Dp:
        ids[0] ===
        currentUser.userId
          ? currentUser.dp
          : requestDp(item),

      user2Dp:
        ids[1] ===
        currentUser.userId
          ? currentUser.dp
          : requestDp(item),

      score:
        0,

      createdAt:
        Date.now()

    };


    await fetch(
      DB +
      "/cp/" +
      encodeURIComponent(
        cpId
      ) +
      ".json",
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            cpData
          )
      }
    );


    /*
      Also create a ranking entry.
      Score starts at 0 and can later
      increase through gifts/activity.
    */

    await fetch(
      DB +
      "/cpRanking/" +
      encodeURIComponent(
        cpId
      ) +
      ".json",
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            cpId:
              cpId,

            user1:
              ids[0],

            user2:
              ids[1],

            user1Name:
              cpData.user1Name,

            user2Name:
              cpData.user2Name,

            user1Dp:
              cpData.user1Dp,

            user2Dp:
              cpData.user2Dp,

            score:
              0,

            updatedAt:
              Date.now()

          })
      }
    );


    await deleteRequest(
      "cpRequests",
      item.requestId
    );


    await loadAll();

  }catch(error){

    console.error(
      "CP accept:",
      error
    );

    alert(
      "CP request accept nahi hua."
    );

  }

}

/* =========================================
   DELETE REQUEST
========================================= */

async function deleteRequest(
  collection,
  requestId
){

  if(!requestId){
    return;
  }


  const url =
    DB +
    "/" +
    collection +
    "/" +
    encodeURIComponent(
      currentUser.userId
    ) +
    "/" +
    encodeURIComponent(
      requestId
    ) +
    ".json";


  const response =
    await fetch(
      url,
      {
        method:"DELETE"
      }
    );


  if(!response.ok){

    throw new Error(
      "Delete failed: " +
      response.status
    );

  }

}
