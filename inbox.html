<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PawanVoice Inbox</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:#090b12;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:76px;
}

.app{
  width:100%;
  max-width:760px;
  margin:auto;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:10;
  background:#0e1119;
  border-bottom:1px solid #252b38;
  padding:15px;
}

.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#1a1f2b;
  color:#fff;
  font-size:25px;
}

.title{
  flex:1;
  font-size:20px;
  font-weight:800;
}

.my-dp{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

/* TABS */

.tabs{
  display:flex;
  gap:7px;
  padding:12px;
  overflow-x:auto;
  background:#0b0e16;
}

.tab{
  position:relative;
  flex:0 0 auto;
  border:1px solid #2b3140;
  background:#151925;
  color:#aeb5c5;
  border-radius:20px;
  padding:9px 15px;
  font-size:12px;
}

.tab.active{
  background:#ffca28;
  color:#171717;
  border-color:#ffca28;
  font-weight:800;
}

.tab-badge{
  position:absolute;
  right:-3px;
  top:-6px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:10px;
  background:#ff3b55;
  color:#fff;
  font-size:9px;
  display:none;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.tab-badge.show{
  display:flex;
}

/* CONTENT */

.content{
  padding:12px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  color:#9da5b7;
  margin:5px 3px 10px;
}

/* ITEM */

.list{
  display:grid;
  gap:8px;
}

.item{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px;
  background:#11141e;
  border:1px solid #252b38;
  border-radius:15px;
  text-align:left;
  color:#fff;
}

.item:active{
  background:#171b25;
}

.item-dp{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
}

.item-info{
  min-width:0;
  flex:1;
}

.item-name-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.item-name{
  min-width:0;
  flex:1;
  font-size:14px;
  font-weight:800;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.item-message{
  margin-top:5px;
  color:#8d96a8;
  font-size:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.item-time{
  color:#656e80;
  font-size:9px;
  margin-top:5px;
}

.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
  flex-shrink:0;
}

.unread{
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:12px;
  background:#ff3b55;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:800;
}

.arrow{
  color:#687285;
  font-size:18px;
}

/* REQUEST ITEM */

.request{
  background:#11141e;
  border:1px solid #252b38;
  border-radius:15px;
  padding:12px;
}

.request-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.request-dp{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
}

.request-info{
  flex:1;
  min-width:0;
}

.request-name{
  font-weight:800;
  font-size:14px;
}

.request-text{
  color:#7f899c;
  font-size:11px;
  margin-top:4px;
}

.request-buttons{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.accept,
.reject{
  flex:1;
  min-height:40px;
  border:0;
  border-radius:10px;
  font-weight:800;
}

.accept{
  background:#ffca28;
  color:#171717;
}

.reject{
  background:#242936;
  color:#d5d9e1;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:42px 20px;
  color:#737d90;
  background:#11141e;
  border:1px dashed #303646;
  border-radius:16px;
  line-height:1.6;
}

.empty-icon{
  font-size:34px;
  margin-bottom:8px;
}

/* LOADING */

.loading{
  text-align:center;
  color:#737d90;
  padding:35px;
  font-size:12px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:#0e1119;
  border-top:1px solid #272d3a;
  z-index:20;
}

.bottom-inner{
  max-width:760px;
  margin:auto;
  height:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
}

.nav{
  border:0;
  background:transparent;
  color:#838c9f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.nav.active{
  color:#ffca28;
}

.nav-icon{
  font-size:21px;
}

.nav-label{
  font-size:10px;
}

.nav-wrap{
  position:relative;
}

.nav-badge{
  position:absolute;
  top:3px;
  right:calc(50% - 25px);
  min-width:17px;
  height:17px;
  border-radius:10px;
  background:#ff3b55;
  color:#fff;
  font-size:9px;
  display:none;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.nav-badge.show{
  display:flex;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="header-row">

      <button
        class="back"
        type="button"
        onclick="goBack()"
      >
        ‹
      </button>

      <div class="title">
        📩 Inbox
      </div>

      <img
        id="myDp"
        class="my-dp"
        src="https://i.pravatar.cc/200?img=12"
        alt="My profile"
      >

    </div>

  </header>


  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      data-tab="messages"
      type="button"
    >
      Messages
      <span
        id="messagesBadge"
        class="tab-badge"
      ></span>
    </button>

    <button
      class="tab"
      data-tab="friends"
      type="button"
    >
      Friends
      <span
        id="friendsBadge"
        class="tab-badge"
      ></span>
    </button>

    <button
      class="tab"
      data-tab="cp"
      type="button"
    >
      CP
      <span
        id="cpBadge"
        class="tab-badge"
      ></span>
    </button>

    <button
      class="tab"
      data-tab="family"
      type="button"
    >
      Family
      <span
        id="familyBadge"
        class="tab-badge"
      ></span>
    </button>

  </div>


  <!-- CONTENT -->

  <main
    id="content"
    class="content"
  >

    <div class="loading">
      Loading Inbox...
    </div>

  </main>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <div class="bottom-inner">

    <button
      class="nav"
      type="button"
      onclick="location.href='index.html'"
    >
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </button>


    <button
      class="nav active"
      type="button"
      onclick="location.href='inbox.html'"
    >
      <div class="nav-wrap">

        <span class="nav-icon">📩</span>

        <span
          id="bottomBadge"
          class="nav-badge"
        ></span>

      </div>

      <span class="nav-label">Inbox</span>
    </button>


    <button
      class="nav"
      type="button"
      onclick="location.href='profile.html'"
    >
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </button>

  </div>

</nav>


<script>

/* =========================================
   PAWANVOICE INBOX
========================================= */

const DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const DEFAULT_DP =
  "https://i.pravatar.cc/200?img=12";


/* =========================================
   CURRENT USER
========================================= */

const currentUser = {

  userId:
    localStorage.getItem("pv_userId") ||
    "pawan",

  name:
    localStorage.getItem("pv_name") ||
    "Pawan User",

  dp:
    localStorage.getItem("pv_dp") ||
    DEFAULT_DP

};


/* =========================================
   STATE
========================================= */

let currentTab =
  "messages";

let privateMessages = [];

let friendRequests = [];

let cpRequests = [];

let familyInvites = [];


/* =========================================
   ELEMENTS
========================================= */

const content =
  document.getElementById(
    "content"
  );

const myDp =
  document.getElementById(
    "myDp"
  );


myDp.src =
  currentUser.dp ||
  DEFAULT_DP;

myDp.onerror =
  function(){

    this.src =
      DEFAULT_DP;

  };


/* =========================================
   ESCAPE
========================================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================================
   TIME
========================================= */

function timeAgo(timestamp){

  const time =
    Number(timestamp || 0);

  if(!time){
    return "";
  }

  const diff =
    Date.now() -
    time;

  const minute =
    60 * 1000;

  const hour =
    60 * minute;

  const day =
    24 * hour;

  if(diff < minute){

    return "now";

  }

  if(diff < hour){

    return (
      Math.floor(
        diff / minute
      ) +
      "m"
    );

  }

  if(diff < day){

    return (
      Math.floor(
        diff / hour
      ) +
      "h"
    );

  }

  if(diff < 7 * day){

    return (
      Math.floor(
        diff / day
      ) +
      "d"
    );

  }

  return new Date(
    time
  ).toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short"
    }
  );

}


/* =========================================
   LOAD PRIVATE MESSAGES
========================================= */

async function loadPrivateMessages(){

  try{

    const response =
      await fetch(
        DB +
        "/privateChats.json"
      );

    if(!response.ok){

      throw new Error(
        "Firebase HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    const map =
      new Map();

    if(data){

      Object.keys(data)
        .forEach(
          chatId => {

            const chat =
              data[chatId];

            if(
              !chat ||
              typeof chat !== "object"
            ){

              return;

            }

            Object.keys(chat)
              .forEach(
                messageId => {

                  const message =
                    chat[messageId];

                  if(
                    !message ||
                    typeof message !==
                    "object"
                  ){

                    return;

                  }

                  const isMine =
                    message.senderId ===
                    currentUser.userId;

                  const isForMe =
                    message.receiverId ===
                    currentUser.userId;

                  if(
                    !isMine &&
                    !isForMe
                  ){

                    return;

                  }

                  const otherId =
                    isMine
                      ? message.receiverId
                      : message.senderId;

                  if(!otherId){
                    return;
                  }

                  const existing =
                    map.get(otherId);

                  /*
                    Count only messages
                    received by me and
                    not marked read.
                  */

                  const unread =
                    isForMe &&
                    message.read !== true
                      ? 1
                      : 0;

                  if(
                    !existing ||
                    Number(
                      message.time || 0
                    ) >
                    Number(
                      existing.time || 0
                    )
                  ){

                    map.set(
                      otherId,
                      {
                        userId:
                          otherId,

                        name:
                          isMine
                            ? (
                                message.receiverName ||
                                "User"
                              )
                            : (
                                message.senderName ||
                                "User"
                              ),

                        dp:
                          isMine
                            ? (
                                message.receiverDp ||
                                DEFAULT_DP
                              )
                            : (
                                message.senderDp ||
                                DEFAULT_DP
                              ),

                        text:
                          message.text ||
                          "",

                        time:
                          Number(
                            message.time || 0
                          ),

                        unread:
                          unread

                      }
                    );

                  }else if(unread){

                    existing.unread =
                      Number(
                        existing.unread || 0
                      ) + 1;

                  }

                }
              );

          }
        );

    }

    /*
      Firebase messages don't always
      contain receiverName/receiverDp.
      We will fetch target profiles below.
    */

    privateMessages =
      Array.from(
        map.values()
      )
      .sort(
        (a,b) =>
          Number(b.time || 0) -
          Number(a.time || 0)
      );

    /*
      Load actual user profiles so
      DP/name are always current.
    */

    await updateMessageProfiles();

  }catch(error){

    console.error(
      "Private messages:",
      error
    );

    privateMessages = [];

  }

}


/* =========================================
   UPDATE MESSAGE PROFILES
========================================= */

async function updateMessageProfiles(){

  await Promise.all(

    privateMessages.map(
      async item => {

        try{

          const response =
            await fetch(
              DB +
              "/users/" +
              encodeURIComponent(
                item.userId
              ) +
              ".json"
            );

          if(!response.ok){
            return;
          }

          const user =
            await response.json();

          if(user){

            item.name =
              user.name ||
              item.name ||
              "User";

            item.dp =
              user.dp ||
              item.dp ||
              DEFAULT_DP;

          }

        }catch(error){

          console.error(
            "Profile load:",
            error
          );

        }

      }
    )

  );

}


/* =========================================
   LOAD REQUESTS
========================================= */

async function loadRequests(){

  const base =
    currentUser.userId;

  try{

    const [
      friendsResponse,
      cpResponse,
      familyResponse
    ] =
      await Promise.all([

        fetch(
          DB +
          "/friendRequests/" +
          encodeURIComponent(
            base
          ) +
          ".json"
        ),

        fetch(
          DB +
          "/cpRequests/" +
          encodeURIComponent(
            base
          ) +
          ".json"
        ),

        fetch(
          DB +
          "/familyInvites/" +
          encodeURIComponent(
            base
          ) +
          ".json"
        )

      ]);


    const friendsData =
      friendsResponse.ok
        ? await friendsResponse.json()
        : null;

    const cpData =
      cpResponse.ok
        ? await cpResponse.json()
        : null;

    const familyData =
      familyResponse.ok
        ? await familyResponse.json()
        : null;


    friendRequests =
      objectToArray(
        friendsData
      );

    cpRequests =
      objectToArray(
        cpData
      );

    familyInvites =
      objectToArray(
        familyData
      );


  }catch(error){

    console.error(
      "Requests:",
      error
    );

    friendRequests = [];
    cpRequests = [];
    familyInvites = [];

  }

}


/* =========================================
   OBJECT TO ARRAY
========================================= */

function objectToArray(data){

  if(!data){
    return [];
  }

  if(
    typeof data !==
    "object"
  ){

    return [];

  }

  return Object.keys(data)
    .map(
      key => {

        const value =
          data[key];

        if(
          value &&
          typeof value ===
          "object"
        ){

          return {
            requestId:key,
            ...value
          };

        }

        return {
          requestId:key,
          value
        };

      }
    );

}


/* =========================================
   UNREAD TOTAL
========================================= */

function unreadMessages(){

  return privateMessages
    .reduce(
      (
        total,
        item
      ) =>
        total +
        Number(
          item.unread || 0
        ),
      0
    );

}


/* =========================================
   BADGE
========================================= */

function setBadge(
  element,
  number
){

  if(!element){
    return;
  }

  const n =
    Number(number || 0);

  if(n > 0){

    element.textContent =
      n > 99
        ? "99+"
        : String(n);

    element.classList.add(
      "show"
    );

  }else{

    element.textContent =
      "";

    element.classList.remove(
      "show"
    );

  }

}


/* =========================================
   UPDATE ALL BADGES
========================================= */

function updateBadges(){

  const messageCount =
    unreadMessages();

  const friendCount =
    friendRequests.length;

  const cpCount =
    cpRequests.length;

  const familyCount =
    familyInvites.length;

  setBadge(
    document.getElementById(
      "messagesBadge"
    ),
    messageCount
  );

  setBadge(
    document.getElementById(
      "friendsBadge"
    ),
    friendCount
  );

  setBadge(
    document.getElementById(
      "cpBadge"
    ),
    cpCount
  );

  setBadge(
    document.getElementById(
      "familyBadge"
    ),
    familyCount
  );

  setBadge(
    document.getElementById(
      "bottomBadge"
    ),
    messageCount +
    friendCount +
    cpCount +
    familyCount
  );

}


/* =========================================
   RENDER
========================================= */

function render(){

  updateBadges();

  if(
    currentTab ===
    "messages"
  ){

    renderMessages();

  }

  else if(
    currentTab ===
    "friends"
  ){

    renderFriends();

  }

  else if(
    currentTab ===
    "cp"
  ){

    renderCP();

  }

  else if(
    currentTab ===
    "family"
  ){

    renderFamily();

  }

}


/* =========================================
   RENDER MESSAGES
========================================= */

function renderMessages(){

  if(
    !privateMessages.length
  ){

    content.innerHTML = `

      <div class="section-title">
        Messages
      </div>

      <div class="empty">

        <div class="empty-icon">
          💬
        </div>

        No private messages yet.

        <br>

        When someone sends you a message,
        it will appear here.

      </div>

    `;

    return;

  }


  content.innerHTML = `

    <div class="section-title">
      Recent Messages
    </div>

    <div
      id="messageList"
      class="list"
    ></div>

  `;


  const list =
    document.getElementById(
      "messageList"
    );


  privateMessages.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "item";


      button.innerHTML = `

        <img
          class="item-dp"
          src="${esc(
            item.dp ||
            DEFAULT_DP
          )}"
          alt="User"
        >

        <div class="item-info">

          <div class="item-name-row">

            <div class="item-name">
              ${esc(
                item.name ||
                "User"
              )}
            </div>

          </div>

          <div class="item-message">
            ${esc(
              item.text ||
              "Message"
            )}
          </div>

          <div class="item-time">
            ${esc(
              timeAgo(
                item.time
              )
            )}
          </div>

        </div>

        <div class="right">

          ${
            Number(
              item.unread || 0
            ) > 0

              ? `
                <div class="unread">
                  ${
                    Number(
                      item.unread
                    ) > 99
                      ? "99+"
                      : Number(
                          item.unread
                        )
                  }
                </div>
              `

              : ""
          }

          <div class="arrow">
            ›
          </div>

        </div>

      `;


      button.addEventListener(
        "click",
        () => {

          location.href =
            "chat.html?user=" +
            encodeURIComponent(
              item.userId
            );

        }
      );


      list.appendChild(
        button
      );

    }
  );

}


/* =========================================
   REQUEST DP
========================================= */

function requestDp(item){

  return (
    item.dp ||
    item.senderDp ||
    item.userDp ||
    item.fromDp ||
    DEFAULT_DP
  );

}


function requestName(item){

  return (
    item.name ||
    item.senderName ||
    item.userName ||
    item.fromName ||
    "User"
  );

}


function requestUserId(item){

  return (
    item.userId ||
    item.senderId ||
    item.fromUserId ||
    item.uid ||
    ""
  );

}


/* =========================================
   RENDER FRIENDS
========================================= */

function renderFriends(){

  if(
    !friendRequests.length
  ){

    content.innerHTML = `

      <div class="section-title">
        Friend Requests
      </div>

      <div class="empty">

        <div class="empty-icon">
          👥
        </div>

        No friend requests.

      </div>

    `;

    return;

  }


  content.innerHTML = `

    <div class="section-title">
      Friend Requests
    </div>

    <div
      id="friendList"
      class="list"
    ></div>

  `;


  const list =
    document.getElementById(
      "friendList"
    );


  friendRequests.forEach(
    item => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "request";


      wrapper.innerHTML = `

        <div class="request-top">

          <img
            class="request-dp"
            src="${esc(
              requestDp(item)
            )}"
            alt="User"
          >

          <div class="request-info">

            <div class="request-name">
              ${esc(
                requestName(item)
              )}
            </div>

            <div class="request-text">
              wants to add you as a friend
            </div>

/* =========================================
   DELETE REQUEST
========================================= */

async function deleteRequest(
  collection,
  requestId
){

  if(!requestId){
    return;
  }

  await fetch(
    DB +
    "/" +
    collection +
    "/" +
    encodeURIComponent(
      currentUser.userId
    ) +
    "/" +
    encodeURIComponent(
      requestId
    ) +
    ".json",
    {
      method:"DELETE"
    }
  );

}


/* =========================================
   REJECT REQUEST
========================================= */

async function rejectRequest(
  collection,
  requestId
){

  try{

    await deleteRequest(
      collection,
      requestId
    );

    await loadAll();

  }catch(error){

    console.error(
      "Reject:",
      error
    );

  }

}

document.querySelectorAll(

).forEach(

          ".tab"
        ).forEach(
          t =>
            t.classList.remove(
              "active"
            )
        );

        tab.classList.add(
          "active"
        );

        currentTab =
          tab.dataset.tab ||
          "messages";

        render();

      }
    );

  }
);
