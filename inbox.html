<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PawanVoice Inbox</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #090b12;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #0d1018;
      padding-bottom: 78px;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #111522;
      border-bottom: 1px solid #222735;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .my-dp {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff4f9a;
      background: #222;
    }

    .header-name {
      font-size: 15px;
      font-weight: 700;
    }

    .header-id {
      color: #8f98aa;
      font-size: 11px;
      margin-top: 2px;
    }

    .home-btn {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #1c2130;
      color: white;
      font-size: 20px;
    }

    /* TITLE */
    .page-title {
      padding: 17px 15px 10px;
      font-size: 24px;
      font-weight: 800;
    }

    /* TABS */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      padding: 5px 12px 13px;
    }

    .tab {
      min-height: 42px;
      border-radius: 13px;
      background: #171b27;
      color: #9da5b7;
      font-size: 12px;
      font-weight: 700;
    }

    .tab.active {
      background: #ff3f8e;
      color: #fff;
    }

    /* CONTENT */
    .content {
      padding: 0 12px;
    }

    .section-title {
      margin: 9px 3px 10px;
      font-size: 14px;
      font-weight: 800;
      color: #dce1ed;
    }

    .empty {
      text-align: center;
      padding: 55px 20px;
      color: #7e8799;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .empty-title {
      color: #cfd5e2;
      font-size: 16px;
      font-weight: 700;
    }

    .empty-text {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.5;
    }

    /* MESSAGE CARD */
    .message-card,
    .request-card,
    .cp-card,
    .family-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      margin-bottom: 9px;
      border-radius: 17px;
      background: #151925;
      border: 1px solid #202636;
    }

    .user-dp {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      margin-top: 4px;
      color: #858ea1;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-time {
      margin-top: 4px;
      color: #646d7f;
      font-size: 10px;
    }

    .unread {
      min-width: 21px;
      height: 21px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #ff3f8e;
      color: white;
      font-size: 10px;
      font-weight: 800;
    }

    /* BUTTONS */
    .small-btn {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .btn-pink {
      background: #ff3f8e;
      color: white;
    }

    .btn-dark {
      background: #242a39;
      color: #dbe0ea;
    }

    .btn-red {
      background: #4a202d;
      color: #ff9ab9;
    }

    .request-actions {
      display: flex;
      gap: 6px;
      margin-top: 9px;
    }

    /* CP */
    .cp-active {
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 20px;
      background: linear-gradient(145deg, #281528, #171a28);
      border: 1px solid #59304e;
    }

    .cp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .cp-title {
      font-size: 16px;
      font-weight: 800;
    }

    .cp-status {
      padding: 5px 9px;
      border-radius: 20px;
      background: #3d1c35;
      color: #ff78ae;
      font-size: 10px;
      font-weight: 800;
    }

    .couple {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .couple-person {
      text-align: center;
      width: 100px;
    }

    .couple-dp {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ff4f9a;
      background: #222;
    }

    .couple-name {
      margin-top: 7px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .heart {
      font-size: 28px;
      animation: heartBeat 1.2s infinite;
    }

    @keyframes heartBeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }

    .cp-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 15px;
    }

    .cp-stat {
      padding: 10px 5px;
      border-radius: 12px;
      background: #11141e;
      text-align: center;
    }

    .cp-stat-value {
      font-size: 14px;
      font-weight: 800;
    }

    .cp-stat-label {
      margin-top: 3px;
      color: #777f91;
      font-size: 9px;
    }

    /* FAMILY */
    .family-icon {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #252033;
      font-size: 25px;
      flex-shrink: 0;
    }

    /* TOAST */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%) translateY(20px);
      z-index: 100;
      max-width: 90%;
      padding: 12px 17px;
      border-radius: 13px;
      background: #242936;
      color: white;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 35px;
      color: #8992a5;
      font-size: 13px;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      height: 68px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #111521;
      border-top: 1px solid #252b3a;
      z-index: 50;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #7d8699;
      font-size: 10px;
      font-weight: 700;
      background: transparent;
    }

    .nav-item.active {
      color: #ff4f9a;
    }

    .nav-icon {
      font-size: 20px;
    }

    /* RESPONSIVE */
    @media (max-width: 360px) {
      .tabs {
        gap: 4px;
        padding-left: 7px;
        padding-right: 7px;
      }

      .tab {
        font-size: 10px;
      }

      .message-card,
      .request-card,
      .cp-card,
      .family-card {
        padding: 10px;
      }

      .small-btn {
        padding: 0 9px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">

    <div class="header-left">
      <img id="myDp" class="my-dp" src="" alt="My profile">

      <div>
        <div id="myName" class="header-name">PawanVoice User</div>
        <div id="myId" class="header-id">ID: --</div>
      </div>
    </div>

    <button class="home-btn" id="homeBtn">⌂</button>

  </div>

  <div class="page-title">Inbox</div>

  <!-- TABS -->
  <div class="tabs">

    <button class="tab active" data-tab="messages">
      Messages
    </button>

    <button class="tab" data-tab="friends">
      Friends
    </button>

    <button class="tab" data-tab="cp">
      💕 CP
    </button>

    <button class="tab" data-tab="family">
      Family
    </button>

  </div>

  <div id="content" class="content">
    <div class="loading">Loading inbox...</div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

  <button class="nav-item" id="navHome">
    <div class="nav-icon">⌂</div>
    <div>Home</div>
  </button>

  <button class="nav-item active">
    <div class="nav-icon">💬</div>
    <div>Inbox</div>
  </button>

  <button class="nav-item" id="navProfile">
    <div class="nav-icon">👤</div>
    <div>Profile</div>
  </button>

</div>

<div id="toast" class="toast"></div>

<script src="user.js"></script>

<script>
/* =========================================================
   PAWANVOICE INBOX
   Messages + Friends + CP + Family
   Firebase Realtime Database REST
========================================================= */

const DB_URL =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const DEFAULT_DP =
  "https://i.pravatar.cc/200?img=12";

let currentUser = null;
let activeTab = "messages";

let messagesData = [];
let friendRequestsData = {};
let cpRequestsData = {};
let familyInvitesData = {};
let usersData = {};
let activeCpData = null;

let refreshTimer = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function safeNumber(value, fallback = 0) {

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function showToast(message) {

  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2300);
}


function timeAgo(timestamp) {

  const time = safeNumber(timestamp, Date.now());

  const diff = Math.max(0, Date.now() - time);

  const seconds = Math.floor(diff / 1000);

  if (seconds < 60) {
    return seconds + "s ago";
  }

  const minutes = Math.floor(seconds / 60);

  if (minutes < 60) {
    return minutes + "m ago";
  }

  const hours = Math.floor(minutes / 60);

  if (hours < 24) {
    return hours + "h ago";
  }

  const days = Math.floor(hours / 24);

  return days + "d ago";
}


function sortedPair(a, b) {

  return [String(a), String(b)].sort();
}


function cpIdFor(a, b) {

  return sortedPair(a, b).join("__");
}


async function firebaseGet(path) {

  const response = await fetch(
    DB_URL + path + ".json"
  );

  if (!response.ok) {
    throw new Error("Firebase GET failed");
  }

  return await response.json();
}


async function firebasePut(path, data) {

  const response = await fetch(
    DB_URL + path + ".json",
    {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    }
  );

  if (!response.ok) {
    throw new Error("Firebase PUT failed");
  }

  return await response.json();
}


async function firebasePatch(path, data) {

  const response = await fetch(
    DB_URL + path + ".json",
    {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    }
  );

  if (!response.ok) {
    throw new Error("Firebase PATCH failed");
  }

  return await response.json();
}


async function firebaseDelete(path) {

  const response = await fetch(
    DB_URL + path + ".json",
    {
      method: "DELETE"
    }
  );

  if (!response.ok) {
    throw new Error("Firebase DELETE failed");
  }

  return await response.json();
}


/* =========================================================
   CURRENT USER
========================================================= */

async function loadCurrentUser() {

  try {

    if (typeof pvLoadUser === "function") {

      const user = await pvLoadUser();

      if (user) {
        currentUser = user;
      }
    }

  } catch (error) {

    console.warn("pvLoadUser failed", error);
  }


  if (!currentUser) {

    try {

      currentUser =
        JSON.parse(
          localStorage.getItem("pawanvoice_user") || "null"
        );

    } catch (error) {

      currentUser = null;
    }
  }


  if (!currentUser) {

    const userId =
      "PV" +
      Math.floor(
        10000000 +
        Math.random() * 89999999
      );

    currentUser = {

      userId,

      name: "PawanVoice User",

      dp: DEFAULT_DP,

      level: 1,

      exp: 0,

      coins: 0,

      diamonds: 0,

      following: 0,

      followers: 0,

      vipLevel: 0

    };

    localStorage.setItem(
      "pawanvoice_user",
      JSON.stringify(currentUser)
    );
  }


  currentUser.userId =
    String(
      currentUser.userId ||
      currentUser.id ||
      ""
    );

  currentUser.name =
    currentUser.name ||
    "PawanVoice User";

  currentUser.dp =
    currentUser.dp ||
    DEFAULT_DP;


  document.getElementById("myDp").src =
    currentUser.dp;

  document.getElementById("myName").textContent =
    currentUser.name;

  document.getElementById("myId").textContent =
    "ID: " + currentUser.userId;
}


/* =========================================================
   LOAD ALL DATA
========================================================= */

async function loadInboxData() {

  if (!currentUser) {
    return;
  }

  const uid = currentUser.userId;

  try {

    const [
      users,
      privateChats,
      friendRequests,
      cpRequests,
      familyInvites,
      cps
    ] = await Promise.all([

      firebaseGet("/users"),

      firebaseGet("/privateChats"),

      firebaseGet(
        "/friendRequests/" +
        encodeURIComponent(uid)
      ),

      firebaseGet(
        "/cpRequests/" +
        encodeURIComponent(uid)
      ),

      firebaseGet(
        "/familyInvites/" +
        encodeURIComponent(uid)
      ),

      firebaseGet("/cp")

    ]);


    usersData =
      users || {};

    friendRequestsData =
      friendRequests || {};

    cpRequestsData =
      cpRequests || {};

    familyInvitesData =
      familyInvites || {};


    messagesData =
      buildMessageList(privateChats || {});


    activeCpData =
      findMyActiveCp(cps || {});


    renderCurrentTab();

  } catch (error) {

    console.error(error);

    document.getElementById("content").innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">
          Could not load Inbox
        </div>
        <div class="empty-text">
          Check Firebase connection and try again.
        </div>
      </div>
    `;
  }
}


/* =========================================================
   MESSAGE LIST
========================================================= */

function buildMessageList(privateChats) {

  const result = {};

  Object.keys(privateChats || {}).forEach(chatId => {

    const chat =
      privateChats[chatId];

    if (!chat || typeof chat !== "object") {
      return;
    }


    const messages =
      Object.values(chat);

    if (!messages.length) {
      return;
    }


    const latest =
      messages
        .sort(
          (a, b) =>
            safeNumber(a.time || a.createdAt) -
            safeNumber(b.time || b.createdAt)
        )
        .at(-1);


    if (!latest) {
      return;
    }


    const senderId =
      String(
        latest.senderId ||
        latest.sender ||
        ""
      );

    const receiverId =
      String(
        latest.receiverId ||
        latest.receiver ||
        ""
      );


    let otherId = "";

    if (senderId === currentUser.userId) {
      otherId = receiverId;
    } else {
      otherId = senderId;
    }


    if (!otherId) {
      return;
    }


    const unread =
      messages.filter(message => {

        const messageSender =
          String(
            message.senderId ||
            message.sender ||
            ""
          );

        const read =
          message.read === true;

        return (
          messageSender !== currentUser.userId &&
          !read
        );

      }).length;


    const otherUser =
      usersData[otherId] || {};


    result[otherId] = {

      userId: otherId,

      name:
        otherUser.name ||
        latest.senderName ||
        "User",

      dp:
        otherUser.dp ||
        latest.senderDp ||
        DEFAULT_DP,

      text:
        latest.text ||
        latest.message ||
        "Message",

      time:
        safeNumber(
          latest.time ||
          latest.createdAt,
          Date.now()
        ),

      unread

    };

  });


  return Object.values(result)
    .sort((a, b) => b.time - a.time);
}


/* =========================================================
   FIND ACTIVE CP
========================================================= */

function findMyActiveCp(allCps) {

  const uid =
    currentUser.userId;

  for (const cpId of Object.keys(allCps || {})) {

    const cp =
      allCps[cpId];

    if (!cp || typeof cp !== "object") {
      continue;
    }


    const user1 =
      String(
        cp.user1Id ||
        cp.uid1 ||
        ""
      );

    const user2 =
      String(
        cp.user2Id ||
        cp.uid2 ||
        ""
      );


    if (
      user1 === uid ||
      user2 === uid
    ) {

      const partnerId =
        user1 === uid
          ? user2
          : user1;


      const partner =
        usersData[partnerId] || {};


      return {

        ...cp,

        cpId,

        partnerId,

        partnerName:
          partner.name ||
          (
            user1 === uid
              ? cp.user2Name
              : cp.user1Name
          ) ||
          "CP",

        partnerDp:
          partner.dp ||
          (
            user1 === uid
              ? cp.user2Dp
              : cp.user1Dp
          ) ||
          DEFAULT_DP

      };
    }
  }


  return null;
}


/* =========================================================
   TAB RENDER
========================================================= */

function renderCurrentTab() {

  if (activeTab === "messages") {
    renderMessages();
  }

  else if (activeTab === "friends") {
    renderFriends();
  }

  else if (activeTab === "cp") {
    renderCP();
  }

  else if (activeTab === "family") {
    renderFamily();
  }
}


/* =========================================================
   MESSAGES
========================================================= */

function renderMessages() {

  const content =
    document.getElementById("content");


  if (!messagesData.length) {

    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">💬</div>
        <div class="empty-title">
          No messages
        </div>
        <div class="empty-text">
          Your private conversations will appear here.
        </div>
      </div>
    `;

    return;
  }


  content.innerHTML =
    `<div class="section-title">Recent Messages</div>` +
    messagesData.map(item => {

      return `
        <div
          class="message-card"
          data-user="${escapeHtml(item.userId)}"
        >

          <img
            class="user-dp"
            src="${escapeHtml(item.dp)}"
            alt=""
          >

          <div class="item-info">

            <div class="item-name">
              ${escapeHtml(item.name)}
            </div>

            <div class="item-sub">
              ${escapeHtml(item.text)}
            </div>

            <div class="item-time">
              ${timeAgo(item.time)}
            </div>

          </div>

          ${
            item.unread > 0
              ? `<div class="unread">
                   ${item.unread > 99 ? "99+" : item.unread}
                 </div>`
              : ""
          }

        </div>
      `;

    }).join("");


  document
    .querySelectorAll(".message-card")
    .forEach(card => {

      card.addEventListener("click", () => {

        const userId =
          card.dataset.user;

        window.location.href =
          "chat.html?user=" +
          encodeURIComponent(userId);

      });

    });
}


/* =========================================================
   FRIENDS
========================================================= */

function renderFriends() {

  const content =
    document.getElementById("content");

  const requests =
    Object.entries(friendRequestsData || {});


  if (!requests.length) {

    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">👥</div>
        <div class="empty-title">
          No friend requests
        </div>
        <div class="empty-text">
          New friend requests will appear here.
        </div>
      </div>
    `;

    return;
  }


  content.innerHTML =
    `<div class="section-title">
       Friend Requests
     </div>` +

    requests.map(([requestId, request]) => {

      const senderId =
        String(
          request.fromUserId ||
          request.senderId ||
          request.userId ||
          ""
        );


      const sender =
        usersData[senderId] ||
        request;


      return `
        <div
          class="request-card"
          data-request="${escapeHtml(requestId)}"
        >

          <img
            class="user-dp"
            src="${escapeHtml(
              sender.dp || DEFAULT_DP
            )}"
            alt=""
          >

          <div class="item-info">

            <div class="item-name">
              ${escapeHtml(
                sender.name || "User"
              )}
            </div>

            <div class="item-sub">
              Wants to add you as a friend
            </div>

            <div class="request-actions">

              <button
                class="small-btn btn-pink accept-friend"
                type="button"
              >
                Accept
              </button>

              <button
                class="small-btn btn-dark reject-friend"

========================================================= */

async function acceptFriend(requestId, request) {

  const senderId =
    String(
      request.fromUserId ||
      request.senderId ||
      request.userId ||
      ""
    );


  if (!senderId) {
    showToast("Invalid friend request");
    return;
  }


  try {

    const myId =
      currentUser.userId;


    const timestamp =
      Date.now();


    await firebasePut(
      "/friends/" +
      encodeURIComponent(myId) +
      "/" +
      encodeURIComponent(senderId),
      {
        userId: senderId,
        since: timestamp
      }
    );


    await firebasePut(
      "/friends/" +
      encodeURIComponent(senderId) +
      "/" +
      encodeURIComponent(myId),
      {
        userId: myId,
        since: timestamp
      }
    );


    await firebaseDelete(
      "/friendRequests/" +
      encodeURIComponent(myId) +
      "/" +
      encodeURIComponent(requestId)
    );


    showToast("Friend request accepted");

    await loadInboxData();

  } catch (error) {

    console.error(error);

    showToast("Could not accept request");
  }
}


async function rejectFriend(requestId) {

/* =========================================================
   CP ACCEPT
========================================================= */

async function acceptCP(requestId, request) {

  if (!request) {

    showToast("Invalid CP request");

    return;
  }


  const myId =
    String(
      currentUser.userId
    );


  const senderId =
    String(
      request.fromUserId ||
      request.senderId ||
      request.userId ||
      ""
    );


  if (!senderId) {

    showToast(
      "CP user information missing"
    );

    return;
  }


  if (senderId === myId) {

    showToast(
      "You cannot make yourself CP"
    );

    return;
  }


  if (activeCpData) {

    showToast(
      "You already have an active CP"
    );

    return;
  }


  try {

    /* Check whether sender already has CP */

    const allCps =
      await firebaseGet("/cp");


    const existing =
      findCpForUser(
        allCps || {},
        senderId
      );


    if (existing) {

      showToast(
        "This user already has a CP"
      );

      return;
    }


    /* Check whether I already have CP */

    const myExisting =
      findCpForUser(
        allCps || {},
        myId
      );


    if (myExisting) {

      showToast(
        "You already have an active CP"
      );

      return;
    }


    const sender =
      usersData[senderId] ||
      request;


    const cpId =
      cpIdFor(
        myId,
        senderId
      );


    const timestamp =
      Date.now();


    const cpData = {

      cpId,

      user1Id:
        sortedPair(
          myId,
          senderId
        )[0],

      user2Id:
        sortedPair(
          myId,
          senderId
        )[1],

      user1Name:
        myId <
        senderId
          ? currentUser.name
          : sender.name || "User",

      user2Name:
        myId <
        senderId
          ? sender.name || "User"
          : currentUser.name,

      user1Dp:
        myId <
        senderId
          ? currentUser.dp
          : sender.dp || DEFAULT_DP,

      user2Dp:
        myId <
        senderId
          ? sender.dp || DEFAULT_DP
          : currentUser.dp,

      points: 0,

      days: 0,

      status: "active",

      createdAt: timestamp,

      acceptedAt: timestamp

    };


    /* Save CP */

    await firebasePut(
      "/cp/" +
      encodeURIComponent(cpId),
      cpData
    );


    /* CP ranking entry */

    await firebasePut(
      "/cpRanking/" +
      encodeURIComponent(cpId),
      {

        cpId,

        user1Id:
          cpData.user1Id,

        user2Id:
          cpData.user2Id,

        user1Name:
          cpData.user1Name,

        user2Name:
          cpData.user2Name,

        user1Dp:
          cpData.user1Dp,

        user2Dp:
          cpData.user2Dp,

        points: 0,

        status: "active",

        createdAt: timestamp

      }
    );


    /* Save CP reference under both users */

    await firebasePatch(
      "/users/" +
      encodeURIComponent(myId),
      {
        cpId,
        cpUserId: senderId
      }
    );


    await firebasePatch(
      "/users/" +
      encodeURIComponent(senderId),
      {
        cpId,
        cpUserId: myId
      }
    );


    /* Delete request */

    await firebaseDelete(
      "/cpRequests/" +
      encodeURIComponent(myId) +
      "/" +
      encodeURIComponent(requestId)
    );


    /* Notification for sender */

    const notificationId =
      "CP_ACCEPT_" +
      Date.now();


    await firebasePut(
      "/notifications/" +
      encodeURIComponent(senderId) +
      "/" +
      notificationId,
      {

        type: "cp_accept",

        title: "CP Accepted",

        text:
          currentUser.name +
          " accepted your CP request ❤️",

        fromUserId: myId,

        fromUserName:
          currentUser.name,

        fromUserDp:
          currentUser.dp,

        createdAt: timestamp,

        read: false

      }
    );


    showToast(
      "💕 CP created successfully!"
    );


    await loadInboxData();

  } catch (error) {

    console.error(
      "CP accept error:",
      error
    );

    showToast(
      "Could not create CP"
    );
  }
}


/* =========================================================
   FIND CP FOR USER
========================================================= */

function findCpForUser(
  allCps,
  userId
) {

  const uid =
    String(userId);


  for (
    const cpId of Object.keys(
      allCps || {}
    )
  ) {

    const cp =
      allCps[cpId];


    if (!cp) {
      continue;
    }


    const user1 =
      String(
        cp.user1Id ||
        cp.uid1 ||
        ""
      );


    const user2 =
      String(
        cp.user2Id ||
        cp.uid2 ||
        ""
      );


    if (
      user1 === uid ||
      user2 === uid
    ) {

      return {
        ...cp,
        cpId
      };
    }
  }


  return null;
}
