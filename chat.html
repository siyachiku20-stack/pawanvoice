<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PawanVoice Chat</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b12;
  color:#fff;
}
.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#101019;
  display:flex;
  flex-direction:column;
}
.header{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 14px;
  background:#171724;
  border-bottom:1px solid #29293a;
  position:sticky;
  top:0;
  z-index:5;
}
.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#252536;
  color:white;
  font-size:22px;
}
.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#29293a;
}
.headInfo{
  min-width:0;
  flex:1;
}
.headName{
  font-weight:bold;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.headId{
  color:#9999aa;
  font-size:12px;
  margin-top:3px;
}
.messages{
  flex:1;
  padding:16px 12px 90px;
  overflow-y:auto;
}
.empty{
  text-align:center;
  color:#88889a;
  padding:60px 20px;
}
.row{
  display:flex;
  margin:9px 0;
  gap:8px;
}
.row.me{
  justify-content:flex-end;
}
.msgAvatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  align-self:flex-end;
}
.bubble{
  max-width:76%;
  padding:10px 12px;
  border-radius:16px;
  background:#242435;
  word-break:break-word;
}
.me .bubble{
  background:#7357ff;
}
.msgText{
  font-size:15px;
  line-height:1.4;
}
.msgTime{
  margin-top:4px;
  font-size:10px;
  color:#aaaabd;
  text-align:right;
}
.me .msgTime{
  color:#ddd8ff;
}
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  padding:9px 10px;
  background:#171724;
  border-top:1px solid #29293a;
  display:flex;
  gap:8px;
  z-index:10;
}
.input{
  flex:1;
  min-width:0;
  border:1px solid #343448;
  outline:none;
  background:#252536;
  color:white;
  border-radius:24px;
  padding:12px 15px;
  font-size:15px;
}
.input:focus{
  border-color:#7357ff;
}
.send{
  width:48px;
  border:0;
  border-radius:50%;
  background:#7357ff;
  color:white;
  font-size:20px;
}
.status{
  text-align:center;
  color:#777789;
  font-size:12px;
  padding:6px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <button class="back" id="backBtn">‹</button>

    <img id="chatDp" class="avatar"
         src="https://i.pravatar.cc/200?img=12">

    <div class="headInfo">
      <div id="chatName" class="headName">Loading...</div>
      <div id="chatId" class="headId"></div>
    </div>
  </div>

  <div id="status" class="status">
    Connecting...
  </div>

  <div id="messages" class="messages">
    <div class="empty">Loading messages...</div>
  </div>

  <form id="sendForm" class="bottom">
    <input
      id="messageInput"
      class="input"
      type="text"
      maxlength="500"
      autocomplete="off"
      placeholder="Type a message..."
    >

    <button class="send" type="submit">➤</button>
  </form>

</div>

<script src="user.js"></script>

<script>
const FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const DEFAULT_DP =
  "https://i.pravatar.cc/200?img=12";

let me = null;
let otherUser = null;
let chatId = "";
let messages = {};

const params = new URLSearchParams(location.search);

const targetUserId =
  (params.get("user") || "").trim();

const messagesBox =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");

const sendForm =
  document.getElementById("sendForm");

const statusEl =
  document.getElementById("status");

const chatName =
  document.getElementById("chatName");

const chatDp =
  document.getElementById("chatDp");

const chatIdEl =
  document.getElementById("chatId");

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeDp(dp){
  return dp || DEFAULT_DP;
}

function makeChatId(a,b){
  return [String(a),String(b)]
    .sort()
    .join("__");
}

function formatTime(timestamp){

  const time = Number(timestamp);

  if(!Number.isFinite(time)){
    return "";
  }

  return new Date(time).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

async function getFirebase(path){

  const response = await fetch(
    FIREBASE_DB +
    path +
    ".json"
  );

  if(!response.ok){
    throw new Error(
      "Firebase error " +
      response.status
    );
  }

  return await response.json();
}

async function patchFirebase(path,data){

  const response = await fetch(
    FIREBASE_DB +
    path +
    ".json",
    {
      method:"PATCH",
      headers:{
        "Content-Type":
          "application/json"
      },
      body:JSON.stringify(data)
    }
  );

  if(!response.ok){
    throw new Error(
      "Firebase save error " +
      response.status
    );
  }

  return await response.json();
}

async function loadOtherUser(){

  if(!targetUserId){
    throw new Error(
      "User ID missing."
    );
  }

  const data =
    await getFirebase(
      "/users/" +
      encodeURIComponent(targetUserId)
    );

  if(data){

    otherUser = {
      userId:
        data.userId ||
        targetUserId,

      name:
        data.name ||
        "User",

      dp:
        data.dp ||
        DEFAULT_DP
    };

  }else{

    otherUser = {
      userId:targetUserId,
      name:"User",
      dp:DEFAULT_DP
    };
  }

  chatName.textContent =
    otherUser.name;

  chatIdEl.textContent =
    "ID: " +
    otherUser.userId;

  chatDp.src =
    safeDp(otherUser.dp);
}

async function markIncomingRead(){

  const data =
    await getFirebase(
      "/privateChats/" +
      encodeURIComponent(chatId)
    );

  if(!data) return;

  const updates = {};

  for(
    const [messageId,message]
    of Object.entries(data)
  ){

    if(
      message &&
      message.receiverId === me.userId &&
      message.read !== true
    ){

      updates[
        messageId + "/read"
      ] = true;
    }
  }

  if(Object.keys(updates).length){

    await patchFirebase(
      "/privateChats/" +
      encodeURIComponent(chatId),
      updates
    );
  }
}

async function loadMessages(){

  const data =
    await getFirebase(
      "/privateChats/" +
      encodeURIComponent(chatId)
    );

  messages =
    data && typeof data === "object"
      ? data
      : {};

  renderMessages();
}

function renderMessages(){

  const list =
    Object.entries(messages)
      .filter(([id,msg]) =>
        msg &&
        typeof msg === "object"
      )
      .sort(
        (a,b) =>
          Number(a[1].time || 0) -
          Number(b[1].time || 0)
      );

  if(!list.length){

    messagesBox.innerHTML =
      '<div class="empty">' +
      'No messages yet.<br>' +
      'Send the first message.' +
      '</div>';

    return;
  }

  messagesBox.innerHTML =
    list.map(
      ([messageId,msg]) => {

        const isMe =
          msg.senderId === me.userId;

        const dp =
          isMe
            ? me.dp
            : (
                msg.senderDp ||
                otherUser.dp ||
                DEFAULT_DP
              );

        return `
          <div class="row ${isMe ? "me" : ""}">

            ${
              isMe
              ? ""
              : `
                <img
                  class="msgAvatar"
                  src="${esc(safeDp(dp))}"
                  alt=""
                >
              `
            }

            <div class="bubble">

              <div class="msgText">
                ${esc(msg.text || "")}
              </div>

              <div class="msgTime">
                ${esc(formatTime(msg.time))}
              </div>

            </div>

            ${
              isMe
              ? `
                <img
                  class="msgAvatar"
                  src="${esc(safeDp(dp))}"
                  alt=""
                >
              `
              : ""
            }

          </div>
        `;
      }
    ).join("");

  setTimeout(() => {

    messagesBox.scrollTop =
      messagesBox.scrollHeight;

  },20);
}

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  if(!me || !otherUser) return;

  input.value = "";

  const messageId =
    "msg_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);

  const message = {

    senderId:
      me.userId,

    receiverId:
      otherUser.userId,

    senderName:
      me.name || "Pawan User",

    senderDp:
      me.dp || DEFAULT_DP,

    receiverName:
      otherUser.name || "User",

    receiverDp:
      otherUser.dp || DEFAULT_DP,

    text,

    time:
      Date.now(),

    read:false
  };

  await patchFirebase(
    "/privateChats/" +
    encodeURIComponent(chatId),
    {
      [messageId]:message
    }
  );

  messages[messageId] =
    message;

  renderMessages();
}

async function refreshChat(){

  try{

    const data =
      await getFirebase(
        "/privateChats/" +
        encodeURIComponent(chatId)
      );

    messages =
      data && typeof data === "object"
        ? data
        : {};

    renderMessages();

    await markIncomingRead();

    statusEl.textContent =
      "Online";

  }catch(error){

    console.error(error);

    statusEl.textContent =
      "Connection problem";
  }
}

sendForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    try{

      await sendMessage();

    }catch(error){

      console.error(error);

      alert(
        "Message send nahi hua. Firebase check karein."
      );
    }
  }
);

document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    function(){

      if(
        document.referrer &&
        document.referrer.includes("inbox.html")
      ){

        history.back();

      }else{

        location.href =
          "inbox.html";
      }
    }
  );

async function start(){

  try{

    if(!targetUserId){

      messagesBox.innerHTML =
        '<div class="empty">' +
        'Chat user ID missing.' +
        '</div>';

      statusEl.textContent =
        "Error";

      return;
    }

    if(
      typeof pvLoadUser !== "function"
    ){

      throw new Error(
        "user.js not loaded."
      );
    }

    me =
      await pvLoadUser();

    if(!me || !me.userId){

      throw new Error(
        "Current user not found."
      );
    }

    if(
      me.userId === targetUserId
    ){

      messagesBox.innerHTML =
        '<div class="empty">' +
        'You cannot chat with yourself.' +
        '</div>';

      statusEl.textContent =
        "Error";

      return;
    }

    chatId =
      makeChatId(
        me.userId,
        targetUserId
      );

    await loadOtherUser();

    await loadMessages();

    await markIncomingRead();

    statusEl.textContent =
      "Online";

    /*
      Firebase REST has no realtime listener
      in this simple version, so refresh every
      3 seconds while chat is open.
    */

    setInterval(
      refreshChat,
      3000
    );

  }catch(error){

    console.error(
      "Chat start error:",
      error
    );

    statusEl.textContent =
      "Connection error";

    messagesBox.innerHTML =
      '<div class="empty">' +
      esc(error.message) +
      '</div>';
  }
}

start();
</script>

</body>
</html>
