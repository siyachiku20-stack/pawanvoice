name: Build PawanVoice Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PawanVoice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Capacitor
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp *.html www/
          cp *.js www/
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.pawanvoice.app',appName:'PawanVoice',webDir:'www',server:{androidScheme:'https'}},null,2))"

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PawanVoice-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
