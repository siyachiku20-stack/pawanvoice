<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>PawanVoice VIP</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080a11;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#10131d;
}

.header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  background:#171a26;
  position:sticky;
  top:0;
  z-index:10;
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#292e3d;
  color:#fff;
  font-size:22px;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.hero{
  margin:14px;
  padding:25px 15px;
  border-radius:20px;
  text-align:center;
  background:linear-gradient(
    135deg,
    #21182f,
    #4a2739
  );
}

.avatarBox{
  width:110px;
  height:110px;
  margin:auto;
  position:relative;
}

.avatar{
  position:absolute;
  left:9px;
  top:9px;
  width:92px;
  height:92px;
  border-radius:50%;
  object-fit:cover;
  z-index:2;
}

.frame{
  position:absolute;
  inset:0;
  border:5px solid #e5aa35;
  border-radius:50%;
  z-index:3;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  font-size:18px;
}

.name{
  margin-top:12px;
  font-size:21px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:7px 15px;
  border-radius:20px;
  background:#e4aa35;
  color:#241900;
  font-size:12px;
  font-weight:bold;
}

.card{
  margin:12px 14px;
  padding:16px;
  border-radius:17px;
  background:#191d29;
}

.heading{
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
}

.stats{
  display:flex;
  gap:8px;
}

.stat{
  flex:1;
  padding:12px 4px;
  text-align:center;
  border-radius:12px;
  background:#242938;
}

.stat b{
  display:block;
  font-size:20px;
}

.stat span{
  color:#999;
  font-size:11px;
}

.progress{
  height:11px;
  background:#303545;
  border-radius:20px;
  overflow:hidden;
}

.progressBar{
  height:100%;
  width:0%;
  background:#e4aa35;
}

.small{
  color:#aaa;
  font-size:12px;
  margin-top:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.level,
.item{
  padding:13px 5px;
  border-radius:13px;
  background:#242938;
  text-align:center;
  border:1px solid transparent;
}

.level.active,
.item.active{
  border-color:#e4aa35;
  background:#352b1c;
}

.locked{
  opacity:.45;
}

.icon{
  font-size:29px;
}

.itemName{
  font-size:11px;
  margin-top:6px;
}

.itemInfo{
  color:#999;
  font-size:10px;
  margin-top:5px;
}

.save{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#e4aa35;
  color:#251900;
  font-weight:bold;
}

.message{
  margin-top:9px;
  color:#aaa;
  font-size:12px;
}

@media(max-width:360px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>

</head>

<body>

<div class="app">

<div class="header">

<button
  class="back"
  onclick="history.back()"
>
‹
</button>

<div class="title">
👑 PawanVoice VIP
</div>

</div>


<div class="hero">

<div class="avatarBox">

<img
  id="userDp"
  class="avatar"
  src=""
>

<div
  id="framePreview"
  class="frame"
></div>

</div>

<div
  id="userName"
  class="name"
>
Pawan User
</div>

<div
  id="badgePreview"
  class="badge"
>
VIP 0
</div>

</div>


<div class="card">

<div class="heading">
VIP Status
</div>

<div class="stats">

<div class="stat">
<b id="vipLevel">0</b>
<span>VIP Level</span>
</div>

<div class="stat">
<b id="vipExp">0</b>
<span>VIP EXP</span>
</div>

<div class="stat">
<b id="coins">0</b>
<span>Coins</span>
</div>

</div>

</div>


<div class="card">

<div class="heading">
VIP EXP
</div>

<div class="progress">

<div
  id="progressBar"
  class="progressBar"
></div>

</div>

<div
  id="progressText"
  class="small"
>
0 / 1000
</div>

</div>


<div class="card">

<div class="heading">
VIP Levels
</div>

<div
  id="levels"
  class="grid"
></div>

</div>


<div class="card">

<div class="heading">
Avatar Frame
</div>

<div
  id="frames"
  class="grid"
></div>

</div>


<div class="card">

<div class="heading">
Personal Badge
</div>

<div
  id="badges"
  class="grid"
></div>

</div>


<div class="card">

<div class="heading">
Entry Effect
</div>

<div
  id="entries"
  class="grid"
></div>

</div>


<div class="card">

<button
  class="save"
  onclick="saveVIP()"
>
✓ Save & Apply
</button>

<div
  id="message"
  class="message"
></div>

</div>

</div>


<script src="user.js"></script>

<script>

let me = null;

const VIP_LEVELS = [

{level:1,exp:0,name:"VIP 1",icon:"🥉"},
{level:2,exp:1000,name:"VIP 2",icon:"🥈"},
{level:3,exp:5000,name:"VIP 3",icon:"🥇"},
{level:4,exp:10000,name:"VIP 4",icon:"💎"},
{level:5,exp:20000,name:"VIP 5",icon:"💠"},
{level:6,exp:35000,name:"VIP 6",icon:"👑"},
{level:7,exp:50000,name:"VIP 7",icon:"🌟"},
{level:8,exp:70000,name:"VIP 8",icon:"🔥"},
{level:9,exp:90000,name:"VIP 9",icon:"🏆"}

];

const FRAMES = [

{id:"default",name:"Default",icon:"⭕",level:0},
{id:"vip1",name:"VIP 1",icon:"🥉",level:1},
{id:"vip2",name:"VIP 2",icon:"🥈",level:2},
{id:"vip3",name:"VIP 3",icon:"🥇",level:3},
{id:"vip4",name:"VIP 4",icon:"💎",level:4},
{id:"vip5",name:"VIP 5",icon:"💠",level:5},
{id:"vip6",name:"VIP 6",icon:"👑",level:6},
{id:"vip7",name:"VIP 7",icon:"🌟",level:7},
{id:"vip8",name:"VIP 8",icon:"🔥",level:8},
{id:"vip9",name:"VIP 9",icon:"🏆",level:9}

];

const BADGES = [

{id:"default",name:"New User",icon:"🙂",level:0},
{id:"vip1",name:"VIP 1",icon:"🥉",level:1},
{id:"vip2",name:"VIP 2",icon:"🥈",level:2},
{id:"vip3",name:"VIP 3",icon:"🥇",level:3},
{id:"vip4",name:"VIP 4",icon:"💎",level:4},
{id:"vip5",name:"VIP 5",icon:"💠",level:5},
{id:"vip6",name:"VIP 6",icon:"👑",level:6},
{id:"vip7",name:"VIP 7",icon:"🌟",level:7},
{id:"vip8",name:"VIP 8",icon:"🔥",level:8},
{id:"vip9",name:"VIP 9",icon:"🏆",level:9}

];

const ENTRY_EFFECTS = [

{id:"default",name:"Default",icon:"🚶",level:0},
{id:"vip1",name:"VIP 1 Entry",icon:"✨",level:1},
{id:"vip2",name:"VIP 2 Entry",icon:"💫",level:2},
{id:"vip3",name:"VIP 3 Entry",icon:"🌟",level:3},
{id:"vip4",name:"VIP 4 Entry",icon:"💎",level:4},
{id:"vip5",name:"VIP 5 Entry",icon:"💠",level:5},
{id:"vip6",name:"VIP 6 Entry",icon:"👑",level:6},
{id:"vip7",name:"VIP 7 Entry",icon:"🔥",level:7},
{id:"vip8",name:"VIP 8 Entry",icon:"⚡",level:8},
{id:"vip9",name:"VIP 9 Entry",icon:"🏆",level:9}

];

let selectedFrame = "default";
let selectedBadge = "default";
let selectedEntry = "default";


function getVIPLevel(exp){

let result = 0;

for(const item of VIP_LEVELS){

if(exp >= item.exp){

result = item.level;

}

}

return result;

}


function renderLevels(){

const box =
document.getElementById("levels");

box.innerHTML =
VIP_LEVELS.map(item => {

const unlocked =
Number(me.vipLevel || 0)
>= item.level;

const active =
Number(me.vipLevel || 0)
=== item.level;

return `

<div class="
level
${active ? "active":""}
${unlocked ? "":"locked"}
">

<div class="icon">
${item.icon}
</div>

<div class="itemName">
${item.name}
</div>

<div class="itemInfo">
${item.exp} EXP
</div>

</div>

`;

}).join("");

}


function renderGroup(
id,
items,
type
){

const box =
document.getElementById(id);

box.innerHTML =
items.map(item => {

const unlocked =
Number(me.vipLevel || 0)
>= item.level;

let selected = false;

if(type === "frame"){
selected =
selectedFrame === item.id;
}

if(type === "badge"){
selected =
selectedBadge === item.id;
}

if(type === "entry"){
selected =
selectedEntry === item.id;
}

return `

<div
class="
item
${selected ? "active":""}
${unlocked ? "":"locked"}
"
data-id="${item.id}"
>

<div class="icon">
${item.icon}
</div>

<div class="itemName">
${item.name}
</div>

<div class="itemInfo">

${
unlocked
? selected
  ? "✓ Selected"
  : "Tap to select"
: "🔒 VIP " + item.level
}

</div>

</div>

`;

}).join("");


box.querySelectorAll(".item")
.forEach(element => {

element.onclick = () => {

const itemId =
element.dataset.id;

const item =
items.find(
x => x.id === itemId
);

if(!item) return;

if(
Number(me.vipLevel || 0)
< item.level
){

return;

}

if(type === "frame"){
selectedFrame = itemId;
}

if(type === "badge"){
selectedBadge = itemId;
}

if(type === "entry"){
selectedEntry = itemId;
}

renderAll();

};

});

}


function renderAll(){

renderLevels();

renderGroup(
"frames",
FRAMES,
"frame"
);

renderGroup(
"badges",
BADGES,
"badge"
);

renderGroup(
"entries",
ENTRY_EFFECTS,
"entry"
);

updatePreview();

}


function updatePreview(){

const frame =
FRAMES.find(
x => x.id === selectedFrame
);

const badge =
BADGES.find(
x => x.id === selectedBadge
);

document.getElementById(
"framePreview"
).textContent =
frame ? frame.icon : "";

document.getElementById(
"badgePreview"
).textContent =
badge
? badge.icon + " " + badge.name
: "VIP 0";

}


function updateStatus(){

const exp =
Number(me.vipExp || 0);

const calculated =
getVIPLevel(exp);

if(
calculated >
Number(me.vipLevel || 0)
){

me.vipLevel =
calculated;

}

const level =
Number(me.vipLevel || 0);

document.getElementById(
"vipLevel"
).textContent =
level;

document.getElementById(
"vipExp"
).textContent =
exp;

document.getElementById(
"coins"
).textContent =
Number(me.coins || 0);


let nextExp = 90000;
let previousExp = 0;

if(level < 9){

const next =
VIP_LEVELS[level];

nextExp =
next.exp;

const previous =
VIP_LEVELS[level - 1];

previousExp =
previous.exp;

}

const range =
Math.max(
1,
nextExp - previousExp
);

const current =
Math.max(
0,
exp - previousExp
);

const percent =
level >= 9
? 100
: Math.min(
100,
Math.round(
current / range * 100
)
);

document.getElementById(
"progressBar"
).style.width =
percent + "%";

document.getElementById(
"progressText"
).textContent =
level >= 9
? "VIP 9 MAX"
: exp +
" / " +
nextExp +
" VIP EXP";

}


async function saveVIP(){

const frame =
FRAMES.find(
x => x.id === selectedFrame
) || FRAMES[0];

const badge =
BADGES.find(
x => x.id === selectedBadge
) || BADGES[0];

const entry =
ENTRY_EFFECTS.find(
x => x.id === selectedEntry
) || ENTRY_EFFECTS[0];

me.avatarFrame = {

id:frame.id,
name:frame.name,
image:"",
active:true

};

me.badge = {

id:badge.id,
name:badge.name,
image:"",
active:true

};

me.entryEffect = {

id:entry.id,
name:entry.name,
image:"",
active:true

};

try{

me =
await pvSaveUser(me);

document.getElementById(
"message"
).textContent =
"✓ VIP settings save हो गईं.";

}catch(error){

console.error(error);

document.getElementById(
"message"
).textContent =
"Save failed: Firebase connection check करें.";

}

}


async function init(){

me =
await pvLoadUser();

document.getElementById(
"userDp"
).src =
me.dp || PV_DEFAULT_DP;

document.getElementById(
"userName"
).textContent =
me.name || "Pawan User";

selectedFrame =
me.avatarFrame?.id ||
"default";

selectedBadge =
me.badge?.id ||
"default";

selectedEntry =
me.entryEffect?.id ||
"default";

updateStatus();

renderAll();

}

init();

</script>

</body>
</html>
