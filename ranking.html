<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PawanVoice Ranking</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#090910;
  color:#fff;
}

.app{
  width:100%;
  max-width:560px;
  margin:auto;
  min-height:100vh;
  background:#101019;
  padding-bottom:80px;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  background:#171724;
  border-bottom:1px solid #29293a;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#282838;
  color:#fff;
  font-size:24px;
}

.titleBox{
  flex:1;
}

.title{
  font-size:19px;
  font-weight:700;
}

.subtitle{
  margin-top:3px;
  font-size:11px;
  color:#9292a5;
}

.tabs{
  display:flex;
  gap:7px;
  padding:12px;
  overflow-x:auto;
  background:#11111b;
  border-bottom:1px solid #242436;
}

.tab{
  flex:0 0 auto;
  border:1px solid #303044;
  background:#202030;
  color:#bbb;
  border-radius:20px;
  padding:9px 14px;
  font-size:13px;
}

.tab.active{
  background:#7357ff;
  border-color:#7357ff;
  color:#fff;
}

.info{
  margin:12px;
  padding:12px;
  border-radius:14px;
  background:#1a1a29;
  border:1px solid #2b2b3d;
}

.infoTitle{
  font-weight:bold;
  font-size:14px;
}

.infoText{
  margin-top:5px;
  color:#9696a8;
  font-size:12px;
  line-height:1.4;
}

.podium{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:8px;
  padding:15px 10px 22px;
}

.podiumCard{
  width:31%;
  min-width:0;
  text-align:center;
  padding:12px 6px;
  border-radius:16px;
  background:#1b1b2a;
  border:1px solid #303044;
}

.podiumCard.first{
  transform:translateY(-12px);
  border-color:#7357ff;
}

.rankNo{
  font-size:22px;
  font-weight:bold;
  margin-bottom:7px;
}

.podiumDp{
  width:62px;
  height:62px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #55556b;
  background:#29293a;
}

.first .podiumDp{
  width:74px;
  height:74px;
}

.podiumName{
  margin-top:7px;
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.podiumValue{
  margin-top:4px;
  color:#aaaabd;
  font-size:11px;
}

.list{
  padding:0 12px;
}

.listTitle{
  padding:5px 2px 10px;
  font-size:15px;
  font-weight:bold;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 10px;
  margin-bottom:7px;
  border-radius:13px;
  background:#1a1a27;
  border:1px solid #272739;
}

.position{
  width:30px;
  text-align:center;
  color:#9999aa;
  font-weight:bold;
  font-size:14px;
}

.itemDp{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#29293a;
}

.itemInfo{
  flex:1;
  min-width:0;
}

.itemName{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.itemId{
  margin-top:3px;
  color:#858597;
  font-size:10px;
}

.itemValue{
  text-align:right;
  font-size:13px;
  font-weight:bold;
}

.itemLabel{
  margin-top:3px;
  color:#888899;
  font-size:10px;
}

.empty{
  margin:15px 12px;
  padding:35px 15px;
  text-align:center;
  border-radius:15px;
  background:#191923;
  border:1px solid #28283a;
  color:#888899;
  line-height:1.5;
}

.loading{
  padding:40px 15px;
  text-align:center;
  color:#888899;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(560px,100%);
  height:64px;
  background:#171724;
  border-top:1px solid #29293a;
  display:flex;
  z-index:30;
}

.nav{
  flex:1;
  border:0;
  background:none;
  color:#888899;
  font-size:12px;
}

.nav.active{
  color:#fff;
}

.navIcon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <button
      class="back"
      id="backBtn"
      type="button"
    >‹</button>

    <div class="titleBox">

      <div class="title">
        🏆 PawanVoice Ranking
      </div>

      <div
        class="subtitle"
        id="subtitle"
      >
        Top users
      </div>

    </div>

  </div>


  <div
    class="tabs"
    id="tabs"
  >

    <button class="tab" data-type="wealth">
      💎 Wealth
    </button>

    <button class="tab" data-type="rich">
      👑 Rich King
    </button>

    <button class="tab" data-type="cp">
      ❤️ CP
    </button>

    <button class="tab" data-type="family">
      👨‍👩‍👧 Family
    </button>

    <button class="tab" data-type="level">
      ⭐ Level
    </button>

    <button class="tab" data-type="coins">
      🪙 Coins
    </button>

    <button class="tab" data-type="diamonds">
      💎 Diamonds
    </button>

  </div>


  <div
    id="info"
    class="info"
  ></div>


  <div
    id="podium"
    class="podium"
  ></div>


  <div
    id="rankingList"
    class="list"
  >
    <div class="loading">
      Loading ranking...
    </div>
  </div>

</div>


<div class="bottom">

  <button
    class="nav"
    type="button"
    onclick="location.href='index.html'"
  >
    <span class="navIcon">🏠</span>
    Home
  </button>

  <button
    class="nav"
    type="button"
    onclick="location.href='inbox.html'"
  >
    <span class="navIcon">💬</span>
    Inbox
  </button>

  <button
    class="nav active"
    type="button"
  >
    <span class="navIcon">🏆</span>
    Ranking
  </button>

  <button
    class="nav"
    type="button"
    onclick="location.href='profile.html'"
  >
    <span class="navIcon">👤</span>
    Profile
  </button>

</div>


<script>

const FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const DEFAULT_DP =
  "https://i.pravatar.cc/200?img=12";

let currentType = "wealth";

let allUsers = {};

let rankingData = [];

const params =
  new URLSearchParams(
    location.search
  );

const requestedType =
  (params.get("type") || "")
  .toLowerCase()
  .trim();

const subtitle =
  document.getElementById(
    "subtitle"
  );

const info =
  document.getElementById(
    "info"
  );

const podium =
  document.getElementById(
    "podium"
  );

const rankingList =
  document.getElementById(
    "rankingList"
  );


function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


function safeDp(dp){

  return dp ||
    DEFAULT_DP;
}


async function getFirebase(path){

  const response =
    await fetch(
      FIREBASE_DB +
      path +
      ".json"
    );

  if(!response.ok){

    throw new Error(
      "Firebase HTTP " +
      response.status
    );
  }

  return await response.json();
}


function number(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}


function formatNumber(value){

  return number(value)
    .toLocaleString(
      "en-IN"
    );
}


function getUserArray(){

  return Object.entries(
    allUsers || {}
  )
  .map(
    ([key,user]) => {

      if(
        !user ||
        typeof user !== "object"
      ){
        return null;
      }

      return {

        userId:
          user.userId ||
          key,

        name:
          user.name ||
          "Pawan User",

        dp:
          user.dp ||
          DEFAULT_DP,

        level:
          number(user.level),

        exp:
          number(user.exp),

        coins:
          number(user.coins),

        diamonds:
          number(user.diamonds),

        vipLevel:
          number(user.vipLevel),

        vipExp:
          number(user.vipExp)
      };

    }
  )
  .filter(Boolean);
}


function wealthValue(user){

  return number(
    user.diamonds
  );
}


function richValue(user){

  return (
    number(user.coins) +
    number(user.diamonds)
  );
}


function levelValue(user){

  return (
    number(user.level) * 1000000 +
    number(user.exp)
  );
}


function coinsValue(user){

  return number(
    user.coins
  );
}


function diamondsValue(user){

  return number(
    user.diamonds
  );
}


function getValue(user){

  switch(currentType){

    case "wealth":
      return wealthValue(user);

    case "rich":
      return richValue(user);

    case "level":
      return levelValue(user);

    case "coins":
      return coinsValue(user);

    case "diamonds":
      return diamondsValue(user);

    default:
      return 0;
  }
}


function getTypeName(){

  switch(currentType){

    case "wealth":
      return "Wealth Ranking";

    case "rich":
      return "Rich King Ranking";

    case "cp":
      return "CP Ranking";

    case "family":
      return "Family Ranking";

    case "level":
      return "Level Ranking";

    case "coins":
      return "Coins Ranking";

    case "diamonds":
      return "Diamonds Ranking";

    default:
      return "Ranking";
  }
}


function getInfo(){

  switch(currentType){

    case "wealth":
      return {
        title:"💎 Wealth Ranking",
        text:
          "Users are ranked by available Diamonds. " +
          "Actual Firebase user data is used."
      };

    case "rich":
      return {
        title:"👑 Rich King Ranking",
        text:
          "Current version calculates Rich King score " +
          "from Coins + Diamonds."
      };

    case "cp":
      return {
        title:"❤️ CP Ranking",
        text:
          "CP couples are ranked from the Firebase " +
          "cpRanking data."
      };

    case "family":
      return {
        title:"👨‍👩‍👧 Family Ranking",
        text:
          "Families are ranked from Firebase " +
          "familyRanking data."
      };

    case "level":
      return {
        title:"⭐ Level Ranking",
        text:
          "Higher Level and EXP appear first."
      };

    case "coins":
      return {
        title:"🪙 Coins Ranking",
        text:
          "Users are ranked by Coins."
      };

    case "diamonds":
      return {
        title:"💎 Diamonds Ranking",
        text:
          "Users are ranked by Diamonds."
      };

    default:
      return {
        title:"🏆 Ranking",
        text:"Top users"
      };
  }
}


function updateTabs(){

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.type ===
          currentType
        );

      }
    );
}


function renderInfo(){

  const data =
    getInfo();

  info.innerHTML = `

    <div class="infoTitle">
      ${esc(data.title)}
    </div>

    <div class="infoText">
      ${esc(data.text)}
    </div>

  `;

  subtitle.textContent =
    getTypeName();
}


function renderPodium(){

  if(
    rankingData.length === 0
  ){

    podium.innerHTML =
      "";

    return;
  }

  const top =
    rankingData
      .slice(0,3);

  const order = [
    top[1],
    top[0],
    top[2]
  ];

  const labels = [
    "🥈",
    "🥇",
    "🥉"
  ];

  podium.innerHTML =
    order.map(
      (user,index) => {

        if(!user){

          return `
            <div class="podiumCard">
              <div class="rankNo">
                ${labels[index]}
              </div>
            </div>
          `;
        }

        const realRank =
          index === 0
            ? 2
            : index === 1
              ? 1
              : 3;

        return `

          <div
            class="podiumCard
            ${realRank === 1 ? "first" : ""}"
          >

            <div class="rankNo">
              ${labels[index]}
            </div>

            <img
              class="podiumDp"
              src="${esc(safeDp(user.dp))}"
              alt=""
              onerror="this.src='${DEFAULT_DP}'"
            >

            <div class="podiumName">
              ${esc(user.name)}
            </div>

            <div class="podiumValue">
              ${esc(
                getDisplayValue(user)
              )}
            </div>

          </div>

        `;

      }
    ).join("");
}


function getDisplayValue(user){

  switch(currentType){

    case "wealth":
      return (
        "💎 " +
        formatNumber(
          user.diamonds
        )
      );

    case "rich":
      return (
        "👑 " +
        formatNumber(
          richValue(user)
        )
      );

    case "level":
      return (
        "Lv " +
        formatNumber(
          user.level
        ) +
        " • EXP " +
        formatNumber(
          user.exp
        )
      );

    case "coins":
      return (
        "🪙 " +
        formatNumber(
          user.coins
        )
      );

    case "diamonds":
      return (
        "💎 " +
        formatNumber(
          user.diamonds
        )
      );

    default:
      return "";
  }
}


function renderUserList(){

  if(
    rankingData.length === 0
  ){

    rankingList.innerHTML = `

      <div class="empty">

        No ranking data available yet.

        <br><br>

        जब users activity / CP / Family
        data Firebase में आएगा,
        ranking यहाँ automatically दिखेगी।

      </div>

    `;

    return;
  }

  const remaining =
    rankingData
      .slice(3);

  rankingList.innerHTML = `

    <div class="listTitle">
      Top ${rankingData.length} Users
    </div>

    ${
      remaining.map(
        (user,index) => {

          const position =
            index + 4;

          return `

            <div class="item">

              <div class="position">
                #${position}
              </div>

              <img
                class="itemDp"
                src="${esc(safeDp(user.dp))}"
                alt=""
                onerror="this.src='${DEFAULT_DP}'"
              >

              <div class="itemInfo">

                <div class="itemName">
                  ${esc(user.name)}
                </div>

                <div class="itemId">
                  ID: ${esc(user.userId)}
                </div>

              </div>

              <div>

                <div class="itemValue">
                  ${esc(
                    getDisplayValue(user)
                  )}
                </div>

                <div class="itemLabel">
                  ${esc(getTypeName())}
                </div>

              </div>

            </div>

          `;

        }
      ).join("")
    }

  `;
}


async function loadUserRanking(){

  allUsers =
    await getFirebase(
      "/users"
    ) || {};

  rankingData =
    getUserArray();

  rankingData.sort(
    (a,b) =>
      getValue(b) -
      getValue(a)
  );

  rankingData =
    rankingData
      .slice(0,100);

  renderInfo();
  renderPodium();
  renderUserList();
}


function cpRowsToUsers(data){

  if(
    !data ||
    typeof data !== "object"
  ){
    return [];
  }

  const rows =
    Object.entries(data)
      .map(
        ([key,value]) => {

          if(
            !value ||
            typeof value !== "object"
          ){
            return null;
          }

          const userA =
            allUsers[
              value.userId1 ||
              value.user1Id ||
              ""
            ];

          const userB =
            allUsers[
              value.userId2 ||
              value.user2Id ||
              ""
            ];

          return {

            userId:
              value.cpId ||
              key,

            name:
              value.name ||
              (
                value.user1Name &&
                value.user2Name
                  ? value.user1Name +
                    " ❤️ " +
                    value.user2Name
                  : "CP Couple"
              ),

            dp:
              value.dp ||
              value.user1Dp ||
              (
                userA
                  ? userA.dp
                  : DEFAULT_DP
              ),

            level:
              number(value.level),

            exp:
              number(value.exp),

            coins:
              number(value.coins),

            diamonds:
              number(value.diamonds),

            cpScore:
              number(
                value.score ||
                value.cpScore ||
                value.points ||
                value.exp
              )

          };

        }
      )
      .filter(Boolean);

  return rows;
}


function familyRowsToUsers(data){

  if(
    !data ||
    typeof data !== "object"
  ){
    return [];
  }

  return Object.entries(data)
    .map(
      ([key,value]) => {

        if(
          !value ||
          typeof value !== "object"
        ){
          return null;
        }

        return {

          userId:
            value.familyId ||
            key,

          name:
            value.name ||
            value.familyName ||
            "Family",

          dp:
            value.dp ||
            value.image ||
            DEFAULT_DP,

          level:0,
          exp:0,
          coins:0,
          diamonds:0,

          familyScore:
            number(
              value.score ||
              value.points ||
              value.wealth ||
              value.exp
            )

        };

      }
    )
    .filter(Boolean);
}


async function loadSpecialRanking(){

  if(
    currentType === "cp"
  ){

    const data =
      await getFirebase(
        "/cpRanking"
      );

    rankingData =
      cpRowsToUsers(data);

    rankingData.sort(
      (a,b) =>
        number(b.cpScore) -
        number(a.cpScore)
    );

  }
  else if(
    currentType === "family"
  ){

    const data =
      await getFirebase(
        "/familyRanking"
      );

    rankingData =
      familyRowsToUsers(data);

    rankingData.sort(
      (a,b) =>
        number(b.familyScore) -
        number(a.familyScore)
    );

  }
  else {

    await loadUserRanking();

    return;
  }

  rankingData =
    rankingData
      .slice(0,100);

  renderInfo();
  renderPodium();
  renderSpecialList();
}


function renderSpecialList(){

  if(
    rankingData.length === 0
  ){

    rankingList.innerHTML = `

      <div class="empty">

        ${esc(getTypeName())}

        <br><br>

        No data found in Firebase yet.

      </div>

    `;

    return;
  }

  rankingList.innerHTML = `

    <div class="listTitle">
      Top ${rankingData.length}
    </div>

    ${
      rankingData
        .slice(3)
        .map(
          (user,index) => {

            const position =
              index + 4;

            const value =
              currentType === "cp"
                ? number(user.cpScore)
                : number(user.familyScore);

            return `

              <div class="item">

                <div class="position">
                  #${position}
                </div>

                <img
                  class="itemDp"
                  src="${esc(
                    safeDp(user.dp)
                  )}"
                  alt=""
                  onerror="this.src='${DEFAULT_DP}'"
                >

                <div class="itemInfo">

                  <div class="itemName">
                    ${esc(user.name)}
                  </div>

                  <div class="itemId">
                    ID: ${esc(user.userId)}
                  </div>

                </div>

                <div>

                  <div class="itemValue">
                    ${formatNumber(value)}
                  </div>

                  <div class="itemLabel">
                    ${currentType === "cp"
                      ? "CP Score"
                      : "Family Score"}
                  </div>

                </div>

              </div>

            `;

          }
        ).join("")
    }

  `;
}


async function loadRanking(){

  podium.innerHTML =
    `<div class="loading">
      Loading...
    </div>`;

  rankingList.innerHTML =
    `<div class="loading">
      Loading ranking...
    </div>`;

  try{

    if(
      currentType === "cp" ||
      currentType === "family"
    ){

      await loadSpecialRanking();

    }else{

      await loadUserRanking();

    }

  }catch(error){

    console.error(
      "Ranking error:",
      error
    );

    rankingData = [];

    info.innerHTML = `

      <div class="infoTitle">
        ⚠️ Ranking Error
      </div>

      <div class="infoText">
        Firebase data load नहीं हो पाया।
        थोड़ी देर बाद फिर try करें।
      </div>

    `;

    podium.innerHTML = "";

    rankingList.innerHTML = `

      <div class="empty">
        Connection error.
      </div>

    `;
  }
}


document
  .querySelectorAll(".tab")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function(){

          currentType =
            this.dataset.type;

          updateTabs();

          loadRanking();

        }
      );

    }
  );


document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    function(){

      if(
        document.referrer
      ){

        history.back();

      }else{

        location.href =
          "index.html";
      }

    }
  );


if(
  [
    "wealth",
    "rich",
    "cp",
    "family",
    "level",
    "coins",
    "diamonds"
  ].includes(
    requestedType
  )
){

  currentType =
    requestedType;

}

updateTabs();

loadRanking();


setInterval(
  loadRanking,
  15000
);

</script>

</body>
</html>
