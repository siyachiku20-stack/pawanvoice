<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PawanVoice Profile</title>

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 background:#080711;
 color:white;
 font-family:Arial,sans-serif;
}

.app{
 max-width:430px;
 min-height:100vh;
 margin:auto;
 background:
 radial-gradient(circle at top,#321750,#0a0912 42%);
 padding-bottom:30px;
}

.header{
 height:58px;
 display:flex;
 align-items:center;
 padding:0 16px;
}

.back{
 font-size:24px;
 width:40px;
}

.title{
 font-size:19px;
 font-weight:bold;
}

.cover{
 margin:0 14px;
 padding:25px 18px;
 border-radius:25px;
 background:
 linear-gradient(135deg,#5425a0,#d13788);
 text-align:center;
}

.dp{
 width:100px;
 height:100px;
 border-radius:50%;
 object-fit:cover;
 border:4px solid rgba(255,255,255,.8);
 box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.name{
 margin-top:12px;
 font-size:22px;
 font-weight:bold;
}

.uid{
 margin-top:5px;
 color:#e1d8ef;
 font-size:12px;
}

.edit{
 margin-top:14px;
 padding:9px 20px;
 border:0;
 border-radius:20px;
 color:#fff;
 background:rgba(255,255,255,.18);
}

.stats{
 margin:15px 14px;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.stat{
 background:#161321;
 border:1px solid #29243a;
 border-radius:16px;
 padding:15px 5px;
 text-align:center;
}

.stat b{
 display:block;
 font-size:17px;
}

.stat span{
 display:block;
 color:#888;
 font-size:11px;
 margin-top:5px;
}

.level{
 margin:0 14px;
 padding:18px;
 border-radius:18px;
 background:#15121f;
 border:1px solid #29243a;
}

.levelTop{
 display:flex;
 justify-content:space-between;
}

.levelBar{
 height:9px;
 background:#29243a;
 border-radius:20px;
 margin-top:12px;
 overflow:hidden;
}

.levelFill{
 width:25%;
 height:100%;
 background:linear-gradient(90deg,#7543ff,#e83b9b);
}

.grid{
 margin:16px 14px;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.item{
 background:#15121f;
 border:1px solid #29243a;
 border-radius:16px;
 padding:17px 5px;
 text-align:center;
}

.itemIcon{
 font-size:26px;
}

.itemName{
 margin-top:7px;
 font-size:11px;
 color:#aaa;
}

.logout{
 width:calc(100% - 28px);
 margin:5px 14px;
 height:48px;
 border:0;
 border-radius:15px;
 color:#ff809e;
 background:#291522;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

 <div
 class="back"
 onclick="history.back()">
 ←
 </div>

 <div class="title">
   My Profile
 </div>

</div>


<section class="cover">

 <img
 id="dp"
 class="dp"
 src="https://i.pravatar.cc/150?img=12">

 <div id="name" class="name">
   Guest
 </div>

 <div id="uid" class="uid">
   ID: --
 </div>

 <button
 class="edit"
 onclick="editName()">
   ✏️ Edit Profile
 </button>

</section>


<div class="stats">

 <div class="stat">
   <b id="coins">0</b>
   <span>Coins</span>
 </div>

 <div class="stat">
   <b>0</b>
   <span>Following</span>
 </div>

 <div class="stat">
   <b>0</b>
   <span>Followers</span>
 </div>

</div>


<div class="level">

 <div class="levelTop">

   <b>⭐ Level 1</b>

   <span>0 / 100 EXP</span>

 </div>

 <div class="levelBar">

   <div class="levelFill"></div>

 </div>

</div>


<div class="grid">

 <div class="item"
 onclick="coming('My Dress')">

   <div class="itemIcon">👗</div>
   <div class="itemName">My Dress</div>

 </div>

 <div class="item"
 onclick="coming('Avatar Frame')">

   <div class="itemIcon">🖼️</div>
   <div class="itemName">Frame</div>

 </div>

 <div class="item"
 onclick="coming('Medal')">

   <div class="itemIcon">🏅</div>
   <div class="itemName">Medal</div>

 </div>

 <div class="item"
 onclick="coming('Badge')">

   <div class="itemIcon">🎖️</div>
   <div class="itemName">Badge</div>

 </div>

 <div class="item"
 onclick="coming('VIP')">

   <div class="itemIcon">👑</div>
   <div class="itemName">VIP</div>

 </div>

 <div class="item"
 onclick="coming('Family')">

   <div class="itemIcon">👨‍👩‍👧</div>
   <div class="itemName">Family</div>

 </div>

 <div class="item"
 onclick="coming('CP')">

   <div class="itemIcon">❤️</div>
   <div class="itemName">CP</div>

 </div>

 <div class="item"
 onclick="coming('Ranking')">

   <div class="itemIcon">🏆</div>
   <div class="itemName">Ranking</div>

 </div>

 <div class="item"
 onclick="coming('Wallet')">

   <div class="itemIcon">💰</div>
   <div class="itemName">Wallet</div>

 </div>

</div>


<button
class="logout"
onclick="logout()">

 Logout

</button>

</div>


<script>

const userId =
 localStorage.getItem("pv_userId");

let userName =
 localStorage.getItem("pv_name");

let userDp =
 localStorage.getItem("pv_dp");


if(!userId){

 window.location.href="/login.html";

}else{

 document.getElementById("name").innerText =
   userName || "Guest";

 document.getElementById("uid").innerText =
   "ID: " + userId;

 document.getElementById("dp").src =
   userDp || "https://i.pravatar.cc/150?img=12";

}


function editName(){

 const newName =
   prompt("Enter your new name:",userName || "");

 if(!newName){

   return;

 }

 const clean =
   newName.trim().substring(0,20);

 if(clean.length<2){

   alert("Name is too short.");

   return;

 }

 userName=clean;

 localStorage.setItem(
   "pv_name",
   clean
 );

 document.getElementById("name").innerText =
   clean;

 alert("Name changed.");

}


function coming(name){

 alert(
   name +
   " module next phase me connect hoga."
 );

}


function logout(){

 localStorage.removeItem("pv_userId");
 localStorage.removeItem("pv_name");
 localStorage.removeItem("pv_dp");

 window.location.href="/login.html";

}

</script>

</body>
</html>
