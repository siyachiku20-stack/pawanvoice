<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawanVoice - Profile</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080914;
  color:#fff;
  min-height:100vh;
}

.header{
  height:62px;
  display:flex;
  align-items:center;
  padding:0 16px;
  border-bottom:1px solid #24263a;
  background:#101223;
}

.back{
  font-size:27px;
  cursor:pointer;
  margin-right:15px;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.profile-top{
  padding:25px 18px;
  text-align:center;
  background:
    radial-gradient(circle at top,#34356e 0,#15162b 42%,#090a15 100%);
}

.dp-wrap{
  position:relative;
  width:105px;
  height:105px;
  margin:auto;
}

.dp{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #8c7cff;
  background:#25263b;
}

.camera{
  position:absolute;
  right:0;
  bottom:0;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#7c5cff;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid #101223;
  cursor:pointer;
}

.name{
  margin-top:12px;
  font-size:22px;
  font-weight:bold;
}

.uid{
  margin-top:5px;
  color:#aaaec5;
  font-size:13px;
}

.level-box{
  margin:18px 0 0;
  background:#17182b;
  border:1px solid #2d2f4b;
  border-radius:15px;
  padding:14px;
  text-align:left;
}

.level-line{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
  font-size:14px;
}

.exp-bar{
  width:100%;
  height:9px;
  border-radius:20px;
  background:#303149;
  overflow:hidden;
}

.exp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#775cff,#c85cff);
  border-radius:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:#111222;
  margin:14px;
  border-radius:15px;
  border:1px solid #282a42;
  padding:17px 5px;
}

.stat{
  text-align:center;
  border-right:1px solid #292b40;
}

.stat:last-child{
  border-right:none;
}

.stat-number{
  font-size:18px;
  font-weight:bold;
}

.stat-label{
  margin-top:5px;
  color:#999db5;
  font-size:12px;
}

.section{
  padding:0 14px;
}

.section-title{
  font-size:16px;
  font-weight:bold;
  margin:20px 3px 12px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.item{
  min-height:85px;
  border-radius:14px;
  background:#151629;
  border:1px solid #292b45;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.item:active{
  transform:scale(.97);
}

.icon{
  font-size:27px;
  margin-bottom:7px;
}

.item-name{
  font-size:12px;
  color:#d8d9e7;
}

.edit-card{
  margin:18px 14px;
  background:#17182b;
  border:1px solid #30324d;
  border-radius:16px;
  padding:17px;
}

.input-title{
  font-size:13px;
  color:#aaaec4;
  margin-bottom:7px;
}

.input{
  width:100%;
  background:#0d0e1a;
  border:1px solid #34364f;
  color:#fff;
  border-radius:10px;
  padding:13px;
  outline:none;
  margin-bottom:13px;
}

.input:focus{
  border-color:#7965ff;
}

.save-btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:linear-gradient(90deg,#765cff,#a855f7);
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.logout{
  margin:22px 14px 100px;
  width:calc(100% - 28px);
  padding:13px;
  border-radius:12px;
  border:1px solid #63303b;
  background:#25151c;
  color:#ff8f9e;
  font-weight:bold;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#111222;
  border-top:1px solid #292b42;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:20;
}

.nav{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#8f93ab;
  font-size:11px;
  cursor:pointer;
}

.nav span{
  font-size:22px;
  margin-bottom:3px;
}

.nav.active{
  color:#9b82ff;
}

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:#25263a;
  border:1px solid #444664;
  padding:11px 18px;
  border-radius:25px;
  display:none;
  z-index:50;
  font-size:13px;
  white-space:nowrap;
}

@media(max-width:360px){
  .menu{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="back" onclick="goHome()">‹</div>
  <div class="header-title">My Profile</div>
</div>

<div class="profile-top">

  <div class="dp-wrap">
    <img id="profileDP"
         class="dp"
         src="https://i.pravatar.cc/200?img=12"
         alt="DP">

    <div class="camera" onclick="chooseDP()">📷</div>
  </div>

  <div id="profileName" class="name">Pawan User</div>

  <div id="profileUID" class="uid">ID: pawan</div>

  <div class="level-box">

    <div class="level-line">
      <span>⭐ Level <b id="levelText">1</b></span>
      <span id="expText">0 / 100 EXP</span>
    </div>

    <div class="exp-bar">
      <div id="expFill" class="exp-fill"></div>
    </div>

  </div>

</div>

<div class="stats">

  <div class="stat">
    <div id="coins" class="stat-number">0</div>
    <div class="stat-label">Coins</div>
  </div>

  <div class="stat">
    <div id="following" class="stat-number">0</div>
    <div class="stat-label">Following</div>
  </div>

  <div class="stat">
    <div id="followers" class="stat-number">0</div>
    <div class="stat-label">Followers</div>
  </div>

</div>

<div class="edit-card">

  <div class="input-title">Change Name</div>

  <input
    id="nameInput"
    class="input"
    type="text"
    maxlength="30"
    placeholder="Enter your name"
  >

  <div class="input-title">Change DP</div>

  <input
    id="dpInput"
    class="input"
    type="url"
    placeholder="Paste image URL"
  >

  <button class="save-btn" onclick="saveProfile()">
    Save Profile
  </button>

</div>

<div class="section">

  <div class="section-title">My Account</div>

  <div class="menu">

    <div class="item" onclick="comingSoon('My Dress')">
      <div class="icon">👕</div>
      <div class="item-name">My Dress</div>
    </div>

    <div class="item" onclick="comingSoon('Avatar Frame')">
      <div class="icon">🖼️</div>
      <div class="item-name">Frame</div>
    </div>

    <div class="item" onclick="comingSoon('Medal')">
      <div class="icon">🏅</div>
      <div class="item-name">Medal</div>
    </div>

    <div class="item" onclick="comingSoon('Personal Badge')">
      <div class="icon">🎖️</div>
      <div class="item-name">Badge</div>
    </div>

    <div class="item" onclick="comingSoon('VIP')">
      <div class="icon">👑</div>
      <div class="item-name">VIP</div>
    </div>

    <div class="item" onclick="comingSoon('Family')">
      <div class="icon">👨‍👩‍👧</div>
      <div class="item-name">Family</div>
    </div>

    <div class="item" onclick="comingSoon('CP Space')">
      <div class="icon">💞</div>
      <div class="item-name">CP Space</div>
    </div>

    <div class="item" onclick="comingSoon('Ranking')">
      <div class="icon">🏆</div>
      <div class="item-name">Ranking</div>
    </div>

    <div class="item" onclick="comingSoon('Wallet')">
      <div class="icon">🪙</div>
      <div class="item-name">Wallet</div>
    </div>

    <div class="item" onclick="openLevel()">
      <div class="icon">⭐</div>
      <div class="item-name">Level / EXP</div>
    </div>

    <div class="item" onclick="comingSoon('Invite Friend')">
      <div class="icon">🤝</div>
      <div class="item-name">Invite</div>
    </div>

    <div class="item" onclick="comingSoon('Settings')">
      <div class="icon">⚙️</div>
      <div class="item-name">Settings</div>
    </div>

  </div>

</div>

<button class="logout" onclick="logout()">
  Logout
</button>

<div id="toast" class="toast"></div>

<div class="bottom">

  <div class="nav" onclick="goHome()">
    <span>🏠</span>
    Home
  </div>

  <div class="nav" onclick="openInbox()">
    <span>💬</span>
    Inbox
  </div>

  <div class="nav active">
    <span>👤</span>
    Profile
  </div>

</div>

<script>

/* =========================
   LOAD USER
========================= */

function getUser(){

  let user = {
    userId: localStorage.getItem("pv_userId") || "pawan",
    name: localStorage.getItem("pv_name") || "Pawan User",
    dp: localStorage.getItem("pv_dp") || "https://i.pravatar.cc/200?img=12",
    level: Number(localStorage.getItem("pv_level") || 1),
    exp: Number(localStorage.getItem("pv_exp") || 0),
    coins: Number(localStorage.getItem("pv_coins") || 0),
    following: Number(localStorage.getItem("pv_following") || 0),
    followers: Number(localStorage.getItem("pv_followers") || 0)
  };

  return user;
}


/* =========================
   SHOW PROFILE
========================= */

function loadProfile(){

  const user = getUser();

  document.getElementById("profileDP").src = user.dp;

  document.getElementById("profileName").textContent = user.name;

  document.getElementById("profileUID").textContent =
    "ID: " + user.userId;

  document.getElementById("nameInput").value =
    user.name;

  document.getElementById("dpInput").value =
    user.dp;

  document.getElementById("levelText").textContent =
    user.level;

  document.getElementById("coins").textContent =
    user.coins;

  document.getElementById("following").textContent =
    user.following;

  document.getElementById("followers").textContent =
    user.followers;

  updateEXP(user);

}


/* =========================
   LEVEL / EXP
========================= */

function updateEXP(user){

  let level = user.level;

  let required = level * 100;

  let exp = user.exp;

  let percent = Math.min(
    100,
    Math.round((exp / required) * 100)
  );

  document.getElementById("expText").textContent =
    exp + " / " + required + " EXP";

  document.getElementById("expFill").style.width =
    percent + "%";
}


/* =========================
   SAVE PROFILE
========================= */

function saveProfile(){

  const name =
    document.getElementById("nameInput").value.trim();

  const dp =
    document.getElementById("dpInput").value.trim();

  if(!name){

    showToast("Name enter karo");

    return;
  }

  if(!dp){

    showToast("DP URL enter karo");

    return;
  }

  localStorage.setItem("pv_name", name);

  localStorage.setItem("pv_dp", dp);

  document.getElementById("profileName").textContent =
    name;

  document.getElementById("profileDP").src =
    dp;

  showToast("Profile saved successfully ✅");
}


/* =========================
   CHANGE DP
========================= */

function chooseDP(){

  document.getElementById("dpInput").focus();

  document.getElementById("dpInput").scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

  showToast("DP image URL yahan paste karo");
}


/* =========================
   HOME
========================= */

function goHome(){

  window.location.href =
    "/index.html";
}


/* =========================
   INBOX
========================= */

function openInbox(){

  window.location.href =
    "/inbox.html";
}


/* =========================
   LEVEL
========================= */

function openLevel(){

  window.location.href =
    "/level.html";
}


/* =========================
   COMING SOON
========================= */

function comingSoon(name){

  showToast(name + " next phase me add hoga");
}


/* =========================
   LOGOUT
========================= */

function logout(){

  const ok =
    confirm("Logout karna hai?");

  if(!ok) return;

  localStorage.removeItem("pv_userId");
  localStorage.removeItem("pv_name");
  localStorage.removeItem("pv_dp");

  window.location.href =
    "/login.html";
}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(function(){

      toast.style.display =
        "none";

    },2500);
}


/* =========================
   DP PREVIEW
========================= */

document
.getElementById("dpInput")
.addEventListener("input",function(){

  const url =
    this.value.trim();

  if(url){

    document.getElementById("profileDP").src =
      url;
  }

});


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
