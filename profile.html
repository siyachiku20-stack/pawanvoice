<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PawanVoice Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101116;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .header {
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      background: #171922;
      border-bottom: 1px solid #292c38;
    }

    .profile-card {
      margin: 16px;
      padding: 20px;
      background: #191c25;
      border-radius: 20px;
      text-align: center;
    }

    .dp-box {
      position: relative;
      width: 105px;
      height: 105px;
      margin: auto;
    }

    .dp-box img {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #e4aa35;
    }

    .name {
      margin-top: 12px;
      font-size: 21px;
      font-weight: bold;
    }

    .userid {
      margin-top: 5px;
      color: #999;
      font-size: 13px;
    }

    .vip-status {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 15px;
      border-radius: 20px;
      background: #e4aa35;
      color: #241900;
      font-size: 13px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .stat {
      background: #222631;
      padding: 12px 5px;
      border-radius: 12px;
    }

    .stat-number {
      font-size: 17px;
      font-weight: bold;
    }

    .stat-title {
      margin-top: 5px;
      color: #aaa;
      font-size: 11px;
    }

    .section {
      margin: 16px;
      padding: 16px;
      background: #191c25;
      border-radius: 18px;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      color: #aaa;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #303442;
      border-radius: 10px;
      background: #11131a;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #e4aa35;
    }

    .preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .preview img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
    }

    .main-btn {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #e4aa35;
      color: #241900;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .vip-btn {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #e4aa35, #ffd76a);
      color: #241900;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .menu button {
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      background: #222631;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .menu button:active,
    .main-btn:active,
    .vip-btn:active {
      transform: scale(.98);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: 70px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #171922;
      border-top: 1px solid #292c38;
      z-index: 100;
    }

    .bottom-nav button {
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 13px;
    }

    .bottom-nav button:first-child {
      color: #e4aa35;
    }

    .message {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #76e39a;
      min-height: 18px;
    }

    @media (max-width: 380px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- HEADER -->
  <div class="header">
    👤 My Profile
  </div>


  <!-- PROFILE CARD -->
  <div class="profile-card">

    <div class="dp-box">
      <img
        id="profileDp"
        src="https://i.pravatar.cc/200?img=12"
        alt="Profile"
      >
    </div>

    <div class="name" id="profileName">
      Pawan User
    </div>

    <div class="userid" id="profileUserId">
      ID: pawan
    </div>

    <!-- VIP STATUS -->
    <div class="vip-status" id="profileVip">
      👑 VIP 0
    </div>

    <!-- STATS -->
    <div class="stats">

      <div class="stat">
        <div class="stat-number" id="profileLevel">
          1
        </div>
        <div class="stat-title">
          Level
        </div>
      </div>

      <div class="stat">
        <div class="stat-number" id="profileCoins">
          0
        </div>
        <div class="stat-title">
          Coins
        </div>
      </div>

      <div class="stat">
        <div class="stat-number" id="profileDiamonds">
          0
        </div>
        <div class="stat-title">
          Diamonds
        </div>
      </div>

      <div class="stat">
        <div class="stat-number" id="profileFollowing">
          0
        </div>
        <div class="stat-title">
          Following
        </div>
      </div>

      <div class="stat">
        <div class="stat-number" id="profileFollowers">
          0
        </div>
        <div class="stat-title">
          Followers
        </div>
      </div>

      <div class="stat">
        <div class="stat-number" id="profileExp">
          0
        </div>
        <div class="stat-title">
          EXP
        </div>
      </div>

    </div>

  </div>


  <!-- VIP -->
  <div class="section">

    <div class="section-title">
      👑 VIP Membership
    </div>

    <div style="
      color:#aaa;
      font-size:13px;
      line-height:1.5;
    ">
      VIP level, Avatar Frame, Personal Badge और Entry Effect manage करने के लिए VIP page खोलें।
    </div>

    <button
      class="vip-btn"
      onclick="location.href='vip.html'"
    >
      👑 Open VIP Center
    </button>

  </div>


  <!-- EDIT PROFILE -->
  <div class="section">

    <div class="section-title">
      ✏️ Edit Profile
    </div>

    <label>
      Your Name
    </label>

    <input
      id="nameInput"
      type="text"
      maxlength="30"
      placeholder="Enter your name"
    >

    <label>
      Profile DP URL
    </label>

    <input
      id="dpInput"
      type="url"
      placeholder="Paste DP image URL"
    >

    <div class="preview">

      <img
        id="dpPreview"
        src="https://i.pravatar.cc/200?img=12"
        alt="DP Preview"
      >

      <div style="color:#aaa;font-size:12px;">
        DP preview
      </div>

    </div>

    <button
      class="main-btn"
      id="saveProfileBtn"
    >
      💾 Save Profile
    </button>

    <div
      class="message"
      id="saveMessage"
    ></div>

  </div>


  <!-- PROFILE MENU -->
  <div class="section">

    <div class="section-title">
      ⚙️ Profile Menu
    </div>

    <div class="menu">

      <button onclick="location.href='level.html'">
        🏆 Level & EXP
      </button>

      <button onclick="location.href='vip.html'">
        👑 VIP
      </button>

      <button onclick="location.href='store.html'">
        🛍️ Store
      </button>

      <button onclick="location.href='inbox.html'">
        💬 Inbox
      </button>

      <button onclick="alert('CP Space जल्द जोड़ा जाएगा')">
        💕 CP Space
      </button>

      <button onclick="alert('Family feature जल्द जोड़ा जाएगा')">
        👨‍👩‍👧 Family
      </button>

      <button onclick="alert('Avatar Frame VIP Center से change करें')">
        🖼️ Avatar Frame
      </button>

      <button onclick="alert('Personal Badge VIP Center से change करें')">
        🏅 Personal Badge
      </button>

      <button onclick="alert('Entry Effect VIP Center से change करें')">
        ✨ Entry Effect
      </button>

      <button onclick="alert('Settings जल्द जोड़ा जाएगा')">
        ⚙️ Settings
      </button>

    </div>

  </div>

</div>


<!-- BOTTOM NAV -->
<div class="bottom-nav">

  <button onclick="location.href='index.html'">
    🏠<br>
    Home
  </button>

  <button onclick="location.href='inbox.html'">
    💬<br>
    Inbox
  </button>

  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
    👤<br>
    Profile
  </button>

</div>


<script src="user.js"></script>

<script>

  let currentUser = null;

  const DEFAULT_DP =
    "https://i.pravatar.cc/200?img=12";


  function $(id) {
    return document.getElementById(id);
  }


  function showUser(user) {

    currentUser = user;

    $("profileName").textContent =
      user.name || "Pawan User";

    $("profileUserId").textContent =
      "ID: " + (user.userId || "pawan");

    $("profileDp").src =
      user.dp || DEFAULT_DP;

    $("dpPreview").src =
      user.dp || DEFAULT_DP;

    $("nameInput").value =
      user.name || "";

    $("dpInput").value =
      user.dp || "";

    $("profileLevel").textContent =
      Number(user.level || 1);

    $("profileExp").textContent =
      Number(user.exp || 0);

    $("profileCoins").textContent =
      Number(user.coins || 0);

    $("profileDiamonds").textContent =
      Number(user.diamonds || 0);

    $("profileFollowing").textContent =
      Number(user.following || 0);

    $("profileFollowers").textContent =
      Number(user.followers || 0);

    $("profileVip").textContent =
      "👑 VIP " + Number(user.vipLevel || 0);
  }


  async function loadProfile() {

    try {

      const user =
        await pvLoadUser();

      showUser(user);

    } catch (error) {

      console.error(error);

      const user =
        pvGetLocalUser();

      showUser(user);
    }

  }


  $("dpInput").addEventListener(
    "input",
    function() {

      const url =
        this.value.trim();

      if (url) {
        $("dpPreview").src = url;
      }

    }
  );


  $("saveProfileBtn").addEventListener(
    "click",
    async function() {

      if (!currentUser) {
        return;
      }

      const name =
        $("nameInput").value.trim();

      const dp =
        $("dpInput").value.trim();

      if (!name) {

        $("saveMessage").style.color =
          "#ff7777";

        $("saveMessage").textContent =
          "Name खाली नहीं हो सकता";

        return;
      }


      currentUser.name =
        name;

      currentUser.dp =
        dp || DEFAULT_DP;


      $("saveProfileBtn").disabled =
        true;

      $("saveProfileBtn").textContent =
        "Saving...";


      try {

        const savedUser =
          await pvSaveUser(currentUser);

        currentUser =
          savedUser || currentUser;

        showUser(currentUser);

        $("saveMessage").style.color =
          "#76e39a";

        $("saveMessage").textContent =
          "✅ Profile saved successfully";

      } catch (error) {

        console.error(error);

        /*
          Firebase unavailable होने पर
          local profile फिर भी save होगा.
        */

        pvSaveLocalUser(currentUser);

        showUser(currentUser);

        $("saveMessage").style.color =
          "#ffd166";

        $("saveMessage").textContent =
          "✅ Profile saved on this device";

      }


      $("saveProfileBtn").disabled =
        false;

      $("saveProfileBtn").textContent =
        "💾 Save Profile";

    }
  );


  loadProfile();

</script>

</body>
</html>
