<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>PawanVoice - Profile</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080914;
  color:#fff;
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:600px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(
      circle at 50% 0%,
      #302652 0%,
      #111224 35%,
      #080914 75%
    );
  padding-bottom:85px;
}

/* HEADER */

.header{
  height:62px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(8,9,20,.96);
  border-bottom:1px solid #292b43;
  position:sticky;
  top:0;
  z-index:30;
}

.back{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid #383a52;
  background:#18192b;
  color:#fff;
  font-size:27px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.header-title{
  font-size:17px;
  font-weight:bold;
}

/* PROFILE TOP */

.profile-card{
  margin:14px 12px;
  padding:20px 15px;
  border-radius:20px;
  background:#151628;
  border:1px solid #303249;
  text-align:center;
}

.dp-wrap{
  width:105px;
  height:105px;
  margin:auto;
  position:relative;
}

.profile-dp{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #8872ff;
  background:#22243a;
}

.dp-edit{
  position:absolute;
  right:0;
  bottom:2px;
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid #151628;
  background:#765cff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.profile-name{
  margin-top:12px;
  font-size:20px;
  font-weight:bold;
}

.profile-id{
  margin-top:5px;
  color:#85899f;
  font-size:11px;
}

.level-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:10px;
  padding:6px 12px;
  border-radius:15px;
  background:#24203c;
  border:1px solid #51457e;
  color:#c0b3ff;
  font-size:11px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-top:18px;
  border-top:1px solid #292b43;
  padding-top:15px;
}

.stat{
  text-align:center;
}

.stat-number{
  font-size:15px;
  font-weight:bold;
}

.stat-name{
  margin-top:4px;
  color:#777b92;
  font-size:9px;
}

/* EXP */

.exp-card{
  margin:0 12px 12px;
  padding:15px;
  border-radius:17px;
  background:#151628;
  border:1px solid #303249;
}

.exp-top{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:9px;
}

.exp-top span:last-child{
  color:#b9a7ff;
}

.exp-track{
  height:9px;
  border-radius:10px;
  background:#292b42;
  overflow:hidden;
}

.exp-bar{
  height:100%;
  width:0%;
  border-radius:10px;
  background:#765cff;
}

.exp-info{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  color:#777b92;
  font-size:9px;
}

/* EDIT */

.edit-card{
  margin:0 12px 12px;
  padding:15px;
  border-radius:17px;
  background:#151628;
  border:1px solid #303249;
}

.section-title{
  font-size:15px;
  font-weight:bold;
  margin-bottom:13px;
}

.label{
  display:block;
  color:#8d91a8;
  font-size:10px;
  margin-bottom:6px;
}

.input{
  width:100%;
  height:43px;
  padding:0 12px;
  margin-bottom:11px;
  border-radius:10px;
  border:1px solid #34364d;
  outline:0;
  background:#0e0f1e;
  color:#fff;
  font-size:12px;
}

.input:focus{
  border-color:#765cff;
}

.save-btn{
  width:100%;
  height:44px;
  border:0;
  border-radius:11px;
  background:#765cff;
  color:#fff;
  font-weight:bold;
}

/* MENU */

.menu-card{
  margin:0 12px;
  border-radius:17px;
  overflow:hidden;
  background:#151628;
  border:1px solid #303249;
}

.menu{
  min-height:52px;
  padding:9px 13px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid #292b43;
  background:transparent;
  color:#fff;
  width:100%;
  border-left:0;
  border-right:0;
  border-top:0;
  text-align:left;
}

.menu:last-child{
  border-bottom:0;
}

.menu-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#202137;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

.menu-text{
  flex:1;
  font-size:12px;
}

.arrow{
  color:#676b82;
  font-size:17px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:68px;
  z-index:50;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:rgba(9,10,21,.98);
  border-top:1px solid #292b43;
}

.nav{
  border:0;
  background:transparent;
  color:#777b91;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.nav.active{
  color:#a993ff;
}

.nav-icon{
  font-size:20px;
}

.nav-text{
  font-size:9px;
}

/* TOAST */

.toast{
  display:none;
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  z-index:100;
  padding:10px 16px;
  border-radius:20px;
  background:#27283d;
  border:1px solid #484a64;
  font-size:11px;
  white-space:nowrap;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <button
      class="back"
      onclick="goHome()">
      ‹
    </button>

    <div class="header-title">
      My Profile
    </div>

  </header>


  <!-- PROFILE -->

  <section class="profile-card">

    <div class="dp-wrap">

      <img
        id="profileDP"
        class="profile-dp"
        src="https://i.pravatar.cc/200?img=12"
        alt="Profile">

      <button
        class="dp-edit"
        onclick="focusDP()">
        📷
      </button>

    </div>

    <div
      id="profileName"
      class="profile-name">
      Pawan User
    </div>

    <div
      id="profileId"
      class="profile-id">
      ID: pawan
    </div>

    <div class="level-pill">
      ⭐ Level <span id="profileLevel">1</span>
    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <div
          id="following"
          class="stat-number">
          0
        </div>

        <div class="stat-name">
          Following
        </div>

      </div>

      <div class="stat">

        <div
          id="followers"
          class="stat-number">
          0
        </div>

        <div class="stat-name">
          Followers
        </div>

      </div>

      <div class="stat">

        <div
          id="coins"
          class="stat-number">
          0
        </div>

        <div class="stat-name">
          Coins
        </div>

      </div>

    </div>

  </section>


  <!-- EXP -->

  <section class="exp-card">

    <div class="exp-top">

      <span>
        ⭐ Level <span id="expLevel">1</span>
      </span>

      <span id="expText">
        0 / 100 EXP
      </span>

    </div>

    <div class="exp-track">

      <div
        id="expBar"
        class="exp-bar">
      </div>

    </div>

    <div class="exp-info">

      <span>
        Current EXP
      </span>

      <span id="currentExp">
        0
      </span>

    </div>

  </section>


  <!-- EDIT PROFILE -->

  <section class="edit-card">

    <div class="section-title">
      ✏️ Edit Profile
    </div>

    <label class="label">
      Your Name
    </label>

    <input
      id="nameInput"
      class="input"
      maxlength="30"
      placeholder="Enter your name">

    <label class="label">
      Profile DP URL
    </label>

    <input
      id="dpInput"
      class="input"
      maxlength="500"
      placeholder="Paste image URL">

    <button
      class="save-btn"
      onclick="saveProfile()">
      Save Profile
    </button>

  </section>


  <!-- MENU -->

  <section class="menu-card">

    <button
      class="menu"
      onclick="openLevel()">

      <div class="menu-icon">
        ⭐
      </div>

      <div class="menu-text">
        Level & EXP
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <button
      class="menu"
      onclick="showToast('CP Space next module')">

      <div class="menu-icon">
        💕
      </div>

      <div class="menu-text">
        CP Space
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <button
      class="menu"
      onclick="showToast('Store next module')">

      <div class="menu-icon">
        🛍️
      </div>

      <div class="menu-text">
        Store & Gifts
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <button
      class="menu"
      onclick="showToast('VIP next module')">

      <div class="menu-icon">
        👑
      </div>

      <div class="menu-text">
        VIP
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <button
      class="menu"
      onclick="showToast('Badge & Frame next module')">

      <div class="menu-icon">
        🏅
      </div>

      <div class="menu-text">
        Badge / Avatar Frame
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <button
      class="menu"
      onclick="showToast('Settings next module')">

      <div class="menu-icon">
        ⚙️
      </div>

      <div class="menu-text">
        Settings
      </div>

      <div class="arrow">
        ›
      </div>

    </button>

  </section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <button
    class="nav"
    onclick="goHome()">

    <span class="nav-icon">
      🏠
    </span>

    <span class="nav-text">
      Home
    </span>

  </button>


  <button
    class="nav"
    onclick="openInbox()">

    <span class="nav-icon">
      💌
    </span>

    <span class="nav-text">
      Inbox
    </span>

  </button>


  <button
    class="nav active">

    <span class="nav-icon">
      👤
    </span>

    <span class="nav-text">
      Profile
    </span>

  </button>

</nav>


<div
  id="toast"
  class="toast">
</div>


<script src="user.js"></script>

<script>

const DEFAULT_DP =
  "https://i.pravatar.cc/200?img=12";

let currentUser = {
  userId:"pawan",
  name:"Pawan User",
  dp:DEFAULT_DP,
  level:1,
  exp:0,
  coins:0,
  following:0,
  followers:0
};


/* =========================
   LOAD USER
========================= */

async function loadProfile(){

  try{

    if(
      typeof pvLoadUser ===
      "function"
    ){

      const user =
        await pvLoadUser();

      if(user){
        currentUser = user;
      }

    }

  }catch(error){

    console.error(
      "Profile load:",
      error
    );

  }

  renderProfile();

}


/* =========================
   RENDER
========================= */

function renderProfile(){

  const name =
    currentUser.name ||
    "Pawan User";

  const dp =
    currentUser.dp ||
    DEFAULT_DP;

  const level =
    Number(
      currentUser.level || 1
    );

  const exp =
    Number(
      currentUser.exp || 0
    );

  const coins =
    Number(
      currentUser.coins || 0
    );

  const following =
    Number(
      currentUser.following || 0
    );

  const followers =
    Number(
      currentUser.followers || 0
    );


  document.getElementById(
    "profileDP"
  ).src =
    dp;


  document.getElementById(
    "profileName"
  ).textContent =
    name;


  document.getElementById(
    "profileId"
  ).textContent =
    "ID: " +
    (
      currentUser.userId ||
      "pawan"
    );


  document.getElementById(
    "profileLevel"
  ).textContent =
    level;


  document.getElementById(
    "following"
  ).textContent =
    following;


  document.getElementById(
    "followers"
  ).textContent =
    followers;


  document.getElementById(
    "coins"
  ).textContent =
    coins;


  document.getElementById(
    "nameInput"
  ).value =
    name;


  document.getElementById(
    "dpInput"
  ).value =
    dp;


  updateEXP(
    level,
    exp
  );

}


/* =========================
   EXP
========================= */

function updateEXP(
  level,
  exp
){

  /*
    हर level के लिए
    100 EXP example.
    बाद में पूरा level table
    add करेंगे.
  */

  const needed =
    100;

  const progress =
    Math.max(
      0,
      Math.min(
        100,
        (exp / needed) * 100
      )
    );


  document.getElementById(
    "expLevel"
  ).textContent =
    level;


  document.getElementById(
    "currentExp"
  ).textContent =
    exp;


  document.getElementById(
    "expText"
  ).textContent =
    exp +
    " / " +
    needed +
    " EXP";


  document.getElementById(
    "expBar"
  ).style.width =
    progress +
    "%";

}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  const name =
    document.getElementById(
      "nameInput"
    ).value.trim();

  const dp =
    document.getElementById(
      "dpInput"
    ).value.trim();


  if(!name){

    showToast(
      "Name खाली नहीं हो सकता"
    );

    return;

  }


  const updated = {

    ...currentUser,

    userId:
      currentUser.userId ||
      "pawan",

    name,

    dp:
      dp ||
      DEFAULT_DP,

    level:
      Number(
        currentUser.level || 1
      ),

    exp:
      Number(
        currentUser.exp || 0
      ),

    coins:
      Number(
        currentUser.coins || 0
      ),

    following:
      Number(
        currentUser.following || 0
      ),

    followers:
      Number(
        currentUser.followers || 0
      )

  };


  try{

    if(
      typeof pvSaveUser !==
      "function"
    ){

      throw new Error(
        "user.js not loaded"
      );

    }


    const saved =
      await pvSaveUser(
        updated
      );


    currentUser =
      saved ||
      updated;


    renderProfile();


    showToast(
      "Profile updated ✅"
    );


  }catch(error){

    console.error(
      "Profile save:",
      error
    );


    /*
      Local fallback
      ताकि Home पर भी
      तुरंत नाम/DP दिखे.
    */

    currentUser =
      updated;


    if(
      typeof pvSaveLocalUser ===
      "function"
    ){

      pvSaveLocalUser(
        updated
      );

    }


    renderProfile();


    showToast(
      "Profile saved locally"
    );

  }

}


/* =========================
   DP PREVIEW
========================= */

document.getElementById(
  "dpInput"
).addEventListener(
  "input",
  function(){

    const url =
      this.value.trim();

    if(url){

      document.getElementById(
        "profileDP"
      ).src =
        url;

    }

  }
);


/* =========================
   DP FOCUS
========================= */

function focusDP(){

  const input =
    document.getElementById(
      "dpInput"
    );

  input.focus();

  input.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =========================
   NAVIGATION
========================= */

function goHome(){

  location.href =
    "index.html";

}


function openInbox(){

  location.href =
    "inbox.html";

}


function openLevel(){

  /*
    जब level.html बनेगा,
    यही button वहाँ जाएगा.
  */

  location.href =
    "level.html";

}


/* =========================
   TOAST
========================= */

function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    text;

  toast.style.display =
    "block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      function(){

        toast.style.display =
          "none";

      },
      2200
    );

}


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
  </html>
