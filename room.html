<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PawanVoice Room</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:#090b12;
  color:#fff;
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%,#26234d 0,#111322 35%,#090b12 70%);
  position:relative;
  overflow:hidden;
}

/* HEADER */
.header{
  height:72px;
  display:flex;
  align-items:center;
  padding:8px 10px;
  gap:9px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.room-dp{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ffcc66;
}
.room-info{
  flex:1;
  min-width:0;
}
.room-name{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.room-id{
  font-size:11px;
  color:#aeb3c8;
  margin-top:4px;
}
.header-actions{
  display:flex;
  gap:5px;
}
.icon-btn{
  width:39px;
  height:39px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  color:#fff;
}

/* TOP */
.room-status{
  padding:7px 12px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#bfc3d7;
}
.online{
  color:#5cff9a;
}

/* SEATS */
.seats{
  padding:8px 13px 2px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px 8px;
}
.seat-wrap{
  min-width:0;
  text-align:center;
}
.seat-wrap.host{
  grid-column:1 / 5;
}
.seat{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.host .seat{
  width:78px;
  height:78px;
}
.seat.empty{
  border:2px dashed #555b72;
  background:rgba(255,255,255,.04);
  color:#9298ae;
  font-size:25px;
}
.seat.occupied{
  border:3px solid #ffc95c;
  background:#202439;
}
.seat img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}
.mic-badge{
  position:absolute;
  right:-2px;
  bottom:0;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#242838;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}
.user-name{
  margin-top:5px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.user-level{
  color:#ffc95c;
  font-size:9px;
  margin-top:2px;
}
.host-tag{
  position:absolute;
  top:-7px;
  left:50%;
  transform:translateX(-50%);
  background:#ffb52e;
  color:#241500;
  border-radius:9px;
  padding:2px 6px;
  font-size:8px;
  font-weight:bold;
}

/* FEATURES */
.features{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:11px 9px;
}
.feature{
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  padding:9px 2px;
  font-size:9px;
}
.feature span{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

/* EXP */
.exp-box{
  margin:3px 11px 9px;
  padding:10px;
  background:rgba(255,255,255,.06);
  border-radius:14px;
}
.exp-title{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#c5c9da;
}
.exp-bar{
  height:7px;
  margin-top:7px;
  background:#303449;
  border-radius:10px;
  overflow:hidden;
}
.exp-fill{
  height:100%;
  width:35%;
  background:linear-gradient(90deg,#ffbd4a,#ff55b6);
}

/* CHAT */
.chat-area{
  margin:0 10px 115px;
  min-height:100px;
  max-height:230px;
  overflow-y:auto;
  padding:4px;
}
.message{
  padding:5px 8px;
  font-size:12px;
  color:#e8eaf3;
}
.message b{
  color:#ffcf6b;
}
.system-msg{
  color:#858ba1;
}

/* BOTTOM */
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:rgba(12,14,24,.97);
  border-top:1px solid rgba(255,255,255,.1);
  padding:8px 9px 10px;
  z-index:50;
}
.bottom-row{
  display:flex;
  align-items:center;
  gap:6px;
}
.chat-input{
  flex:1;
  height:42px;
  border:0;
  outline:0;
  border-radius:22px;
  padding:0 14px;
  background:#202436;
  color:#fff;
}
.bottom-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#24283b;
  color:#fff;
}
.gift-main{
  background:linear-gradient(135deg,#ffbd43,#ff5d9e);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}
.modal.show{
  display:flex;
}
.sheet{
  width:min(520px,100%);
  max-height:86vh;
  background:#141726;
  border-radius:22px 22px 0 0;
  padding:14px;
  overflow:auto;
}
.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.sheet-title{
  font-size:18px;
  font-weight:bold;
}
.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#292d40;
  color:#fff;
}

/* GIFT */
.wallet{
  background:linear-gradient(135deg,#252a42,#191c2d);
  border-radius:14px;
  padding:10px;
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}
.wallet small{
  color:#aeb3c8;
}
.wallet strong{
  display:block;
  margin-top:3px;
}

.gift-search{
  width:100%;
  height:40px;
  border:1px solid #33384f;
  background:#0e101a;
  color:#fff;
  border-radius:12px;
  padding:0 12px;
  outline:0;
  margin-bottom:9px;
}

.categories{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:8px;
}
.categories button{
  flex:0 0 auto;
  border:0;
  padding:8px 12px;
  border-radius:20px;
  color:#ddd;
  background:#252a3c;
  font-size:11px;
}
.categories button.active{
  background:#ffb947;
  color:#251600;
  font-weight:bold;
}

.gift-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.gift-card{
  border:1px solid rgba(255,255,255,.07);
  background:#1c2031;
  border-radius:14px;
  padding:8px 4px;
  text-align:center;
  min-height:112px;
}
.gift-icon{
  font-size:34px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.gift-name{
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:3px;
}
.gift-price{
  color:#ffc65b;
  font-size:10px;
  margin-top:3px;
}
.gift-card button{
  margin-top:5px;
  border:0;
  border-radius:10px;
  background:#30364d;
  color:#fff;
  padding:5px 9px;
  font-size:9px;
}
.gift-card button:active{
  transform:scale(.96);
}

/* SEND GIFT */
.receiver-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:8px 0 12px;
}
.receiver{
  border:1px solid #34394f;
  background:#1c2030;
  border-radius:12px;
  padding:7px 3px;
  color:#fff;
  text-align:center;
}
.receiver.selected{
  border-color:#ffc65b;
  background:#302a20;
}
.receiver img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}
.receiver div{
  font-size:9px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  margin-top:3px;
}
.qty-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#1d2131;
  padding:8px;
  border-radius:12px;
  margin-top:8px;
}
.qty-row button{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#30364b;
  color:#fff;
}
.qty-value{
  font-size:18px;
  font-weight:bold;
}
.send-btn{
  width:100%;
  height:46px;
  border:0;
  border-radius:14px;
  margin-top:10px;
  background:linear-gradient(135deg,#ffbf48,#ff559d);
  color:#201000;
  font-weight:bold;
}

/* EMOJI */
.emoji-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
}
.emoji-grid button{
  height:42px;
  border:0;
  background:#202438;
  border-radius:10px;
  font-size:21px;
}

/* TOAST */
.toast{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  background:#252a3c;
  color:#fff;
  padding:10px 15px;
  border-radius:12px;
  z-index:300;
  display:none;
  font-size:12px;
}
.toast.show{
  display:block;
}

/* GIFT ANIMATION */
.gift-animation{
  position:fixed;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%) scale(.4);
  z-index:250;
  display:none;
  text-align:center;
  pointer-events:none;
}
.gift-animation.show{
  display:block;
  animation:giftPop 1.6s ease forwards;
}
.gift-animation .big{
  font-size:90px;
}
.gift-animation .txt{
  font-size:17px;
  font-weight:bold;
  text-shadow:0 2px 10px #000;
}
@keyframes giftPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  70%{opacity:1;transform:translate(-50%,-55%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-65%) scale(.8)}
}

/* PROFILE */
.profile-card{
  text-align:center;
}
.profile-card img{
  width:76px;
  height:76px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ffc65b;
}
.profile-name{
  font-size:18px;
  font-weight:bold;
  margin-top:7px;
}
.profile-id{
  color:#969caf;
  font-size:11px;
  margin-top:3px;
}
.profile-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}
.profile-actions button{
  border:0;
  border-radius:12px;
  background:#252a3d;
  color:#fff;
  padding:12px;
}

/* RESPONSIVE */
@media(max-width:360px){
  .gift-grid{
    grid-template-columns:repeat(3,1fr);
  }
  .seats{
    gap:11px 4px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <img id="roomDp" class="room-dp"
         src="https://i.pravatar.cc/200?img=12">

    <div class="room-info">
      <div id="roomName" class="room-name">PawanVoice Room</div>
      <div id="roomId" class="room-id">Room: ---</div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="inviteRoom()">↗</button>
      <button class="icon-btn" onclick="openSettings()">⚙</button>
    </div>
  </header>

  <div class="room-status">
    <span>🎙️ <span id="seatCount">1/9</span></span>
    <span class="online">● Live</span>
  </div>

  <!-- 9 SEATS -->
  <section id="seats" class="seats"></section>

  <!-- ROOM FEATURES -->
  <section class="features">
    <button class="feature" onclick="roomSupport()">
      <span>❤️</span>Support
    </button>

    <button class="feature" onclick="luckyWheel()">
      <span>🎡</span>Lucky
    </button>

    <button class="feature" onclick="bountyHunter()">
      <span>🎯</span>Bounty
    </button>

    <button class="feature" onclick="roomReward()">
      <span>🎁</span>Reward
    </button>

    <button class="feature" onclick="exclusive()">
      <span>🎉</span>Benefits
    </button>
  </section>

  <!-- EXP -->
  <section class="exp-box">
    <div class="exp-title">
      <span>🚀 Room EXP</span>
      <span id="expText">35%</span>
    </div>
    <div class="exp-bar">
      <div id="expFill" class="exp-fill"></div>
    </div>
  </section>

  <!-- CHAT -->
  <section id="chatArea" class="chat-area"></section>

</div>

<!-- BOTTOM BAR -->
<div class="bottom">
  <div class="bottom-row">

    <input id="chatInput"
           class="chat-input"
           placeholder="Say something..."
           maxlength="300">

    <button class="bottom-btn"
            onclick="openEmoji()">😊</button>

    <button class="bottom-btn gift-main"
            onclick="openGiftPanel()">🎁</button>

    <button id="speakerBtn"
            class="bottom-btn"
            onclick="toggleSpeaker()">🔊</button>

    <button id="micBtn"
            class="bottom-btn"
            onclick="toggleMic()">🎙️</button>

    <button class="bottom-btn"
            onclick="openMore()">⋮</button>

  </div>
</div>

<!-- GIFT MODAL -->
<div id="giftModal" class="modal">
  <div class="sheet">

    <div class="sheet-head">
      <div class="sheet-title">🎁 Gifts</div>
      <button class="close" onclick="closeModal('giftModal')">×</button>
    </div>

    <div class="wallet">
      <div>
        <small>Your Coins</small>
        <strong id="giftCoins">0 🪙</strong>
      </div>

      <div style="text-align:right">
        <small>Room</small>
        <strong id="giftRoomName">PawanVoice</strong>
      </div>
    </div>

    <input id="giftSearch"
           class="gift-search"
           placeholder="🔍 Search 60 gifts..."
           oninput="renderGifts()">

    <div id="categories" class="categories"></div>

    <div id="giftGrid" class="gift-grid"></div>

  </div>
</div>

<!-- SEND GIFT MODAL -->
<div id="sendGiftModal" class="modal">
  <div class="sheet">

    <div class="sheet-head">
      <div class="sheet-title">Send Gift</div>
      <button class="close"
              onclick="closeModal('sendGiftModal')">×</button>
    </div>

    <div id="selectedGiftBox"></div>

    <div style="font-size:12px;color:#aeb3c8;margin-top:10px">
      Select room user
    </div>

    <div id="receiverList" class="receiver-list"></div>

    <div class="qty-row">
      <button onclick="changeQty(-1)">−</button>
      <div>
        <div style="font-size:10px;color:#aeb3c8;text-align:center">
          Quantity
        </div>
        <div id="qtyValue" class="qty-value">1</div>
      </div>
      <button onclick="changeQty(1)">+</button>
    </div>

    <div id="totalGiftCost"
         style="text-align:center;margin-top:9px;color:#ffc65b">
      Total: 0 🪙
    </div>

    <button class="send-btn"
            onclick="sendSelectedGift()">
      🎁 SEND GIFT
    </button>

  </div>
</div>

<!-- EMOJI MODAL -->
<div id="emojiModal" class="modal">
  <div class="sheet">

    <div class="sheet-head">
      <div class="sheet-title">😊 Emoji</div>
      <button class="close"
              onclick="closeModal('emojiModal')">×</button>
    </div>

    <div id="emojiGrid" class="emoji-grid"></div>

  </div>
</div>

<!-- SETTINGS -->
<div id="settingsModal" class="modal">
  <div class="sheet">

    <div class="sheet-head">
      <div class="sheet-title">⚙ Room Settings</div>
      <button class="close"
              onclick="closeModal('settingsModal')">×</button>
    </div>

    <button class="profile-actions"
            style="width:100%;border:0;background:#252a3d;color:white;padding:13px;border-radius:12px"
            onclick="copyRoomLink()">
      🔗 Copy Room Link
    </button>

    <button style="width:100%;margin-top:8px;border:0;background:#252a3d;color:white;padding:13px;border-radius:12px"
            onclick="leaveRoom()">
      🚪 Leave Room
    </button>

  </div>
</div>

<!-- USER PROFILE -->
<div id="profileModal" class="modal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">User Profile</div>
      <button class="close"
              onclick="closeModal('profileModal')">×</button>
    </div>

    <div id="profileContent" class="profile-card"></div>
  </div>
</div>

<!-- MORE -->
<div id="moreModal" class="modal">
  <div class="sheet">

    <div class="sheet-head">
      <div class="sheet-title">More</div>
      <button class="close"
              onclick="closeModal('moreModal')">×</button>
    </div>

    <div class="profile-actions">
      <button onclick="openGiftPanel()">🎁 Gifts</button>
      <button onclick="openEmoji()">😊 Emoji</button>
      <button onclick="copyRoomLink()">🔗 Share</button>
      <button onclick="leaveRoom()">🚪 Leave</button>
    </div>

  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- GIFT ANIMATION -->
<div id="giftAnimation" class="gift-animation">
  <div id="giftAnimationIcon" class="big">🎁</div>
  <div id="giftAnimationText" class="txt">Gift Sent!</div>
</div>

/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(n){
  return Number(n || 0).toLocaleString("en-IN");
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => el.classList.remove("show"),2200);
}

function openModal(id){
  document.getElementById(id).classList.add("show");
}

function closeModal(id){
  document.getElementById(id).classList.remove("show");
}

/* =========================================================
   LOCAL USER
   ========================================================= */

function getLocalUser(){

  let user = {
    userId:
      localStorage.getItem("pv_userId") ||
      "pawan",

    name:
      localStorage.getItem("pv_name") ||
      "Pawan User",

    dp:
      localStorage.getItem("pv_dp") ||
      DEFAULT_DP,

    level:
      Number(localStorage.getItem("pv_level") || 1),

    exp:
      Number(localStorage.getItem("pv_exp") || 0),

    coins:
      Number(localStorage.getItem("pv_coins") || 0),

    diamonds:
      Number(localStorage.getItem("pv_diamonds") || 0),

    vipLevel:
      Number(localStorage.getItem("pv_vipLevel") || 0)
  };

  return user;
}

function saveLocalUser(){

  if(!me) return;

  localStorage.setItem("pv_userId",me.userId);
  localStorage.setItem("pv_name",me.name);
  localStorage.setItem("pv_dp",me.dp);
  localStorage.setItem("pv_level",me.level);
  localStorage.setItem("pv_exp",me.exp);
  localStorage.setItem("pv_coins",me.coins);
  localStorage.setItem("pv_diamonds",me.diamonds);
  localStorage.setItem("pv_vipLevel",me.vipLevel);
}

/* =========================================================
   LOAD USER
   ========================================================= */

async function loadUser(){

  me = getLocalUser();

  try{

    const response =
      await fetch(
        FIREBASE_DB +
        "/users/" +
        encodeURIComponent(me.userId) +
        ".json"
      );

    if(response.ok){

      const firebaseUser =
        await response.json();

      if(firebaseUser){

        me = {
          ...me,
          ...firebaseUser,
          coins:Number(firebaseUser.coins ?? me.coins),
          diamonds:Number(firebaseUser.diamonds ?? me.diamonds),
          level:Number(firebaseUser.level ?? me.level),
          exp:Number(firebaseUser.exp ?? me.exp)
        };

        saveLocalUser();
      }
    }

  }catch(error){
    console.log("User load:",error);
  }
}

/* =========================================================
   SOCKET
   ========================================================= */

function connectSocket(){

  try{

    socket = io(SERVER_URL,{
      transports:["websocket","polling"]
    });

    socket.on("connect",()=>{

      console.log("Socket connected:",socket.id);

      socket.emit("join-room",{

        roomId:roomId,

        userId:me.userId,

        name:me.name,

        dp:me.dp,

        level:me.level,

        exp:me.exp,

        vipLevel:me.vipLevel,

        avatarFrame:
          me.avatarFrame || null,

        badge:
          me.badge || null,

        entryEffect:
          me.entryEffect || null
      });

      addSystemMessage(
        me.name + " joined the room"
      );

    });

    socket.on("room-state",(state)=>{
      roomState = state;
      renderRoom();
    });

    socket.on("roomState",(state)=>{
      roomState = state;
      renderRoom();
    });

    socket.on("chat-message",(data)=>{

      if(!data) return;

      addChatMessage(
        data.name || "User",
        data.text || ""
      );

    });

    socket.on("gift-received",(data)=>{
      handleLiveGift(data);
    });

    socket.on("gift",(data)=>{
      handleLiveGift(data);
    });

    socket.on("user-entry",(data)=>{

      if(data && data.name){

        addSystemMessage(
          data.name + " joined"
        );
      }

    });

    socket.on("user-left",(data)=>{

      if(data && data.name){

        addSystemMessage(
          data.name + " left"
        );
      }

    });

    socket.on("kicked",(data)=>{

      toast("You were removed from the room");

      setTimeout(()=>{
        location.href="/";
      },1200);

    });

    socket.on("mute-status",(data)=>{

      if(data && data.userId === me.userId){

        micOn = !data.muted;

        updateMicButton();
      }

    });

    socket.on("disconnect",()=>{

      console.log("Socket disconnected");

    });

  }catch(error){

    console.error(error);

    toast("Room server connection failed");
  }
}

/* =========================================================
   RENDER ROOM
   ========================================================= */

function renderRoom(){

  if(!roomState) return;

  const seats =
    roomState.seats || [];

  const users =
    roomState.users || {};

  const container =
    document.getElementById("seats");

  container.innerHTML = "";

  let occupied = 0;

  for(let i=0;i<9;i++){

    const userId =
      seats[i];

    const user =
      userId && users[userId]
        ? users[userId]
        : null;

    if(user) occupied++;

    const wrap =
      document.createElement("div");

    wrap.className =
      "seat-wrap" +
      (i===0 ? " host" : "");

    if(user){

      wrap.innerHTML = `

        <div
          class="seat occupied"
          onclick="openUserProfile('${esc(user.userId)}')">

          ${
            i===0
            ? `<div class="host-tag">HOST</div>`
            : ""
          }

          <img
            src="${esc(user.dp || DEFAULT_DP)}"
            onerror="this.src='${DEFAULT_DP}'">

          <div class="mic-badge">
            ${user.mic ? "🎙️" : "🔇"}
          </div>

        </div>

        <div class="user-name">
          ${esc(user.name || "User")}
        </div>

        <div class="user-level">
          Lv.${Number(user.level || 1)}
        </div>
      `;

    }else{

      wrap.innerHTML = `

        <div
          class="seat empty"
          onclick="takeSeat(${i})">
          +
        </div>

        <div class="user-name">
          Seat ${i+1}
        </div>

      `;
    }

    container.appendChild(wrap);
  }

  document.getElementById("seatCount").textContent =
    occupied + "/9";

  /* update room users for gift receiver list */
  updateReceiverList();
}

function renderCategories(){

      "Party",

      "Luxury",
      "Special",
      "Fantasy",
      "Fun"

    document.getElementById("categories");

    if(category === selectedCategory){

/* =========================================================
   RENDER ALL GIFTS
   ========================================================= */

function renderGifts(){

  const grid =
    document.getElementById("giftGrid");

  const search =
    (
      document.getElementById("giftSearch").value ||
      ""
    ).trim().toLowerCase();

  let gifts =
    GIFTS.filter(gift=>{

      const categoryOK =
        selectedCategory === "All" ||
        gift.cat === selectedCategory;

      const searchOK =
        !search ||
        gift.name.toLowerCase().includes(search) ||
        gift.cat.toLowerCase().includes(search);

      return categoryOK && searchOK;

    });

  grid.innerHTML = "";

  if(!gifts.length){

    grid.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:30px;
        color:#888fa5">
        No gift found
      </div>
    `;

    return;
  }

  gifts.forEach(gift=>{

    const card =
      document.createElement("div");

    card.className = "gift-card";

    card.innerHTML = `

      <div class="gift-icon">
        ${gift.icon}
      </div>

      <div class="gift-name">
        ${esc(gift.name)}
      </div>

      <div class="gift-price">
        ${money(gift.price)} 🪙
      </div>

      <button>
        Send
      </button>

    `;

    card.querySelector("button")
      .onclick = ()=>openSendGift(gift);

    grid.appendChild(card);

  });

}

/* =========================================================
   RECEIVERS
   ========================================================= */

function getRoomUsers(){

  if(!roomState) return [];

  const users =
    roomState.users || {};

  const result = [];

  Object.keys(users).forEach(id=>{

    if(id === me.userId) return;

    const user = users[id];

    if(user){

      result.push(user);
    }

  });

  return result;
}

function updateReceiverList(){

  const box =
    document.getElementById("receiverList");

  if(!box) return;

  const users =
    getRoomUsers();

  box.innerHTML = "";

  if(!users.length){

    box.innerHTML = `
      <div style="
        grid-column:1/-1;
        color:#8e95aa;
        font-size:11px;
        text-align:center;
        padding:15px">
        No other user in room
      </div>
    `;

    return;
  }

  users.forEach(user=>{

    const button =
      document.createElement("button");

    button.className =
      "receiver" +
      (
        selectedReceiver === user.userId
        ? " selected"
        : ""
      );

    button.innerHTML = `

      <img
        src="${esc(user.dp || DEFAULT_DP)}"
        onerror="this.src='${DEFAULT_DP}'">

      <div>
        ${esc(user.name || "User")}
      </div>
    `;

    button.onclick = ()=>{

      selectedReceiver =
        user.userId;

      updateReceiverList();

    };

    box.appendChild(button);

  });
}

/* =========================================================
   SEND GIFT
   ========================================================= */

async function sendSelectedGift(){

  if(!selectedGift){

    toast("Select a gift");

    return;
  }

  if(!selectedReceiver){

    toast("Select a room user");

    return;
  }

  if(selectedReceiver === me.userId){

    toast("You cannot gift yourself");

    return;
  }

  const total =
    selectedGift.price *
    giftQuantity;

  if(Number(me.coins || 0) < total){

    toast("Not enough coins");

    return;
  }

  const receiver =
    roomState &&
    roomState.users &&
    roomState.users[selectedReceiver];

  if(!receiver){

    toast("Receiver left the room");

    return;
  }

  try{

    const senderCoins =
      Number(me.coins || 0);

    const receiverResponse =
      await fetch(
        FIREBASE_DB +
        "/users/" +
        encodeURIComponent(selectedReceiver) +
        ".json"
      );

    let receiverData =
      await receiverResponse.json();

    if(!receiverData){

      receiverData = {
        userId:selectedReceiver,
        name:receiver.name || "User",
        dp:receiver.dp || DEFAULT_DP,
        coins:0
      };

    }

    const receiverCoins =
      Number(receiverData.coins || 0);

    const newSenderCoins =
      senderCoins - total;

    const newReceiverCoins =
      receiverCoins + total;

    /* sender */
    await firebasePatch(
      "/users/" +
      encodeURIComponent(me.userId),
      {
        coins:newSenderCoins
      }
    );

    /* receiver */
    await firebasePatch(
      "/users/" +
      encodeURIComponent(selectedReceiver),
      {
        coins:newReceiverCoins
      }
    );

    const transactionId =
      "gift_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8);

    const transaction = {

      transactionId,

      roomId,

      giftId:selectedGift.id,

      giftName:selectedGift.name,

      giftIcon:selectedGift.icon,

      giftPrice:selectedGift.price,

      quantity:giftQuantity,

      totalCoins:total,

      senderId:me.userId,

      senderName:me.name,

      senderDp:me.dp,

      receiverId:selectedReceiver,

      receiverName:receiver.name || "User",

      receiverDp:receiver.dp || DEFAULT_DP,

      time:Date.now()

    };

    await firebasePut(
      "/giftTransactions/" +
      transactionId,
      transaction
    );

    await firebasePut(
      "/coinTransactions/" +
      transactionId +
      "_S",
      {
        type:"gift_sent",
        ...transaction,
        coins:-total
      }
    );

    await firebasePut(
      "/coinTransactions/" +
      transactionId +
      "_R",
      {
        type:"gift_received",
        ...transaction,
        coins:total
      }
    );

    await firebasePut(
      "/notifications/" +
      encodeURIComponent(selectedReceiver) +
      "/" +
      transactionId,
      {
        type:"gift",
        text:
          me.name +
          " sent " +
          selectedGift.icon +
          " " +
          selectedGift.name +
          " x" +
          giftQuantity,

        fromUserId:me.userId,

        fromName:me.name,

        fromDp:me.dp,

        giftName:selectedGift.name,

        giftIcon:selectedGift.icon,

        quantity:giftQuantity,

        coins:total,

        time:Date.now(),

        read:false
      }
    );

    me.coins =
      newSenderCoins;

    saveLocalUser();

    document.getElementById("giftCoins").textContent =
      money(me.coins) + " 🪙";

    if(socket){

      socket.emit("send-gift",{

        roomId,

        userId:me.userId,

        name:me.name,

        gift:{

          ...transaction

        }

      });

    }

    showGiftAnimation(
      selectedGift,
      me.name,
      receiver.name || "User",
      giftQuantity
    );

    addSystemMessage(
      me.name +
      " sent " +
      selectedGift.icon +
      " " +
      selectedGift.name +
      " x" +
      giftQuantity
    );

    closeModal("sendGiftModal");

    toast("Gift sent successfully 🎁");

  }catch(error){

    console.error("Gift error:",error);

    toast("Gift failed. Try again.");
  }
}

/* =========================================================
   FIREBASE HELPERS
   ========================================================= */

async function firebasePatch(path,data){

  const response =
    await fetch(
      FIREBASE_DB +
      path +
      ".json",
      {
        method:"PATCH",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
      }
    );

  if(!response.ok){

    throw new Error(
      "Firebase PATCH " +
      response.status
    );
  }

  return response.json();
}

async function firebasePut(path,data){

  const response =
    await fetch(
      FIREBASE_DB +
      path +
      ".json",
      {
        method:"PUT",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
      }
    );

  if(!response.ok){

    throw new Error(
      "Firebase PUT " +
      response.status
    );
  }

  return response.json();
}

/* =========================================================
   LIVE GIFT
   ========================================================= */

const shownGiftTransactions =
  new Set();

function handleLiveGift(data){

  if(!data) return;

  const gift =
    data.gift || data;

  const transactionId =
    gift.transactionId ||
    data.transactionId;

  if(transactionId){

    if(shownGiftTransactions.has(transactionId)){
      return;
    }

    shownGiftTransactions.add(transactionId);

    if(shownGiftTransactions.size > 200){

      const first =
        shownGiftTransactions.values().next().value;

      shownGiftTransactions.delete(first);
    }
  }

  const giftObject = {

    icon:
      gift.giftIcon ||
      gift.icon ||
      "🎁",

    name:
      gift.giftName ||
      gift.name ||
      "Gift",

    quantity:
      Number(gift.quantity || 1)

  };

  showGiftAnimation(

    giftObject,

    gift.senderName ||
    data.senderName ||
    "User",

    gift.receiverName ||
    data.receiverName ||
    "User",

    giftObject.quantity

  );

}

/* =========================================================
   GIFT ANIMATION
   ========================================================= */

function showGiftAnimation(
  gift,
  sender,
  receiver,
  quantity
){

  const box =
    document.getElementById("giftAnimation");

  document.getElementById("giftAnimationIcon")
    .textContent =
      gift.icon || "🎁";

  document.getElementById("giftAnimationText")
    .textContent =
      sender +
      " → " +
      receiver +
      "  " +
      (gift.icon || "") +
      " x" +
      quantity;

  box.classList.remove("show");

  void box.offsetWidth;

  box.classList.add("show");

  clearTimeout(window.__giftTimer);

  window.__giftTimer =
    setTimeout(()=>{
      box.classList.remove("show");
    },1700);
}

function addChatMessage(name,text){

  const area =
    document.getElementById("chatArea");

  const div =
    document.createElement("div");

  div.className = "message";

  div.innerHTML =
    "<b>" +
    esc(name) +
    ":</b> " +
    esc(text);

  area.appendChild(div);

  while(area.children.length > 80){

    area.removeChild(
      area.firstChild
    );
  }

  area.scrollTop =
    area.scrollHeight;
}

function addSystemMessage(text){

  const area =
    document.getElementById("chatArea");

  const div =
    document.createElement("div");

  div.className =
    "message system-msg";

  div.textContent =
    "• " + text;

  area.appendChild(div);

  area.scrollTop =
    area.scrollHeight;
}

function sendChat(){

  const input =
    document.getElementById("chatInput");

  const text =
    input.value.trim();

  if(!text) return;

  if(socket){

    socket.emit("chat-message",{

      roomId,

      userId:me.userId,

      name:me.name,

      dp:me.dp,

      text

    });

  }else{

    addChatMessage(
      me.name,
      text
    );
  }

  input.value = "";
}

document.getElementById("chatInput")
  .addEventListener("keydown",event=>{

    if(event.key === "Enter"){

      event.preventDefault();

      sendChat();
    }

  });

/* =========================================================
   MIC
   ========================================================= */

async function startMicrophone(){

  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

      toast("Microphone not supported");

      return;
    }

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:false
      });

    localStream
      .getAudioTracks()
      .forEach(track=>{
        track.enabled = true;
      });

    micOn = true;

    updateMicButton();

    if(socket){

      socket.emit("mic-status",{

        roomId,

        userId:me.userId,

        mic:true

      });

    }

    toast("Microphone ON 🎙️");

  }catch(error){

    console.error(error);

    toast("Microphone permission denied");

    micOn = false;

    updateMicButton();
  }
}

function toggleMic(){

  if(!localStream){

    startMicrophone();

    return;
  }

  micOn = !micOn;

  localStream
    .getAudioTracks()
    .forEach(track=>{
      track.enabled = micOn;
    });

  updateMicButton();

  if(socket){

    socket.emit("mic-status",{

      roomId,

      userId:me.userId,

      mic:micOn

    });

  }
}

function updateMicButton(){

  const button =
    document.getElementById("micBtn");

  button.textContent =
    micOn ? "🎙️" : "🔇";
}

/* =========================================================
   BASIC WEBRTC
   ========================================================= */

let rtcConfig = {

  iceServers:[
    {
      urls:"stun:stun.l.google.com:19302"
    }
  ]

};

async function loadRtcConfig(){

  try{

    const response =
      await fetch("/rtc-config");

    if(!response.ok) return;

    const config =
      await response.json();

    if(config &&
       Array.isArray(config.iceServers)){

      rtcConfig =
        config;

    }

  }catch(error){

    console.log("RTC config:",error);
  }
}

async function createPeer(
  socketId,
  userId,
  initiator
){

  if(!socketId ||
     socketId === socket.id){

    return;
  }

  if(peers[socketId]){

    return peers[socketId].pc;
  }

  const pc =
    new RTCPeerConnection(
      rtcConfig
    );

  peers[socketId] = {
    pc,
    userId
  };

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        pc.addTrack(
          track,
          localStream
        );
      });

  }

  pc.onicecandidate =
    event=>{

      if(!event.candidate) return;

      socket.emit("ice-candidate",{

        roomId,

        targetSocketId:socketId,

        candidate:event.candidate

      });

    };

  pc.ontrack =
    event=>{

      let audio =
        document.getElementById(
          "remote-" + socketId
        );

      if(!audio){

        audio =
          document.createElement("audio");

        audio.id =
          "remote-" + socketId;

        audio.autoplay = true;

        audio.playsInline = true;

        document.body.appendChild(audio);
      }

      audio.srcObject =
        event.streams[0];

      audio.muted =
        !speakerOn;

    };

  pc.onconnectionstatechange =
    ()=>{

      if([
        "failed",
        "closed",
        "disconnected"
      ].includes(pc.connectionState)){

        cleanupPeer(socketId);
      }

    };

  if(initiator){

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    socket.emit("webrtc-offer",{

      roomId,

      targetSocketId:socketId,

      offer

    });

  }

  return pc;
}

async function handleOffer(data){

  if(!data ||
     !data.fromSocketId){

    return;
  }

  const pc =
    await createPeer(
      data.fromSocketId,
      data.fromUserId || "",
      false
    );

  await pc.setRemoteDescription(
    new RTCSessionDescription(
      data.offer
    )
  );

  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(
    answer
  );

  socket.emit("webrtc-answer",{

    roomId,

    targetSocketId:data.fromSocketId,

    answer

  });
}

async function handleAnswer(data){

  if(!data ||
     !data.fromSocketId){

    return;
  }

  const peer =
    peers[data.fromSocketId];

  if(!peer) return;

  await peer.pc.setRemoteDescription(
    new RTCSessionDescription(
      data.answer
    )
  );
}

async function handleIce(data){

  if(!data ||
     !data.fromSocketId){

    return;
  }

  const peer =
    peers[data.fromSocketId];

  if(!peer) return;

  try{

    await peer.pc.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );

  }catch(error){

    console.log("ICE:",error);
  }
}

function cleanupPeer(socketId){

  const peer =
    peers[socketId];

  if(!peer) return;

  try{
    peer.pc.close();
  }catch{}

  delete peers[socketId];

  const audio =
    document.getElementById(
      "remote-" + socketId
    );

  if(audio){

    audio.remove();
  }
}

/* =========================================================
   WEBRTC SOCKET EVENTS
   ========================================================= */

function setupWebRTCEvents(){

  if(!socket) return;

  socket.on("webrtc-offer",handleOffer);

  socket.on("webrtc-answer",handleAnswer);

  socket.on(
    "ice-candidate",
    handleIce
  );

  socket.on(
    "iceCandidate",
    handleIce
  );

  socket.on("user-entry",async data=>{

    if(!data ||
       !data.socketId ||
       data.socketId === socket.id){

      return;
    }

    /*
      Simple 9-user mesh.
      Existing user creates connection
      to newly joined user.
    */

    if(socket.id < data.socketId){

      try{

        await createPeer(
          data.socketId,
          data.userId || "",
          true
        );

      }catch(error){

        console.log(
          "Peer create:",
          error
        );
      }
    }

  });

}

async function copyRoomLink(){

    location.origin +
    "/room.html?room=" +
    encodeURIComponent(roomId);

  try{

    await navigator.clipboard.writeText(link);

    toast("Room link copied 🔗");

  }catch{

    prompt(
      "Copy this room link:",
      link
    );
  }
}

function leaveRoom(){

  if(socket){

    socket.emit("leave-room",{

      roomId,

      userId:me.userId

    });
  }

  Object.keys(peers)
    .forEach(cleanupPeer);

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>track.stop());

    localStream = null;
  }

  location.href = "/";
}
