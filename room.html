<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>PawanVoice Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#120b20;
 color:white;
 font-family:Arial,sans-serif;
}

.room{
 max-width:480px;
 min-height:100vh;
 margin:auto;
 position:relative;
 padding-bottom:75px;

 background:
 radial-gradient(
  circle at top,
  #63379b,
  #21132f 42%,
  #100817
 );
}

.header{
 height:70px;
 display:flex;
 align-items:center;
 gap:8px;
 padding:10px;
 background:#0004;
}

.back{
 border:0;
 background:#ffffff18;
 color:white;
 width:38px;
 height:38px;
 border-radius:50%;
 font-size:24px;
}

.roomdp{
 width:45px;
 height:45px;
 border-radius:50%;
 background:linear-gradient(135deg,#ff4c9d,#7337ff);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 overflow:hidden;
}

.roomdp img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.roominfo{
 flex:1;
}

.roominfo b{
 display:block;
 font-size:15px;
}

.roominfo small{
 color:#cfc4df;
}

.count{
 background:#0005;
 padding:6px 9px;
 border-radius:14px;
 font-size:12px;
}

.headerBtn{
 border:0;
 background:#ffffff15;
 color:white;
 width:36px;
 height:36px;
 border-radius:11px;
}

.status{
 text-align:center;
 padding:5px;
 font-size:11px;
 color:#bdb0d0;
}

.seats{
 padding:15px 10px;
}

.host{
 display:flex;
 justify-content:center;
 margin-bottom:25px;
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(4,1fr);

 gap:24px 7px;
}

.seat{
 text-align:center;
 min-width:0;
 cursor:pointer;
}

.avatar{
 width:58px;
 height:58px;
 margin:auto;

 border-radius:50%;

 border:2px solid #9868ff;

 background:#302044;

 display:flex;
 align-items:center;
 justify-content:center;

 overflow:hidden;

 font-weight:bold;
 font-size:18px;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.empty{
 border:2px dashed #ffffff35;
 color:#ffffff66;
}

.name{
 margin-top:5px;
 font-size:11px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.mic{
 font-size:10px;
 color:#7dffb2;
 margin-top:2px;
}

.tools{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
 padding:8px 10px;
}

.tool{
 border:0;
 background:#ffffff10;
 color:white;
 border-radius:12px;
 padding:9px 3px;
 font-size:10px;
}

.tool span{
 display:block;
 font-size:20px;
 margin-bottom:3px;
}

.exp{
 margin:8px 10px;
 padding:12px;
 border-radius:16px;
 background:linear-gradient(
  90deg,
  #522188,
  #a13b70
 );
}

.expTop{
 display:flex;
 justify-content:space-between;
 font-size:11px;
}

.rocket{
 font-size:25px;
 margin-top:5px;
}

.messages{
 height:120px;
 overflow-y:auto;
 padding:8px 12px;
}

.msg{
 margin:5px 0;
 font-size:12px;
 color:#e4dced;
}

.gift{
 color:#ffd66b;
}

.chat{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);

 width:min(480px,100%);

 display:flex;
 gap:5px;
 padding:8px;

 background:#0b0714ee;
}

.chat input{
 flex:1;
 min-width:0;

 border:0;
 outline:0;

 border-radius:20px;

 padding:11px 14px;

 color:white;
 background:#ffffff15;
}

.chat button{
 width:38px;
 height:38px;

 border:0;
 border-radius:50%;

 color:white;
 background:#ffffff15;
}

</style>
</head>

<body>

<div class="room">

<div class="header">

<button class="back"
onclick="leaveRoom()">‹</button>

<div class="roomdp" id="roomDp">
PV
</div>

<div class="roominfo">

<b id="roomName">
PawanVoice Room
</b>

<small id="roomNumber">
Room #10001
</small>

</div>

<div class="count"
id="count">
0/9
</div>

<button class="headerBtn"
onclick="settings()">⚙️</button>

<button class="headerBtn"
onclick="invite()">↗️</button>

</div>

<div class="status"
id="status">
Connecting...
</div>


<!-- HOST -->

<div class="seats">

<div class="host">

<div class="seat"
onclick="takeSeat(1)">

<div class="avatar empty"
id="avatar1">
+
</div>

<div class="name"
id="name1">
Seat 1
</div>

<div class="mic"
id="mic1">
</div>

</div>

</div>


<!-- SEATS 2-9 -->

<div class="grid">

<div class="seat" onclick="takeSeat(2)">
<div class="avatar empty" id="avatar2">+</div>
<div class="name" id="name2">Seat 2</div>
<div class="mic" id="mic2"></div>
</div>

<div class="seat" onclick="takeSeat(3)">
<div class="avatar empty" id="avatar3">+</div>
<div class="name" id="name3">Seat 3</div>
<div class="mic" id="mic3"></div>
</div>

<div class="seat" onclick="takeSeat(4)">
<div class="avatar empty" id="avatar4">+</div>
<div class="name" id="name4">Seat 4</div>
<div class="mic" id="mic4"></div>
</div>

<div class="seat" onclick="takeSeat(5)">
<div class="avatar empty" id="avatar5">+</div>
<div class="name" id="name5">Seat 5</div>
<div class="mic" id="mic5"></div>
</div>

<div class="seat" onclick="takeSeat(6)">
<div class="avatar empty" id="avatar6">+</div>
<div class="name" id="name6">Seat 6</div>
<div class="mic" id="mic6"></div>
</div>

<div class="seat" onclick="takeSeat(7)">
<div class="avatar empty" id="avatar7">+</div>
<div class="name" id="name7">Seat 7</div>
<div class="mic" id="mic7"></div>
</div>

<div class="seat" onclick="takeSeat(8)">
<div class="avatar empty" id="avatar8">+</div>
<div class="name" id="name8">Seat 8</div>
<div class="mic" id="mic8"></div>
</div>

<div class="seat" onclick="takeSeat(9)">
<div class="avatar empty" id="avatar9">+</div>
<div class="name" id="name9">Seat 9</div>
<div class="mic" id="mic9"></div>
</div>

</div>
</div>


<!-- FEATURES -->

<div class="tools">

<button class="tool">
<span>🛟</span>
Support
</button>

<button class="tool"
onclick="wheel()">
<span>🎡</span>
Wheel
</button>

<button class="tool">
<span>🎯</span>
Bounty
</button>

<button class="tool">
<span>🎁</span>
Reward
</button>

<button class="tool">
<span>⭐</span>
Benefits
</button>

</div>


<!-- EXP -->

<div class="exp">

<div class="expTop">
<span>🚀 EXP</span>
<span>TOP 1 • TOP 2 • TOP 3</span>
</div>

<div class="rocket">
🚀 ━━━━━━━━━━━
</div>

</div>


<!-- CHAT -->

<div class="messages"
id="messages">
</div>


<div class="chat">

<input
id="message"
placeholder="Say something..."
onkeydown="
if(event.key==='Enter')sendMessage()
">

<button onclick="emoji()">
😊
</button>

<button
id="micBtn"
onclick="toggleMic()">
🔇
</button>

<button onclick="showInbox()">
💌
</button>

<button onclick="more()">
•••
</button>

</div>

</div>


<script>

const SERVER =
"https://pawanvoice-1.onrender.com";


const params =
new URLSearchParams(
location.search
);


const ROOM_ID =
params.get("room") || "10001";


const ROOM_NAME =
params.get("name") ||
"PawanVoice Room";


const USER_NAME =
localStorage.getItem(
"pv_name"
) || "Pawan";


const USER_DP =
localStorage.getItem(
"pv_dp"
) || "";


let socket;

let mic = false;


document.getElementById(
"roomName"
).textContent =
ROOM_NAME;


document.getElementById(
"roomNumber"
).textContent =
"Room #"+ROOM_ID;


function connect(){

 socket = io(SERVER,{
   transports:[
     "websocket",
     "polling"
   ]
 });


 socket.on("connect",()=>{

   document.getElementById(
     "status"
   ).textContent =
   "Connected";

   socket.emit(
     "joinRoom",
     {
       roomId:ROOM_ID,
       name:USER_NAME,
       dp:USER_DP
     }
   );

 });


 socket.on("connect_error",()=>{

   document.getElementById(
     "status"
   ).textContent =
   "Connection failed";

 });


 socket.on("joined",data=>{

   renderRoom(
     data.room
   );

 });


 socket.on("roomState",room=>{

   renderRoom(room);

 });


 socket.on("userJoined",user=>{

   addMessage(
     "🟢 "+
     escapeHtml(user.name)+
     " joined"
   );

 });


 socket.on("userLeft",user=>{

   addMessage(
     "🔴 "+
     escapeHtml(user.name)+
     " left"
   );

 });


 socket.on("message",data=>{

   addMessage(
     "<b>"+
     escapeHtml(data.name)+
     ":</b> "+
     escapeHtml(data.message)
   );

 });


 socket.on("gift",data=>{

   addMessage(
     "<span class='gift'>🎁 "+
     escapeHtml(data.from)+
     " sent "+
     escapeHtml(data.giftName)+
     " to "+
     escapeHtml(data.to)+
     " ("+
     data.amount+
     " coins)</span>"
   );

 });

}


function renderRoom(room){

 const users =
 room.users || [];


 document.getElementById(
   "count"
 ).textContent =
 users.length+"/9";


 for(let i=1;i<=9;i++){

   const avatar =
   document.getElementById(
     "avatar"+i
   );

   const name =
   document.getElementById(
     "name"+i
   );

   const mic =
   document.getElementById(
     "mic"+i
   );

   avatar.classList.add(
     "empty"
   );

   avatar.innerHTML="+";

   name.textContent=
     "Seat "+i;

   mic.textContent="";
 }


 const seats =
 room.seats || [];


 seats.forEach(seat=>{

   const user =
   seat.user;

   if(!user)return;


   const avatar =
   document.getElementById(
     "avatar"+
     seat.seatNo
   );

   const name =
   document.getElementById(
     "name"+
     seat.seatNo
   );

   const mic =
   document.getElementById(
     "mic"+
     seat.seatNo
   );


   avatar.classList.remove(
     "empty"
   );


   if(user.dp){

     avatar.innerHTML=
       "<img src=\""+
       escapeAttr(user.dp)+
       "\">";

   }else{

     avatar.textContent=
       user.nickname
       .substring(0,2)
       .toUpperCase();

   }


   name.textContent =
     user.nickname;


   mic.textContent =
     user.mic
     ? "🎙️ ON"
     : "🔇 OFF";

 });

}


function takeSeat(seatNo){

 if(!socket)return;

 socket.emit(
   "takeSeat",
   {
     seatNo
   }
 );

}


function toggleMic(){

 mic=!mic;

 document.getElementById(
   "micBtn"
 ).textContent =
 mic ? "🎙️" : "🔇";


 socket.emit(
   "micStatus",
   {
     mic
   }
 );

}


function sendMessage(){

 const input =
 document.getElementById(
   "message"
 );


 const message =
 input.value.trim();


 if(!message)return;


 socket.emit(
   "message",
   {
     message
   }
 );


 input.value="";
}


function addMessage(text){

 const box =
 document.getElementById(
   "messages"
 );


 const div =
 document.createElement(
   "div"
 );


 div.className="msg";

 div.innerHTML=text;

 box.appendChild(div);

 box.scrollTop =
 box.scrollHeight;

}


function emoji(){

 const e =
 prompt(
 "Emoji 😀 😂 😍 😘 😭 😡 😴 👻 😎 🤔 🥳 🤑 ❤️"
 );


 if(e){

   document.getElementById(
     "message"
   ).value += e;

 }

}


function invite(){

 const link =
 location.href;


 if(navigator.clipboard){

   navigator.clipboard
   .writeText(link);

   alert(
     "Room link copied!"
   );

 }else{

   alert(link);

 }

}


function leaveRoom(){

 if(socket){

   socket.emit(
     "leaveRoom"
   );

   socket.disconnect();

 }

 location.href=
 "index.html";

}


function settings(){

 alert(
 "PawanVoice Room Settings\n\n"+
 "Host controls coming next."
 );

}


function wheel(){

 alert(
 "Lucky Wheel"
 );

}


function showInbox(){

 alert(
 "Inbox"
 );

}


function more(){

 alert(
 "More\n\n"+
 "Share\n"+
 "Gift Bag\n"+
 "Report\n"+
 "Admin"
 );

}


function escapeHtml(str){

 return String(str)
 .replace(
   /[&<>"']/g,
   m=>({
     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#039;"
   }[m])
 );

}


function escapeAttr(str){

 return String(str)
 .replace(
   /"/g,
   "&quot;"
 );

}


connect();

</script>

</body>
</html>
