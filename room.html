<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PawanVoice Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:#09051b;
}

body{
  background:
    radial-gradient(
      circle at 50% 10%,
      #392277,
      #171044 40%,
      #09051b 80%
    );
}

button{
  border:0;
  color:#fff;
}

.app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

/* HEADER */

.header{
  height:76px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 11px;
  background:rgba(17,9,43,.85);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.back{
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  font-size:23px;
}

.roomDp{
  width:46px;
  height:46px;
  border-radius:14px;
  object-fit:cover;
}

.roomInfo{
  flex:1;
  min-width:0;
}

.roomName{
  font-size:16px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomId{
  margin-top:4px;
  font-size:10px;
  opacity:.5;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:5px;
}

.count{
  font-size:10px;
  padding:7px 8px;
  border-radius:14px;
  background:rgba(255,255,255,.1);
}

.hBtn{
  width:35px;
  height:35px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
}

/* CONTENT */

.content{
  height:calc(100% - 76px);
  overflow-y:auto;
  padding:12px 10px 88px;
}

.content::-webkit-scrollbar{
  display:none;
}

/* HOST */

.hostArea{
  display:flex;
  justify-content:center;
  margin-bottom:17px;
}

.seat{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:65px;
}

.avatarWrap{
  width:63px;
  height:63px;
  padding:3px;
  border-radius:50%;
  background:linear-gradient(
    135deg,
    #ffd66b,
    #b05fff,
    #568cff
  );
  position:relative;
}

.hostSeat .avatarWrap{
  width:83px;
  height:83px;
}

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#251c42;
}

.crown{
  position:absolute;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
}

.mic{
  position:absolute;
  right:-2px;
  bottom:0;
  width:22px;
  height:22px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#17102f;
  border:2px solid #09051b;
  font-size:10px;
}

.userName{
  margin-top:7px;
  max-width:88px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;
}

.seatNo{
  font-size:9px;
  opacity:.4;
  margin-top:3px;
}

/* GRID */

.seatGrid{
  max-width:430px;
  margin:auto;
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:21px 3px;
}

.emptySeat .avatarWrap{
  background:rgba(255,255,255,.07);
  border:2px dashed rgba(255,255,255,.13);
  padding:2px;
}

.emptyIcon{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:22px;
  color:rgba(255,255,255,.3);
}

/* FEATURES */

.features{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:23px;
  padding-bottom:5px;
}

.features::-webkit-scrollbar{
  display:none;
}

.feature{
  flex:0 0 auto;
  padding:9px 12px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.06);
  font-size:10px;
}

/* EXP */

.exp{
  margin-top:8px;
  padding:11px;
  border-radius:17px;
  background:
    linear-gradient(
      90deg,
      rgba(106,58,205,.4),
      rgba(45,105,194,.2)
    );
}

.expTop{
  display:flex;
  justify-content:space-between;
  font-size:11px;
}

.bar{
  height:7px;
  margin-top:8px;
  border-radius:7px;
  background:rgba(255,255,255,.1);
  overflow:hidden;
}

.fill{
  width:38%;
  height:100%;
  border-radius:7px;
  background:linear-gradient(
    90deg,
    #ffc94d,
    #ae64e9
  );
}

.rank{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-size:9px;
  opacity:.6;
}

/* CHAT */

.chat{
  margin-top:12px;
  max-height:120px;
  overflow-y:auto;
}

.chat::-webkit-scrollbar{
  display:none;
}

.msg{
  margin:5px 0;
}

.msgBubble{
  display:inline-block;
  padding:7px 10px;
  border-radius:13px;
  background:rgba(0,0,0,.28);
  font-size:11px;
  max-width:85%;
}

.msgBubble b{
  color:#e3b8ff;
}

/* BOTTOM */

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  min-height:72px;
  padding:9px 8px
    calc(9px + env(safe-area-inset-bottom));
  background:rgba(10,6,29,.96);
  backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  gap:5px;
  z-index:20;
}

.inputWrap{
  flex:1;
  height:41px;
  border-radius:22px;
  background:rgba(255,255,255,.08);
}

.input{
  width:100%;
  height:100%;
  padding:0 13px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
}

.input::placeholder{
  color:rgba(255,255,255,.4);
}

.icon{
  width:39px;
  height:39px;
  flex:0 0 39px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  font-size:17px;
}

/* EMOJI */

.emojiPanel{
  position:absolute;
  left:8px;
  right:8px;
  bottom:78px;
  padding:10px;
  border-radius:19px;
  background:#17102f;
  border:1px solid rgba(255,255,255,.1);
  display:none;
  z-index:30;
}

.emojiPanel.show{
  display:block;
}

.emojis{
  display:grid;
  grid-template-columns:
    repeat(8,1fr);
  gap:6px;
  max-height:190px;
  overflow-y:auto;
}

.emoji{
  height:36px;
  border-radius:9px;
  background:rgba(255,255,255,.06);
  font-size:20px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.65);
  z-index:60;
}

.modal.show{
  display:flex;
}

.box{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:18px;
  border-radius:24px 24px 0 0;
  background:#18102f;
  max-height:80vh;
  overflow-y:auto;
}

.close{
  float:right;
  width:33px;
  height:33px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  color:#fff;
}

.title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

.profile{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile img{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
}

.profileName{
  font-weight:bold;
}

.profileId{
  font-size:10px;
  opacity:.5;
  margin-top:4px;
}

.action{
  width:100%;
  height:43px;
  margin-top:8px;
  border-radius:13px;
  text-align:left;
  padding:0 12px;
  background:rgba(255,255,255,.08);
}

.danger{
  background:rgba(255,50,70,.13);
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  background:#09051b;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:100;
}

.loading b{
  font-size:27px;
}

.loading span{
  margin-top:8px;
  font-size:11px;
  opacity:.55;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:rgba(20,15,35,.96);
  padding:10px 14px;
  border-radius:20px;
  font-size:11px;
  opacity:0;
  z-index:100;
  pointer-events:none;
}

.toast.show{
  opacity:1;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <button
      class="back"
      onclick="goHome()">
      ‹
    </button>


    <img
      id="roomDp"
      class="roomDp"
      src=""
      alt="Room">


    <div class="roomInfo">

      <div
        id="roomName"
        class="roomName">
        PawanVoice Room
      </div>

      <div
        id="roomId"
        class="roomId">
        Room:
      </div>

    </div>


    <div class="headerRight">

      <div
        id="count"
        class="count">
        0/9
      </div>

      <button
        class="hBtn"
        onclick="openSettings()">
        ⚙️
      </button>

      <button
        class="hBtn"
        onclick="inviteRoom()">
        ↗️
      </button>

    </div>

  </div>


  <!-- CONTENT -->

  <div class="content">

    <div
      id="hostArea"
      class="hostArea">
    </div>


    <div
      id="seatGrid"
      class="seatGrid">
    </div>


    <div class="features">

      <button
        class="feature"
        onclick="feature('Room Support')">
        🛟 Room Support
      </button>

      <button
        class="feature"
        onclick="feature('Lucky Wheel')">
        🎡 Lucky Wheel
      </button>

      <button
        class="feature"
        onclick="feature('Bounty Hunter')">
        🎯 Bounty Hunter
      </button>

      <button
        class="feature"
        onclick="feature('Room Reward')">
        🎁 Room Reward
      </button>

      <button
        class="feature"
        onclick="feature('Exclusive Benefits')">
        ⭐ Exclusive Benefits
      </button>

    </div>


    <div class="exp">

      <div class="expTop">

        <b>
          🚀 Room EXP
        </b>

        <span>
          Top Room
        </span>

      </div>


      <div class="bar">
        <div class="fill"></div>
      </div>


      <div class="rank">

        <span>
          🥇 Top 1
        </span>

        <span>
          🥈 Top 2
        </span>

        <span>
          🥉 Top 3
        </span>

      </div>

    </div>


    <div
      id="chat"
      class="chat">
    </div>

  </div>


  <!-- EMOJI -->

  <div
    id="emojiPanel"
    class="emojiPanel">

    <div
      id="emojis"
      class="emojis">
    </div>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <div class="inputWrap">

      <input
        id="messageInput"
        class="input"
        placeholder="Say something..."
        maxlength="300"
        onkeydown="messageKey(event)">

    </div>


    <button
      class="icon"
      onclick="toggleEmoji()">
      😊
    </button>


    <button
      id="speakerBtn"
      class="icon"
      onclick="toggleSpeaker()">
      🔊
    </button>


    <button
      id="micBtn"
      class="icon"
      onclick="toggleMic()">
      🔇
    </button>


    <button
      class="icon"
      onclick="goHome()">
      🏠
    </button>


    <button
      class="icon"
      onclick="openMore()">
      •••
    </button>

  </div>

</div>


<!-- USER MODAL -->

<div
  id="userModal"
  class="modal">

  <div class="box">

    <button
      class="close"
      onclick="closeModal('userModal')">
      ✕
    </button>

    <div class="title">
      User Profile
    </div>


    <div class="profile">

      <img
        id="selectedDp"

      <div>

        <div
          id="selectedName"

          User
        </div>

          id="selectedId"

          ID:
        </div>

      </div>

    </div>


    <button
      id="adminBtn"

      onclick="makeAdmin()">
      👑 Make Admin
    </button>


    <button
      id="removeAdminBtn"

      onclick="removeAdmin()">
      👤 Remove Admin
    </button>


    <button
      id="kickBtn"
      class="action danger"
      onclick="kickUser()">
      🚪 Kick
    </button>


    <button
      id="banBtn"

      🚫 Ban
    </button>

  </div>

</div>


<!-- SETTINGS -->

<div
  id="settingsModal"

  <div class="box">

    <button
      class="close"

    </button>

    <div class="title">

    </div>


    <input
      id="newRoomName"

    <button

</div>


<!-- MORE -->

  id="moreModal"
  class="modal">

  <div class="box">

    <button
      class="close"
      onclick="closeModal('moreModal')">
      ✕
    </button>

    <div class="title">
      More
    </div>


    <button
      class="action"
      onclick="feature('Gifts')">
      🎁 Gifts
    </button>


    <button
      class="action"
      onclick="feature('Bag')">
      🎒 Bag
    </button>


    <button
      class="action"
      onclick="inviteRoom()">
      📤 Invite Friends
    </button>


    <button

      onclick="leaveRoom()">

    </button>

  </div>

</div>


<div
  id="toast"
  class="toast">
</div>


<div
  id="loading"
  class="loading">

  <b>
    PawanVoice
  </b>

  <span>
    Connecting to room...
  </span>

</div>


<script>

/* =========================================================
   PAWANVOICE CONNECTED ROOM
   ========================================================= */

const SERVER =
  "https://pawanvoice-1.onrender.com";


const params =
  new URLSearchParams(
    location.search
  );


const ROOM_ID =
  params.get("room") ||
  localStorage.getItem(
    "pawanvoice_room"
  ) ||
  "PV824991";


let USER_ID =
  localStorage.getItem(
    "pawanvoice_user_id"
  );


if(!USER_ID){

  USER_ID =
    "PVU" +
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,6);

  localStorage.setItem(
    "pawanvoice_user_id",
    USER_ID
  );

}


let USER_NAME =
  localStorage.getItem(
    "pawanvoice_name"
  ) ||
  "Pawan";


let USER_DP =
  localStorage.getItem(
    "pawanvoice_dp"
  ) ||
  createAvatar(
    USER_NAME
  );


let socket = null;

let roomState = null;

let selectedUser = null;

let micOn = false;

let speakerOn = true;

let localStream = null;

const peers = {};

const remoteAudio = {};


/* HEADER */

document.getElementById(
  "roomId"
).textContent =
  "Room: " +
  ROOM_ID;

document.getElementById(
  "roomDp"
).src =
  USER_DP;


/* EMOJIS */

const emojiList = [
  "😀","😂","🤣","😊","😍","🥰","😘","😎",
  "🤩","🥳","🥺","😭","😢","😡","🤬","😱",
  "😴","🤔","🤭","🤫","👻","🤖","👑","💎",
  "🔥","❤️","💕","💖","💔","💰","🎁","🎉",
  "🚀","⭐","✨","👏","👍","👎","🙏","💪",
  "👌","✌️","🤝","😇","😌","😋","😜","🤪"
];


const emojiBox =
  document.getElementById(
    "emojis"
  );


emojiList.forEach(
  emoji=>{

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "emoji";

    button.textContent =
      emoji;

    button.onclick =
      ()=>{
        const input =
          document.getElementById(
            "messageInput"
          );

        input.value +=
          emoji;

        input.focus();
      };

    emojiBox.appendChild(
      button
    );

  }
);


/* CONNECT */

connect();


function connect(){

  socket =
    io(
      SERVER,
      {
        transports:[
          "websocket",
          "polling"
        ],
        reconnection:true
      }
    );


  socket.on(
    "connect",
    ()=>{

      socket.emit(
        "join-room",
        {
          roomId:
            ROOM_ID,

          userId:
            USER_ID,

          name:
            USER_NAME,

          dp:
            USER_DP
        }
      );

    }
  );


  socket.on(
    "connect_error",
    ()=>{
      document.querySelector(
        "#loading span"
      ).textContent =
        "Server connection problem";
    }
  );


  socket.on(
    "room-state",
    state=>{
      roomState =
        state;

      renderRoom();

      hideLoading();

      setTimeout(
        startConnections,
        600
      );
    }
  );


  socket.on(
    "room-updated",
    state=>{
      roomState =
        state;

      renderRoom();

      startConnections();
    }
  );


  socket.on(
    "user-joined",
    user=>{

      toast(
        user.name +
        " joined"
      );

      startConnections();

    }
  );


  socket.on(
    "user-left",
    user=>{

      toast(
        user.name +
        " left"
      );

    }
  );


  socket.on(
    "message",
    message=>{

      addMessage(
        message.name,
        message.text
      );

    }
  );


  socket.on(
    "kicked",
    ()=>{
      alert(
        "You were kicked from the room."
      );

      goHome();
    }
  );


  socket.on(
    "banned",
    ()=>{
      alert(
        "You are banned from this room."
      );

      goHome();
    }
  );


  socket.on(
    "error-message",
    message=>{
      toast(
        message
      );
    }
  );


  /* WEBRTC */

  socket.on(
    "webrtc-offer",
    handleOffer
  );

  socket.on(
    "webrtc-answer",
    handleAnswer
  );

  socket.on(
    "webrtc-ice-candidate",
    handleIce
  );

}


/* RENDER */

function renderRoom(){

  if(!roomState)
    return;


  document.getElementById(
    "roomName"
  ).textContent =
    roomState.roomName ||
    "PawanVoice Room";


  document.getElementById(
    "newRoomName"
  ).value =
    roomState.roomName ||
    "PawanVoice Room";


  const users =
    Array.isArray(
      roomState.users
    )
      ? roomState.users
      : [];


  document.getElementById(
    "count"
  ).textContent =
    users.length +
    "/9";


  if(roomState.roomDp){

    document.getElementById(
      "roomDp"
    ).src =
      roomState.roomDp;

  }


  let seats =
    Array.isArray(
      roomState.seats
    )
      ? roomState.seats
      : [];


  while(
    seats.length < 9
  ){

    seats.push({
      seatNo:
        seats.length + 1,
      user:null
    });

  }


  /* HOST */

  const hostSeat =
    seats.find(
      s =>
        Number(s.seatNo) === 1
    );


  document.getElementById(
    "hostArea"
  ).innerHTML =
    seatHTML(
      hostSeat,
      true
    );


  /* 2-9 */

  const grid =
    document.getElementById(
      "seatGrid"
    );

  grid.innerHTML =
    "";


  for(
    let i=2;
    i<=9;
    i++
  ){

    const seat =
      seats.find(
        s =>
          Number(s.seatNo) === i
      );


    const wrapper =
      document.createElement(
        "div"
      );


    wrapper.innerHTML =
      seatHTML(
        seat,
        false
      );


    grid.appendChild(
      wrapper.firstElementChild
    );

  }


  const me =
    users.find(
      u =>
        String(u.userId) ===
        String(USER_ID)
    );


  if(me){

    micOn =
      !!me.micOn;

    speakerOn =
      me.speakerOn !== false;

    updateButtons();

  }

}


/* SEAT */

function seatHTML(
  seat,
  host
){

  if(
    !seat ||
    !seat.user
  ){

    return `
      <div
        class="seat emptySeat"
        onclick="takeSeat(
          ${Number(
            seat?.seatNo || 1
          )}
        )">

        <div class="avatarWrap">

          <div class="emptyIcon">
            +
          </div>

        </div>

        <div class="userName">
          Empty
        </div>

        <div class="seatNo">
          Seat ${Number(
            seat?.seatNo || 1
          )}
        </div>

      </div>
    `;

  }


  const user =
    seat.user;


  const dp =
    user.dp ||
    createAvatar(
      user.name
    );


  return `
    <div
      class="seat ${
        host
          ? "hostSeat"
          : ""
      }"
      onclick="openUser(
        '${escapeAttr(
          user.userId
        )}'
      )">

      <div class="avatarWrap">

        ${
          host ||
          user.isHost
            ? `<div class="crown">
                 👑
               </div>`
            : ""
        }

        <img
          class="avatar"
          src="${escapeAttr(
            dp
          )}">

        <div class="mic">
          ${
            user.micOn
              ? "🎙️"
              : "🔇"
          }
        </div>

      </div>

      <div class="userName">
        ${escapeHTML(
          user.name ||
          "User"
        )}
      </div>

      <div class="seatNo">
        Seat ${Number(
          seat.seatNo
        )}
      </div>

    </div>
  `;

}

/* MIC */

async function toggleMic(){

  if(!localStream){

    const ok =
      await getMicrophone();

    if(!ok)
      return;

  }


  micOn =
    !micOn;


  localStream
    .getAudioTracks()
    .forEach(
      track=>{
        track.enabled =
          micOn;
      }
    );


  socket.emit(
    "mic-toggle",
    {
      roomId:
        ROOM_ID,

      userId:
        USER_ID,

      micOn:
        micOn
    }
  );


  updateButtons();

}


async function getMicrophone(){

  try{

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          },
          video:false
        });


    localStream
      .getAudioTracks()
      .forEach(
        track=>{
          track.enabled =
            false;
        }
      );


    return true;

  }catch(error){

    toast(
      "Microphone permission denied"
    );

    return false;

  }

}

    );

/* AVATAR */

function createAvatar(
  name
){

  const letter =
    String(
      name || "P"
    )
    .charAt(0)
    .toUpperCase();


  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="200"
       height="200">

    <defs>

      <linearGradient
        id="g"
        x1="0"
        x2="1"
        y1="0"
        y2="1">

        <stop
          offset="0"
          stop-color="#7047e8"/>

        <stop
          offset="1"
          stop-color="#d258dc"/>

      </linearGradient>

    </defs>

    <rect
      width="200"
      height="200"
      rx="100"
      fill="url(#g)"/>

    <text
      x="100"
      y="128"
      text-anchor="middle"
      font-family="Arial"
      font-size="90"
      fill="white">
      ${letter}
    </text>

  </svg>
  `;


  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
      svg
    )
  );

}


/* ESCAPE */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}


/* =========================================================
   WEBRTC
========================================================= */

const rtcConfig = {

  iceServers:[
    {
      urls:
        "stun:stun.l.google.com:19302"
    },
    {
      urls:
        "stun:stun1.l.google.com:19302"
    }
  ]

};


async function startConnections(){

  if(
    !socket ||
    !socket.connected ||
    !roomState
  )
    return;


  const users =
    roomState.users ||
    [];


  for(
    const user of users
  ){

    if(
      String(
        user.userId
      ) ===
      String(
        USER_ID
      )
    )
      continue;


    /*
      Prevent duplicate connections.
    */
    if(
      peers[user.userId]
    )
      continue;


    /*
      Only the lexicographically
      smaller ID creates offer.
    */
    if(
      String(USER_ID) <
      String(user.userId)
    ){

      await makeOffer(
        user.userId
      );

    }

  }

}


async function makeOffer(
  targetId
){

  try{

    await getMicrophone();


    const pc =
      createPeer(
        targetId
      );


    if(
      localStream &&
      pc.getSenders().length === 0
    ){

      localStream
        .getTracks()
        .forEach(
          track=>{
            pc.addTrack(
              track,
              localStream
            );
          }
        );

    }


    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    socket.emit(
      "webrtc-offer",
      {
        roomId:
          ROOM_ID,

        fromUserId:
          USER_ID,

        toUserId:
          targetId,

        offer:
          offer
      }
    );

  }catch(error){

    console.error(
      error
    );

  }

}


function createPeer(
  userId
){

  if(
    peers[userId]
  ){

    return peers[userId];

  }


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peers[userId] =
    pc;


  pc.onicecandidate =
    event=>{

      if(
        event.candidate
      ){

        socket.emit(
          "webrtc-ice-candidate",
          {
            roomId:
              ROOM_ID,

            fromUserId:
              USER_ID,

            toUserId:
              userId,

            candidate:
              event.candidate
          }
        );

      }

    };


  pc.ontrack =
    event=>{

      let audio =
        remoteAudio[userId];


      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.autoplay =
          true;

        audio.playsInline =
          true;

        audio.muted =
          !speakerOn;

        audio.style.display =
          "none";


        document.body
          .appendChild(
            audio
          );


        remoteAudio[userId] =
          audio;

      }


      if(
        event.streams &&
        event.streams[0]
      ){

        audio.srcObject =
          event.streams[0];

        audio.play()
          .catch(
            ()=>{}
          );

      }

    };


  pc.onconnectionstatechange =
    ()=>{

      if(
        [
          "failed",
          "closed",
          "disconnected"
        ].includes(
          pc.connectionState
        )
      ){

        try{
          pc.close();
        }catch(e){}

        delete peers[
          userId
        ];

      }

    };


  return pc;

}


async function handleOffer(
  data
){

  if(
    !data ||
    String(
      data.toUserId
    ) !==
    String(
      USER_ID
    )
  )
    return;


  try{

    await getMicrophone();


    const pc =
      createPeer(
        data.fromUserId
      );


    if(
      localStream &&
      pc.getSenders().length === 0
    ){

      localStream
        .getTracks()
        .forEach(
          track=>{
            pc.addTrack(
              track,
              localStream
            );
          }
        );

    }


    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    socket.emit(
      "webrtc-answer",
      {
        roomId:
          ROOM_ID,

        fromUserId:
          USER_ID,

        toUserId:
          data.fromUserId,

        answer:
          answer
      }
    );

  }catch(error){

    console.error(
      "offer",
      error
    );

  }

}


async function handleAnswer(
  data
){

  if(
    !data ||
    String(
      data.toUserId
    ) !==
    String(
      USER_ID
    )
  )
    return;


  const pc =
    peers[
      data.fromUserId
    ];


  if(!pc)
    return;


  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

  }catch(error){

    console.error(
      "answer",
      error
    );

  }

}


async function handleIce(
  data
){

  if(
    !data ||
    String(
      data.toUserId
    ) !==
    String(
      USER_ID
    )
  )
    return;


  const pc =
    peers[
      data.fromUserId
    ];


  if(!pc)
    return;


  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );

  }catch(error){

    console.error(
      "ice",
      error
    );

  }

}


/* CLEANUP */

window.addEventListener(
  "beforeunload",
  ()=>{
    Object.values(
      peers
    ).forEach(
      pc=>{
        try{
          pc.close();
        }catch(e){}
      }
    );
  }
);
