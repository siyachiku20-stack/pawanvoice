```html
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#09090e;color:#fff;
 font-family:Arial,sans-serif;padding-bottom:75px
}
button,input{font:inherit}
button{border:0;cursor:pointer}

.top{
 position:sticky;top:0;z-index:20;
 background:#11111a;
 padding:10px;
 border-bottom:1px solid #292938
}

.bar{
 display:flex;
 align-items:center;
 gap:9px
}

.back,.ib{
 width:40px;height:40px;
 border-radius:50%;
 background:#292936;color:#fff
}

.ri{flex:1;min-width:0}

.rn{
 font-weight:bold;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.small{
 font-size:12px;
 color:#aaa
}

.wrap{
 max-width:680px;
 margin:auto;
 padding:10px
}

.head{
 padding:14px;
 border-radius:16px;
 background:linear-gradient(135deg,#34136e,#8529df);
 margin-bottom:10px
}

.between{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.seats{
 background:#12121a;
 border-radius:18px;
 padding:18px 8px
}

.seatgrid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:18px 6px
}

.seat.owner{
 grid-column:1/5
}

.seat{
 text-align:center;
 min-width:0
}

.circle{
 width:60px;height:60px;
 border-radius:50%;
 margin:auto;
 background:#292936;
 border:2px solid #6d28d9;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 font-size:24px
}

.circle img{
 width:100%;
 height:100%;
 object-fit:cover
}

.sn{
 font-size:11px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 margin-top:5px
}

.role{
 font-size:10px;
 color:#ffd34e
}

.tools{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
 margin-top:10px
}

.tool{
 background:#1b1b25;
 border:1px solid #2a2a38;
 border-radius:12px;
 padding:12px 4px;
 text-align:center;
 font-size:11px
}

.chat{
 margin-top:10px;
 background:#13131c;
 padding:10px;
 border-radius:16px
}

.msgs{
 height:170px;
 overflow:auto
}

.msg{
 padding:5px;
 font-size:13px
}

.msg b{
 color:#b46cff
}

.chatrow{
 display:flex;
 gap:6px;
 margin-top:7px
}

.chatrow input{
 flex:1;
 background:#23232e;
 color:#fff;
 border:1px solid #3a3a49;
 border-radius:20px;
 padding:10px
}

.send{
 background:#7c3aed;
 color:#fff;
 border-radius:20px;
 padding:0 16px
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#11111a;
 border-top:1px solid #292938;
 padding:8px;
 display:flex;
 gap:7px;
 z-index:30
}

.bottom button{
 flex:1;
 background:#252532;
 color:#fff;
 padding:12px;
 border-radius:12px
}

.modal{
 position:fixed;
 inset:0;
 background:#000b;
 display:none;
 align-items:flex-end;
 z-index:50
}

.modal.show{
 display:flex
}

.sheet{
 background:#171721;
 width:100%;
 max-width:680px;
 margin:auto;
 border-radius:20px 20px 0 0;
 padding:18px;
 max-height:90%;
 overflow:auto
}

.close{
 float:right;
 width:34px;
 height:34px;
 border-radius:50%;
 background:#292936;
 color:#fff
}

.action{
 width:100%;
 padding:12px;
 border-radius:10px;
 background:#7c3aed;
 color:#fff;
 margin-top:8px
}

.danger{
 background:#dc2626
}

.reward{
 background:#22222d;
 padding:12px;
 border-radius:12px;
 margin:8px 0
}
</style>
</head>

<body>

<div class="top">

 <div class="bar">

  <button class="back"
   onclick="leaveRoom()">
   ←
  </button>

  <div class="ri">

   <div class="rn"
    id="roomTitle">
    Loading...
   </div>

   <div class="small"
    id="meta">
    Connecting...
   </div>

  </div>

  <button class="ib"
   onclick="invite()">
   ↗
  </button>

  <button class="ib"
   onclick="settings()">
   ⚙️
  </button>

 </div>

</div>

<main class="wrap">

<div class="head">

 <div class="between">

  <div>

   <b id="host">
    👑 Host
   </b>

   <div class="small"
    id="category">
    General
   </div>

  </div>

  <div>
   👥 <span id="count">0</span>/9
  </div>

 </div>

</div>

<div class="seats">

 <div id="seatgrid"
  class="seatgrid">
 </div>

</div>

<div class="tools">

 <div class="tool"
  onclick="feature('Room Support')">
  🛟<br>Room Support
 </div>

 <div class="tool"
  onclick="feature('Lucky Wheel')">
  🎡<br>Lucky Wheel
 </div>

 <div class="tool"
  onclick="feature('Bounty Hunter')">
  🎯<br>Bounty Hunter
 </div>

 <div class="tool"
  onclick="feature('Room Reward')">
  🎁<br>Room Reward
 </div>

 <div class="tool"
  onclick="roomLevel()">
  ⭐<br>Room Level
 </div>

 <div class="tool"
  onclick="addToMainRoom()">
  ➕<br>Add to Main Room
 </div>

 <div class="tool"
  onclick="toggleMic()">
  🎙️<br>
  <span id="micText">Mic ON</span>
 </div>

 <div class="tool"
  onclick="toggleSpeaker()">
  🔊<br>Speaker
 </div>

</div>

<div class="chat">

 <div class="msgs"
  id="messages">
 </div>

 <div class="chatrow">

  <input
   id="chatInput"
   placeholder="Type message..."
   onkeydown="if(event.key==='Enter')sendMessage()">

  <button class="send"
   onclick="sendMessage()">
   Send
  </button>

 </div>

</div>

</main>

<div class="bottom">

 <button onclick="leaveRoom()">
  🏠 Leave
 </button>

 <button onclick="toggleMic()">
  🎙️ Mic
 </button>

 <button onclick="feature('Gifts')">
  🎁 Gift
 </button>

 <button onclick="settings()">
  ⚙️ More
 </button>

</div>

<div id="modal"
 class="modal">

 <div class="sheet">

  <button class="close"
   onclick="closeModal()">
   ×
  </button>

  <h2 id="modalTitle"></h2>

  <div id="modalBody"></div>

 </div>

</div>

<script>

const firebaseConfig={
 apiKey:"AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"148446327241",
 appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

const roomId=
 new URLSearchParams(location.search)
 .get("room");

const uid=
 localStorage.getItem("pawanUid");

const myName=
 localStorage.getItem("pawanName")||
 "Guest";

const myAvatar=
 localStorage.getItem("pawanAvatar")||
 "";

let room=null;
let members={};
let stream=null;
let micOn=true;
let speakerOn=true;
let joined=false;

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v??"")
 .replace(/[&<>"']/g,function(m){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m];
 });
}

function showModal(title,body){

 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=body;
 $("modal").classList.add("show");

}

function closeModal(){
 $("modal").classList.remove("show");
}

function feature(title){

 showModal(
  title,
  `
   <div class="reward">
    🎙️ ${esc(title)}
   </div>

   <p>
    यह PawanVoice Room का
    ${esc(title)} option है।
   </p>
  `
 );

}

function roomLevel(){

 const level=
  room.level||1;

 const exp=
  room.exp||0;

 showModal(
  "⭐ Room Level",
  `
   <div class="reward">
    ⭐ Room Level:
    <b>${level}</b>
   </div>

   <div class="reward">
    EXP:
    <b>${exp}/100</b>
   </div>

   <p>
    Room EXP बढ़ने पर
    Room Level बढ़ेगा।
   </p>

   <button class="action"
    onclick="addToMainRoom()">
    ➕ Add to Main Room
   </button>
  `
 );

}

function addToMainRoom(){

 if(!room){
  return;
 }

 db.ref(
  "mainRooms/"+roomId
 )
 .set({

  roomId:roomId,
  name:room.name,
  ownerId:room.ownerId,
  ownerName:room.ownerName,
  category:room.category,
  level:room.level||1,
  exp:room.exp||0,

  updatedAt:
   firebase.database.ServerValue.TIMESTAMP

 })
 .then(function(){

  showModal(
   "➕ Add to Main Room",
   `
    <div class="reward">
     ✅ Room Main Room में
     add कर दिया गया।
    </div>
   `
  );

 })
 .catch(function(e){

  showModal(
   "Error",
   "<p>"+esc(e.message)+"</p>"
  );

 });

}

function invite(){

 showModal(
  "📨 Invite Friend",
  `
   <p>Room ID:</p>

   <div class="reward">
    <b>${esc(roomId)}</b>
   </div>

   <p class="small">
    यह Room ID अपने दोस्त को भेजें।
   </p>
  `
 );

}

function settings(){

 let body="";

 if(room && room.ownerId===uid){

  body=`
   <div class="reward">
    👑 आप इस Room के Owner हैं।
   </div>

   <button class="action danger"
    onclick="deleteRoom()">
    Delete Room
   </button>
  `;

 }else{

  body=`
   <div class="reward">
    👤 आप Room Member हैं।
   </div>
  `;

 }

 showModal("⚙️ Room Settings",body);

}

function deleteRoom(){

 if(!room||
    room.ownerId!==uid)
  return;

 if(!confirm("Room delete करें?"))
  return;

 db.ref(
  "rooms/"+roomId
 )
 .update({
  active:false
 })
 .then(function(){

  location.href="index.html";

 });

}

function loadRoom(){

 if(!roomId){

  alert("Room ID नहीं मिला");
  location.href="index.html";
  return;

 }

 db.ref(
  "rooms/"+roomId
 )
 .once("value")
 .then(function(snap){

  if(!snap.exists()){

   alert("Room नहीं मिला");
   location.href="index.html";
   return;

  }

  room=snap.val();

  if(room.active===false){

   alert("Room बंद है");
   location.href="index.html";
   return;

  }

  $("roomTitle").textContent=
   room.name||"PawanVoice Room";

  $("host").textContent=
   "👑 "+(room.ownerName||"Host");

  $("category").textContent=
   room.category||"General";

  $("meta").textContent=
   "Room Level "+(room.level||1);

  joinRoom();

 });

}

function joinRoom(){

 const ref=
  db.ref(
   "rooms/"+roomId+"/members"
  );

 ref.once("value")
 .then(function(snap){

  const old=
   snap.val()||{};

  if(!old[uid] &&
     Object.keys(old).length>=9){

   throw new Error(
    "Room full है"
   );

  }

  const used={};

  Object.values(old)
   .forEach(function(x){

    if(x.seat)
     used[x.seat]=true;

   });

  let seat=
   old[uid]?.seat||1;

  if(!old[uid]){

   while(
    used[seat] &&
    seat<=9
   ){

    seat++;

   }

  }

  return ref
   .child(uid)
   .set({

    uid:uid,
    name:myName,
    avatar:myAvatar,
    seat:seat,

    role:
     uid===room.ownerId
      ? "owner"
      : "member",

    joinedAt:
     firebase.database.ServerValue.TIMESTAMP

   });

 })
 .then(function(){

  joined=true;

  listenMembers();
  listenChat();
  startMic();

 })
 .catch(function(e){

  alert(e.message);

  location.href="index.html";

 });

}

function listenMembers(){

 db.ref(
  "rooms/"+roomId+"/members"
 )
 .on("value",function(snap){

  members=
   snap.val()||{};

  $("count").textContent=
   Object.keys(members).length;

  renderSeats();

 });

}

function renderSeats(){

 const arr=
  Object.values(members);

 let html="";

 for(let i=1;i<=9;i++){

  const m=
   arr.find(x=>
    Number(x.seat)===i
   );

  if(!m){

   html+=`
    <div class="seat">

     <div class="circle">
      +
     </div>

     <div class="sn">
      Seat ${i}
     </div>

    </div>
   `;

   continue;
  }

  const avatar=
   m.avatar
    ? "<img src='"+esc(m.avatar)+"'>"
    : "👤";

  html+=`
   <div
    class="seat ${i===1?"owner":""}"
    onclick="openUser('${esc(m.uid)}')">

    <div class="circle">
     ${avatar}
    </div>

    <div class="sn">
     ${esc(m.name||"User")}
    </div>

    <div class="role">
     ${i===1
       ?"👑 Owner"
       :esc(m.role||"Member")}
    </div>

   </div>
  `;

 }

 $("seatgrid").innerHTML=html;

}

function openUser(id){

 const m=members[id];

 if(!m)return;

 let body=`

  <div class="reward">
   👤 ${esc(m.name)}
  </div>

  <p>
   ID: ${esc(m.uid)}
  </p>

  <p>
   Role: ${esc(m.role||"Member")}
  </p>

 `;

 if(
  room &&
  room.ownerId===uid &&
  id!==uid
 ){

  body+=`

   <button class="action"
    onclick="makeAdmin('${esc(id)}')">
    Make Admin
   </button>

   <button class="action danger"
    onclick="kickUser('${esc(id)}')">
    Kick User
   </button>

  `;

 }

 showModal(
  "👤 User Profile",
  body
 );

}

function makeAdmin(id){

 if(!room||
    room.ownerId!==uid)
  return;

 db.ref(
  "rooms/"+roomId+
  "/members/"+id+
  "/role"
 )
 .set("admin")
 .then(closeModal);

}

function kickUser(id){

 if(!room||
    room.ownerId!==uid)
  return;

 db.ref(
  "rooms/"+roomId+
  "/members/"+id
 )
 .remove()
 .then(closeModal);

}

function listenChat(){

 db.ref(
  "roomChats/"+roomId
 )
 .limitToLast(80)
 .on("value",function(snap){

  const data=
   snap.val()||{};

  const arr=
   Object.values(data)
   .sort(function(a,b){

    return (a.time||0)-
           (b.time||0);

   });

  $("messages").innerHTML=
   arr.map(function(m){

    return `
     <div class="msg">

      <b>
       ${esc(m.name||"User")}:
      </b>

      ${esc(m.text)}

     </div>
    `;

   }).join("");

  $("messages").scrollTop=
   $("messages").scrollHeight;

 });

}

function sendMessage(){

 const input=
  $("chatInput");

 const text=
  input.value.trim();

 if(!text)return;

 db.ref(
  "roomChats/"+roomId
 )
 .push({

  uid:uid,
  name:myName,
  text:text.slice(0,300),

  time:
   firebase.database.ServerValue.TIMESTAMP

 });

 input.value="";

}

async function startMic(){

 try{

  stream=
   await navigator.mediaDevices
   .getUserMedia({
    audio:true,
    video:false
   });

  stream
   .getAudioTracks()
   .forEach(function(t){

    t.enabled=micOn;

   });

 }
 catch(e){

  micOn=false;

  $("micText").textContent=
   "Mic OFF";

 }

}

function toggleMic(){

 micOn=!micOn;

 if(stream){

  stream
   .getAudioTracks()
   .forEach(function(t){

    t.enabled=micOn;

   });

 }

 $("micText").textContent=
  micOn
   ? "Mic ON"
   : "Mic OFF";

}

function toggleSpeaker(){

 speakerOn=!speakerOn;

 document
  .querySelectorAll("audio")
  .forEach(function(a){

   a.muted=!speakerOn;

  });

}

function leaveRoom(){

 if(joined){

  db.ref(
   "rooms/"+roomId+
   "/members/"+uid
  ).remove();

 }

 if(stream){

  stream
   .getTracks()
   .forEach(function(t){
    t.stop();
   });

 }

 location.href="index.html";

}

window.addEventListener(
 "beforeunload",
 function(){

  if(joined){

   db.ref(
    "rooms/"+roomId+
    "/members/"+uid
   ).remove();

  }

  if(stream){

   stream
    .getTracks()
    .forEach(function(t){
     t.stop();
    });

  }

 });

loadRoom();

</script>

</body>
</html>
```
