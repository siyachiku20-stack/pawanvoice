<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 25%,#34345f 0,#18182e 35%,#090912 75%);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

button{
  border:0;
  color:white;
  cursor:pointer;
}

.room{
  min-height:100vh;
  max-width:520px;
  margin:auto;
  position:relative;
  padding-bottom:100px;
}

/* TOP */
.top{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  background:rgba(10,10,25,.75);
}

.roomTitle{
  display:flex;
  align-items:center;
  gap:10px;
}

.roomIcon{
  width:42px;
  height:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7647ff,#d94fff);
  font-size:21px;
}

.roomName{
  font-weight:bold;
  font-size:15px;
}

.roomId{
  color:#aaa;
  font-size:11px;
  margin-top:3px;
}

.topBtns{
  display:flex;
  gap:7px;
}

.topBtns button{
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  font-size:17px;
}

/* NOTICE */
.notice{
  margin:10px 12px;
  padding:10px 13px;
  border-radius:15px;
  background:rgba(255,255,255,.09);
  font-size:12px;
  color:#eee;
}

/* OWNER */
.ownerArea{
  text-align:center;
  margin-top:18px;
}

.ownerSeat{
  width:116px;
  height:116px;
  margin:auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ownerGlow{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:radial-gradient(circle,#d5a7ff,transparent 65%);
  opacity:.45;
}

.avatar{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #f4c95d;
  position:relative;
  z-index:2;
  background:#292943;
}

.crown{
  position:absolute;
  top:-9px;
  left:50%;
  transform:translateX(-50%);
  z-index:4;
  font-size:25px;
}

.micDot{
  position:absolute;
  right:12px;
  bottom:11px;
  width:23px;
  height:23px;
  border-radius:50%;
  background:#32d46b;
  border:3px solid #17172c;
  z-index:5;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ownerName{
  margin-top:5px;
  font-size:14px;
  font-weight:bold;
}

.ownerTag{
  display:inline-block;
  margin-top:5px;
  padding:4px 10px;
  border-radius:20px;
  background:rgba(255,197,75,.16);
  color:#ffd86a;
  font-size:10px;
}

/* SEATS */
.seats{
  padding:15px 10px 0;
}

.seatRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:18px;
}

.seat{
  text-align:center;
  min-width:0;
}

.seatCircle{
  width:68px;
  height:68px;
  margin:auto;
  position:relative;
  border-radius:50%;
  padding:4px;
  background:linear-gradient(135deg,#ffbd55,#a55cff,#4e83ff);
}

.seatInner{
  width:100%;
  height:100%;
  border-radius:50%;
  background:#19192e;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.seatInner img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.emptySeat{
  font-size:25px;
  color:#aaa;
}

.seatNumber{
  position:absolute;
  left:-2px;
  top:-2px;
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:20px;
  background:#292943;
  border:1px solid #ffffff35;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
}

.seatMic{
  position:absolute;
  right:-1px;
  bottom:0;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#32d46b;
  border:2px solid #17172c;
  font-size:9px;
  z-index:4;
}

.seatName{
  margin-top:6px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#eee;
}

.vip{
  color:#ffd75c;
  font-size:9px;
}

/* INFO */
.info{
  margin:8px 12px;
  padding:10px;
  border-radius:14px;
  display:flex;
  justify-content:space-around;
  background:rgba(255,255,255,.07);
  font-size:11px;
  color:#ddd;
}

.info span{
  color:#fff;
  font-weight:bold;
}

/* CHAT */
.chatArea{
  margin:10px 12px;
  height:130px;
  overflow-y:auto;
  padding:10px;
  border-radius:15px;
  background:rgba(0,0,0,.18);
}

.message{
  margin-bottom:7px;
  font-size:12px;
}

.message b{
  color:#d7a4ff;
}

/* BOTTOM */
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:82px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(13,13,27,.96);
  border-top:1px solid #ffffff15;
  backdrop-filter:blur(15px);
  z-index:20;
}

.bottomBtn{
  width:52px;
  height:52px;
  border-radius:18px;
  background:rgba(255,255,255,.09);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  font-size:19px;
}

.bottomBtn small{
  font-size:9px;
  color:#ccc;
}

.moreBtn{
  background:linear-gradient(135deg,#7d45ff,#d34cff);
}

/* MORE PANEL */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  z-index:30;
}

.panel{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:#17172a;
  border-radius:25px 25px 0 0;
  padding:18px 15px 25px;
}

.panelHeader{
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
}

.handle{
  width:45px;
  height:4px;
  border-radius:10px;
  background:#777;
  margin:0 auto 15px;
}

.optionGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.option{
  min-height:70px;
  border-radius:16px;
  background:rgba(255,255,255,.07);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:22px;
}

.option span{
  font-size:10px;
  color:#ddd;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.65);
  z-index:40;
}

.popupBox{
  width:100%;
  max-width:420px;
  max-height:80vh;
  overflow:auto;
  background:#1b1b30;
  border:1px solid #ffffff15;
  border-radius:22px;
  padding:20px;
}

.popupTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

.popupText{
  color:#bbb;
  font-size:13px;
  line-height:1.6;
}

.popupClose{
  margin-top:18px;
  width:100%;
  padding:12px;
  border-radius:14px;
  background:#7647ff;
  font-weight:bold;
}

/* GIFT */
.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.gift{
  padding:13px 5px;
  border-radius:15px;
  background:rgba(255,255,255,.07);
  text-align:center;
  font-size:25px;
}

.gift small{
  display:block;
  font-size:9px;
  margin-top:4px;
  color:#ccc;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  padding:11px 17px;
  border-radius:20px;
  background:#272741;
  color:#fff;
  font-size:12px;
  display:none;
  z-index:100;
}

/* RESPONSIVE */
@media(max-width:370px){
  .seatCircle{
    width:60px;
    height:60px;
  }

  .optionGrid{
    gap:7px;
  }

  .option{
    min-height:64px;
  }
}
</style>
</head>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey:"AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
  authDomain:"pawanvoice-68c5e.firebaseapp.com",
  databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
  projectId:"pawanvoice-68c5e",
  storageBucket:"pawanvoice-68c5e.firebasestorage.app",
  messagingSenderId:"148446327241",
  appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

const params=new URLSearchParams(location.search);

const roomId=
  params.get("room") ||
  localStorage.getItem("pawanRoomId") ||
  "PAWANROOM";

const myName=
  localStorage.getItem("pawanName") ||
  "Pawan";

const myId=
  localStorage.getItem("pawanUserId") ||
  ("user_"+Date.now());

let micOn=true;
let stream=null;
let peer=null;
let calls={};

document.getElementById("roomIdText").textContent=
  "Room ID: "+roomId;

document.getElementById("ownerName").textContent=
  myName;


/* TOAST */
function toast(text){

  const t=document.getElementById("toast");

  t.textContent=text;
  t.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    t.style.display="none";
  },2200);
}


/* MIC */
async function setupMic(){

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      audio:true
    });

    stream.getAudioTracks().forEach(track=>{
      track.enabled=micOn;
    });

  }catch(e){

    toast("Microphone permission allow karo");

  }

}

function toggleMic(){

  micOn=!micOn;

  if(stream){

    stream.getAudioTracks().forEach(track=>{
      track.enabled=micOn;
    });

  }

  document.getElementById("micIcon").textContent=
    micOn ? "🎙️":"🔇";

  document.getElementById("micText").textContent=
    micOn ? "Mic ON":"Mic OFF";

  toast(micOn ? "Mic ON":"Mic OFF");

  db.ref("rooms/"+roomId+"/users/"+myId+"/micOn")
    .set(micOn)
    .catch(()=>{});

}


/* PEER */
function startPeer(){

  peer=new Peer();

  peer.on("open",id=>{

    db.ref("rooms/"+roomId+"/users/"+myId).update({

      name:myName,
      peerId:id,
      micOn:micOn,
      joinedAt:Date.now()

    });

  });

  peer.on("call",call=>{

    if(stream){

      call.answer(stream);

      call.on("stream",remoteStream=>{
        addAudio(call.peer,remoteStream);
      });

    }

  });

}


/* AUDIO */
function addAudio(id,remoteStream){

  let audio=document.getElementById("audio-"+id);

  if(!audio){

    audio=document.createElement("audio");

    audio.id="audio-"+id;
    audio.autoplay=true;
    audio.playsInline=true;

    document.getElementById("audioContainer")
      .appendChild(audio);

  }

  audio.srcObject=remoteStream;
}


/* ROOM USERS */
function listenUsers(){

  db.ref("rooms/"+roomId+"/users")
    .on("value",snap=>{

      const data=snap.val()||{};
      const ids=Object.keys(data);

      document.getElementById("onlineCount")
        .textContent=ids.length || 1;

      renderUsers(data);

    });

}


/* RENDER USERS */
function renderUsers(data){

  const ids=Object.keys(data)
    .filter(id=>id!==myId);

  const owner=
    data[myId] ||
    Object.values(data)[0];

  if(owner && owner.name){

    document.getElementById("ownerName")
      .textContent=owner.name;

  }

  const seats=document.querySelectorAll(".seat");

  seats.forEach((seat,index)=>{

    const user=ids[index];

    if(!user){

      seat.querySelector(".seatName")
        .textContent="Seat "+(index+2);

      seat.querySelector(".emptySeat")
        .textContent="＋";

      return;

    }

    const info=data[user];

    seat.querySelector(".seatName")
      .textContent=info.name || "Guest";

    seat.querySelector(".emptySeat")
      .textContent="👤";

  });

}


/* CONNECT */
function connectToUser(user){

  const data=user;

  if(!data.peerId || !peer || !stream) return;

  const call=peer.call(data.peerId,stream);

  call.on("stream",remoteStream=>{
    addAudio(data.peerId,remoteStream);
  });

}


/* SEAT */
function seatClick(number){

  showPopup("seat");

  document.getElementById("popupContent").innerHTML=
    "💺 Seat "+number+"<br><br>"+
    "Is seat par baithne ke liye request bheji ja sakti hai.<br><br>"+
    "🎙️ Mic request<br>"+
    "🔒 Seat lock<br>"+
    "👤 Profile";
}


/* MORE */
function openMore(){

  document.getElementById("moreOverlay")
    .style.display="block";

}

function closeMore(e){

  if(e.target.id==="moreOverlay"){

    document.getElementById("moreOverlay")
      .style.display="none";

  }

}

  const pages={

    info:[
      "Room Information",

    ],

    members:[
      "Members",
      "👥 Online members: "+
      document.getElementById("onlineCount").textContent
    ],

    hand:[
      "Raise Hand",
      "✋ Your hand-raise request has been sent."
    ],

    seat:[
      "Voice Seats",
      "💺 Owner + Seat 2–9<br><br>"+
      "Tap any empty seat to request a seat."
    ],

    request:[
      "Mic Request",
      "🎙️ Mic request system ready."
    ],

    lock:[
      "Seat Lock",
      "🔒 Owner/Admin can lock voice seats."
    ],

    event:[
      "Events",
      "🎉 Daily events<br>🏆 Weekly events<br>🎁 Special rewards"
    ],

    game:[
      "Games",
      "🎮 Dice<br>🎡 Lucky Spin<br>🃏 Cards<br>🎯 Mini Games"
    ],

    pk:[
      "PK Battle",
      "⚔️ Room Battle<br>❤️ Likes<br>🎁 Gifts<br>🏆 Scoreboard"
    ],

    rank:[
      "Room Ranking",
      "🏆 Room ranking<br>🎁 Gift ranking<br>👑 Host ranking"
    ],

    music:[
      "Room Music",
      "🎵 Room music controls."
    ],

    theme:[
      "Room Theme",
      "🎨 Default<br>🌌 Night<br>✨ Premium"
    ],

    background:[
      "Background",
      "🖼️ Room background selection."
    ],

    notice:[
      "Room Notice",
      "📢 Welcome to PawanVoice Room."

    report:[
      "Report",

    settings:[

  if(type==="gift"){

function closePopup(){

  document.getElementById("popup")
    .style.display="none";

}


/* GIFTS */
function sendGift(gift){

  const ref=db.ref(
    "rooms/"+roomId+"/gifts"
  ).push();

  ref.set({

    from:myName,
    gift:gift,
    time:Date.now()

  }).catch(()=>{});

  const count=
    Number(document.getElementById("giftCount").textContent)||0;

  document.getElementById("giftCount")
    .textContent=count+1;

  closePopup();

  toast(gift+" Gift sent 🎁");

}


/* LIKE */
function sendLike(){

  const count=
    Number(document.getElementById("likeCount").textContent)||0;

  document.getElementById("likeCount")
    .textContent=count+1;

  db.ref(
    "rooms/"+roomId+"/likes"
  ).transaction(v=>(v||0)+1);

  toast("❤️ Like");

}


/* SHARE */
function shareRoom(){

  const url=
    location.origin+
    location.pathname+
    "?room="+encodeURIComponent(roomId);

  if(navigator.share){

    navigator.share({
      title:"PawanVoice Room",
      text:"Join my PawanVoice Room",
      url:url
    }).catch(()=>{});

  }else{

    toast("Room link: "+url);

  }

}


/* LEAVE */
function leaveRoom(){

  closePopup();

  if(stream){

    stream.getTracks().forEach(track=>{
      track.stop();
    });

  }

  db.ref(
    "rooms/"+roomId+"/users/"+myId
  ).remove().catch(()=>{});

  if(peer){

    peer.destroy();

  }

  location.href="index.html";

}


/* INIT */
async function init(){

  await setupMic();

  startPeer();

  listenUsers();

}

init();


/* CLEANUP */
window.addEventListener("beforeunload",()=>{

  db.ref(
    "rooms/"+roomId+"/users/"+myId
  ).remove().catch(()=>{});

});

</script>
