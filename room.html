<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08080d;color:#fff;
 font-family:Arial,sans-serif;padding-bottom:75px
}
.header{
 padding:12px;background:#11111a;
 display:flex;align-items:center;gap:10px;
 position:sticky;top:0;z-index:20
}
.back{width:40px;height:40px;border-radius:50%;background:#252530;color:#fff}
.roomTitle{flex:1;min-width:0}
.roomTitle b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomTitle small{color:#888}
.header button{background:#252530;color:#fff;padding:9px;border-radius:10px}
.banner{
 margin:10px;border-radius:16px;padding:14px;
 background:linear-gradient(135deg,#5b21b6,#db2777)
}
.banner b{display:block}
.banner small{color:#ddd}
.seats{
 padding:12px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}
.ownerSeat{
 grid-column:1/5;
 display:flex;
 justify-content:center
}
.seat{
 background:#15151e;
 border:1px solid #292936;
 border-radius:16px;
 padding:10px 3px;
 text-align:center;
 min-width:0
}
.ownerSeat .seat{
 width:90px
}
.seatAvatar{
 width:54px;height:54px;border-radius:50%;
 background:#28283a;
 margin:auto;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:25px
}
.seatAvatar img{width:100%;height:100%;object-fit:cover}
.seatName{
 margin-top:6px;font-size:11px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.role{font-size:9px;color:#a78bfa}
.mic{font-size:10px;color:#4ade80}
.tools{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:8px;padding:10px
}
.tools button{
 background:#181820;color:#fff;
 border-radius:13px;padding:12px 4px;font-size:12px
}
.chat{
 margin:10px;background:#101017;
 border:1px solid #272731;
 border-radius:16px;padding:10px
}
.messages{
 height:190px;overflow:auto;
 display:flex;flex-direction:column;gap:6px
}
.msg{font-size:13px}
.msg b{color:#a78bfa}
.chatbar{display:flex;gap:7px;margin-top:8px}
.chatbar input{
 flex:1;background:#1a1a23;border:1px solid #30303b;
 color:#fff;border-radius:12px;padding:11px
}
.chatbar button{
 background:#7c3aed;color:#fff;border-radius:12px;padding:10px
}
.bottom{
 position:fixed;bottom:0;left:0;right:0;
 background:#111119;border-top:1px solid #292936;
 padding:8px;display:grid;grid-template-columns:repeat(5,1fr);
 z-index:50
}
.bottom button{
 background:#191923;color:#fff;border-radius:12px;padding:9px 3px;
 font-size:11px
}
.modal{
 position:fixed;inset:0;background:#000b;
 display:none;align-items:flex-end;z-index:100
}
.modal.show{display:flex}
.sheet{
 background:#15151d;width:100%;
 max-height:88%;overflow:auto;
 border-radius:22px 22px 0 0;padding:18px
}
.field{
 width:100%;padding:12px;margin:6px 0;
 border-radius:12px;background:#0e0e14;color:#fff;
 border:1px solid #333342
}
.btn{
 padding:11px 15px;border-radius:12px;
 background:#7c3aed;color:#fff;font-weight:bold
}
.green{background:#16a34a}
.red{background:#dc2626}
.gray{background:#292934}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feature{
 padding:14px;background:#20202a;color:#fff;border-radius:12px
}
.toast{
 position:fixed;left:50%;bottom:85px;transform:translateX(-50%);
 background:#fff;color:#111;padding:10px 15px;
 border-radius:20px;display:none;z-index:200
}
.toast.show{display:block}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<header class="header">
 <button class="back" onclick="location.href='index.html'">←</button>
 <div class="roomTitle">
  <b id="roomName">Loading...</b>
  <small id="roomInfo">Room</small>
 </div>
 <button onclick="showRoomSettings()">⚙️</button>
 <button onclick="invite()">📨</button>
</header>

<div class="banner" onclick="showEvent()">
 <b>ẁéĺćòmè ŧø PÅŴÂƝ ÃPP</b>
 <small>🎉 Family • CP • Rich King • Rocket Event</small>
</div>

<section class="seats">

 <div class="ownerSeat">
  <div class="seat" id="seat1"></div>
 </div>

 <div class="seat" id="seat2"></div>
 <div class="seat" id="seat3"></div>
 <div class="seat" id="seat4"></div>
 <div class="seat" id="seat5"></div>

 <div class="seat" id="seat6"></div>
 <div class="seat" id="seat7"></div>
 <div class="seat" id="seat8"></div>
 <div class="seat" id="seat9"></div>

</section>

<div class="tools">
 <button onclick="toggleMic()">🎙️ <span id="micText">Mic ON</span></button>
 <button onclick="toggleSpeaker()">🔊 Speaker</button>
 <button onclick="requestSeat()">🙋 Seat</button>
 <button onclick="showGifts()">🎁 Gifts</button>
 <button onclick="showLucky()">🎡 Lucky</button>
 <button onclick="showGames()">🎮 Games</button>
 <button onclick="showRanking()">🏆 Ranking</button>
 <button onclick="showFamily()">👨‍👩‍👧 Family</button>
 <button onclick="showCP()">❤️ CP</button>
 <button onclick="showPK()">⚔️ PK</button>
 <button onclick="invite()">📨 Invite</button>
 <button onclick="reportRoom()">🚩 Report</button>
</div>

<div class="chat">
 <div id="messages" class="messages"></div>
 <div class="chatbar">
  <input id="chatInput" placeholder="Write message...">
  <button onclick="sendMessage()">Send</button>
 </div>
</div>

<div class="bottom">
 <button onclick="showGifts()">🎁<br>Gift</button>
 <button onclick="showLucky()">🎡<br>Lucky</button>
 <button onclick="toggleMic()">🎙️<br>Mic</button>
 <button onclick="showGames()">🎮<br>Games</button>
 <button onclick="showRoomSettings()">⚙️<br>More</button>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
 <div class="sheet">
  <button class="btn gray" onclick="closeModal()">✕ Close</button>
  <div id="modalContent"></div>
 </div>
</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyDnlTde5Gg5aPHrUIV6kTYnM521GtbrrE",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"148446327241",
 appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

const params=new URLSearchParams(location.search);
const roomId=params.get("roomId");

let user=null;
let profile={};
let room=null;
let members={};
let micOn=true;
let speakerOn=true;

if(!roomId){
 alert("Room ID missing");
 location.href="index.html";
}

auth.onAuthStateChanged(async u=>{
 if(!u){
  try{
   await auth.signInAnonymously();
  }catch(e){
   alert("Firebase Anonymous Auth enable karo");
  }
  return;
 }

 user=u;

 await loadProfile();
 await loadRoom();
});

async function loadProfile(){
 const snap=await db.ref("users/"+user.uid).once("value");
 profile=snap.val()||{
  name:"Pawan User",
  photo:"",
  gender:"Male"
 };
}

function loadRoom(){
 db.ref("rooms/"+roomId).on("value",snap=>{
  room=snap.val();

  if(!room){
   alert("Room nahi mila");
   location.href="index.html";
   return;
  }

  document.getElementById("roomName").textContent=room.name||"Voice Room";
  document.getElementById("roomInfo").textContent=
   "ID: "+roomId+" • "+(room.category||"General");

  loadMembers();
 });
}

function loadMembers(){
 db.ref("rooms/"+roomId+"/members").on("value",snap=>{
  members=snap.val()||{};
  renderSeats();
  updateMemberCount();
 });
}

function renderSeats(){

 for(let i=1;i<=9;i++){
  const el=document.getElementById("seat"+i);
  if(!el)continue;

  el.innerHTML=`
   <div class="seatAvatar">💺</div>
   <div class="seatName">Empty</div>
   <div class="role">Seat ${i}</div>
  `;
 }

 const list=Object.values(members);

 list.slice(0,9).forEach((m,index)=>{
  const seat=index+1;
  const el=document.getElementById("seat"+seat);

  if(!el)return;

  const photo=m.photo||"";

  el.innerHTML=`
   <div class="seatAvatar">
    ${photo?`<img src="${escapeHtml(photo)}">`:"👤"}
   </div>
   <div class="seatName">${escapeHtml(m.name||"User")}</div>
   <div class="role">${escapeHtml(m.role||"member")}</div>
   <div class="mic">${m.mic===false?"🔇":"🎙️"}</div>
  `;
 });
}

async function joinRoom(){
 const ref=db.ref("rooms/"+roomId+"/members/"+user.uid);

 const snap=await ref.once("value");

 if(!snap.exists()){
  const count=Object.keys(members).length;

  if(count>=9){
   showMsg("Room full hai");
   return;
  }

  await ref.set({
   uid:user.uid,
   name:profile.name||"Pawan User",
   photo:profile.photo||"",
   role:room.hostUid===user.uid?"owner":"member",
   mic:true,
   joinedAt:firebase.database.ServerValue.TIMESTAMP
  });
 }
}

async function updateMemberCount(){
 const count=Object.keys(members).length;

 await db.ref("rooms/"+roomId+"/memberCount").set(count);

 document.getElementById("roomInfo").textContent=
  "ID: "+roomId+" • 👥 "+count+"/9 • "+(room.category||"General");
}

auth.onAuthStateChanged(u=>{
 if(u){
  setTimeout(joinRoom,500);
 }
});

async function toggleMic(){

 micOn=!micOn;

 document.getElementById("micText").textContent=
  micOn?"Mic ON":"Mic OFF";

 await db.ref("rooms/"+roomId+"/members/"+user.uid).update({
  mic:micOn
 });

 if(micOn){
  try{
   await navigator.mediaDevices.getUserMedia({audio:true});
   showMsg("Microphone permission mil gayi");
  }catch(e){
   showMsg("Mic permission allow karo");
  }
 }
}

function toggleSpeaker(){
 speakerOn=!speakerOn;
 showMsg(speakerOn?"Speaker ON":"Speaker OFF");
}

async function sendMessage(){

 const input=document.getElementById("chatInput");
 const text=input.value.trim();

 if(!text)return;

 const ref=db.ref("rooms/"+roomId+"/chat").push();

 await ref.set({
  uid:user.uid,
  name:profile.name||"User",
  text:text.slice(0,250),
  createdAt:firebase.database.ServerValue.TIMESTAMP
 });

 input.value="";
}

db.ref("rooms/"+roomId+"/chat").limitToLast(100).on("value",snap=>{

 const box=document.getElementById("messages");

 box.innerHTML="";

 snap.forEach(child=>{
  const m=child.val();

  const div=document.createElement("div");
  div.className="msg";

  div.innerHTML=
   "<b>"+escapeHtml(m.name||"User")+
   ":</b> "+escapeHtml(m.text||"");

  box.appendChild(div);
 });

 box.scrollTop=box.scrollHeight;
});

function requestSeat(){
 showMsg("Seat request host ko bheji jayegi");
}

function showGifts(){
 openModal(`
  <h2>🎁 Gifts</h2>
  <div class="grid2">
   <button class="feature" onclick="sendGift('🌹 Rose')">🌹 Rose</button>
   <button class="feature" onclick="sendGift('❤️ Heart')">❤️ Heart</button>
   <button class="feature" onclick="sendGift('🎂 Cake')">🎂 Cake</button>
   <button class="feature" onclick="sendGift('👑 Crown')">👑 Crown</button>
   <button class="feature" onclick="sendGift('🚀 Rocket')">🚀 Rocket</button>
   <button class="feature" onclick="sendGift('🐉 Dragon')">🐉 Dragon</button>
  </div>
 `);
}

function sendGift(name){
 closeModal();
 showMsg(name+" selected 🎁");
}

function showLucky(){
 openModal(`
  <h2>🎡 Lucky Wheel</h2>
  <p>Daily lucky spin</p>
  <button class="btn" onclick="spin()">SPIN</button>
 `);
}

function spin(){
 const rewards=["🌹 Rose","⭐ EXP","🪙 Coins","🎁 Gift","💎 Bonus"];
 const r=rewards[Math.floor(Math.random()*rewards.length)];
 showMsg("Lucky result: "+r);
 closeModal();
}

function showGames(){
 openModal(`
  <h2>🎮 Games</h2>
  <div class="grid2">
   <button class="feature">🎲 Ludo</button>
   <button class="feature">🃏 UNO</button>
   <button class="feature">❓ Quiz</button>
   <button class="feature">🎣 Fishing</button>
  </div>
 `);
}

function showRanking(){
 openModal(`
  <h2>🏆 Room Ranking</h2>
  <p>Room ranking system.</p>
 `);
}

function showFamily(){
 openModal(`
  <h2>👨‍👩‍👧 Family</h2>
  <p>Family members aur family ranking yahan dikhegi.</p>
 `);
}

function showCP(){
 openModal(`
  <h2>❤️ CP</h2>
  <p>Couple profile, CP level aur CP ranking.</p>
 `);
}

function showPK(){
 openModal(`
  <h2>⚔️ PK Battle</h2>
  <button class="btn" onclick="showMsg('PK request sent');closeModal()">Start PK</button>
 `);
}

function invite(){
 if(navigator.share){
  navigator.share({
   title:"PawanVoice Room",
   text:"Join my PawanVoice room",
   url:location.href
  }).catch(()=>{});
 }else{
  showMsg("Room link: "+location.href);
 }
}

function showEvent(){
 openModal(`
  <h2>🚀 PawanVoice Event</h2>
  <p>Family Ranking • CP Ranking • Rich King • Rocket Event</p>
 `);
}

function reportRoom(){
 openModal(`
  <h2>🚩 Report Room</h2>
  <input id="reportText" class="field" placeholder="Reason">
  <button class="btn red" onclick="submitReport()">Submit Report</button>
 `);
}

async function submitReport(){

 const reason=document.getElementById("reportText").value.trim();

 if(!reason){
  showMsg("Reason likho");
  return;
 }

 const ref=db.ref("reports/rooms").push();

 await ref.set({
  reporter:user.uid,
  roomId:roomId,
  reason:reason.slice(0,200),
  createdAt:firebase.database.ServerValue.TIMESTAMP
 });

 closeModal();
 showMsg("Report submitted");
}

function showRoomSettings(){

 const owner=room && room.hostUid===user.uid;

 openModal(`
  <h2>⚙️ Room Settings</h2>
  ${owner?`
   <input id="roomEditName" class="field"
    value="${escapeHtml(room.name||"")}" placeholder="Room name">

   <button class="btn" onclick="saveRoomName()">Save Room Name</button>

   <button class="btn gray" onclick="changeRoomPhoto()">🖼️ Change Room DP</button>

   <button class="btn red" onclick="deleteRoom()">Delete Room</button>
  `:`
   <p>Only room owner can change room settings.</p>
  `}
 `);
}

async function saveRoomName(){

 const name=document.getElementById("roomEditName").value.trim();

 if(name.length<2){
  showMsg("Room name likho");
  return;
 }

 await db.ref("rooms/"+roomId).update({
  name:name.slice(0,60)
 });

 closeModal();
 showMsg("Room name change ho gaya ✅");
}

function changeRoomPhoto(){

 const input=document.createElement("input");
 input.type="file";
 input.accept="image/*";

 input.onchange=e=>{

  const file=e.target.files[0];

  if(!file)return;

  if(file.size>1500000){
   showMsg("Photo 1.5MB se chhoti rakho");
   return;
  }

  const reader=new FileReader();

  reader.onload=async()=>{
   await db.ref("rooms/"+roomId).update({
    photo:reader.result
   });

   showMsg("Room DP change ho gayi ✅");
   closeModal();
  };

  reader.readAsDataURL(file);
 };

 input.click();
}

async function deleteRoom(){

 if(!confirm("Room delete karna hai?"))return;

 if(room.hostUid!==user.uid){
  showMsg("Only owner");
  return;
 }

 await db.ref("rooms/"+roomId).remove();

 location.href="index.html";
}

function openModal(html){
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}

function showMsg(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2200);
}

function escapeHtml(value){
 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}
</script>

</body>
</html>
