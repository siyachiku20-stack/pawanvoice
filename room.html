<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>PawanVoice Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#080a12;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  height:64px;
  display:flex;
  align-items:center;
  padding:8px 12px;
  background:#111522;
  gap:10px;
}

.room-dp{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ff4f9a;
}

.room-info{
  flex:1;
  min-width:0;
}

.room-name{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-id{
  font-size:11px;
  color:#8991a8;
}

.header-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#202638;
  color:#fff;
}

.status{
  padding:7px 12px;
  background:#111522;
  font-size:12px;
  color:#9ea6bb;
  text-align:center;
}

.status.online{
  color:#52e29b;
}

.room-body{
  padding:12px;
}

.room-title{
  text-align:center;
  margin:8px 0 15px;
  font-size:16px;
  font-weight:bold;
}

.seats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px 8px;
  max-width:500px;
  margin:auto;
}

.host-seat{
  grid-column:1/-1;
  display:flex;
  justify-content:center;
}

.seat{
  text-align:center;
  min-width:0;
}

.avatar-wrap{
  width:62px;
  height:62px;
  margin:auto;
  position:relative;
}

.host-seat .avatar-wrap{
  width:76px;
  height:76px;
}

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#171b2a;
  border:2px solid #343b54;
}

.seat.active .avatar{
  border-color:#ff4f9a;
  box-shadow:0 0 0 3px rgba(255,79,154,.15);
}

.mic-dot{
  position:absolute;
  right:-2px;
  bottom:1px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#252b3e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.seat-name{
  margin-top:6px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.seat-number{
  color:#7f879d;
  font-size:10px;
  margin-top:3px;
}

.empty-seat{
  width:100%;
  aspect-ratio:1;
  border-radius:50%;
  border:2px dashed #353c52;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#697188;
  font-size:22px;
  background:#111522;
}

.feature-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin:22px auto 12px;
  max-width:600px;
}

.feature{
  padding:9px 3px;
  background:#131827;
  border-radius:12px;
  text-align:center;
  font-size:10px;
}

.feature-icon{
  font-size:21px;
  display:block;
  margin-bottom:5px;
}

.exp-box{
  background:#121725;
  border-radius:14px;
  padding:12px;
  margin:12px 0;
}

.exp-top{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#a9b0c3;
}

.exp-bar{
  height:7px;
  background:#292f40;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.exp-fill{
  width:0%;
  height:100%;
  background:#ff4f9a;
}

.chat{
  height:150px;
  overflow-y:auto;
  background:#0d111c;
  border-radius:14px;
  padding:10px;
}

.chat-msg{
  margin-bottom:7px;
  font-size:12px;
}

.chat-name{
  color:#ff75ad;
  font-weight:bold;
}

.bottom{
  position:sticky;
  bottom:0;
  background:#0e121d;
  border-top:1px solid #242a3c;
  padding:9px;
}

.input-row{
  display:flex;
  gap:6px;
}

.chat-input{
  flex:1;
  min-width:0;
  border:0;
  background:#1a2030;
  color:#fff;
  padding:12px;
  border-radius:20px;
  outline:none;
}

.action{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#20273a;
  color:#fff;
}

.action.active{
  background:#ff4f9a;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  z-index:50;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-height:82vh;
  overflow:auto;
  background:#111522;
  border-radius:22px 22px 0 0;
  padding:16px;
}

.modal-title{
  font-weight:bold;
  font-size:18px;
  margin-bottom:12px;
}

.close{
  float:right;
  border:0;
  background:#252c40;
  color:#fff;
  width:34px;
  height:34px;
  border-radius:50%;
}

.gift-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.gift{
  background:#181e2d;
  border-radius:12px;
  padding:9px 4px;
  text-align:center;
}

.gift-icon{
  font-size:28px;
}

.gift-name{
  font-size:10px;
  margin-top:4px;
}

.gift-price{
  color:#ffc857;
  font-size:10px;
  margin:3px 0;
}

.gift button{
  border:0;
  background:#ff4f9a;
  color:#fff;
  border-radius:12px;
  padding:5px 10px;
  font-size:10px;
}

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
}

.emoji{
  background:#1a2030;
  border:0;
  border-radius:8px;
  padding:9px 2px;
  font-size:20px;
}

.gift-search{
  width:100%;
  border:0;
  outline:none;
  background:#1b2131;
  color:#fff;
  padding:11px;
  border-radius:12px;
  margin-bottom:10px;
}

.gift-tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:10px;
}

.gift-tab{
  border:0;
  white-space:nowrap;
  padding:8px 11px;
  border-radius:15px;
  background:#1c2333;
  color:#aaa;
}

.gift-tab.active{
  background:#ff4f9a;
  color:#fff;
}

.receiver{
  background:#191f2e;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}

.receiver button{
  margin-left:auto;
  border:0;
  background:#ff4f9a;
  color:#fff;
  border-radius:12px;
  padding:7px 12px;
}

.toast{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  background:#20283b;
  padding:10px 15px;
  border-radius:20px;
  font-size:12px;
  display:none;
  z-index:100;
}

.toast.show{
  display:block;
}

@media(max-width:380px){

  .avatar-wrap{
    width:55px;
    height:55px;
  }

  .host-seat .avatar-wrap{
    width:68px;
    height:68px;
  }

  .feature-row{
    grid-template-columns:repeat(3,1fr);
  }

}

</style>

<script>

/*
====================================================
CONFIG
====================================================
*/

const SERVER_URL =
  window.location.origin;

const FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

/*
====================================================
ROOM
====================================================
*/

const params =
  new URLSearchParams(
    location.search
  );

const roomId =
  params.get("room") ||
  "PV824991";

let socket = null;

let roomState = {

  id: roomId,

  name: "PawanVoice Room",

  dp:
    "https://i.pravatar.cc/200?img=12",

  seats:
    Array(9).fill(null),

  users: [],

  messages: [],

  gifts: []

};

let me = {

  userId:
    localStorage.getItem(
      "pv_userId"
    ) || "pawan",

  name:
    localStorage.getItem(
      "pv_name"
    ) || "Pawan User",

  dp:
    localStorage.getItem(
      "pv_dp"
    ) ||
    "https://i.pravatar.cc/200?img=12",

  level:
    Number(
      localStorage.getItem(
        "pv_level"
      ) || 1
    ),

  exp:
    Number(
      localStorage.getItem(
        "pv_exp"
      ) || 0
    ),

  vipLevel:
    Number(
      localStorage.getItem(
        "pv_vipLevel"
      ) || 0
    )

};

/*
====================================================
WEBRTC
====================================================
*/

let rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    }

  ]

};

const peers = {};

let localStream = null;

let micOn = false;

let speakerOn = true;

/*
====================================================
UTILS
====================================================
*/

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char])
    );

}

function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    message;

  el.classList.add(
    "show"
  );

  setTimeout(
    () =>
      el.classList.remove(
        "show"
      ),
    2500
  );

}

function getUserBySocket(socketId){

  return (
    roomState.users || []
  ).find(
    u =>
      u.socketId === socketId
  );

}

function getUserById(userId){

  return (
    roomState.users || []
  ).find(
    u =>
      u.userId === userId
  );

}

/*
====================================================
RTC CONFIG
====================================================
*/

async function loadRtcConfig(){

  try{

    const response =
      await fetch(
        "/rtc-config",
        {
          cache:"no-store"
        }
      );

    if(
      !response.ok
    ){

      throw new Error(
        "RTC config failed"
      );

    }

    const config =
      await response.json();

    if(
      config &&
      Array.isArray(
        config.iceServers
      )
    ){

      rtcConfig =
        config;

    }

    console.log(
      "RTC CONFIG:",
      rtcConfig
    );

  }catch(error){

    console.error(
      "RTC config:",
      error
    );

  }

}

/*
====================================================
CREATE PEER
====================================================
*/

async function createPeer(
  remoteSocketId,
  remoteUserId,
  initiator
){

  if(
    !remoteSocketId ||
    !socket ||
    remoteSocketId === socket.id
  ){

    return null;

  }

  if(
    peers[remoteSocketId]
  ){

    return peers[
      remoteSocketId
    ].pc;

  }

  const pc =
    new RTCPeerConnection(
      rtcConfig
    );

  peers[
    remoteSocketId
  ] = {

    pc,

    userId:
      remoteUserId

  };

  /*
  IMPORTANT:
  Always create audio transceiver.
  This allows audio to be added later
  when mic is switched ON.
  */

  try{

    pc.addTransceiver(
      "audio",
      {
        direction:
          "sendrecv"
      }
    );

  }catch(error){

    console.log(
      "transceiver:",
      error
    );

  }

  /*
  Add current microphone track.
  */

  if(localStream){

    const track =
      localStream.getAudioTracks()[0];

    if(track){

      const sender =
        pc.getSenders()
          .find(
            s =>
              s.track &&
              s.track.kind ===
              "audio"
          );

      if(sender){

        await sender.replaceTrack(
          track
        );

      }

    }

  }

  /*
  ICE
  */

  pc.onicecandidate =
    event => {

      if(
        !event.candidate
      ){

        return;

      }

      socket.emit(
        "ice-candidate",
        {

          roomId,

          targetSocketId:
            remoteSocketId,

          candidate:
            event.candidate

        }
      );

    };

  /*
  REMOTE AUDIO
  */

  pc.ontrack =
    event => {

      let audio =
        document.getElementById(
          "remote-" +
          remoteSocketId
        );

      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.id =
          "remote-" +
          remoteSocketId;

        audio.autoplay =
          true;

        audio.playsInline =
          true;

        document.body.appendChild(
          audio
        );

      }

      if(
        event.streams &&
        event.streams[0]
      ){

        audio.srcObject =
          event.streams[0];

      }

      audio.muted =
        !speakerOn;

      audio.play()
        .catch(
          () => {}
        );

    };

  /*
  CONNECTION
  */

  pc.onconnectionstatechange =
    () => {

      console.log(
        "Peer",
        remoteSocketId,
        pc.connectionState
      );

      if(
        pc.connectionState ===
        "connected"
      ){

        toast(
          "Voice connected"
        );

      }

      if(
        [
          "failed",
          "closed"
        ].includes(
          pc.connectionState
        )
      ){

        cleanupPeer(
          remoteSocketId
        );

      }

    };

  /*
  ICE CONNECTION
  */

  pc.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE",
        remoteSocketId,
        pc.iceConnectionState
      );

    };

  /*
  OFFER
  */

  if(initiator){

    const offer =
      await pc.createOffer({

        offerToReceiveAudio:
          true

      });

    await pc.setLocalDescription(
      offer
    );

    socket.emit(
      "webrtc-offer",
      {

        roomId,

        targetSocketId:
          remoteSocketId,

        offer:
          pc.localDescription

      }
    );

  }

  return pc;

}

/*
====================================================
CLEAN PEER
====================================================
*/

function cleanupPeer(
  socketId
){

  const item =
    peers[socketId];

  if(!item){

    return;

  }

  try{

    item.pc.close();

  }catch(error){}

  delete peers[
    socketId
  ];

  const audio =
    document.getElementById(
      "remote-" +
      socketId
    );

  if(audio){

    audio.remove();

  }

}

/*
====================================================
CONNECT TO ALL USERS
====================================================
*/

async function connectToExistingUsers(){

  if(!socket){

    return;

  }

  const users =
    roomState.users || [];

  for(
    const user of users
  ){

    if(
      !user ||
      !user.socketId ||
      user.socketId === socket.id
    ){

      continue;

    }

    /*
    Only lower socket ID initiates.
    Prevents duplicate offers.
    */

    const initiator =
      socket.id <
      user.socketId;

    try{

      await createPeer(
        user.socketId,
        user.userId,
        initiator
      );

    }catch(error){

      console.error(
        "Peer error:",
        error
      );

    }

  }

}

/*
====================================================
ADD MIC TO PEERS
====================================================
*/

async function addLocalTrackToPeers(){

  if(!localStream){

    return;

  }

  const track =
    localStream.getAudioTracks()[0];

  if(!track){

    return;

  }

  for(
    const socketId
    of Object.keys(peers)
  ){

    const item =
      peers[socketId];

    if(!item){

      continue;

    }

    const pc =
      item.pc;

    let sender =
      pc.getSenders()
        .find(
          s =>
            s.track &&
            s.track.kind ===
            "audio"
        );

    /*
    If no sender has track,
    use audio transceiver sender.
    */

    if(!sender){

      sender =
        pc.getTransceivers()
          .find(
            t =>
              t.receiver &&
              t.receiver.track &&
              t.receiver.track.kind ===
              "audio"
          )?.sender;

    }

    if(sender){

      try{

        await sender.replaceTrack(
          track
        );

      }catch(error){

        console.log(
          "replaceTrack:",
          error
        );

      }

    }

    /*
    Renegotiate.
    */

    if(
      socket.id <
      socketId
    ){

      try{

        const offer =
          await pc.createOffer();

        await pc.setLocalDescription(
          offer
        );

        socket.emit(
          "webrtc-offer",
          {

            roomId,

            targetSocketId:
              socketId,

            offer:
              pc.localDescription

          }
        );

      }catch(error){

        console.error(
          "Renegotiation:",
          error
        );

      }

    }

  }

}

/*
====================================================
START MICROPHONE
====================================================
*/

async function startMicrophone(){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      toast(
        "Microphone is not supported"
      );

      return;

    }

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: {

            echoCancellation:true,

            noiseSuppression:true,

            autoGainControl:true

          },

          video:false

        });

    micOn = true;

    await addLocalTrackToPeers();

    socket.emit(
      "mic-status",
      {
        mic:true
      }
    );

    updateMicButton();

    toast(
      "Microphone ON"
    );

  }catch(error){

    console.error(
      "Microphone:",
      error
    );

    toast(

/*
====================================================
STOP MICROPHONE
====================================================
*/

function stopMicrophone(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => {
          track.stop();
        }
      );

    localStream = null;

  }

  micOn = false;

  /*
  Disable tracks on peers.
  */

  Object.values(
    peers
  ).forEach(
    item => {

      item.pc
        .getSenders()
        .forEach(
          sender => {

            if(
              sender.track &&
              sender.track.kind ===
              "audio"
            ){

              sender.replaceTrack(
                null
              ).catch(
                () => {}
              );

            }

          }
        );

    }
  );

  if(socket){

    socket.emit(
      "mic-status",
      {
        mic:false
      }
    );

  }

  updateMicButton();

}

/*
====================================================
SOCKET CONNECT
====================================================
*/

function connectSocket(){

  socket =
    io(
      SERVER_URL,
      {

        transports:[
          "websocket",
          "polling"
        ],

        reconnection:true,

        reconnectionAttempts:10

      }
    );

  socket.on(
    "connect",
    async () => {

      console.log(
        "Socket connected:",
        socket.id
      );

      setStatus(
        "Connected",
        true
      );

      socket.emit(
        "join-room",
        {

          roomId,

          userId:
            me.userId,

          name:
            me.name,

          dp:
            me.dp,

          level:
            me.level,

          exp:
            me.exp,

          vipLevel:
            me.vipLevel

        }
      );

    }
  );

  socket.on(
    "disconnect",
    () => {

      setStatus(
        "Disconnected"
      );

    }
  );

  socket.on(
    "connect_error",
    error => {

      console.error(
        "Socket error:",
        error
      );

      setStatus(
        "Connection error"
      );

    }
  );

  /*
  ROOM STATE
  */

  socket.on(
    "room-state",
    state => {

      if(!state){

        return;

      }

      roomState =
        state;

      renderRoom();

      /*
      Make peers after state.
      */

      connectToExistingUsers();

    }
  );

  socket.on(
    "roomState",
    state => {

      if(!state){

        return;

      }

      roomState =
        state;

      renderRoom();

    }
  );

  /*
  NEW USER
  */

  socket.on(
    "user-entry",
    async data => {

      if(
        !data ||
        !data.socketId ||
        data.socketId === socket.id
      ){

        return;

      }

      /*
      Lower socket ID initiates.
      */

      if(
        socket.id <
        data.socketId
      ){

        try{

          await createPeer(
            data.socketId,
            data.userId || "",
            true
          );

        }catch(error){

          console.error(
            "New peer:",
            error
          );

        }

      }else{

        /*
        Create receiving peer too,
        so answer can be generated.
        */

        try{

          await createPeer(
            data.socketId,
            data.userId || "",
            false
          );

        }catch(error){}

      }

    }
  );

  /*
  OFFER
  */

  socket.on(
    "webrtc-offer",
    async data => {

      if(
        !data ||
        !data.fromSocketId ||
        !data.offer
      ){

        return;

      }

      try{

        const pc =
          await createPeer(
            data.fromSocketId,
            data.fromUserId || "",
            false
          );

        await pc.setRemoteDescription(
          new RTCSessionDescription(
            data.offer
          )
        );

        /*
        Add microphone if available.
        */

        if(localStream){

          const track =
            localStream.getAudioTracks()[0];

          if(track){

            const sender =
              pc.getSenders()
                .find(
                  s =>
                    s.track &&
                    s.track.kind ===
                    "audio"
                );

            if(sender){

              await sender.replaceTrack(
                track
              );

            }

          }

        }

        const answer =
          await pc.createAnswer();

        await pc.setLocalDescription(
          answer
        );

        socket.emit(
          "webrtc-answer",
          {

            roomId,

            targetSocketId:
              data.fromSocketId,

            answer:
              pc.localDescription

          }
        );

      }catch(error){

        console.error(
          "Offer error:",
          error
        );

      }

    }
  );

  /*
  ANSWER
  */

  socket.on(
    "webrtc-answer",
    async data => {

      if(
        !data ||
        !data.fromSocketId ||
        !data.answer
      ){

        return;

      }

      const item =
        peers[
          data.fromSocketId
        ];

      if(!item){

        return;

      }

      try{

        await item.pc
          .setRemoteDescription(
            new RTCSessionDescription(
              data.answer
            )
          );

      }catch(error){

        console.error(
          "Answer error:",
          error
        );

      }

    }
  );

  /*
  ICE
  */

  socket.on(
    "ice-candidate",
    async data => {

      if(
        !data ||
        !data.fromSocketId ||
        !data.candidate
      ){

        return;

      }

      const item =
        peers[
          data.fromSocketId
        ];

      if(!item){

        return;

      }

      try{

        await item.pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }catch(error){

        console.error(
          "ICE:",
          error
        );

      }

    }
  );

  socket.on(
    "iceCandidate",
    async data => {

      if(
        !data ||
        !data.fromSocketId ||
        !data.candidate
      ){

        return;

      }

      const item =
        peers[
          data.fromSocketId
        ];

      if(!item){

        return;

      }

      try{

        await item.pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }catch(error){}

    }
  );

  /*
  CHAT
  */

  socket.on(
    "chat-message",
    message => {

      addChatMessage(
        message
      );

    }
  );

  /*
  GIFT
  */

  socket.on(
    "gift-received",
    gift => {

      toast(
        `${gift.fromName} sent ${gift.icon} ${gift.name}`
      );

    }
  );

  socket.on(
    "kicked",
    data => {

      alert(
        data?.message ||
        "You were kicked."
      );

      location.href =
        "/";

    }
  );

  socket.on(
    "force-mute",
    () => {

      stopMicrophone();

      toast(
        "You were muted by host."
      );

    }
  );

}

function renderSeats(){

  const container =

    );

  container.innerHTML =
    "";

  const seats =
    roomState.seats ||
    Array(9).fill(null);

  /*

  */

  const host =
    document.createElement(
      "div"
    );

  host.className =
    "host-seat";

  host.appendChild(
    createSeat(
      seats[0],
      1,
      true
    )
  );

  container.appendChild(
    host

      createSeat(
        seats[i],
        i+1,

      )

function createSeat(
  socketId,
  number,
  host
){

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "seat";

  let user =
    getUserBySocket(
      socketId
    );

  if(user){

    wrapper.classList.add(
      "active"
    );

    wrapper.innerHTML = `

      <div class="avatar-wrap">

        <img
          class="avatar"
          src="${esc(
            user.dp ||
            "https://i.pravatar.cc/200?img=12"
          )}"
        >

        <div class="mic-dot">
          ${
            user.mic
              ? "🎙️"
              : "🔇"
          }
        </div>

      </div>

      <div class="seat-name">
        ${esc(
          user.name ||
          "Guest"
        )}
      </div>

      <div class="seat-number">
        ${
          host
            ? "HOST"
            : "Seat " + number
        }
      </div>

    `;

    wrapper.onclick =
      () => {

        showUserMenu(
          user
        );

      };

  }else{

    wrapper.innerHTML = `

      <div class="avatar-wrap">

        <div class="empty-seat">
          +
        </div>

      </div>

      <div class="seat-name">
        Empty
      </div>

      <div class="seat-number">
        Seat ${number}
      </div>

    `;

    wrapper.onclick =
      () => {

        takeSeat(
          number - 1
        );

      };

  }

  return wrapper;

}

function showUserMenu(
  user
){

  if(
    user.userId ===
    me.userId
  ){

    return;

  }

  const isHost =
    roomState.seats &&
    roomState.seats[0] &&
    getUserBySocket(
      roomState.seats[0]
    )?.userId ===
    me.userId;

  if(!isHost){

    toast(
      user.name
    );

    return;

  }

  const action =
    confirm(
      `${user.name}\n\nOK = Kick\nCancel = Close`
    );

  if(action){

    socket.emit(
      "admin-kick",
      {
        targetSocketId:
          user.socketId
      }
    );

  }

}

  const exp =

  const percent =
    Math.max(

      Math.min(
        100,
        exp % 100
      )
    );

  document.getElementById(
    "expFill"
  ).style.width =
    percent + "%";

  document.getElementById(
    "expText"
  ).textContent =
    percent + "%";

}

/*
====================================================
SEND GIFT
====================================================
*/

function sendGiftTo(
  user
){

  if(!selectedGift){

    return;

  }

  const quantity =
    Number(
      prompt(
        "Quantity 1-99",
        "1"
      )
    );

  if(
    !Number.isInteger(
      quantity
    ) ||
    quantity < 1 ||
    quantity > 99
  ){

    toast(
      "Invalid quantity"
    );

    return;

  }

  const total =
    selectedGift.price *
    quantity;

  const currentCoins =
    Number(
      localStorage.getItem(
        "pv_coins"
      ) || 0
    );

  if(
    currentCoins <
    total
  ){

    toast(
      "Not enough coins"
    );

    return;

  }

  /*
  NOTE:
  Actual wallet deduction should
  eventually be done server-side.
  */

  const newCoins =
    currentCoins -
    total;

  localStorage.setItem(
    "pv_coins",
    String(newCoins)
  );

  socket.emit(
    "send-gift",
    {

      id:
        selectedGift.name,

      name:
        selectedGift.name,

      icon:
        selectedGift.icon,

      price:
        selectedGift.price,

      quantity,

      fromName:
        me.name,

      toUserId:
        user.userId,

      toName:
        user.name

    }
  );

  closeModal(
    "receiverModal"
  );

  toast(
    `${selectedGift.icon} Gift sent to ${user.name}`
  );

}

/*
====================================================
MODALS
====================================================
*/

function openModal(
  id
){

  document
    .getElementById(id)
    .classList.add(
      "show"
    );

}

function closeModal(
  id
){

  document
    .getElementById(id)
    .classList.remove(
      "show"
    );

}

/*
====================================================
BUTTONS
====================================================
*/

document
  .getElementById(
    "micBtn"
  )
  .addEventListener(
    "click",
    toggleMic
  );

document
  .getElementById(
    "speakerBtn"
  )
  .addEventListener(
    "click",
    toggleSpeaker
  );

document
  .getElementById(
    "sendBtn"
  )
  .addEventListener(
    "click",
    sendMessage
  );

document
  .getElementById(
    "emojiBtn"
  )
  .addEventListener(
    "click",
    () =>
      openModal(
        "emojiModal"
      )
  );

document
  .getElementById(
    "giftBtn"
  )
  .addEventListener(
    "click",
    () => {

      openModal(
        "giftModal"
      );

      renderGiftTabs();

      renderGifts();

    }
  );

document
  .getElementById(
    "giftSearch"
  )
  .addEventListener(
    "input",
    renderGifts
  );

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          closeModal(
            button.dataset.close
          );

        }
      );

    }
  );

document
  .getElementById(
    "inviteBtn"
  )
  .addEventListener(
    "click",
    async () => {

      const url =
        location.href;

      if(
        navigator.share
      ){

        try{

          await navigator.share({

            title:
              "PawanVoice Room",

            text:
              "Join my PawanVoice room",

            url

          });

        }catch(error){}

      }else{

        prompt(
          "Room Link",
          url
        );

      }

    }
  );

document
  .getElementById(
    "settingsBtn"
  )
  .addEventListener(
    "click",
    () => {

      toast(
        "Room settings coming next"
      );

    }
  );

document
  .querySelectorAll(
    ".feature"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          toast(
            button.dataset.feature
          );

        }
      );

    }
  );

/*
====================================================
INIT
====================================================
*/

async function init(){

  renderEmojis();

  renderGiftTabs();

  renderGifts();

  updateMicButton();

  await loadRtcConfig();

  connectSocket();

  setStatus(
    "Connecting..."
  );

}

init();

</script>
