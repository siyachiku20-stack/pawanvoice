<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PawanVoice Room</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;padding:0;width:100%;height:100%;
 font-family:Arial,sans-serif;
 background:#160b2d;color:#fff
}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{border:0;cursor:pointer}

.app{
 width:100%;max-width:520px;margin:auto;min-height:100vh;
 position:relative;
 background:linear-gradient(180deg,#28104c,#120820);
 overflow:hidden
}

/* HEADER */
.header{
 height:70px;padding:8px 10px;display:flex;align-items:center;gap:9px;
 background:linear-gradient(90deg,#40136d,#7b1fa2);
 position:sticky;top:0;z-index:20
}
.back{
 width:38px;height:38px;border-radius:50%;
 background:#ffffff22;color:white;font-size:22px
}
.room-dp{
 width:46px;height:46px;border-radius:50%;object-fit:cover;
 border:2px solid #ffd54f
}
.room-title{flex:1;min-width:0}
.room-title b{
 display:block;font-size:16px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.room-title small{font-size:11px;color:#ddd}
.head-btn{
 width:38px;height:38px;border-radius:50%;
 background:#ffffff20;color:#fff;font-size:18px
}

/* ROOM TOP */
.top-info{padding:10px}
.stats{
 display:flex;justify-content:space-between;align-items:center;
 background:#ffffff10;border:1px solid #ffffff15;
 border-radius:14px;padding:9px 12px
}
.stats span{font-size:12px;color:#ddd}
.stats b{color:#fff}

/* BANNER */
.room-banner{
 margin:0 10px;height:72px;border-radius:17px;padding:12px;
 background:linear-gradient(135deg,#7927b8,#ef3b83);
 display:flex;align-items:center;
 box-shadow:0 8px 25px #0005
}
.room-banner b{font-size:18px}
.room-banner small{
 display:block;margin-top:5px;color:#f5dfff
}

/* SEATS */
.seats{padding:14px 10px 5px}
.host-wrap{
 display:flex;justify-content:center;margin-bottom:14px
}
.seat{
 width:70px;text-align:center;position:relative;cursor:pointer
}
.avatar{
 width:58px;height:58px;border-radius:50%;object-fit:cover;
 border:2px solid #8e6cff;background:#27133c
}
.seat.host .avatar{
 width:72px;height:72px;border-color:#ffd54f
}
.seat-name{
 margin-top:4px;font-size:11px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.seat-num{
 position:absolute;top:-3px;left:3px;background:#0009;
 border-radius:10px;padding:2px 6px;font-size:9px
}
.mic-dot{
 position:absolute;right:2px;bottom:20px;width:18px;height:18px;
 border-radius:50%;background:#25d366;font-size:11px;
 display:flex;align-items:center;justify-content:center
}
.seat-row{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:8px;margin-top:8px
}
.empty .avatar{opacity:.45}

/* CURRENT USER SEAT */
.seat.my-seat .avatar{
 border-color:#00e5ff;
 box-shadow:0 0 15px #00e5ff88
}
.seat.my-seat .seat-name{
 color:#00e5ff;
 font-weight:bold
}

/* ROOM FEATURES */
.features-box{
 padding:10px 10px 12px
}
.features-button{
 width:100%;
 min-height:54px;
 border-radius:16px;
 background:linear-gradient(135deg,#8e24aa,#e91e63);
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 box-shadow:0 7px 20px #0005;
 font-weight:bold;
}
.features-button .left{
 display:flex;
 align-items:center;
 gap:10px;
}
.features-button .main-icon{
 font-size:25px
}
.features-button .arrow{
 font-size:20px;
 transition:.2s
}
.features-button.open .arrow{
 transform:rotate(180deg)
}
.features-panel{
 display:none;
 margin-top:8px;
 padding:9px;
 border-radius:16px;
 background:#ffffff09;
 border:1px solid #ffffff12;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
}
.features-panel.show{
 display:grid
}
.feature-item{
 min-height:70px;
 border-radius:13px;
 background:#ffffff0d;
 border:1px solid #ffffff10;
 color:#fff;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
}
.feature-item:active{
 transform:scale(.94);
 background:#ffffff20
}
.feature-item .ico{
 font-size:24px;
 margin-bottom:4px
}
.feature-item span{
 font-size:9px;
 color:#eee;
 text-align:center
}

/* EXP */
.exp-card{
 margin:5px 10px 12px;padding:12px;border-radius:16px;
 background:linear-gradient(135deg,#3a175c,#1f1233);
 border:1px solid #ffffff15
}
.exp-head{
 display:flex;justify-content:space-between;font-size:12px
}
.exp-bar{
 height:8px;border-radius:10px;background:#ffffff15;
 margin:9px 0;overflow:hidden
}
.exp-fill{
 height:100%;width:20%;
 background:linear-gradient(90deg,#ffcc33,#ff4d8d);
 border-radius:10px
}
.tops{
 display:flex;justify-content:center;gap:30px;margin-top:10px
}
.top-user{text-align:center;font-size:9px}
.top-user img{
 width:38px;height:38px;border-radius:50%;
 object-fit:cover;border:2px solid #ffd54f;
 display:block;margin:auto
}

/* CHAT */
.chat-area{margin:0 10px 75px}
.chat-list{
 height:190px;overflow-y:auto;background:#0003;
 border-radius:15px;padding:9px
}
.msg{
 font-size:12px;padding:5px 3px;color:#eee
}
.msg b{color:#ffd54f}
.system{color:#bda9ff}

/* BOTTOM */
.bottom{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:100%;max-width:520px;padding:8px;background:#170b29ee;
 backdrop-filter:blur(12px);display:flex;gap:6px;z-index:30
}
.chat-input{flex:1;min-width:0}
.chat-input input{
 width:100%;height:43px;border-radius:22px;
 border:1px solid #ffffff18;background:#ffffff12;
 color:#fff;padding:0 14px;outline:none
}
.control{
 width:43px;height:43px;border-radius:50%;
 background:#ffffff12;color:#fff;font-size:18px
}
.control.active{background:#8e24aa}
.send{background:#e91e63}

/* MODALS */
.modal{
 position:fixed;inset:0;background:#0009;display:none;
 align-items:flex-end;justify-content:center;z-index:100
}
.modal.show{display:flex}
.sheet{
 width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
 background:linear-gradient(180deg,#32104e,#16091f);
 border-radius:22px 22px 0 0;padding:16px
}
.sheet-head{
 display:flex;align-items:center;justify-content:space-between;
 margin-bottom:12px
}
.close{
 background:#ffffff15;color:#fff;width:34px;height:34px;
 border-radius:50%
}
.field{margin:9px 0}
.field label{
 display:block;font-size:12px;color:#bbb;margin-bottom:5px
}
.field input,.field select{
 width:100%;height:44px;border-radius:11px;
 border:1px solid #ffffff18;background:#ffffff10;
 color:#fff;padding:0 12px;outline:none
}
.field input[type="file"]{
 padding:10px;
}
.primary{
 width:100%;height:44px;border-radius:12px;
 background:#e91e63;color:#fff;font-weight:bold
}
.secondary{
 width:100%;height:42px;border-radius:12px;
 background:#ffffff12;color:#fff;margin-top:7px
}

/* GIFTS */
.gifts-grid{
 display:grid;grid-template-columns:repeat(4,1fr);gap:7px
}
.gift{
 background:#ffffff0d;border-radius:12px;padding:8px;
 text-align:center;border:1px solid #ffffff10
}
.gift-icon{font-size:27px}
.gift-name{font-size:9px;margin-top:3px}
.gift-price{font-size:9px;color:#ffd54f;margin-top:3px}

/* OPTIONS */
.option-grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:9px
}
.option{
 padding:13px 5px;border-radius:13px;
 background:#ffffff0d;text-align:center;font-size:11px
}
.option div{
 font-size:25px;margin-bottom:5px
}

/* PROFILE */
.profile-card{text-align:center;padding:10px}
.profile-card img{
 width:85px;height:85px;border-radius:50%;
 object-fit:cover;border:3px solid #ffd54f
}
.profile-id{color:#bbb;font-size:11px;margin-top:5px}
.profile-actions{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:7px;margin-top:13px
}
.profile-actions button{
 height:38px;border-radius:10px;
 background:#ffffff12;color:#fff;font-size:11px
}

/* ROOM DP PREVIEW */
.dp-upload{
 display:flex;
 align-items:center;
 justify-content:center;
 margin:8px 0 12px;
}
.dp-preview{
 width:100px;height:100px;border-radius:50%;
 object-fit:cover;border:3px solid #ffd54f;
 background:#ffffff10
}

/* TOAST */
.toast{
 position:fixed;left:50%;bottom:75px;
 transform:translateX(-50%);
 background:#000d;padding:10px 15px;
 border-radius:20px;font-size:12px;
 display:none;z-index:200
}
.toast.show{display:block}
</style>
</head>

function normalizeRoom(r){

 r=r||{};


 let seats=
  Array.isArray(r.seats)
   ? r.seats.slice(0,9)
   : Array(9).fill(null);


 while(
  seats.length<9
 ){

  seats.push(null);
 }


 let users=
  r.users||
  {};

 let members=
  r.members||
  {};


 if(Array.isArray(users)){

  const obj={};

  users.forEach(
   u=>{

    if(
     u&&
     (
      u.userId||
      u.id
     )
    ){

     obj[
      String(
       u.userId||
       u.id
      )
     ]=
      u;
    }
   }
  );

  users=obj;
 }


 if(Array.isArray(members)){

  const obj={};

  members.forEach(
   u=>{

    if(
     u&&
     (
      u.userId||
      u.id
     )
    ){

     obj[
      String(
       u.userId||
       u.id
      )
     ]=
      u;
    }
   }
  );

  members=obj;
 }


 return{

  ...r,

  id:String(
   r.id||
   ROOM_ID
  ),

  name:
   r.name||
   r.roomName||
   "PawanVoice Room",

  roomName:
   r.roomName||
   r.name||
   "PawanVoice Room",

  dp:
   r.dp||
   DEFAULT_ROOM_DP,

  owner:String(
   r.owner||
   r.ownerId||
   ""
  ),

  ownerId:String(
   r.ownerId||
   r.owner||
   ""
  ),

  ownerName:
   r.ownerName||
   "",

  ownerDp:
   r.ownerDp||
   "",

  category:
   r.category||
   "General",

  privacy:
   r.privacy||
   "public",

  maxSeats:9,

  seats,

  users,

  members,

  roomExp:
   safeNumber(
    r.roomExp,
    0
   ),

  topUsers:
   Array.isArray(
    r.topUsers
   )
    ? r.topUsers
    : [],

  admins:
   Array.isArray(
    r.admins
   )
    ? r.admins
    : [],

  mutedUsers:
   r.mutedUsers||
   {},

  messages:
   Array.isArray(
    r.messages
   )
    ? r.messages
    : []
 };
}

/* =========================================================
   SEAT CLICK
   ========================================================= */

window.seatClick=
 function(index){

  if(
   index<0||
   index>8
  )
   return;


  /*
   अगर current user पहले से seat पर है
   और दूसरे seat पर click करता है,
   तो नया seat लेने से पहले old seat
   server state के अनुसार handle होगा.
  */

  if(
   currentSeat>=0&&
   currentSeat!==index
  ){

   toast(
    "पहले अपना current seat छोड़ें"
   );

   return;
  }


  if(!SOCKET){

   toast(
    "Connecting room..."
   );

   connectSocket();

   setTimeout(
    ()=>{
     if(SOCKET)
      takeSeat(index);
   },
   900
   );

   return;
  }


  if(
   !SOCKET.connected
  ){

   toast(
    "Room reconnecting..."
   );

   try{
    SOCKET.connect();
   }catch(e){}

   setTimeout(
    ()=>{
     if(
      SOCKET&&
      SOCKET.connected
     ){

      takeSeat(index);
     }
    },
    1000
   );

   return;
  }


  takeSeat(index);
};


function takeSeat(index){

 if(
  !SOCKET||
  !SOCKET.connected
 ){

  toast(
   "Room connection नहीं है"
  );

  return;
 }


 SOCKET.emit(
  "take-seat",
  {
   roomId:ROOM_ID,
   seat:index,
   userId:USER.id,
   id:USER.id,
   name:USER.name,
   dp:USER.dp,
   level:USER.level
  }
 );


 toast(
  "Seat request sent..."
 );
}

   ========================================================= */

window.leaveSeat=
 async function(){

  if(
   !ROOM||
   currentSeat<0
  ){

   currentSeat=-1;

   return;
  }


  const oldSeat=
   currentSeat;


  if(
   SOCKET&&
   SOCKET.connected
  ){

   SOCKET.emit(
    "leave-seat",
    {
     roomId:ROOM_ID,
     userId:USER.id,
     id:USER.id,
     seat:oldSeat
    }
   );
  }


  currentSeat=-1;

  micOn=false;


  try{

   const roomRef=
    ref(
     db,
     "rooms/"+ROOM_ID
    );


   const snap=
    await get(
     roomRef
    );


   if(!snap.exists())
    return;


   const room=
    normalizeRoom(
     snap.val()
    );


   let seats=
    Array.isArray(
     room.seats
    )
     ? room.seats.slice(
        0,
        9
       )
     : Array(9).fill(null);


   while(
    seats.length<9
   ){

    seats.push(null);
   }


   seats=
    seats.map(
     seat=>{

      if(
       seat&&
       String(
        seat.userId||
        seat.id||
        ""
       )===
       String(USER.id)
      ){

       return null;
      }

      return seat;
     }
    );


   await update(
    roomRef,
    {
     seats,
     updatedAt:
      Date.now()
    }
   );


   ROOM.seats=
    seats;


   renderRoom();

  }catch(e){

   console.log(
    "Firebase leave seat:",
    e
   );
  }
};


/* =========================================================
   FIREBASE PRESENCE
   ========================================================= */

async function setupFirebasePresence(){

 try{

  const memberRef=
   ref(
    db,
    "rooms/"+ROOM_ID+
    "/members/"+USER.id
   );


  const userRef=
   ref(
    db,
    "rooms/"+ROOM_ID+
    "/users/"+USER.id
   );


  /*
   पुराने onDisconnect को cancel करके
   current browser connection का नया
   disconnect action लगाते हैं.
  */

  try{
   await onDisconnect(
    memberRef
   ).cancel();
  }catch(e){}


  try{
   await onDisconnect(
    userRef
   ).cancel();
  }catch(e){}


  await onDisconnect(
   memberRef
  ).remove();


  await onDisconnect(
   userRef
  ).remove();


  /*
   अगर user Firebase seat पर है,
   तो disconnect पर seat भी खाली होगी.
  */

  if(
   currentSeat>=0
  ){

   const seatRef=
    ref(
     db,
     "rooms/"+ROOM_ID+
     "/seats/"+currentSeat
    );


   try{
    await onDisconnect(
     seatRef
    ).set(null);
   }catch(e){}
  }


  firebasePresenceReady=true;

 }catch(e){

  firebasePresenceReady=false;

  console.log(
   "Presence setup:",
   e
  );
 }
}


/* =========================================================
   JOIN FIREBASE ROOM
   ========================================================= */

async function joinFirebaseRoom(){

 try{

  const roomRef=
   ref(
    db,
    "rooms/"+ROOM_ID
   );


  const snap=
   await get(
    roomRef
   );


  /*
   Firebase में room नहीं है तो
   fake room member नहीं बनाएंगे.
   Render/socket room response के बाद
   sync होगा.
  */

  if(!snap.exists()){

   firebaseJoined=false;

   return false;
  }


  const room=
   normalizeRoom(
    snap.val()
   );


  room.members=
   room.members||
   {};


  room.users=
   room.users||
   {};


  const userData={

   userId:
    String(USER.id),

   id:
    String(USER.id),

   name:
    USER.name,

   dp:
    USER.dp,

   level:
    USER.level,

   joinedAt:
    Date.now()
  };


  room.members[
   String(USER.id)
  ]=
   userData;


  room.users[
   String(USER.id)
  ]=
   userData;


  await update(
   roomRef,
   {

    members:
     room.members,

    users:
     room.users,

    updatedAt:
     Date.now()
   }
  );


  ROOM=
   normalizeRoom({
    ...room,

    members:
     room.members,

    users:
     room.users
   });


  renderRoom();


  firebaseJoined=true;


  await setupFirebasePresence();


  return true;


 }catch(e){

  firebaseJoined=false;

  console.log(
   "Firebase room join:",
   e
  );

  return false;
 }
}


/* =========================================================
   SYNC SERVER ROOM TO FIREBASE
   ========================================================= */

async function syncServerRoomToFirebase(
 roomData
){

 if(!roomData)
  return;


 try{

  const normalized=
   normalizeRoom(
    roomData
   );


  /*
   Server room state को Firebase में
   sync करते हैं ताकि दूसरे phone पर
   same room दिखाई दे.
  */

  const safeRoom={

   ...normalized,

   id:normalized.id,

   name:normalized.name,

   roomName:normalized.roomName,

   dp:
    normalized.dp||
    DEFAULT_ROOM_DP,

   owner:
    normalized.owner,

   ownerId:
    normalized.ownerId,

   ownerName:
    normalized.ownerName||

    (
     normalized.ownerId===
     USER.id
      ? USER.name
      : ""
    ),

   ownerDp:
    normalized.ownerDp||

    (
     normalized.ownerId===
     USER.id
      ? USER.dp
      : ""
    ),

   seats:
    normalized.seats||
    Array(9).fill(null),

   users:
    normalized.users||
    {},

   members:
    normalized.members||
    {},

   roomExp:
    safeNumber(
     normalized.roomExp,
     0
    ),

   updatedAt:
    Date.now()
  };


  await update(
   ref(
    db,
    "rooms/"+ROOM_ID
   ),
   safeRoom
  );


 }catch(e){

  console.log(
   "Server -> Firebase:",
   e
  );
 }
}


/* =========================================================
   LEAVE FIREBASE ROOM
   ========================================================= */

async function leaveFirebaseRoom(){

 if(
  !firebaseJoined&&
  !ROOM
 )
  return;


 try{

  const roomRef=
   ref(
    db,
    "rooms/"+ROOM_ID
   );


  const snap=
   await get(
    roomRef
   );


  if(!snap.exists())
   return;


  const room=
   normalizeRoom(
    snap.val()
   );


  const members={
   ...(room.members||{})
  };


  const users={
   ...(room.users||{})
  };


  delete members[
   String(USER.id)
  ];


  delete users[
   String(USER.id)
  ];


  let seats=
   Array.isArray(
    room.seats
   )
    ? room.seats.slice(
       0,
       9
      )
    : Array(9).fill(null);


  while(
   seats.length<9
  ){

   seats.push(null);
  }


  seats=
   seats.map(
    seat=>{

     if(
      seat&&
      String(
       seat.userId||
       seat.id||
       ""
      )===
      String(USER.id)
     ){

      return null;
     }

     return seat;
    }
   );


  await update(
   roomRef,
   {

    members,

    users,

    seats,

    updatedAt:
     Date.now()
   }
  );


  firebaseJoined=false;


 }catch(e){

  console.log(
   "Firebase room leave:",
   e
  );
 }
}


/* =========================================================
   SOCKET
   ========================================================= */

function connectSocket(){

 if(SOCKET)
  return;


 try{

  SOCKET=
   io(
    SERVER_URL,
    {
     transports:[
      "websocket",
      "polling"
     ],

     reconnection:true,

     reconnectionAttempts:
      Infinity,

     reconnectionDelay:
      1000,

     reconnectionDelayMax:
      5000,

     timeout:
      10000
    }
   );


  SOCKET.on(
   "connect",
   async ()=>{

    console.log(
     "Socket connected"
    );


    document.getElementById(
     "voiceStatus"
    ).textContent=
     "Connected";


    SOCKET.emit(
     "register-user",
     {
      userId:USER.id,
      id:USER.id,
      name:USER.name,
      dp:USER.dp,
      level:USER.level
     }
    );


    SOCKET.emit(
     "join-room",
     {
      roomId:ROOM_ID,
      userId:USER.id,
      id:USER.id,
      name:USER.name,
      dp:USER.dp,
      level:USER.level
     }
    );


    joined=true;


    /*
     Firebase membership फिर से set करें.
    */

    await joinFirebaseRoom();


    await syncUserToRoom();


    /*
     अगर server connected room भेजता है
     तो बाद में room-state उसे update करेगा.
    */
   }
  );


  SOCKET.on(
   "disconnect",
   ()=>{
 
    document.getElementById(
     "voiceStatus"
    ).textContent=
     "Reconnecting";

    joined=false;
   }
  );


  SOCKET.on(
   "connect_error",
   ()=>{
 
    document.getElementById(
     "voiceStatus"
    ).textContent=
     "Connection Error";
   }
  );


  /* ROOM STATE */

  SOCKET.on(
   "room-state",
   async data=>{

    if(!data)
     return;


    ROOM=
     normalizeRoom(
      data.room||
      data
     );


    renderRoom();


    await syncServerRoomToFirebase(
     ROOM
    );


    await setupFirebasePresence();
   }
  );


  /* ROOM JOINED */

  SOCKET.on(
   "room-joined",
   async data=>{

    toast(
     "💜 Room joined"
    );


    if(data?.room){

     ROOM=
      normalizeRoom(
       data.room
      );


     renderRoom();


     await syncServerRoomToFirebase(
      ROOM
     );


     await joinFirebaseRoom();


     await setupFirebasePresence();
    }
   }
  );


  /* USER JOIN */

  SOCKET.on(
   "user-joined",
   user=>{

    if(user){

     addSystem(
      "👋 "+
      (
       user.name||
       "User"
      )+
      " joined the room"
     );
    }
   }
  );


  /* USER LEFT */

  SOCKET.on(
   "user-left",
   user=>{

    if(user){

     addSystem(
      "👋 "+
      (
       user.name||
       "User"
      )+
      " left the room"
     );
    }
   }
  );


  /* CHAT */

  SOCKET.on(
   "chat",
   msg=>{
    addChatMessage(msg);
   }
  );


  SOCKET.on(
   "room-chat",
   msg=>{
    addChatMessage(msg);
   }
  );


  /* EMOJI */

  SOCKET.on(
   "emoji",
   data=>{

    if(data){

     addSystem(
      "😊 "+
      (
       data.name||
       "User"
      )+
      " sent "+
      (
       data.emoji||
       ""
      )
     );
    }
   }
  );


  /* GIFT */

  SOCKET.on(
   "gift-sent",
   data=>{

    if(data){

     addSystem(
      "🎁 "+
      (
       data.senderName||
       "User"
      )+
      " sent "+
      (
       data.giftName||
       "Gift"
      )
     );
    }


    if(data.wallet){

     USER.coins=
      safeNumber(
       data.wallet.coins,
       USER.coins
      );


     USER.diamonds=
      safeNumber(
       data.wallet.diamonds,
       USER.diamonds
      );


     saveLocalUser();
    }
   }
  );


  SOCKET.on(
   "gift-received",
   data=>{

    if(data){

     addSystem(
      "🎉 "+
      (
       data.receiverName||
       "User"
      )+
      " received "+
      (
       data.giftName||
       "Gift"
      )
     );
    }
   }
  );


  /* WALLET */

  SOCKET.on(
   "wallet",
   wallet=>{

    if(wallet){

     USER.coins=
      safeNumber(
       wallet.coins,
       USER.coins
      );


     USER.diamonds=
      safeNumber(
       wallet.diamonds,
       USER.diamonds
      );


     saveLocalUser();
    }
   }
  );


  /* FOLLOW */

  SOCKET.on(
   "follow-result",
   data=>{

    toast(
     data?.message||
     "Follow updated"
    );
   }
  );


  /* CP */

  SOCKET.on(
   "cp-result",
   data=>{

    toast(
     data?.message||
     "CP request sent"
    );
   }
  );


  /* ENTRY */

  SOCKET.on(
   "user-entry",
   data=>{

    if(data?.name){

     addSystem(
      "✨ "+
      data.name+
      " entered"
     );
    }
   }
  );


  /* ROOM UPDATE */

  SOCKET.on(
   "room-updated",
   async data=>{

    if(data?.room){

     ROOM=
      normalizeRoom(
       data.room
      );

    }else if(data){

     ROOM=
      normalizeRoom(
       data
      );
    }


    renderRoom();


    await syncServerRoomToFirebase(
     ROOM
    );
   }
  );


  /* =======================================================
     SEAT EVENTS - कई server versions को support
     ======================================================= */

  const handleSeatData=
   data=>{

    if(!data)
     return;


    if(data.room){

     ROOM=
      normalizeRoom(
       data.room
      );

     renderRoom();

     return;
    }


    if(data.seats){

     ROOM=
      normalizeRoom({
       ...ROOM,
       seats:data.seats
      });

     renderRoom();

     return;
    }


    if(
     data.seat!==undefined&&
     data.user
    ){

     if(!ROOM)
      return;


     ROOM.seats=
      ROOM.seats||
      Array(9).fill(null);


     ROOM.seats[
      Number(data.seat)
     ]=
      data.user;


     renderRoom();
    }
   };


  SOCKET.on(
   "seat-updated",
   handleSeatData
  );


  SOCKET.on(
   "seat-taken",
   handleSeatData
  );


  SOCKET.on(
   "seat-left",
   handleSeatData
  );


  SOCKET.on(
   "seat-state",
   handleSeatData
  );


  /* =======================================================
     WEBRTC
     ======================================================= */

  SOCKET.on(
   "offer",
   handleOffer
  );


  SOCKET.on(
   "webrtc-offer",
   handleOffer
  );


  SOCKET.on(
   "answer",
   handleAnswer
  );


  SOCKET.on(
   "webrtc-answer",
   handleAnswer
  );


  SOCKET.on(
   "ice-candidate",
   handleIce
  );


  SOCKET.on(
   "webrtc-ice",
   handleIce
  );


 }catch(e){

  console.error(e);

  toast(
   "Socket connection failed"
  );
 }
}

async function updateFirebaseSeatMic(
 status
){

 if(currentSeat<0)
  return;


 try{

  const seatRef=
   ref(
    db,
    "rooms/"+ROOM_ID+
    "/seats/"+currentSeat
   );


  const snap=
   await get(
    seatRef
   );


  if(!snap.exists())
   return;


  const seat=
   snap.val();


  if(
   !seat||
   String(
    seat.userId||
    seat.id||
    ""
   )!==
   String(USER.id)
  )
   return;


  await update(
   seatRef,
   {
    mic:
     Boolean(status),

    updatedAt:
     Date.now()
   }
  );


 }catch(e){

  console.log(
   "Firebase mic:",
   e
  );
}


}


async function startMicrophone(){

 if(
  !navigator.mediaDevices||
  !navigator.mediaDevices
   .getUserMedia
 ){

  throw new Error(
   "Microphone not supported"
  );
 }


 localStream=
  await navigator.mediaDevices
   .getUserMedia({
    audio:{
     echoCancellation:true,
     noiseSuppression:true,
     autoGainControl:true
    },

    video:false
   });


 localStream
  .getTracks()
  .forEach(
   track=>
    track.enabled=true
  );


 /*
  Add local audio to existing peers.
 */

 Object.keys(
  rtcPeers
 ).forEach(
  async targetId=>{

   const pc=
    rtcPeers[targetId];

   if(!pc)
    return;


   localStream
    .getTracks()
    .forEach(
     track=>{

      try{

       pc.addTrack(
        track,
        localStream
       );

      }catch(e){}
     }
    );
  }
 );
}

/* =========================================================
   WEBRTC
   ========================================================= */

const rtcConfig={

 iceServers:[

  {
   urls:[
    "stun:stun.l.google.com:19302",
    "stun:stun1.l.google.com:19302"
   ]
  }

 ]
};


async function createPeer(
 targetId
){

 if(
  rtcPeers[targetId]
 )
  return rtcPeers[targetId];


 const pc=
  new RTCPeerConnection(
   rtcConfig
  );


 rtcPeers[targetId]=
  pc;


 if(localStream){

  localStream
   .getTracks()
   .forEach(
    track=>
     pc.addTrack(
      track,
      localStream
     )
   );
 }


 pc.onicecandidate=
  e=>{

   if(
    e.candidate&&
    SOCKET&&
    SOCKET.connected
   ){

    SOCKET.emit(
     "ice-candidate",
     {
      roomId:ROOM_ID,
      from:USER.id,
      to:targetId,
      candidate:e.candidate
     }
    );
   }
  };


 pc.ontrack=
  e=>{

   let audio=
    document.getElementById(
     "audio-"+targetId
    );


   if(!audio){

    audio=
     document.createElement(
      "audio"
     );


    audio.id=
     "audio-"+targetId;


    audio.autoplay=true;

    audio.playsInline=true;


    document.body.appendChild(
     audio
    );
   }


   audio.srcObject=
    e.streams[0];


   audio.muted=
    !speakerOn;


   remoteStreams[
    targetId
   ]=
    e.streams[0];
  };


 pc.onconnectionstatechange=
  ()=>{

   if(
    pc.connectionState===
    "failed"||
    pc.connectionState===
    "closed"
   ){

    try{
     pc.close();
    }catch(e){}


    delete rtcPeers[
     targetId
    ];


    const audio=
     document.getElementById(
      "audio-"+targetId
     );


    if(audio){

     audio.remove();
    }
   }
  };


 return pc;
}


async function handleOffer(
 data
){

 if(!data)
  return;


 const from=
  data.from||
  data.userId||
  data.sender;


 if(
  !from||
  String(from)===
  String(USER.id)
 )
  return;


 const pc=
  await createPeer(
   String(from)
  );


 const offer=
  data.offer||
  data;


 try{

  await pc.setRemoteDescription(
   new RTCSessionDescription(
    offer
   )
  );


  const answer=
   await pc.createAnswer();


  await pc.setLocalDescription(
   answer
  );


  if(
   SOCKET&&
   SOCKET.connected
  ){

   SOCKET.emit(
    "answer",
    {
     roomId:ROOM_ID,
     from:USER.id,
     to:String(from),
     answer
    }
   );
  }

 }catch(e){

  console.log(
   "WebRTC offer:",
   e
  );
 }
}


async function handleAnswer(
 data
){

 if(!data)
  return;


 const from=
  data.from||
  data.userId||
  data.sender;


 if(!from)
  return;


 const pc=
  rtcPeers[
   String(from)
  ];


 if(!pc)
  return;


 try{

  await pc.setRemoteDescription(
   new RTCSessionDescription(
    data.answer||
    data
   )
  );

 }catch(e){

  console.log(
   "WebRTC answer:",
   e
  );
 }
}


async function handleIce(
 data
){

 if(!data)
  return;


 const from=
  data.from||
  data.userId||
  data.sender;


 if(!from)
  return;


 const pc=
  rtcPeers[
   String(from)
  ];


 if(!pc)
  return;


 try{

  const candidate=
   data.candidate||
   data;


  await pc.addIceCandidate(
   new RTCIceCandidate(
    candidate
   )
  );

 }catch(e){}
}

window.sendGift=
 function(giftId){

  const gift=
   GIFTS.find(
    g=>
     g.id===
     giftId
   );


  if(!gift)
   return;


  const target=
   ROOM?.seats?.find(
    u=>
     u&&
     (
      u.userId||
      u.id
     )&&
     String(
      u.userId||
      u.id
     )!==
     String(USER.id)
   )||
   ROOM?.seats?.find(
    u=>
     u&&
     (
      u.userId||
      u.id
     )
   );


  if(!target){

   toast(
    "Gift receiver नहीं मिला"
   );

   return;
  }


  const receiverId=
   String(
    target.userId||
    target.id
   );


  if(
   USER.coins<
   gift.price
  ){

   toast(
    "Coins कम हैं"
   );

   return;
  }


  if(
   SOCKET&&
   SOCKET.connected
  ){

   SOCKET.emit(
    "gift",
    {
     roomId:ROOM_ID,

     userId:
      USER.id,

     senderId:
      USER.id,

     senderName:
      USER.name,

     receiverId,

     giftId:
      gift.id,

     giftName:
      gift.name,

     quantity:1,

     price:
      gift.price
    }
   );

  }else{

   USER.coins-=
    gift.price;

   saveUser();

   toast(
    "🎁 Gift sent"
   );
  }


  document.getElementById(
   "giftCoins"
  ).textContent=
   USER.coins.toLocaleString(
    "en-IN"
   );
 };

/* =========================================================
   UPLOAD ROOM DP
   ========================================================= */

async function uploadRoomDp(
 file
){

 if(!file)
  return null;


 if(
  !file.type.startsWith(
   "image/"
  )
 ){

  throw new Error(
   "Invalid image"
  );
 }


 if(
  file.size>
  5*1024*1024
 ){

  throw new Error(
   "Image too large"
  );
 }


 const extension=
  (
   file.name
    .split(".")
    .pop()||
   "jpg"
  )
   .toLowerCase()
   .replace(
    /[^a-z0-9]/g,
    ""
   )||
   "jpg";


 const path=
  "rooms/"+
  ROOM_ID+
  "/room-dp-"+
  USER.id+
  "-"+
  Date.now()+
  "."+
  extension;


 const fileRef=
  storageRef(
   storage,
   path
  );


 await uploadBytes(
  fileRef,
  file,
  {
   contentType:
    file.type
  }
 );


 return await getDownloadURL(
  fileRef
 );
}

window.saveRoomSettings=
 async function(){

  if(!isRoomAdmin()){

   toast(
    "Only Owner/Admin can change room"
   );

   return;
  }


  const name=
   document.getElementById(
    "editRoomName"
   ).value.trim()||
   ROOM.name;


  let dp=
   document.getElementById(
    "editRoomDp"
   ).value.trim()||
   ROOM.dp;


  const file=
   document.getElementById(
    "roomDpFile"
   ).files?.[0];


  if(file){

   try{

    toast(
     "⏳ Room DP uploading..."
    );


    const uploadedUrl=
     await uploadRoomDp(
      file
     );


    if(uploadedUrl){

     dp=
      uploadedUrl;
    }


   }catch(e){

    console.error(
     "Room DP upload:",
     e
    );


    toast(
     "Room DP upload failed"
    );


    return;
   }
  }


  const category=
   document.getElementById(
    "editCategory"
   ).value;


  const privacy=
   document.getElementById(
    "roomPrivacy"
   ).value;


  const changes={

   name,

   roomName:
    name,

   dp,

   category,

   privacy,

   updatedAt:
    Date.now()
  };


  try{

   await update(
    ref(
     db,
     "rooms/"+ROOM_ID
    ),
    changes
   );

  }catch(e){

   console.log(
    "Firebase room update:",
    e
   );
  }


  try{

   await fetch(
    SERVER_URL+
    "/api/room/"+
    encodeURIComponent(
     ROOM_ID
    ),
    {
     method:"PATCH",

     headers:{
      "Content-Type":
       "application/json"
     },

     body:
      JSON.stringify({
       ...changes,

       userId:
        USER.id,

       ownerId:
        ROOM.ownerId
      })
    }
   );

  }catch(e){}


  if(
   SOCKET&&
   SOCKET.connected
  ){

   SOCKET.emit(
    "room-update",
    {
     roomId:ROOM_ID,
     userId:USER.id,
     ...changes
    }
   );
  }


  ROOM={
   ...ROOM,
   ...changes
  };


  renderRoom();


  closeModal(
   "settingsModal"
  );


  toast(
   "✅ Room updated"
  );
 };

    .map(String)
    .includes(

  try{

window.followUser=
 function(userId){

  if(
   String(userId)===
   String(USER.id)
  ){

   toast(
    "You cannot follow yourself"
   );

   return;
  }


  if(
   SOCKET&&
   SOCKET.connected
  ){

   SOCKET.emit(
    "follow",
    {
     roomId:ROOM_ID,
     userId:USER.id,
     targetUserId:userId,
     followingId:userId
    }
   );
  }


  toast(
   "❤️ Follow request sent"
  );
 };

window.inviteRoom=
 async function(){

  const link=
   location.origin+
   location.pathname+
   "?room="+
   encodeURIComponent(
    ROOM_ID
   );


  try{

   await navigator.clipboard
    .writeText(
     link
    );


   toast(
    "📨 Room invite copied"
   );


  }catch(e){

   showFeature(
    "📨 Invite Room",

    `
    <p style="font-size:12px;color:#bbb">
     Share this room:
    </p>

    <div style="
     word-break:break-all;
     background:#ffffff0d;
     padding:10px;
     border-radius:10px;
     font-size:11px">

     ${escapeHtml(link)}

    </div>
    `
   );
  }
 };


/* =========================================================
   ROOM EXP
   ========================================================= */

function calculateRoomLevel(
 exp
){

 let level=1;

 let need=10000;

 let left=
  safeNumber(
   exp,
   0
  );


 while(
  left>=need&&
  level<1000
 ){

  left-=need;

  level++;

  need=
   level*10000;
 }


 return level;
}


function renderRoomExp(){

 const exp=
  safeNumber(
   ROOM.roomExp,
   0
  );


 document.getElementById(
  "roomExpText"
 ).textContent=
  exp.toLocaleString(
   "en-IN"
  )+
  " EXP";


 const level=
  calculateRoomLevel(
   exp
  );


 document.getElementById(
  "roomLevel"
 ).textContent=
  level;


 const next=
  level*10000;


 const percent=
  Math.min(
   100,
   (
    exp%next
   )/
   next*
   100
  );


 document.getElementById(
  "roomExpFill"
 ).style.width=
  Math.max(
   2,
   percent
  )+
  "%";
}


function renderTopUsers(){

 let tops=
  ROOM.topUsers||
  [];


 if(!tops.length){

  tops=
   (ROOM.seats||[])
    .filter(Boolean)
    .slice(
     0,
     3
    );
 }


 for(
  let i=0;
  i<3;
  i++
 ){

  const u=
   tops[i];


  const dp=
   document.getElementById(
    "top"+
    (i+1)+
    "dp"
   );


  const name=
   document.getElementById(
    "top"+
    (i+1)+
    "name"
   );


  if(u){

   dp.src=
    u.dp||
    DEFAULT_ROOM_DP;


   name.textContent=
    u.name||
    "User";

  }else{

   dp.src=
    DEFAULT_ROOM_DP;

   name.textContent=
    "TOP "+
    (i+1);
  }
 }
}

    );


   if(res.ok)

/* =========================================================
   PROFILE UPDATE -> ROOM
   ========================================================= */

async function syncUserToRoom(){

 try{

  const snap=
   await get(
    ref(
     db,
     "rooms/"+ROOM_ID
    )
   );


  if(!snap.exists())
   return;


  const room=
   normalizeRoom(
    snap.val()
   );


  let changed=false;


  if(
   room.users?.[
    USER.id
   ]
  ){

   room.users[
    USER.id
   ].name=
    USER.name;

   room.users[
    USER.id
   ].dp=
    USER.dp;

   room.users[
    USER.id
   ].level=
    USER.level;

   changed=true;
  }


  if(
   room.members?.[
    USER.id
   ]
  ){

   room.members[
    USER.id
   ].name=
    USER.name;

   room.members[
    USER.id
   ].dp=
    USER.dp;

   room.members[
    USER.id
   ].level=
    USER.level;

   changed=true;
  }


  room.seats=
   room.seats||
   Array(9).fill(null);


  room.seats=
   room.seats.map(
    u=>{

     if(
      u&&
      String(
       u.userId||
       u.id||
       ""
      )===
      String(USER.id)
     ){

      changed=true;


      return{

       ...u,

       userId:
        USER.id,

       id:
        USER.id,

       name:
        USER.name,

       dp:
        USER.dp,

       level:
        USER.level
      };
     }


     return u;
    }
   );


  if(changed){

   await update(
    ref(
     db,
     "rooms/"+ROOM_ID
    ),
    {

     users:
      room.users||
      {},

     members:
      room.members||
      {},

     seats:
      room.seats,

     updatedAt:
      Date.now()
    }
   );
  }


 }catch(e){

  console.log(
   "syncUserToRoom:",
   e
  );
 }
}


/* =========================================================
   COMPLETE ROOM LEAVE
   ========================================================= */

async function leaveRoomCompletely(){

 if(leavingRoom)
  return;


 leavingRoom=true;


 try{

  /*
   Stop microphone first.
  */

  if(localStream){

   localStream
    .getTracks()
    .forEach(
     track=>{
      try{
       track.stop();
      }catch(e){}
     }
    );

   localStream=null;
  }


  micOn=false;


  /*
   Leave Firebase.
  */

  await leaveFirebaseRoom();


  /*
   Leave socket room.
  */

  if(
   SOCKET&&
   SOCKET.connected
  ){

   SOCKET.emit(
    "leave-seat",
    {
     roomId:ROOM_ID,
     userId:USER.id,
     id:USER.id,
     seat:currentSeat
    }
   );


   SOCKET.emit(
    "leave-room",
    {
     roomId:ROOM_ID,
     userId:USER.id,
     id:USER.id
    }
   );
  }


  /*
   Close WebRTC peers.
  */

  Object.keys(
   rtcPeers
  ).forEach(
   id=>{

    try{

     rtcPeers[id].close();

    }catch(e){}

    delete rtcPeers[id];


    const audio=
     document.getElementById(
      "audio-"+id
     );


    if(audio)
     audio.remove();
   }
  );


  currentSeat=-1;

  joined=false;


 }catch(e){

  console.log(
   "Complete leave:",
   e
  );
 }
}


/* =========================================================
   BACK
   ========================================================= */

window.goBack=
 async function(){

  if(leavingRoom)
   return;


  await leaveRoomCompletely();


  if(
   history.length>1
  ){

   history.back();

  }else{

   location.href=
    "index.html";
  }
 };


/* =========================================================
   PAGE VISIBILITY
   ========================================================= */

document.addEventListener(
 "visibilitychange",
 async ()=>{

  if(
   !document.hidden
  ){

   if(
    SOCKET&&
    !SOCKET.connected
   ){

    try{

     SOCKET.connect();

    }catch(e){}
   }


   /*
    वापस app में आने पर membership
    restore करें.
   */

   if(
    SOCKET&&
    SOCKET.connected
   ){

    try{

     await joinFirebaseRoom();

     await syncUserToRoom();

    }catch(e){}
   }
  }
 });

/* =========================================================
   INIT
   ========================================================= */

async function init(){

 try{

  await ensureUserId();

  await loadUser();

  await loadRoom();

  /*
   Firebase room join पहले.
  */

  await joinFirebaseRoom();

  await syncUserToRoom();

  /*
   Socket connection.
  */

  connectSocket();

  /*
   Theme.
  */

  if(
   ROOM?.themeBackground
  ){

   applyRoomTheme();
  }


  /*
   Socket को थोड़ा time दें.
  */

  setTimeout(
   ()=>{

    if(
     SOCKET&&
     SOCKET.connected&&
     !joined
    ){

     SOCKET.emit(
      "join-room",
      {
       roomId:ROOM_ID,
       userId:USER.id,
       id:USER.id,
       name:USER.name,
       dp:USER.dp,
       level:USER.level
      }
     );

     joined=true;
    }

   },
   1200
  );


 }catch(e){

  console.error(
   "Room init:",
   e
  );


  toast(
   "Room loading error"
  );
 }
}


init();
