<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PawanVoice Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#170b35;
  color:#fff;
}

body{
  background:
    radial-gradient(circle at 15% 15%,rgba(255,90,210,.20),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(70,130,255,.22),transparent 30%),
    linear-gradient(180deg,#28105a 0%,#180c38 52%,#0c071e 100%);
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:#fff;
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

.bg-circle{
  position:absolute;
  border-radius:50%;
  filter:blur(1px);
  opacity:.22;
  pointer-events:none;
}

.bg1{
  width:180px;
  height:180px;
  background:#ff56c8;
  left:-90px;
  top:150px;
}

.bg2{
  width:230px;
  height:230px;
  background:#5269ff;
  right:-120px;
  top:300px;
}

.bg3{
  width:160px;
  height:160px;
  background:#9d4dff;
  left:35%;
  bottom:-100px;
}

.header{
  height:68px;
  display:flex;
  align-items:center;
  padding:8px 10px;
  gap:8px;
  position:relative;
  z-index:5;
  background:rgba(20,8,48,.42);
  backdrop-filter:blur(12px);
}

.back{
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  font-size:21px;
}

.room-dp{
  width:46px;
  height:46px;
  border-radius:15px;
  object-fit:cover;
  background:linear-gradient(135deg,#ff55d6,#614cff);
  border:2px solid rgba(255,255,255,.5);
}

.room-info{
  min-width:0;
  flex:1;
}

.room-name{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-id{
  font-size:11px;
  color:#c9bce6;
  margin-top:3px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:6px;
}

.small-btn{
  height:35px;
  padding:0 10px;
  border-radius:18px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.12);
  font-size:12px;
}

.count{
  background:rgba(0,0,0,.25);
  padding:8px 9px;
  border-radius:18px;
  font-size:12px;
}

.content{
  position:absolute;
  top:68px;
  bottom:136px;
  left:0;
  right:0;
  overflow:hidden;
}

.host-info{
  text-align:center;
  height:145px;
  padding-top:8px;
}

.host-label{
  font-size:11px;
  color:#d6c9ed;
  margin-bottom:5px;
}

.host-seat{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  width:120px;
}

.avatar-big{
  width:78px;
  height:78px;
  border-radius:50%;
  padding:4px;
  background:linear-gradient(135deg,#ffda64,#ff4bc8,#6e59ff);
  box-shadow:
    0 0 0 4px rgba(255,255,255,.08),
    0 8px 30px rgba(0,0,0,.35);
  position:relative;
}

.avatar-big img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  background:#38205f;
}

.crown{
  position:absolute;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
  font-size:25px;
  filter:drop-shadow(0 3px 5px #000);
}

.host-name{
  margin-top:5px;
  max-width:115px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
  font-weight:800;
}

.host-tag{
  margin-top:3px;
  font-size:9px;
  padding:3px 8px;
  border-radius:8px;
  background:linear-gradient(90deg,#ffbd42,#ff4b9b);
}

.seats{
  width:100%;
  padding:0 8px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px 5px;
}

.seat{
  min-width:0;
  text-align:center;
  position:relative;
}

.avatar{
  width:56px;
  height:56px;
  margin:auto;
  border-radius:50%;
  padding:3px;
  background:rgba(255,255,255,.22);
  position:relative;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  background:#35205b;
}

.seat.occupied .avatar{
  background:linear-gradient(135deg,#ff5acb,#6c58ff);
  box-shadow:0 5px 18px rgba(0,0,0,.35);
}

.empty-avatar{
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  color:#b9a9d5;
  background:rgba(255,255,255,.07);
}

.seat-name{
  font-size:11px;
  font-weight:700;
  margin-top:5px;
  max-width:82px;
  margin-left:auto;
  margin-right:auto;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.seat-number{
  font-size:9px;
  color:#9384b0;
  margin-top:2px;
}

.mic{
  position:absolute;
  right:calc(50% - 31px);
  bottom:19px;
  width:18px;
  height:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  background:#30204c;
  font-size:10px;
  border:1px solid rgba(255,255,255,.25);
}

.mic.on{
  background:#20b96d;
}

.features{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:17px 10px 6px;
  scrollbar-width:none;
}

.features::-webkit-scrollbar{
  display:none;
}

.feature{
  flex:0 0 auto;
  min-width:88px;
  height:42px;
  border-radius:13px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:10px;
  color:#eee7fa;
}

.exp{
  margin:6px 10px 0;
  height:53px;
  border-radius:17px;
  padding:6px 9px;
  background:linear-gradient(90deg,rgba(255,95,196,.16),rgba(88,90,255,.18));
  border:1px solid rgba(255,255,255,.10);
  display:flex;
  align-items:center;
  justify-content:space-around;
}

.exp-title{
  font-size:10px;
  color:#d8cbea;
}

.rank{
  text-align:center;
  font-size:10px;
}

.rank b{
  display:block;
  font-size:15px;
}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:136px;
  z-index:10;
  background:linear-gradient(180deg,rgba(15,7,33,.15),rgba(8,4,18,.96) 25%);
  padding:7px 9px 10px;
}

.chat-row{
  height:46px;
  display:flex;
  gap:7px;
}

.message{
  flex:1;
  min-width:0;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.08);
  color:white;
  border-radius:22px;
  padding:0 14px;
  outline:none;
}

.message::placeholder{
  color:#a99cbd;
}

.emoji-btn{
  width:43px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  font-size:20px;
}

.control-row{
  height:58px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  margin-top:3px;
}

.control{
  width:47px;
  height:47px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.08);
  font-size:20px;
}

.control.active{
  background:linear-gradient(135deg,#ff4eb8,#694dff);
}

.control-label{
  display:block;
  font-size:8px;
  color:#aaa0bd;
  margin-top:2px;
}

.emoji-panel{
  display:none;
  position:absolute;
  left:8px;
  right:8px;
  bottom:124px;
  padding:12px;
  border-radius:18px;
  background:#21113e;
  border:1px solid rgba(255,255,255,.12);
  grid-template-columns:repeat(8,1fr);
  gap:8px;
  z-index:30;
}

.emoji-panel.show{
  display:grid;
}

.emoji{
  background:rgba(255,255,255,.07);
  border-radius:10px;
  padding:7px 2px;
  font-size:21px;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(4,2,12,.65);
  backdrop-filter:blur(5px);
  align-items:flex-end;
  justify-content:center;
}

.overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:480px;
  background:#20103d;
  border-radius:24px 24px 0 0;
  padding:18px;
  box-shadow:0 -10px 40px rgba(0,0,0,.4);
}

.modal h3{
  margin:0 0 15px;
}

.modal-btn{
  width:100%;
  height:46px;
  border-radius:14px;
  margin-top:8px;
  background:rgba(255,255,255,.08);
  text-align:left;
  padding:0 15px;
}

.modal-btn.danger{
  background:rgba(255,60,90,.14);
}

.close{
  background:rgba(255,255,255,.08);
  text-align:center;
}

.toast{
  position:fixed;
  left:50%;
  bottom:150px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  z-index:200;
  background:rgba(20,10,35,.94);
  padding:10px 15px;
  border-radius:18px;
  font-size:12px;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.loading{
  position:fixed;
  inset:0;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#13082b;
  font-weight:800;
}

.hidden{
  display:none!important;
}

@media(min-width:600px){
  .app{
    max-width:480px;
    margin:auto;
    box-shadow:0 0 60px rgba(0,0,0,.45);
  }

  .header,
  .content,
  .bottom{
    max-width:480px;
  }
}
</style>
</head>

<body>

<div id="loading" class="loading">PawanVoice Room Loading...</div>

<div class="app">

  <div class="bg-circle bg1"></div>
  <div class="bg-circle bg2"></div>
  <div class="bg-circle bg3"></div>

  <header class="header">
    <button class="back" id="backBtn">‹</button>

    <img id="roomDp" class="room-dp" src="" alt="Room">

    <div class="room-info">
      <div id="roomName" class="room-name">PawanVoice Room</div>
      <div id="roomId" class="room-id">PV824991</div>
    </div>

    <div class="header-right">
      <div id="count" class="count">0/9</div>
      <button class="small-btn" id="settingsBtn">⚙️</button>
      <button class="small-btn" id="inviteBtn">↗</button>
    </div>
  </header>

  <main class="content">

    <section class="host-info">
      <div class="host-label">HOST / OWNER</div>
      <div id="hostSeat" class="host-seat"></div>
    </section>

    <section id="seats" class="seats"></section>

    <div class="features">
      <button class="feature" data-feature="Room Support">🎧 Support</button>
      <button class="feature" data-feature="Lucky Wheel">🎡 Lucky</button>
      <button class="feature" data-feature="Bounty Hunter">🎯 Bounty</button>
      <button class="feature" data-feature="Room Reward">🎁 Reward</button>
      <button class="feature" data-feature="Exclusive Benefits">✨ Benefits</button>
    </div>

    <div class="exp">
      <div class="exp-title">🚀 TOP EXP</div>
      <div class="rank">🥇<b>1</b></div>
      <div class="rank">🥈<b>2</b></div>
      <div class="rank">🥉<b>3</b></div>
    </div>

  </main>

  <div id="emojiPanel" class="emoji-panel"></div>

  <footer class="bottom">

    <div class="chat-row">
      <input id="message" class="message" placeholder="Say something...">
      <button id="emojiBtn" class="emoji-btn">😊</button>
      <button id="sendBtn" class="small-btn">Send</button>
    </div>

    <div class="control-row">

      <button class="control" id="speakerBtn">
        🔊
        <span class="control-label">Speaker</span>
      </button>

      <button class="control" id="micBtn">
        🎤
        <span class="control-label">Mic</span>
      </button>

      <button class="control" id="inboxBtn">
        📥
        <span class="control-label">Inbox</span>
      </button>

      <button class="control" id="moreBtn">
        ⋯
        <span class="control-label">More</span>
      </button>

    </div>
  </footer>
</div>

<div id="modalOverlay" class="overlay">
  <div class="modal">
    <h3 id="modalTitle">Menu</h3>
    <div id="modalBody"></div>
    <button class="modal-btn close" onclick="closeModal()">Close</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="audioBox" class="hidden"></div>

<script>
const SERVER = "https://pawanvoice-1.onrender.com";

const params = new URLSearchParams(location.search);
const ROOM_ID = params.get("room") || "PV824991";

const socket = io(SERVER, {
  transports:["websocket","polling"],
  reconnection:true
});

const emojis = [
  "😡","😭","😵","🔨","😊","😘","😂","😴",
  "😧","😁","👻","😀","🥵","🤗","❤️","🤑",
  "🥳","🥺","😗","❓","🙄","🤣","😎","🤔"
];

const state = {
  room:null,
  me:null,
  micOn:false,
  speakerOn:true,
  stream:null,
  peers:new Map()
};

let selectedUser = null;

const loading = document.getElementById("loading");
const seatsEl = document.getElementById("seats");
const hostSeatEl = document.getElementById("hostSeat");

const userId = localStorage.getItem("pawanvoice_user_id") ||
  ("PVU" + Date.now() + Math.random().toString(36).slice(2,7));

localStorage.setItem("pawanvoice_user_id", userId);

const myName = localStorage.getItem("pawanvoice_name") || "Pawan";
const myDp = localStorage.getItem("pawanvoice_dp") || "";

document.getElementById("roomId").textContent = ROOM_ID;

document.getElementById("roomDp").src =
  myDp || avatarData("PV");

function avatarData(text){
  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <defs>
          <linearGradient id="g" x1="0" x2="1">
            <stop stop-color="#ff54c8"/>
            <stop offset="1" stop-color="#6554ff"/>
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="50" fill="url(#g)"/>
        <text x="100" y="120" text-anchor="middle"
          font-size="65" fill="white" font-family="Arial">${text}</text>
      </svg>
    `);
}

function getDp(user){
  return user.dp || avatarData((user.name || "?").charAt(0).toUpperCase());
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showToast(text){
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("show");
}

function openModal(title, html){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalOverlay").classList.add("show");
}

function findUser(id){
  return state.room?.users?.find(u => u.userId === id);
}

function renderRoom(room){
  state.room = room;

  const users = room.users || [];

  const me = users.find(u => u.userId === userId);
  if(me) state.me = me;

  document.getElementById("roomName").textContent =
    room.roomName || "PawanVoice Room";

  document.getElementById("count").textContent =
    `${users.length}/9`;

  const host =
    users.find(u => u.isHost) ||
    users.find(u => u.seatNo === 1);

  if(host){
    hostSeatEl.innerHTML = `
      <div class="avatar-big" onclick="openUser('${host.userId}')">
        <span class="crown">👑</span>
        <img src="${getDp(host)}">
      </div>
      <div class="host-name">${escapeHtml(host.name)}</div>
      <div class="host-tag">HOST</div>
    `;
  }else{
    hostSeatEl.innerHTML = `
      <div class="avatar-big">
        <img src="${avatarData("👑")}">
      </div>
      <div class="host-name">Waiting for host</div>
    `;
  }

  seatsEl.innerHTML = "";

  for(let seatNo=2; seatNo<=9; seatNo++){

    const user = users.find(u => Number(u.seatNo) === seatNo);

    const div = document.createElement("div");
    div.className = "seat " + (user ? "occupied" : "empty");

    if(user){
      div.innerHTML = `
        <div class="avatar" onclick="openUser('${user.userId}')">
          <img src="${getDp(user)}">
        </div>
        <div class="mic ${user.micOn ? "on" : ""}">
          ${user.micOn ? "🎤" : "🔇"}
        </div>
        <div class="seat-name">${escapeHtml(user.name)}</div>
        <div class="seat-number">Seat ${seatNo}</div>
      `;
    }else{
      div.innerHTML = `
        <div class="avatar empty-avatar"
             onclick="takeSeat(${seatNo})">＋</div>
        <div class="seat-name">Empty</div>
        <div class="seat-number">Seat ${seatNo}</div>
      `;
    }

    seatsEl.appendChild(div);
  }

  loading.classList.add("hidden");
}

function takeSeat(seatNo){
  socket.emit("take-seat",{seatNo});
}

function openUser(id){
  const user = findUser(id);
  if(!user) return;

  selectedUser = user;

  const me = state.me;

  let buttons = `
    <button class="modal-btn" onclick="showUserInfo()">
      👤 View Profile / User ID
    </button>
  `;

  if(me && (me.isHost || me.isAdmin) && !user.isHost){

    buttons += `
      <button class="modal-btn"
        onclick="adminAction('make-admin')">
        👑 Make Admin
      </button>

      <button class="modal-btn"
        onclick="adminAction('remove-admin')">
        🛡️ Remove Admin
      </button>

      <button class="modal-btn"
        onclick="adminAction('kick-user')">
        🚪 Kick User
      </button>

      <button class="modal-btn danger"
        onclick="adminAction('ban-user')">
        🚫 Ban User
      </button>
    `;
  }

  openModal(user.name,buttons);
}

function showUserInfo(){
  if(!selectedUser) return;

  openModal(
    "User Profile",
    `
      <div style="text-align:center">
        <img src="${getDp(selectedUser)}"
          style="width:78px;height:78px;border-radius:50%">
        <h3>${escapeHtml(selectedUser.name)}</h3>
        <p style="color:#bfb2d1">
          ID: ${escapeHtml(selectedUser.userId)}
        </p>
        <p>
          ${selectedUser.isHost ? "👑 Host" :
            selectedUser.isAdmin ? "🛡️ Admin" : "👤 User"}
        </p>
      </div>
    `
  );
}

function adminAction(action){
  if(!selectedUser) return;

  socket.emit(action,{
    userId:selectedUser.userId
  });

  closeModal();
}

function openSettings(){

  const me = state.me;

  let html = `
    <button class="modal-btn"
      onclick="changeRoomName()">
      ✏️ Change Room Name
    </button>
  `;

  if(me?.isHost || me?.isAdmin){
    html += `
      <button class="modal-btn"
        onclick="showToast('Admin controls are active')">
        🛡️ Admin Controls Active
      </button>
    `;
  }

  openModal("Room Settings",html);
}

function changeRoomName(){

  const current = state.room?.roomName || "";

  const name = prompt(
    "New room name:",
    current
  );

  if(!name) return;

  socket.emit("change-room-name",{
    roomName:name
  });

  closeModal();
}

function inviteRoom(){

  const url =
    location.origin +
    location.pathname +
    "?room=" +
    encodeURIComponent(ROOM_ID);

  if(navigator.share){
    navigator.share({
      title:"PawanVoice Room",
      text:"Join my PawanVoice room",
      url
    }).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(url);
    showToast("Room link copied");
  }
}

async function startMic(){

  if(state.stream) return state.stream;

  try{
    state.stream = await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      },
      video:false
    });

    state.stream.getAudioTracks().forEach(track=>{
      track.enabled = state.micOn;
    });

    createConnections();

    return state.stream;

  }catch(error){
    console.error(error);
    showToast("Microphone permission allow karein");
    throw error;
  }
}

async function toggleMic(){

  try{
    await startMic();

    state.micOn = !state.micOn;

    state.stream.getAudioTracks().forEach(track=>{
      track.enabled = state.micOn;
    });

    document.getElementById("micBtn")
      .classList.toggle("active",state.micOn);

    socket.emit("mic-toggle",{
      micOn:state.micOn
    });

  }catch(e){}
}

function toggleSpeaker(){

  state.speakerOn = !state.speakerOn;

  document.getElementById("speakerBtn")
    .classList.toggle("active",state.speakerOn);

  document.querySelectorAll("#audioBox audio")
    .forEach(audio=>{
      audio.muted = !state.speakerOn;
    });

  socket.emit("speaker-toggle",{
    speakerOn:state.speakerOn
  });
}

function createPeer(targetSocketId, initiator){

  if(state.peers.has(targetSocketId)){
    return state.peers.get(targetSocketId);
  }

  const pc = new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"}
    ]
  });

  state.peers.set(targetSocketId,pc);

  if(state.stream){
    state.stream.getTracks().forEach(track=>{
      pc.addTrack(track,state.stream);
    });
  }

  pc.onicecandidate = event=>{
    if(event.candidate){
      socket.emit("webrtc-ice-candidate",{
        targetSocketId,
        candidate:event.candidate
      });
    }
  };

  pc.ontrack = event=>{
    let audio = document.getElementById(
      "audio-" + targetSocketId
    );

    if(!audio){
      audio = document.createElement("audio");
      audio.id = "audio-" + targetSocketId;
      audio.autoplay = true;
      audio.playsInline = true;
      document.getElementById("audioBox").appendChild(audio);
    }

    audio.srcObject = event.streams[0];
    audio.muted = !state.speakerOn;

    audio.play().catch(()=>{});
  };

  pc.onconnectionstatechange = ()=>{
    if(
      pc.connectionState === "failed" ||
      pc.connectionState === "closed"
    ){
      pc.close();
      state.peers.delete(targetSocketId);
    }
  };

  if(initiator){
    pc.createOffer()
      .then(offer=>pc.setLocalDescription(offer))
      .then(()=>{
        socket.emit("webrtc-offer",{
          targetSocketId,
          offer:pc.localDescription
        });
      })
      .catch(console.error);
  }

  return pc;
}

async function createConnections(){

  if(!state.stream || !state.room) return;

  const peers = state.room.users || [];

  for(const user of peers){

    if(user.socketId === socket.id) continue;

    if(!user.socketId) continue;

    /*
      New client creates the offer.
      This avoids both sides creating an offer at the same time.
    */
    createPeer(user.socketId,true);
  }
}

socket.on("webrtc-offer",async data=>{

  try{
    await startMic();
  }catch(e){
    return;
  }

  const pc = createPeer(
    data.fromSocketId,
    false
  );

  await pc.setRemoteDescription(
    new RTCSessionDescription(data.offer)
  );

  const answer = await pc.createAnswer();

  await pc.setLocalDescription(answer);

  socket.emit("webrtc-answer",{
    targetSocketId:data.fromSocketId,
    answer:pc.localDescription
  });
});

socket.on("webrtc-answer",async data=>{

  const pc = state.peers.get(data.fromSocketId);

  if(!pc) return;

  try{
    await pc.setRemoteDescription(
      new RTCSessionDescription(data.answer)
    );
  }catch(e){
    console.error(e);
  }
});

socket.on("webrtc-ice-candidate",async data=>{

  const pc = state.peers.get(data.fromSocketId);

  if(!pc) return;

  try{
    await pc.addIceCandidate(
      new RTCIceCandidate(data.candidate)
    );
  }catch(e){}
});

socket.on("room-joined",data=>{
  renderRoom(data.room);

  setTimeout(()=>{
    createConnections();
  },1000);
});

socket.on("room-state",room=>{
  renderRoom(room);

  setTimeout(()=>{
    createConnections();
  },300);
});

socket.on("room-error",message=>{
  loading.classList.add("hidden");
  showToast(message);
});

socket.on("kicked",message=>{
  alert(message);
  location.href = "./index.html";
});

socket.on("user-left",data=>{

  const pc = state.peers.get(data.socketId);

  if(pc){
    pc.close();
    state.peers.delete(data.socketId);
  }

  const audio = document.getElementById(
    "audio-" + data.socketId
  );

  if(audio) audio.remove();
});

socket.on("room-message",data=>{
  showToast(`${data.name}: ${data.message}`);
});

socket.on("gift-event",data=>{
  showToast(
    `🎁 ${data.fromName} → ${data.toName} ${data.gift}`
  );
});

socket.on("connect",()=>{

  socket.emit("join-room",{
    roomId:ROOM_ID,
    userId,
    name:myName,
    dp:myDp
  });
});

socket.on("disconnect",()=>{
  showToast("Reconnecting...");
});

document.getElementById("emojiBtn")

      .classList.toggle("show");
  });

document.getElementById("sendBtn")
  .addEventListener("click",sendMessage);

document.getElementById("message")
  .addEventListener("keydown",e=>{
    if(e.key==="Enter") sendMessage();
  });

function sendMessage(){

  const input = document.getElementById("message");
  const message = input.value.trim();

  if(!message) return;

  socket.emit("send-message",{
    message
  });

  input.value="";
}

const emojiPanel =
  document.getElementById("emojiPanel");

emojis.forEach(e=>{
  const btn=document.createElement("button");
  btn.className="emoji";
  btn.textContent=e;

  btn.onclick=()=>{
    const input=document.getElementById("message");
    input.value += e;
    input.focus();
    emojiPanel.classList.remove("show");
  };

  emojiPanel.appendChild(btn);
});

    }
  });
