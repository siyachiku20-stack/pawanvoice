<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PawanVoice Room</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#100d18;
  color:#fff;
}

body{
  overflow:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  max-width:600px;
  margin:auto;
  background:
    radial-gradient(circle at 50% -10%,#40204f 0,#181222 38%,#100d18 70%);
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

/* HEADER */

.header{
  height:68px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  padding:8px 10px;
  gap:9px;
  background:rgba(12,9,20,.55);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.room-dp{
  width:46px;
  height:46px;
  border-radius:14px;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.25);
}

.room-title{
  flex:1;
  min-width:0;
}

.room-name{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-id{
  font-size:11px;
  color:#aaa2b5;
  margin-top:3px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:6px;
}

.count-pill{
  background:rgba(255,255,255,.09);
  border-radius:20px;
  padding:7px 9px;
  font-size:11px;
  white-space:nowrap;
}

.icon-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* ROOM AREA */

.room-content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding-bottom:8px;
}

.room-content::-webkit-scrollbar{
  display:none;
}

/* FEATURE BUTTONS */

.features{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:9px 10px;
}

.features::-webkit-scrollbar{
  display:none;
}

.feature{
  min-width:82px;
  height:54px;
  border-radius:14px;
  color:#fff;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.06);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  font-size:10px;
}

.feature span{
  font-size:20px;
}

/* SEATS */

.seats-area{
  padding:10px 10px 4px;
}

.host-seat-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.seat{
  width:78px;
  text-align:center;
  position:relative;
  flex-shrink:0;
}

.seat-avatar-wrap{
  width:62px;
  height:62px;
  margin:auto;
  position:relative;
}

.seat-avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  object-fit:cover;
  background:#272131;
  border:2px solid rgba(255,255,255,.15);
}

.host-seat .seat-avatar{
  border-color:#ffd25a;
  box-shadow:
    0 0 0 3px rgba(255,210,90,.08),
    0 0 22px rgba(255,210,90,.20);
}

.seat-empty{
  width:62px;
  height:62px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,#332b3d,#201b29);
  border:2px dashed rgba(255,255,255,.16);
  font-size:25px;
  color:#aaa1b4;
}

.mic-small{
  position:absolute;
  right:-2px;
  bottom:0;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#25202d;
  border:2px solid #100d18;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
}

.seat-number{
  position:absolute;
  top:-5px;
  left:-4px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:10px;
  background:#312a39;
  color:#c9c2d0;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.seat-name{
  margin-top:6px;
  font-size:11px;
  color:#eee;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.seat-level{
  font-size:9px;
  color:#a9a0b3;
  margin-top:2px;
}

.users-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:19px 5px;
}

/* ENTRY EFFECT */

.entry-ring{
  position:absolute;
  inset:-4px;
  border-radius:50%;
  border:2px solid rgba(255,199,75,.7);
  animation:ringPulse 1.5s infinite;
  pointer-events:none;
}

@keyframes ringPulse{
  0%,100%{transform:scale(1);opacity:.35}
  50%{transform:scale(1.12);opacity:.9}
}

/* TOP EXP */

.exp-section{
  margin:12px 10px;
  padding:12px;
  border-radius:18px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.06);
}

.exp-title{
  text-align:center;
  font-size:12px;
  color:#bdb4c8;
  margin-bottom:12px;
}

.exp-top{
  display:flex;
  justify-content:center;
  align-items:end;
  gap:15px;
}

.exp-card{
  width:75px;
  text-align:center;
}

.exp-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.25);
}

.exp-rank{
  font-size:10px;
  margin-top:4px;
  color:#d7cfdd;
}

.exp-name{
  font-size:10px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* CHAT */

.chat-list{
  padding:4px 10px 10px;
}

.chat-message{
  display:flex;
  gap:7px;
  margin:7px 0;
  align-items:flex-start;
}

.chat-dp{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
}

.chat-bubble{
  max-width:78%;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  font-size:12px;
  color:#eee;
}

.chat-name{
  font-size:9px;
  color:#aaa0b2;
  margin-bottom:3px;
}

/* BOTTOM */

.bottom{
  flex-shrink:0;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(11,8,17,.96);
  border-top:1px solid rgba(255,255,255,.07);
}

.chat-bar{
  display:flex;
  align-items:center;
  gap:7px;
}

.chat-input{
  flex:1;
  min-width:0;
  height:42px;
  border-radius:22px;
  background:#211b29;
  border:1px solid rgba(255,255,255,.06);
  color:#fff;
  padding:0 14px;
  outline:none;
}

.chat-input::placeholder{
  color:#817788;
}

.bottom-btn{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:50%;
  background:#241e2c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* MODAL */

.modal{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.66);
  display:none;
  align-items:flex-end;
  z-index:50;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-height:88%;
  background:#17121e;
  border-radius:22px 22px 0 0;
  border-top:1px solid rgba(255,255,255,.1);
  padding:13px;
  overflow-y:auto;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.sheet-title{
  font-size:17px;
  font-weight:800;
}

.close-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#292230;
  color:#fff;
  font-size:18px;
}

/* GIFT */

.receiver-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
}

.receiver-row::-webkit-scrollbar{
  display:none;
}

.receiver{
  min-width:70px;
  padding:6px;
  border-radius:12px;
  background:#211b29;
  border:1px solid transparent;
  text-align:center;
}

.receiver.active{
  border-color:#e8b85b;
  background:#2c2230;
}

.receiver img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.receiver-name{
  font-size:9px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gift-categories{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:10px;
}

.gift-categories::-webkit-scrollbar{
  display:none;
}

.category-btn{
  white-space:nowrap;
  padding:7px 12px;
  border-radius:18px;
  background:#28212e;
  color:#aaa2b2;
  font-size:11px;
}

.category-btn.active{
  background:#b77a31;
  color:#fff;
}

.gift-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.gift-card{
  position:relative;
  min-height:108px;
  border-radius:15px;
  background:#211b29;
  border:1px solid rgba(255,255,255,.05);
  padding:8px 5px;
  text-align:center;
}

.gift-card.selected{
  border-color:#d9a14b;
  background:#2b2230;
}

.gift-icon{
  font-size:32px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.gift-name{
  font-size:10px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gift-price{
  color:#e9bd65;
  font-size:10px;
  margin-top:4px;
}

.send-gift-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.coin-display{
  flex:1;
  font-size:11px;
  color:#c9c0cf;
}

.quantity{
  width:60px;
  height:38px;
  border-radius:12px;
  background:#28212e;
  border:1px solid rgba(255,255,255,.08);
  color:#fff;
  text-align:center;
  outline:none;
}

.send-gift{
  height:40px;
  padding:0 18px;
  border-radius:20px;
  background:linear-gradient(135deg,#f0a941,#c76b2b);
  color:#fff;
  font-weight:800;
}

/* EMOJI */

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:7px;
}

.emoji{
  height:38px;
  border-radius:9px;
  background:#241e2b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

/* USER POPUP */

.user-profile{
  text-align:center;
}

.user-profile img{
  width:75px;
  height:75px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #d8a74f;
}

.user-profile-name{
  font-size:17px;
  font-weight:800;
  margin-top:8px;
}

.user-profile-id{
  color:#aaa1b0;
  font-size:11px;
  margin-top:3px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}

.stat{
  background:#221c29;
  border-radius:12px;
  padding:10px 5px;
}

.stat-value{
  font-weight:800;
  font-size:13px;
}

.stat-label{
  color:#99909f;
  font-size:9px;
  margin-top:3px;
}

/* TOAST */

.toast{
  position:absolute;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:rgba(20,16,27,.96);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:8px;
  z-index:100;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.toast-icon{
  font-size:25px;
}

.toast-text{
  font-size:11px;
}

/* GIFT ANIMATION */

.gift-animation{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%) scale(.6);
  opacity:0;
  pointer-events:none;
  z-index:90;
  text-align:center;
  transition:.2s;
}

.gift-animation.show{
  animation:giftPop 2.2s ease forwards;
}

.gift-animation-icon{
  font-size:75px;
  filter:drop-shadow(0 0 15px rgba(255,210,80,.45));
}

.gift-animation-text{
  margin-top:5px;
  padding:8px 13px;
  border-radius:20px;
  background:rgba(20,14,25,.92);
  font-size:12px;
}

@keyframes giftPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.5);
  }
  15%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
  }
  30%{
    transform:translate(-50%,-50%) scale(1);
  }
  75%{
    opacity:1;
    transform:translate(-50%,-60%) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-80%) scale(.85);
  }
}

/* SETTINGS */

.setting-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.setting-btn{
  width:100%;
  min-height:48px;
  padding:0 14px;
  border-radius:13px;
  background:#241e2c;
  color:#fff;
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
}

.danger{
  color:#ff7777;
}

/* RESPONSIVE */

@media(max-width:360px){
  .seat{
    width:70px;
  }

  .seat-avatar,
  .seat-empty,
  .seat-avatar-wrap{
    width:56px;
    height:56px;
  }

  .gift-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .gift-card{
    min-height:100px;
  }

  .gift-icon{
    font-size:28px;
  }
}
</style>
</head>

<body>

<div class="app" id="app">

  <!-- HEADER -->

  <div class="header">

    <button class="icon-btn" id="backBtn">‹</button>

    <img
      id="roomDp"
      class="room-dp"
      src="https://i.pravatar.cc/200?img=12"
      alt="Room">

    <div class="room-title">
      <div class="room-name" id="roomName">PawanVoice Room</div>
      <div class="room-id" id="roomIdText">ID: main</div>
    </div>

    <div class="header-right">

      <div class="count-pill" id="countText">
        0/9
      </div>

      <button
        class="icon-btn"
        id="inviteBtn"
        title="Invite">
        ↗
      </button>

      <button
        class="icon-btn"
        id="settingsBtn"
        title="Settings">
        ⚙
      </button>

    </div>

  </div>

  <!-- SCROLL CONTENT -->

  <div class="room-content" id="roomContent">

    <!-- FEATURES -->

    <div class="features">

      <button class="feature" id="supportBtn">
        <span>💖</span>
        Support
      </button>

      <button class="feature" id="luckyBtn">
        <span>🎡</span>
        Lucky Wheel
      </button>

      <button class="feature" id="bountyBtn">
        <span>🎯</span>
        Bounty
      </button>

      <button class="feature" id="rewardBtn">
        <span>🎁</span>
        Reward
      </button>

      <button class="feature" id="exclusiveBtn">
        <span>✨</span>
        Exclusive
      </button>

    </div>

    <!-- SEATS -->

    <div class="seats-area">

      <div class="host-seat-wrap">
        <div
          class="seat host-seat"
          id="seat-0">
        </div>
      </div>

      <div class="users-grid">

        <div class="seat" id="seat-1"></div>
        <div class="seat" id="seat-2"></div>
        <div class="seat" id="seat-3"></div>
        <div class="seat" id="seat-4"></div>

        <div class="seat" id="seat-5"></div>
        <div class="seat" id="seat-6"></div>
        <div class="seat" id="seat-7"></div>
        <div class="seat" id="seat-8"></div>

      </div>

    </div>

    <!-- TOP EXP -->

    <div class="exp-section">

      <div class="exp-title">
        🚀 Room EXP TOP
      </div>

      <div class="exp-top" id="expTop">

        <div class="exp-card">
          <img
            class="exp-avatar"
            src="https://i.pravatar.cc/100?img=1">
          <div class="exp-rank">TOP 1</div>
          <div class="exp-name">---</div>
        </div>

        <div class="exp-card">
          <img
            class="exp-avatar"
            src="https://i.pravatar.cc/100?img=2">
          <div class="exp-rank">TOP 2</div>
          <div class="exp-name">---</div>
        </div>

        <div class="exp-card">
          <img
            class="exp-avatar"
            src="https://i.pravatar.cc/100?img=3">
          <div class="exp-rank">TOP 3</div>
          <div class="exp-name">---</div>
        </div>

      </div>

    </div>

    <!-- CHAT -->

    <div
      class="chat-list"
      id="chatList">
    </div>

  </div>

  <!-- BOTTOM BAR -->

  <div class="bottom">

    <div class="chat-bar">

      <input
        id="chatInput"
        class="chat-input"
        placeholder="Say something...">

      <button
        class="bottom-btn"
        id="emojiBtn">
        😊
      </button>

      <button
        class="bottom-btn"
        id="giftBtn">
        🎁
      </button>

      <button
        class="bottom-btn"
        id="speakerBtn">
        🔊
      </button>

      <button
        class="bottom-btn"
        id="micBtn">
        🎤
      </button>

      <button
        class="bottom-btn"
        id="moreBtn">
        ⋯
      </button>

    </div>

  </div>

  <!-- TOAST -->

  <div
    class="toast"
    id="toast">

    <div
      class="toast-icon"
      id="toastIcon">
      ✓
    </div>

    <div
      class="toast-text"
      id="toastText">
      Done
    </div>

  </div>

  <!-- GIFT ANIMATION -->

  <div
    class="gift-animation"
    id="giftAnimation">

    <div
      class="gift-animation-icon"
      id="giftAnimationIcon">
      🎁
    </div>

    <div
      class="gift-animation-text"
      id="giftAnimationText">
      Gift
    </div>

  </div>

  <!-- GIFT MODAL -->

  <div
    class="modal"
    id="giftModal">

    <div class="sheet">

      <div class="sheet-head">

        <div class="sheet-title">
          🎁 Send Gift
        </div>

        <button
          class="close-btn"
          data-close="giftModal">
          ×
        </button>

      </div>

      <div
        class="receiver-row"
        id="receiverRow">
      </div>

      <div
        class="gift-categories"
        id="giftCategories">
      </div>

      <div
        class="gift-grid"
        id="giftGrid">
      </div>

      <div class="send-gift-row">

        <div
          class="coin-display"
          id="giftCoinDisplay">
          🪙 Coins: 0
        </div>

        <input
          id="giftQuantity"
          class="quantity"
          type="number"
          min="1"
          max="99"
          value="1">

        <button
          class="send-gift"
          id="sendGiftBtn">
          Send
        </button>

      </div>

    </div>

  </div>

  <!-- EMOJI MODAL -->

  <div
    class="modal"
    id="emojiModal">

    <div class="sheet">

      <div class="sheet-head">

        <div class="sheet-title">
          😊 Emoji
        </div>

        <button
          class="close-btn"
          data-close="emojiModal">
          ×
        </button>

      </div>

      <div
        class="emoji-grid"
        id="emojiGrid">
      </div>

    </div>

  </div>

  <!-- USER MODAL -->

  <div
    class="modal"
    id="userModal">

    <div class="sheet">

      <div class="sheet-head">

        <div class="sheet-title">
          User
        </div>

        <button
          class="close-btn"
          data-close="userModal">
          ×
        </button>

      </div>

      <div
        class="user-profile"
        id="userProfile">
      </div>

    </div>

  </div>

  <!-- SETTINGS MODAL -->

  <div
    class="modal"
    id="settingsModal">

    <div class="sheet">

      <div class="sheet-head">

        <div class="sheet-title">
          ⚙ Room Settings
        </div>

        <button
          class="close-btn"
          data-close="settingsModal">
          ×
        </button>

      </div>

      <div class="setting-list">

        <button

function $(id){

function safeNumber(value,fallback=0){
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function firebaseGet(path){

  try{

    const r = await fetch(
      FIREBASE_DB + path + ".json"
    );

    if(!r.ok){
      throw new Error("Firebase GET " + r.status);
    }

    return await r.json();

  }catch(e){

    console.error(e);

    return null;
  }
}

async function firebasePatch(path,data){

  const r = await fetch(
    FIREBASE_DB + path + ".json",
    {
      method:"PATCH",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(data)
    }
  );

  if(!r.ok){
    throw new Error(
      "Firebase PATCH " + r.status
    );
  }

  return await r.json();
}

async function firebasePut(path,data){

  const r = await fetch(
    FIREBASE_DB + path + ".json",
    {
      method:"PUT",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(data)
    }
  );

  if(!r.ok){
    throw new Error(
      "Firebase PUT " + r.status
    );
  }

  return await r.json();
}

async function loadFirebaseRoom(){

  const data =
    await firebaseGet(
      "/rooms/" +
      encodeURIComponent(ROOM_ID)
    );

  if(!data){
    return;
  }

  if(data.name){
    roomState.name = data.name;
  }

  if(data.dp){
    roomState.dp = data.dp;
  }

/* =========================================================

   ========================================================= */

function connectSocket(){

  if(typeof io !== "function"){

    showToast(
      "Socket.IO load नहीं हुआ",
      "⚠️"
    );

    return;
  }

  socket =
    io(
      SERVER_URL,
      {
        transports:["websocket","polling"]
      }
    );

  socket.on("connect",()=>{

    console.log(
      "Socket connected:",
      socket.id
    );

    joinRoom();

  });

  socket.on("connect_error",(error)=>{

    console.error(
      "Socket error:",
      error
    );

    showToast(
      "Room server connection problem",
      "⚠️"
    );

  });

  socket.on("room-state",(state)=>{

    applyRoomState(state);

  });

  socket.on("roomState",(state)=>{

    applyRoomState(state);

  });

  socket.on("chat-message",(message)=>{

    addChatMessage(
      message
    );

  });

  socket.on("gift",(data)=>{

    handleLiveGift(data);

  });

  socket.on("gift-received",(data)=>{

    handleLiveGift(data);

  });

  socket.on("user-entry",(data)=>{

    console.log(
      "User entered:",
      data
    );

  });

  socket.on("user-left",(data)=>{

    console.log(
      "User left:",
      data
    );

  });

  socket.on("seat-taken",()=>{

    requestRoomState();

  });

  socket.on("seat-left",()=>{

    requestRoomState();

  });

  socket.on("mic-status",()=>{

    requestRoomState();

  });

  socket.on("admin-kicked",(data)=>{

    if(
      data &&
      data.userId === me.userId
    ){

      showToast(
        "You were removed from room",
        "🚫"
      );

      setTimeout(()=>{

  });

      micEnabled = false;

      updateMicButton();

      showToast(

  });

  socket.on("webrtc-ice",(data)=>{

  });

  socket.on("ice-candidate",(data)=>{

    handleIce(data);

  });

}

/* =========================================================
   ROOM STATE
   ========================================================= */

function applyRoomState(state){

  if(!state){
    return;
  }

  roomState = {
    ...roomState,
    ...state
  };

  if(!Array.isArray(roomState.seats)){

    roomState.seats =
      Array(9).fill(null);

  }

  if(!Array.isArray(roomState.users)){

    if(
      roomState.users &&
      typeof roomState.users === "object"
    ){

      roomState.users =
        Object.values(
          roomState.users
        );

    }else{

      roomState.users = [];

    }

  }

  updateHeader();

  renderSeats();

  renderExp();

  renderChatHistory();

  renderReceivers();

}

/* =========================================================
   HEADER
   ========================================================= */

function updateHeader(){

  $("roomName").textContent =
    roomState.name ||
    "PawanVoice Room";

  $("roomIdText").textContent =
    "ID: " + ROOM_ID;

  $("roomDp").src =
    roomState.dp ||
    DEFAULT_DP;

  const users =
    roomState.users || [];

  $("countText").textContent =
    users.length + "/9";

}

/* =========================================================
   SEATS
   ========================================================= */

function findUserById(id){

  return (
    roomState.users || []
  ).find(
    u => String(u.userId) === String(id)
  );

}

function normalizeSeatUser(value){

  if(!value){
    return null;
  }

  if(typeof value === "string"){

    return findUserById(value);

  }

  if(value.userId){

    return value;

  }

  if(value.id){

    return findUserById(value.id);

  }

  return null;
}

function renderSeats(){

  for(let i=0;i<9;i++){

    const el =
      $("seat-"+i);

    if(!el){
      continue;
    }

    const raw =
      Array.isArray(roomState.seats)
        ? roomState.seats[i]
        : null;

    const user =
      normalizeSeatUser(raw);

    if(!user){

      el.innerHTML = `

        <div
          class="seat-empty"
          data-seat="${i}">

          +

        </div>

        <div class="seat-name">
          Seat ${i+1}
        </div>

        <div class="seat-level">
          Empty
        </div>
      `;

      el.onclick = ()=>{

        takeSeat(i);

      };

      continue;
    }

    const isMe =
      String(user.userId) ===
      String(me.userId);

    const isMic =
      user.mic !== false;

    el.innerHTML = `

      <div
        class="seat-avatar-wrap"
        data-user="${escapeHtml(user.userId)}">

        ${
          i === 0
            ? `<div class="entry-ring"></div>`
            : ""
        }

        <img
          class="seat-avatar"
          src="${escapeHtml(getDp(user))}"
          onerror="this.src='${DEFAULT_DP}'">

        <div class="mic-small">
          ${isMic ? "🎤" : "🔇"}
        </div>

        <div class="seat-number">
          ${i+1}
        </div>

      </div>

      <div class="seat-name">
        ${escapeHtml(user.name || "User")}
        ${isMe ? " • You" : ""}
      </div>

      <div class="seat-level">
        Lv.${safeNumber(user.level,1)}
      </div>
    `;

    el.onclick = ()=>{

      openUserProfile(user);

    };

  }

}

/* =========================================================
   TAKE SEAT
   ========================================================= */

function takeSeat(index){

  if(!socket || !socket.connected){

    showToast(
      "Server connected नहीं है",
      "⚠️"
    );

    return;
  }

  socket.emit(
    "take-seat",
    {
      roomId:ROOM_ID,
      seatIndex:index,
      userId:me.userId
    },
    (response)=>{

      if(
        response &&
        response.error
      ){

        showToast(
          response.error,
          "⚠️"
        );

      }else{

        showToast(
          "Seat joined",
          "💺"
        );

      }

    }
  );

}

/* =========================================================
   LEAVE SEAT
   ========================================================= */

function leaveSeat(){

  if(!socket || !socket.connected){
    return;
  }

  socket.emit(
    "leave-seat",
    {
      roomId:ROOM_ID,
      userId:me.userId
    },
    ()=>{
      showToast(
        "Seat छोड़ दी",
        "🚪"
      );
    }
  );

}

/* =========================================================
   EXP TOP
   ========================================================= */

function renderExp(){

  const users =
    [...(roomState.users || [])];

  users.sort(
    (a,b)=>{
      const ae =
        safeNumber(a.exp,0);

      const be =
        safeNumber(b.exp,0);

      return be-ae;
    }
  );

  const top =
    users.slice(0,3);

  const cards =
    document.querySelectorAll(
      ".exp-card"
    );

  cards.forEach((card,index)=>{

    const user =
      top[index];

    if(!user){

      card.querySelector(
        ".exp-name"
      ).textContent = "---";

      return;
    }

    card.querySelector(
      ".exp-avatar"
    ).src =
      getDp(user);

    card.querySelector(
      ".exp-name"
    ).textContent =
      user.name || "User";

  });

}

/* =========================================================
   CHAT
   ========================================================= */

function sendChat(){

  const input =
    $("chatInput");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  if(!socket || !socket.connected){

    showToast(
      "Server connected नहीं है",
      "⚠️"
    );

    return;
  }

  socket.emit(
    "chat-message",
    {
      roomId:ROOM_ID,

      userId:me.userId,

      name:me.name,

      dp:me.dp,

      text:text
    }
  );

  input.value = "";

}

function addChatMessage(message){

  if(!message){
    return;
  }

  const list =
    $("chatList");

  const div =
    document.createElement("div");

  div.className =
    "chat-message";

  div.innerHTML = `

    <img
      class="chat-dp"
      src="${escapeHtml(
        message.dp || DEFAULT_DP
      )}"
      onerror="this.src='${DEFAULT_DP}'">

    <div class="chat-bubble">

      <div class="chat-name">
        ${escapeHtml(
          message.name || "User"
        )}
      </div>

      ${escapeHtml(
        message.text || ""
      )}

    </div>
  `;

  list.appendChild(div);

  while(list.children.length > 100){

    list.removeChild(
      list.firstChild
    );

  }

  $("roomContent").scrollTop =
    $("roomContent").scrollHeight;

}

function renderChatHistory(){

  const list =
    $("chatList");

  list.innerHTML = "";

  const messages =
    roomState.messages || [];

  messages.slice(-50)
    .forEach(addChatMessage);

}

   ========================================================= */

function renderGiftCategories(){

  const categories =
    ["All","Love","Party","Royal","Luxury","Special","Fantasy","Fun"];

  $("giftCategories").innerHTML =
    categories.map(cat=>`

      <button
        class="category-btn ${
          cat === currentGiftCategory
            ? "active"
            : ""
        }"
        data-category="${cat}">

        ${cat}

      </button>

    `).join("");

  document
    .querySelectorAll(".category-btn")
    .forEach(btn=>{

      btn.onclick = ()=>{

        currentGiftCategory =
          btn.dataset.category;

        renderGiftCategories();

        renderGifts();

      };

    });

}

function renderGifts(){

  const list =
    currentGiftCategory === "All"
      ? GIFTS
      : GIFTS.filter(
          g =>
            g.cat ===
            currentGiftCategory
        );

  $("giftGrid").innerHTML =
    list.map(g=>`

      <button
        class="gift-card ${
          selectedGift &&
          selectedGift.id === g.id
            ? "selected"
            : ""
        }"
        data-gift-id="${g.id}">

        <div class="gift-icon">
          ${g.icon}
        </div>

        <div class="gift-name">
          ${escapeHtml(g.name)}
        </div>

        <div class="gift-price">
          🪙 ${g.price}
        </div>

      </button>

    `).join("");

  document
    .querySelectorAll(".gift-card")
    .forEach(card=>{

      card.onclick = ()=>{

        selectedGift =
          GIFTS.find(
            g =>
              g.id ===
              card.dataset.giftId
          );

        renderGifts();

      };

    });

}

    return;
  }

  if(
    !selectedReceiverId ||
    !users.some(
      u =>
        String(u.userId) ===
        String(selectedReceiverId)
    )
  ){

    const other =
      users.find(
        u =>
          String(u.userId) !==

/* =========================================================
   SEND GIFT
   ========================================================= */

async function sendGift(){

  if(!selectedGift){

    showToast(
      "पहले gift select करें",
      "🎁"
    );

    return;
  }

  if(!selectedReceiverId){

    showToast(
      "Receiver select करें",
      "👤"
    );

    return;
  }

  if(
    String(selectedReceiverId) ===
    String(me.userId)
  ){

    showToast(
      "खुद को gift नहीं भेज सकते",
      "⚠️"
    );

    return;
  }

  const quantity =
    Math.max(
      1,
      Math.min(
        99,
        parseInt(
          $("giftQuantity").value,
          10
        ) || 1
      )
    );

  $("giftQuantity").value =
    quantity;

  const total =
    selectedGift.price *
    quantity;

  const coins =
    safeNumber(me.coins,0);

  if(coins < total){

    showToast(
      "Coins कम हैं",
      "🪙"
    );

    return;
  }

  const receiver =
    findUserById(
      selectedReceiverId
    );

  if(!receiver){

    showToast(
      "Receiver room में नहीं है",
      "⚠️"
    );

    return;
  }

  const transactionId =
    "GT_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);

  try{

    /*
      IMPORTANT:
      यह अभी client-side wallet flow है।
      Production में wallet deduction
      server/Cloud Function से करना चाहिए।
    */

    const receiverData =
      await firebaseGet(
        "/users/" +
        encodeURIComponent(
          receiver.userId
        )
      );

    if(!receiverData){

      throw new Error(
        "Receiver profile नहीं मिला"
      );

    }

    const receiverCoins =
      safeNumber(
        receiverData.coins,
        0
      );

    const senderCoinsAfter =
      coins - total;

    const receiverCoinsAfter =
      receiverCoins + total;

    /* Sender wallet */

    await firebasePatch(
      "/users/" +
      encodeURIComponent(
        me.userId
      ),
      {
        coins:
          senderCoinsAfter,
        updatedAt:
          Date.now()
      }
    );

    /* Receiver wallet */

    await firebasePatch(
      "/users/" +
      encodeURIComponent(
        receiver.userId
      ),
      {
        coins:
          receiverCoinsAfter,
        updatedAt:
          Date.now()
      }
    );

    /* Gift transaction */

    await firebasePut(
      "/giftTransactions/" +
      transactionId,
      {
        transactionId,

        roomId:
          ROOM_ID,

        senderId:
          me.userId,

        senderName:
          me.name,

        senderDp:
          me.dp,

        receiverId:
          receiver.userId,

        receiverName:
          receiver.name,

        receiverDp:
          receiver.dp,

        giftId:
          selectedGift.id,

        giftName:
          selectedGift.name,

        giftIcon:
          selectedGift.icon,

        giftPrice:
          selectedGift.price,

        quantity,

        total,

        time:
          Date.now()
      }
    );

    /* Sender coin transaction */

    await firebasePut(
      "/coinTransactions/" +
      transactionId +
      "_S",
      {
        transactionId,
        type:"gift_sent",
        userId:me.userId,
        receiverId:receiver.userId,
        amount:-total,
        coinsAfter:senderCoinsAfter,
        gift:selectedGift.name,
        quantity,
        roomId:ROOM_ID,
        time:Date.now()
      }
    );

    /* Receiver coin transaction */

    await firebasePut(
      "/coinTransactions/" +
      transactionId +
      "_R",
      {
        transactionId,
        type:"gift_received",
        userId:receiver.userId,
        senderId:me.userId,
        amount:total,
        coinsAfter:receiverCoinsAfter,
        gift:selectedGift.name,
        quantity,
        roomId:ROOM_ID,
        time:Date.now()
      }
    );

    /* Receiver notification */

    await firebasePut(
      "/notifications/" +
      encodeURIComponent(
        receiver.userId
      ) +
      "/" +
      transactionId,
      {
        id:transactionId,

        type:"gift",

        senderId:
          me.userId,

        senderName:
          me.name,

        senderDp:
          me.dp,

        giftName:
          selectedGift.name,

        giftIcon:
          selectedGift.icon,

        quantity,

        total,

        roomId:
          ROOM_ID,

        read:false,

        time:
          Date.now()
      }
    );

    /* Update local user */

    me.coins =
      senderCoinsAfter;

    localStorage.setItem(
      "pv_coins",
      String(senderCoinsAfter)
    );

    if(
      typeof pvSaveLocalUser ===
      "function"
    ){

      pvSaveLocalUser(me);

    }

    updateGiftCoinDisplay();

    /*
      Live Socket.IO gift event
    */

    if(
      socket &&
      socket.connected
    ){

      socket.emit(
        "send-gift",
        {
          roomId:ROOM_ID,

          senderId:
            me.userId,

          receiverId:
            receiver.userId,

          transactionId,

          gift:{
            id:selectedGift.id,

            name:selectedGift.name,

            icon:selectedGift.icon,

            price:selectedGift.price,

            quantity,

            total
          }
        }
      );

    }

    showGiftAnimation({
      senderName:me.name,
      receiverName:receiver.name,
      gift:selectedGift,
      quantity,
      transactionId
    });

    showToast(
      selectedGift.name +
      " भेज दिया ×" +
      quantity,
      selectedGift.icon
    );

    closeModal("giftModal");

  }catch(error){

    console.error(
      "Gift error:",
      error
    );

    showToast(
      "Gift send नहीं हुआ",
      "❌"
    );

  }

}

/* =========================================================
   LIVE GIFT
   ========================================================= */

function handleLiveGift(data){

  if(!data){
    return;
  }

  let gift =
    data.gift;

  if(
    typeof gift === "string"
  ){

    gift = {
      name:gift,
      icon:"🎁",
      quantity:1
    };

  }

  gift =
    gift || {
      name:"Gift",
      icon:"🎁",
      quantity:1
    };

  const transactionId =
    data.transactionId ||
    (
      data.senderId +
      "_" +
      gift.id +
      "_" +
      Date.now()
    );

  /*
    Server sends both "gift" and
    "gift-received".
    This prevents duplicate animation.
  */

  if(
    shownGiftTransactions.has(
      transactionId
    )
  ){

    return;

  }

  shownGiftTransactions.add(
    transactionId
  );

  if(
    shownGiftTransactions.size > 300
  ){

    const first =
      shownGiftTransactions
        .values()
        .next()
        .value;

    shownGiftTransactions.delete(
      first
    );

  }

  const receiver =
    findUserById(
      data.receiverId
    );

  const receiverName =
    receiver
      ? receiver.name
      : (
          data.receiverName ||
          "User"
        );

  showGiftAnimation({

    senderName:
      data.senderName ||
      data.name ||
      "User",

    receiverName,

    gift,

    quantity:
      safeNumber(
        gift.quantity,
        1
      ),

    transactionId

  });

}

function showGiftAnimation(data){

  const box =
    $("giftAnimation");

  $("giftAnimationIcon")
    .textContent =
    data.gift.icon ||
    "🎁";

  $("giftAnimationText")
    .textContent =
    data.senderName +
    " → " +
    data.receiverName +
    "  " +
    data.gift.name +
    " ×" +
    safeNumber(
      data.quantity,
      1
    );

  box.classList.remove("show");

  void box.offsetWidth;

  box.classList.add("show");

  clearTimeout(
    window.__giftAnimTimer
  );

  window.__giftAnimTimer =
    setTimeout(()=>{
      box.classList.remove("show");
    },2300);

}

  if(localStream){

      .getAudioTracks()

        track=>{
          track.enabled =
            micEnabled;
        }

    socket.emit(
      "mic-status",

        roomId:ROOM_ID,

async function startMicrophone(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    showToast(
      "Microphone browser में available नहीं है",
      "⚠️"
    );

    return;

  }

  try{

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true,
          video:false
        });

    localStream
      .getAudioTracks()
      .forEach(
        track=>{
          track.enabled =
            micEnabled;
        }
      );

    showToast(
      "Microphone ready",
      "🎤"
    );

  }catch(error){

    console.error(
      "Microphone:",
      error
    );

    micEnabled = false;

    updateMicButton();

    showToast(
      "Microphone permission नहीं मिली",
      "⚠️"
    );

  }

}

/* =========================================================
   WEBRTC
   ========================================================= */

async function createPeer(
  targetSocketId,
  targetUserId,
  createOffer
){

  if(
    !targetSocketId ||
    targetSocketId === socket.id
  ){

    return null;

  }

  if(
    peers[targetSocketId]
  ){

    return peers[targetSocketId];

  }

  const config = {
    iceServers:[
      {
        urls:[
          "stun:stun.l.google.com:19302",
          "stun:stun1.l.google.com:19302"
        ]
      }
    ]
  };

  const pc =
    new RTCPeerConnection(
      config
    );

  peers[targetSocketId] = {
    pc,
    userId:targetUserId
  };

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>{
          pc.addTrack(
            track,
            localStream
          );
        }
      );

  }

  pc.onicecandidate =
    event=>{

      if(
        event.candidate &&
        socket &&
        socket.connected
      ){

        socket.emit(
          "webrtc-ice",
          {
            roomId:ROOM_ID,

            targetSocketId,

            targetUserId,

            candidate:
              event.candidate
          }
        );

      }

    };

  pc.ontrack =
    event=>{

      const stream =
        event.streams[0];

      if(!stream){
        return;
      }

      let audio =
        document.getElementById(
          "audio-" +
          targetSocketId
        );

      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.id =
          "audio-" +
          targetSocketId;

        audio.autoplay = true;

        audio.playsInline = true;

        document.body.appendChild(
          audio
        );

      }

      audio.srcObject =
        stream;

      audio.muted =
        !speakerEnabled;

    };

  pc.onconnectionstatechange =
    ()=>{

      if(
        pc.connectionState ===
        "failed" ||
        pc.connectionState ===
        "closed"
      ){

        pc.close();

        delete peers[
          targetSocketId
        ];

      }

    };

  if(createOffer){

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    socket.emit(
      "webrtc-offer",
      {
        roomId:ROOM_ID,

        targetSocketId,

        targetUserId,

        offer
      }
    );

  }

  return pc;

}

async function handleOffer(data){

  if(!data){
    return;
  }

  const fromSocketId =
    data.fromSocketId ||
    data.socketId;

  const fromUserId =
    data.fromUserId ||
    data.userId;

  if(!fromSocketId){
    return;
  }

  const pc =
    await createPeer(
      fromSocketId,
      fromUserId,
      false
    );

  if(!pc){
    return;
  }

  await pc.setRemoteDescription(
    new RTCSessionDescription(
      data.offer
    )
  );

  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(
    answer
  );

  socket.emit(
    "webrtc-answer",
    {
      roomId:ROOM_ID,

      targetSocketId:
        fromSocketId,

      targetUserId:
        fromUserId,

      answer
    }
  );

}

async function handleAnswer(data){

  if(!data){
    return;
  }

  const target =
    data.fromSocketId ||
    data.socketId;

  if(!target){
    return;
  }

  const item =
    peers[target];

  if(!item){
    return;
  }

  await item.pc.setRemoteDescription(
    new RTCSessionDescription(
      data.answer
    )
  );

}

async function handleIce(data){

  if(!data){
    return;
  }

  const from =
    data.fromSocketId ||
    data.socketId;

  if(!from){
    return;
  }

  const item =
    peers[from];

  if(!item){
    return;
  }

  try{

    await item.pc.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );

  }catch(error){

    console.error(
      "ICE error:",
      error
    );

  }

}

        );

      };

    });

  document
    .querySelectorAll(".modal")
    .forEach(modal=>{

      modal.addEventListener(
        "click",
        event=>{

          if(
            event.target === modal
          ){

            modal.classList.remove(
              "show"
            );

          }

        }
      );

    });

  $("sendGiftBtn").onclick =
    sendGift;

  $("refreshBtn").onclick =
    ()=>{
      requestRoomState();

      closeModal(
        "settingsModal"
      );

      showToast(
        "Room refreshed",
        "🔄"
      );
    };

  $("mySeatBtn").onclick =
    ()=>{

      const seats =
        roomState.seats ||
        [];

      const index =
        seats.findIndex(
          s => !s
        );

      if(index < 0){

        showToast(
          "All seats full",
          "⚠️"
        );

        return;

      }

      takeSeat(index);

      closeModal(
        "settingsModal"
      );

    };

  $("leaveSeatBtn").onclick =
    ()=>{

      leaveSeat();

      closeModal(
        "settingsModal"
      );

    };

  $("copyRoomBtn").onclick =
    copyRoomLink;

  $("leaveRoomBtn").onclick =
    leaveRoom;

  $("shareBtn").onclick =
    ()=>{
      shareRoom();

      closeModal(
        "moreModal"
      );
    };

  $("roomInfoBtn").onclick =
    ()=>{
      closeModal(
        "moreModal"
      );

      showToast(
        "Room ID: " +
        ROOM_ID,
        "ℹ️"
      );
    };

  $("openStoreBtn").onclick =
    ()=>{
      location.href =
        "store.html";
    };

  $("supportBtn").onclick =
    ()=>{
      showToast(
        "Room Support",
        "💖"
      );
    };

  $("luckyBtn").onclick =
    ()=>{
      showToast(
        "Lucky Wheel coming soon",
        "🎡"
      );
    };

  $("bountyBtn").onclick =
    ()=>{
      showToast(
        "Bounty Hunter coming soon",
        "🎯"
      );
    };

  $("rewardBtn").onclick =
    ()=>{
      showToast(
        "Room Reward",
        "🎁"
      );
    };

  $("exclusiveBtn").onclick =
    ()=>{
      showToast(
        "Exclusive Benefits",
        "✨"
      );
    };

  window.addEventListener(
    "beforeunload",
    ()=>{
      if(
        socket &&
        socket.connected
      ){

        socket.emit(
          "leave-room",
          {
            roomId:ROOM_ID,
            userId:me &&
              me.userId
          }
        );

      }
    }
  );

}

/* =========================================================
   LEAVE ROOM
   ========================================================= */

function leaveRoom(){

  const yes =
    confirm(
      "क्या आप room छोड़ना चाहते हैं?"
    );

  if(!yes){
    return;
  }

  if(
    socket &&
    socket.connected
  ){

    socket.emit(
      "leave-room",
      {
        roomId:ROOM_ID,
        userId:me.userId
      }
    );

  }

  Object.values(
    peers
  ).forEach(item=>{

    try{
      item.pc.close();
    }catch(e){}

  });

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

  }

  location.href =
    "index.html";

}

/* =========================================================
   START
   ========================================================= */

init();

</script>
