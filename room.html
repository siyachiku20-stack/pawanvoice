<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#090b13;
  color:#fff;
  overflow:hidden;
}

button,input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 10%,#24213d 0,#111324 35%,#090b13 75%);
}

/* ================= HEADER ================= */

.topbar{
  min-height:74px;
  padding:9px 10px;
  display:flex;
  align-items:center;
  gap:9px;
  background:rgba(12,14,27,.96);
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:5;
}

.roomDpBox{
  width:52px;
  height:52px;
  flex:none;
  border-radius:15px;
  overflow:hidden;
  border:2px solid #8c63ff;
  background:#24283b;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
}

.roomDpBox img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.roomDpFallback{
  font-size:25px;
}

.roomHead{
  min-width:0;
  flex:1;
}

.roomName{
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomMeta{
  font-size:11px;
  color:#aeb3ca;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomOwner{
  font-size:11px;
  color:#ffd66b;
  margin-top:3px;
}

.topActions{
  display:flex;
  gap:5px;
  align-items:center;
  max-width:50%;
  overflow-x:auto;
}

.iconBtn{
  width:39px;
  height:39px;
  flex:none;
  border-radius:12px;
  background:#1a1d31;
  color:#fff;
  font-size:18px;
  border:1px solid rgba(255,255,255,.07);
}

.iconBtn:active,
.bottomBtn:active,
.actionBtn:active,
.moreItem:active{
  transform:scale(.94);
}

/* ================= ROOM BODY ================= */

.roomBody{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:10px 9px 145px;
}

.roomNotice{
  background:linear-gradient(90deg,rgba(125,82,255,.18),rgba(255,91,174,.10));
  border:1px solid rgba(150,115,255,.18);
  border-radius:14px;
  padding:9px 11px;
  margin-bottom:10px;
  font-size:12px;
  color:#dddaf4;
}

.roomTitleLine{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:3px 3px 8px;
}

.roomTitleLine b{
  font-size:13px;
}

.liveDot{
  color:#67e69a;
  font-size:11px;
}

/* ================= OWNER ================= */

.ownerArea{
  display:flex;
  justify-content:center;
  margin:8px 0 17px;
}

.seat.ownerSeat{
  width:115px;
}

/* ================= SEATS ================= */

.seatRows{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:19px;
}

.seatRow{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.seat{
  min-width:0;
  text-align:center;
  position:relative;
}

.avatarWrap{
  width:61px;
  height:61px;
  margin:auto;
  border-radius:20px;
  padding:3px;
  position:relative;
  background:linear-gradient(135deg,#5e48ff,#d950a7);
}

.avatarWrap.frame-gold{
  background:linear-gradient(135deg,#ffe37d,#ff9f35,#fff1a8);
}

.avatarWrap.frame-blue{
  background:linear-gradient(135deg,#5ad8ff,#526bff,#9e7cff);
}

.avatarWrap.frame-green{
  background:linear-gradient(135deg,#67efb1,#22a6a0,#a7ffdd);
}

.avatarWrap.frame-red{
  background:linear-gradient(135deg,#ff5d78,#ff9d43,#ff477f);
}

.avatar{
  width:100%;
  height:100%;
  border-radius:17px;
  background:#25283a;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:2px solid #101321;
  font-size:25px;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.micDot{
  position:absolute;
  right:-3px;
  bottom:0;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#282c3e;
  border:2px solid #0c0f1c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
}

.micDot.on{
  background:#24c77a;
}

.micDot.off{
  background:#e34d63;
}

.vipBadge{
  position:absolute;
  left:-7px;
  top:-7px;
  background:linear-gradient(135deg,#ffcc55,#f18422);
  color:#251900;
  border-radius:8px;
  padding:2px 5px;
  font-size:8px;
  font-weight:900;
}

.ownerBadge{
  position:absolute;
  right:-8px;
  top:-8px;
  background:#ffd45a;
  color:#301f00;
  border-radius:8px;
  padding:3px 5px;
  font-size:9px;
  font-weight:900;
}

.speaking{
  animation:speakingPulse .8s infinite alternate;
}

@keyframes speakingPulse{
  from{box-shadow:0 0 0 0 rgba(73,236,159,.1)}
  to{box-shadow:0 0 0 8px rgba(73,236,159,.2)}
}

.seatName{
  margin-top:6px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.seatId{
  margin-top:2px;
  font-size:9px;
  color:#9097b1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.levelBadge{
  display:inline-block;
  margin-top:3px;
  font-size:8px;
  color:#cfc6ff;
  background:#292443;
  border-radius:6px;
  padding:2px 4px;
}

/* ================= EMPTY SEAT ================= */

.emptyAvatar{
  width:61px;
  height:61px;
  margin:auto;
  border-radius:20px;
  background:#171a29;
  border:1px dashed #454b65;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#717993;
  font-size:22px;
}

.emptyText{
  margin-top:6px;
  font-size:10px;
  color:#777e99;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:20px;
}

.stat{
  background:#121524;
  border:1px solid rgba(255,255,255,.06);
  border-radius:12px;
  padding:8px 4px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:13px;
}

.stat span{
  display:block;
  margin-top:3px;
  color:#858ba3;
  font-size:9px;
}

/* ================= CHAT ================= */

.chatBox{
  margin-top:12px;
  background:rgba(17,20,34,.84);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:9px;
}

.chatTitle{
  font-size:11px;
  color:#9da4bd;
  margin-bottom:7px;
}

.chatMessages{
  max-height:125px;
  overflow-y:auto;
}

.chatMsg{
  padding:4px 0;
  font-size:11px;
  color:#ddd;
  line-height:1.35;
}

.chatMsg b{
  color:#b999ff;
}

.chatMsg .chatId{
  color:#737b96;
  font-size:9px;
}

/* ================= BOTTOM BAR ================= */

.bottomBar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  min-height:72px;
  padding:9px 8px 10px;
  background:rgba(10,12,22,.98);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  gap:6px;
  z-index:20;
}

.bottomBtn{
  width:43px;
  height:43px;
  flex:none;
  border-radius:14px;
  background:#191c2e;
  color:#fff;
  font-size:18px;
}

.chatInputWrap{
  flex:1;
  min-width:60px;
  height:43px;
  display:flex;
  align-items:center;
  background:#181b2b;
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:0 8px;
}

.chatInputWrap input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:12px;
}

.chatInputWrap input::placeholder{
  color:#666d84;
}

.micMain{
  background:linear-gradient(135deg,#744cff,#bd49a4);
}

/* ================= PANELS ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  z-index:50;
  display:none;
  align-items:flex-end;
}

.overlay.show{
  display:flex;
}

.panel{
  width:100%;
  max-height:85vh;
  overflow-y:auto;
  background:#111423;
  border-radius:22px 22px 0 0;
  border-top:1px solid rgba(255,255,255,.1);
  padding:15px;
  animation:panelUp .18s ease;
}

@keyframes panelUp{
  from{transform:translateY(50px);opacity:.4}
  to{transform:translateY(0);opacity:1}
}

.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.panelHead h3{
  margin:0;
  font-size:16px;
}

.closeBtn{
  width:34px;
  height:34px;
  border-radius:11px;
  background:#24283a;
  color:#fff;
  font-size:18px;
}

.panelText{
  color:#9ba2ba;
  font-size:12px;
  line-height:1.5;
}

.formInput{
  width:100%;
  height:45px;
  margin:6px 0;
  padding:0 12px;
  border:1px solid #30354d;
  outline:0;
  border-radius:12px;
  background:#181c2d;
  color:#fff;
}

.primaryBtn{
  width:100%;
  min-height:45px;
  margin-top:8px;
  border-radius:13px;
  background:linear-gradient(135deg,#704cff,#b64ca4);
  color:#fff;
  font-weight:800;
}

.dangerBtn{
  background:#3b1c27;
  color:#ff8095;
}

/* ================= DP PANEL ================= */

.dpPreview{
  width:100px;
  height:100px;
  margin:5px auto 14px;
  border-radius:25px;
  overflow:hidden;
  border:3px solid #805dff;
  background:#25293c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.dpPreview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.fileBtn{
  display:block;
  width:100%;
  padding:13px;
  text-align:center;
  border-radius:12px;
  background:#24283c;
  color:#fff;
  font-size:12px;
  font-weight:700;
  margin-top:8px;
}

/* ================= MORE GRID ================= */

.moreGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.moreItem{
  min-height:74px;
  border-radius:15px;
  background:#191d2e;
  border:1px solid rgba(255,255,255,.05);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#fff;
}

.moreItem .ico{
  font-size:22px;
}

.moreItem span{
  font-size:9px;
  color:#b7bdd1;
  text-align:center;
}

/* ================= ACTION GRID ================= */

.actionGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.actionBtn{
  min-height:65px;
  border-radius:13px;
  background:#1b1f31;
  color:#fff;
  border:1px solid rgba(255,255,255,.05);
}

.actionBtn .aIcon{
  display:block;
  font-size:21px;
  margin-bottom:5px;
}

.actionBtn span{
  font-size:9px;
  color:#aeb4c8;
}

/* ================= USER CARD ================= */

.userCard{
  display:flex;
  align-items:center;
  gap:10px;
  background:#191d2e;
  padding:10px;
  border-radius:14px;
  margin-bottom:12px;
}

.userCardAvatar{
  width:52px;
  height:52px;
  border-radius:17px;
  overflow:hidden;
  background:#292d42;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.userCardAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.userCardInfo{
  min-width:0;
  flex:1;
}

.userCardInfo b{
  display:block;
  font-size:14px;
}

.userCardInfo span{
  display:block;
  color:#858ca5;
  font-size:10px;
  margin-top:3px;
}

/* ================= LIST ================= */

.listItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 4px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.listLeft{
  display:flex;
  align-items:center;
  gap:9px;
}

.listAvatar{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#292d42;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.listAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.listName{
  font-size:12px;
  font-weight:700;
}

.listId{
  font-size:9px;
  color:#737b94;
  margin-top:2px;
}

.smallBtn{
  padding:8px 10px;
  border-radius:9px;
  background:#292d43;
  color:#fff;
  font-size:10px;
}

/* ================= MINI ROOM ================= */

#miniRoom{
  position:fixed;
  right:12px;
  bottom:85px;
  width:145px;
  padding:10px;
  border-radius:17px;
  background:#171a2a;
  border:1px solid #3b3f58;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  z-index:100;
  display:none;
}

#miniRoom.show{
  display:block;
}

.miniTop{
  display:flex;
  align-items:center;
  gap:7px;
}

.miniDp{
  width:35px;
  height:35px;
  border-radius:11px;
  overflow:hidden;
  background:#282c40;
  display:flex;
  align-items:center;
  justify-content:center;
}

.miniDp img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.miniInfo{
  min-width:0;
}

.miniInfo b{
  display:block;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.miniInfo span{
  display:block;
  color:#7d849d;
  font-size:8px;
  margin-top:2px;
}

.miniRestore{
  width:100%;
  height:30px;
  margin-top:8px;
  border-radius:9px;
  background:#7350ff;
  color:#fff;
  font-size:10px;
  font-weight:800;
}

/* ================= TOAST ================= */

#toast{
  position:fixed;
  left:50%;
  bottom:91px;
  transform:translateX(-50%) translateY(20px);
  background:#25293b;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
  max-width:90%;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= RESPONSIVE ================= */

@media(max-width:370px){
  .topActions .iconBtn:nth-child(4),
  .topActions .iconBtn:nth-child(5){
    display:none;
  }

  .avatarWrap,
  .emptyAvatar{
    width:54px;
    height:54px;
  }

  .seat{
    font-size:10px;
  }

  .bottomBtn{
    width:39px;
    height:39px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <header class="topbar">

    <div class="roomDpBox" onclick="openRoomDp()">
      <img id="roomDpImg" style="display:none">
      <div id="roomDpFallback" class="roomDpFallback">🎙️</div>
    </div>

    <div class="roomHead">
      <div class="roomName" id="roomName">PawanVoice Room</div>

      <div class="roomMeta">
        Room No: <b id="roomNumber">------</b>
        &nbsp;•&nbsp;
        ID: <span id="roomFirebaseId">------</span>
      </div>

      <div class="roomOwner">
        👑 Owner: <span id="ownerName">------</span>
      </div>
    </div>

    <div class="topActions">
      <button class="iconBtn" onclick="openSettings()">⚙️</button>
      <button class="iconBtn" onclick="openOnline()">👥</button>
      <button class="iconBtn" onclick="shareRoom()">↗️</button>
      <button class="iconBtn" onclick="copyRoomNumber()">📋</button>
      <button class="iconBtn" onclick="minimizeRoom()">—</button>
      <button class="iconBtn" onclick="openInfo()">ⓘ</button>
      <button class="iconBtn" onclick="leaveRoom()">🚪</button>
    </div>

  </header>

  <!-- BODY -->
  <main class="roomBody">

    <div class="roomNotice" id="announcement">
      🎙️ Welcome to PawanVoice Room
    </div>

    <div class="roomTitleLine">
      <b>🎤 Voice Room</b>
      <span class="liveDot">● LIVE</span>
    </div>

    <!-- OWNER -->
    <div class="ownerArea">
      <div class="seat ownerSeat" id="ownerSeat"></div>
    </div>

    <!-- SEATS -->
    <div class="seatRows">

      <div class="seatRow" id="seatRow1">
        <div class="seat" id="seat2"></div>
        <div class="seat" id="seat3"></div>
        <div class="seat" id="seat4"></div>
        <div class="seat" id="seat5"></div>
      </div>

      <div class="seatRow" id="seatRow2">
        <div class="seat" id="seat6"></div>
        <div class="seat" id="seat7"></div>
        <div class="seat" id="seat8"></div>
        <div class="seat" id="seat9"></div>
      </div>

    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat">
        <b id="onlineCount">0</b>
        <span>Online</span>
      </div>

      <div class="stat">
        <b id="likeCount">0</b>
        <span>Likes</span>
      </div>

      <div class="stat">
        <b id="giftCount">0</b>
        <span>Gifts</span>
      </div>

      <div class="stat">
        <b id="roomDuration">00:00</b>
        <span>Time</span>
      </div>
    </div>

    <!-- CHAT -->
    <section class="chatBox">
      <div class="chatTitle">💬 Room Chat</div>
      <div class="chatMessages" id="chatMessages">
        <div class="chatMsg">Welcome to PawanVoice.</div>
      </div>
    </section>

    <div id="audioContainer"></div>

  </main>

  <!-- BOTTOM -->
  <div class="bottomBar">

    <button class="bottomBtn" onclick="sendEmoji()">😊</button>

    <div class="chatInputWrap">
      <input
        id="chatInput"
        type="text"
        maxlength="150"
        placeholder="Say something..."
        onkeydown="if(event.key==='Enter')sendChat()">
    </div>

    <button class="bottomBtn" onclick="toggleSpeaker()" id="speakerBtn">🔊</button>

    <button class="bottomBtn micMain"
            onclick="toggleMic()"
            id="micBtn">🎙️</button>

    <button class="bottomBtn" onclick="openInbox()">📥</button>

    <button class="bottomBtn" onclick="openGifts()">🎁</button>

    <button class="bottomBtn" onclick="openMore()">☰</button>

  </div>

</div>


<!-- MINI ROOM -->
<div id="miniRoom">

  <div class="miniTop">

    <div class="miniDp">
      <img id="miniDpImg" style="display:none">
      <span id="miniDpFallback">🎙️</span>
    </div>

    <div class="miniInfo">
      <b id="miniRoomName">PawanVoice</b>
      <span>Room <span id="miniRoomNumber">------</span></span>
    </div>

  </div>

  <button class="miniRestore" onclick="restoreRoom()">
    Open Room
  </button>

</div>


<!-- PANEL OVERLAY -->
<div class="overlay" id="overlay" onclick="closePanel(event)">
  <div class="panel" id="panel" onclick="event.stopPropagation()">
  </div>
</div>


<!-- TOAST -->
<div id="toast"></div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
  authDomain: "pawanvoice-68c5e.firebaseapp.com",
  databaseURL: "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
  projectId: "pawanvoice-68c5e",
  storageBucket: "pawanvoice-68c5e.firebasestorage.app",
  messagingSenderId: "148446327241",
  appId: "1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================================================
   BASIC VARIABLES
========================================================= */

const params = new URLSearchParams(location.search);

let roomId =

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   NUMERIC ID GENERATOR
========================================================= */

function randomNumericId(){

  return String(
    Math.floor(100000 + Math.random() * 900000)
  );
}


/* =========================================================
   CREATE UNIQUE NUMERIC USER ID
========================================================= */

async function createNumericUserId(){

  if(myId && /^\d{6}$/.test(myId)){
    return myId;
  }

  for(let attempt=0; attempt<20; attempt++){

    const candidate = randomNumericId();

    const ref = db.ref("users/" + candidate);

    const result = await ref.transaction(current => {

      if(current === null){
        return {
          id:candidate,
          createdAt:firebase.database.ServerValue.TIMESTAMP
        };
      }

      return;
    });

    if(result.committed){

      myId = candidate;

      localStorage.setItem(
        "pawanNumericUserId",
        myId
      );

      return myId;
    }
  }

  throw new Error("Numeric User ID create nahi hua.");
}


/* =========================================================
   NUMERIC ROOM NUMBER
========================================================= */

function randomRoomNumber(){

  return String(
    Math.floor(100000 + Math.random() * 900000)
  );
}


async function createOrGetRoomNumber(){

  const roomRef = db.ref("rooms/" + roomId);

  let snapshot = await roomRef.once("value");

  let data = snapshot.val() || {};

  if(data.roomNumber &&
     /^\d{6}$/.test(String(data.roomNumber))){

    roomNumber = String(data.roomNumber);

    return roomNumber;
  }


  const result = await roomRef.transaction(current => {

    current = current || {};

    if(
      current.roomNumber &&
      /^\d{6}$/.test(String(current.roomNumber))
    ){
      return current;
    }

    current.roomNumber = randomRoomNumber();

    return current;
  });


  const finalData = result.snapshot.val() || {};

  roomNumber =
    String(finalData.roomNumber || randomRoomNumber());

  return roomNumber;
}

/* =========================================================
   IMAGE COMPRESS
========================================================= */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = function(e){

      const img =
        new Image();

      img.onload = function(){

        const maxSize = 500;

        let width =
          img.width;

        let height =
          img.height;

        if(width > height){

          if(width > maxSize){

            height =
              Math.round(
                height * maxSize / width
              );

            width = maxSize;
          }

        }else{

          if(height > maxSize){

            width =
              Math.round(
                width * maxSize / height
              );

            height = maxSize;
          }
        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        const result =
          canvas.toDataURL(
            "image/jpeg",
            .72
          );

        resolve(result);

      };

      img.onerror = reject;

      img.src = e.target.result;
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });
}

    toast("Sirf image select karein.");

  try{

    const compressed =
      await compressImage(file);

    await db.ref(
      "rooms/" +
      roomId +
      "/settings/dp"

    toast("Room DP change ho gayi ✅");

    closePanel();

  }catch(error){

    console.error(error);

    toast(
      "DP save nahi hui. Firebase rules check karein."
    );
  }
}

function fallbackCopy(text){

  const ta =
    document.createElement("textarea");

  ta.value = text;

  document.body.appendChild(ta);

  ta.select();

  try{
    document.execCommand("copy");
  }catch(e){}

}

/* =========================================================
   WEBRTC / PEERJS
========================================================= */

async function startVoice(){

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },
        video:false
      });

    localStream
      .getAudioTracks()
      .forEach(track=>{
        track.enabled = micOn;
      });

    startPeer();

  }catch(error){

    console.error(error);

    toast(
      "Mic permission allow karein."
    );

  }
}


function startPeer(){

  if(peer){
    return;
  }

  try{

    peer =
      new Peer(
        "pv-" +
        myId +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,6),
        {
          debug:1
        }
      );

    peer.on("open",async peerId=>{

      await db.ref(
        "rooms/" +
        roomId +
        "/users/" +
        myId +
        "/peerId"
      ).set(peerId);

      connectToUsers();

    });


    peer.on("call",call=>{

      call.answer(
        localStream
      );

      call.on("stream",remoteStream=>{

        addAudio(
          call.peer,
          remoteStream
        );

      });

    });


    peer.on("error",error=>{

      console.error(error);

      toast(
        "Voice connection error."
      );

    });

  }catch(error){

    console.error(error);
  }
}


/* =========================================================
   CONNECT USERS
========================================================= */

function connectToUsers(){

  if(!peer || !localStream){
    return;
  }

  Object.values(users || {})
    .forEach(user=>{

      const targetId =
        String(user.id || "");

      if(!targetId ||
         targetId === String(myId)){
        return;
      }

      if(!user.peerId){
        return;
      }

      if(calls[targetId]){
        return;
      }

      try{

        const call =
          peer.call(
            user.peerId,
            localStream
          );

        calls[targetId] =
          call;

        call.on(
          "stream",
          remoteStream=>{
            addAudio(
              targetId,
              remoteStream
            );
          }
        );

        call.on("close",()=>{
          removeAudio(targetId);
          delete calls[targetId];
        });

        call.on("error",()=>{
          removeAudio(targetId);
          delete calls[targetId];
        });

      }catch(error){

        console.error(error);
      }
    });
}


/* =========================================================
   AUDIO
========================================================= */

function addAudio(id,stream){

  const audioId =
    "audio-" +
    String(id).replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );

  let audio =
    document.getElementById(audioId);

  if(!audio){

    audio =
      document.createElement("audio");

    audio.id = audioId;

    audio.autoplay = true;

    audio.playsInline = true;

    audio.controls = false;

    audio.style.display = "none";

    document
      .getElementById("audioContainer")
      .appendChild(audio);
  }

  audio.srcObject =
    stream;

  audio.muted =
    !speakerOn;

  audio.play().catch(()=>{});
}


function removeAudio(id){

  const audioId =
    "audio-" +
    String(id).replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );

  const audio =
    document.getElementById(audioId);

  if(audio){
    audio.remove();
  }
}

      <button class="moreItem"
              onclick="setTheme('green')">
        <div class="ico">💚</div>
        <span>Green</span>
      </button>

      <button class="moreItem"
              onclick="setTheme('dark')">
        <div class="ico">🖤</div>
        <span>Dark</span>
      </button>

    </div>

  `);
}


function setTheme(theme){

  if(theme === "blue"){

    document.documentElement.style.setProperty(
      "--theme",
      "#3e7bff"
    );

  }

  if(theme === "green"){

    document.documentElement.style.setProperty(
      "--theme",
      "#21b879"
    );

  }

  if(theme === "purple"){

    document.documentElement.style.setProperty(
      "--theme",
      "#7b55ff"
    );

  }

  toast(
    "Theme: " + theme
  );

  closePanel();
}

}

========================================================= */

function minimizeRoom(){

  document.getElementById(
    "app"
  ).style.display = "none";

  document.getElementById(
    "miniRoom"
  ).classList.add("show");
}


function restoreRoom(){

  document.getElementById(
    "app"
  ).style.display = "flex";

  document.getElementById(
    "miniRoom"
  ).classList.remove("show");
}


/* =========================================================
   PANEL
========================================================= */

function openPanel(html){

  document.getElementById(
    "panel"
  ).innerHTML = html;

  document.getElementById(
    "overlay"
  ).classList.add("show");
}


function closePanel(event){

  if(
    event &&
    event.target !==
    document.getElementById("overlay")
  ){
    return;
  }

  document.getElementById(
    "overlay"
  ).classList.remove("show");
}


/* =========================================================
   ROOM TIMER
========================================================= */

function startRoomTimer(){

  setInterval(()=>{

    const seconds =
      Math.floor(
        (Date.now() - roomStartedAt) / 1000
      );

    const h =
      Math.floor(seconds / 3600);

    const m =
      Math.floor(
        (seconds % 3600) / 60
      );

    const s =
      seconds % 60;

    let value = "";

    if(h > 0){

      value =
        String(h).padStart(2,"0") +
        ":" +
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0");

    }else{

      value =
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0");
    }

    document.getElementById(
      "roomDuration"
    ).innerText = value;

  },1000);
}


/* =========================================================
   LEAVE ROOM
========================================================= */

async function leaveRoom(){

  try{

    await db.ref(
      "rooms/" +
      roomId +
      "/users/" +
      myId
    ).remove();

  }catch(e){}

  if(peer){

    try{
      peer.destroy();
    }catch(e){}

  }

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        track.stop();
      });
  }

  toast("Room left.");

  setTimeout(()=>{

    location.href =
      "index.html";

  },500);
}
