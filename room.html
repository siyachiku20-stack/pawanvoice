<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PawanVoice Room</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080711;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  position:relative;
  background:
    radial-gradient(circle at top,#351454 0,#110b1d 38%,#080711 75%);
  padding-bottom:90px;
}

/* HEADER */

.header{
  height:70px;
  display:flex;
  align-items:center;
  padding:10px 12px;
  gap:10px;
}

.back{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#1b1728;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.roomDp{
  width:44px;
  height:44px;
  border-radius:13px;
  object-fit:cover;
  border:2px solid #9458ff;
}

.roomInfo{
  flex:1;
  min-width:0;
}

.roomName{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomId{
  margin-top:4px;
  color:#9b91a8;
  font-size:11px;
}

.headerRight{
  display:flex;
  gap:7px;
}

.headBtn{
  width:37px;
  height:37px;
  border:0;
  border-radius:12px;
  background:#1c1829;
  color:#fff;
  font-size:18px;
}

/* ONLINE */

.onlineBar{
  margin:0 13px 10px;
  height:37px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  background:#171322;
  border:1px solid #29233b;
  border-radius:13px;
  font-size:12px;
}

.onlineText{
  color:#aaa;
}

/* SEATS */

.seats{
  padding:12px 12px 5px;
}

.seatRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:13px;
}

.hostRow{
  display:flex;
  justify-content:center;
}

.seatBox{
  text-align:center;
  min-width:0;
}

.avatarWrap{
  position:relative;
  width:65px;
  height:65px;
  margin:auto;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  background:#211c31;
  border:2px solid #393148;
}

.occupied .avatar{
  border-color:#9a5cff;
}

.micDot{
  position:absolute;
  right:0;
  bottom:0;
  width:20px;
  height:20px;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
  background:#7e43ff;
  font-size:10px;
  border:2px solid #110b1d;
}

.name{
  margin-top:6px;
  font-size:11px;
  color:#d7d0df;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.emptyName{
  color:#777;
}

.hostTag{
  display:inline-block;
  margin-top:3px;
  padding:2px 6px;
  border-radius:7px;
  font-size:8px;
  background:#edaa3d;
  color:#291706;
  font-weight:bold;
}

/* ROOM TOOLS */

.tools{
  padding:18px 12px 5px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.tool{
  border:0;
  background:#171321;
  color:#ddd;
  border-radius:14px;
  min-height:66px;
  border:1px solid #282238;
  font-size:10px;
}

.toolIcon{
  display:block;
  font-size:22px;
  margin-bottom:6px;
}

/* EXP */

.expCard{
  margin:16px 12px;
  padding:15px;
  border-radius:19px;
  background:linear-gradient(135deg,#211632,#171020);
  border:1px solid #34264c;
}

.expTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  margin-bottom:13px;
}

.rankRow{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.rank{
  background:#0f0c17;
  border-radius:14px;
  padding:10px 5px;
  text-align:center;
}

.rank:first-child{
  border:1px solid #e2aa43;
}

.rank:nth-child(2){
  border:1px solid #aaa;
}

.rank:nth-child(3){
  border:1px solid #9d603d;
}

.rankAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.rankName{
  margin-top:5px;
  font-size:10px;
  color:#aaa;
}

.rankNo{
  margin-top:3px;
  font-size:12px;
}

/* CHAT */

.chatArea{
  padding:8px 12px;
  min-height:100px;
}

.chatMessage{
  margin-bottom:7px;
  font-size:12px;
  color:#ddd;
  word-break:break-word;
}

.chatMessage b{
  color:#bd8cff;
}

.chatTime{
  color:#666;
  font-size:9px;
  margin-left:5px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  min-height:75px;
  padding:9px 9px;
  background:rgba(12,10,19,.97);
  border-top:1px solid #292339;
  display:flex;
  align-items:center;
  gap:6px;
  z-index:20;
}

.messageInput{
  flex:1;
  min-width:0;
  height:44px;
  border:1px solid #302942;
  border-radius:14px;
  background:#191523;
  color:#fff;
  padding:0 12px;
  outline:none;
}

.actionBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:#211b2e;
  color:#fff;
  font-size:18px;
}

.actionBtn.active{
  background:#7640e7;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;
  max-width:430px;
  max-height:75vh;
  overflow:auto;
  background:#171321;
  border-radius:25px 25px 0 0;
  padding:20px 16px 30px;
  border-top:1px solid #34294a;
}

.sheetTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.sheetTitle h3{
  font-size:18px;
}

.close{
  width:35px;
  height:35px;
  border:0;
  border-radius:10px;
  background:#282239;
  color:#fff;
  font-size:18px;
}

.sheetBtn{
  width:100%;
  min-height:48px;
  margin-top:9px;
  border:0;
  border-radius:13px;
  background:#211c2e;
  color:#fff;
  text-align:left;
  padding:0 15px;
}

.sheetBtn:active{
  background:#7040d2;
}

/* EMOJIS */

.emojis{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:9px;
}

.emoji{
  height:45px;
  border:0;
  border-radius:12px;
  background:#211c2e;
  font-size:23px;
}

/* GIFTS */

.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.gift{
  border:0;
  background:#211c2e;
  border-radius:15px;
  color:#fff;
  padding:12px 5px;
}

.giftIcon{
  font-size:27px;
}

.giftName{
  margin-top:5px;
  font-size:10px;
}

.giftPrice{
  margin-top:3px;
  color:#c18cff;
  font-size:9px;
}

/* ADMIN */

.adminUser{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:#211c2e;
  border-radius:14px;
  margin-bottom:8px;
}

.adminUser img{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
}

.adminInfo{
  flex:1;
}

.adminName{
  font-size:13px;
}

.adminId{
  font-size:10px;
  color:#777;
  margin-top:3px;
}

.adminAction{
  border:0;
  border-radius:9px;
  background:#4a2634;
  color:#ff9aaf;
  padding:7px;
  font-size:10px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  background:#292239;
  border:1px solid #403455;
  padding:11px 17px;
  border-radius:13px;
  font-size:12px;
  display:none;
  z-index:200;
  white-space:nowrap;
}

.toast.show{
  display:block;
}

/* GIFT POP */

.giftPop{
  position:fixed;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%) scale(.7);
  opacity:0;
  pointer-events:none;
  font-size:65px;
  z-index:300;
  transition:.25s;
}

.giftPop.show{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
}
</style>
</head>

<script>

const socket = io();

const params = new URLSearchParams(location.search);

const roomId =
  params.get("room") || "10001";

const userId =
  params.get("userid") ||
  localStorage.getItem("pv_userId") ||
  "guest_" + Date.now();

const userName =
  params.get("name") ||
  localStorage.getItem("pv_name") ||
  "Guest";

const userDp =
  params.get("dp") ||
  localStorage.getItem("pv_dp") ||
  "https://i.pravatar.cc/150?img=12";

let users = [];
let hostSocketId = null;

let micEnabled = false;
let speakerEnabled = true;

let localStream = null;


/* IMPORTANT FIX:
   Modal function was missing in previous version.
*/

function openModal(id){

  const el =
    document.getElementById(id);

  if(el){
    el.classList.add("open");
  }

}


function closeModal(id){

  const el =
    document.getElementById(id);

  if(el){
    el.classList.remove("open");
  }

}


/* ROOM TITLE */

document.getElementById("roomId").innerText =
  "Room #" + roomId;

document.getElementById("roomDp").src =
  userDp;


/* SOCKET */

socket.on("connect",()=>{

  showToast("Connected");

  socket.emit("join-room",{

    roomId:roomId,
    userId:userId,
    name:userName,
    dp:userDp

  });

});


socket.on("disconnect",()=>{

  showToast("Connection lost");

});


socket.on("joined-room",(data)=>{

  hostSocketId =
    data.hostSocketId;

});


socket.on("room-state",(data)=>{

  users =
    Array.isArray(data.users)
    ? data.users
    : [];

  hostSocketId =
    data.hostSocketId || null;

  renderRoom();

});


socket.on("room-error",(data)=>{

  showToast(
    data.message || "Room error"
  );

});


socket.on("seat-error",(data)=>{

  showToast(
    data.message || "Seat unavailable"
  );

});


socket.on("kicked-from-room",(data)=>{

  stopMic();

  alert(
    data.message ||
    "You were removed from the room."
  );

  window.location.href="/index.html";

});


socket.on("forced-mute",(data)=>{

  stopMic();

  showToast(
    data.message ||
    "You were muted by admin."
  );

});


/* CHAT */

socket.on("chat-message",(data)=>{

  addChat(
    data.name,
    data.message,
    data.time
  );

});


/* GIFTS */

socket.on("gift-event",(data)=>{

  showGift(
    data.giftIcon || "🎁"
  );

  addChat(
    data.fromName,
    "sent " +
    (data.giftName || "Gift"),
    ""
  );

});


/* RENDER ROOM */

function renderRoom(){

  document.getElementById("onlineCount").innerText =
    users.length + "/9";


  for(let seat=1; seat<=9; seat++){

    const avatar =
      document.getElementById(
        "avatar" + seat
      );

    const name =
      document.getElementById(
        "name" + seat
      );

    const mic =
      document.getElementById(
        "mic" + seat
      );

    const user =
      users.find(
        u => Number(u.seat) === seat
      );


    if(user){

      avatar.src =
        user.dp ||
        "https://i.pravatar.cc/150?img=12";

      name.innerText =
        user.name || user.userId;

      name.classList.remove(
        "emptyName"
      );

      document
        .getElementById("seat" + seat)
        ?.classList.add("occupied");

      if(user.mic){

        mic.style.display="flex";

      }else{

        mic.style.display="none";

      }

    }else{

      avatar.src =
        "https://i.pravatar.cc/150?img=1";

      name.innerText =
        "Seat " + seat;

      name.classList.add(
        "emptyName"
      );

      if(mic){

        mic.style.display="none";

      }

    }

  }


  renderAdmin();

}


/* SEAT */

function seatClick(seat){

  const me =
    users.find(
      u => u.socketId === socket.id
    );


  if(!me){

    showToast("Connecting to room...");

    return;

  }


  if(Number(me.seat) === Number(seat)){

    socket.emit("leave-seat");

    stopMic();

    return;

  }


  const occupied =
    users.find(
      u => Number(u.seat) === Number(seat)
    );


  if(occupied){

    showToast(
      occupied.name +
      " is already on this seat"
    );

    return;

  }


  socket.emit(
    "take-seat",
    Number(seat)
  );

}


/* MIC */

async function toggleMic(){

  const me =
    users.find(
      u => u.socketId === socket.id
    );


  if(!me || !me.seat){

    showToast("First take a seat.");

    return;

  }


  if(micEnabled){

    stopMic();

  }else{

    await startMic();

  }

}


async function startMic(){

  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

      showToast(
        "Microphone is not supported here."
      );

      return;

    }


    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio:true,
        video:false

      });


    micEnabled=true;

    socket.emit(
      "mic-status",
      true
    );


    document
      .getElementById("micBtn")
      .classList.add("active");


    showToast("Mic ON");

  }catch(error){

    console.error(error);

    showToast(
      "Microphone permission denied."
    );

  }

}


function stopMic(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        track.stop();
      });

    localStream=null;

  }


  micEnabled=false;

  socket.emit(
    "mic-status",
    false
  );


  const btn =
    document.getElementById("micBtn");

  if(btn){

    btn.classList.remove(
      "active"
    );

  }

}


/* SPEAKER */

function toggleSpeaker(){

  speakerEnabled =
    !speakerEnabled;


  const btn =
    document.getElementById(
      "speakerBtn"
    );


  if(speakerEnabled){

    btn.classList.add("active");

    btn.innerText="🔊";

    showToast("Speaker ON");

  }else{

    btn.classList.remove("active");

    btn.innerText="🔇";

    showToast("Speaker OFF");

  }


  socket.emit(
    "speaker-status",
    speakerEnabled
  );

}


/* CHAT */

const messageInput =
  document.getElementById(
    "messageInput"
  );


messageInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      sendMessage();

    }

  }
);


function sendMessage(){

  const text =
    messageInput.value.trim();


  if(!text){

    return;

  }


  socket.emit(
    "chat-message",
    text
  );


  messageInput.value="";

}


/* EMOJI */

function addEmoji(emoji){

  messageInput.value +=
    emoji;

  closeModal(
    "emojiModal"
  );

  messageInput.focus();

}


/* GIFTS */

function sendGift(name,icon,price){

  socket.emit(
    "send-gift",
    {
      name:name,
      icon:icon,
      price:price
    }
  );

  closeModal(
    "giftModal"
  );

}


function showGift(icon){

  const pop =
    document.getElementById(
      "giftPop"
    );

  pop.innerText=icon;

  pop.classList.add("show");

  setTimeout(()=>{

    pop.classList.remove("show");

  },1200);

}


/* CHAT DISPLAY */

function addChat(name,message,time){

  const area =
    document.getElementById(
      "chatArea"
    );


  const row =
    document.createElement(
      "div"
    );

  row.className=
    "chatMessage";


  const b =
    document.createElement(
      "b"
    );

  b.innerText=
    name || "User";


  const span =
    document.createElement(
      "span"
    );

  span.innerText=
    " " + message;


  row.appendChild(b);

  row.appendChild(span);


  if(time){

    const t =
      document.createElement(
        "span"
      );

    t.className=
      "chatTime";

    t.innerText=
      time;

    row.appendChild(t);

  }


  area.appendChild(row);


  area.scrollTop =
    area.scrollHeight;


  while(area.children.length > 40){

    area.removeChild(
      area.firstChild
    );

  }

}


/* INVITE */

async function inviteRoom(){

  const link =
    location.href;


  if(navigator.share){

    try{

      await navigator.share({

        title:"PawanVoice Room",
        text:
          "Join my PawanVoice room",
        url:link

      });

      return;

    }catch(e){}

  }


  try{

    await navigator.clipboard.writeText(
      link
    );

    showToast(
      "Room link copied"
    );

  }catch(e){

    prompt(
      "Copy room link:",
      link
    );

  }

}


/* ADMIN */

function openAdmin(){

  openModal(
    "adminModal"
  );

  renderAdmin();

}


function renderAdmin(){

  const list =
    document.getElementById(
      "adminList"
    );


  if(!list){

    return;

  }


  list.innerHTML="";


  if(users.length===0){

    list.innerHTML=
      "<div style='color:#888;padding:20px;text-align:center'>No users</div>";

    return;

  }


  users.forEach(user=>{

    const row =
      document.createElement(
        "div"
      );

    row.className=
      "adminUser";


    const img =
      document.createElement(
        "img"
      );

    img.src =
      user.dp ||
      "https://i.pravatar.cc/150?img=12";


    const info =
      document.createElement(
        "div"
      );

    info.className=
      "adminInfo";


    const name =
      document.createElement(
        "div"
      );

    name.className=
      "adminName";

    name.innerText=
      user.name;


    const id =
      document.createElement(
        "div"
      );

    id.className=
      "adminId";

    id.innerText=
      "ID: " +
      user.userId;


    info.appendChild(name);

    info.appendChild(id);


    row.appendChild(img);

    row.appendChild(info);


    if(user.socketId !== socket.id){

      const kick =
        document.createElement(
          "button"
        );

      kick.className=
        "adminAction";

      kick.innerText=
        "Kick";


      kick.onclick=()=>{

        socket.emit(
          "admin-kick",
          user.socketId
        );

      };


      row.appendChild(kick);


      const mute =
        document.createElement(
          "button"
        );

      mute.className=
        "adminAction";

      mute.innerText=
        "Mute";


      mute.onclick=()=>{

        socket.emit(
          "admin-mute",
          user.socketId
        );

      };


      row.appendChild(mute);

    }


    list.appendChild(row);

  });

}


/* LEAVE */

function leaveRoom(){

  stopMic();

  socket.disconnect();

  window.location.href =
    "/index.html";

}


/* TOAST */

function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.innerText =
    text;

  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(()=>{

      toast.classList.remove(
        "show"
      );

    },1800);

}


/* CLOSE MODAL WHEN BACKGROUND CLICK */

document.querySelectorAll(
  ".modal"
).forEach(modal=>{

  modal.addEventListener(
    "click",
    function(e){

      if(e.target === modal){

        modal.classList.remove(
          "open"
        );

      }

    }
  );

});

</script>
