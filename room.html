<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PawanVoice Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#090713;color:#fff}
button,input{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}

#app{
 width:100%;height:100%;
 position:relative;
 overflow:hidden;
 background:
 radial-gradient(circle at 20% 10%,rgba(126,70,255,.35),transparent 30%),
 radial-gradient(circle at 90% 20%,rgba(255,70,180,.22),transparent 30%),
 linear-gradient(150deg,#0c0718,#18102b 50%,#080611);
}

.room-bg{
 position:absolute;inset:0;
 background-size:cover;
 background-position:center;
 opacity:.20;
 pointer-events:none;
}

.top{
 position:relative;
 z-index:5;
 height:72px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 10px;
 background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,.18));
}

.back{
 width:42px;height:42px;border-radius:50%;
 background:rgba(255,255,255,.12);color:#fff;font-size:22px;
}

.room-dp{
 width:48px;height:48px;border-radius:15px;
 object-fit:cover;border:2px solid rgba(255,255,255,.55);
 background:#302348;
}

.room-head{
 min-width:0;flex:1;
}
.room-name{
 font-size:16px;font-weight:800;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.room-id{
 font-size:11px;color:#cfc7e7;margin-top:3px;
}
.online{
 font-size:11px;color:#83f7c7;
}

.top-actions{display:flex;gap:6px}
.icon-btn{
 width:40px;height:40px;border-radius:13px;
 color:#fff;background:rgba(255,255,255,.11);
}

.content{
 position:relative;
 z-index:2;
 height:calc(100% - 72px - 72px);
 overflow-y:auto;
 padding:8px 10px 125px;
 scrollbar-width:none;
}
.content::-webkit-scrollbar{display:none}

.owner-card{
 width:100%;
 padding:10px;
 border-radius:20px;
 background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
 border:1px solid rgba(255,255,255,.10);
 margin-bottom:10px;
 display:flex;
 align-items:center;
 gap:10px;
}

.owner-card img{
 width:42px;height:42px;border-radius:50%;object-fit:cover;
}
.owner-info{flex:1;min-width:0}
.owner-title{font-size:10px;color:#b9a9df}
.owner-name{font-weight:800;font-size:14px}
.owner-level{font-size:11px;color:#ffc96b}

.owner-edit{
 background:linear-gradient(135deg,#a855f7,#ec4899);
 color:white;padding:9px 12px;border-radius:12px;font-size:11px;
}

.seats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px 7px;
 padding:8px 2px;
}

.seat-wrap{
 text-align:center;
 min-width:0;
}
.seat-wrap.owner{
 grid-column:1/-1;
 margin-bottom:4px;
}

.seat{
 width:66px;height:66px;
 margin:auto;
 border-radius:50%;
 padding:3px;
 background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);
 position:relative;
}
.seat.empty{
 background:rgba(255,255,255,.10);
 border:1px dashed rgba(255,255,255,.35);
}
.seat img{
 width:100%;height:100%;object-fit:cover;border-radius:50%;
}
.seat-number{
 position:absolute;
 right:-2px;bottom:-1px;
 min-width:19px;height:19px;
 border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:#15101f;border:1px solid #8d72c5;
 font-size:9px;
}
.seat-mic{
 position:absolute;left:-2px;bottom:-1px;
 width:19px;height:19px;border-radius:50%;
 background:#20c997;font-size:9px;
 display:flex;align-items:center;justify-content:center;
}
.seat-name{
 margin-top:5px;
 font-size:10px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 color:#f5f1ff;
}
.seat-level{
 font-size:8px;color:#bcaee0;margin-top:2px;
}

.feature-card{
 margin-top:8px;
 border-radius:18px;
 background:rgba(255,255,255,.075);
 border:1px solid rgba(255,255,255,.10);
 padding:10px;
}
.feature-main{
 width:100%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:13px 14px;
 border-radius:15px;
 color:#fff;
 background:linear-gradient(135deg,#6d28d9,#db2777);
 font-weight:800;
}
.feature-main span:last-child{font-size:20px}

.feature-grid{
 display:none;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-top:9px;
}
.feature-grid.open{display:grid}

.feature-item{
 padding:11px 5px;
 border-radius:12px;
 background:rgba(255,255,255,.09);
 color:#fff;
 font-size:10px;
 text-align:center;
}
.feature-item b{
 display:block;font-size:20px;margin-bottom:5px;
}

.chat-area{
 margin-top:10px;
 min-height:150px;
 border-radius:18px;
 background:rgba(0,0,0,.18);
 padding:10px;
}
.chat-list{
 height:115px;
 overflow-y:auto;
 scrollbar-width:none;
}
.chat-list::-webkit-scrollbar{display:none}
.chat-msg{
 font-size:11px;
 padding:5px 7px;
 margin:3px 0;
 width:max-content;
 max-width:90%;
 border-radius:9px;
 background:rgba(255,255,255,.08);
}
.chat-msg b{color:#f4b7ff}
.chat-msg.system{
 color:#ffd76a;
 background:rgba(255,196,0,.08);
}

.bottom{
 position:absolute;
 z-index:10;
 left:0;right:0;bottom:0;
 min-height:72px;
 padding:8px 9px calc(8px + env(safe-area-inset-bottom));
 background:rgba(8,5,15,.94);
 backdrop-filter:blur(16px);
 border-top:1px solid rgba(255,255,255,.08);
 display:flex;
 gap:6px;
 align-items:center;
}

.chat-input{
 flex:1;
 min-width:0;
 height:43px;
 border-radius:22px;
 border:1px solid rgba(255,255,255,.13);
 background:rgba(255,255,255,.08);
 color:#fff;
 padding:0 15px;
 outline:none;
}
.chat-input::placeholder{color:#aaa2b7}

.bottom-btn{
 width:43px;height:43px;border-radius:50%;
 background:rgba(255,255,255,.10);
 color:#fff;font-size:18px;
}
.bottom-btn.active{background:#7c3aed}

.send-btn{
 background:linear-gradient(135deg,#8b5cf6,#ec4899);
}

.modal-bg{
 position:fixed;inset:0;z-index:50;
 display:none;
 align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.68);
}
.modal-bg.show{display:flex}

.modal{
 width:100%;
 max-width:520px;
 max-height:88vh;
 overflow-y:auto;
 background:#171020;
 border-radius:24px 24px 0 0;
 padding:16px;
 border:1px solid rgba(255,255,255,.12);
}
.modal::-webkit-scrollbar{display:none}
.modal-head{
 display:flex;align-items:center;justify-content:space-between;
 margin-bottom:14px;
}
.modal-title{font-size:18px;font-weight:800}
.close{
 width:35px;height:35px;border-radius:50%;
 background:rgba(255,255,255,.10);color:white;
}

.form-row{margin-bottom:12px}
.form-row label{
 display:block;font-size:11px;color:#aaa0bb;margin-bottom:6px;
}
.form-input{
 width:100%;height:44px;
 border:1px solid rgba(255,255,255,.13);
 background:#0e0a16;color:#fff;
 border-radius:12px;padding:0 12px;outline:none;
}

.primary{
 width:100%;height:45px;border-radius:13px;
 background:linear-gradient(135deg,#8b5cf6,#ec4899);
 color:#fff;font-weight:800;
}
.secondary{
 width:100%;height:43px;border-radius:12px;
 background:rgba(255,255,255,.10);color:#fff;
 margin-top:8px;
}

.room-preview{
 width:92px;height:92px;border-radius:24px;
 object-fit:cover;
 display:block;margin:5px auto 12px;
 border:2px solid rgba(255,255,255,.25);
}

.list{
 display:grid;gap:8px;
}
.list-item{
 padding:12px;border-radius:13px;
 background:rgba(255,255,255,.07);
 display:flex;align-items:center;gap:10px;
}
.list-item .emoji{font-size:22px}
.list-item .li-text{flex:1}
.li-title{font-size:12px;font-weight:800}
.li-sub{font-size:10px;color:#aaa1b9;margin-top:3px}

.gift-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
 max-height:55vh;
 overflow-y:auto;
}
.gift{
 background:rgba(255,255,255,.07);
 border-radius:12px;
 padding:9px 4px;
 text-align:center;
}
.gift-icon{font-size:28px}
.gift-name{font-size:9px;margin-top:4px}
.gift-price{font-size:8px;color:#ffd76a;margin-top:3px}
.gift button{
 margin-top:5px;
 background:#7c3aed;color:white;
 padding:5px 7px;border-radius:8px;font-size:8px;
}

.profile-top{
 text-align:center;
}
.profile-dp{
 width:88px;height:88px;border-radius:50%;
 object-fit:cover;border:3px solid #a855f7;
}
.profile-name{font-size:18px;font-weight:800;margin-top:8px}
.profile-id{font-size:10px;color:#aaa0ba;margin-top:4px}

.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:7px;margin:14px 0;
}
.stat{
 padding:10px 4px;text-align:center;
 border-radius:12px;background:rgba(255,255,255,.07);
}
.stat b{display:block;font-size:15px}
.stat span{font-size:9px;color:#aaa}

.balance{
 display:grid;grid-template-columns:1fr 1fr;
 gap:8px;margin-bottom:12px;
}
.balance-box{
 background:rgba(255,255,255,.07);
 padding:12px;border-radius:13px;
}
.balance-box b{font-size:16px}
.balance-box small{display:block;color:#aaa;font-size:9px}

.toast{
 position:fixed;
 z-index:100;
 left:50%;top:82px;
 transform:translateX(-50%) translateY(-10px);
 background:#21152f;
 border:1px solid rgba(255,255,255,.12);
 padding:10px 15px;
 border-radius:12px;
 font-size:11px;
 opacity:0;
 pointer-events:none;
 transition:.25s;
}
.toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}

.emoji-panel{
 position:fixed;
 z-index:30;
 left:8px;right:8px;bottom:76px;
 background:#18111f;
 border-radius:17px;
 padding:10px;
 display:none;
 border:1px solid rgba(255,255,255,.10);
}
.emoji-panel.show{display:block}
.emoji-list{
 display:grid;grid-template-columns:repeat(8,1fr);
 gap:5px;
}
.emoji-list button{
 background:transparent;color:white;font-size:23px;padding:5px;
}

.empty{
 text-align:center;
 padding:20px 10px;
 color:#91879f;
 font-size:11px;
}

@media(max-width:360px){
 .seat{width:58px;height:58px}
 .feature-grid{grid-template-columns:repeat(2,1fr)}
 .gift-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div id="app">
  <div id="roomBg" class="room-bg"></div>

  <header class="top">
    <button class="back" id="backBtn">‹</button>

    <img id="roomDp" class="room-dp" src="https://i.pravatar.cc/200?img=12">

    <div class="room-head">
      <div id="roomName" class="room-name">Pawan's Room</div>
      <div id="roomId" class="room-id">Room ID: —</div>
      <div id="online" class="online">0 online</div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="shareBtn">↗</button>
      <button class="icon-btn" id="moreBtn">⋮</button>
    </div>
  </header>

  <main class="content">

    <div class="owner-card">
      <img id="ownerDp" src="https://i.pravatar.cc/200?img=12">
      <div class="owner-info">
        <div class="owner-title">ROOM OWNER</div>
        <div id="ownerName" class="owner-name">Pawan</div>
        <div id="ownerLevel" class="owner-level">LV 1</div>
      </div>
      <button id="editRoomBtn" class="owner-edit">Edit Room</button>
    </div>

    <section id="seats" class="seats"></section>

    <!-- ONE BUTTON FOR ALL ROOM FEATURES -->
    <section class="feature-card">
      <button id="featureToggle" class="feature-main">
        <span>✨ Room Features</span>
        <span>⌄</span>
      </button>

      <div id="featureGrid" class="feature-grid">

        <button class="feature-item" data-action="support">
          <b>💜</b>Room Support
        </button>

        <button class="feature-item" data-action="wheel">
          <b>🎡</b>Lucky Wheel
        </button>

        <button class="feature-item" data-action="bounty">
          <b>🎯</b>Bounty Hunter
        </button>

        <button class="feature-item" data-action="roomReward">
          <b>🎁</b>Room Reward
        </button>

        <button class="feature-item" data-action="daily">
          <b>📅</b>Daily Reward
        </button>

        <button class="feature-item" data-action="games">
          <b>🎮</b>Games
        </button>

        <button class="feature-item" data-action="exclusive">
          <b>👑</b>Exclusive
        </button>

        <button class="feature-item" data-action="gifts">
          <b>🎁</b>Gifts
        </button>

        <button class="feature-item" data-action="invite">
          <b>📨</b>Invite
        </button>

        <button class="feature-item" data-action="roomInfo">
          <b>ℹ️</b>Room Info
        </button>

        <button class="feature-item" data-action="members">
          <b>👥</b>Members
        </button>

        <button class="feature-item" data-action="admin">
          <b>🛡️</b>Admin
        </button>

      </div>
    </section>

    <section class="chat-area">
      <div id="chatList" class="chat-list"></div>
    </section>

  </main>

  <div id="emojiPanel" class="emoji-panel">
    <div id="emojiList" class="emoji-list"></div>
  </div>

  <footer class="bottom">
    <input id="chatInput" class="chat-input" placeholder="Say something...">

    <button id="emojiBtn" class="bottom-btn">😊</button>
    <button id="seatBtn" class="bottom-btn">💺</button>
    <button id="speakerBtn" class="bottom-btn">🔊</button>
    <button id="micBtn" class="bottom-btn">🎙️</button>
    <button id="sendBtn" class="bottom-btn send-btn">➤</button>
  </footer>

</div>

<div id="toast" class="toast"></div>

<!-- ROOM EDIT -->
<div id="roomEditModal" class="modal-bg">
 <div class="modal">
   <div class="modal-head">
     <div class="modal-title">Room Settings</div>
     <button class="close" data-close="roomEditModal">×</button>
   </div>

   <img id="roomPreview" class="room-preview" src="https://i.pravatar.cc/200?img=12">

   <div class="form-row">
     <label>Room DP</label>
     <input id="roomDpFile" type="file" accept="image/*" class="form-input">
   </div>

   <div class="form-row">
     <label>Room Name</label>
     <input id="roomNameInput" class="form-input" maxlength="40">
   </div>

   <div class="form-row">
     <label>Room Announcement</label>
     <input id="announcementInput" class="form-input" maxlength="100">
   </div>

   <div class="form-row">
     <label>Room Theme</label>
     <select id="themeInput" class="form-input">
       <option value="galaxy">Galaxy</option>
       <option value="sakura">Sakura</option>
       <option value="ocean">Ocean</option>
       <option value="fire">Fire</option>
       <option value="purple">Purple</option>
       <option value="love">Love</option>
       <option value="night">Night</option>
       <option value="rainbow">Rainbow</option>
       <option value="luxury">Luxury</option>
     </select>
   </div>

   <button id="saveRoomBtn" class="primary">Save Room</button>
 </div>
</div>

<!-- GENERIC MODAL -->
<div id="actionModal" class="modal-bg">
 <div class="modal">
   <div class="modal-head">
     <div id="actionTitle" class="modal-title">Room</div>
     <button class="close" data-close="actionModal">×</button>
   </div>
   <div id="actionBody"></div>
 </div>
</div>

<!-- PROFILE -->
<div id="profileModal" class="modal-bg">
 <div class="modal">
   <div class="modal-head">
     <div class="modal-title">Profile</div>
     <button class="close" data-close="profileModal">×</button>
   </div>
   <div id="profileBody"></div>
 </div>
</div>

<!-- GIFTS -->
<div id="giftModal" class="modal-bg">
 <div class="modal">
   <div class="modal-head">
     <div class="modal-title">🎁 Gifts</div>
     <button class="close" data-close="giftModal">×</button>
   </div>
   <div id="giftBalance" style="font-size:11px;color:#ffd76a;margin-bottom:10px"></div>
   <div id="giftGrid" class="gift-grid"></div>
 </div>
</div>

<script>
/* =========================================================
   PAWANVOICE ROOM
   ========================================================= */

const RENDER_BASE = location.origin;
const FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const DEFAULT_DP =
  "https://i.pravatar.cc/200?img=12";

const THEMES = {
  galaxy:
    "radial-gradient(circle at 20% 20%,#6337b8,transparent 35%),linear-gradient(135deg,#10071d,#26114a,#090612)",

  sakura:
    "radial-gradient(circle at 80% 20%,#ff77b7,transparent 30%),linear-gradient(135deg,#2b0c20,#5b1745,#110711)",

  ocean:
    "radial-gradient(circle at 30% 20%,#00bcd4,transparent 30%),linear-gradient(135deg,#03151e,#073f52,#031015)",

  fire:
    "radial-gradient(circle at 70% 20%,#ff5b22,transparent 30%),linear-gradient(135deg,#190705,#541308,#0b0504)",

  purple:
    "radial-gradient(circle at 50% 10%,#a855f7,transparent 35%),linear-gradient(135deg,#13061e,#36105c,#08050e)",

  love:
    "radial-gradient(circle at 50% 20%,#ff3d91,transparent 35%),linear-gradient(135deg,#210716,#58113a,#10050b)",

  night:
    "radial-gradient(circle at 20% 10%,#5264b7,transparent 25%),linear-gradient(135deg,#050815,#10172e,#04050a)",

  rainbow:
    "radial-gradient(circle at 20% 20%,#ff3b9d,transparent 25%),radial-gradient(circle at 80% 30%,#35d8ff,transparent 25%),linear-gradient(135deg,#170728,#09202a,#150718)",

  luxury:
    "radial-gradient(circle at 50% 0%,#c99635,transparent 28%),linear-gradient(135deg,#110d05,#30200b,#070604)"
};

let socket = null;
let room = null;
let currentUser = null;
let roomId = "";
let mySeat = -1;
let micOn = false;
let speakerOn = true;
let featureOpen = false;
let localStream = null;

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function safeJSON(value,fallback=null){
  try{return JSON.parse(value)}
  catch(e){return fallback}
}

function getUserId(){
  return localStorage.getItem("pv_userId")
      || localStorage.getItem("pawanvoice_userId")
      || "pawan";
}

function getLocalUser(){
  return {
    userId:getUserId(),
    name:localStorage.getItem("pv_name")
      || localStorage.getItem("pawanvoice_name")
      || "Pawan",
    dp:localStorage.getItem("pv_dp")
      || localStorage.getItem("pawanvoice_dp")
      || DEFAULT_DP,
    level:Number(
      localStorage.getItem("pv_level")
      || localStorage.getItem("pawanvoice_level")
      || 1
    ),
    exp:Number(
      localStorage.getItem("pv_exp")
      || localStorage.getItem("pawanvoice_exp")
      || 0
    ),
    coins:Number(
      localStorage.getItem("pv_coins")
      || localStorage.getItem("pawanvoice_coins")
      || 0
    ),
    diamonds:Number(
      localStorage.getItem("pv_diamonds")
      || localStorage.getItem("pawanvoice_diamonds")
      || localStorage.getItem("pawanvoice_diamond")
      || 0
    ),
    following:Number(localStorage.getItem("pv_following")||0),
    followers:Number(localStorage.getItem("pv_followers")||0),
    visitors:Number(localStorage.getItem("pv_visitors")||0)
  };
}

function saveLocalUser(u){
  if(!u)return;

  localStorage.setItem("pv_userId",u.userId||"");
  localStorage.setItem("pv_name",u.name||"");
  localStorage.setItem("pv_dp",u.dp||DEFAULT_DP);
  localStorage.setItem("pv_level",u.level||1);
  localStorage.setItem("pv_exp",u.exp||0);
  localStorage.setItem("pv_coins",u.coins||0);
  localStorage.setItem("pv_diamonds",u.diamonds||0);
  localStorage.setItem("pawanvoice_userId",u.userId||"");
  localStorage.setItem("pawanvoice_name",u.name||"");
  localStorage.setItem("pawanvoice_dp",u.dp||DEFAULT_DP);
}

async function loadUser(){
  currentUser=getLocalUser();

  try{
    const r=await fetch(
      `${FIREBASE_DB}/users/${encodeURIComponent(currentUser.userId)}.json`
    );

    if(r.ok){
      const data=await r.json();

      if(data){
        currentUser={
          ...currentUser,
          ...data,
          userId:data.userId||data.id||currentUser.userId,
          dp:data.dp||currentUser.dp||DEFAULT_DP,
          name:data.name||currentUser.name||"Pawan",
          level:Number(data.level||currentUser.level||1),
          coins:Number(data.coins??currentUser.coins??0),
          diamonds:Number(
            data.diamonds??data.diamond??currentUser.diamonds??0
          )
        };

        saveLocalUser(currentUser);
      }
    }
  }catch(e){
    console.log("Firebase user load:",e);
  }

  updateBalance();
}

async function saveUser(){
  if(!currentUser)return;

  saveLocalUser(currentUser);

  try{
    await fetch(
      `${FIREBASE_DB}/users/${encodeURIComponent(currentUser.userId)}.json`,
      {
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          userId:currentUser.userId,
          name:currentUser.name,
          dp:currentUser.dp,
          level:currentUser.level||1,
          exp:currentUser.exp||0,
          coins:currentUser.coins||0,
          diamonds:currentUser.diamonds||0,
          following:currentUser.following||0,
          followers:currentUser.followers||0,
          visitors:currentUser.visitors||0,
          updatedAt:Date.now()
        })
      }
    );
  }catch(e){
    console.log("Firebase user save:",e);
  }
}

function getRoomId(){
  const url=new URL(location.href);
  return url.searchParams.get("room")
      || localStorage.getItem("pv_roomId")
      || "";

async function fetchRoom(){
  if(!roomId)return null;

  try{
    const r=await fetch(
      `${RENDER_BASE}/api/room/${encodeURIComponent(roomId)}`
    );

    if(r.ok){
      const data=await r.json();
      return data.room||data;
    }
  }catch(e){}

  try{
    const r=await fetch(
      `${FIREBASE_DB}/rooms/${encodeURIComponent(roomId)}.json`
    );

    if(r.ok){
      return await r.json();
    }
  }catch(e){}

  return null;
}

function normalizeRoom(r){
  if(!r)return null;

  if(!r.id)r.id=roomId;

  r.name=r.roomName||r.name||"Pawan's Room";
  r.roomName=r.name;

  r.dp=r.dp||DEFAULT_DP;
  r.ownerId=r.ownerId||r.owner||"";
  r.ownerName=r.ownerName||"Pawan";
  r.ownerDp=r.ownerDp||r.dp||DEFAULT_DP;

  r.seats=Array.isArray(r.seats)
    ? r.seats
    : Array.from({length:9},()=>null);

  r.users=r.users||{};
  r.members=r.members||{};

  r.admins=Array.isArray(r.admins)
    ? r.admins
    : [];

  r.themeName=r.themeName||"galaxy";
  r.themeBackground=r.themeBackground||"";

  return r;
}

function applyTheme(){
  if(!room)return;

  if(room.themeBackground){
    $("roomBg").style.backgroundImage=
      `url("${room.themeBackground}")`;
  }else{
    $("roomBg").style.backgroundImage=
      THEMES[room.themeName]||THEMES.galaxy;
  }
}

function renderRoom(){
  if(!room)return;

  $("roomName").textContent=room.name;
  $("roomId").textContent=`Room ID: ${room.id}`;

  const users=Object.values(room.users||{});
  $("online").textContent=`${users.length} online`;

  $("roomDp").src=room.dp||DEFAULT_DP;
  $("ownerDp").src=room.ownerDp||room.dp||DEFAULT_DP;
  $("ownerName").textContent=room.ownerName||"Pawan";

  const ownerUser=
    users.find(x=>
      String(x.userId||x.id)===String(room.ownerId)
    );

  $("ownerLevel").textContent=
    `LV ${ownerUser?.level||1}`;

  renderSeats();
  applyTheme();

  const ownerId=String(room.ownerId||"");
  const isOwner=ownerId===String(currentUser?.userId);

  const isAdmin=
    isOwner ||
    (room.admins||[])
      .map(String)
      .includes(String(currentUser?.userId));

  $("editRoomBtn").style.display=
    isAdmin ? "block":"none";
}

function getSeatUser(seat){
  if(!seat)return null;

  if(typeof seat==="string"){
    return room?.users?.[seat]||null;
  }

  if(seat.userId){
    return room?.users?.[seat.userId]||seat;
  }

  return seat;
}

function renderSeats(){
  const box=$("seats");
  box.innerHTML="";

  for(let i=0;i<9;i++){

    const user=getSeatUser(room.seats[i]);

    const wrap=document.createElement("div");
    wrap.className="seat-wrap"+(i===0?" owner":"");

    const seat=document.createElement("div");
    seat.className="seat"+(!user?" empty":"");

    if(user){
      const img=document.createElement("img");
      img.src=user.dp||DEFAULT_DP;
      img.onerror=()=>img.src=DEFAULT_DP;
      img.addEventListener("click",()=>openUserProfile(user));
      seat.appendChild(img);

      const mic=document.createElement("div");
      mic.className="seat-mic";
      mic.textContent=user.mic ? "🎙️":"🔇";
      seat.appendChild(mic);
    }else{
      seat.textContent="＋";
      seat.style.display="flex";
      seat.style.alignItems="center";
      seat.style.justifyContent="center";
      seat.style.fontSize="24px";
      seat.addEventListener("click",()=>takeSeat(i));
    }

    const number=document.createElement("div");
    number.className="seat-number";
    number.textContent=i+1;
    seat.appendChild(number);

    wrap.appendChild(seat);

    const name=document.createElement("div");
    name.className="seat-name";
    name.textContent=user?.name||"Empty";
    wrap.appendChild(name);

    const level=document.createElement("div");
    level.className="seat-level";
    level.textContent=user ? `LV ${user.level||1}`:"Tap to join";
    wrap.appendChild(level);

    if(user){
      wrap.addEventListener("contextmenu",e=>{
        e.preventDefault();
        openUserProfile(user);
      });
    }

    box.appendChild(wrap);

    if(user &&
       String(user.userId||user.id)===String(currentUser.userId)){
      mySeat=i;
    }
  }
}

async function joinRoom(){

  room=normalizeRoom(await fetchRoom());

  if(!room){
    showToast("Room not found");
    setTimeout(()=>location.href="index.html",1200);
    return;
  }

  renderRoom();

  socket=io(RENDER_BASE,{
    transports:["websocket","polling"],
    reconnection:true
  });

  socket.on("connect",()=>{
    socket.emit("register-user",{
      userId:currentUser.userId,
      name:currentUser.name,
      dp:currentUser.dp,
      level:currentUser.level,
      coins:currentUser.coins,
      diamonds:currentUser.diamonds
    });

    socket.emit("join-room",{
      roomId,
      user:{
        userId:currentUser.userId,
        name:currentUser.name,
        dp:currentUser.dp,
        level:currentUser.level,
        mic:false,
        speaker:true
      }
    });

    showToast("Room connected");
  });

  socket.on("room-state",data=>{
    room=normalizeRoom(data.room||data);
    renderRoom();
  });

  socket.on("room-update",data=>{
    if(data?.room){
      room=normalizeRoom(data.room);
      renderRoom();
    }
  });

  socket.on("user-joined",data=>{
    addSystemChat(`${data.name||"User"} joined the room`);
  });

  socket.on("user-left",data=>{
    addSystemChat(`${data.name||"User"} left the room`);
  });

  socket.on("chat",data=>{
    addChat(
      data.name||"User",
      data.message||""
    );
  });

  socket.on("room-chat",data=>{
    addChat(
      data.name||"User",
      data.message||""
    );
  });

  socket.on("emoji",data=>{
    addChat(
      data.name||"User",
      data.emoji||"😊"
    );
  });

  socket.on("gift",data=>{
    const giftName=data.gift?.name||data.giftName||"Gift";
    addSystemChat(
      `${data.senderName||"User"} sent ${giftName}`
    );

    if(data.user){
      currentUser={
        ...currentUser,
        ...data.user,
        coins:Number(data.user.coins??currentUser.coins),
        diamonds:Number(
          data.user.diamonds??currentUser.diamonds
        )
      };

      saveLocalUser(currentUser);
      updateBalance();
    }
  });

  socket.on("follow",data=>{
    if(String(data.targetUserId)===String(currentUser.userId)){
      addSystemChat(
        `${data.followerName||"Someone"} followed you`
      );
    }
  });

  socket.on("cp-request",data=>{
    if(String(data.toUserId)===String(currentUser.userId)){
      addSystemChat(
        `${data.fromName||"Someone"} sent you a CP request`
      );
    }
  });

  socket.on("mic-status",data=>{
    if(data.room){
      room=normalizeRoom(data.room);
      renderRoom();
    }
  });

  socket.on("speaker-status",data=>{
    if(data.room){
      room=normalizeRoom(data.room);
      renderRoom();
    }
  });

  socket.on("error-message",data=>{
    showToast(data.message||"Something went wrong");
  });

  socket.on("connect_error",()=>{
    showToast("Connecting to room...");
  });
}

async function toggleMic(){

  if(micOn){
    stopMicrophone();
    return;
  }

  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){
      showToast("Microphone not supported");
      return;
    }

    showToast("Starting microphone...");

    localStream=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    localStream.getAudioTracks()
      .forEach(t=>t.enabled=true);

    /*
      Requested 500ms delay before showing
      voice system ready.
    */
    await new Promise(resolve=>setTimeout(resolve,500));

    micOn=true;
    $("micBtn").classList.add("active");
    $("micBtn").textContent="🎙️";

    if(socket){
      socket.emit("mic-status",{
        roomId,
        userId:currentUser.userId,
        mic:true
      });
    }

    showToast("Voice system ready");

  }catch(e){
    console.log(e);
    showToast("Microphone permission denied");
  }
}

function stopMicrophone(){

  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
    localStream=null;
  }

  micOn=false;

  $("micBtn").classList.remove("active");
  $("micBtn").textContent="🎙️";

  if(socket){
    socket.emit("mic-status",{
      roomId,
      userId:currentUser.userId,
      mic:false
    });
  }

  showToast("Microphone off");
}

];

function getGifts(){
  const gifts=[];

  for(let i=1;i<=200;i++){

    let price;

    if(i<=50){
      price=i*100;
    }else if(i<=100){
      price=(i-50)*1000;
    }else if(i<=150){
      price=(i-100)*10000;
    }else{
      price=(i-150)*50000;
    }

    gifts.push({
      id:`gift_${i}`,
      name:`Gift ${i}`,
      price,
      icon:giftIcons[(i-1)%giftIcons.length]
    });
  }

  return gifts;
}

let giftTargetUserId=null;

function openGiftModal(targetUserId=null){

  giftTargetUserId=targetUserId;

  $("giftBalance").textContent=

async function sendGift(gift){

  if(!gift)return;

  if(Number(currentUser.coins||0)<gift.price){
    showToast("Not enough coins");
    return;
  }

  const receiver=
    giftTargetUserId ||
    currentUser.userId;

  if(socket){

    socket.emit("gift",{
      roomId,
      senderId:currentUser.userId,
      senderName:currentUser.name,
      receiverId:receiver,
      gift:{
        id:gift.id,
        name:gift.name,
        price:gift.price,
        icon:gift.icon
      }
    });

    /*
      Local balance is updated immediately.
      Server response can later correct it.
    */
    currentUser.coins=
      Math.max(
        0,
        Number(currentUser.coins||0)-gift.price
      );

    saveUser();
    updateGiftBalance();

    showToast(`${gift.name} sent 🎁`);
  }
}

        title:room?.name||"PawanVoice Room",
        text:"Join my PawanVoice room",
        url:link
      });
    }else{
      await navigator.clipboard.writeText(link);
      showToast("Room link copied");

  }catch(e){

function toggleAdmin(userId,makeAdmin){

  if(!socket)return;

  /*
    Existing server accepts room-update from admins.
    This sends the new admins list.
  */

  let admins=[...(room.admins||[])];

  if(makeAdmin){
    if(!admins.map(String).includes(String(userId))){
      admins.push(userId);
    }
  }else{
    admins=admins.filter(x=>String(x)!==String(userId));
  }

  socket.emit("room-update",{
    roomId,
    userId:currentUser.userId,
    admins
  });

  room.admins=admins;
  renderRoom();

  showToast(
    makeAdmin ? "Admin added":"Admin removed"
  );

  adminModal();
}

$("editRoomBtn").onclick=()=>{

$("roomDpFile").addEventListener("change",e=>{

  const file=e.target.files?.[0];

  if(!file)return;

  if(!file.type.startsWith("image/")){
    showToast("Please select an image");
    return;
  }

  if(file.size>5*1024*1024){
    showToast("Image should be under 5MB");
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{
    $("roomPreview").src=reader.result;
  };

  reader.readAsDataURL(file);
});

$("saveRoomBtn").onclick=async()=>{

  const name=
    $("roomNameInput").value.trim()
    ||"Pawan's Room";

  const announcement=
    $("announcementInput").value.trim();

  const theme=
    $("themeInput").value||"galaxy";

  let dp=$("roomPreview").src||room.dp;

  const file=$("roomDpFile").files?.[0];

  /*
    Gallery image is converted to a data URL.
    It is sent to the server/Firebase room object.
    For production Firebase Storage can replace this
    data URL with a permanent download URL.
  */

  if(file){
    try{
      dp=await fileToDataURL(file);
    }catch(e){}
  }

  const update={
    name,
    roomName:name,
    dp,
    announcement,
    themeName:theme
  };

  room={
    ...room,
    ...update
  };

  renderRoom();

  if(socket){
    socket.emit("room-update",{
      roomId,
      userId:currentUser.userId,
      ...update
    });
  }

  try{
    await fetch(
      `${RENDER_BASE}/api/room/${encodeURIComponent(roomId)}`,
      {
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          userId:currentUser.userId,
          ...update
        })
      }
    );
  }catch(e){}

  try{
    await fetch(
      `${FIREBASE_DB}/rooms/${encodeURIComponent(roomId)}.json`,
      {
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          ...update,
          updatedAt:Date.now()
        })
      }
    );
  }catch(e){}

  closeModal("roomEditModal");
  showToast("Room updated successfully");
};

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

$("seatBtn").onclick=()=>{

  if(mySeat>=0){
    leaveSeat();
    showToast("You left the seat");
  }else{
    /*
      First available seat except owner seat if
      current user is not owner.
    */
    const start=
      String(room.ownerId)===String(currentUser.userId)
      ? 0:1;

    let found=-1;

    for(let i=start;i<9;i++){
      if(!getSeatUser(room.seats[i])){
        found=i;
        break;
      }
    }

    if(found<0){
      showToast("All seats are full");
      return;
    }

    takeSeat(found);
  }
};
