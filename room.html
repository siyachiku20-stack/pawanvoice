<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#0c0915;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.roomApp{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:0 auto;
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      rgba(24,13,46,.94),
      rgba(7,7,18,.98)
    ),
    url("https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=900&q=80");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  padding-bottom:100px;
}

/* =========================
   HEADER
========================= */

.header{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:rgba(10,8,20,.45);
  backdrop-filter:blur(8px);
}

.backBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.13);
  color:#fff;
  font-size:22px;
}

.roomDP{
  width:50px;
  height:50px;
  border-radius:15px;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.9);
  background:#29243b;
}

.roomInfo{
  flex:1;
  min-width:0;
}

.roomName{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomNumber{
  font-size:11px;
  color:#cfc9db;
  margin-top:4px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:4px;
}

.online{
  font-size:11px;
  background:rgba(255,255,255,.13);
  padding:7px 8px;
  border-radius:10px;
  white-space:nowrap;
}

.headBtn{
  width:35px;
  height:35px;
  border:0;
  border-radius:10px;
  color:#fff;
  background:rgba(255,255,255,.13);
  font-size:16px;
}

/* =========================
   HOST
========================= */

.hostArea{
  display:flex;
  justify-content:center;
  padding-top:13px;
}

.seat{
  position:relative;
  width:78px;
  min-height:108px;
  text-align:center;
  user-select:none;
}

.avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  object-fit:cover;
  background:#29243b;
  border:3px solid #9d67ff;
  display:block;
  margin:0 auto;
}

.hostArea .avatar{
  width:76px;
  height:76px;
  border-color:#ffd84d;
  box-shadow:
    0 0 0 3px rgba(255,216,77,.15),
    0 0 20px rgba(255,216,77,.25);
}

.seatNumber{
  position:absolute;
  top:0;
  right:0;
  min-width:22px;
  padding:3px 5px;
  border-radius:9px;
  background:#7437ff;
  font-size:10px;
  font-weight:bold;
}

.micIcon{
  position:absolute;
  right:3px;
  bottom:29px;
  width:21px;
  height:21px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#191622;
  font-size:10px;
}

.seatName{
  width:82px;
  margin:6px auto 0;
  font-size:12px;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   SEATS 2-9
========================= */

.seatsGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  padding:5px 12px 4px;
}

.seatsGrid .seat{
  width:100%;
}

/* =========================
   FEATURE BUTTONS
========================= */

.featureRow{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:8px 10px;
  scrollbar-width:none;
}

.featureRow::-webkit-scrollbar{
  display:none;
}

.featureBtn{
  flex-shrink:0;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.10);
  color:#fff;
  border-radius:14px;
  padding:9px 11px;

/* =========================
   EXP
========================= */

.expBox{

.expTitle{

  font-weight:bold;

.topRanks{
  display:grid;
  grid-template-columns:repeat(3,1fr);

}

.rank{
  text-align:center;
  padding:8px 4px;
  border-radius:11px;
  background:rgba(255,255,255,.07);
  font-size:11px;
}

.rank b{
  display:block;

}

/* =========================
   STATUS
========================= */

  min-height:18px;
  padding:3px 10px;
  font-size:11px;
  color:#c8c2d4;
}

/* =========================
   CHAT
========================= */

.chat{

  overflow-y:auto;
  padding:5px 12px 10px;
  scrollbar-width:none;
}

.chat::-webkit-scrollbar{
  display:none;
}

.msg{

  align-items:flex-start;
  gap:7px;
  margin:8px 0;
}

.msg img{

}

.msgText{

}

.msgName{
  font-size:10px;
  color:#bbb3ca;
  margin-bottom:2px;
}

/* =========================
   BOTTOM BAR
========================= */

.bottom{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  padding:7px 7px 9px;
  background:rgba(13,10,23,.98);
  border-top:1px solid rgba(255,255,255,.08);
  z-index:50;
  backdrop-filter:blur(10px);

.emojiPanel{
  display:none;
  grid-template-columns:repeat(8,1fr);
  gap:4px;
  padding:7px;
  margin-bottom:5px;
  max-height:125px;

  border-radius:14px;

.emojiPanel button{

.chatRow{

.chatInput{

/* =========================

.modal{

  border-radius:20px;
  background:#222;
  color:#fff;
  font-size:12px;

</style>

</head>

<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
  "PASTE_YOUR_EXISTING_FULL_API_KEY_HERE",

  authDomain:
  "pawanvoice-68c5e.firebaseapp.com",

  databaseURL:
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com",

  projectId:
  "pawanvoice-68c5e",

  storageBucket:
  "pawanvoice-68c5e.firebasestorage.app",

  messagingSenderId:
  "148446327241",

  appId:
  "1:148446327241:web:6bac9cb9ad0fb530cbb818",

  measurementId:
  "G-S98P3GBNCK"

};

firebase.initializeApp(
  firebaseConfig
);

const db =
  firebase.database();


/* =====================================================
   URL DATA
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const roomId =
  params.get("room") ||
  "10001";

const userId =
  params.get("userid") ||
  localStorage.getItem("pv_userId") ||
  (
    "PV" +
    Math.floor(
      10000 +
      Math.random() * 90000
    )
  );

const userName =
  params.get("name") ||
  localStorage.getItem("pv_name") ||
  "Pawan";

const userDP =
  params.get("dp") ||
  localStorage.getItem("pv_dp") ||
  "https://i.pravatar.cc/150?img=12";

const roomTitle =
  params.get("title") ||
  "PawanVoice Room";


/* =====================================================
   BASIC UI
===================================================== */

document.getElementById(
  "roomName"
).textContent =
  roomTitle;

document.getElementById(
  "roomNumber"
).textContent =
  "Room " + roomId;

document.getElementById(
  "roomDP"
).src =
  userDP;

document.getElementById(
  "avatar1"
).src =
  userDP;

document.getElementById(
  "name1"
).textContent =
  userName;


/* =====================================================
   SAVE LOCAL USER ID
===================================================== */

localStorage.setItem(
  "pv_userId",
  userId
);


/* =====================================================
   FIREBASE USER
===================================================== */

db.ref(
  "users/" + userId
).update({

  userId:
    userId,

  name:
    userName,

  dp:
    userDP,

  updatedAt:
    firebase.database.ServerValue.TIMESTAMP

}).catch(
  error => {

    console.error(
      "Firebase user error:",
      error
    );

  }
);


/* =====================================================
   FIREBASE ROOM
===================================================== */

db.ref(
  "rooms/" + roomId
).update({

  roomId:
    roomId,

  name:
    roomTitle,

  dp:
    userDP,

  updatedAt:
    firebase.database.ServerValue.TIMESTAMP

}).catch(
  error => {

    console.error(
      "Firebase room error:",
      error
    );

  }
);


/* =====================================================
   SOCKET
===================================================== */

const socket =
  io();

let currentState =
  null;

let localStream =
  null;

let micOn =
  false;

let speakerOn =
  true;

const peers =
  {};

const pendingCandidates =
  {};


/* =====================================================
   SOCKET CONNECT
===================================================== */

socket.on(
  "connect",
  async () => {

    console.log(
      "Socket connected:",
      socket.id
    );

    setStatus(
      "Connected"
    );

    socket.emit(
      "joinRoom",
      {

        roomId:
          roomId,

        userId:
          userId,

        nickname:
          userName,

        dp:
          userDP

      }
    );

    await startMicrophone();

  }
);


/* =====================================================
   SOCKET ERROR
===================================================== */

socket.on(
  "connect_error",
  error => {

    console.error(
      "Socket error:",
      error
    );

    setStatus(
      "Server connection error"
    );

  }
);


/* =====================================================
   ROOM STATE
===================================================== */

socket.on(
  "roomState",
  state => {

    console.log(
      "Room state:",
      state
    );

    currentState =
      state;

    renderSeats(
      state
    );

    const count =
      state.users
        ? state.users.length
        : 0;

    document.getElementById(
      "online"
    ).textContent =
      count + "/9";

  }
);


/* =====================================================
   RENDER SEATS
===================================================== */

function renderSeats(
  state
){

  if(
    !state ||
    !state.seats
  ){
    return;
  }

  state.seats.forEach(
    seat => {

      const no =
        seat.seatNo;

      const avatar =
        document.getElementById(
          "avatar" + no
        );

      const name =
        document.getElementById(
          "name" + no
        );

      const mic =
        document.getElementById(
          "mic" + no
        );

      if(
        !avatar ||
        !name ||
        !mic
      ){
        return;
      }

      if(
        seat.user
      ){

        avatar.src =
          seat.user.dp ||
          "https://i.pravatar.cc/150?img=12";

        name.textContent =
          seat.user.nickname ||
          "User";

        mic.textContent =
          seat.mic
          ? "🎤"
          : "🔇";

      }else{

        if(
          no !== 1
        ){

          avatar.src =
            "https://i.pravatar.cc/150?img=" +
            (
              no + 10
            );

          name.textContent =
            "Empty";

          mic.textContent =
            "🔇";

        }

      }

    }
  );

}


/* =====================================================
   SEAT CLICK
===================================================== */

function seatClick(
  seatNo
){

  if(
    !currentState ||
    !currentState.seats
  ){
    return;
  }

  const seat =
    currentState.seats.find(
      item =>
        item.seatNo ===
        seatNo
    );

  if(!seat){
    return;
  }

  /* EMPTY */

  if(
    !seat.user
  ){

    socket.emit(
      "takeSeat",
      seatNo
    );

    showStatus(
      "Seat " +
      seatNo +
      " requested"
    );

    return;
  }

  /* OWN SEAT */

  if(
    seat.user.userId ===
    userId
  ){

    socket.emit(
      "leaveSeat"
    );

    showStatus(
      "Seat left"
    );

    return;
  }

  /* OTHER USER */

  showStatus(
    seat.user.nickname +
    " is sitting here"
  );

}


/* =====================================================
   MICROPHONE START
===================================================== */

async function startMicrophone(){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      setStatus(
        "Microphone not supported"
      );

      return;
    }

    localStream =
      await navigator.mediaDevices
      .getUserMedia({

        audio:true,

        video:false

      });

    localStream
      .getAudioTracks()
      .forEach(
        track => {

          track.enabled =
            false;

        }
      );

    document.getElementById(
      "micBtn"
    ).textContent =
      "🔇";

    setStatus(
      "Microphone ready"
    );

  }catch(error){

    console.error(
      "Microphone error:",
      error
    );

    setStatus(
      "Allow microphone permission"
    );

  }

}


/* =====================================================
   MIC ON / OFF
===================================================== */

async function toggleMic(){

  if(
    !localStream
  ){

    await startMicrophone();

  }

  if(
    !localStream
  ){

    return;
  }

  micOn =
    !micOn;

  localStream
    .getAudioTracks()
    .forEach(
      track => {

        track.enabled =
          micOn;

      }
    );

  document.getElementById(
    "micBtn"
  ).textContent =
    micOn
    ? "🎤"
    : "🔇";

  socket.emit(
    "micStatus",
    micOn
  );

  setStatus(
    micOn
    ? "Mic ON 🎤"
    : "Mic OFF 🔇"
  );

}


/* =====================================================
   WEBRTC CREATE PEER
===================================================== */

async function createPeer(
  remoteSocketId
){

  if(
    peers[remoteSocketId]
  ){

    return peers[
      remoteSocketId
    ];

  }

  const pc =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls:
            "stun:stun1.l.google.com:19302"
        },

        {
          urls:
            "stun:stun2.l.google.com:19302"
        }

      ]

    });


  /* ADD MICROPHONE */

  if(
    localStream
  ){

    localStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            localStream
          );

        }
      );

  }


  /* ICE */

  pc.onicecandidate =
    event => {

      if(
        event.candidate
      ){

        socket.emit(
          "webrtc-ice",
          {

            to:
              remoteSocketId,

            candidate:
              event.candidate

          }
        );

      }

    };


  /* REMOTE AUDIO */

  pc.ontrack =
    event => {

      let audio =
        document.getElementById(
          "audio-" +
          remoteSocketId
        );

      if(
        !audio
      ){

        audio =
          document.createElement(
            "audio"
          );

        audio.id =
          "audio-" +
          remoteSocketId;

        audio.autoplay =
          true;

        audio.playsInline =
          true;

        document.body.appendChild(
          audio
        );

      }

      audio.srcObject =
        event.streams[0];

      audio.muted =
        !speakerOn;

      audio.play()
        .catch(
          () => {}
        );

    };


  /* CONNECTION */

  pc.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC state:",
        remoteSocketId,
        pc.connectionState
      );

      if(
        pc.connectionState ===
        "connected"
      ){

        setStatus(
          "Voice connected 🎤"
        );

      }

      if(
        pc.connectionState ===
        "failed"
      ){

        setStatus(
          "Voice connection failed"
        );

      }

      if(
        pc.connectionState ===
        "disconnected"
      ){

        setStatus(
          "Voice disconnected"
        );

      }

      if(
        pc.connectionState ===
        "closed"
      ){

        delete peers[
          remoteSocketId
        ];

      }

    };


  peers[
    remoteSocketId
  ] = pc;

  return pc;

}

/* =====================================================
   CREATE OFFER
===================================================== */

async function makeOffer(
  remoteSocketId
){

  try{

    const pc =
      await createPeer(
        remoteSocketId
      );

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    socket.emit(
      "webrtc-offer",
      {

        to:
          remoteSocketId,

        offer:
          pc.localDescription

      }
    );

  }catch(error){

    console.error(
      "Offer error:",
      error
    );

  }

}


/* =====================================================
   RECEIVE OFFER
===================================================== */

socket.on(
  "webrtc-offer",
  async data => {

    try{

      const pc =
        await createPeer(
          data.from
        );

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );


      /* ADD QUEUED ICE */

      const queued =
        pendingCandidates[
          data.from
        ] || [];

      for(
        const candidate
        of queued
      ){

        try{

          await pc.addIceCandidate(
            new RTCIceCandidate(
              candidate
            )
          );

        }catch(error){

          console.error(
            "Queued ICE error:",
            error
          );

        }

      }

      delete pendingCandidates[
        data.from
      ];


      /* ANSWER */

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      socket.emit(
        "webrtc-answer",
        {

          to:
            data.from,

          answer:
            pc.localDescription

        }
      );

    }catch(error){

      console.error(
        "Offer handling error:",
        error
      );

    }

  }
);


/* =====================================================
   RECEIVE ANSWER
===================================================== */

socket.on(
  "webrtc-answer",
  async data => {

    try{

      const pc =
        peers[
          data.from
        ];

      if(
        !pc
      ){

        return;
      }

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

    }catch(error){

      console.error(
        "Answer error:",
        error
      );

    }

  }
);


/* =====================================================
   RECEIVE ICE
===================================================== */

socket.on(
  "webrtc-ice",
  async data => {

    try{

      const pc =
        peers[
          data.from
        ];

      if(
        !pc
      ){

        if(
          !pendingCandidates[
            data.from
          ]
        ){

          pendingCandidates[
            data.from
          ] = [];

        }

        pendingCandidates[
          data.from
        ].push(
          data.candidate
        );

        return;
      }


      if(
        pc.remoteDescription
      ){

        await pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }else{

        if(
          !pendingCandidates[
            data.from
          ]
        ){

          pendingCandidates[
            data.from
          ] = [];

        }

        pendingCandidates[
          data.from
        ].push(
          data.candidate
        );

      }

    }catch(error){

      console.error(
        "ICE error:",
        error
      );

    }

  }
);


/* =====================================================
   PEER LEFT
===================================================== */

socket.on(
  "peerLeft",
  data => {

    if(
      !data
    ){
      return;
    }

    const pc =
      peers[
        data.socketId
      ];

    if(
      pc
    ){

      try{

        pc.close();

      }catch(error){}

      delete peers[
        data.socketId
      ];

    }


    const audio =
      document.getElementById(
        "audio-" +
        data.socketId
      );

    if(
      audio
    ){

      audio.srcObject =
        null;

      audio.remove();

    }

  }
);

}


function sendMessage(){

  const input =
    document.getElementById(
      "chatInput"
    );

  const text =

    !text

  }

  socket.emit(

      nickname:

  );

}

/* =====================================================
   INVITE
===================================================== */

async function inviteRoom(){

  const link =
    window.location.origin +
    "/room.html" +
    "?room=" +
    encodeURIComponent(
      roomId
    ) +
    "&name=" +
    encodeURIComponent(
      userName
    ) +
    "&userid=" +
    encodeURIComponent(
      userId
    ) +
    "&title=" +
    encodeURIComponent(
      roomTitle
    ) +
    "&dp=" +
    encodeURIComponent(
      userDP
    );


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          "PawanVoice Room",

        text:
          "Join my PawanVoice room",

        url:
          link

      });

    }catch(error){}

  }else{

    try{

      await navigator.clipboard
        .writeText(
          link
        );

      showStatus(
        "Room link copied"
      );

    }catch(error){

      showStatus(
        link
      );

    }

  }

}

/* =====================================================
   LEAVE ROOM
===================================================== */

function leaveRoom(){

  try{

    socket.emit(
      "leaveRoom"
    );

  }catch(error){}


  Object.values(
    peers
  ).forEach(
    pc => {

      try{

        pc.close();

      }catch(error){}

    }
  );


  if(
    localStream
  ){

    localStream
      .getTracks()
      .forEach(
        track => {

          track.stop();

        }
      );

  }


  window.location.href =
    "/";

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text
){

  const element =
    document.getElementById(
      "status"
    );

  if(
    element
  ){

    element.textContent =
      text;

  }

}


function showStatus(
  text
){

  setStatus(
    text
  );


  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    text;

  toast.style.display =
    "block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(
      () => {

        toast.style.display =
          "none";

      },
      2200
    );

}
