<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PawanVoice Room</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
  background:#090812;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding-bottom:80px;
  background:
    radial-gradient(circle at 50% 0%,#33254b 0,#171323 25%,#090812 65%);
}


/* =========================
HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:50;

  display:flex;
  align-items:center;
  gap:10px;

  padding:10px 12px;

  background:rgba(9,8,18,.94);
  border-bottom:1px solid #292637;
  backdrop-filter:blur(14px);
}

.back{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#191724;
  color:#fff;
  font-size:20px;
}

.room-dp{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #8c68ff;
}

.header-info{
  min-width:0;
  flex:1;
}

.room-name{
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-id{
  color:#9491a3;
  font-size:10px;
  margin-top:3px;
}

.header-actions{
  display:flex;
  gap:6px;
}

.icon-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#191724;
  color:#fff;
  font-size:17px;
}


/* =========================
ROOM INFO
========================= */

.room-info{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:9px 12px;
}

.info-pill{
  padding:6px 11px;
  border-radius:14px;
  background:#161521;
  border:1px solid #2b2938;
  color:#c7c3d3;
  font-size:11px;
}

.info-pill.live{
  color:#fff;
}


/* =========================
SEATS
========================= */

.seats-area{
  padding:18px 12px 8px;
}

.host-seat{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}

.seat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px 7px;
}

.seat{
  min-width:0;
  text-align:center;
  cursor:pointer;
}

.avatar-wrap{
  position:relative;
  width:64px;
  height:64px;
  margin:auto;
}

.avatar{
  width:64px;
  height:64px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid #4c485b;
  background:#242230;
}

.seat.occupied .avatar{
  border-color:#9b77ff;
}

.seat.host .avatar{
  border-color:#ffd35e;
}

.mic-icon{
  position:absolute;
  right:-3px;
  bottom:-2px;

  width:21px;
  height:21px;

  display:flex;
  justify-content:center;
  align-items:center;

  border-radius:50%;

  background:#272432;
  border:1px solid #4c485b;

  font-size:10px;
}

.vip-label{
  position:absolute;
  top:-4px;
  right:-8px;

  padding:3px 5px;

  border-radius:7px;

  background:#9b5cff;

  color:#fff;

  font-size:8px;
  font-weight:900;
}

.badge-label{
  position:absolute;
  bottom:-4px;
  left:-4px;

  max-width:48px;

  padding:2px 4px;

  border-radius:5px;

  background:#282532;

  color:#d9d5e5;

  font-size:7px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.seat-name{
  margin-top:7px;

  font-size:11px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  color:#e5e1eb;
}

.seat-level{
  color:#858293;
  font-size:9px;
  margin-top:2px;
}

.empty-seat{
  width:64px;
  height:64px;
  margin:auto;

  border-radius:50%;

  border:2px dashed #403c4e;

  display:flex;
  justify-content:center;
  align-items:center;

  color:#777285;
  font-size:26px;

  background:#11101a;
}


/* =========================
FEATURES
========================= */

.features{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;

  padding:13px 12px;
}

.feature{
  min-height:62px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;

  border-radius:13px;

  background:#15141f;
  border:1px solid #292737;

  color:#d7d3df;

  font-size:9px;
  text-align:center;
}

.feature-icon{
  font-size:21px;
}


/* =========================
EXP
========================= */

.exp-box{
  margin:8px 12px;

  padding:13px;

  border-radius:17px;

  background:#15141f;

  border:1px solid #2b2938;
}

.exp-title{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:800;
}

.exp-sub{
  color:#8f8b9c;
  font-size:9px;
  margin-top:4px;
}

.exp-users{
  display:flex;
  justify-content:space-around;
  margin-top:12px;
}

.exp-user{
  text-align:center;
}

.exp-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #5c526f;
}

.exp-rank{
  margin-top:3px;
  color:#c4a8ff;
  font-size:9px;
}


/* =========================
CHAT
========================= */

.chat-area{
  margin-top:8px;
  padding:10px 12px;
}

.chat-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

.chat-list{
  max-height:210px;
  overflow-y:auto;
}

.chat-message{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

.chat-dp{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
}

.chat-content{
  min-width:0;
}

.chat-name{
  font-size:10px;
  color:#a999ff;
}

.chat-text{
  margin-top:2px;
  color:#dedbe5;
  font-size:12px;
  word-break:break-word;
}


/* =========================
BOTTOM CONTROLS
========================= */

.bottom-controls{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);

  width:100%;
  max-width:520px;

  z-index:100;

  padding:8px;

  background:rgba(9,8,18,.97);
  border-top:1px solid #292637;

  display:flex;
  gap:7px;
}

.message-input{
  min-width:0;
  flex:1;

  padding:11px 13px;

  border-radius:22px;

  border:1px solid #302d3e;

  outline:none;

  background:#171620;

  color:#fff;

  font-size:12px;
}

.control{
  width:43px;
  height:43px;

  flex:none;

  border-radius:50%;

  background:#1b1925;

  border:1px solid #302d3e;

  color:#fff;

  font-size:18px;
}

.control.active{
  background:#7655ff;
}


/* =========================
PANELS
========================= */

.panel{
  position:fixed;
  left:50%;
  bottom:0;

  transform:translateX(-50%) translateY(100%);

  width:100%;
  max-width:520px;

  z-index:150;

  padding:18px;

  background:#14131e;

  border-radius:22px 22px 0 0;

  border:1px solid #302d3e;

  transition:.25s;
}

.panel.show{
  transform:translateX(-50%) translateY(0);
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:14px;
}

.panel-title{
  font-size:16px;
  font-weight:900;
}

.close-panel{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#24212e;
  color:#fff;
}

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:7px;
}

.emoji{
  min-height:40px;
  border-radius:9px;
  background:#201e2a;
  font-size:22px;
}


/* =========================
GIFTS
========================= */

.gift-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.gift{
  padding:10px 5px;
  border-radius:12px;
  background:#211f2c;
  color:#fff;
}

.gift-icon{
  font-size:28px;
}

.gift-name{
  font-size:9px;
  margin-top:4px;
}

.gift-price{
  font-size:9px;
  color:#aaa4b6;
  margin-top:2px;
}


/* =========================
USER SHEET
========================= */

.user-big{
  display:flex;
  align-items:center;
  gap:12px;

  padding:12px;

  border-radius:14px;

  background:#201e2a;
}

.user-big img{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
}

.user-big-name{
  font-weight:900;
}

.user-big-id{
  margin-top:4px;
  color:#9691a4;
  font-size:10px;
}


/* =========================
ENTRY EFFECT
========================= */

.entry-effect{
  position:fixed;

  left:50%;
  top:38%;

  transform:translate(-50%,-50%) scale(.5);

  z-index:300;

  opacity:0;
  pointer-events:none;

  font-size:70px;

  transition:.2s;
}

.entry-effect.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1.2);
}


/* =========================
STATUS
========================= */

.status{
  position:fixed;

  top:70px;
  left:50%;

  transform:translateX(-50%);

  z-index:200;

  padding:8px 13px;

  border-radius:12px;

  background:#292635;

  border:1px solid #403b50;

  color:#fff;

  font-size:11px;

  opacity:0;

  pointer-events:none;

  transition:.2s;
}

.status.show{
  opacity:1;
}


/* =========================
SETTINGS
========================= */

.setting-btn{
  width:100%;

  padding:13px;

  margin-bottom:8px;

  border-radius:12px;

  background:#201e2a;

  color:#fff;

  text-align:left;

  border:1px solid #2e2b3a;
}

.setting-btn.danger{
  color:#ff8f8f;
}


/* =========================
SMALL SCREEN
========================= */

@media(max-width:370px){

  .avatar-wrap,
  .avatar,
  .empty-seat{
    width:55px;
    height:55px;
  }

  .seat-grid{
    gap:15px 3px;
  }

  .features{
    gap:4px;
  }

  .feature{
    font-size:8px;
  }

}
</style>
</head>

<script>

/* =========================================
   CONFIG
========================================= */

const SERVER =
  "https://pawanvoice-1.onrender.com";

const FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";


/* =========================================
   ROOM ID
========================================= */

const params =
  new URLSearchParams(
    location.search
  );

const ROOM_ID =
  params.get("room") ||
  "main";


/* =========================================
   USER
========================================= */

function getUser(){

  let frame = {};
  let badge = {};
  let entry = {};

  try{
    frame =
      JSON.parse(
        localStorage.getItem(
          "pv_avatarFrame"
        ) || "{}"
      );
  }catch(e){}

  try{
    badge =
      JSON.parse(
        localStorage.getItem(
          "pv_badge"
        ) || "{}"
      );
  }catch(e){}

  try{
    entry =
      JSON.parse(

async function getRTCConfig(){

  try{

    const response =
      await fetch(
        SERVER +

      response.ok
    ){

      return await response.json();

    }

/* =========================================
   CREATE PEER
========================================= */

async function createPeer(
  remoteSocketId,
  remoteUserId,
  shouldOffer
){

  if(
    !remoteSocketId ||
    remoteSocketId === socket.id
  ){

    return;

  }


  if(
    peers.has(
      remoteUserId
    )
  ){

    return peers.get(
      remoteUserId
    );

  }


  const rtcConfig =
    await getRTCConfig();


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peers.set(
    remoteUserId,
    {
      pc,
      socketId:
        remoteSocketId
    }
  );


  if(
    localStream
  ){

    localStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            localStream
          );

        }
      );

  }


  pc.onicecandidate =
    event => {

      if(
        event.candidate
      ){

        socket.emit(
          "webrtc-ice",
          {

            targetSocketId:
              remoteSocketId,

            candidate:
              event.candidate

          }
        );

      }

    };


  pc.ontrack =
    event => {

      if(
        event.streams &&
        event.streams[0]
      ){

        attachRemoteAudio(
          remoteUserId,
          event.streams[0]
        );

      }

    };


  pc.onconnectionstatechange =
    () => {

      const state =
        pc.connectionState;


      if(
        state ===
        "failed" ||
        state ===
        "closed" ||
        state ===
        "disconnected"
      ){

        closePeer(
          remoteUserId
        );

      }

    };


  if(
    shouldOffer
  ){

    try{

      const offer =
        await pc.createOffer();


      await pc.setLocalDescription(
        offer
      );


      socket.emit(
        "webrtc-offer",
        {

          targetSocketId:
            remoteSocketId,

          offer:
            pc.localDescription

        }
      );

    }catch(error){

      console.error(
        "Offer:",
        error
      );

    }

  }


  return pc;

}


/* =========================================
   ROOM USERS → SOCKET IDS
========================================= */

function setupPeersFromState(
  state
){

  /*
    Server room-state में userId मिलता है,
    लेकिन socketId नहीं मिलता.

    इसलिए user-entry से आने वाले नए users
    को signaling connection establish किया जाता है.
  */

}


/* =========================================
   USER ENTRY SOCKET
========================================= */

socket.on(
  "user-entry",
  async user => {

    if(
      !user ||
      !user.userId
    ){

      return;

    }

    /*
      Server के वर्तमान protocol में
      user-entry में socketId नहीं है।

      इसलिए actual WebRTC connection के लिए
      नीचे socket-id event की जरूरत है.
    */

  }
);


/* =========================================
   WEBRTC OFFER RECEIVE
========================================= */

socket.on(
  "webrtc-offer",
  async data => {

    try{

      const fromSocketId =
        data?.fromSocketId;


      const remoteUserId =
        data?.userId ||
        fromSocketId;


      if(
        !fromSocketId ||
        !data?.offer
      ){

        return;

      }


      const pc =
        await createPeer(
          fromSocketId,
          remoteUserId,
          false
        );


      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      socket.emit(
        "webrtc-answer",
        {

          targetSocketId:
            fromSocketId,

          answer:
            pc.localDescription

        }
      );

    }catch(error){

      console.error(
        "WebRTC offer:",
        error
      );

    }

  }
);


/* =========================================
   WEBRTC ANSWER
========================================= */

socket.on(
  "webrtc-answer",
  async data => {

    try{

      const fromSocketId =
        data?.fromSocketId;


      if(
        !fromSocketId ||
        !data?.answer
      ){

        return;

      }


      let peer = null;


      for(
        const item
        of peers.values()
      ){

        if(
          item.socketId ===
          fromSocketId
        ){

          peer =
            item;

          break;

        }

      }


      if(
        peer &&
        peer.pc
      ){

        await peer.pc.setRemoteDescription(
          new RTCSessionDescription(
            data.answer
          )
        );

      }

    }catch(error){

      console.error(
        "WebRTC answer:",
        error
      );

    }

  }
);


/* =========================================
   ICE
========================================= */

socket.on(
  "webrtc-ice",
  async data => {

    try{

      const fromSocketId =
        data?.fromSocketId;


      if(
        !fromSocketId ||
        !data?.candidate
      ){

        return;

      }


      let peer = null;


      for(
        const item
        of peers.values()
      ){

        if(
          item.socketId ===
          fromSocketId
        ){

          peer =
            item;

          break;

        }

      }


      if(
        peer &&
        peer.pc
      ){

        await peer.pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }

    }catch(error){

      console.error(
        "ICE:",
        error
      );

    }

  }
);

   REMOTE AUDIO
========================================= */

function attachRemoteAudio(
  userId,
  stream
){

  const container =
    document.getElementById(
      "remoteAudios"
    );


  let audio =
    document.getElementById(
      "audio-" +
      userId
    );


  if(
    !audio
  ){

    audio =
      document.createElement(
        "audio"
      );

    audio.id =
      "audio-" +
      userId;

    audio.autoplay =
      true;

    audio.playsInline =
      true;

    audio.controls =
      false;

    container.appendChild(
      audio
    );

  }


  audio.srcObject =
    stream;


  audio.muted =
    !speakerEnabled;


  audio.play()
    .catch(
      () => {

        showStatus(
          "Tap screen to enable speaker"
        );

      }
    );

}


/* =========================================
   CLOSE PEER
========================================= */

function closePeer(
  userId
){

  const item =
    peers.get(
      userId
    );


  if(
    item?.pc
  ){

    try{
      item.pc.close();
    }catch(e){}

  }


  peers.delete(
    userId
  );


  const audio =
    document.getElementById(
      "audio-" +
      userId
    );


  if(
    audio
  ){

    audio.srcObject =
      null;

    audio.remove();

  }

}

/* =========================================
   GIFTS
========================================= */

const giftPanel =
  document.getElementById(
    "giftPanel"
  );


document
  .getElementById(
    "giftBtn"
  )
  .addEventListener(
    "click",
    () => {

      closePanels();

      giftPanel.classList.add(
        "show"
      );

    }
  );


giftPanel
  .querySelectorAll(
    ".gift"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const gift =
            button.dataset.gift;


          const receiver =
            getFirstRoomUser();


          if(
            !receiver
          ){

            showStatus(
              "पहले room में कोई user होना चाहिए"
            );

            return;

          }


          socket.emit(
            "send-gift",
            {

              roomId:
                ROOM_ID,

              senderId:
                me.userId,

              receiverId:
                receiver.userId,

              gift,

              transactionId:
                "PV" +
                Date.now()

            }
          );


          showStatus(
            "🎁 " +
            gift +
            " sent"
          );


          closePanels();

        }
      );

    }
  );


function getFirstRoomUser(){

  if(
    !roomState ||
    !Array.isArray(
      roomState.seats
    )
  ){

    return null;

  }


  return (
    roomState.seats
      .find(
        user =>
          user &&
          user.userId !==
          me.userId
      )
    ||
    roomState.seats.find(
      Boolean
    )
    ||
    null
  );

}

function renderTopUsers(
  seats
){

  const users =
    seats
      .filter(
        Boolean
      )
      .sort(
        (
          a,
          b
        ) =>
          (
            Number(
              b.exp
            ) || 0
          )
          -
          (
            Number(
              a.exp
            ) || 0
          )
      )
      .slice(
        0,
        3
      );


  const container =
    document.getElementById(
      "expUsers"
    );


  if(
    users.length === 0
  ){

    container.innerHTML = `

      <div class="exp-user">
        <div style="font-size:25px;">🥇</div>
        <div class="exp-rank">Top 1</div>
      </div>

      <div class="exp-user">
        <div style="font-size:25px;">🥈</div>
        <div class="exp-rank">Top 2</div>
      </div>

      <div class="exp-user">
        <div style="font-size:25px;">🥉</div>
        <div class="exp-rank">Top 3</div>
      </div>

    `;

    return;

  }


  const medals =
    ["🥇","🥈","🥉"];


  container.innerHTML =
    users
      .map(
        (
          user,
          index
        ) => `

          <div class="exp-user">

            <img
              class="exp-avatar"
              src="${escapeAttr(
                user.dp ||
                "https://i.pravatar.cc/100?img=12"
              )}"
              alt="">

            <div class="exp-rank">
              ${medals[index]}
              ${escapeHtml(
                user.name ||
                "User"
              )}
            </div>

          </div>

        `
      )
      .join("");

}


/* =========================================
   ENTRY EFFECT
========================================= */

function showEntryEffect(
  user
){

  const el =
    document.getElementById(
      "entryEffect"
    );


  let effect =
    "✨";


  const vip =
    Number(
      user.vipLevel
    ) || 0;


  if(
    vip >= 9
  ){

    effect =
      "👑✨";

  }else if(
    vip >= 7
  ){

    effect =
      "🔥";

  }else if(
    vip >= 5
  ){

    effect =
      "💎";

  }else if(
    vip >= 3
  ){

    effect =
      "🌟";

  }else if(
    vip >= 1
  ){

    effect =
      "✨";

  }


  el.textContent =
    effect;


  el.classList.add(
    "show"
  );


  clearTimeout(
    showEntryEffect.timer
  );


  showEntryEffect.timer =
    setTimeout(
      () => {

        el.classList.remove(
          "show"
        );

      },
      1200
    );

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(
  value
){

  return escapeHtml(
    value
  );

}

========================================= */

function cleanup(){

  try{

    if(
      localStream
    ){

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    for(
      const item
      of peers.values()
    ){

      try{
        item.pc.close();
      }catch(e){}

    }


    peers.clear();

  }catch(error){

    console.log(
      error
    );

  }

}
