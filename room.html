<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>PawanVoice Room</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #0c0d12;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    .room {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background:
        radial-gradient(circle at top, #252039 0, #101119 35%, #0c0d12 70%);
      padding-bottom: 115px;
    }

    /* HEADER */

    .header {
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(16,17,25,.92);
      border-bottom: 1px solid #292b36;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .room-dp {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: cover;
      border: 2px solid #e3aa3c;
    }

    .room-info {
      min-width: 0;
      flex: 1;
    }

    .room-name {
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-id {
      color: #999;
      font-size: 11px;
      margin-top: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .small-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: #242631;
      color: white;
      font-size: 17px;
    }

    .user-count {
      background: #242631;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    /* ROOM TITLE */

    .room-title {
      text-align: center;
      padding: 10px 12px 4px;
    }

    .room-title strong {
      font-size: 13px;
    }

    .category {
      color: #aaa;
      font-size: 11px;
      margin-top: 4px;
    }

    /* SEATS */

    .seats-area {
      padding: 12px;
    }

    .host-row {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .user-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px 7px;
    }

    .seat {
      min-width: 0;
      text-align: center;
      cursor: pointer;
    }

    .avatar-wrap {
      position: relative;
      width: 68px;
      height: 68px;
      margin: auto;
    }

    .avatar {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #444754;
      background: #20232d;
    }

    .host-row .avatar-wrap,
    .host-row .avatar {
      width: 82px;
      height: 82px;
    }

    .occupied .avatar {
      border-color: #e4aa35;
    }

    .empty-seat .avatar {
      opacity: .55;
      border-style: dashed;
    }

    .seat-number {
      position: absolute;
      right: -3px;
      bottom: -2px;
      min-width: 21px;
      height: 21px;
      padding: 0 5px;
      border-radius: 50%;
      background: #30333e;
      border: 2px solid #101119;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .host-tag {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: -8px;
      background: #e4aa35;
      color: #241900;
      border-radius: 10px;
      padding: 3px 8px;
      font-size: 9px;
      font-weight: bold;
      white-space: nowrap;
      z-index: 2;
    }

    .mic-state {
      position: absolute;
      left: 1px;
      bottom: 1px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: #242631;
      border: 2px solid #101119;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .user-name {
      margin-top: 7px;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #eee;
    }

    .user-level {
      color: #aaa;
      font-size: 9px;
      margin-top: 2px;
    }

    /* FRAME */

    .frame-vip1 {
      box-shadow: 0 0 0 3px #d7b04b, 0 0 15px rgba(228,170,53,.45);
    }

    .frame-vip2 {
      box-shadow: 0 0 0 3px #70a7ff, 0 0 15px rgba(112,167,255,.4);
    }

    .frame-vip3 {
      box-shadow: 0 0 0 3px #bd79ff, 0 0 15px rgba(189,121,255,.45);
    }

    .frame-vip4 {
      box-shadow: 0 0 0 3px #ff719b, 0 0 15px rgba(255,113,155,.45);
    }

    .frame-vip5 {
      box-shadow: 0 0 0 3px #ff8c3a, 0 0 15px rgba(255,140,58,.5);
    }

    .frame-vip6 {
      box-shadow: 0 0 0 3px #54e0c1, 0 0 15px rgba(84,224,193,.45);
    }

    .frame-vip7 {
      box-shadow: 0 0 0 3px #ff5e5e, 0 0 15px rgba(255,94,94,.5);
    }

    .frame-vip8 {
      box-shadow: 0 0 0 3px #8f7cff, 0 0 18px rgba(143,124,255,.55);
    }

    .frame-vip9 {
      box-shadow: 0 0 0 4px #ffd75c, 0 0 20px rgba(255,215,92,.7);
    }

    .badge {
      display: inline-block;
      margin-top: 3px;
      font-size: 9px;
      color: #e4aa35;
    }

    .vip-label {
      display: inline-block;
      margin-left: 3px;
      color: #ffd75c;
      font-size: 9px;
      font-weight: bold;
    }

    /* FEATURES */

    .features {
      margin: 8px 12px;
      padding: 12px 8px;
      display: grid;
      grid-template-columns: repeat(5,1fr);
      gap: 7px;
      background: rgba(28,30,40,.9);
      border-radius: 18px;
      border: 1px solid #292c37;
    }

    .feature {
      text-align: center;
      font-size: 10px;
      color: #ddd;
    }

    .feature-icon {
      width: 42px;
      height: 42px;
      margin: auto;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #292c38;
      font-size: 20px;
      margin-bottom: 5px;
    }

    /* TOP EXP */

    .exp-box {
      margin: 12px;
      padding: 13px;
      border-radius: 17px;
      background: linear-gradient(135deg,#202330,#161821);
      border: 1px solid #303341;
    }

    .exp-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .exp-list {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
    }

    .exp-item {
      background: #292c38;
      border-radius: 12px;
      padding: 9px 5px;
      text-align: center;
      font-size: 11px;
    }

    .exp-item b {
      display: block;
      margin-top: 4px;
      font-size: 12px;
    }

    /* CHAT */

    .chat-area {
      margin: 12px;
      min-height: 90px;
      max-height: 190px;
      overflow-y: auto;
      padding: 5px;
    }

    .chat-message {
      margin: 7px 0;
      font-size: 12px;
      line-height: 1.4;
    }

    .chat-message .sender {
      color: #e4aa35;
      font-weight: bold;
    }

    .system-message {
      color: #999;
      font-size: 11px;
      margin: 6px 0;
    }

    /* BOTTOM CONTROLS */

    .bottom-panel {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background: rgba(17,18,25,.98);
      border-top: 1px solid #2c2e39;
      padding: 9px;
      z-index: 50;
    }

    .chat-row {
      display: flex;
      gap: 7px;
      margin-bottom: 8px;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      border: 1px solid #333641;
      background: #242631;
      color: white;
      border-radius: 22px;
      padding: 11px 14px;
      outline: none;
    }

    .control-row {
      display: grid;
      grid-template-columns: repeat(6,1fr);
      gap: 6px;
    }

    .control-btn {
      height: 43px;
      border: 0;
      border-radius: 12px;
      background: #242631;
      color: white;
      font-size: 17px;
    }

    .control-btn.active {
      background: #e4aa35;
      color: #241900;
    }

    /* EMOJI */

    .emoji-panel {
      display: none;
      padding: 10px;
      margin-bottom: 8px;
      background: #20222c;
      border-radius: 14px;
      grid-template-columns: repeat(8,1fr);
      gap: 6px;
    }

    .emoji-panel.show {
      display: grid;
    }

    .emoji-panel button {
      border: 0;
      background: transparent;
      font-size: 22px;
      padding: 5px;
    }

    /* MODAL */

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.show {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      background: #191b24;
      border-radius: 22px 22px 0 0;
      padding: 18px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .sheet-close {
      float: right;
      border: 0;
      background: #292c38;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .gift-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 9px;
    }

    .gift {
      border: 1px solid #333642;
      background: #222530;
      border-radius: 14px;
      padding: 10px 4px;
      text-align: center;
      color: white;
    }

    .gift-icon {
      font-size: 28px;
    }

    .gift-name {
      margin-top: 5px;
      font-size: 10px;
    }

    .gift-price {
      margin-top: 3px;
      color: #ffd15b;
      font-size: 10px;
    }

    .sheet-btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: #e4aa35;
      color: #241900;
      font-weight: bold;
    }

    /* ENTRY EFFECT */

    .entry-effect {
      position: fixed;
      left: 50%;
      top: 38%;
      transform: translate(-50%,-50%);
      z-index: 200;
      pointer-events: none;
      display: none;
      text-align: center;
    }

    .entry-effect.show {
      display: block;
      animation: entryAnimation 1.7s ease forwards;
    }

    .entry-effect-icon {
      font-size: 75px;
    }

    .entry-effect-text {
      margin-top: 8px;
      padding: 8px 16px;
      background: rgba(0,0,0,.7);
      border-radius: 20px;
      font-weight: bold;
    }

    @keyframes entryAnimation {
      0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.4);
      }
      25% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.15);
      }
      75% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(1.25);
      }
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 125px;
      transform: translateX(-50%);
      background: #252832;
      padding: 11px 17px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
      z-index: 300;
      white-space: nowrap;
    }

    .toast.show {
      display: block;
    }

    @media(max-width:390px) {
      .avatar-wrap,
      .avatar {
        width: 60px;
        height: 60px;
      }

      .host-row .avatar-wrap,
      .host-row .avatar {
        width: 72px;
        height: 72px;
      }

      .features {
        grid-template-columns: repeat(5,1fr);
      }

      .feature-icon {
        width: 36px;
        height: 36px;
        font-size: 17px;
      }

      .gift-grid {
        grid-template-columns: repeat(4,1fr);
      }
    }
  </style>
</head>

<script>

  /* =========================================
     PAWANVOICE ROOM
  ========================================= */

  const SERVER_URL =
    window.location.origin;

  const socket =
    typeof io === "function"
      ? io(SERVER_URL, {
          transports: ["websocket", "polling"]
        })
      : null;


  const params =
    new URLSearchParams(
      window.location.search
    );


  const roomId =
    params.get("room") || "main";


  let me = null;

  let roomState = {
    id: roomId,
    name: "PawanVoice Room",
    dp: "https://i.pravatar.cc/200?img=12",
    category: "General",
    seats: Array(9).fill(null),
    users: {},
    gifts: []
  };


  let selectedUser = null;

  let selectedReceiverId = "";

  let localStream = null;

  let micEnabled = true;

  let speakerEnabled = true;


  /* =========================================
     ELEMENTS
  ========================================= */

  const $ = id =>
    document.getElementById(id);


  /* =========================================
     TOAST
  ========================================= */

  function toast(message) {

    const el = $("toast");

    el.textContent =
      message;

    el.classList.add("show");

    clearTimeout(
      window.pvToastTimer
    );

    window.pvToastTimer =
      setTimeout(() => {

        el.classList.remove("show");

      }, 2200);

  }


  /* =========================================
     LOAD USER
  ========================================= */

  async function loadMe() {

    try {

      me =
        await pvLoadUser();

    } catch (error) {

      console.error(error);

      me =
        pvGetLocalUser();

    }

    if (!me) {

      me = {
        userId: "pawan",
        name: "Pawan User",
        dp: "https://i.pravatar.cc/200?img=12",
        level: 1,
        exp: 0,
        coins: 0,
        diamonds: 0,
        vipLevel: 0,

  /* =========================================

  ========================================= */

  function frameClass(user) {

    if (!user) {
      return "";
    }

    const frame =
      user.avatarFrame;

    if (!frame) {
      return "";
    }

    const id =
      String(frame.id || "default")
        .toLowerCase();

    if (id === "vip1") return "frame-vip1";
    if (id === "vip2") return "frame-vip2";
    if (id === "vip3") return "frame-vip3";
    if (id === "vip4") return "frame-vip4";
    if (id === "vip5") return "frame-vip5";
    if (id === "vip6") return "frame-vip6";
    if (id === "vip7") return "frame-vip7";
    if (id === "vip8") return "frame-vip8";
    if (id === "vip9") return "frame-vip9";

    return "";

  }

  /* =========================================
     RENDER SEATS
  ========================================= */

  function renderSeats() {

    const seats =
      Array.isArray(roomState.seats)
        ? roomState.seats
        : Array(9).fill(null);


    while (seats.length < 9) {
      seats.push(null);
    }


    let host =
      seats[0] || null;


    let hostHTML =
      userSeatHTML(
        host,
        1,
        true
      );


    $("hostSeat").innerHTML =
      hostHTML;


    let html = "";


    for (let i = 1; i < 9; i++) {

      html +=
        userSeatHTML(
          seats[i],
          i + 1,
          false
        );

    }


    $("userGrid").innerHTML =
      html;


    $("userCount").textContent =
      countOccupied(seats) +
      "/9";


    attachSeatEvents();

    updateTopExp();

  }


  function countOccupied(seats) {

    return seats.filter(Boolean).length;

  }


  /* =========================================
     ESCAPE
  ========================================= */

  function escapeHTML(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHTML(value);

  }


  /* =========================================
     SEAT EVENTS
  ========================================= */

  function attachSeatEvents() {

    document
      .querySelectorAll(".seat")
      .forEach(seat => {

        seat.addEventListener(
          "click",
          () => {

            const seatNumber =
              Number(
                seat.dataset.seat
              );


            const userId =
              seat.dataset.userId;


            if (!userId) {

              takeSeat(
                seatNumber
              );

              return;

            }


            const user =
              roomState.users &&
              roomState.users[userId];


            if (user) {

              openUserSheet(user);

            }

          }
        );

      });

  }

  async function sendGift(
    gift
  ) {

    if (!selectedReceiverId) {

      toast(
        "Receiver select करें"
      );

      return;

    }


    const price =
      Number(gift.price);


    const coins =
      Number(me.coins || 0);


    if (coins < price) {

      toast(
        "Coins कम हैं. Store से recharge करें."
      );

      return;

    }


    const transactionId =
      "gt_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8);


    const payload = {

      transactionId,

      senderId:
        me.userId,

      receiverId:
        selectedReceiverId,

      roomId,

      giftId:
        gift.id,

      giftName:
        gift.name,

      quantity: 1,

      coinAmount:
        price,

      createdAt:
        Date.now()

    };


    /*
      Firebase transaction.
      Production में इसे trusted backend
      से validate करना चाहिए.
    */

    try {

      const senderWalletUrl =
        "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/wallets/" +
        encodeURIComponent(me.userId) +
        ".json";


      const receiverWalletUrl =
        "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/wallets/" +
        encodeURIComponent(selectedReceiverId) +
        ".json";


      const senderResponse =
        await fetch(
          senderWalletUrl
        );


      const senderWallet =
        await senderResponse.json();


      const currentSenderCoins =
        Number(
          senderWallet?.coins ??
          me.coins ??
          0
        );


      if (
        currentSenderCoins <
        price
      ) {

        toast(
          "Coins कम हैं."
        );

        return;

      }


      const receiverResponse =
        await fetch(
          receiverWalletUrl
        );


      const receiverWallet =
        await receiverResponse.json();


      const receiverCoins =
        Number(
          receiverWallet?.coins ||
          0
        );


      await fetch(
        senderWalletUrl,
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            coins:
              currentSenderCoins -
              price,
            updatedAt:
              Date.now()
          })
        }
      );


      await fetch(
        receiverWalletUrl,
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            coins:
              receiverCoins +
              price,
            updatedAt:
              Date.now()
          })
        }
      );


      await fetch(
        "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/giftTransactions/" +
        transactionId +
        ".json",
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


      me.coins =
        currentSenderCoins -
        price;


      pvSaveLocalUser(
        me
      );


      if (socket) {

        socket.emit(
          "send-gift",
          {
            roomId,

            senderId:
              me.userId,

            receiverId:
              selectedReceiverId,

            gift:
              gift.name,

            transactionId
          }
        );

      }


      showGiftAnimation({
        name:
          me.name,

        gift:
          gift.icon +
          " " +
          gift.name,

        receiverId:
          selectedReceiverId
      });


      addSystemMessage(
        `${me.name} sent ${gift.name}`
      );


      $("coinBalance").textContent =
        "🪙 Coins: " +
        me.coins;


      $("giftOverlay")
        .classList.remove("show");


    } catch (error) {

      console.error(
        error
      );

      toast(
        "Gift send failed"
      );

    }

  }

          roomId,
          userId:
            me.userId,
          mic:
            micEnabled
        }
      );

    }

  }


  function updateMicButton() {

    const button =
      $("micBtn");


    button.textContent =
      micEnabled
        ? "🎙️"
        : "🔇";


    button.classList.toggle(
      "active",
      micEnabled
    );

  }


  $("micBtn")
    .addEventListener(
      "click",
      toggleMic
    );


  /* =========================================
     SPEAKER
  ========================================= */

  $("speakerBtn")
    .addEventListener(
      "click",
      () => {

        speakerEnabled =
          !speakerEnabled;


        $("speakerBtn")
          .textContent =
            speakerEnabled
              ? "🔊"
              : "🔇";


        $("speakerBtn")
          .classList.toggle(
            "active",
            speakerEnabled
          );


        document
          .querySelectorAll(
            "audio"
          )
          .forEach(
            audio => {

              audio.muted =
                !speakerEnabled;

            }
          );

      }
    );


  /* =========================================
     SEAT BUTTON
  ========================================= */

  $("seatBtn")
    .addEventListener(
      "click",
      () => {

        for (
          let i = 1;
          i < 9;
          i++
        ) {

          if (
            !roomState.seats[i]
          ) {

            takeSeat(
              i + 1
            );

            return;

          }

        }


        toast(
          "All seats are full"
        );

      }
    );


  /* =========================================
     PROFILE
  ========================================= */

  $("profileBtn")
    .addEventListener(
      "click",
      () => {

        window.location.href =
          "profile.html";

      }
    );


  /* =========================================
     SETTINGS
  ========================================= */

  $("settingsBtn")
    .addEventListener(
      "click",
      () => {

        $("settingsOverlay")
          .classList.add("show");

      }
    );


  $("settingsClose")
    .addEventListener(
      "click",
      () => {

        $("settingsOverlay")
          .classList.remove("show");

      }
    );


  $("copyRoomBtn")
    .addEventListener(
      "click",
      () => {

        const link =
          window.location.href;


        /*
          Clipboard API unavailable होने पर
          link को alert में दिखाया जाएगा.
        */

        if (
          navigator.clipboard
        ) {

          navigator.clipboard
            .writeText(link)
            .then(
              () => {

                toast(
                  "Room link copied"
                );

              }
            )
            .catch(
              () => {

                prompt(
                  "Room link:",
                  link
                );

              }
            );

        } else {

          prompt(
            "Room link:",
            link
          );

        }

      }
    );


  $("leaveRoomBtn")
    .addEventListener(
      "click",
      () => {

        if (socket) {

          socket.emit(
            "leave-room",
            {
              roomId,
              userId:
                me?.userId
            }
          );

        }


        window.location.href =
          "index.html";

      }
    );


  /* =========================================
     INVITE
  ========================================= */

  $("inviteBtn")
    .addEventListener(
      "click",
      () => {

        const link =
          window.location.href;


        if (
          navigator.share
        ) {

          navigator.share({
            title:
              "PawanVoice Room",
            text:
              "Join my PawanVoice room",
            url:
              link
          }).catch(
            () => {}
          );

        } else {

          prompt(
            "Room link:",
            link
          );

        }

      }
    );


  /* =========================================
     MORE
  ========================================= */

  $("moreBtn")
    .addEventListener(
      "click",
      () => {

        $("settingsOverlay")
          .classList.add("show");

      }
    );


  /* =========================================
     FEATURES
  ========================================= */

  $("supportBtn")
    .addEventListener(
      "click",
      () => {

        toast(
          "Room Support"
        );

      }
    );


  $("wheelBtn")
    .addEventListener(
      "click",
      () => {

        toast(
          "Lucky Wheel जल्द आएगा"
        );

      }
    );


  $("bountyBtn")
    .addEventListener(
      "click",
      () => {

        toast(
          "Bounty Hunter जल्द आएगा"
        );

      }
    );


  $("rewardBtn")
    .addEventListener(
      "click",
      () => {

        toast(
          "Room Reward जल्द आएगा"
        );

      }
    );


  $("exclusiveBtn")
    .addEventListener(
      "click",
      () => {

        toast(
          "Exclusive Benefits"
        );

      }
    );


  /* =========================================
     TOP EXP
  ========================================= */

  function updateTopExp() {

    const users =
      Object.values(
        roomState.users || {}
      );


    users.sort(
      (a,b) =>
        Number(b.exp || 0) -
        Number(a.exp || 0)
    );


    $("top1").textContent =
      users[0]
        ? users[0].name
        : "—";


    $("top2").textContent =
      users[1]
        ? users[1].name
        : "—";


    $("top3").textContent =
      users[2]
        ? users[2].name
        : "—";

  }


  /* =========================================
     LOCAL MICROPHONE
  ========================================= */

  async function setupMicrophone() {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      return;

    }


    try {

      localStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: false
          });


      localStream
        .getAudioTracks()
        .forEach(
          track => {

            track.enabled =
              micEnabled;

          }
        );


    } catch (error) {

      console.warn(
        "Microphone permission:",
        error
      );

      /*
        Browser permission deny होने पर
        room फिर भी खुलता रहेगा.
      */

    }

  }


  /* =========================================
     INITIAL
  ========================================= */

  async function init() {

    setRoomInfo(
      roomState
    );


    renderGifts();


    await loadMe();


    await loadCoins();


    setupMicrophone();


    if (
      socket &&
      socket.connected
    ) {

      joinRoom();

    }


    addSystemMessage(
      "Welcome to PawanVoice Room"
    );

  }


  init();

</script>
