<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>PawanVoice Room</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    linear-gradient(
      180deg,
      #25114d,
      #100b20 65%,
      #08070d
    );

  color: white;
  font-family: Arial,sans-serif;
}

.app {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

.header {
  padding: 15px;
  background: rgba(0,0,0,.25);
}

.top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.back {
  border: 0;
  background: transparent;
  color: white;
  font-size: 25px;
}

.roomDp {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  background: #555;
}

.roomInfo {
  flex: 1;
}

.roomName {
  font-weight: bold;
  font-size: 17px;
}

.roomNumber {
  font-size: 11px;
  opacity: .7;
  margin-top: 3px;
}

.online {
  font-size: 12px;
}

.headBtns {
  display: flex;
  gap: 6px;
}

.headBtn {
  border: 0;
  background: rgba(255,255,255,.12);
  color: white;
  border-radius: 12px;
  padding: 8px;
}

.roomArea {
  padding: 15px;
}

.seats {
  display: grid;
  grid-template-columns:
    repeat(4,1fr);

  gap: 15px 7px;
}

.seat.host {
  grid-column:
    1 / 5;
  justify-self:
    center;
}

.seat {
  text-align: center;
  min-width: 70px;
}

.avatarWrap {
  width: 63px;
  height: 63px;
  margin: auto;
  position: relative;
}

.avatar {
  width: 63px;
  height: 63px;
  border-radius: 50%;
  object-fit: cover;
  background: #2b2635;
  border: 3px solid #625c72;
}

.empty {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  color: #aaa;
}

.micDot {
  position: absolute;
  right: -2px;
  bottom: 1px;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.seatName {
  margin-top: 5px;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.seatNo {
  margin-top: 3px;
  color: #999;
  font-size: 10px;
}

.features {
  display: grid;
  grid-template-columns:
    repeat(5,1fr);

  gap: 6px;
  margin-top: 25px;
}

.feature {
  border: 0;
  background: rgba(255,255,255,.08);
  color: white;
  border-radius: 12px;
  padding: 10px 3px;
  font-size: 10px;
}

.featureIcon {
  display: block;
  font-size: 20px;
  margin-bottom: 5px;
}

.exp {
  margin-top: 18px;
  padding: 14px;
  background: rgba(255,255,255,.07);
  border-radius: 18px;
}

.expTitle {
  text-align: center;
  font-weight: bold;
}

.rocket {
  text-align: center;
  font-size: 32px;
  margin: 7px;
}

.rank {
  display: grid;
  grid-template-columns:
    repeat(3,1fr);
  gap: 7px;
}

.rankBox {
  background: rgba(255,255,255,.08);
  border-radius: 12px;
  padding: 9px;
  text-align: center;
  font-size: 12px;
}

.chat {
  margin-top: 15px;
  height: 180px;
  overflow-y: auto;
  padding: 10px;
  background: rgba(0,0,0,.15);
  border-radius: 15px;
}

.msg {
  margin-bottom: 8px;
  font-size: 13px;
}

.msgName {
  color: #d8aaff;
  font-weight: bold;
}

.bottom {
  position: sticky;
  bottom: 0;
  background: #100c19;
  padding: 10px;
}

.chatRow {
  display: flex;
  gap: 7px;
  align-items: center;
}

.messageInput {
  flex: 1;
  border: 0;
  outline: none;
  background: #25202e;
  color: white;
  border-radius: 22px;
  padding: 12px;
}

.action {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: #292331;
  color: white;
  font-size: 18px;
}

.micOn {
  background: #22a85a;
}

.leave {
  background: #d33b57;
}

.emojiPanel {
  display: none;
  grid-template-columns:
    repeat(8,1fr);
  gap: 5px;
  padding: 10px;
  background: #1e1828;
  border-radius: 14px;
  margin-bottom: 7px;
  max-height: 150px;
  overflow-y: auto;
}

.emojiPanel button {
  border: 0;
  background: transparent;
  font-size: 23px;
}

.status {
  text-align: center;
  font-size: 11px;
  color: #aaa;
  margin-top: 5px;
}

audio {
  display: none;
}

</style>

</head>

<body>

<div class="app">

  <div class="header">

    <div class="top">

      <button class="back"
              onclick="leaveRoom()">
        ←
      </button>

      <img id="roomDp"
           class="roomDp"
           src="https://i.pravatar.cc/150?img=12">

      <div class="roomInfo">

        <div id="roomName"
             class="roomName">
          PawanVoice Room
        </div>

        <div id="roomNumber"
             class="roomNumber">
          Room ID: 10001
        </div>

      </div>

      <div id="online"
           class="online">
        0/9
      </div>

      <div class="headBtns">

        <button class="headBtn"
                onclick="roomSetting()">
          ⚙️
        </button>

        <button class="headBtn"
                onclick="inviteRoom()">
          🔗
        </button>

      </div>

    </div>

  </div>

  <div class="roomArea">

    <div id="seats"
         class="seats">
    </div>

    <div class="features">

      <button class="feature"
              onclick="showMessage('Room Support')">
        <span class="featureIcon">🛟</span>
        Support
      </button>

      <button class="feature"
              onclick="showMessage('Lucky Wheel')">
        <span class="featureIcon">🎡</span>
        Lucky
      </button>

      <button class="feature"
              onclick="showMessage('Bounty Hunter')">
        <span class="featureIcon">🎯</span>
        Bounty
      </button>

      <button class="feature"
              onclick="showMessage('Room Reward')">
        <span class="featureIcon">🎁</span>
        Reward
      </button>

      <button class="feature"
              onclick="showMessage('Exclusive Benefits')">
        <span class="featureIcon">💎</span>
        Benefits
      </button>

    </div>

    <div class="exp">

      <div class="expTitle">
        Room EXP
      </div>

      <div class="rocket">
        🚀
      </div>

      <div class="rank">

        <div class="rankBox">
          🥇<br>
          Top 1<br>
          10000 EXP
        </div>

        <div class="rankBox">
          🥈<br>
          Top 2<br>
          8000 EXP
        </div>

        <div class="rankBox">
          🥉<br>
          Top 3<br>
          6000 EXP
        </div>

      </div>

    </div>

    <div id="chat"
         class="chat">
    </div>

    <div id="status"
         class="status">
      Connecting...
    </div>

  </div>

  <div class="bottom">

    <div id="emojiPanel"
         class="emojiPanel">

      <button onclick="addEmoji('😡')">😡</button>
      <button onclick="addEmoji('😭')">😭</button>
      <button onclick="addEmoji('😵')">😵</button>
      <button onclick="addEmoji('🔨')">🔨</button>
      <button onclick="addEmoji('😊')">😊</button>
      <button onclick="addEmoji('😘')">😘</button>
      <button onclick="addEmoji('😂')">😂</button>
      <button onclick="addEmoji('😴')">😴</button>

      <button onclick="addEmoji('😧')">😧</button>
      <button onclick="addEmoji('😁')">😁</button>
      <button onclick="addEmoji('👻')">👻</button>
      <button onclick="addEmoji('😀')">😀</button>
      <button onclick="addEmoji('🥵')">🥵</button>
      <button onclick="addEmoji('🤗')">🤗</button>
      <button onclick="addEmoji('❤️')">❤️</button>
      <button onclick="addEmoji('🤑')">🤑</button>

      <button onclick="addEmoji('🥳')">🥳</button>
      <button onclick="addEmoji('🥺')">🥺</button>
      <button onclick="addEmoji('😡')">😡</button>
      <button onclick="addEmoji('❓')">❓</button>
      <button onclick="addEmoji('🙄')">🙄</button>
      <button onclick="addEmoji('🤣')">🤣</button>
      <button onclick="addEmoji('😎')">😎</button>
      <button onclick="addEmoji('🤔')">🤔</button>

    </div>

    <div class="chatRow">

      <input id="messageInput"
             class="messageInput"
             placeholder="Say something..."
             maxlength="300">

      <button class="action"
              onclick="toggleEmoji()">
        😊
      </button>

      <button id="speakerBtn"
              class="action"
              onclick="toggleSpeaker()">
        🔊
      </button>

      <button id="micBtn"
              class="action"
              onclick="toggleMic()">
        🎙️
      </button>

      <button class="action"
              onclick="showMessage('Inbox')">
        💌
      </button>

      <button class="action"
              onclick="showMore()">
        ⋯
      </button>

    </div>

    <button class="action leave"
            style="width:100%;margin-top:8px;border-radius:15px"
            onclick="leaveRoom()">
      Leave Room
    </button>

  </div>

</div>

<script>

const socket = io();

const params =
  new URLSearchParams(
    window.location.search
  );

const roomId =
  params.get("room") ||
  "10001";

const nickname =
  params.get("name") ||
  localStorage.getItem("pv_name") ||
  "Pawan";

const dp =
  params.get("dp") ||
  localStorage.getItem("pv_dp") ||
  "https://i.pravatar.cc/150?img=12";

const title =
  params.get("title") ||
  "PawanVoice Room";

let localStream = null;
let micOn = false;
let speakerOn = true;

const peers = new Map();

document.getElementById("roomName")
  .textContent = title;

document.getElementById("roomNumber")
  .textContent =
    "Room ID: " + roomId;

document.getElementById("roomDp")
  .src = dp;

function setStatus(text) {
  document.getElementById("status")
    .textContent = text;
}

socket.on("connect", async () => {

  setStatus("Connected");

  socket.emit("joinRoom", {
    roomId,
    nickname,
    dp
  });

  await startMicrophone();
});

socket.on("connect_error", () => {
  setStatus("Server connection failed");
});

socket.on("roomState", state => {
  renderSeats(state);

  const count =
    Object.keys(state.users || {}).length;

  document.getElementById("online")
    .textContent =
      count + "/9";
});

socket.on("existingUsers", async users => {

  for (const user of users) {

    try {
      await createOffer(
        user.userId
      );
    } catch (err) {
      console.error(err);
    }

  }

});

socket.on("webrtc-offer",
  async data => {

    try {

      const pc =
        createPeer(data.from);

      if (!pc) return;

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      socket.emit("webrtc-answer", {
        to: data.from,
        answer
      });

    } catch (err) {

      console.error(
        "Offer error:",
        err
      );

    }

  }
);

socket.on("webrtc-answer",
  async data => {

    try {

      const pc =
        peers.get(data.from);

      if (!pc) return;

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

    } catch (err) {

      console.error(
        "Answer error:",
        err
      );

    }

  }
);

socket.on("webrtc-ice",
  async data => {

    try {

      const pc =
        peers.get(data.from);

      if (!pc) return;

      if (data.candidate) {

        await pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }

    } catch (err) {

      console.error(
        "ICE error:",
        err
      );

    }

  }
);

socket.on("peerLeft",
  data => {

    const pc =
      peers.get(data.userId);

    if (pc) {

      pc.close();
      peers.delete(
        data.userId
      );

    }

    const audio =
      document.getElementById(
        "audio-" + data.userId
      );

    if (audio) {
      audio.remove();
    }

  }
);

socket.on("message",
  data => {

    addChatMessage(
      data.nickname,
      data.message
    );

  }
);

function renderSeats(state) {

  const container =
    document.getElementById("seats");

  container.innerHTML = "";

  for (let i = 1; i <= 9; i++) {

    const seat =
      state.seats.find(
        s => s.seatNo === i
      );

    const user =
      seat &&
      seat.userId
        ? state.users[seat.userId]
        : null;

    const div =
      document.createElement("div");

    div.className =
      "seat" +
      (i === 1 ? " host" : "");

    if (user) {

      const micIcon =
        user.mic
          ? "🎙️"
          : "🔇";

      const safeDp =
        user.dp ||
        "https://i.pravatar.cc/150?img=12";

      div.innerHTML = `
        <div class="avatarWrap">

          <img
            class="avatar"
            src="${escapeHtml(safeDp)}"
          >

          <div class="micDot">
            ${micIcon}
          </div>

        </div>

        <div class="seatName">
          ${escapeHtml(user.nickname)}
        </div>

        <div class="seatNo">
          Seat ${i}
        </div>
      `;

      div.onclick = () => {

        if (
          user.userId === socket.id
        ) {
          if (i !== 1) {
            socket.emit(
              "leaveSeat"
            );
          }
        } else {
          showMessage(
            user.nickname
          );
        }

      };

    } else {

      div.innerHTML = `

        <div class="avatarWrap">

          <div class="avatar empty">
            +
          </div>

        </div>

        <div class="seatName">
          Empty
        </div>

        <div class="seatNo">
          Seat ${i}
        </div>
      `;

      div.onclick = () => {

        socket.emit(
          "takeSeat",
          {
            seatNo: i
          }
        );

      };

    }

    container.appendChild(div);
  }
}

async function startMicrophone() {

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    setStatus(
      "Microphone not supported"
    );

    return;
  }

  try {

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true,
          video: false
        });

    localStream
      .getAudioTracks()
      .forEach(track => {
        track.enabled = false;
      });

    setStatus(
      "Room connected"
    );

  } catch (err) {

    console.error(err);

    setStatus(
      "Microphone permission required"
    );

  }
}

function createPeer(remoteId) {

  if (peers.has(remoteId)) {
    return peers.get(remoteId);
  }

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        },
        {
          urls:
            "stun:stun1.l.google.com:19302"
        }
      ]
    });

  peers.set(
    remoteId,
    pc
  );

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }

  pc.onicecandidate = event => {

    if (event.candidate) {

      socket.emit(
        "webrtc-ice",
        {
          to: remoteId,
          candidate:
            event.candidate
        }
      );

    }

  };

  pc.ontrack = event => {

    let audio =
      document.getElementById(
        "audio-" + remoteId
      );

    if (!audio) {

      audio =
        document.createElement(
          "audio"
        );

      audio.id =
        "audio-" + remoteId;

      audio.autoplay = true;
      audio.playsInline = true;

      document.body.appendChild(
        audio
      );

    }

    audio.srcObject =
      event.streams[0];

    audio.muted =
      !speakerOn;

  };

  pc.onconnectionstatechange =
    () => {

      if (
        pc.connectionState ===
        "failed"
      ) {

        pc.restartIce();

      }

      if (
        pc.connectionState ===
        "closed"
      ) {

        peers.delete(
          remoteId
        );

      }

    };

  return pc;
}

async function createOffer(remoteId) {

  const pc =
    createPeer(remoteId);

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  socket.emit(
    "webrtc-offer",
    {
      to: remoteId,
      offer
    }
  );
}

function toggleMic() {

  if (!localStream) {

    showMessage(
      "Microphone permission नहीं मिली"
    );

    return;
  }

  micOn =
    !micOn;

  localStream
    .getAudioTracks()
    .forEach(track => {
      track.enabled = micOn;
    });

  document.getElementById(
    "micBtn"
  ).classList.toggle(
    "micOn",
    micOn
  );

  document.getElementById(
    "micBtn"
  ).textContent =
    micOn
      ? "🎙️"
      : "🔇";

  socket.emit(
    "micStatus",
    {
      status: micOn
    }
  );

}

function toggleSpeaker() {

  speakerOn =
    !speakerOn;

  document.querySelectorAll(
    "audio"
  ).forEach(audio => {
    audio.muted =
      !speakerOn;
  });

  document.getElementById(
    "speakerBtn"
  ).textContent =
    speakerOn
      ? "🔊"
      : "🔇";

}

function toggleEmoji() {

  const panel =
    document.getElementById(
      "emojiPanel"
    );

  panel.style.display =
    panel.style.display ===
    "grid"
      ? "none"
      : "grid";

}

function addEmoji(emoji) {

  const input =
    document.getElementById(
      "messageInput"
    );

  input.value += emoji;
  input.focus();

}

document.getElementById(
  "messageInput"
).addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();
      sendMessage();

    }

  }
);

function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    input.value.trim();

  if (!message) {
    return;
  }

  socket.emit(
    "message",
    {
      message
    }
  );

  input.value = "";

}

function addChatMessage(
  name,
  message
) {

  const chat =
    document.getElementById(
      "chat"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "msg";

  div.innerHTML =
    `<span class="msgName">
      ${escapeHtml(name)}:
    </span>
    ${escapeHtml(message)}`;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}

function inviteRoom() {

  const link =
    window.location.href;

  if (
    navigator.share
  ) {

    navigator.share({
      title:
        "PawanVoice Room",
      text:
        "Join my PawanVoice room",
      url: link
    }).catch(() => {});

  } else {

    showMessage(
      "Room link: " + link
    );

  }

}

function roomSetting() {

  showMessage(
    "Room Setting opened"
  );

}

function showMore() {

  showMessage(
    "More options"
  );

}

function showMessage(text) {

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    text;

  setTimeout(() => {

    status.textContent =
      "Room connected";

  }, 2000);

}

function leaveRoom() {

  socket.emit(
    "leaveRoom"
  );

  peers.forEach(
    pc => pc.close()
  );

  peers.clear();

  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }

  window.location.href =
    "/";

}

function escapeHtml(value) {

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

window.addEventListener(
  "beforeunload",
  () => {

    socket.emit(
      "leaveRoom"
    );

  }
);

</script>

</body>
</html>
