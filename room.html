<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#09090d;
 color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;
 padding-bottom:75px
}

button,input{font:inherit}

button{
 border:0;
 cursor:pointer
}

.header{
 height:64px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 12px;
 background:#111118;
 border-bottom:1px solid #292936;
 position:sticky;
 top:0;
 z-index:10
}

.back{
 width:42px;
 height:42px;
 border-radius:50%;
 background:#24242e;
 color:#fff;
 font-size:20px
}

.room-title{
 flex:1;
 min-width:0
}

.room-title b{
 display:block;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.room-title small{
 color:#999
}

.header-btn{
 width:40px;
 height:40px;
 border-radius:50%;
 background:#24242e;
 color:#fff
}

.room-info{
 text-align:center;
 padding:15px 10px 7px
}

.room-info h2{
 margin:0 0 5px;
 font-size:19px
}

.room-info small{
 color:#999
}

.seats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px 8px;
 padding:15px 10px
}

.seat.owner{
 grid-column:1/-1;
 justify-self:center
}

.seat{
 min-width:0;
 text-align:center;
 position:relative
}

.avatar{
 width:58px;
 height:58px;
 margin:auto;
 border-radius:50%;
 background:linear-gradient(135deg,#7337d8,#df4da7);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:26px;
 border:2px solid #4b4b58;
 position:relative
}

.owner .avatar{
 width:72px;
 height:72px;
 border-color:#e8b64a
}

.mic-dot{
 position:absolute;
 right:-3px;
 bottom:-2px;
 width:20px;
 height:20px;
 border-radius:50%;
 background:#333;
 border:2px solid #09090d;
 font-size:11px;
 display:flex;
 align-items:center;
 justify-content:center
}

.mic-dot.on{
 background:#22b66f
}

.seat-name{
 font-size:11px;
 margin-top:5px;
 color:#eee;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.seat-role{
 font-size:9px;
 color:#aaa;
 margin-top:2px
}

.features{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 padding:10px
}

.feature{
 background:#171720;
 border:1px solid #292936;
 border-radius:13px;
 padding:11px 4px;
 color:#fff;
 text-align:center
}

.feature span{
 display:block;
 font-size:23px;
 margin-bottom:4px
}

.feature small{
 font-size:10px;
 color:#ccc
}

.chat{
 margin:10px;
 background:#121219;
 border:1px solid #252530;
 border-radius:14px;
 padding:10px
}

.chat-list{
 height:170px;
 overflow:auto;
 padding:4px
}

.msg{
 margin:7px 0;
 font-size:13px
}

.msg b{
 color:#a86cff
}

.msg span{
 color:#ddd
}

.chatbar{
 display:flex;
 gap:6px;
 margin-top:8px
}

.chatbar input{
 flex:1;
 min-width:0;
 background:#20202a;
 color:#fff;
 border:1px solid #373743;
 border-radius:20px;
 padding:10px 13px
}

.chatbar button{
 width:42px;
 height:42px;
 border-radius:50%;
 background:#7135d4;
 color:#fff
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:67px;
 background:#111119;
 border-top:1px solid #292936;
 display:flex;
 align-items:center;
 justify-content:space-around;
 z-index:20
}

.bottom button{
 background:none;
 color:#fff;
 font-size:20px
}

.bottom small{
 display:block;
 font-size:9px;
 color:#aaa
}

.sheet-bg{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 z-index:50;
 align-items:flex-end
}

.sheet-bg.show{
 display:flex
}

.sheet{
 width:100%;
 max-height:85%;
 overflow:auto;
 background:#17171f;
 border-radius:22px 22px 0 0;
 padding:18px
}

.close{
 float:right;
 width:35px;
 height:35px;
 border-radius:50%;
 background:#292936;
 color:#fff
}

.option{
 display:block;
 width:100%;
 padding:13px;
 margin:6px 0;
 border-radius:11px;
 background:#21212b;
 color:#fff;
 text-align:left
}

.red{
 background:#a52d43
}

.green{
 background:#168b53
}

.status{
 text-align:center;
 color:#aaa;
 font-size:11px;
 padding:5px
}
</style>
</head>

 <div class="sheet">

  <button class="close" onclick="closeSheet()">✕</button>

  <h2 id="sheetTitle">PawanVoice</h2>

  <div id="sheetBody"></div>

 </div>

</div>

<script>

const firebaseConfig={
 apiKey:"AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"148446327241",
 appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

const roomId=
 new URLSearchParams(location.search).get("roomId");

let uid=null;
let room=null;
let myMic=true;
let speaker=true;
let selectedUser=null;

const peers={};
const localCandidates={};

const rtcConfig={
 iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"}
 ]
};

firebase.auth().signInAnonymously()
.then(result=>{

 uid=result.user.uid;

 if(!roomId){
  alert("Room ID नहीं मिला");
  location.href="index.html";
  return;
 }

 startRoom();

})
.catch(error=>{
 console.error(error);
 document.getElementById("connectionStatus").textContent=
 "Firebase login failed";
});

function startRoom(){

 const roomRef=db.ref("rooms/"+roomId);

 roomRef.on("value",snap=>{

  room=snap.val();

  if(!room){
   alert("Room नहीं मिला");
   location.href="index.html";
   return;
  }

  document.getElementById("roomName").textContent=
   room.name||"PawanVoice Room";

  document.getElementById("roomIdText").textContent=
   "ID: "+roomId;

  document.getElementById("hostName").textContent=
   room.hostName||"Host";

  document.getElementById("roomLevel").textContent=
   room.level||1;

  renderSeats(room.members||{});

  document.getElementById("connectionStatus").textContent=
   "🟢 Room connected";
 });

 joinRoom();

 loadChat();

 setupWebRTC();

}

function joinRoom(){

 const memberRef=
  db.ref("rooms/"+roomId+"/members/"+uid);

 memberRef.set({

  uid:uid,
  name:"Guest",
  role:"member",
  mic:true,
  joinedAt:firebase.database.ServerValue.TIMESTAMP

 }).then(()=>{

  memberRef.onDisconnect().remove();

 });

}

function renderSeats(members){

 const list=Object.values(members);

 document.getElementById("memberCount").textContent=
  list.length;

 let html="";

 const owner=
  list.find(x=>x.role==="owner")||list[0];

 if(owner){

  html+=seatHTML(owner,true);

 }

 const others=
  list.filter(x=>!owner || x.uid!==owner.uid)
      .slice(0,8);

 for(let i=0;i<8;i++){

  if(others[i]){
   html+=seatHTML(others[i],false);
  }else{

   html+=`
    <div class="seat">
      <div class="avatar">＋</div>
      <div class="seat-name">Empty</div>
      <div class="seat-role">Seat ${i+2}</div>
    </div>
   `;

  }

 }

 document.getElementById("seats").innerHTML=html;

}

function seatHTML(user,isOwner){

 const mic=user.mic!==false;

 return `
 <button class="seat ${isOwner?"owner":""}"
   onclick="userActions('${escapeAttr(user.uid)}')">

   <div class="avatar">

    ${isOwner?"👑":"👤"}

    <div class="mic-dot ${mic?"on":""}">
      ${mic?"🎤":"🔇"}
    </div>

   </div>

   <div class="seat-name">
    ${escapeHtml(user.name||"Guest")}
   </div>

   <div class="seat-role">
    ${isOwner?"OWNER":escapeHtml(user.role||"MEMBER")}
   </div>

 </button>
 `;
}

function toggleMic(){

 myMic=!myMic;

 db.ref(
  "rooms/"+roomId+"/members/"+uid+"/mic"
 ).set(myMic);

 document.getElementById("micText").textContent=
  myMic?"Mic ON":"Mic OFF";

 if(myMic){
  startMicrophone();
 }else{
  stopMicrophone();
 }

}

function toggleSpeaker(){

 speaker=!speaker;

 document.getElementById("speakerText").textContent=
  speaker?"Speaker ON":"Speaker OFF";

 document.querySelectorAll("audio").forEach(a=>{
  a.muted=!speaker;
 });

}

let localStream=null;

async function startMicrophone(){

 try{

  if(localStream)return;

  localStream=
   await navigator.mediaDevices.getUserMedia({
    audio:true,
    video:false
   });

  Object.values(peers).forEach(pc=>{
   localStream.getTracks().forEach(track=>{
    pc.addTrack(track,localStream);
   });
  });

 }catch(e){

  console.error(e);

  alert(
   "Microphone permission दें। HTTPS/GitHub Pages पर app खोलें।"
  );

  myMic=false;

 }

}

function stopMicrophone(){

 if(!localStream)return;

 localStream.getTracks().forEach(track=>{
  track.stop();
 });

 localStream=null;
}

async function setupWebRTC(){

 if(!uid)return;

 await startMicrophone();

 db.ref("rooms/"+roomId+"/members").on("child_added",snap=>{

  const other=snap.val();

  if(!other || other.uid===uid)return;

  connectPeer(other.uid);

 });

 db.ref("rooms/"+roomId+"/members").on("child_removed",snap=>{

  const id=snap.key;

  if(peers[id]){
   peers[id].close();
   delete peers[id];
  }

 });

}

async function connectPeer(otherUid){

 if(otherUid===uid)return;

 if(peers[otherUid])return;

 const pc=new RTCPeerConnection(rtcConfig);

 peers[otherUid]=pc;

 if(localStream){

  localStream.getTracks().forEach(track=>{
   pc.addTrack(track,localStream);
  });

 }

 pc.onicecandidate=event=>{

  if(!event.candidate)return;

  db.ref(
   "rooms/"+roomId+
   "/signals/"+otherUid+
   "/candidates/"+uid
  ).push(event.candidate.toJSON());

 };

 pc.ontrack=event=>{

  let audio=document.getElementById(
   "audio_"+otherUid
  );

  if(!audio){

   audio=document.createElement("audio");

   audio.id="audio_"+otherUid;
   audio.autoplay=true;
   audio.playsInline=true;
   audio.muted=!speaker;

   document.body.appendChild(audio);

  }

  audio.srcObject=event.streams[0];

 };

 if(uid < otherUid){

  const offer=await pc.createOffer();

  await pc.setLocalDescription(offer);

  await db.ref(
   "rooms/"+roomId+
   "/signals/"+otherUid+
   "/offer/"+uid
  ).set({
   type:offer.type,
   sdp:offer.sdp
  });

 }else{

  db.ref(
   "rooms/"+roomId+
   "/signals/"+uid+
   "/offer/"+otherUid
  ).on("value",async snap=>{

   const offer=snap.val();

   if(!offer)return;

   if(pc.currentRemoteDescription)return;

   await pc.setRemoteDescription(offer);

   const answer=await pc.createAnswer();

   await pc.setLocalDescription(answer);

   await db.ref(
    "rooms/"+roomId+
    "/signals/"+otherUid+
    "/answer/"+uid
   ).set({
    type:answer.type,
    sdp:answer.sdp
   });

  });

 }

 db.ref(
  "rooms/"+roomId+
  "/signals/"+uid+
  "/answer/"+otherUid
 ).on("value",async snap=>{

  const answer=snap.val();

  if(!answer)return;

  if(pc.currentRemoteDescription)return;

  await pc.setRemoteDescription(answer);

 });

 db.ref(
  "rooms/"+roomId+
  "/signals/"+uid+
  "/candidates/"+otherUid
 ).on("child_added",async snap=>{

  try{
   await pc.addIceCandidate(
    new RTCIceCandidate(snap.val())
   );
  }catch(e){
   console.error(e);
  }

 });

}

function sendMessage(){

 const input=document.getElementById("chatInput");
 const text=input.value.trim();

 if(!text)return;

 db.ref("rooms/"+roomId+"/chat").push({

  uid:uid,
  name:"Guest",
  text:text,
  createdAt:firebase.database.ServerValue.TIMESTAMP

 }).then(()=>{
  input.value="";
 });

}

document.getElementById("chatForm")
.addEventListener("submit",e=>{
 e.preventDefault();
 sendMessage();
});

function loadChat(){

 db.ref("rooms/"+roomId+"/chat")
 .limitToLast(80)
 .on("value",snap=>{

  const data=snap.val()||{};

  const messages=Object.values(data)
   .sort((a,b)=>
    (a.createdAt||0)-(b.createdAt||0)
   );

  const box=document.getElementById("chatList");

  box.innerHTML=messages.map(m=>`
   <div class="msg">
    <b>${escapeHtml(m.name||"Guest")}</b>:
    <span>${escapeHtml(m.text||"")}</span>
   </div>
  `).join("")||'<div class="status">No messages</div>';

  box.scrollTop=box.scrollHeight;

 });

}

function userActions(id){

 selectedUser=id;

 db.ref(
  "rooms/"+roomId+"/members/"+id
 ).once("value").then(snap=>{

  const u=snap.val();

  if(!u)return;

  openSheet(
   "👤 "+(u.name||"User"),
   `
   <button class="option">👤 View Profile</button>
   <button class="option">💬 Message</button>
   <button class="option">🎁 Send Gift</button>
   <button class="option">🤝 Follow</button>
   ${u.uid!==uid?`
   <button class="option red"
    onclick="reportUser('${escapeAttr(u.uid)}')">
    🚩 Report
   </button>`:""}
   `
  );

 });

}

function roomSupport(){
 openSheet(
  "❤️ Room Support",
  `
  <button class="option">❤️ Send Support</button>
  <button class="option">🏆 Support Ranking</button>
  `
 );
}

function luckyWheel(){
 openSheet(
  "🎡 Lucky Wheel",
  `
  <div class="status">
   Lucky Wheel system
  </div>
  <button class="option"
   onclick="alert('Lucky Wheel backend से जोड़ना बाकी है')">

  </button>
  `

}

  "🎯 Bounty Hunter",
  `
  <button class="option">🎯 Current Bounty</button>
  <button class="option">🏆 Bounty Ranking</button>

 );
}

function giftPanel(){

  "🎁 Gifts",
  `
  <button class="option">🌹 Rose</button>
  <button class="option">❤️ Heart</button>

function sendEmoji(e){

  <button class="option red"

 );

}

  "⚙️ Room Settings",
  `
  <button class="option">🔒 Lock Room</button>

  <button class="option">🎙️ Mic Permission</button>
  <button class="option">👥 Seat Management</button>
  <button class="option">📢 Announcement</button>
  `
 );

}

function inviteRoom(){

 const url=location.href;

 if(navigator.share){

  navigator.share({
   title:document.getElementById("roomName").textContent,
   text:"Join my PawanVoice room",
   url:url
  });

 }else{

  alert("Room Link:\n"+url);

 }

}

function reportUser(id){

 db.ref("reports/users").push({
  reporter:uid,
  target:id,
  roomId:roomId,
  createdAt:firebase.database.ServerValue.TIMESTAMP
 }).then(()=>{
  alert("Report भेज दिया गया");
  closeSheet();
 });

}

function reportRoom(){

 db.ref("reports/rooms").push({
  reporter:uid,
  roomId:roomId,
  createdAt:firebase.database.ServerValue.TIMESTAMP
 }).then(()=>{
  alert("Room report भेज दिया गया");
  closeSheet();
 });

}

function leaveRoom(){

 db.ref(
  "rooms/"+roomId+"/members/"+uid
 ).remove()
 .finally(()=>{

  Object.values(peers).forEach(pc=>pc.close());

  stopMicrophone();

  location.href="index.html";

 });

}

function openSheet(title,body){

 document.getElementById("sheetTitle").textContent=title;
 document.getElementById("sheetBody").innerHTML=body;
 document.getElementById("sheetBg").classList.add("show");

}

function closeSheet(){
 document.getElementById("sheetBg").classList.remove("show");
}

function closeSheetOutside(e){

 if(e.target.id==="sheetBg"){
  closeSheet();
 }

}

function escapeHtml(s){

 return String(s)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function escapeAttr(s){
 return escapeHtml(s);
}

</script>

 </html>
