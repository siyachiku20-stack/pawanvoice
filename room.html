<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#080711;
color:#fff;
font-family:Arial,sans-serif;
}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
background:
radial-gradient(
circle at top,
#351454,
#0d0915 42%,
#080711
);

}

.header{
height:68px;
display:flex;
align-items:center;
gap:9px;

}

.back,
.headBtn{
width:38px;
height:38px;
border:0;
border-radius:12px;
background:#1d1829;
color:#fff;
font-size:20px;
}

.roomDp{
width:45px;
height:45px;

object-fit:cover;

}

.roomInfo{

}

.roomName{
font-size:15px;

white-space:nowrap;

}

.roomId{

}

.headerRight{

gap:6px;

.online{
margin:0 12px 10px;
height:38px;

align-items:center;

.onlineCount{

}

.seats{

}

.hostRow{
display:flex;
justify-content:center;
}

.seatRow{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin-top:14px;
}

.seat{

}

.avatarWrap{

height:67px;

.avatar{

height:67px;

<script>

/* =========================
   USER DATA
========================= */

const socket =
  io();

const params =
  new URLSearchParams(
    location.search
  );

const roomId =
  params.get("room") ||
  "10001";

const userId =
  params.get("userid") ||
  localStorage.getItem(
    "pv_userId"
  ) ||
  "guest_" + Date.now();

const userName =
  params.get("name") ||
  localStorage.getItem(
    "pv_name"
  ) ||
  "Guest";

const userDp =
  params.get("dp") ||
  localStorage.getItem(
    "pv_dp"
  ) ||
  "https://i.pravatar.cc/150?img=12";


let users = [];

let hostSocketId =
  null;

let localStream =
  null;

let micEnabled =
  false;

let speakerEnabled =
  true;

let peers =
  new Map();

let pendingCandidates =
  new Map();

let rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    }

  ]

};


/* =========================
   ROOM HEADER
========================= */

document.getElementById(
  "roomId"
).innerText =
  "Room #" + roomId;

document.getElementById(
  "roomDp"
).src =
  userDp;


/* =========================
   GET RTC CONFIG
========================= */

async function loadRtcConfig(){

  try{

    const response =
      await fetch(
        "/rtc-config"
      );

    const data =
      await response.json();


    if(
      data &&
      Array.isArray(
        data.iceServers
      )
    ){

      rtcConfig = {

        iceServers:
          data.iceServers

      };

    }

  }catch(error){

    console.log(
      "Using STUN fallback"
    );

  }

}


loadRtcConfig();


/* =========================
   FIREBASE ROOM SAVE
========================= */

const FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";


async function saveRoomToFirebase(){

  const roomData = {

    roomId:
      roomId,

    name:
      document.getElementById(
        "roomName"
      ).innerText,

    roomDp:
      document.getElementById(
        "roomDp"
      ).src,

    category:
      "General",

    hostUserId:
      userId,

    online:
      true,

    updatedAt:
      Date.now()

  };


  try{

    await fetch(
      FIREBASE_DB +
      "/rooms/" +
      encodeURIComponent(
        roomId
      ) +
      ".json",
      {

        method:
          "PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            roomData
          )

      }
    );

  }catch(error){

    console.log(
      "Firebase room save error:",
      error
    );

  }

}


/* =========================
   MODAL
========================= */

function openModal(id){

  const el =
    document.getElementById(
      id
    );

  if(el){

    el.classList.add(
      "open"
    );

  }

}


function closeModal(id){

  const el =
    document.getElementById(
      id
    );

  if(el){

    el.classList.remove(
      "open"
    );

  }

}


/* =========================
   CONNECT
========================= */

socket.on(
  "connect",
  () => {

    showToast(
      "Connected"
    );


    socket.emit(
      "join-room",
      {

        roomId:
          roomId,

        userId:
          userId,

        name:
          userName,

        dp:
          userDp,

        roomName:
          "PawanVoice Room",

        roomDp:
          userDp,

        category:
          "General"

      }
    );


    saveRoomToFirebase();

  }
);


/* =========================
   JOINED
========================= */

socket.on(
  "joined-room",
  data => {

    hostSocketId =
      data.hostSocketId ||
      null;


    if(
      data.iceServers
    ){

      rtcConfig = {

        iceServers:
          data.iceServers

/* =========================
   RENDER
========================= */

function renderRoom(){

  document.getElementById(
    "onlineCount"
  ).innerText =
    users.length +

  for(
    let seat = 1;
    seat <= 9;
    seat++
  ){

        "seat" + seat

      document.getElementById(
        "avatar" + seat
      );

    const name =
      document.getElementById(
        "name" + seat
      );

      document.getElementById(
        "mic" + seat
      );

        u =>

      );

      "occupied"
    );

      box.classList.add(
        "occupied"
      );

        user.dp ||
        "https://i.pravatar.cc/150?img=12";

        user.userId ||

      );

        : "none";

      );

/* =========================
   SEAT
========================= */

function seatClick(seat){

  const me =
    users.find(
      u =>
        u.socketId ===
        socket.id
    );


  if(!me){

    showToast(
      "Connecting..."
    );

    return;

  }


  const occupied =
    users.find(
      u =>
        Number(u.seat) ===
        Number(seat)
    );


  if(
    occupied &&
    occupied.socketId !==
    socket.id
  ){

    showToast(
      occupied.name +
      " is already on this seat"
    );

    return;

  }


  if(
    Number(me.seat) ===
    Number(seat)
  ){

    stopMic();

    socket.emit(
      "leave-seat"
    );

    return;

  }


  socket.emit(
    "take-seat",
    Number(seat)
  );

}


/* =========================
   MIC
========================= */

async function toggleMic(){

  const me =
    users.find(
      u =>
        u.socketId ===
        socket.id
    );


  if(
    !me ||
    !me.seat
  ){

    showToast(
      "First take a seat"
    );

    return;

  }


  if(micEnabled){

    stopMic();

  }else{

    await startMic();

  }

}


async function startMic(){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      showToast(
        "Microphone is not available"
      );

      return;

    }


    localStream =
      await navigator
      .mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:
            true,

          noiseSuppression:
            true,

          autoGainControl:
            true
        },

        video:false

      });


    micEnabled =
      true;


    document.getElementById(
      "micBtn"
    ).classList.add(
      "active"
    );


    socket.emit(
      "mic-status",
      true
    );


    showToast(
      "Mic ON"
    );


    for(
      const [
        remoteId,
        pc
      ] of peers
    ){

      const track =
        localStream
        .getAudioTracks()[0];


      const sender =
        pc.getSenders()
        .find(
          s =>
            s.track &&
            s.track.kind ===
            "audio"
        );


      if(sender){

        await sender.replaceTrack(
          track
        );

      }else{

        pc.addTrack(
          track,
          localStream
        );


        await makeOffer(
          remoteId,
          pc
        );

      }

    }

  }catch(error){

    console.error(
      error
    );

    showToast(
      "Microphone permission denied"
    );

  }

}


function stopMic(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream =
      null;

  }


  micEnabled =
    false;


  document.getElementById(
    "micBtn"
  ).classList.remove(
    "active"
  );


  socket.emit(
    "mic-status",
    false
  );


  for(
    const [
      remoteId,
      pc
    ] of peers
  ){

    const sender =
      pc.getSenders()
      .find(
        s =>
          s.track &&
          s.track.kind ===
          "audio"
      );


    if(sender){

      sender.replaceTrack(
        null
      );

    }

  }

}


/* =========================

/* =========================
   WEBRTC PEER
========================= */

function isSeated(socketId){

  const user =
    users.find(
      u =>
        u.socketId ===
        socketId
    );


  return !!(
    user &&
    user.seat
  );

}


function shouldOffer(remoteId){

  return (
    socket.id <
    remoteId
  );

}


async function createPeer(
  remoteId
){

  if(
    remoteId ===
    socket.id
  ){

    return null;

  }


  if(
    peers.has(
      remoteId
    )
  ){

    return peers.get(
      remoteId
    );

  }


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peers.set(
    remoteId,
    pc
  );


  pc.onicecandidate =
    event => {

      if(
        event.candidate
      ){

        socket.emit(
          "webrtc-ice",
          {

            target:
              remoteId,

            candidate:
              event.candidate

          }
        );

      }

    };


  pc.ontrack =
    event => {

      const stream =
        event.streams &&
        event.streams[0];


      if(stream){

        attachRemoteAudio(
          remoteId,
          stream
        );

      }

    };


  pc.onconnectionstatechange =
    () => {

      const state =
        pc.connectionState;


      if(
        state ===
        "failed" ||
        state ===
        "closed"
      ){

        removePeer(
          remoteId
        );

      }

    };


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            localStream
          );

        }
      );

  }


  return pc;

}


/* =========================
   OFFER
========================= */

async function makeOffer(
  remoteId,
  pc
){

  try{

    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    socket.emit(
      "webrtc-offer",
      {

        target:
          remoteId,

        offer:
          pc.localDescription

      }
    );

  }catch(error){

    console.error(
      "Offer error:",
      error
    );

  }

}


/* =========================
   CONNECT
========================= */

async function connectToPeer(
  remoteId
){

  if(
    !isSeated(remoteId)
  ){

    return;

  }


  const pc =
    await createPeer(
      remoteId
    );


  if(!pc) return;


  if(
    shouldOffer(
      remoteId
    )
  ){

    await makeOffer(
      remoteId,
      pc
    );

  }

}


/* =========================
   REFRESH CONNECTIONS
========================= */

async function refreshVoiceConnections(){

  const seated =
    users.filter(
      u =>
        u.seat &&
        u.socketId !==
        socket.id
    );


  const ids =
    new Set(
      seated.map(
        u =>
          u.socketId
      )
    );


  for(
    const [
      remoteId
    ] of peers
  ){

    if(
      !ids.has(
        remoteId
      )
    ){

      removePeer(
        remoteId
      );

    }

  }


  for(
    const user of seated
  ){

    await connectToPeer(
      user.socketId
    );

  }

}


/* =========================
   OFFER RECEIVE
========================= */

socket.on(
  "webrtc-offer",
  async data => {

    try{

      if(
        !data ||
        !data.from ||
        !data.offer
      ){

        return;

      }


      if(
        !isSeated(
          data.from
        )
      ){

        return;

      }


      const pc =
        await createPeer(
          data.from
        );


      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );


      await flushCandidates(
        data.from,
        pc
      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      socket.emit(
        "webrtc-answer",
        {

          target:
            data.from,

          answer:
            pc.localDescription

        }
      );

    }catch(error){

      console.error(
        "Offer receive error:",
        error
      );

    }

  }
);


/* =========================
   ANSWER RECEIVE
========================= */

socket.on(
  "webrtc-answer",
  async data => {

    try{

      const pc =
        peers.get(
          data.from
        );


      if(!pc){

        return;

      }


      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );


      await flushCandidates(
        data.from,
        pc
      );

    }catch(error){

      console.error(
        "Answer error:",
        error
      );

    }

  }
);


/* =========================
   ICE RECEIVE
========================= */

socket.on(
  "webrtc-ice",
  async data => {

    try{

      if(
        !data ||
        !data.from ||
        !data.candidate
      ){

        return;

      }


      const pc =
        peers.get(
          data.from
        );


      if(
        pc &&
        pc.remoteDescription
      ){

        await pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }else{

        if(
          !pendingCandidates.has(
            data.from
          )
        ){

          pendingCandidates.set(
            data.from,
            []
          );

        }


        pendingCandidates
          .get(data.from)
          .push(
            data.candidate
          );

      }

    }catch(error){

      console.error(
        "ICE error:",
        error
      );

    }

  }
);


/* =========================
   FLUSH ICE
========================= */

async function flushCandidates(
  remoteId,
  pc
){

  const list =
    pendingCandidates.get(
      remoteId
    );


  if(!list) return;


  for(
    const candidate of list
  ){

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    }catch(error){

      console.error(
        error
      );

    }

  }


  pendingCandidates.delete(
    remoteId
  );

}


/* =========================
   REMOTE AUDIO
========================= */

function attachRemoteAudio(
  remoteId,
  stream
){

  let audio =
    document.getElementById(
      "audio-" +
      remoteId
    );


  if(!audio){

    audio =
      document.createElement(
        "audio"
      );

    audio.id =
      "audio-" +
      remoteId;

    audio.className =
      "remoteAudio";

    audio.autoplay =
      true;

    audio.playsInline =
      true;

    document.body.appendChild(
      audio
    );

  }


  audio.srcObject =
    stream;

  audio.muted =
    !speakerEnabled;


  audio.play()
    .catch(
      () => {

        showToast(
          "Tap screen once to enable audio"
        );

      }
    );

}


/* =========================
   REMOVE PEER
========================= */

function removePeer(
  remoteId
){

  const pc =
    peers.get(
      remoteId
    );


  if(pc){

    try{

      pc.close();

    }catch(e){}

  }


  peers.delete(
    remoteId
  );


  pendingCandidates.delete(
    remoteId
  );


  const audio =
    document.getElementById(
      "audio-" +
      remoteId
    );


  if(audio){

    audio.remove();

  }

}

  if(!message){

  socket.emit(

    message
  );


  input.value =
    "";

}

========================= */

    );

========================= */
