<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#100d1b;
  color:#fff;
  overflow-x:hidden;
}
button,input,textarea,select{
  font:inherit;
}
button{
  border:0;
  color:#fff;
  cursor:pointer;
}
.top{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px;
  background:#181329;
  border-bottom:1px solid #342c4d;
}
.roomHead{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}
.roomDp{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#30284a;
  border:2px solid #8f70ff;
}
.roomTitle{
  min-width:0;
}
.roomTitle b{
  display:block;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.roomTitle small{
  display:block;
  color:#b9b1ce;
  margin-top:3px;
  font-size:11px;
}
.headBtns{
  display:flex;
  gap:5px;
}
.iconBtn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#29213e;
  font-size:18px;
}
.iconBtn:active,.bottomBtn:active,.actionBtn:active{
  transform:scale(.94);
}

.roomBody{
  min-height:calc(100vh - 160px);
  padding:12px 9px 125px;
  background:
    radial-gradient(circle at 50% 20%,#30204f 0,#100d1b 48%);
}
.roomInfo{
  text-align:center;
  margin-bottom:10px;
}
.roomInfo h2{
  margin:4px 0;
  font-size:19px;
}
.roomInfo p{
  margin:2px;
  color:#aaa0bd;
  font-size:11px;
}

.seats{
  max-width:520px;
  margin:auto;
}
.ownerRow{
  display:flex;
  justify-content:center;
  margin:12px 0 20px;
}
.seatRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:20px;
}
.seat{
  min-width:0;
  text-align:center;
  position:relative;
}
.seatCircle{
  width:66px;
  height:66px;
  margin:auto;
  position:relative;
  border-radius:50%;
  padding:3px;
  background:#29233c;
  border:2px dashed #63567e;
}
.seatCircle img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}
.emptyCircle{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#837a96;
  font-size:27px;
}
.owner .seatCircle{
  width:82px;
  height:82px;
  border:3px solid #f0bd58;
  box-shadow:0 0 18px #b9792e88;
}
.seatName{
  margin-top:6px;
  font-size:11px;
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.seatId{
  color:#9e96ae;
  font-size:9px;
  margin-top:2px;
}
.seatMeta{
  font-size:9px;
  color:#c7bdd7;
  margin-top:2px;
}
.vip{
  position:absolute;
  right:-5px;
  top:-4px;
  background:#d49a25;
  border-radius:8px;
  padding:2px 4px;
  font-size:8px;
  font-weight:bold;
}
.micDot{
  position:absolute;
  left:-2px;
  bottom:2px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#241d35;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
}
.speaking .seatCircle{
  box-shadow:0 0 0 3px #39df7d,0 0 22px #39df7d99;
}
.frameGold{
  border-color:#e7b84d!important;
  box-shadow:0 0 18px #e7b84d77;
}
.frameRed{
  border-color:#ed5269!important;
  box-shadow:0 0 18px #ed526977;
}
.frameBlue{
  border-color:#4e9dff!important;
  box-shadow:0 0 18px #4e9dff77;
}
.framePurple{
  border-color:#a875ff!important;
  box-shadow:0 0 18px #a875ff77;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:60;
  background:#171226;
  border-top:1px solid #362d4e;
  padding:7px 7px calc(7px + env(safe-area-inset-bottom));
}
.chatLine{
  display:flex;
  gap:6px;
  margin-bottom:7px;
}
.chatInput{
  flex:1;
  min-width:0;
  border:1px solid #403655;
  background:#241d34;
  color:white;
  border-radius:18px;
  padding:10px 13px;
  outline:none;
}
.sendBtn{
  width:45px;
  border-radius:17px;
  background:#7653df;
}
.bottomBtns{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.bottomBtn{
  background:#241d34;
  border-radius:13px;
  padding:7px 2px;
  font-size:18px;
}
.bottomBtn small{
  display:block;
  font-size:8px;
  color:#b9b1ca;
  margin-top:2px;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#0009;
  align-items:flex-end;
}
.sheet{
  width:100%;
  max-height:88vh;
  overflow:auto;
  background:#19142a;
  border-radius:22px 22px 0 0;
  padding:15px;
  border-top:1px solid #4b4063;
}
.sheetHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.sheetHead h3{
  margin:0;
}
.close{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#302744;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}
.actionBtn{
  background:#28213a;
  border-radius:15px;
  padding:12px 5px;
  min-height:70px;
}
.actionBtn .ico{
  font-size:24px;
  display:block;
}
.actionBtn small{
  color:#c8c0d4;
  font-size:9px;
  display:block;
  margin-top:5px;
}
.card{
  background:#251e36;
  border:1px solid #3b3150;
  border-radius:15px;
  padding:12px;
  margin-bottom:9px;
}
.card b{
  display:block;
  margin-bottom:5px;
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.fullBtn{
  width:100%;
  padding:12px;
  border-radius:13px;
  background:#7350dc;
  margin-top:8px;
}
.danger{
  background:#9f3148;
}
input,textarea,select{
  width:100%;
  background:#241d35;
  color:white;
  border:1px solid #45395c;
  border-radius:12px;
  padding:11px;
  outline:none;
}
textarea{
  min-height:90px;
  resize:none;
}
.chatMsg{
  padding:8px 10px;
  border-radius:11px;
  background:#27203a;
  margin:6px 0;
  font-size:12px;
}
.chatMsg b{
  color:#c29cff;
}
.userCard{
  text-align:center;
}
.userBigDp{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #8060e8;
}
.coin{
  color:#ffd35a;
}
.status{
  text-align:center;
  font-size:11px;
  color:#aaa1b8;
  padding:5px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:125px;
  transform:translateX(-50%);
  z-index:300;
  background:#302844;
  padding:10px 15px;
  border-radius:20px;
  display:none;
  font-size:12px;
}
@media(max-width:360px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .seatCircle{width:57px;height:57px}
}
</style>
</head>

<body>

<header class="top">
  <div class="roomHead">
    <img id="roomDpImg" class="roomDp" src="" onclick="openRoomDp()">
    <div class="roomTitle">
      <b id="headerRoomName">PawanVoice Room</b>
      <small id="headerRoomInfo">Room No: ------</small>
      <small id="headerOwner">Owner: ------</small>
    </div>
  </div>

  <div class="headBtns">
    <button class="iconBtn" onclick="openSettings()">⚙️</button>
    <button class="iconBtn" onclick="openOnline()">👥</button>
    <button class="iconBtn" onclick="shareRoom()">↗️</button>
    <button class="iconBtn" onclick="copyRoomId()">📋</button>
    <button class="iconBtn" onclick="openInfo()">ⓘ</button>
    <button class="iconBtn" onclick="leaveRoom()">✕</button>
  </div>
</header>

<main class="roomBody">

  <div class="roomInfo">
    <h2 id="roomName">PawanVoice Room</h2>
    <p id="roomNumberText">Room Number: ------</p>
    <p id="firebaseRoomText">Room ID: ------</p>
    <div class="status" id="connectionStatus">Connecting...</div>
  </div>

  <section class="seats">

    <div class="ownerRow">
      <div class="seat owner" id="seat-owner">
        <div class="seatCircle emptyCircle">👑</div>
        <div class="seatName">Owner</div>
        <div class="seatId">Waiting...</div>
      </div>
    </div>

    <div class="seatRow" id="seatRow1"></div>
    <div class="seatRow" id="seatRow2"></div>

  </section>

  <div class="card">
    <b>💬 Room Chat</b>
    <div id="chatMessages">
      <div class="chatMsg">PawanVoice room me welcome! 👋</div>
    </div>
  </div>

</main>

<div class="bottom">
  <div class="chatLine">
    <input id="chatInput" class="chatInput" placeholder="Room me message likho...">
    <button class="sendBtn" onclick="sendChat()">➤</button>
  </div>

  <div class="bottomBtns">
    <button class="bottomBtn" onclick="openEmoji()">😊<small>Emoji</small></button>
    <button class="bottomBtn" onclick="toggleSpeaker()">🔊<small>Speaker</small></button>
    <button class="bottomBtn" onclick="toggleMic()">🎙️<small id="micText">Mic ON</small></button>
    <button class="bottomBtn" onclick="openInbox()">📥<small>Inbox</small></button>
    <button class="bottomBtn" onclick="openGifts()">🎁<small>Gift</small></button>
    <button class="bottomBtn" onclick="openMore()">☰<small>More</small></button>
    <button class="bottomBtn" onclick="openStats()">📊<small>Stats</small></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- COMMON SHEET -->
<div class="overlay" id="sheetOverlay" onclick="closeSheet(event)">
  <div class="sheet" id="sheet">
    <div class="sheetHead">
      <h3 id="sheetTitle">PawanVoice</h3>
      <button class="close" onclick="closeAll()">✕</button>
    </div>
    <div id="sheetContent"></div>
  </div>
</div>

<script>
/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
  authDomain: "pawanvoice-68c5e.firebaseapp.com",
  databaseURL: "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
  projectId: "pawanvoice-68c5e",
  storageBucket: "pawanvoice-68c5e.firebasestorage.app",
  messagingSenderId: "148446327241",
  appId: "1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* =========================
   BASIC DATA
========================= */

const params = new URLSearchParams(location.search);

let roomId = params.get("room");

if(!roomId){
  roomId = localStorage.getItem("pawanCurrentRoom");
}

if(!roomId){
  roomId = "room_" + Date.now();
}

localStorage.setItem("pawanCurrentRoom",roomId);

let myId = localStorage.getItem("pawanNumericUserId");
let myName = localStorage.getItem("pawanName") || "Pawan";
let myDp = localStorage.getItem("pawanDP") || "";
let myFrame = localStorage.getItem("pawanFrame") || "default";
let myVip = Number(localStorage.getItem("pawanVip") || 0);
let myLevel = Number(localStorage.getItem("pawanLevel") || 1);
let myCpLevel = Number(localStorage.getItem("pawanCPLevel") || 1);

let roomNumber = "";
let roomName = "PawanVoice Room";
let roomOwnerId = "";
let roomOwnerName = "";
let roomDp = "";

let micOn = true;
let speakerOn = true;
let minimized = false;

let peer = null;
let localStream = null;
let calls = {};

const defaultDp =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">' +
'<rect width="200" height="200" fill="#33264f"/>' +
'<circle cx="100" cy="78" r="38" fill="#bca9d8"/>' +
'<path d="M35 190c10-48 40-70 65-70s55 22 65 70" fill="#8b72b8"/>' +
'</svg>'
);

/* =========================
   UTILITIES
========================= */

function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.style.display="block";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>{
    t.style.display="none";
  },2200);
}

function openSheet(title,html){
  document.getElementById("sheetTitle").textContent=title;
  document.getElementById("sheetContent").innerHTML=html;
  document.getElementById("sheetOverlay").style.display="flex";
}

function closeAll(){
  document.getElementById("sheetOverlay").style.display="none";
}

function closeSheet(e){
  if(e.target.id==="sheetOverlay") closeAll();
}

/* =========================
   NUMERIC USER ID
========================= */

function randomSix(){
  return String(Math.floor(100000 + Math.random()*900000));
}

async function createNumericUserId(){
  let saved=localStorage.getItem("pawanNumericUserId");

  if(saved && /^\d{6}$/.test(saved)){
    return saved;
  }

  for(let i=0;i<15;i++){
    const candidate=randomSix();
    const ref=db.ref("users/"+candidate);

    try{
      const result=await ref.transaction(current=>{
        if(current !== null) return;
        return {
          id:candidate,
          createdAt:firebase.database.ServerValue.TIMESTAMP
        };
      });

      if(result.committed){
        localStorage.setItem("pawanNumericUserId",candidate);
        return candidate;
      }
    }catch(err){}
  }

  return randomSix();
}

/* =========================
   NUMERIC ROOM NUMBER
========================= */

function randomRoomNumber(){
  return String(Math.floor(100000 + Math.random()*900000));
}

async function createOrGetRoomNumber(){
  const ref=db.ref("rooms/"+roomId+"/roomNumber");

  const snap=await ref.once("value");

  if(snap.exists() && /^\d{6}$/.test(String(snap.val()))){
    return String(snap.val());
  }

  const generated=randomRoomNumber();

  await ref.transaction(current=>{
    if(current) return current;
    return generated;
  });

  const finalSnap=await ref.once("value");
  return String(finalSnap.val() || generated);
}

/* =========================
   ROOM INITIALIZE
========================= */

async function initializeRoom(){

  myId=await createNumericUserId();

  const roomRef=db.ref("rooms/"+roomId);

  const roomSnap=await roomRef.once("value");

  if(!roomSnap.exists()){
    roomOwnerId=myId;
    roomOwnerName=myName;

    await roomRef.set({
      roomNumber:await createOrGetRoomNumber(),
      roomName:"PawanVoice Room",
      ownerId:myId,
      ownerName:myName,
      createdAt:firebase.database.ServerValue.TIMESTAMP,
      live:true,
      settings:{
        description:"Welcome to PawanVoice",
        category:"Voice Chat",
        language:"Hindi",
        public:true,
        maxUsers:9
      }
    });
  }

  const snap=await roomRef.once("value");
  const data=snap.val() || {};

  roomNumber=String(data.roomNumber || await createOrGetRoomNumber());
  roomName=data.roomName || "PawanVoice Room";
  roomOwnerId=String(data.ownerId || myId);
  roomOwnerName=data.ownerName || myName;
  roomDp=(data.settings && data.settings.dp) || "";

  document.getElementById("roomName").textContent=roomName;
  document.getElementById("headerRoomName").textContent=roomName;

  document.getElementById("roomNumberText").textContent=
    "Room Number: "+roomNumber;

  document.getElementById("firebaseRoomText").textContent=
    "Room ID: "+roomId;

  document.getElementById("headerRoomInfo").textContent=
    "Room No: "+roomNumber;

  document.getElementById("headerOwner").textContent=
    "Owner: "+roomOwnerName+" • ID "+roomOwnerId;

  document.getElementById("roomDpImg").src=roomDp || defaultDp;

  await saveMyGlobalUser();
  await joinRoomDatabase();

  listenRoom();
  listenUsers();
  listenChat();

  setupPeer();

  document.getElementById("connectionStatus").textContent=
    "🟢 Room connected";
}

/* =========================
   GLOBAL USER
========================= */

async function saveMyGlobalUser(){

  const ref=db.ref("users/"+myId);

  await ref.update({
    id:myId,
    name:myName,
    dp:myDp || "",
    frame:myFrame,
    vip:myVip,
    level:myLevel,
    cpLevel:myCpLevel,
    updatedAt:firebase.database.ServerValue.TIMESTAMP
  });

  localStorage.setItem("pawanName",myName);
}

/* =========================
   JOIN DATABASE
========================= */

async function joinRoomDatabase(){

  const ref=db.ref(
    "rooms/"+roomId+"/users/"+myId
  );

  const userData={
    id:myId,
    name:myName,
    dp:myDp || "",
    frame:myFrame,
    vip:myVip,
    level:myLevel,
    cpLevel:myCpLevel,
    peerId:"",
    mic:micOn,
    joinedAt:firebase.database.ServerValue.TIMESTAMP
  };

  await ref.set(userData);

  ref.onDisconnect().remove();
}

/* =========================
   ROOM LISTEN
========================= */

function listenRoom(){

  db.ref("rooms/"+roomId).on("value",snap=>{

    const data=snap.val() || {};

    roomName=data.roomName || "PawanVoice Room";
    roomOwnerId=String(data.ownerId || "");
    roomOwnerName=data.ownerName || "";
    roomNumber=String(data.roomNumber || roomNumber);

    if(data.settings && data.settings.dp){
      roomDp=data.settings.dp;
      document.getElementById("roomDpImg").src=roomDp;
    }

    document.getElementById("roomName").textContent=roomName;
    document.getElementById("headerRoomName").textContent=roomName;
    document.getElementById("roomNumberText").textContent=
      "Room Number: "+roomNumber;
    document.getElementById("roomNumberText").textContent=
      "Room Number: "+roomNumber;
    document.getElementById("headerRoomInfo").textContent=
      "Room No: "+roomNumber;
    document.getElementById("headerOwner").textContent=
      "Owner: "+roomOwnerName+" • ID "+roomOwnerId;
  });
}

/* =========================
   USERS
========================= */

function listenUsers(){

  db.ref("rooms/"+roomId+"/users").on("value",snap=>{

    const data=snap.val() || {};
    const users=Object.values(data);

    renderSeats(users);
  });
}

function frameClass(frame){
  if(frame==="gold") return "frameGold";
  if(frame==="red") return "frameRed";
  if(frame==="blue") return "frameBlue";
  if(frame==="purple") return "framePurple";
  return "";
}

function renderSeats(users){

  const owner=
    users.find(u=>String(u.id)===String(roomOwnerId)) ||
    users.find(u=>String(u.id)===String(myId) && String(myId)===String(roomOwnerId));

  const ownerEl=document.getElementById("seat-owner");

  if(owner){
    const dp=owner.dp || defaultDp;

    ownerEl.innerHTML=`
      <div class="seatCircle ${frameClass(owner.frame)} ${
        owner.mic ? "speaking" : ""
      }"
      onclick="openUserPanel('${esc(owner.id)}')">

        <img src="${dp}" onerror="this.src='${defaultDp}'">

        ${Number(owner.vip)>0 ?
          `<span class="vip">VIP ${esc(owner.vip)}</span>`:""}

        <span class="micDot">${owner.mic?"🎙️":"🔇"}</span>
      </div>

      <div class="seatName">
        👑 ${esc(owner.name || "Owner")}
      </div>

      <div class="seatId">
        ID ${esc(owner.id)}
      </div>

      <div class="seatMeta">
        LV ${esc(owner.level || 1)} • CP ${esc(owner.cpLevel || 1)}
      </div>
    `;
  }else{
    ownerEl.innerHTML=`
      <div class="seatCircle emptyCircle">👑</div>
      <div class="seatName">Owner</div>
      <div class="seatId">Waiting...</div>
    `;
  }

  const others=users
    .filter(u=>String(u.id)!==String(roomOwnerId))
    .slice(0,8);

  const row1=document.getElementById("seatRow1");
  const row2=document.getElementById("seatRow2");

  row1.innerHTML="";
  row2.innerHTML="";

  for(let i=0;i<8;i++){

    const user=others[i];

    const div=document.createElement("div");
    div.className="seat";

    if(user){

      const dp=user.dp || defaultDp;

      div.innerHTML=`
        <div class="seatCircle ${frameClass(user.frame)}"
             onclick="openUserPanel('${esc(user.id)}')">

          <img src="${dp}" onerror="this.src='${defaultDp}'">

          ${Number(user.vip)>0 ?
            `<span class="vip">VIP ${esc(user.vip)}</span>`:""}

          <span class="micDot">
            ${user.mic ? "🎙️":"🔇"}
          </span>
        </div>

        <div class="seatName">
          ${esc(user.name || "Guest")}
          ${String(user.id)===String(myId) ? " (You)":""}
        </div>

        <div class="seatId">
          ID ${esc(user.id)}
        </div>

        <div class="seatMeta">
          LV ${esc(user.level || 1)} • CP ${esc(user.cpLevel || 1)}
        </div>
      `;

    }else{

      div.innerHTML=`

      <img
        src="${roomDp || defaultDp}"
        style="width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #8060e8"
      >

      ${
        isOwner
        ? `
          <input type="file"
                 accept="image/*"
                 onchange="changeRoomDp(this)">

          <button class="fullBtn danger"
                  onclick="removeRoomDp()">
            Remove Room DP
          </button>
        `
        : `
          <p>Sirf Owner Room DP change kar sakta hai.</p>
        `
      }

    </div>
  `);
}

function changeRoomDp(input){

  if(!input.files || !input.files[0]) return;

  const file=input.files[0];
  const reader=new FileReader();

  reader.onload=function(){

    const img=new Image();

    img.onload=function(){

      const canvas=document.createElement("canvas");
      const max=500;

      let w=img.width;
      let h=img.height;

      if(w>h){
        if(w>max){
          h*=max/w;
          w=max;
        }
      }else{
        if(h>max){
          w*=max/h;
          h=max;
        }
      }

      canvas.width=w;
      canvas.height=h;

      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);

      const data=canvas.toDataURL("image/jpeg",.72);

      db.ref("rooms/"+roomId+"/settings/dp").set(data)
      .then(()=>{
        roomDp=data;
        document.getElementById("roomDpImg").src=data;
        showToast("Room DP changed");
        closeAll();
      });

    };

    img.src=reader.result;
  };

  reader.readAsDataURL(file);
}

function removeRoomDp(){

  if(String(myId)!==String(roomOwnerId)) return;

  db.ref("rooms/"+roomId+"/settings/dp").remove();

  roomDp="";
  document.getElementById("roomDpImg").src=defaultDp;

  showToast("Room DP removed");
  closeAll();
}

/* =========================
   PEERJS VOICE
========================= */

function setupPeer(){

  try{

    peer=new Peer(
      "pv-"+myId+"-"+Math.random().toString(36).slice(2,8),
      {
        debug:0
      }
    );

    peer.on("open",async peerId=>{

      await db.ref(
        "rooms/"+roomId+"/users/"+myId+"/peerId"
      ).set(peerId);

      document.getElementById("connectionStatus").textContent=
        "🟢 Voice connected";

      startMicrophone();
    });

    peer.on("call",call=>{

      if(!localStream) return;

      call.answer(localStream);

      call.on("stream",remoteStream=>{
        addAudio(call.peer,remoteStream);
      });

    });

    peer.on("error",err=>{
      console.log(err);
      document.getElementById("connectionStatus").textContent=
        "🟡 Voice reconnect required";
    });

  }catch(e){

    console.log(e);

  }
}

async function startMicrophone(){

  try{

    localStream=await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      },
      video:false
    });

    localStream.getAudioTracks().forEach(track=>{
      track.enabled=micOn;
    });

    connectExistingUsers();

  }catch(e){

    document.getElementById("connectionStatus").textContent=
      "🎙️ Microphone permission required";

    showToast("Mic permission allow karo");
  }
}

async function connectExistingUsers(){

  if(!peer || !localStream) return;

  const snap=await db.ref(
    "rooms/"+roomId+"/users"
  ).once("value");

  const data=snap.val() || {};

  Object.values(data).forEach(u=>{

    if(String(u.id)===String(myId)) return;

    if(!u.peerId) return;

    if(calls[u.id]) return;

    try{

      const call=peer.call(
        u.peerId,
        localStream
      );

      calls[u.id]=call;

      call.on("stream",remoteStream=>{
        addAudio(u.id,remoteStream);
      });

      call.on("close",()=>{
        delete calls[u.id];
      });

    }catch(e){}
  });
}

function addAudio(id,stream){

  let audio=document.getElementById(
    "audio-"+String(id).replace(/[^a-zA-Z0-9]/g,"")
  );

  if(!audio){

    audio=document.createElement("audio");

    audio.id=
      "audio-"+String(id).replace(/[^a-zA-Z0-9]/g,"");

    audio.autoplay=true;
    audio.playsInline=true;

    document.body.appendChild(audio);
  }

  audio.srcObject=stream;
  audio.muted=!speakerOn;

  audio.play().catch(()=>{});
}

async function openStats(){

  const snap=await db.ref(
    "rooms/"+roomId+"/users"
  ).once("value");

  const count=Object.keys(snap.val() || {}).length;

  openSheet("📊 Room Statistics",`

    <div class="grid">

      <div class="actionBtn">
        <span class="ico">👥</span>
        <small>Online</small>
        <b>${count}</b>
      </div>

      <div class="actionBtn">
        <span class="ico">❤️</span>
        <small>Likes</small>
        <b id="likeCount">0</b>
      </div>

      <div class="actionBtn">
        <span class="ico">🎁</span>
        <small>Gifts</small>
        <b>0</b>
      </div>

      <div class="actionBtn">
        <span class="ico">⏱️</span>
        <small>Live</small>
        <b>Now</b>
      </div>

    </div>

    <button class="fullBtn" onclick="sendLike()">
      ❤️ Like Room
    </button>
  `);
}

async function sendLike(){

  await db.ref(
    "rooms/"+roomId+"/likes"
  ).transaction(v=>(Number(v)||0)+1);

  showToast("❤️ Like sent");
}

/* =========================
   LEAVE / MINIMIZE
========================= */

function leaveRoom(){

  openSheet("🚪 Leave Room",`

    <div class="card" style="text-align:center">
      <h3>Room se bahar jana hai?</h3>

      <button class="fullBtn"
        onclick="confirmLeave()">
        🚪 Leave Room
      </button>

      <button class="fullBtn danger"
        onclick="closeAll()">
        Cancel
      </button>
    </div>
  `);
}

async function confirmLeave(){

  try{
    await db.ref(
      "rooms/"+roomId+"/users/"+myId
    ).remove();
  }catch(e){}

  if(peer){
    try{peer.destroy();}catch(e){}
  }

  location.href="index.html";
}

function minimizeRoom(){

  minimized=!minimized;

  document.querySelector(".roomBody").style.display=
    minimized ? "none":"block";

  document.querySelector(".bottom").style.display=
    minimized ? "none":"block";

  showToast(
    minimized ? "Room minimized":"Room restored"
  );
}
