<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PawanVoice Room</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#080a15;
  color:#fff;
  font-family:Arial,sans-serif;
}
button,input{font:inherit}

.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(circle at top,#29245d,#111326 42%,#080a15 80%);
  padding-bottom:82px;
}

/* HEADER */

.header{
  height:68px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 13px;
  background:#090b17cc;
  backdrop-filter:blur(12px);
  position:sticky;
  top:0;
  z-index:20;
}

.back{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#ffffff12;
  color:white;
  font-size:22px;
}

.room-dp{
  width:43px;
  height:43px;
  border-radius:13px;
  object-fit:cover;
}

.room-info{
  flex:1;
  min-width:0;
}

.room-name{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-id{
  font-size:10px;
  color:#9da2bd;
  margin-top:3px;
}

.header-btn{
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:#ffffff10;
  color:white;
}

/* ROOM TOP */

.room-status{
  display:flex;
  justify-content:space-between;
  padding:12px 15px;
}

.status{
  padding:7px 10px;
  border-radius:20px;
  background:#ffffff0d;
  font-size:11px;
  color:#cbd0e3;
}

/* SEATS */

.seats{
  padding:8px 12px 5px;
}

.host-seat{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px 8px;
}

.seat{
  min-width:0;
  text-align:center;
  cursor:pointer;
}

.avatar-wrap{
  width:61px;
  height:61px;
  margin:auto;
  position:relative;
}

.seat-avatar{
  width:61px;
  height:61px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ffffff30;
  background:#20243b;
}

.empty-seat{
  display:flex;
  align-items:center;
  justify-content:center;
  width:61px;
  height:61px;
  border-radius:50%;
  background:#ffffff08;
  border:1px dashed #ffffff25;
  color:#777d9a;
  font-size:24px;
}

.mic{
  position:absolute;
  right:-2px;
  bottom:-1px;
  width:21px;
  height:21px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#262b42;
  font-size:10px;
  border:2px solid #101326;
}

.mic.on{
  background:#21bd76;
}

.seat-name{
  font-size:10px;
  margin-top:7px;
  color:#e3e5ef;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.host-badge{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:-9px;
  background:#ffbd35;
  color:#291c00;
  padding:3px 7px;
  border-radius:10px;
  font-size:8px;
  font-weight:800;
}

/* TOOLS */

.tools{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  padding:17px 12px;
}

.tool{
  border:0;
  border-radius:14px;
  background:#ffffff09;
  color:#dce0f0;
  padding:10px 3px;
  font-size:10px;
}

.tool-icon{
  font-size:21px;
  display:block;
  margin-bottom:5px;
}

/* EXP */

.exp{
  margin:3px 13px 13px;
  background:#ffffff08;
  border-radius:18px;
  padding:13px;
}

.exp-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:10px;
}

.exp-row{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.exp-user{
  flex:1;
  text-align:center;
  background:#ffffff08;
  padding:8px 3px;
  border-radius:12px;
}

.exp-user .num{
  font-size:18px;
  font-weight:900;
}

.exp-user .small{
  font-size:9px;
  color:#9da2bd;
}

/* CHAT */

.chat{
  margin:0 13px;
  height:190px;
  overflow-y:auto;
  background:#ffffff06;
  border-radius:17px;
  padding:10px;
}

.msg{
  margin-bottom:8px;
  font-size:12px;
  line-height:1.35;
}

.msg .name{
  color:#b7a8ff;
  font-weight:700;
}

.system{
  color:#7e849d;
  font-size:11px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:#0d0f1ff5;
  backdrop-filter:blur(18px);
  border-top:1px solid #ffffff0d;
  padding:9px 10px;
  display:flex;
  gap:7px;
  z-index:50;
}

.input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  border-radius:22px;
  padding:11px 13px;
  background:#ffffff0c;
  color:white;
}

.bottom-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#ffffff0d;
  color:white;
  flex:none;
}

/* MODALS */

.modal-bg{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:flex-end;
  z-index:100;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  max-height:80vh;
  overflow:auto;
  background:#171a2c;
  border-radius:25px 25px 0 0;
  padding:20px;
}

.modal h2{
  margin-bottom:15px;
}

.modal-btn{
  width:100%;
  border:0;
  padding:13px;
  margin-top:8px;
  border-radius:13px;
  background:#ffffff0b;
  color:white;
}

.close{
  background:#6d5dfc;
}

.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.gift{
  border:0;
  background:#ffffff09;
  color:white;
  border-radius:15px;
  padding:12px 3px;
}

.gift-icon{
  font-size:28px;
}

.gift-name{
  font-size:10px;
  margin-top:5px;
}

/* GIFT ANIMATION */

.gift-float{
  position:fixed;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  font-size:80px;
  z-index:200;
  animation:gift 1.4s ease forwards;
  pointer-events:none;
}

@keyframes gift{
  0%{transform:translate(-50%,0) scale(.3);opacity:0}
  25%{transform:translate(-50%,0) scale(1.2);opacity:1}
  100%{transform:translate(-50%,-150px) scale(1);opacity:0}
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <button class="back" onclick="goHome()">‹</button>

  <img id="roomDp"
       class="room-dp"
       src="https://i.pravatar.cc/100?img=20">

  <div class="room-info">

    <div id="roomName" class="room-name">
      PawanVoice Room
    </div>

    <div id="roomId" class="room-id">
      ID: ------
    </div>

  </div>

  <button class="header-btn"
          onclick="inviteRoom()">
    ↗
  </button>

  <button class="header-btn"
          onclick="openSettings()">
    ⚙
  </button>

</header>


<div class="room-status">

  <div id="onlineStatus" class="status">
    🟢 0/9
  </div>

  <div class="status">
    🎙️ 9 Seats
  </div>

</div>


<section class="seats">

  <div id="hostSeat"
       class="host-seat">
  </div>

  <div id="seatGrid"
       class="grid">
  </div>

</section>


<!-- TOOLS -->

<div class="tools">

  <button class="tool"
          onclick="supportRoom()">
    <span class="tool-icon">💖</span>
    Support
  </button>

  <button class="tool"
          onclick="showAlert('Lucky Wheel')">
    <span class="tool-icon">🎡</span>
    Lucky
  </button>

  <button class="tool"
          onclick="showAlert('Bounty Hunter')">
    <span class="tool-icon">🎯</span>
    Bounty
  </button>

  <button class="tool"
          onclick="showAlert('Room Reward')">
    <span class="tool-icon">🎁</span>
    Reward
  </button>

  <button class="tool"
          onclick="showAlert('Benefits')">
    <span class="tool-icon">⭐</span>
    Benefits
  </button>

</div>


<!-- EXP -->

<div class="exp">

  <div class="exp-title">
    🚀 Room EXP Top
  </div>

  <div class="exp-row">

    <div class="exp-user">
      <div class="num">🥇</div>
      <div class="small">Top 1</div>
    </div>

    <div class="exp-user">
      <div class="num">🥈</div>
      <div class="small">Top 2</div>
    </div>

    <div class="exp-user">
      <div class="num">🥉</div>
      <div class="small">Top 3</div>
    </div>

  </div>

</div>


<!-- CHAT -->

<div id="chat"
     class="chat">
</div>

</div>


<!-- BOTTOM -->

<div class="bottom">

  <input
    id="message"
    class="input"
    placeholder="Say something..."
    maxlength="300"
    onkeydown="messageKey(event)"
  >

  <button class="bottom-btn"
          onclick="openEmoji()">
    😊
  </button>

  <button id="speakerBtn"
          class="bottom-btn"
          onclick="toggleSpeaker()">
    🔊
  </button>

  <button id="micBtn"
          class="bottom-btn"
          onclick="toggleMic()">
    🎤
  </button>

  <button class="bottom-btn"
          onclick="openGifts()">
    🎁
  </button>

  <button class="bottom-btn"
          onclick="sendMessage()">
    ➤
  </button>

</div>


<!-- EMOJI -->

<div id="emojiModal"
     class="modal-bg"
     onclick="closeOutside(event,'emojiModal')">

  <div class="modal">

    <h2>Emoji</h2>

    <div class="gifts">

      <button class="gift" onclick="addEmoji('😀')">😀</button>
      <button class="gift" onclick="addEmoji('😂')">😂</button>
      <button class="gift" onclick="addEmoji('😍')">😍</button>
      <button class="gift" onclick="addEmoji('😘')">😘</button>
      <button class="gift" onclick="addEmoji('🥰')">🥰</button>
      <button class="gift" onclick="addEmoji('😎')">😎</button>
      <button class="gift" onclick="addEmoji('🔥')">🔥</button>
      <button class="gift" onclick="addEmoji('❤️')">❤️</button>

      <button class="gift" onclick="addEmoji('👏')">👏</button>

    </div>

</div>


<!-- GIFTS -->

<div id="giftModal"

     onclick="closeOutside(event,'giftModal')">

  <div class="modal">

    <h2>🎁 Gifts</h2>

      <button class="gift"

      <button class="gift"

      </button>

      <button class="gift"

<!-- SETTINGS -->

<div id="settingsModal"

<script>

const params =
  new URLSearchParams(
    location.search
  );


const roomId =
  params.get("room") ||
  "123456";

const userId =
  params.get("userid") ||
  localStorage.getItem("pv_userId") ||
  "pawan";

const userName =
  params.get("name") ||
  localStorage.getItem("pv_name") ||
  "Pawan";

const userDp =
  params.get("dp") ||
  localStorage.getItem("pv_dp") ||
  "https://i.pravatar.cc/150?img=12";


let socket = null;

let roomState = null;

let localStream = null;

let micOn = false;

let speakerOn = true;

const peers = {};

let rtcConfig = {
  iceServers:[
    {
      urls:"stun:stun.l.google.com:19302"
    }
  ]
};


/* HEADER */

document.getElementById("roomId").textContent =
  "ID: " + roomId;


/* RTC CONFIG */

async function loadRtcConfig(){

  try{

    const response =
      await fetch("/rtc-config");

    if(response.ok){

      const data =
        await response.json();

      if(data.iceServers){

        rtcConfig = {
          iceServers:
            data.iceServers
        };

      }

    }

  }catch(error){

    console.log(
      "RTC config fallback"
    );

  }

}


/* SOCKET */

async function connectRoom(){

  await loadRtcConfig();

  socket =
    io(
      window.location.origin,
      {
        transports:[
          "websocket",
          "polling"
        ]
      }
    );


  socket.on("connect",()=>{

    socket.emit(
      "join-room",
      {
        roomId,
        userId,
        name:userName,
        dp:userDp
      }
    );

  });


  socket.on(
    "joined-room",
    data => {

      console.log(
        "Joined room",
        data
      );

    }
  );


  socket.on(
    "room-state",
    data => {

      roomState = data;

      renderRoom();

      updatePeers();

    }
  );


  socket.on(
    "chat-message",
    message => {

      addMessage(message);

    }
  );


  socket.on(
    "gift-received",
    gift => {

      showGift(gift.giftIcon);

    }
  );


  socket.on(
    "room-error",
    data => {

      alert(
        data.message ||
        "Room error"
      );

    }
  );


  socket.on(
    "force-mute",
    () => {

      setMic(false);

    }
  );


  socket.on(
    "kicked",
    () => {

      alert(
        "You have been removed from this room."
      );

      goHome();

    }
  );


  socket.on(
    "webrtc-offer",
    async data => {

      await receiveOffer(data);

    }
  );


  socket.on(
    "webrtc-answer",
    async data => {

      await receiveAnswer(data);

    }
  );


  socket.on(
    "webrtc-ice",
    async data => {

      await receiveIce(data);

    }
  );

}


/* RENDER ROOM */

function renderRoom(){

  if(!roomState)
    return;


  document.getElementById(
    "roomName"
  ).textContent =
    roomState.roomName ||
    "PawanVoice Room";


  if(roomState.roomDp){

    document.getElementById(
      "roomDp"
    ).src =
      roomState.roomDp;

  }


  document.getElementById(
    "onlineStatus"
  ).textContent =
    "🟢 " +
    (roomState.onlineCount || 0) +
    "/9";


  const seats =
    roomState.seats ||
    [];


  /* HOST */

  const host =
    seats[0];


  const hostBox =
    document.getElementById(
      "hostSeat"
    );


  hostBox.innerHTML =
    makeSeat(
      host,
      0,
      true
    );


  /* OTHER 8 */

  const grid =
    document.getElementById(
      "seatGrid"
    );


  let html = "";

  for(
    let i = 1;
    i < 9;
    i++
  ){

    html +=
      makeSeat(
        seats[i],
        i,
        false
      );

  }


  grid.innerHTML =
    html;

}


/* SEAT HTML */

function makeSeat(
  user,
  seatIndex,
  isHost
){

  if(!user){

    return `
      <div
        class="seat"
        onclick="takeSeat(${seatIndex})">

        <div class="avatar-wrap">

          <div class="empty-seat">
            +
          </div>

        </div>

        <div class="seat-name">
          Seat ${seatIndex + 1}
        </div>

      </div>
    `;

  }


  const isMe =
    user.socketId ===
    socket?.id;


  return `
    <div
      class="seat"
      onclick="userClick('${escapeAttr(user.socketId)}')">

      <div class="avatar-wrap">

        ${
          isHost
          ? `<div class="host-badge">HOST</div>`
          : ""
        }

        <img
          class="seat-avatar"
          src="${escapeAttr(
            user.dp ||
            "https://i.pravatar.cc/100?img=12"
          )}"
          onerror="this.src='https://i.pravatar.cc/100?img=12'"
        >

        <div
          class="mic ${
            user.micOn
              ? "on"
              : ""
          }">

          ${
            user.micOn
              ? "🎤"
              : "🔇"
          }

        </div>

      </div>

      <div class="seat-name">
        ${
          isMe
          ? "You"
          : escapeHtml(user.name)
        }
      </div>

    </div>
  `;

}


/* TAKE SEAT */

function takeSeat(index){

  if(!socket)
    return;

  socket.emit(
    "take-seat",
    {
      seat:index
    }
  );

}


/* LEAVE SEAT */

function leaveSeat(){

  if(socket){

    socket.emit(
      "leave-seat"
    );

  }

  hideModal(
    "settingsModal"
  );

}


/* MIC */

async function toggleMic(){

  if(micOn){

    setMic(false);

    return;

  }


  if(!localStream){

    try{

      localStream =
        await navigator.mediaDevices.getUserMedia({
          audio:true,
          video:false
        });

    }catch(error){

      alert(
        "Microphone permission allow karein."
      );

      return;

    }

  }


  setMic(true);

}


/* SET MIC */

function setMic(on){

  micOn = !!on;


  if(localStream){

    localStream
      .getAudioTracks()
      .forEach(track => {

        track.enabled =
          micOn;

      });

  }


  if(socket){

    socket.emit(
      "mic-status",
      {
        on:micOn
      }
    );

  }


  document.getElementById(
    "micBtn"
  ).textContent =
    micOn
      ? "🎙️"
      : "🎤";

}


/* SPEAKER */

function toggleSpeaker(){

  speakerOn =
    !speakerOn;


  document.getElementById(
    "speakerBtn"
  ).textContent =
    speakerOn
      ? "🔊"
      : "🔇";


  document
    .querySelectorAll("audio")
    .forEach(audio => {

      audio.muted =
        !speakerOn;

    });


  if(socket){

    socket.emit(
      "speaker-status",
      {
        on:speakerOn
      }
    );

  }

}


/* PEERS */

function updatePeers(){

  if(!roomState || !socket)
    return;


  const users =
    roomState.users || [];


  users.forEach(user => {

    if(
      user.socketId !==
      socket.id
    ){

      createPeerIfNeeded(
        user.socketId,
        true
      );

    }

  });

}


/* CREATE PEER */

async function createPeerIfNeeded(
  remoteId,
  makeOffer
){

  if(
    peers[remoteId]
  ){

    return peers[remoteId];

  }


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peers[remoteId] = pc;


  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }


  pc.onicecandidate =
    event => {

      if(
        event.candidate &&
        socket
      ){

        socket.emit(
          "webrtc-ice",
          {
            target:remoteId,
            candidate:
              event.candidate
          }
        );

      }

    };


  pc.ontrack =
    event => {

      let audio =
        document.getElementById(
          "audio_" +
          remoteId
        );


      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.id =
          "audio_" +
          remoteId;

        audio.autoplay =
          true;

        audio.playsInline =
          true;

        document.body.appendChild(
          audio
        );

      }


      audio.srcObject =
        event.streams[0];

      audio.muted =
        !speakerOn;

    };


  if(makeOffer){

    try{

      const offer =
        await pc.createOffer();

      await pc.setLocalDescription(
        offer
      );

      socket.emit(
        "webrtc-offer",
        {
          target:remoteId,
          offer
        }
      );

    }catch(error){

      console.log(error);

    }

  }


  return pc;

}


/* OFFER */

async function receiveOffer(data){

  if(!data.from)
    return;


  const pc =
    await createPeerIfNeeded(
      data.from,
      false
    );


  await pc.setRemoteDescription(
    new RTCSessionDescription(
      data.offer
    )
  );


  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        const senders =
          pc.getSenders();

        const already =
          senders.some(
            sender =>
              sender.track === track
          );

        if(!already){

          pc.addTrack(
            track,
            localStream
          );

        }

      });

  }


  const answer =
    await pc.createAnswer();


  await pc.setLocalDescription(
    answer
  );


  socket.emit(
    "webrtc-answer",
    {
      target:data.from,
      answer
    }
  );

}


/* ANSWER */

async function receiveAnswer(data){

  const pc =
    peers[data.from];

  if(!pc)
    return;

  await pc.setRemoteDescription(
    new RTCSessionDescription(
      data.answer
    )
  );

}


/* ICE */

async function receiveIce(data){

  const pc =
    peers[data.from];

  if(
    !pc ||
    !data.candidate
  )
    return;


  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );

  }catch(error){

    console.log(error);

  }

}


/* CHAT */

function sendMessage(){

  const input =
    document.getElementById(
      "message"
    );

  const text =
    input.value.trim();


  if(!text)
    return;


  if(socket){

    socket.emit(
      "chat-message",
      {
        text
      }
    );

  }


  input.value = "";

}


function messageKey(event){

  if(
    event.key ===
    "Enter"
  ){

    sendMessage();

  }

}


/* MESSAGE */

function addMessage(message){

  const box =
    document.getElementById(
      "chat"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    message.type === "system"
      ? "msg system"
      : "msg";


  if(
    message.type ===
    "system"
  ){

    div.textContent =
      "• " +
      message.text;

  }else{

    const name =
      document.createElement(
        "span"
      );

    name.className =
      "name";

    name.textContent =
      message.name +
      ": ";

    div.appendChild(
      name
    );

    div.appendChild(
      document.createTextNode(
        message.text
      )
    );

  }


  box.appendChild(
    div
  );


  box.scrollTop =
    box.scrollHeight;

}

/* ESCAPE */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttr(value){

  return escapeHtml(value);

}
