<script>

/* =========================
   SERVER
========================= */

const SERVER =
 "https://pawanvoice-1.onrender.com";


/* =========================
   ROOM INFO
========================= */

const params =
 new URLSearchParams(
   location.search
 );

const ROOM_ID =
 params.get("room") || "10001";

const ROOM_NAME =
 params.get("name") ||
 "PawanVoice Room";

const USER_NAME =
 localStorage.getItem(
   "pv_name"
 ) || "Pawan";

const USER_DP =
 localStorage.getItem(
   "pv_dp"
 ) || "";


/* =========================
   SOCKET
========================= */

let socket = null;


/* =========================
   MICROPHONE
========================= */

let localStream = null;

let mic = false;


/* =========================
   WEBRTC
========================= */

const peers = new Map();

const pendingIce = new Map();

const rtcConfig = {

 iceServers: [

   {
     urls:
       "stun:stun.l.google.com:19302"
   },

   {
     urls:
       "stun:stun1.l.google.com:19302"
   }

 ]

};


/* =========================
   UI
========================= */

document.getElementById(
 "roomName"
).textContent =
 ROOM_NAME;

document.getElementById(
 "roomNumber"
).textContent =
 "Room #"+ROOM_ID;


/* =========================
   CONNECT
========================= */

function connect(){

 socket = io(
   SERVER,
   {
     transports:[
       "websocket",
       "polling"
     ]
   }
 );


 socket.on(
   "connect",
   async () => {

     setStatus(
       "Connected"
     );

     socket.emit(
       "joinRoom",
       {
         roomId:ROOM_ID,
         name:USER_NAME,
         dp:USER_DP
       }
     );

     /*
      * Microphone is NOT opened
      * automatically.
      *
      * User presses Mic button.
      */
   }
 );


 socket.on(
   "connect_error",
   () => {

     setStatus(
       "Server connection failed"
     );

   }
 );


 socket.on(
   "joined",
   data => {

     renderRoom(
       data.room
     );

   }
 );


 socket.on(
   "roomState",
   room => {

     renderRoom(room);

   }
 );


 /*
  * Existing peer needs offer.
  */

 socket.on(
   "existingPeer",
   async data => {

     await createOffer(
       data.userId
     );

   }
 );


 /*
  * Receive offer.
  */

 socket.on(
   "webrtc-offer",
   async data => {

     await receiveOffer(
       data.from,
       data.offer
     );

   }
 );


 /*
  * Receive answer.
  */

 socket.on(
   "webrtc-answer",
   async data => {

     const pc =
       peers.get(data.from);

     if(!pc)return;

     try{

       await pc.setRemoteDescription(
         new RTCSessionDescription(
           data.answer
         )
       );

       await flushIce(
         data.from
       );

     }catch(e){

       console.error(
         "Answer error",
         e
       );

     }

   }
 );


 /*
  * ICE candidate
  */

 socket.on(
   "webrtc-ice",
   async data => {

     const pc =
       peers.get(data.from);

     if(
       pc &&
       pc.remoteDescription
     ){

       try{

         await pc.addIceCandidate(
           new RTCIceCandidate(
             data.candidate
           )
         );

       }catch(e){

         console.error(
           "ICE error",
           e
         );

       }

     }else{

       if(
         !pendingIce.has(
           data.from
         )
       ){

         pendingIce.set(
           data.from,
           []
         );

       }

       pendingIce
         .get(data.from)
         .push(
           data.candidate
         );

     }

   }
 );


 /*
  * Peer left
  */

 socket.on(
   "peerLeft",
   data => {

     closePeer(
       data.userId
     );

   }
 );


 socket.on(
   "userJoined",
   user => {

     addMessage(
       "🟢 "+
       escapeHtml(
         user.name
       )+
       " joined the room"
     );

   }
 );


 socket.on(
   "userLeft",
   user => {

     addMessage(
       "🔴 "+
       escapeHtml(
         user.name
       )+
       " left the room"
     );

   }
 );


 socket.on(
   "message",
   data => {

     addMessage(
       "<b>"+
       escapeHtml(
         data.name
       )+
       ":</b> "+
       escapeHtml(
         data.message
       )
     );

   }
 );

}


/* =========================
   ROOM UI
========================= */

function renderRoom(room){

 const seats =
 room.seats || [];

 let total = 0;

 seats.forEach(
   seat => {

     const avatar =
       document.getElementById(
         "avatar"+
         seat.seatNo
       );

     const name =
       document.getElementById(
         "name"+
         seat.seatNo
       );

     const micEl =
       document.getElementById(
         "mic"+
         seat.seatNo
       );

     if(!avatar)return;

     if(!seat.user){

       avatar.classList.add(
         "empty"
       );

       avatar.innerHTML="+";

       name.textContent =
         "Seat "+
         seat.seatNo;

       micEl.textContent="";

       return;
     }

     total++;

     avatar.classList.remove(
       "empty"
     );

     const user =
       seat.user;

     if(user.dp){

       avatar.innerHTML =
         "<img src=\""+
         escapeAttr(
           user.dp
         )+
         "\">";

     }else{

       avatar.textContent =
         String(
           user.nickname
         )
         .substring(0,2)
         .toUpperCase();

     }

     name.textContent =
       user.nickname;

     micEl.textContent =
       user.mic
       ? "🎙️ ON"
       : "🔇 OFF";

   }
 );


 /*
  * Count all room users,
  * not only seated users.
  */

 const userCount =
   (room.users || []).length;

 document.getElementById(
   "count"
 ).textContent =
 userCount+"/9";

}


/* =========================
   TAKE SEAT
========================= */

function takeSeat(seatNo){

 if(!socket)return;

 socket.emit(
   "takeSeat",
   {
     seatNo
   }
 );

}


/* =========================
   MICROPHONE
========================= */

async function toggleMic(){

 try{

   if(!mic){

     await startMicrophone();

   }else{

     stopMicrophone();

   }

 }catch(e){

   console.error(e);

   alert(
     "Microphone permission नहीं मिली। Browser में microphone permission Allow करें."
   );

 }

}


async function startMicrophone(){

 if(!localStream){

   localStream =
     await navigator.mediaDevices
       .getUserMedia({
         audio:{
           echoCancellation:true,
           noiseSuppression:true,
           autoGainControl:true
         },
         video:false
       });

 }

 localStream
   .getAudioTracks()
   .forEach(
     track => {
       track.enabled = true;
     }
   );

 mic = true;

 updateMicButton();

 socket.emit(
   "micStatus",
   {
     mic:true
   }
 );


 /*
  * Add local audio track
  * to every existing peer.
  */

 for(
   const [peerId,pc]
   of peers
 ){

   const senders =
     pc.getSenders();

   const already =
     senders.some(
       sender =>
         sender.track &&
         sender.track.kind === "audio"
     );

   if(!already){

     localStream
       .getAudioTracks()
       .forEach(
         track => {

           pc.addTrack(
             track,
             localStream
           );

         }
       );

   }

   try{

     const offer =
       await pc.createOffer();

     await pc.setLocalDescription(
       offer
     );

     socket.emit(
       "webrtc-offer",
       {
         to:peerId,
         offer:pc.localDescription
       }
     );

   }catch(e){

     console.error(e);

   }

 }

}


function stopMicrophone(){

 if(!localStream)return;

 localStream
   .getAudioTracks()
   .forEach(
     track => {
       track.enabled = false;
     }
   );

 mic = false;

 updateMicButton();

 socket.emit(
   "micStatus",
   {
     mic:false
   }
 );

}


function updateMicButton(){

 document.getElementById(
   "micBtn"
 ).textContent =
 mic
 ? "🎙️"
 : "🔇";

}


/* =========================
   WEBRTC PEER
========================= */

function createPeer(peerId){

 if(
   !peerId ||
   peerId === socket.id
 ){
   return null;
 }

 if(
   peers.has(peerId)
 ){
   return peers.get(peerId);
 }

 const pc =
   new RTCPeerConnection(
     rtcConfig
   );

 peers.set(
   peerId,
   pc
 );


 /*
  * Add microphone track
  * if mic is already ON.
  */

 if(
   localStream &&
   mic
 ){

   localStream
     .getAudioTracks()
     .forEach(
       track => {

         pc.addTrack(
           track,
           localStream
         );

       }
     );

 }


 /*
  * Receive remote audio.
  */

 pc.ontrack = event => {

   if(
     event.streams &&
     event.streams[0]
   ){

     playRemoteAudio(
       peerId,
       event.streams[0]
     );

   }

 };


 /*
  * ICE
  */

 pc.onicecandidate =
   event => {

     if(
       event.candidate
     ){

       socket.emit(
         "webrtc-ice",
         {
           to:peerId,
           candidate:
             event.candidate
         }
       );

     }

   };


 pc.onconnectionstatechange =
   () => {

     const state =
       pc.connectionState;

     console.log(
       "Peer",
       peerId,
       state
     );

     if(
       state === "failed" ||
       state === "closed" ||
       state === "disconnected"
     ){

       closePeer(
         peerId
       );

     }

   };

 return pc;
}


/* =========================
   CREATE OFFER
========================= */

async function createOffer(
 peerId
){

 const pc =
   createPeer(
     peerId
   );

 if(!pc)return;

 try{

   const offer =
     await pc.createOffer();

   await pc.setLocalDescription(
     offer
   );

   socket.emit(
     "webrtc-offer",
     {
       to:peerId,
       offer:pc.localDescription
     }
   );

 }catch(e){

   console.error(
     "Offer error",
     e
   );

 }

}


/* =========================
   RECEIVE OFFER
========================= */

async function receiveOffer(
 peerId,
 offer
){

 const pc =
   createPeer(
     peerId
   );

 if(!pc)return;

 try{

   await pc.setRemoteDescription(
     new RTCSessionDescription(
       offer
     )
   );

   await flushIce(
     peerId
   );

   const answer =
     await pc.createAnswer();

   await pc.setLocalDescription(
     answer
   );

   socket.emit(
     "webrtc-answer",
     {
       to:peerId,
       answer:pc.localDescription
     }
   );

 }catch(e){

   console.error(
     "Offer receive error",
     e
   );

 }

}


/* =========================
   ICE QUEUE
========================= */

async function flushIce(
 peerId
){

 const pc =
   peers.get(peerId);

 if(!pc)return;

 const list =
   pendingIce.get(
     peerId
   ) || [];

 for(
   const candidate
   of list
 ){

   try{

     await pc.addIceCandidate(
       new RTCIceCandidate(
         candidate
       )
     );

   }catch(e){

     console.error(
       e
     );

   }

 }

 pendingIce.delete(
   peerId
 );


}


/* =========================
   REMOTE AUDIO
========================= */

function playRemoteAudio(
 peerId,
 stream
){

 let audio =
   document.getElementById(
     "audio-"+peerId
   );

 if(!audio){

   audio =
     document.createElement(
       "audio"
     );

   audio.id =
     "audio-"+peerId;

   audio.autoplay =
     true;

   audio.playsInline =
     true;

   document.body.appendChild(
     audio
   );

 }

 audio.srcObject =
   stream;

 audio.play()
   .catch(
     () => {}
   );

}


/* =========================
   CLOSE PEER
========================= */

function closePeer(
 peerId
){

 const pc =
   peers.get(
     peerId
   );

 if(pc){

   pc.close();

 }

 peers.delete(
   peerId
 );

 pendingIce.delete(
   peerId
 );

 const audio =
   document.getElementById(
     "audio-"+peerId
   );

 if(audio){

   audio.srcObject =
     null;

   audio.remove();

 }

}


/* =========================
   CHAT
========================= */

function sendMessage(){

 const input =
   document.getElementById(
     "message"
   );

 const message =
   input.value.trim();

 if(
   !message ||
   !socket
 ){
   return;
 }

 socket.emit(
   "message",
   {
     message
   }
 );

 input.value="";

}


function addMessage(text){

 const box =
   document.getElementById(
     "messages"
   );

 const div =
   document.createElement(
     "div"
   );

 div.className =
   "msg";

 div.innerHTML =
   text;

 box.appendChild(
   div
 );

 box.scrollTop =
   box.scrollHeight;

}


/* =========================
   EMOJI
========================= */

function emoji(){

 const emojis =
 "😀 😂 😍 😘 😭 😡 😴 👻 😎 🤔 🥳 🤑 ❤️ 😆 🤗 😇 🙄 😳 😱";

 const selected =
   prompt(
     "Emoji चुनें:\n\n"+
     emojis
   );

 if(selected){

   document.getElementById(
     "message"
   ).value +=
   selected;

 }

}


/* =========================
   INVITE
========================= */

function invite(){

 const link =
   location.href;

 if(
   navigator.clipboard
 ){

   navigator.clipboard
     .writeText(link)
     .then(
       () => alert(
         "Room invite link copied!"
       )
     );

 }else{

   alert(link);

 }

}


/* =========================
   LEAVE
========================= */

function leaveRoom(){

 stopMicrophone();

 peers.forEach(
   (_,peerId) => {
     closePeer(peerId);
   }
 );

 if(socket){

   socket.emit(
     "leaveRoom"
   );

   socket.disconnect();

 }

 location.href =
   "index.html";

}

/* =========================
   SAFE HTML
========================= */

function escapeHtml(
 str
){

 return String(str)
   .replace(
     /[&<>"']/g,
     m => ({
       "&":"&amp;",
       "<":"&lt;",
       ">":"&gt;",
       '"':"&quot;",
       "'":"&#039;"
     }[m])
   );

}


function escapeAttr(
 str
){

 return String(str)
   .replace(
     /"/g,
     "&quot;"
   );

}
