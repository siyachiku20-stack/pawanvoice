<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PawanVoice Room</title>
<style>
.chat-box{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  padding:10px;
  z-index:9999;
  display:flex;
  gap:6px;
}

#chatInput{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:1px solid #555;
}

.chat-box button{
  padding:10px 14px;
  border-radius:20px;
}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

.box{
  background:#222;
  padding:20px;
  margin:15px auto;
  border-radius:12px;
  max-width:450px;
}

button{
  padding:13px 20px;
  margin:7px;
  border:0;
  border-radius:8px;
  font-size:16px;
}

#users{
  line-height:2;
  margin-top:15px;
}
</style>
</head>

<body>

<h1>🎙️ PawanVoice</h1>
<div class="profile-box">
  <h2>👤 My Profile</h2>

  <p id="profileName">Name: Guest</p>
  <p id="profileId">ID: Loading...</p>
<input type="file" id="profileDPInput" accept="image/*">

<br><br>

<img id="profileDP"
src="https://via.placeholder.com/100"
style="width:100px;height:100px;border-radius:50%;object-fit:cover;">
</div>
<div class="box">

<h2 id="roomName">Room</h2>
<div class="room-profile">

  <img id="roomDP"
       src="https://via.placeholder.com/100"
       style="width:100px;height:100px;border-radius:50%;object-fit:cover;">

  <br><br>

  <input type="file"
       id="roomDPInput"
       accept="image/*"
       onchange="showRoomDP(event)">

  <br><br>

  <input type="text"
         id="newRoomName"
         placeholder="Room ka naam">

  <button onclick="changeRoomName()">
    ✏️ Room Name Change
  </button>

</div>
<p id="status">Connecting...</p>

<button onclick="toggleMic()">🎙️ Mic ON/OFF</button>

<button onclick="leaveRoom()">🚪 Leave Room</button>
<div class="chat-box">

  <h3>💬 Room Chat</h3>

  <div id="chatMessages">
    No messages yet...
  </div>

  <input
    type="text"
    id="chatInput"
    placeholder="Message likho..."
  >

  <button onclick="sendMessage()">
    📤 Send
  </button>

</div>
</div>


<div class="box">

<h3>👥 People in Room</h3>

<div id="users">
Loading...
</div>
<div class="seats">
  <div class="row owner">
    <div class="seat">👑 Owner</div>
  </div>

  <div class="row">
    <div class="seat">🎙️ Seat 2</div>
    <div class="seat">🎙️ Seat 3</div>
    <div class="seat">🎙️ Seat 4</div>
    <div class="seat">🎙️ Seat 5</div>
  </div>

  <div class="row">
    <div class="seat">🎙️ Seat 6</div>
    <div class="seat">🎙️ Seat 7</div>
    <div class="seat">🎙️ Seat 8</div>
    <div class="seat">🎙️ Seat 9</div>
  </div>
</div>
</div>


<div id="audioContainer"></div>

<style>
.seats {
  margin: 20px auto;
  max-width: 400px;
}

.row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 12px 0;
}

.owner {
  margin-bottom: 20px;
}

.seat {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #222;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 12px;
  border: 2px solid #00bfff;
}

.owner .seat {
  width: 80px;
  height: 80px;
  border-color: gold;
}
</style>
<script>

const firebaseConfig={

apiKey:"AIzaSyDnlTdeqGyG5aPHrUIV6kTYnM521GtbrrE",

authDomain:"pawanvoice-68c5e.firebaseapp.com",

databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com",

projectId:"pawanvoice-68c5e",

storageBucket:"pawanvoice-68c5e.firebasestorage.app",

messagingSenderId:"148446327241",

appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"

};
alert("ROOM JS CHAL RAHA HAI");
firebase.initializeApp(firebaseConfig);

const db=firebase.database();

const params=new URLSearchParams(location.search);
alert("URL = " + location.href);
const roomId=params.get("id");

let myName=localStorage.getItem("pawanName") || "Guest";
let isOwner = false;
  let ownerName = "";
  if (roomId) {
  firebase.database().ref("rooms/" + roomId + "/owner").once("value")
    .then(snapshot => {
      if (!snapshot.exists()) {
        firebase.database().ref("rooms/" + roomId + "/owner").set(myName);
        isOwner = true;
        ownerName = myName;
      } else {
        ownerName = snapshot.val();
        isOwner = (ownerName === myName);
      }
    });
  }
  let myId="";

let peer=null;

let stream=null;

let micOn=true;

let calls={};


if(!roomId){

document.getElementById("status").innerText=
"Room ID nahi mila";
}else{
  document.getElementById("status").innerText = "Room ID mil gaya";
  alert("STARTROOM CALL");
  startRoom();
}


async function startRoom(){
document.getElementById("status").innerText = "START OK";
const roomSnap=
await db.ref("rooms/"+roomId).once("value");
document.getElementById("status").innerText="FIREBASE OK";
const room=roomSnap.val();
document.getElementById("status").innerText = "Room data mil gaya";

if(!room){

document.getElementById("status").innerText=
"Room nahi mila";

return;

}


document.getElementById("roomName").innerText=
"🎙️ "+room.name;


try{

stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});

}catch(e){

document.getElementById("status").innerText=
"Microphone permission nahi mili";

return;

}


peer=new Peer();
document.getElementById("status").innerText = "Peer start ho raha hai...";

peer.on("open",function(id){

myId=id;
document.getElementById("profileName").innerText = "Name: " + myName;
document.getElementById("profileId").innerText = "ID: " + myId;

db.ref(
"rooms/"+roomId+"/members/"+myId
).set({

name:myName,
peerId:myId

});


document.getElementById("status").innerText=
"✅ Room Joined";


listenMembers();

});


peer.on("call",function(call){

call.answer(stream);


call.on("stream",function(remoteStream){

addAudio(call.peer,remoteStream);

});

});

}


function listenMembers(){

db.ref(
"rooms/"+roomId+"/members"
).on("value",function(snapshot){

const data=snapshot.val() || {};

  const box = document.getElementById("users");
box.innerHTML = "";

Object.keys(data).forEach(function(id){

  const div = document.createElement("div");

  div.innerText =
    "🟢 " + data[id].name +
    (id === myId ? " (You)" : "");

  box.appendChild(div);

});

Object.keys(data).forEach(function(id){

  if(id === myId) return;

  if(calls[id]) return;

  calls[id] = true;

  const call = peer.call(
    data[id].peerId,
    stream
  );

  if(!call) return;

  call.on("stream", function(remoteStream){

    addAudio(
      data[id].peerId,
      remoteStream
    );

  });

});

Object.keys(data).forEach(function(id){

if(id===myId) return;

if(calls[id]) return;

calls[id]=true;


const call=peer.call(
data[id].peerId,
stream
);


if(!call) return;


call.on("stream",function(remoteStream){

addAudio(
data[id].peerId,
remoteStream
);

});

});

});

}


function addAudio(id,remoteStream){

if(
document.getElementById("audio-"+id)
) return;


const audio=document.createElement("audio");

audio.id="audio-"+id;

audio.autoplay=true;

audio.playsInline=true;

audio.srcObject=remoteStream;


document
.getElementById("audioContainer")
.appendChild(audio);

}


function toggleMic(){

if(!stream){

alert("Microphone connected nahi hai");

return;

}


micOn=!micOn;


stream
.getAudioTracks()
.forEach(function(track){

track.enabled=micOn;

});


document.getElementById("status").innerText=
micOn ? "🎙️ Mic ON" : "🔇 Mic OFF";

}

function changeRoomName(){

  const newName =
    document.getElementById("newRoomName").value.trim();

  if(!newName){
    alert("Pehle room ka naam likho");
    return;
  }

  db.ref("rooms/"+roomId+"/name").set(newName);

  document.getElementById("roomName").innerText =
    "🎙️ " + newName;

  document.getElementById("newRoomName").value = "";

}
  function sendMessage(){

  const input = document.getElementById("chatInput");
  const message = input.value.trim();

  if(!message) return;

  db.ref("rooms/"+roomId+"/messages").push({
    name: myName,
    text: message,
    time: Date.now()
  });

  input.value = "";
}

db.ref("rooms/"+roomId+"/messages").on("value", function(snapshot){

  const box = document.getElementById("chatMessages");

  box.innerHTML = "";

  const data = snapshot.val() || {};

  Object.values(data).forEach(function(msg){

    const div = document.createElement("div");

    div.innerText =
      "👤 " + msg.name + ": " + msg.text;

    box.appendChild(div);

  });

});
  function showProfileDP(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    document.getElementById("profileDP").src =
      e.target.result;

  };

  reader.readAsDataURL(file);
}

document.getElementById("profileDPInput")
.addEventListener("change", showProfileDP);
function leaveRoom(){

if(myId){

db.ref(
"rooms/"+roomId+"/members/"+myId
).remove();

}


if(stream){

stream
.getTracks()
.forEach(function(track){

track.stop();

});

}


if(peer){

peer.destroy();

}


location.href="index.html";

}
<script>
document.getElementById("profileName").innerText =
  "Name: " + myName;

document.getElementById("profileId").innerText =
  "ID: " + myId;
</script>
</script>

</body>
</html>
