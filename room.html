<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#09090f;
 color:#fff;
 font-family:Arial,sans-serif;
 padding-bottom:80px
}

button,input{font:inherit}
button{border:0;cursor:pointer}

.top{
 position:sticky;
 top:0;
 z-index:20;
 background:#11111a;
 padding:10px;
 border-bottom:1px solid #292936;
 display:flex;
 gap:9px;
 align-items:center
}

.back,.topbtn{
 width:40px;
 height:40px;
 border-radius:50%;
 background:#252530;
 color:#fff
}

.roomInfo{flex:1;min-width:0}
.roomInfo b{
 display:block;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}
.roomInfo small{color:#999}

.host{
 margin:10px;
 padding:13px;
 border-radius:15px;
 background:linear-gradient(135deg,#3b1760,#171525);
 border:1px solid #512680
}

.host small{
 color:#bbb
}

.seats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px 5px;
 padding:8px
}

.seat{
 min-height:100px;
 text-align:center
}

.owner{
 grid-column:1/-1
}

.circle{
 width:61px;
 height:61px;
 margin:auto;
 border-radius:50%;
 background:#252530;
 border:2px solid #484856;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:27px;
 position:relative
}

.owner .circle{
 width:77px;
 height:77px;
 border-color:#f2ba35
}

.name{
 margin-top:5px;
 font-size:12px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.mic{
 position:absolute;
 right:-2px;
 bottom:-2px;
 width:20px;
 height:20px;
 border-radius:50%;
 background:#16a34a;
 border:2px solid #09090f;
 font-size:10px;
 display:flex;
 align-items:center;
 justify-content:center
}

.mic.off{
 background:#555
}

.tools{
 padding:9px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px
}

.tool{
 background:#1b1b26;
 border:1px solid #2d2d3a;
 color:#fff;
 border-radius:12px;
 padding:10px 3px;
 font-size:11px
}

.chat{
 margin:9px;
 border:1px solid #292936;
 background:#15151e;
 border-radius:15px;
 overflow:hidden
}

.chatHead{
 padding:11px;
 font-weight:bold;
 border-bottom:1px solid #292936
}

.messages{
 height:220px;
 overflow:auto;
 padding:9px
}

.message{
 margin-bottom:8px;
 font-size:13px
}

.message b{
 color:#b78cff
}

.chatSend{
 display:flex;
 gap:7px;
 padding:8px;
 border-top:1px solid #292936
}

.chatSend input{
 flex:1;
 min-width:0;
 padding:11px;
 border-radius:10px;
 border:1px solid #353541;
 background:#22222d;
 color:#fff
}

.send{
 width:48px;
 background:#7c3aed;
 color:#fff;
 border-radius:10px
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:50;
 background:#11111a;
 border-top:1px solid #292936;
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:5px;
 padding:7px
}

.bottom button{
 background:#22222d;
 color:#fff;
 border-radius:10px;
 padding:8px 2px;
 font-size:10px
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.76);
 display:none;
 align-items:flex-end;
 z-index:100
}

.modal.show{display:flex}

.sheet{
 width:100%;
 max-height:88%;
 overflow:auto;
 background:#171720;
 border-radius:20px 20px 0 0;
 padding:16px
}

.close{
 float:right;
 width:36px;
 height:36px;
 border-radius:50%;
 background:#30303a;
 color:#fff
}

.option{
 width:100%;
 background:#22222d;
 color:#fff;
 padding:14px;
 margin-top:7px;
 border-radius:10px;
 text-align:left
}

.primary{
 width:100%;
 padding:12px;
 border-radius:10px;
 background:#7c3aed;
 color:#fff;
 margin-top:8px
}

.notice{
 background:#252530;
 border-radius:11px;
 padding:12px;
 color:#ddd;
 margin:10px 0
}

.emojiGrid{
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:7px
}

.emojiGrid button{
 padding:12px 4px;
 background:#22222d;
 border-radius:10px
}

@media(max-width:370px){
 .circle{width:55px;height:55px}
 .owner .circle{width:68px;height:68px}
}
</style>
</head>

<body>

<div class="chat">

<div class="bottom">

</div>

<div id="audioContainer"></div>

<div id="modal" class="modal" onclick="closeModal(event)">
 <div class="sheet" onclick="event.stopPropagation()">
  <button class="close" onclick="hideModal()">×</button>
  <div id="modalContent"></div>
 </div>
</div>

<script>

const firebaseConfig={
 apiKey:"AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"148446327241",
 appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

let uid=null;
let roomId=null;
let roomData={};
let userData={name:"Guest"};
let members={};

let localStream=null;
let micOn=false;
let speakerOn=true;

auth.onAuthStateChanged(async user=>{

 if(!user){
  await auth.signInAnonymously();
  return;
 }

 uid=user.uid;

 const params=new URLSearchParams(location.search);
 roomId=params.get("room");

 if(!roomId){
  alert("Room ID नहीं मिला");
  location.href="index.html";
  return;
 }

 document.getElementById("roomIdText").textContent=roomId;

 const userSnap=await db.ref("users/"+uid).once("value");
 userData=userSnap.val()||{name:"Guest"};

 const roomSnap=await db.ref("rooms/"+roomId).once("value");

 if(!roomSnap.exists()){
  alert("Room नहीं मिला");
  location.href="index.html";
  return;
 }

 roomData=roomSnap.val()||{};

 document.getElementById("roomName").textContent=roomData.name||"PawanVoice Room";
 document.getElementById("hostName").textContent=roomData.hostName||"Guest";
 document.getElementById("category").textContent=roomData.category||"General";
 document.getElementById("roomLevel").textContent=roomData.level||1;
 document.getElementById("roomExp").textContent=roomData.exp||0;

 await joinRoom();

});

async function joinRoom(){

 await db.ref(
  "rooms/"+roomId+"/members/"+uid
 ).set({

  uid:uid,
  name:userData.name||"Guest",
  role:"member",
  mic:false,
  joinedAt:firebase.database.ServerValue.TIMESTAMP

 });

 listenMembers();
 listenChat();

 await microphone();

}

function listenMembers(){

 db.ref("rooms/"+roomId+"/members").on("value",snap=>{

  members=snap.val()||{};

  document.getElementById("memberCount").textContent=
   Object.keys(members).length;

  renderSeats();

 });

}

function renderSeats(){

 const list=Object.values(members)
 .sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0))
 .slice(0,9);

 for(let i=0;i<9;i++){

  const seat=document.getElementById("seat"+i);
  const circle=seat.querySelector(".circle");
  const name=seat.querySelector(".name");

  const old=seat.querySelector(".mic");

  if(old)old.remove();

  if(list[i]){

   const u=list[i];

   circle.innerHTML=i===0?"👑":"👤";

   name.textContent=
    (u.name||"Guest")+
    (u.uid===uid?" (You)":"");

   const mic=document.createElement("span");

   mic.className=
    "mic "+(u.mic===false?"off":"");

   mic.textContent=
    u.mic===false?"":"🎤";

   circle.appendChild(mic);

   seat.onclick=()=>userMenu(u);

  }else{

   circle.textContent=i===0?"👑":"🎙️";

   name.textContent=i===0?"Owner":"Seat "+(i+1);

   seat.onclick=null;

  }

 }

}

async function microphone(){

 try{

  localStream=
   await navigator.mediaDevices.getUserMedia({
    audio:{
     echoCancellation:true,
     noiseSuppression:true,
     autoGainControl:true
    },
    video:false
   });

  localStream.getAudioTracks()
   .forEach(t=>t.enabled=false);

 }catch(e){

  console.error(e);

  alert(
   "Microphone permission Allow करें।"
  );

 }

}

async function toggleMic(){

 if(!localStream){
  await microphone();
 }

 if(!localStream)return;

 micOn=!micOn;

 localStream.getAudioTracks()
 .forEach(t=>t.enabled=micOn);

 await db.ref(
  "rooms/"+roomId+"/members/"+uid+"/mic"
 ).set(micOn);

 document.getElementById("micIcon").textContent=
  micOn?"🎤":"🔇";

 document.getElementById("micText").textContent=
  micOn?"Mic ON":"Mic OFF";

}

function toggleSpeaker(){

 speakerOn=!speakerOn;

 document.querySelectorAll("audio")
 .forEach(a=>a.muted=!speakerOn);

}

function listenChat(){

 db.ref("rooms/"+roomId+"/chat")
 .limitToLast(100)
 .on("value",snap=>{

  const box=document.getElementById("messages");

  box.innerHTML="";

  if(!snap.exists()){
   box.innerHTML="No messages yet";
   return;
  }

  snap.forEach(child=>{

   const m=child.val()||{};

   const div=document.createElement("div");

   div.className="message";

   div.innerHTML=
    "<b>"+safe(m.name||"Guest")+
    ":</b> "+
    safe(m.text||"");

   box.appendChild(div);

  });

  box.scrollTop=box.scrollHeight;

 });

}

async function sendChat(){

 const input=document.getElementById("chatText");

 const text=input.value.trim();

 if(!text)return;

 await db.ref("rooms/"+roomId+"/chat").push({

  uid:uid,
  name:userData.name||"Guest",
  text:text,
  createdAt:firebase.database.ServerValue.TIMESTAMP

 });

 input.value="";

}

function userMenu(u){

 showModal(`
  <h2>👤 ${safe(u.name||"Guest")}</h2>

  <div class="notice">
   User ID: ${safe(u.uid||"")}
  </div>

  <button class="option"
   onclick="showMessage('Profile opened')">
   👤 View Profile
  </button>

  <button class="option"
   onclick="giftPanel()">
   🎁 Send Gift
  </button>

  <button class="option"
   onclick="showMessage('Invite request sent')">
   📩 Invite to Mic
  </button>

  <button class="option"
   onclick="showMessage('User reported')">
   ⚠️ Report
  </button>

  <button class="option"
   onclick="showMessage('User blocked')">
   🚫 Block
  </button>
 `);

}

function giftPanel(){

 showModal(`
  <h2>🎁 Gifts</h2>

  <button class="option"
   onclick="gift('🌹 Rose',100)">

  </button>

  <button class="option"
   onclick="gift('❤️ Heart',500)">
   ❤️ Heart · 500 Coins
  </button>

  <button class="option"
   onclick="gift('💎 Diamond',1000)">
   💎 Diamond · 1,000 Coins
  </button>

  <button class="option"
   onclick="gift('🚀 Rocket',5000)">

  </button>

  <button class="option"

  </button>
 `);

}

 hideModal();

function emojiPanel(){

 showModal(`

  <div class="emojiGrid">

   <button onclick="emoji('😀')">😀</button>
   <button onclick="emoji('😂')">😂</button>
   <button onclick="emoji('😍')">😍</button>
   <button onclick="emoji('😭')">😭</button>
   <button onclick="emoji('😡')">😡</button>
   <button onclick="emoji('😴')">😴</button>
   <button onclick="emoji('👻')">👻</button>
   <button onclick="emoji('🔥')">🔥</button>
   <button onclick="emoji('❤️')">❤️</button>
   <button onclick="emoji('😘')">😘</button>
   <button onclick="emoji('🤣')">🤣</button>
   <button onclick="emoji('🤯')">🤯</button>

  </div>
 `);

}

async function emoji(e){

 await db.ref("rooms/"+roomId+"/chat").push({

  uid:uid,
  name:userData.name||"Guest",
  text:e,
  createdAt:firebase.database.ServerValue.TIMESTAMP

 });

 hideModal();

}

function rocket(){

 showModal(`
  <h2>🚀 Rocket Event</h2>

  <div class="notice">
   Rocket Event में special room animation और rewards होंगे।
  </div>

  <button class="primary"
   onclick="rocketSend()">
   🚀 SEND ROCKET
  </button>
 `);

}

async function rocketSend(){

 await db.ref("rooms/"+roomId+"/events").push({

  type:"rocket",
  uid:uid,
  name:userData.name||"Guest",
  createdAt:firebase.database.ServerValue.TIMESTAMP

 });

 hideModal();

 alert("🚀 Rocket Event started!");

}

function lucky(){

 const rewards=[
  "100 Coins",
  "500 Coins",
  "Gift",
  "10 EXP",
  "Frame",
  "Try Again"
 ];

 const reward=
  rewards[Math.floor(Math.random()*rewards.length)];

 showModal(`
  <h2>🎡 Lucky Wheel</h2>

  <div class="notice"
   style="font-size:40px;text-align:center">
   🎡
  </div>

  <button class="primary"
   onclick="showMessage('Reward: ${reward}')">
   SPIN
  </button>
 `);

}

 showModal(`

  <button class="option">🎁 Gift Ranking</button>
  <button class="option">🎤 Host Ranking</button>

  <button class="option">⭐ Room EXP</button>

}

  </button>

  <div class="notice"

 showModal(`

  <div class="notice">
   Room को support करके ranking activity बढ़ाएँ।
  </div>

  <button class="primary"
   onclick="showMessage('❤️ Support sent')">

  </button>
 `);

function roomSettings(){

 showModal(`
  <h2>⚙️ Room Settings</h2>

  <button class="option">🎨 Room Theme</button>
  <button class="option">🔒 Seat Lock</button>
  <button class="option">📢 Announcement</button>
  <button class="option">🔇 Mute All</button>
  <button class="option">⚠️ Report Room</button>
 `);

}

function inviteRoom(){

 const link=
  location.origin+
  location.pathname+
  "?room="+
  encodeURIComponent(roomId);

 if(navigator.share){

  navigator.share({
   title:"PawanVoice Room",
   text:"Join my PawanVoice room",
   url:link
  }).catch(()=>{});

 }else{

  prompt("Room Invite Link",link);

 }

}

async function leaveRoom(){

 try{

  if(localStream){
   localStream.getTracks()
   .forEach(t=>t.stop());
  }

  if(uid&&roomId){

   await db.ref(
    "rooms/"+roomId+"/members/"+uid
   ).remove();

  }

 }catch(e){
  console.error(e);
 }

 location.href="index.html";

}

function showMessage(msg){
 hideModal();
 alert(msg);
}

function showModal(html){
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("modal").classList.add("show");
}

function hideModal(){
 document.getElementById("modal").classList.remove("show");
}

function closeModal(e){
 if(e.target.id==="modal")hideModal();
}

function safe(v){

 return String(v||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}

window.addEventListener("beforeunload",()=>{

 if(localStream){
  localStream.getTracks()
  .forEach(t=>t.stop());
 }

});

</script>
