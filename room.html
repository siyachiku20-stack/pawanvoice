<script>

const SERVER=
"https://pawanvoice-1.onrender.com";

const params=
new URLSearchParams(
 window.location.search
);

const roomId=
params.get("room") ||
"PV824991";


let socket=null;

let roomState=null;

let selectedUser=null;

let localStream=null;

let peers={};

let micOn=false;

let speakerOn=true;


let userId=
localStorage.getItem(
 "pawanvoice_user_id"
);

let userName=
localStorage.getItem(
 "pawanvoice_name"
)||
"Pawan User";

let userDP=
localStorage.getItem(
 "pawanvoice_dp"
)||
"";


if(!userId){

 userId=
 "PVU"+
 Math.floor(
 100000+Math.random()*900000
 );

 localStorage.setItem(
  "pawanvoice_user_id",
  userId
 );

}


function avatarFor(user){

 if(user.dp){
  return user.dp;
 }

 const letter=
 (user.name||"P")
 .charAt(0)
 .toUpperCase();

 const svg=`
 <svg xmlns="http://www.w3.org/2000/svg"
 width="200" height="200">

 <rect width="100%" height="100%"
 fill="#754cff"/>

 <text x="50%" y="57%"
 text-anchor="middle"
 font-size="90"
 fill="white">
 ${letter}
 </text>

 </svg>
 `;

 return "data:image/svg+xml;base64,"+
 btoa(svg);
}


document.getElementById(
 "roomId"
).innerText=
"#"+roomId;


document.getElementById(
 "roomDp"
).src=
avatarFor({
 name:userName,
 dp:userDP
});


function connect(){

 socket=io(SERVER);

 socket.on("connect",()=>{

  socket.emit(
   "join-room",
   {
    roomId,
    userId,
    name:userName,
    dp:userDP
   },
   result=>{

    if(!result?.ok){

     alert(
      result?.error||
      "Room join failed"
     );

     window.location.href=
      "index.html";

     return;
    }

    console.log(
     "Joined PawanVoice room"
    );
   }
  );

 });


 socket.on(
  "room-state",
  state=>{

   roomState=state;

   renderRoom();
  }
 );


 socket.on(
  "room-message",
  message=>{

   addMessage(message);
  }
 );


 socket.on(
  "kicked",
  ()=>{

   alert("You were kicked.");

   window.location.href=
    "index.html";
  }
 );


 socket.on(
  "banned",
  ()=>{

   alert("You were banned from this room.");

   window.location.href=
    "index.html";
  }
 );


 socket.on(
  "peer-joined",
  async peer=>{

   if(localStream){

    await createOffer(
     peer.socketId
    );
   }
  }
 );


 socket.on(
  "voice-offer",
  async data=>{

   await receiveOffer(
    data.from,
    data.offer
   );
  }
 );


 socket.on(
  "voice-answer",
  async data=>{

   const pc=
    peers[data.from];

   if(pc){

    await pc.setRemoteDescription(
     new RTCSessionDescription(
      data.answer
     )
    );
   }
  }
 );


 socket.on(
  "voice-ice",
  async data=>{

   const pc=
    peers[data.from];

   if(
    pc &&
    data.candidate
   ){

    try{

     await pc.addIceCandidate(
      new RTCIceCandidate(
       data.candidate
      )
     );

    }catch(e){}

   }
  }
 );

}


connect();


function renderRoom(){

 if(!roomState) return;


 document.getElementById(
  "roomName"
 ).innerText=
 roomState.roomName;


 document.getElementById(
  "count"
 ).innerText=
 roomState.users.length+
 "/50";


 const seats=
 roomState.seats;


 const users=
 roomState.users;


 let html="";


 /* HOST */

 html+=`

 <div class="hostWrap">

  ${renderSeat(
   1,
   seats[0],
   users
  )}

 </div>

 `;


 /* SEATS 2-5 */

 for(let i=1;i<5;i++){

  html+=renderSeat(
   i+1,
   seats[i],
   users
  );
 }


 /* SEATS 6-9 */

 for(let i=5;i<9;i++){

  html+=renderSeat(
   i+1,
   seats[i],
   users
  );
 }


 document.getElementById(
  "seats"
 ).innerHTML=html;

}


function renderSeat(
 seatNo,
 userIdInSeat,
 users
){

 const user=
 users.find(
  x=>x.userId===userIdInSeat
 );


 if(!user){

  return `

  <div
   class="seat empty"
   onclick="takeSeat(${seatNo})">

   <div
    class="avatar"
    style="display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px">
    +
   </div>

   <div class="seatName">
    Empty
   </div>

   <div class="seatNo">
    Seat ${seatNo}
   </div>

  </div>

  `;
 }


 return `

 <div
  class="seat"
  onclick="openUser('${user.userId}')">

  <img
   class="avatar"
   src="${avatarFor(user)}"
  >

  <div class="seatName">
   ${escapeHTML(user.name)}
   ${user.isHost?" 👑":""}
   ${user.isAdmin&&!user.isHost?" ⭐":""}
  </div>

  <div class="seatNo">
   Seat ${seatNo}
   ${user.micOn?" • 🎙️":""}
  </div>

 </div>

 `;
}


function takeSeat(seat){

 if(!socket) return;

 socket.emit(
  "take-seat",
  seat
 );

 startMicrophone();
}


function leaveSeat(){

 socket?.emit(
  "leave-seat"
 );

 closeModal(
  "settingsModal"
 );
}


function openUser(id){

 const user=
 roomState?.users.find(
  x=>x.userId===id
 );

 if(!user) return;

 selectedUser=user;

 document.getElementById(
  "modalUserName"
 ).innerText=
 user.name;

 document.getElementById(
  "modalUserId"
 ).innerText=
 "ID: "+user.userId;


 const me=
 roomState.users.find(
  x=>x.userId===userId
 );


 const admin=
 me &&
 (
  me.isHost||
  me.isAdmin
 );


 document.getElementById(
  "adminBtn"
 ).style.display=
 admin &&
 !user.isAdmin &&
 user.userId!==userId
 ?"block":"none";


 document.getElementById(
  "removeAdminBtn"
 ).style.display=
 me?.isHost &&
 user.isAdmin &&
 !user.isHost
 ?"block":"none";


 document.getElementById(
  "userModal"
 ).style.display=
 "flex";
}


function closeModal(id){

 document.getElementById(
  id
 ).style.display=
 "none";
}


function takeSelectedSeat(){

 if(!selectedUser) return;

 const user=
 selectedUser;

 if(user.seatNo){

  socket.emit(
   "take-seat",
   user.seatNo
  );

 }

 closeModal(
  "userModal"
 );
}


function makeSelectedAdmin(){

 if(!selectedUser) return;

 socket.emit(
  "make-admin",
  selectedUser.userId
 );

 closeModal(
  "userModal"
 );
}


function removeSelectedAdmin(){

 if(!selectedUser) return;

 socket.emit(
  "remove-admin",
  selectedUser.userId
 );

 closeModal(
  "userModal"
 );
}


function kickSelected(){

 if(!selectedUser) return;

 if(
  !confirm(
   "Kick this user?"
  )
 ) return;

 socket.emit(
  "kick-user",
  selectedUser.userId
 );

 closeModal(
  "userModal"
 );
}


function banSelected(){

 if(!selectedUser) return;

 if(
  !confirm(
   "Ban this user?"
  )
 ) return;

 socket.emit(
  "ban-user",
  selectedUser.userId
 );

 closeModal(
  "userModal"
 );
}


function openSettings(){

 document.getElementById(
  "newRoomName"
 ).value=
 roomState?.roomName||
 "PawanVoice Room";

 document.getElementById(
  "settingsModal"
 ).style.display=
 "flex";
}


function changeRoomName(){

 const name=
 document.getElementById(
  "newRoomName"
 ).value.trim();

 if(!name) return;

 socket.emit(
  "change-room-name",
  name
 );

 closeModal(
  "settingsModal"
 );
}


function toggleEmoji(){

 const panel=
 document.getElementById(
  "emojiPanel"
 );

 panel.style.display=
 panel.style.display==="grid"
 ?"none"
 :"grid";
}


function addEmoji(emoji){

 const input=
 document.getElementById(
  "chatInput"
 );

 input.value+=emoji;

 input.focus();
}


function chatKey(event){

 if(
  event.key==="Enter"
 ){

  sendMessage();
 }
}


function sendMessage(){

 const input=
 document.getElementById(
  "chatInput"
 );

 const text=
 input.value.trim();

 if(!text) return;

 socket.emit(
  "send-message",
  {
   text
  }
 );

 input.value="";
}


function addMessage(message){

 const box=
 document.getElementById(
  "messages"
 );

 const div=
 document.createElement(
  "div"
 );

 div.className="msg";

 div.innerHTML=
 `<b>${escapeHTML(message.name)}</b>: ${escapeHTML(message.text)}`;

 box.appendChild(div);

 box.scrollTop=
 box.scrollHeight;
}


async function startMicrophone(){

 if(localStream) return;

 try{

  localStream=
   await navigator.mediaDevices
   .getUserMedia({
    audio:true,
    video:false
   });

  micOn=true;

  socket.emit(
   "mic-toggle",
   true
  );

  updateMicButton();

  await connectPeers();

 }catch(error){

  alert(
   "Microphone permission allow karein."
  );

  console.error(error);
 }
}


async function stopMicrophone(){

 if(!localStream) return;

 localStream
 .getTracks()
 .forEach(
  track=>track.stop()
 );

 localStream=null;

 micOn=false;

 socket.emit(
  "mic-toggle",
  false
 );

 updateMicButton();
}


async function toggleMic(){

 if(micOn){

  await stopMicrophone();

 }else{

  await startMicrophone();

 }
}


function updateMicButton(){

 document.getElementById(
  "micBtn"
 ).innerText=
 micOn?"🎙️":"🔇";
}


function toggleSpeaker(){

 speakerOn=!speakerOn;

 document.getElementById(
  "speakerBtn"
 ).innerText=
 speakerOn?"🔊":"🔇";

 socket.emit(
  "speaker-toggle",
  speakerOn
 );

 Object.values(
  peers
 ).forEach(
  pc=>{
   pc.__audioElements?.forEach(
    audio=>{
     audio.muted=!speakerOn;
    }
   );
  }
 );
}


async function connectPeers(){

 if(!localStream||!roomState)
  return;

 for(
  const user of roomState.users
 ){

  if(
   user.socketId &&
   user.socketId!==socket.id
  ){

   if(
    !peers[user.socketId]
   ){

    await createOffer(
     user.socketId
    );
   }
  }
 }
}


function createPeer(target){

 if(peers[target])
  return peers[target];

 const pc=
 new RTCPeerConnection({

  iceServers:[
   {
    urls:
    "stun:stun.l.google.com:19302"
   }
  ]

 });

 peers[target]=pc;

 if(localStream){

  localStream
  .getTracks()
  .forEach(
   track=>{
    pc.addTrack(
     track,
     localStream
    );
   }
  );

 }

 pc.onicecandidate=
 event=>{

  if(
   event.candidate
  ){

   socket.emit(
    "voice-ice",
    {
     target,
     candidate:
     event.candidate
    }
   );
  }
 };


 pc.ontrack=
 event=>{

  let audio=
   document.getElementById(
    "audio_"+target
   );

  if(!audio){

   audio=
   document.createElement(
    "audio"
   );

   audio.id=
    "audio_"+target;

   audio.autoplay=true;

   audio.playsInline=true;

   document.body.appendChild(
    audio
   );
  }

  audio.srcObject=
   event.streams[0];

  audio.muted=
   !speakerOn;

  audio.play()
   .catch(()=>{});
 };


 return pc;
}


async function createOffer(target){

 const pc=
  createPeer(target);

async function receiveOffer(
 from,
 offer
){

 if(!localStream){

  try{

   localStream=
    await navigator.mediaDevices
    .getUserMedia({
     audio:true,
     video:false
    });

  }catch(e){

   return;
  }
 }

 const pc=
  createPeer(from);

 const tracks=
  localStream.getTracks();

 tracks.forEach(
  track=>{
   const already=
    pc.getSenders()
    .find(
     s=>
      s.track?.kind===
      track.kind
    );

   if(!already){

    pc.addTrack(
     track,
     localStream
    );
   }
  }
 );

 await pc.setRemoteDescription(
  new RTCSessionDescription(
   offer
  )
 );

 const answer=
  await pc.createAnswer();

 await pc.setLocalDescription(
  answer
 );

 socket.emit(
  "voice-answer",
  {
   target:from,
   answer
  }
 );
}


function inviteRoom(){

 const link=
 location.origin+
 location.pathname+
 "?room="+
 encodeURIComponent(
  roomId
 );

 if(
  navigator.share
 ){

  navigator.share({
   title:"PawanVoice Room",
   text:
    "Join my PawanVoice room",
   url:link
  });

 }else{

  navigator.clipboard
   .writeText(link)
   .then(
    ()=>alert(
     "Room link copied"
    )
   );
 }
}

function leaveRoom(){

 try{

  Object.values(peers)
   .forEach(
    pc=>pc.close()
   );

  if(localStream){

   localStream
   .getTracks()
   .forEach(
    t=>t.stop()
   );
  }

  socket?.disconnect();

 }catch(e){}

 window.location.href=
  "index.html";
}


function escapeHTML(text){

 return String(text)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;");
}
