<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#17102b;
  color:white;
  overflow-x:hidden;
}

button{
  border:0;
  color:white;
  cursor:pointer;
}

.room{
  min-height:100vh;
  padding-bottom:100px;
  background:
    radial-gradient(circle at top,#3c2268 0,#21153b 38%,#120d21 100%);
}

/* TOP BAR */
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  background:rgba(15,8,30,.55);
  backdrop-filter:blur(10px);
}

.roomTitle{
  display:flex;
  align-items:center;
  gap:9px;
}

.roomIcon{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#6d39d8;
  font-size:21px;
}

.roomName{
  font-size:16px;
  font-weight:bold;
}

.roomId{
  color:#bdb2d5;
  font-size:11px;
  margin-top:3px;
}

.topBtns{
  display:flex;
  gap:7px;
}

.topBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  font-size:18px;
}

/* ANNOUNCEMENT */
.notice{
  margin:9px 12px;
  padding:9px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  color:#eee;
  font-size:12px;
}

/* OWNER */
.ownerArea{
  text-align:center;
  padding:12px 0 10px;
}

.ownerSeat{
  width:88px;
  height:88px;
  margin:auto;
  position:relative;
}

.ownerAvatar{
  width:72px;
  height:72px;
  margin:8px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffcf55,#8d42ed);
  border:3px solid #ffd95a;
  font-size:30px;
  overflow:hidden;
}

.ownerAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.crown{
  position:absolute;
  top:-4px;
  left:30px;
  font-size:22px;
}

.micDot{
  position:absolute;
  right:3px;
  bottom:5px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#21d67b;
  border:2px solid #17102b;
  font-size:10px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.seatLabel{
  font-size:12px;
  color:#ddd;
  margin-top:2px;
}

.userLabel{
  font-size:11px;
  color:#fff;
  margin-top:3px;
}

/* SEATS */
.seats{
  padding:4px 9px;
}

.seatRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:10px 0;
}

.seat{
  min-height:105px;
  text-align:center;
  position:relative;
  padding:4px;
}

.seatCircle{
  width:62px;
  height:62px;
  margin:auto;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  position:relative;
}

.seatCircle.occupied{
  border-color:#b47aff;
  background:#362057;
}

.seatCircle img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}

.lock{
  position:absolute;
  right:-2px;
  bottom:-2px;
  background:#17102b;
  border-radius:50%;
  padding:3px;
  font-size:12px;
}

.seatNumber{
  font-size:10px;
  color:#aaa;
  margin-top:3px;
}

.seatName{
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.vip{
  color:#ffd84d;
  font-size:10px;
}

.frame1{
  border:3px solid #ffd24c !important;
}

.frame2{
  border:3px solid #ff4ec8 !important;
}

.frame3{
  border:3px solid #4de7ff !important;
}

/* ROOM INFO */
.infoBar{
  margin:8px 12px;
  display:flex;
  justify-content:space-around;
  background:rgba(255,255,255,.07);
  padding:10px;
  border-radius:14px;
}

.infoItem{
  text-align:center;
  font-size:11px;
  color:#bbb;
}

.infoItem b{
  display:block;
  color:white;
  font-size:13px;
  margin-bottom:3px;
}

/* ONLINE */
.onlineTitle{
  padding:10px 14px 5px;
  font-size:14px;
  font-weight:bold;
}

.members{
  display:flex;
  gap:7px;
  padding:5px 12px;
  overflow-x:auto;
}

.member{
  min-width:60px;
  text-align:center;
  font-size:10px;
}

.memberAvatar{
  width:42px;
  height:42px;
  margin:auto;
  border-radius:50%;
  background:#39235b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  overflow:hidden;
}

.memberAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* BOTTOM */
.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  background:rgba(16,9,31,.96);
  border-top:1px solid rgba(255,255,255,.1);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  backdrop-filter:blur(12px);
}

.mainControls{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.control{
  min-height:54px;
  border-radius:13px;
  background:rgba(255,255,255,.09);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:10px;
}

.control span{
  font-size:21px;
}

.control.active{
  background:#6936d2;
}

.control.leave{
  background:#d62f51;
}

/* MORE PANEL */
.morePanel{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:-100%;
  max-height:78vh;
  overflow:auto;
  background:#211537;
  border-radius:22px 22px 0 0;
  padding:14px 12px 25px;
  transition:.25s;
}

.morePanel.show{
  bottom:0;
}

.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 4px 14px;
}

.panelHead b{
  font-size:17px;
}

.closeBtn{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#3b2854;
  font-size:18px;
}

.optionGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.option{
  min-height:76px;
  border-radius:15px;
  background:#302045;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:10px;
}

.option span{
  font-size:25px;
}

.option:active{
  transform:scale(.96);
}

/* POPUP */
.popup{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.68);
  align-items:flex-end;
}

.popup.show{
  display:flex;
}

.popupBox{
  width:100%;
  max-height:78vh;
  overflow:auto;
  background:#25183a;
  border-radius:22px 22px 0 0;
  padding:18px;
}

.popupTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

.popupRow{
  padding:13px 5px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:14px;
}

.popupAction{
  padding:9px 13px;
  border-radius:10px;
  background:#6c39d5;
}

.closeFull{
  width:100%;
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:#49325f;
}

/* CHAT */
.chatMessages{
  min-height:120px;
  max-height:260px;
  overflow:auto;
  background:#181025;
  border-radius:13px;
  padding:10px;
  margin-bottom:10px;
}

.chatMsg{
  padding:6px 0;
  font-size:12px;
}

.chatMsg b{
  color:#c995ff;
}

.chatInput{
  display:flex;
  gap:7px;
}

.chatInput input{
  flex:1;
  border:0;
  outline:0;
  border-radius:11px;
  padding:12px;
  background:#36264a;
  color:white;
}

.chatInput button{
  width:55px;
  border-radius:11px;
  background:#6c39d5;
}

/* TOAST */
.toast{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#000;
  color:white;
  padding:10px 15px;
  border-radius:12px;
  font-size:12px;
  display:none;
}

/* GIFT */
.giftGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.gift{
  background:#35234c;
  padding:12px 5px;
  border-radius:12px;
  text-align:center;
  font-size:11px;
}

.gift div{
  font-size:27px;
  margin-bottom:5px;
}

/* EVENT */
.eventCard{
  background:linear-gradient(135deg,#5c2b9d,#b32d75);
  border-radius:15px;
  padding:15px;
  margin-bottom:10px;
}

.eventCard b{
  font-size:16px;
}

.eventCard small{
  display:block;
  margin-top:6px;
  color:#eee;
}

/* RESPONSIVE */
@media(max-width:360px){
  .optionGrid{
    grid-template-columns:repeat(3,1fr);
  }

  .seatCircle{
    width:56px;
    height:56px;
  }
}
</style>
</head>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
  authDomain: "pawanvoice-68c5e.firebaseapp.com",
  databaseURL: "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
  projectId: "pawanvoice-68c5e",
  storageBucket: "pawanvoice-68c5e.firebasestorage.app",
  messagingSenderId: "148446327241",
  appId: "1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================
   USER
========================= */

const myId =
  localStorage.getItem("pawanUserId") ||
  ("user_" + Date.now());

const myName =
  localStorage.getItem("pawanName") ||
  "Pawan";

localStorage.setItem("pawanUserId",myId);

const vip =
  localStorage.getItem("pawanVIP") ||
  "";

const frame =
  localStorage.getItem("pawanFrame") ||
  "";

const entry =
  localStorage.getItem("pawanEntry") ||
  "";


/* =========================
   ROOM ID
========================= */

const urlParams = new URLSearchParams(location.search);

const roomId =
  urlParams.get("room") ||
  localStorage.getItem("pawanRoomId") ||
  "PawanRoom";

localStorage.setItem("pawanRoomId",roomId);

document.getElementById("roomIdText").innerText = roomId;


/* =========================
   VOICE
========================= */

let peer = null;
let stream = null;
let micOn = true;
let calls = {};


/* =========================
   INIT
========================= */

document.getElementById("ownerName").innerText = myName;

startRoom();
setupMicrophone();


/* =========================
   ROOM START
========================= */

function startRoom(){

  db.ref("rooms/"+roomId).once("value").then(snapshot=>{

    if(!snapshot.exists()){

      db.ref("rooms/"+roomId).set({

        name:"PawanVoice Room",
        ownerId:myId,
        ownerName:myName,
        notice:"Welcome to PawanVoice Room",
        createdAt:Date.now()

      });

    }

  });

  joinFirebaseRoom();

}


/* =========================
   MICROPHONE
========================= */

async function setupMicrophone(){

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:false
    });

    startPeer();

  }catch(error){

    showToast("Mic permission allow karo");

    console.log(error);

  }

}


/* =========================
   PEER
========================= */

function startPeer(){

  peer = new Peer(myId);

  peer.on("open",function(){

    db.ref("rooms/"+roomId+"/users/"+myId).update({

      id:myId,
      name:myName,
      peerId:myId,
      vip:vip,
      frame:frame,
      entry:entry,
      mic:true,
      joinedAt:Date.now()

    });

  });


  peer.on("call",function(call){

    call.answer(stream);

    call.on("stream",function(remoteStream){

      addAudio(call.peer,remoteStream);

    });

  });


  peer.on("error",function(error){

    console.log(error);

  });

}


/* =========================
   JOIN FIREBASE
========================= */

function joinFirebaseRoom(){

  const userRef =
    db.ref("rooms/"+roomId+"/users/"+myId);

  userRef.update({

    id:myId,
    name:myName,
    vip:vip,
    frame:frame,
    entry:entry,
    mic:true,
    joinedAt:Date.now()

  });

  listenUsers();

}


/* =========================
   USERS
========================= */

function listenUsers(){

  db.ref("rooms/"+roomId+"/users")
    .on("value",snapshot=>{

      const data = snapshot.val() || {};

      const ids = Object.keys(data);

      document.getElementById("onlineCount")
        .innerText = ids.length;

      renderMembers(data);

      ids.forEach(id=>{

        if(id !== myId){

          connectToUser(data[id]);

        }

      });

    });

}


/* =========================
   MEMBERS
========================= */

function renderMembers(data){

  const box =
    document.getElementById("members");

  box.innerHTML = "";

  Object.keys(data).forEach(id=>{

    const user = data[id];

    const div =
      document.createElement("div");

    div.className = "member";

    div.innerHTML = `

      <div class="memberAvatar">
        🎙️
      </div>

      <div>
        ${escapeHtml(user.name || "Guest")}
      </div>

    `;

    box.appendChild(div);

/* =========================
   CONNECT USER
========================= */

function connectToUser(user){

  if(!peer || !stream) return;

  if(!user.peerId) return;

  if(calls[user.id]) return;

  if(user.id === myId) return;

  try{

    const call =
      peer.call(user.peerId,stream);

    calls[user.id] = call;

    call.on("stream",function(remoteStream){

      addAudio(user.id,remoteStream);

    });

    call.on("close",function(){

      delete calls[user.id];

    });

  }catch(e){

    console.log(e);

  }

}


/* =========================
   AUDIO
========================= */

function addAudio(id,remoteStream){

  let audio =
    document.getElementById("audio-"+id);

  if(!audio){

    audio =
      document.createElement("audio");

    audio.id = "audio-"+id;

    audio.autoplay = true;
    audio.playsInline = true;

    document
      .getElementById("audioContainer")
      .appendChild(audio);

  }

  audio.srcObject = remoteStream;

}


/* =========================
   MIC
========================= */

function toggleMic(){

  if(!stream) return;

  const tracks =
    stream.getAudioTracks();

  if(!tracks.length) return;

  micOn = !micOn;

  tracks.forEach(track=>{
    track.enabled = micOn;
  });

  db.ref(
    "rooms/"+roomId+"/users/"+myId+"/mic"
  ).set(micOn);

  const btn =
    document.getElementById("micBtn");

  btn.classList.toggle("active",micOn);

  btn.querySelector("label").innerText =
    micOn ? "Mic ON" : "Mic OFF";

  document.getElementById("ownerMic").innerText =
    micOn ? "🎤" : "🔇";

}

function listenChat(){

  db.ref(
    "rooms/"+roomId+"/chat"
  ).limitToLast(50)
   .on("value",snapshot=>{

    const data =
      snapshot.val() || {};

    const box =
      document.getElementById("chatMessages");

    if(!box) return;

    box.innerHTML = "";

    Object.keys(data).forEach(id=>{

      const msg = data[id];

      box.innerHTML += `

        <div class="chatMsg">
          <b>${escapeHtml(msg.name)}</b>:
          ${escapeHtml(msg.text)}
        </div>

      `;

    });

    box.scrollTop = box.scrollHeight;

  });

}

========================= */

  setTimeout(()=>{

    toast.style.display = "none";

  },2200);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
