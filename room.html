<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,sans-serif;
  background:#160b2b;
  color:#fff;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(circle at 50% 20%,#54218c 0,#261044 35%,#13091f 75%);
  position:relative;
  overflow:hidden;
}

/* HEADER */

.header{
  height:72px;
  display:flex;
  align-items:center;
  padding:8px 10px;
  gap:8px;
  background:rgba(20,5,35,.55);
}

.back{
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:23px;
}

.roomDp{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ffd35a;
}

.roomInfo{
  flex:1;
  min-width:0;
}

.roomName{
  font-size:16px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomNo{
  font-size:11px;
  color:#d8cbea;
  margin-top:3px;
}

.headerBtns{
  display:flex;
  gap:5px;
}

.hBtn{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  color:white;
  background:rgba(255,255,255,.12);
  font-size:16px;
}

/* ROOM INFO */

.roomTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 12px 8px;
}

.online{
  background:rgba(0,0,0,.25);
  padding:5px 10px;
  border-radius:15px;
  font-size:12px;
}

.host{
  text-align:center;
  margin-top:5px;
}

.hostAvatar{
  position:relative;
  display:inline-block;
}

.hostAvatar img{
  width:76px;
  height:76px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ffd55c;
  box-shadow:0 0 18px rgba(255,203,67,.5);
}

.crown{
  position:absolute;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
  font-size:24px;
}

.seatName{
  margin-top:5px;
  font-size:13px;
  font-weight:bold;
  max-width:100px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* SEATS */

.seats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px 7px;
  padding:15px 12px 8px;
}

.seat{
  text-align:center;
  min-width:0;
}

.avatarWrap{
  width:58px;
  height:58px;
  margin:auto;
  position:relative;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.4);
  background:#302044;
}

.empty{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  color:#bba9d0;
}

.micDot{
  position:absolute;
  right:-2px;
  bottom:0;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#21d16f;
  border:2px solid #190b2b;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.name{
  font-size:11px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:0 2px;
}

/* FEATURES */

.featureRow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:10px 8px;
  border-top:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.feature{
  text-align:center;
  font-size:10px;
  color:#eee;
}

.featureIcon{
  width:38px;
  height:38px;
  border-radius:50%;
  margin:auto auto 4px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#7136b4,#30205d);
  font-size:19px;
}

/* EXP */

.expBox{
  margin:9px 10px;
  padding:9px;
  border-radius:12px;
  background:rgba(0,0,0,.2);
}

.expTitle{
  font-size:12px;
  color:#ffd75e;
  margin-bottom:7px;
}

.expRanks{
  display:flex;
  justify-content:space-around;
}

.rank{
  text-align:center;
  font-size:11px;
}

.rankAvatar{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #ffd65d;
  margin-bottom:3px;
}

/* CHAT */

.chat{
  height:160px;
  overflow-y:auto;
  padding:8px 10px 80px;
}

.msg{
  margin-bottom:6px;
  font-size:12px;
}

.msg b{
  color:#ffd45b;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:480px;
  padding:8px;
  background:rgba(15,5,27,.97);
  border-top:1px solid rgba(255,255,255,.1);
  z-index:50;
}

.bottomRow{
  display:flex;
  align-items:center;
  gap:5px;
}

.input{
  flex:1;
  height:40px;
  border:none;
  outline:none;
  border-radius:20px;
  padding:0 13px;
  color:#fff;
  background:#2d1943;
}

.iconBtn{
  width:39px;
  height:39px;
  flex:none;
  border:0;
  border-radius:50%;
  color:#fff;
  background:#392052;
  font-size:17px;
}

.micOn{
  background:#16a864;
}

.micOff{
  background:#8d2b50;
}

/* EMOJI */

.emojiPanel{
  display:none;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
  padding:10px;
  margin-bottom:7px;
  background:#251337;
  border-radius:12px;
  max-height:180px;
  overflow-y:auto;
}

.emojiPanel.show{
  display:grid;
}

.emoji{
  border:0;
  background:none;
  font-size:23px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.7);
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:480px;
  background:#251337;
  border-radius:22px 22px 0 0;
  padding:20px;
}

.modalTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

.modalBtn{
  width:100%;
  height:45px;
  border:0;
  border-radius:12px;
  margin-top:9px;
  background:#44245e;
  color:#fff;
  font-size:14px;
}

.danger{
  background:#a52e4e;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:78px;
  transform:translateX(-50%);
  background:#000;
  color:#fff;
  padding:9px 15px;
  border-radius:20px;
  font-size:12px;
  z-index:200;
  display:none;
}

.toast.show{
  display:block;
}

/* STATUS */

.status{
  text-align:center;
  font-size:10px;
  color:#bcaecc;
  padding:3px;
}
</style>
</head>

<body>

<!-- SETTINGS -->

<script>

/* =========================================================
   PAWANVOICE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    apiKey:
  "YAHAN_APNI_FIREBASE_API_KEY_DALO",

  authDomain:
    "pawanvoice-68c5e.firebaseapp.com",

  databaseURL:
    "https://pawanvoice-68c5e-default-rtdb.firebaseio.com",

  projectId:
    "pawanvoice-68c5e",

  storageBucket:
    "pawanvoice-68c5e.firebasestorage.app",

  messagingSenderId:
    "148446327241",

  appId:
    "1:148446327241:web:6bac9cb9ad0fb530cbb818",

  measurementId:
    "G-S98P3GBNCK"

};

try{
  firebase.initializeApp(firebaseConfig);
}catch(e){
  console.log("Firebase:",e);
}

let database = null;

try{
  database = firebase.database();
}catch(e){
  console.log("Firebase database unavailable");
}


/* =========================================================
   URL DATA
========================================================= */

const params = new URLSearchParams(location.search);

const roomId =
  params.get("room") ||
  "10001";

const userId =
  params.get("userid") ||
  localStorage.getItem("pv_userId") ||
  ("PV" + Math.floor(10000 + Math.random()*90000));

const userName =
  params.get("name") ||
  localStorage.getItem("pv_name") ||
  "Pawan";

const userDp =
  params.get("dp") ||
  localStorage.getItem("pv_dp") ||
  "https://i.pravatar.cc/150?img=12";

const roomTitle =
  params.get("title") ||
  "PawanVoice Room";


localStorage.setItem("pv_userId",userId);
localStorage.setItem("pv_name",userName);
localStorage.setItem("pv_dp",userDp);


/* =========================================================
   UI
========================================================= */

document.getElementById("roomName").textContent =
  roomTitle;

document.getElementById("roomNo").textContent =
  "Room " + roomId;

document.getElementById("roomDp").src =
  userDp;

document.getElementById("hostAvatar").src =
  userDp;

document.getElementById("hostName").textContent =
  userName;


/* =========================================================
   SEATS
========================================================= */

const seatsEl =
  document.getElementById("seats");

for(let i=2;i<=9;i++){

  const div =
    document.createElement("div");

  div.className="seat";

  div.innerHTML=`

    <div class="avatarWrap">

      <div
        id="avatar-${i}"
        class="avatar empty">
        +
      </div>

    </div>

    <div
      id="name-${i}"
      class="name">
      Seat ${i}
    </div>

  `;

  seatsEl.appendChild(div);
}


/* =========================================================
   SOCKET.IO
========================================================= */

const socket =
  io("https://pawanvoice-1.onrender.com",{
    transports:["websocket","polling"]
  });


let socketConnected = false;

let joined = false;


/* =========================================================
   WEBRTC VARIABLES
========================================================= */

let localStream = null;

let micEnabled = false;

let speakerEnabled = true;

const peers = {};

const pendingIce = {};

const remoteAudios = {};


/* =========================================================
   STUN
========================================================= */

const rtcConfig = {

  iceServers:[

    {
      urls:"stun:stun.l.google.com:19302"
    },

    {
      urls:"stun:stun1.l.google.com:19302"
    }

  ]

};


/* =========================================================
   SOCKET CONNECT
========================================================= */

socket.on("connect",async()=>{

  socketConnected=true;

  document.getElementById(
    "connectionStatus"
  ).textContent="Connected";

  console.log(
    "Socket connected:",
    socket.id
  );


  /*
   * IMPORTANT:
   * पहले microphone शुरू होगा।
   */

  await startMicrophone();


  /*
   * Microphone stream को पूरी तरह ready
   * होने का छोटा सा समय।
   */

  setTimeout(()=>{

    console.log("Voice system ready");

    /*
     * अब room join करें।
     * इससे server existing users भेजेगा
     * और existingUsers handler के समय
     * localStream पहले से मौजूद होगा।
     */

    socket.emit("joinRoom",{

      roomId:roomId,

      userId:userId,

      nickname:userName,

      dp:userDp

    });

    joined=true;

  },500);

});


/* =========================================================
   SOCKET ERROR
========================================================= */

socket.on("connect_error",(error)=>{

  console.log("Socket error:",error);

  document.getElementById(
    "connectionStatus"
  ).textContent="Server error";

  toast("Room server connect नहीं हुआ");

});


/* =========================================================
   MICROPHONE
========================================================= */

async function startMicrophone(){

  if(localStream) return true;

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },

        video:false

      });

    /*
     * Start में microphone OFF रखें।
     * लेकिन audio track मौजूद रहेगा,
     * इसलिए WebRTC offer में audio track
     * सही तरीके से जा सकता है।
     */

    localStream
      .getAudioTracks()
      .forEach(track=>{
        track.enabled=false;
      });

    micEnabled=false;

    updateMicButton();

    console.log(
      "Microphone stream ready"
    );

    return true;

  }catch(error){

    console.log(
      "Microphone permission error:",
      error
    );

    toast(
      "Microphone permission दें"
    );

    return false;

  }

}


/* =========================================================
   MIC TOGGLE
========================================================= */

async function toggleMic(){

  if(!localStream){

    const ok =
      await startMicrophone();

    if(!ok) return;

  }

  micEnabled=!micEnabled;

  localStream
    .getAudioTracks()
    .forEach(track=>{
      track.enabled=micEnabled;
    });

  updateMicButton();

  socket.emit("micStatus",{

    roomId:roomId,

    userId:userId,

    micOn:micEnabled

  });

}


/* =========================================================
   MIC BUTTON
========================================================= */

function updateMicButton(){

  const btn =
    document.getElementById("micBtn");

  if(micEnabled){

    btn.classList.remove("micOff");

    btn.classList.add("micOn");

    btn.textContent="🎙️";

  }else{

    btn.classList.remove("micOn");

    btn.classList.add("micOff");

    btn.textContent="🔇";

  }

}


/* =========================================================
   EXISTING USERS
========================================================= */

socket.on("existingUsers",async(users)=>{

  console.log(
    "Existing users:",
    users
  );


  /*
   * सबसे important fix:
   * अगर किसी कारण localStream अभी भी ready नहीं है,
   * तो 500ms बाद दोबारा check करें।
   */

  if(!localStream){

    console.log(
      "Waiting for microphone..."
    );

    await new Promise(resolve=>{
      setTimeout(resolve,500);
    });

  }


  /*
   * अब हर existing user को offer भेजें।
   */

  for(const user of users){

    if(!user) continue;

    if(user.userId===userId) continue;

    if(!user.socketId) continue;

    console.log(
      "Creating offer for:",
      user.nickname,
      user.socketId
    );

    await makeOffer(
      user.socketId
    );

  }

});


/* =========================================================
   NEW USER
========================================================= */

socket.on("newUser",(user)=>{

  console.log(
    "New user joined:",
    user
  );

  updateOnlineCount();

});


/* =========================================================
   CREATE PEER
========================================================= */

function createPeer(remoteSocketId){

  if(peers[remoteSocketId]){

    return peers[remoteSocketId];

  }


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peers[remoteSocketId]=pc;


  /*
   * LOCAL AUDIO TRACK
   */

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{

        pc.addTrack(
          track,
          localStream
        );

      });

  }


  /*
   * ICE
   */

  pc.onicecandidate=(event)=>{

    if(event.candidate){

      socket.emit(
        "webrtc-ice",
        {

          to:remoteSocketId,

          candidate:event.candidate

        }
      );

    }

  };


  /*
   * REMOTE AUDIO
   */

  pc.ontrack=(event)=>{

    console.log(
      "Remote audio received",
      remoteSocketId
    );

    let audio =
      remoteAudios[remoteSocketId];

    if(!audio){

      audio =
        document.createElement("audio");

      audio.autoplay=true;

      audio.playsInline=true;

      audio.controls=false;

      audio.style.display="none";

      document.body.appendChild(
        audio
      );

      remoteAudios[
        remoteSocketId
      ]=audio;

    }

    if(event.streams &&
       event.streams[0]){

      audio.srcObject =
        event.streams[0];

    }

    if(speakerEnabled){

      audio.play().catch(()=>{});

    }

  };


  pc.onconnectionstatechange=()=>{

    console.log(
      "Peer state:",
      remoteSocketId,
      pc.connectionState
    );

    if(
      pc.connectionState==="failed" ||
      pc.connectionState==="closed"
    ){

      removePeer(
        remoteSocketId
      );

    }

  };


  return pc;

}


/* =========================================================
   MAKE OFFER
========================================================= */

async function makeOffer(remoteSocketId){

  try{

    const pc =
      createPeer(
        remoteSocketId
      );


    /*
     * Wait for local audio track.
     */

    if(!localStream){

      console.log(
        "No local stream yet"
      );

      return;

    }


    const offer =
      await pc.createOffer({

        offerToReceiveAudio:true

      });


    await pc.setLocalDescription(
      offer
    );


    socket.emit(
      "webrtc-offer",
      {

        to:remoteSocketId,

        offer:pc.localDescription

      }
    );


    console.log(
      "Offer sent:",
      remoteSocketId
    );

  }catch(error){

    console.log(
      "Offer error:",
      error
    );

  }

}


/* =========================================================
   OFFER RECEIVED
========================================================= */

socket.on(
  "webrtc-offer",
  async(data)=>{

    try{

      const from =
        data.from ||
        data.socketId;

      if(!from) return;


      const pc =
        createPeer(from);


      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );


      /*
       * Pending ICE candidates
       */

      if(
        pendingIce[from] &&
        pendingIce[from].length
      ){

        for(
          const candidate
          of pendingIce[from]
        ){

          try{

            await pc.addIceCandidate(
              new RTCIceCandidate(
                candidate
              )
            );

          }catch(e){

            console.log(
              "ICE error:",
              e
            );

          }

        }

        pendingIce[from]=[];

      }


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      socket.emit(
        "webrtc-answer",
        {

          to:from,

          answer:pc.localDescription

        }
      );


      console.log(
        "Answer sent:",
        from
      );

    }catch(error){

      console.log(
        "Offer handling error:",
        error
      );

    }

  }
);


/* =========================================================
   ANSWER RECEIVED
========================================================= */

socket.on(
  "webrtc-answer",
  async(data)=>{

    try{

      const from =
        data.from ||
        data.socketId;

      if(!from) return;

      const pc =
        peers[from];

      if(!pc) return;


      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );


      /*
       * Pending ICE
       */

      if(
        pendingIce[from] &&
        pendingIce[from].length
      ){

        for(
          const candidate
          of pendingIce[from]
        ){

          try{

            await pc.addIceCandidate(
              new RTCIceCandidate(
                candidate
              )
            );

          }catch(e){

            console.log(
              e
            );

          }

        }

        pendingIce[from]=[];

      }


      console.log(
        "Answer received:",
        from
      );

    }catch(error){

      console.log(
        "Answer error:",
        error
      );

    }

  }
);


/* =========================================================
   ICE RECEIVED
========================================================= */

socket.on(
  "webrtc-ice",
  async(data)=>{

    try{

      const from =
        data.from ||
        data.socketId;

      if(!from) return;

      const pc =
        peers[from];


      if(
        !pc ||
        !pc.remoteDescription
      ){

        if(!pendingIce[from]){

          pendingIce[from]=[];

        }

        pendingIce[from].push(
          data.candidate
        );

        return;

      }


      await pc.addIceCandidate(

        new RTCIceCandidate(
          data.candidate
        )

      );

    }catch(error){

      console.log(
        "ICE receive error:",
        error
      );

    }

  }
);


/* =========================================================
   PEER LEFT
========================================================= */

socket.on(
  "peerLeft",
  (socketId)=>{

    removePeer(
      socketId
    );

    updateOnlineCount();

  }
);


/* =========================================================
   REMOVE PEER
========================================================= */

function removePeer(socketId){

  if(peers[socketId]){

    try{

      peers[socketId].close();

    }catch(e){}

    delete peers[socketId];

  }


  if(remoteAudios[socketId]){

    try{

      remoteAudios[
        socketId
      ].pause();

      remoteAudios[
        socketId
      ].srcObject=null;

      remoteAudios[
        socketId
      ].remove();

    }catch(e){}

    delete remoteAudios[
      socketId
    ];

  }


  delete pendingIce[
    socketId
  ];

}

/* =========================================================
   CHAT SEND
========================================================= */

const messageInput =
  document.getElementById(
    "messageInput"
  );


messageInput.addEventListener(
  "keydown",
  (event)=>{

    if(
      event.key==="Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


function sendMessage(){

  const message =
    messageInput.value.trim();

  if(!message) return;


  socket.emit(
    "message",
    {

      roomId:roomId,

      userId:userId,

      nickname:userName,

      message:message

    }
  );


  addMessage(
    userName,
    message
  );

  messageInput.value="";

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  name,
  message
){

  const chat =
    document.getElementById(
      "chat"
    );


  const div =
    document.createElement(
      "div"
    );

  div.className="msg";

  const b =
    document.createElement(
      "b"
    );

  b.textContent=
    name + ": ";

  div.appendChild(b);

  div.appendChild(
    document.createTextNode(
      message
    )
  );

  chat.appendChild(div);

  chat.scrollTop=
    chat.scrollHeight;

}

function saveFirebaseUser(){

  if(!database) return;

  try{

    database
      .ref(
        "users/" +
        userId
      )
      .update({

        userId:userId,

        name:userName,

        dp:userDp,

        lastSeen:
          Date.now()

      });


    database
      .ref(
        "rooms/" +
        roomId +
        "/users/" +
        userId
      )
      .set({

        userId:userId,

        name:userName,

        dp:userDp,

        joinedAt:
          Date.now()

      });

  }catch(error){

    console.log(
      "Firebase write error:",
      error
    );

  }

}

/* =========================================================
   INVITE
========================================================= */

async function inviteRoom(){

  const url =
    location.origin +
    "/room.html?room=" +
    encodeURIComponent(roomId);


  try{

    if(
      navigator.share
    ){

      await navigator.share({

        title:
          "Join PawanVoice Room",

        text:
          userName +
          " invited you to PawanVoice Room",

        url:url

      });

    }else{

      await navigator.clipboard.writeText(
        url
      );

      toast(
        "Room link copied"
      );

    }

  }catch(error){

    console.log(
      error
    );

  }

}

/* =========================================================
   LEAVE ROOM
========================================================= */

function leaveRoom(){

  try{

    socket.emit(
      "leaveRoom",
      {

        roomId:roomId,

        userId:userId

      }
    );

  }catch(e){}


  Object.values(
    peers
  ).forEach(pc=>{

    try{

      pc.close();

    }catch(e){}

  });


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

  }


  location.href =
    "/";

}

   BACK
========================================================= */

function goHome(){

  leaveRoom();

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent=
    message;

  el.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(()=>{

      el.classList.remove(
        "show"
      );

    },2200);

}
