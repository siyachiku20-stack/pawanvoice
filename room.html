<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>PawanVoice Room</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.app{
  width:100%;
  max-width:480px;
  height:100vh;
  margin:auto;
  background:
    radial-gradient(circle at top,#45206c 0,#171027 45%,#08080d 100%);
  position:relative;
  overflow:hidden;
}

/* HEADER */

.header{
  height:65px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 10px;
  background:rgba(0,0,0,.28);
}

.back{
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:22px;
}

.roomDp{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#6c36a8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  overflow:hidden;
}

.roomDp img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.roomInfo{
  flex:1;
  min-width:0;
}

.roomName{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomId{
  font-size:11px;
  color:#bbb;
  margin-top:4px;
}

.headerBtn{
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:18px;
}

/* ROOM INFO */

.roomTop{
  padding:7px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.online{
  font-size:13px;
  color:#ddd;
}

.roomButtons{
  display:flex;
  gap:7px;
}

.smallBtn{
  border:0;
  color:#fff;
  background:rgba(255,255,255,.12);
  border-radius:15px;
  padding:7px 10px;
  font-size:11px;
}

/* SEATS */

.seats{
  padding:15px 15px 5px;
}

.hostSeat{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}

.rows{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px 8px;
}

.seatBox{
  text-align:center;
  min-width:0;
}

.avatar{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:linear-gradient(135deg,#482064,#9b4dd4);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  position:relative;
  overflow:hidden;
}

.hostSeat .avatar{
  width:70px;
  height:70px;
  border-color:#ffd34d;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.empty{
  background:rgba(255,255,255,.08);
  border:1px dashed rgba(255,255,255,.3);
  color:#aaa;
  cursor:pointer;
}

.seatNumber{
  position:absolute;
  bottom:0;
  right:0;
  background:#222;
  font-size:9px;
  padding:3px 5px;
  border-radius:8px 0 0 0;
}

.micDot{
  position:absolute;
  left:0;
  bottom:0;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#2cbd62;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.name{
  font-size:11px;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#eee;
}

/* TOOLS */

.tools{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:13px 8px;
  border-top:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.tool{
  border:0;
  background:transparent;
  color:#fff;
  font-size:10px;
}

.toolIcon{
  width:36px;
  height:36px;
  margin:auto;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  margin-bottom:4px;
}

/* EXP */

.expBox{
  padding:9px 12px;
}

.expTitle{
  font-size:12px;
  color:#ffd65a;
  margin-bottom:7px;
}

.expUsers{
  display:flex;
  justify-content:space-around;
}

.expUser{
  text-align:center;
  font-size:10px;
}

.expAvatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#63318b;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:auto auto 4px;
}

/* CHAT */

.chat{
  position:absolute;
  left:0;
  right:0;
  bottom:66px;
  height:150px;
  overflow-y:auto;
  padding:8px 10px;
  background:linear-gradient(transparent,rgba(0,0,0,.45));
}

.msg{
  display:table;
  max-width:90%;
  margin:5px 0;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(0,0,0,.42);
  font-size:12px;
}

.msg b{
  color:#ffd45b;
}

.system{
  color:#aaa;
  font-size:11px;
  margin:5px 0;
}

/* BOTTOM */

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:66px;
  padding:7px;
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(10,8,15,.96);
}

.inputBox{
  flex:1;
  height:42px;
  display:flex;
  align-items:center;
  background:#25212b;
  border-radius:22px;
  padding-left:12px;
}

.inputBox input{
  flex:1;
  background:none;
  border:0;
  outline:none;
  color:#fff;
  font-size:13px;
  min-width:0;
}

.iconBtn{
  width:39px;
  height:39px;
  border:0;
  border-radius:50%;
  background:#29242f;
  color:#fff;
  font-size:18px;
}

/* MODAL */

.modal{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:flex-end;
  z-index:50;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  background:#201b29;
  border-radius:22px 22px 0 0;
  padding:18px;
  max-height:80vh;
  overflow-y:auto;
}

.sheet h3{
  margin-bottom:15px;
}

.close{
  float:right;
  border:0;
  background:none;
  color:#fff;
  font-size:22px;
}

.option{
  width:100%;
  border:0;
  color:#fff;
  text-align:left;
  padding:13px;
  margin:5px 0;
  border-radius:10px;
  background:#30293a;
}

/* EMOJI */

.emojiGrid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:8px;
}

.emojiGrid button{
  border:0;
  background:#30293a;
  border-radius:8px;
  padding:8px 2px;
  font-size:21px;
}

/* GIFT */

.giftGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.gift{
  border:0;
  background:#30293a;
  color:#fff;
  border-radius:12px;
  padding:12px 4px;
  font-size:11px;
}

.gift span{
  display:block;
  font-size:28px;
  margin-bottom:5px;
}

/* TOAST */

.toast{
  position:absolute;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#000;
  padding:9px 14px;
  border-radius:20px;
  font-size:12px;
  display:none;
  z-index:100;
  white-space:nowrap;
}
</style>
</head>

<script>

/* ==========================================
   USER DATA
========================================== */

const params = new URLSearchParams(location.search);

const roomId =
  params.get("room") ||
  localStorage.getItem("pv_room") ||
  "10001";

const myUserId =
  params.get("userid") ||
  localStorage.getItem("pv_userId") ||
  ("guest_" + Math.random().toString(36).slice(2,8));

const myName =
  params.get("name") ||
  localStorage.getItem("pv_name") ||
  "Guest";

const myDp =
  localStorage.getItem("pv_dp") || "";

document.getElementById("roomIdText").textContent = roomId;

document.getElementById("roomName").textContent =
  params.get("roomName") ||
  "PawanVoice Room";

/* ==========================================
   SOCKET
========================================== */

const socket = io({
  transports: ["websocket", "polling"]
});

let roomUsers = [];
let hostSocketId = null;
let mySeat = null;

let localStream = null;
let micEnabled = false;
let speakerEnabled = true;

const peers = {};
const remoteAudios = {};

/* ==========================================
   CONNECT
========================================== */

socket.on("connect", () => {

  addSystem("Connected to PawanVoice server");

  socket.emit("join-room", {
    roomId: roomId,
    userId: myUserId,
    name: myName,
    dp: myDp
  });

});

/* ==========================================
   JOINED
========================================== */

socket.on("joined-room", (data) => {

  hostSocketId = data.hostSocketId;

  addSystem("Joined room " + roomId);

});

/* ==========================================
   ROOM STATE
========================================== */

socket.on("room-state", (data) => {

  roomUsers = data.users || [];

  hostSocketId = data.hostSocketId;

  document.getElementById("onlineCount").textContent =
    data.count || 0;

  renderSeats();

  renderAdmin();

});

/* ==========================================
   RENDER SEATS
========================================== */

function renderSeats(){

  for(let i=1;i<=9;i++){

    const avatar =
      document.getElementById("seat"+i);

    const name =
      document.getElementById("name"+i);

    if(!avatar || !name) continue;

    const user =
      roomUsers.find(u => Number(u.seat) === i);

    if(user){

      avatar.classList.remove("empty");

      if(user.dp){

        avatar.innerHTML =
          '<img src="' +
          escapeHtml(user.dp) +
          '">' +
          '<span class="seatNumber">'+i+'</span>' +
          '<span class="micDot">' +
          (user.mic ? "🎙️" : "🔇") +
          '</span>';

      }else{

        avatar.innerHTML =
          escapeHtml(
            user.name
              ? user.name.charAt(0).toUpperCase()
              : "👤"
          ) +
          '<span class="seatNumber">'+i+'</span>' +
          '<span class="micDot">' +
          (user.mic ? "🎙️" : "🔇") +
          '</span>';

      }

      name.textContent =
        user.name +
        (user.socketId === hostSocketId ? " 👑" : "");

    }else{

      avatar.classList.add("empty");

      avatar.innerHTML =
        '+' +
        '<span class="seatNumber">'+i+'</span>';

      name.textContent =
        i === 1 ? "Host Seat" : "Seat " + i;
    }
  }

  const me =
    roomUsers.find(u => u.socketId === socket.id);

  mySeat = me ? me.seat : null;

}

/* ==========================================
   TAKE SEAT
========================================== */

function takeSeat(seat){

  const occupied =
    roomUsers.find(u => Number(u.seat) === Number(seat));

  if(occupied){

    if(occupied.socketId === socket.id){

      socket.emit("leave-seat");

      stopMicrophone();

    }else{

      showToast("Seat already occupied");

    }

    return;
  }

  socket.emit("take-seat", seat);

}

/* ==========================================
   MIC
========================================== */

async function toggleMic(){

  const me =
    roomUsers.find(u => u.socketId === socket.id);

  if(!me || !me.seat){

    showToast("पहले seat लो");

    return;
  }

  if(me.mutedByAdmin){

    showToast("Admin ने mute किया है");

    return;
  }

  if(!localStream){

    try{

      localStream =
        await navigator.mediaDevices.getUserMedia({
          audio:true,
          video:false
        });

    }catch(error){

      console.log(error);

      showToast(
        "Microphone permission Allow करें"
      );

      return;
    }
  }

  micEnabled = !micEnabled;

  localStream.getAudioTracks().forEach(track => {
    track.enabled = micEnabled;
  });

  document.getElementById("micBtn").textContent =
    micEnabled ? "🎙️" : "🔇";

  socket.emit("mic-status", micEnabled);

  /* Add stream to peers */

  if(micEnabled){

    for(const peerId in peers){

      const pc = peers[peerId];

      localStream.getTracks().forEach(track => {

        const exists =
          pc.getSenders().some(
            sender => sender.track === track
          );

        if(!exists){
          pc.addTrack(track, localStream);
        }

      });

      try{

        const offer =
          await pc.createOffer();

        await pc.setLocalDescription(offer);

        socket.emit("webrtc-offer", {
          target: peerId,
          offer: pc.localDescription
        });

      }catch(e){
        console.log(e);
      }
    }

  }

}

/* ==========================================
   STOP MIC
========================================== */

function stopMicrophone(){

  micEnabled = false;

  if(localStream){

    localStream.getAudioTracks().forEach(
      track => track.enabled = false
    );

  }

  document.getElementById("micBtn").textContent =
    "🔇";

  socket.emit("mic-status", false);

}

/* ==========================================
   SPEAKER
========================================== */

function toggleSpeaker(){

  speakerEnabled = !speakerEnabled;

  document
    .querySelectorAll("audio")
    .forEach(audio => {
      audio.muted = !speakerEnabled;
    });

  document.getElementById("speakerBtn").textContent =

  showToast(
    speakerEnabled
      ? "Speaker ON"
      : "Speaker OFF"
  );
}

/* ==========================================
   WEBRTC CONFIG
========================================== */

const rtcConfig = {

  iceServers: [

    {
      urls:"stun:stun.l.google.com:19302"
    },

    {
      urls:"stun:stun1.l.google.com:19302"
    }

  ]

};

/* ==========================================
   PEER
========================================== */

function createPeer(peerId){

  if(peers[peerId]){
    return peers[peerId];
  }

  const pc =
    new RTCPeerConnection(rtcConfig);

  peers[peerId] = pc;

  pc.onicecandidate = (event) => {

    if(event.candidate){

      socket.emit("webrtc-ice", {
        target:peerId,
        candidate:event.candidate
      });

    }

  };

  pc.ontrack = (event) => {

    let audio =
      remoteAudios[peerId];

    if(!audio){

      audio =
        document.createElement("audio");

      audio.autoplay = true;
      audio.playsInline = true;

      audio.muted = !speakerEnabled;

      document.body.appendChild(audio);

      remoteAudios[peerId] = audio;
    }

    if(audio.srcObject !== event.streams[0]){

      audio.srcObject =
        event.streams[0];

    }

  };

  pc.onconnectionstatechange = () => {

    if(
      pc.connectionState === "failed" ||
      pc.connectionState === "closed" ||
      pc.connectionState === "disconnected"
    ){

      removePeer(peerId);

    }

  };

  if(localStream && micEnabled){

    localStream.getTracks().forEach(track => {

      pc.addTrack(track, localStream);

    });

  }

  return pc;
}

/* ==========================================
   NEW PEER
========================================== */

socket.on("peer-joined", async (data) => {

  const peerId = data.socketId;

  /* Existing users create offer */

  if(socket.id < peerId){

    const pc =
      createPeer(peerId);

    try{

      const offer =
        await pc.createOffer();

      await pc.setLocalDescription(offer);

      socket.emit("webrtc-offer", {
        target:peerId,
        offer:pc.localDescription
      });

    }catch(e){

      console.log(e);

    }

  }

});

/* ==========================================
   OFFER
========================================== */

socket.on("webrtc-offer", async (data) => {

  const pc =
    createPeer(data.from);

  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(data.offer)
    );

    if(localStream && micEnabled){

      localStream.getTracks().forEach(track => {

        const exists =
          pc.getSenders().some(
            sender => sender.track === track
          );

        if(!exists){
          pc.addTrack(track,localStream);
        }

      });

    }

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(answer);

    socket.emit("webrtc-answer", {
      target:data.from,
      answer:pc.localDescription
    });

  }catch(e){

    console.log("Offer error",e);

  }

});

/* ==========================================
   ANSWER
========================================== */

socket.on("webrtc-answer", async (data) => {

  const pc =
    peers[data.from];

  if(!pc) return;

  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(data.answer)
    );

  }catch(e){

    console.log("Answer error",e);

  }

});

/* ==========================================
   ICE
========================================== */

socket.on("webrtc-ice", async (data) => {

  const pc =
    createPeer(data.from);

  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(data.candidate)
    );

  }catch(e){

    console.log("ICE error",e);

  }

});

/* ==========================================
   PEER LEFT
========================================== */

socket.on("peer-left", (data) => {

  removePeer(data.socketId);

});

/* ==========================================
   REMOVE PEER
========================================== */

function removePeer(peerId){

  if(peers[peerId]){

    try{
      peers[peerId].close();
    }catch(e){}

    delete peers[peerId];

  }

  if(remoteAudios[peerId]){

    remoteAudios[peerId].remove();

    delete remoteAudios[peerId];

  }

}

/* ==========================================
   CHAT
========================================== */

function handleEnter(event){

  if(event.key === "Enter"){

    sendMessage();

  }

}

function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const message =
    input.value.trim();

  if(!message) return;

  socket.emit(
    "chat-message",
    message
  );

  input.value = "";

}

socket.on("chat-message", (data) => {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className = "msg";

  div.innerHTML =
    "<b>" +
    escapeHtml(data.name) +
    ":</b> " +
    escapeHtml(data.message);

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

});

/* ==========================================
   ADMIN
========================================== */

function openAdmin(){

    .getElementById("adminModal")
    .classList.add("show");

}

function renderAdmin(){

  const box =
    document.getElementById("adminUsers");

  if(!box) return;

  box.innerHTML = "";

  const isHost =
    hostSocketId === socket.id;

  if(!isHost){

    box.innerHTML =
      '<div class="system">' +
      'Only room host can use admin controls.' +
      '</div>';

    return;

  }

  roomUsers.forEach(user => {

    if(user.socketId === socket.id) return;

    const row =
      document.createElement("div");

    row.innerHTML =
      '<button class="option" onclick="kickUser(\'' +
      user.socketId +
      '\')">👢 Kick ' +
      escapeHtml(user.name) +
      '</button>' +

      '<button class="option" onclick="muteUser(\'' +
      user.socketId +
      '\')">🔇 Mute ' +
      escapeHtml(user.name) +
      '</button>';

    box.appendChild(row);

  });

}

function kickUser(socketId){

  socket.emit(
    "admin-kick",
    socketId
  );

  closeModal("adminModal");

}

function muteUser(socketId){

    "admin-mute",

}

/* ==========================================
   SHARE
========================================== */

async function shareRoom(){

  const url =
    location.origin +
    "/room.html?room=" +
    encodeURIComponent(roomId) +
    "&userid=" +
    encodeURIComponent(myUserId) +
    "&name=" +
    encodeURIComponent(myName);

  if(navigator.share){

    try{

      await navigator.share({
        title:"PawanVoice Room",
        text:"Join my PawanVoice room",
        url:url
      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard.writeText(url);

      showToast("Room link copied");

    }catch(e){

      prompt("Copy room link:",url);

    }

  }

}

/* ==========================================
   LEAVE
========================================== */

function leaveRoom(){

  if(
    localStream
  ){

    localStream.getTracks()
      .forEach(track => track.stop());

  }

  Object.keys(peers).forEach(
    removePeer
  );

  socket.disconnect();

  location.href = "/";

}

/* ==========================================
   MODAL
========================================== */

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}

/* ==========================================
   TOAST
========================================== */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toast.style.display = "none";
    },2200);

}

/* ==========================================
   SYSTEM MESSAGE
========================================== */

function addSystem(message){

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "system";

  div.textContent =
    message;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}

/* ==========================================
   SAFE HTML
========================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* ==========================================
   PAGE EXIT
========================================== */

window.addEventListener(
  "beforeunload",
  () => {

    try{
      socket.disconnect();
    }catch(e){}

  }
);
