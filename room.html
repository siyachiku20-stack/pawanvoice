<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

body{
  margin:0;
  padding:15px;
  padding-bottom:20px;
  background:#111;
  color:white;
  font-family:Arial;
}

.header{
  background:#222;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.room-name{
  font-size:20px;
  font-weight:bold;
}

.members{
  color:#bbb;
  margin-top:5px;
}

.seats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:15px;
}

.seat{
  background:#222;
  border-radius:14px;
  min-height:110px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:2px solid #333;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#444;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin-bottom:6px;
}

.empty{
  color:#777;
  font-size:13px;
}

.name{
  font-size:14px;
  max-width:90px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.owner{
  color:#ffd700;
  font-size:11px;
}

.mic{
  font-size:16px;
  margin-top:4px;
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:15px 0;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-size:15px;
}

.micButton{
  background:#20a050;
  color:white;
}

.leaveButton{
  background:#d33;
  color:white;
}

.chat{
  background:#222;
  border-radius:12px;
  padding:12px;
  margin-top:15px;
}

.chatMessages{
  height:180px;
  overflow-y:auto;
  background:#151515;
  border-radius:8px;
  padding:8px;
}

.message{
  margin:7px 0;
  padding:7px;
  background:#292929;
  border-radius:7px;
}

.messageName{
  color:#6ab7ff;
  font-size:12px;
}

.chatInput{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.chatInput input{
  flex:1;
  padding:12px;
  border:0;
  border-radius:8px;
  font-size:15px;
}

.chatInput button{
  background:#267cff;
  color:white;
}

.status{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin-top:8px;
}

</style>

</head>

<body>

<div class="header">

<div class="room-name" id="roomName">
🎙️ PawanVoice Room
</div>

<div class="members">
👥 Members: <span id="memberCount">0</span>/9
</div>

<div class="category" id="roomCategory">
📂 General
  </div>
  
<div class="status" id="voiceStatus">
Voice connecting...
</div>

</div>


<div class="seats" id="seats">

<div class="seat" id="seat1">
<div class="avatar">👑</div>
<div class="empty">Seat 1</div>
</div>

<div class="seat" id="seat2">
<div class="avatar">🎤</div>
<div class="empty">Seat 2</div>
</div>

<div class="seat" id="seat3">
<div class="avatar">🎤</div>
<div class="empty">Seat 3</div>
</div>

<div class="seat" id="seat4">
<div class="avatar">🎤</div>
<div class="empty">Seat 4</div>
</div>

<div class="seat" id="seat5">
<div class="avatar">🎤</div>
<div class="empty">Seat 5</div>
</div>

<div class="seat" id="seat6">
<div class="avatar">🎤</div>
<div class="empty">Seat 6</div>
</div>

<div class="seat" id="seat7">
<div class="avatar">🎤</div>
<div class="empty">Seat 7</div>
</div>

<div class="seat" id="seat8">
<div class="avatar">🎤</div>
<div class="empty">Seat 8</div>
</div>

<div class="seat" id="seat9">
<div class="avatar">🎤</div>
<div class="empty">Seat 9</div>
</div>

</div>


<div class="controls">

<button class="micButton" id="micButton" onclick="toggleMic()">
🎤 Mic On
</button>

<button class="leaveButton" onclick="leaveRoom()">
🚪 Leave Room
</button>

</div>


<div class="chat">

<h3>💬 Room Chat</h3>

<div class="chatMessages" id="chatMessages">
</div>

<div class="chatInput">

<input
id="chatInput"
placeholder="Message likho..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>


<script>

const firebaseConfig={

apiKey:"AIzaSyDnlTdeG5aPHrUIV6kTYnM521GtbrrE",

authDomain:"pawanvoice-68c5e.firebaseapp.com",

databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com",

projectId:"pawanvoice-68c5e",

storageBucket:"pawanvoice-68c5e.firebasestorage.app",

messagingSenderId:"148446327241",

appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();


/* ROOM ID */

const params=new URLSearchParams(location.search);

const roomId=params.get("id");

if(!roomId){

alert("Room ID nahi mila");

location.href="index.html";

}


/* USER */

let myId=localStorage.getItem("pawanId");

let myName=localStorage.getItem("pawanName") || "User";


if(!myId){

myId="PW"+Date.now().toString().slice(-8);

localStorage.setItem("pawanId",myId);

}


/* ROOM */

let roomData=null;

let mySeat=null;

let micOn=false;

let localStream=null;

let peer=null;

let calls={};


/* FIREBASE ROOM */

db.ref("rooms/"+roomId).once("value").then(function(snapshot){

if(!snapshot.exists()){

alert("Room nahi mila");

location.href="index.html";

return;

}

roomData=snapshot.val();

document.getElementById("roomName").innerText=
"🎙️ "+(roomData.name || "PawanVoice Room");

enterRoom();

});


/* ENTER ROOM */

function enterRoom(){

db.ref("rooms/"+roomId+"/members").once("value").then(function(snapshot){

let members=snapshot.val() || {};

let ids=Object.keys(members);

if(ids.length>=9 && !members[myId]){

alert("Room full hai");

location.href="index.html";

return;

}


/* EXISTING MEMBER */

if(members[myId]){

mySeat=members[myId].seat;

}else{

let used=[];

ids.forEach(function(id){

if(members[id].seat){

used.push(Number(members[id].seat));

}

});

for(let i=1;i<=9;i++){

if(!used.includes(i)){

mySeat=i;

break;

}

}


db.ref("rooms/"+roomId+"/members/"+myId).set({

name:myName,

userId:myId,

seat:mySeat,

peerId:"",

mic:false,

joinedAt:Date.now()

});

}

updateMembers();

startVoice();

});

}


/* MEMBERS */

function updateMembers(){

db.ref("rooms/"+roomId+"/members").on("value",function(snapshot){

let members=snapshot.val() || {};

let ids=Object.keys(members);

document.getElementById("memberCount").innerText=ids.length;

for(let i=1;i<=9;i++){

let seat=document.getElementById("seat"+i);

let found=null;

ids.forEach(function(id){

if(Number(members[id].seat)===i){

found=members[id];

}

});

if(found){

let owner="";

if(roomData && found.userId===roomData.ownerId){

owner='<div class="owner">👑 Owner</div>';

}

let mic=found.mic ?
'<div class="mic">🎤</div>' :
'<div class="mic">🔇</div>';

seat.innerHTML=
'<div class="avatar">👤</div>'+
'<div class="name">'+escapeHtml(found.name)+'</div>'+
owner+
mic;

}else{

seat.innerHTML=
'<div class="avatar">🎤</div>'+
'<div class="empty">Seat '+i+'</div>';

}

}

});

}


/* LIVE VOICE */

async function startVoice(){

try{

localStream=await navigator.mediaDevices.getUserMedia({

audio:true

});

localStream.getAudioTracks().forEach(function(track){

track.enabled=false;

});

micOn=false;

document.getElementById("voiceStatus").innerText=
"🎙️ Voice ready";

createPeer();

}catch(error){

console.log(error);

document.getElementById("voiceStatus").innerText=
"🎙️ Mic permission required";

}

}


/* PEER */

function createPeer(){

let peerId=roomId+"_"+myId;

peer=new Peer(peerId);

peer.on("open",function(id){

db.ref("rooms/"+roomId+"/members/"+myId).update({

peerId:id

});

document.getElementById("voiceStatus").innerText=
"🟢 Live Voice Connected";

connectToMembers();

});


peer.on("call",function(call){

if(!localStream){

return;

}

call.answer(localStream);

calls[call.peer]=call;

call.on("stream",function(stream){

playRemoteStream(call.peer,stream);

});

});

peer.on("error",function(error){

console.log("Peer error",error);

});

}


/* CONNECT USERS */

function connectToMembers(){

db.ref("rooms/"+roomId+"/members").once("value").then(function(snapshot){

let members=snapshot.val() || {};

Object.keys(members).forEach(function(id){

let member=members[id];

if(id!==myId && member.peerId){

callUser(member.peerId);

}

});

});

}


/* CALL USER */

function callUser(peerId){

if(!localStream || !peer){

return;

}

if(calls[peerId]){

return;

}

let call=peer.call(peerId,localStream);

if(!call){

return;

}

calls[peerId]=call;

call.on("stream",function(stream){

playRemoteStream(peerId,stream);

});

call.on("close",function(){

delete calls[peerId];

});

}


/* AUDIO */

function playRemoteStream(peerId,stream){

let old=document.getElementById("audio_"+safeId(peerId));

if(old){

old.srcObject=stream;

return;

}

let audio=document.createElement("audio");

audio.id="audio_"+safeId(peerId);

audio.autoplay=true;

audio.playsInline=true;

audio.srcObject=stream;

document.body.appendChild(audio);

}


/* MIC */

function toggleMic(){

if(!localStream){

alert("Mic permission nahi mili");

return;

}

micOn=!micOn;

localStream.getAudioTracks().forEach(function(track){

track.enabled=micOn;

});

document.getElementById("micButton").innerText=
micOn ? "🔇 Mic Off" : "🎤 Mic On";

db.ref("rooms/"+roomId+"/members/"+myId).update({

mic:micOn

});

}


/* CHAT */

function sendMessage(){

let input=document.getElementById("chatInput");

let text=input.value.trim();

if(!text){

return;

}

db.ref("rooms/"+roomId+"/messages").push({

name:myName,

userId:myId,

text:text,

time:Date.now()

});

input.value="";

}


/* LOAD CHAT */

db.ref("rooms/"+roomId+"/messages").limitToLast(100).on("value",function(snapshot){

let box=document.getElementById("chatMessages");

box.innerHTML="";

snapshot.forEach(function(child){

let msg=child.val();

let div=document.createElement("div");

div.className="message";

div.innerHTML=
'<div class="messageName">'+
escapeHtml(msg.name || "User")+
'</div>'+
escapeHtml(msg.text || "");

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

});


/* LEAVE */

function leaveRoom(){

if(confirm("Room se bahar jana hai?")){

removeMe();

}

}


/* REMOVE MEMBER */

function removeMe(){

if(localStream){

localStream.getTracks().forEach(function(track){

track.stop();

});

}

Object.keys(calls).forEach(function(id){

try{

calls[id].close();

}catch(e){}

});

if(peer){

try{

peer.destroy();

}catch(e){}

}

db.ref("rooms/"+roomId+"/members/"+myId).remove().then(function(){

location.href="index.html";

});

}


/* PAGE CLOSE */

window.addEventListener("beforeunload",function(){

db.ref("rooms/"+roomId+"/members/"+myId).remove();

});


/* ESCAPE HTML */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* SAFE ID */

function safeId(text){

return String(text).replace(/[^a-zA-Z0-9_-]/g,"_");

}

</script>

</body>
</html>
