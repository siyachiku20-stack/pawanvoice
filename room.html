<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101018;
  color:#fff;
  overflow-x:hidden;
}
button,input,textarea,select{
  font:inherit;
}
button{
  border:0;
  cursor:pointer;
}
#app{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#29203c 0,#14131d 40%,#0c0c12 100%);
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:rgba(18,18,28,.95);
  border-bottom:1px solid #343445;
  position:sticky;
  top:0;
  z-index:20;
}
.roomDp{
  width:48px;
  height:48px;
  border-radius:50%;
  overflow:hidden;
  flex:none;
  border:2px solid #f4c95d;
  background:#292936;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}
.roomDp img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.roomInfo{
  min-width:0;
  flex:1;
}
.roomName{
  font-weight:bold;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.roomSub{
  color:#aaaabd;
  font-size:11px;
  margin-top:4px;
}
.headerBtns{
  display:flex;
  gap:5px;
  overflow-x:auto;
}
.iconBtn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#292938;
  color:#fff;
  font-size:18px;
  flex:none;
}
.iconBtn:active{
  transform:scale(.94);
}

/* ANNOUNCEMENT */
.announcement{
  margin:10px;
  padding:9px 12px;
  border-radius:12px;
  background:#211f2c;
  color:#e9e5f4;
  font-size:12px;
}

/* ROOM */
.roomArea{
  padding:10px 10px 130px;
}
.sectionTitle{
  text-align:center;
  color:#aaaabd;
  font-size:12px;
  margin:8px 0 12px;
}
.ownerSeat{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}
.seatRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  max-width:500px;
  margin:0 auto 18px;
}
.seat{
  text-align:center;
  min-width:0;
}
.seatCircle{
  width:66px;
  height:66px;
  max-width:100%;
  margin:auto;
  border-radius:50%;
  background:#242432;
  border:2px solid #3b3b4d;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:visible;
}
.seatCircle img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}
.emptyIcon{
  color:#77778a;
  font-size:26px;
}
.seatName{
  margin-top:7px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.seatId{
  color:#88889a;
  font-size:9px;
  margin-top:2px;
}
.ownerTag{
  position:absolute;
  bottom:-10px;
  left:50%;
  transform:translateX(-50%);
  background:#d9a928;
  color:#17130a;
  border-radius:8px;
  padding:3px 8px;
  font-size:9px;
  font-weight:bold;
  white-space:nowrap;
}
.vipTag{
  position:absolute;
  top:-6px;
  right:-4px;
  background:#9a58ff;
  border-radius:8px;
  padding:3px 5px;
  font-size:8px;
}
.micDot{
  position:absolute;
  bottom:0;
  right:0;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#333341;
  border:2px solid #101018;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.micOn{
  background:#23bd72;
}
.speaking{
  box-shadow:0 0 0 3px rgba(67,211,137,.4);
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:20px 0;
}
.stat{
  background:#1b1a25;
  border:1px solid #302f40;
  border-radius:12px;
  text-align:center;
  padding:9px 4px;
}
.stat b{
  display:block;
  font-size:16px;
}
.stat span{
  font-size:10px;
  color:#9999aa;
}

/* CHAT */
.chatBox{
  background:#15151e;
  border-radius:15px;
  border:1px solid #2b2a38;
  overflow:hidden;
}
.chatTitle{
  padding:10px;
  border-bottom:1px solid #2b2a38;
  font-size:13px;
  font-weight:bold;
}
.messages{
  height:180px;
  overflow-y:auto;
  padding:9px;
}
.msg{
  margin-bottom:8px;
  font-size:12px;
}
.msg b{
  color:#e8bd52;
}
.msg span{
  color:#ddd;
}

/* BOTTOM */
.bottomBar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  background:rgba(16,16,24,.98);
  border-top:1px solid #333243;
  padding:8px;
}
.chatInput{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}
.chatInput input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:#282735;
  color:#fff;
  border-radius:22px;
  padding:11px 14px;
}
.sendBtn{
  width:44px;
  border-radius:50%;
  background:#e1ad36;
  color:#17130b;
}
.bottomBtns{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}
.bottomBtn{
  background:#24232f;
  color:#fff;
  border-radius:12px;
  padding:8px 2px;
  font-size:17px;
}
.bottomBtn small{
  display:block;
  font-size:8px;
  color:#aaa;
  margin-top:2px;
}

/* MODAL */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.68);
  align-items:flex-end;
  justify-content:center;
}
.overlay.show{
  display:flex;
}
.panel{
  width:100%;
  max-width:560px;
  max-height:85vh;
  overflow-y:auto;
  background:#1a1924;
  border-radius:22px 22px 0 0;
  padding:16px;
  border:1px solid #3a3949;
  animation:up .18s ease;
}
@keyframes up{
  from{transform:translateY(40px);opacity:.3}
  to{transform:translateY(0);opacity:1}
}
.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.panelHead h3{
  margin:0;
  font-size:17px;
}
.close{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#2b2a38;
  color:#fff;
  font-size:18px;
}
.option{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  margin:7px 0;
  border-radius:13px;
  background:#24232f;
  color:#fff;
  text-align:left;
}
.option:active{
  transform:scale(.98);
}
.optionIcon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#302f3e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}
.optionText{
  flex:1;
}
.optionText b{
  display:block;
  font-size:13px;
}
.optionText span{
  display:block;
  color:#9696a7;
  font-size:10px;
  margin-top:3px;
}
.arrow{
  color:#777789;
}

/* FORMS */
.formGroup{
  margin-bottom:12px;
}
.formGroup label{
  display:block;
  font-size:11px;
  color:#aaaabd;
  margin-bottom:5px;
}
.formGroup input,
.formGroup textarea,
.formGroup select{
  width:100%;
  border:1px solid #393848;
  outline:0;
  background:#252430;
  color:#fff;
  border-radius:11px;
  padding:11px;
}
.formGroup textarea{
  min-height:90px;
  resize:vertical;
}
.saveBtn{
  width:100%;
  padding:12px;
  border-radius:12px;
  background:#dfac35;
  color:#17130a;
  font-weight:bold;
  margin-top:5px;
}

/* DP */
.bigDp{
  width:110px;
  height:110px;
  border-radius:50%;
  overflow:hidden;
  margin:8px auto 18px;
  border:3px solid #e3b63f;
  background:#2a2937;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}
.bigDp img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.fileBtn{
  display:block;
  width:100%;
  text-align:center;
  padding:12px;
  background:#292837;
  border-radius:12px;
  margin-bottom:8px;
  cursor:pointer;
}
.fileBtn input{
  display:none;
}

/* GIFT */
.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.gift{
  background:#252430;
  border-radius:13px;
  padding:11px 4px;
  text-align:center;
}
.giftIcon{
  font-size:25px;
}
.giftName{
  font-size:10px;
  margin-top:4px;
}
.giftPrice{
  color:#e4b94f;
  font-size:9px;
  margin-top:3px;
}

/* MINIMIZE */
#miniRoom{
  display:none;
  position:fixed;
  right:15px;
  bottom:20px;
  z-index:200;
  width:170px;
  padding:12px;
  background:#211f2c;
  border:1px solid #4b485e;
  border-radius:17px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
#miniRoom.show{
  display:block;
}
.miniTop{
  display:flex;
  align-items:center;
  gap:8px;
}
.miniDp{
  width:38px;
  height:38px;
  border-radius:50%;
  overflow:hidden;
  background:#30303e;
  display:flex;
  align-items:center;
  justify-content:center;
}
.miniDp img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.miniName{
  flex:1;
  font-size:12px;
}
.restoreBtn{
  margin-top:10px;
  width:100%;
  padding:8px;
  border-radius:10px;
  background:#dfac35;
  color:#17130a;
  font-weight:bold;
}

/* TOAST */
#toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  z-index:500;
  background:#2b2a37;
  color:#fff;
  padding:10px 15px;
  border-radius:20px;
  font-size:12px;
  display:none;
  max-width:90%;
  text-align:center;
}

/* RESPONSIVE */
@media(max-width:360px){
  .seatCircle{
    width:58px;
    height:58px;
  }
  .seatRow{
    gap:7px;
  }
  .headerBtns{
    max-width:160px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <header class="header">

    <button class="roomDp" onclick="openRoomDp()">
      <img id="headerRoomDp" style="display:none">
      <span id="headerRoomDpIcon">🏠</span>
    </button>

    <div class="roomInfo">
      <div class="roomName" id="roomName">PawanVoice Room</div>
      <div class="roomSub">
        ID: <span id="roomIdText">Loading...</span>
        • Owner: <span id="ownerName">Pawan</span>
      </div>
    </div>

    <div class="headerBtns">
      <button class="iconBtn" onclick="openSettings()">⚙️</button>
      <button class="iconBtn" onclick="openOnline()">👥</button>
      <button class="iconBtn" onclick="shareRoom()">↗️</button>
      <button class="iconBtn" onclick="copyRoomId()">📋</button>
      <button class="iconBtn" onclick="minimizeRoom()">➖</button>
      <button class="iconBtn" onclick="openInfo()">ℹ️</button>
      <button class="iconBtn" onclick="leaveRoom()">🚪</button>
    </div>

  </header>

  <div class="announcement" id="announcement">
    📢 Welcome to PawanVoice Room
  </div>

  <main class="roomArea">

    <div class="sectionTitle">🎙️ VOICE ROOM</div>

    <!-- OWNER -->
    <div class="ownerSeat">
      <div class="seat" id="ownerSeat"></div>
    </div>

    <!-- SEATS 2-5 -->
    <div class="seatRow" id="row1"></div>

    <!-- SEATS 6-9 -->
    <div class="seatRow" id="row2"></div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat">
        <b id="onlineCount">1</b>
        <span>Online</span>
      </div>
      <div class="stat">
        <b id="likeCount">0</b>
        <span>Likes</span>
      </div>
      <div class="stat">
        <b id="giftCount">0</b>
        <span>Gifts</span>
      </div>
    </div>

    <!-- CHAT -->
    <section class="chatBox">
      <div class="chatTitle">💬 Room Chat</div>
      <div class="messages" id="messages">
        <div class="msg">
          <b>System:</b>
          <span>Welcome to PawanVoice!</span>
        </div>
      </div>
    </section>

  </main>

  <!-- BOTTOM -->
  <div class="bottomBar">

    <div class="chatInput">
      <button class="bottomBtn" onclick="emoji()">😊</button>
      <input id="chatInput" placeholder="Type message...">
      <button class="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <div class="bottomBtns">

      <button class="bottomBtn" onclick="toggleSpeaker()">
        🔊
        <small>Speaker</small>
      </button>

      <button class="bottomBtn" id="micButton" onclick="toggleMic()">
        🎙️
        <small>Mic ON</small>
      </button>

      <button class="bottomBtn" onclick="openOnline()">
        👥
        <small>Users</small>
      </button>

      <button class="bottomBtn" onclick="openGifts()">
        🎁
        <small>Gift</small>
      </button>

      <button class="bottomBtn" onclick="openMore()">
        ⋮
        <small>More</small>
      </button>

      <button class="bottomBtn" onclick="sendLike()">
        ❤️
        <small>Like</small>
      </button>

    </div>
  </div>

</div>

<!-- MINIMIZED ROOM -->
<div id="miniRoom">

  <div class="miniTop">

    <div class="miniDp">
      <img id="miniRoomDp" style="display:none">
      <span id="miniRoomIcon">🏠</span>
    </div>

    <div class="miniName" id="miniRoomName">
      PawanVoice
    </div>

  </div>

  <button class="restoreBtn" onclick="restoreRoom()">
    ↗️ Restore Room
  </button>

</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- ROOM DP PANEL -->
<div class="overlay" id="dpOverlay">
  <div class="panel">

    <div class="panelHead">
      <h3>🖼️ Room DP</h3>
      <button class="close" onclick="closePanel('dpOverlay')">×</button>
    </div>

    <div class="bigDp">
      <img id="bigRoomDp" style="display:none">
      <span id="bigRoomDpIcon">🏠</span>
    </div>

    <button class="option" onclick="viewRoomDp()">
      <div class="optionIcon">👁️</div>
      <div class="optionText">
        <b>View Room DP</b>
        <span>Room profile picture dekhein</span>
      </div>
      <div class="arrow">›</div>
    </button>

    <div id="ownerDpOptions">

      <label class="fileBtn">
        🖼️ Change Room DP
        <input type="file" accept="image/*" onchange="changeRoomDp(event)">
      </label>

      <button class="option" onclick="removeRoomDp()">
        <div class="optionIcon">🗑️</div>
        <div class="optionText">
          <b>Remove Room DP</b>
          <span>Current room picture remove karein</span>
        </div>
        <div class="arrow">›</div>
      </button>

    </div>

  </div>
</div>

<!-- SETTINGS -->
<div class="overlay" id="settingsOverlay">
  <div class="panel">

    <div class="panelHead">
      <h3>⚙️ Room Settings</h3>
      <button class="close" onclick="closePanel('settingsOverlay')">×</button>
    </div>

    <button class="option" onclick="openSettingPage('basic')">
      <div class="optionIcon">🏠</div>
      <div class="optionText">
        <b>Basic Settings</b>
        <span>Room name, description, category</span>
      </div>
      <div class="arrow">›</div>
    </button>

    <button class="option" onclick="openSettingPage('privacy')">
      <div class="optionIcon">🔒</div>
      <div class="optionText">
        <b>Privacy</b>
        <span>Public, private, password</span>
      </div>
      <div class="arrow">›</div>
    </button>

    <button class="option" onclick="openSettingPage('seats')">
      <div class="optionIcon">💺</div>
      <div class="optionText">
        <b>Seat Settings</b>
        <span>Seat lock and speaker permissions</span>
      </div>
      <div class="arrow">›</div>
    </button>

    <button class="option" onclick="openSettingPage('voice')">
      <div class="optionIcon">🎙️</div>
      <div class="optionText">
        <b>Voice Settings</b>
        <span>Mic and speaker options</span>
      </div>
      <div class="arrow">›</div>
    </button>

    <button class="option" onclick="openSettingPage('admin')">
      <div class="optionIcon">🛡️</div>
      <div class="optionText">
        <b>Admin Settings</b>
        <span>Admin and moderation controls</span>
      </div>
      <div class="arrow">›</div>
    </button>

    <button class="option" onclick="openSettingPage('notice')">
      <div class="optionIcon">📢</div>
      <div class="optionText">
        <b>Announcement</b>
        <span>Room announcement change karein</span>
      </div>
      <div class="arrow">›</div>
    </button>

  </div>
</div>

<!-- SETTING DETAIL -->
<div class="overlay" id="settingDetailOverlay">
  <div class="panel">

    <div class="panelHead">
      <h3 id="settingTitle">Settings</h3>
      <button class="close" onclick="closePanel('settingDetailOverlay')">×</button>
    </div>

    <div id="settingContent"></div>

  </div>
</div>

<!-- ONLINE -->
<div class="overlay" id="onlineOverlay">
  <div class="panel">

    <div class="panelHead">
      <h3>👥 Online Users</h3>
      <button class="close" onclick="closePanel('onlineOverlay')">×</button>
    </div>

    <div id="onlineUsers"></div>

  </div>
</div>

<!-- INFO -->
<div class="overlay" id="infoOverlay">
  <div class="panel">

    <div class="panelHead">
      <h3>ℹ️ Room Information</h3>
      <button class="close" onclick="closePanel('infoOverlay')">×</button>
    </div>

    <div id="roomInfoContent"></div>

  </div>
</div>

<!-- GIFTS -->
<div class="overlay" id="giftOverlay">
  <div class="panel">

    <div class="panelHead">
      <h3>🎁 Gifts</h3>
      <button class="close" onclick="closePanel('giftOverlay')">×</button>
    </div>

    <div class="gifts">

      <button class="gift" onclick="sendGift('🌹','Rose',10)">
        <div class="giftIcon">🌹</div>
        <div class="giftName">Rose</div>
        <div class="giftPrice">10 🪙</div>
      </button>

      <button class="gift" onclick="sendGift('❤️','Heart',100)">
        <div class="giftIcon">❤️</div>
        <div class="giftName">Heart</div>
        <div class="giftPrice">100 🪙</div>
      </button>

      <button class="gift" onclick="sendGift('🎂','Cake',500)">
        <div class="giftIcon">🎂</div>
        <div class="giftName">Cake</div>
        <div class="giftPrice">500 🪙</div>
      </button>

      <button class="gift" onclick="sendGift('💖','Love',1000)">
        <div class="giftIcon">💖</div>
        <div class="giftName">Love</div>
        <div class="giftPrice">1K 🪙</div>
      </button>

      <button class="gift" onclick="sendGift('👑','Crown',5000)">
        <div class="giftIcon">👑</div>
        <div class="giftName">Crown</div>
        <div class="giftPrice">5K 🪙</div>
      </button>

      <button class="gift" onclick="sendGift('💎','Diamond',10000)">
        <div class="giftIcon">💎</div>
        <div class="giftName">Diamond</div>
        <div class="giftPrice">10K 🪙</div>
      </button>

      <button class="gift" onclick="sendGift('🚀','Rocket',50000)">
        <div class="giftIcon">🚀</div>
        <div class="giftName">Rocket</div>
        <div class="giftPrice">50K 🪙</div>
      </button>

      <button class="gift" onclick="sendGift('🏰','Castle',100000)">
        <div class="giftIcon">🏰</div>
        <div class="giftName">Castle</div>
        <div class="giftPrice">100K 🪙</div>
      </button>

    </div>

  </div>
</div>

<!-- MORE -->
<div class="overlay" id="moreOverlay">
  <div class="panel">

    <div class="panelHead">
      <h3>⋮ More</h3>
      <button class="close" onclick="closePanel('moreOverlay')">×</button>
    </div>

    <button class="option" onclick="openOnline()">
      <div class="optionIcon">👥</div>
      <div class="optionText"><b>Members</b><span>Room members</span></div>
      <div class="arrow">›</div>
    </button>

    <button class="option" onclick="simpleAction('✋ Hand Raise')">
      <div class="optionIcon">✋</div>

/* =========================

function $(id){
  return document.getElementById(id);
}

function showToast(message){
  const t = $("toast");
  t.textContent = message;
  t.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    t.style.display = "none";
  },2200);
}

function escapeHtml(text){
  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function closePanel(id){
  $(id).classList.remove("show");
}

/* =========================
   ROOM START
========================= */

async function initRoom(){

  if(!roomId){
    roomId = "room_" + Date.now();
    localStorage.setItem("pawanRoomId",roomId);
  }

  $("roomIdText").textContent = roomId;

  await loadRoom();

  await addMyUser();

  listenUsers();

  listenChat();

  listenRoomSettings();

  startMicrophone();

  startPeer();

}

async function loadRoom(){

  const snap = await db.ref("rooms/" + roomId).once("value");

  if(!snap.exists()){

    ownerId = myId;

    roomData = {
      name:"PawanVoice Room",
      description:"Welcome to PawanVoice",
      ownerId:myId,
      ownerName:myName,
      category:"General",
      tags:"Voice",
      privacy:"public",
      maxMembers:9,
      announcement:"📢 Welcome to PawanVoice Room",
      createdAt:Date.now(),
      settings:{
        dp:""
      }
    };

    await db.ref("rooms/" + roomId).set(roomData);

  }else{

    roomData = snap.val() || {};

    ownerId = roomData.ownerId || myId;

  }

  renderRoomSettings();

}

/* =========================
   ADD USER
========================= */

async function addMyUser(){

  const userRef =
    db.ref("rooms/" + roomId + "/users/" + myId);

  const data = {
    id:myId,
    name:myName,
    dp:myDp,
    peerId:"",
    mic:true,
    joinedAt:Date.now()
  };

  await userRef.set(data);

  userRef.onDisconnect().remove();

}

/* =========================
   USER LIST
========================= */

function listenUsers(){

  db.ref("rooms/" + roomId + "/users")
    .on("value",snap=>{

      usersData = snap.val() || {};

}

/* =========================
   RENDER SEATS
========================= */

function renderUsers(){

  const ids = Object.keys(usersData);

  let owner = usersData[ownerId];

  if(!owner){
    owner = usersData[myId];
  }

  renderSeat(
    $("ownerSeat"),
    owner,
    "👑 Owner",
    true
  );

  $("row1").innerHTML = "";
  $("row2").innerHTML = "";

  for(let i=0;i<8;i++){

    const seatNo = i + 2;

    const user = ids
      .filter(id=>id !== ownerId)[i];

    const div = document.createElement("div");

    div.className = "seat";

    renderSeat(
      div,
      user,
      "Seat " + seatNo,
      false
    );

    if(seatNo <= 5){
      $("row1").appendChild(div);
    }else{
      $("row2").appendChild(div);
    }

  }

}

function renderSeat(container,user,label,isOwner){

  if(!user){

    container.innerHTML = `
      <div class="seatCircle">
        <div class="emptyIcon">＋</div>
      </div>
      <div class="seatName">${escapeHtml(label)}</div>
    `;

    return;
  }

  const dp = user.dp || "";

  container.innerHTML = `
    <div class="seatCircle ${user.mic ? "speaking":""}"
         onclick="openUserActions('${escapeHtml(user.id)}')">

      ${
        dp
        ? `<img src="${dp}" alt="">`
        : `<span style="font-size:25px">
             ${escapeHtml((user.name || "G").charAt(0).toUpperCase())}
           </span>`
      }

      ${isOwner ? `<div class="ownerTag">👑 Owner</div>` : ""}

      ${
        user.vip
        ? `<div class="vipTag">VIP ${user.vip}</div>`
        : ""
      }

      <div class="micDot ${user.mic ? "micOn":""}">
        ${user.mic ? "🎙️":"🔇"}
      </div>

    </div>

    <div class="seatName">
      ${escapeHtml(user.name || "Guest")}
    </div>

    <div class="seatId">
      ID: ${escapeHtml(user.id)}

}

/* =========================
   USER ACTIONS
========================= */

function openUserActions(id){

  const user = usersData[id];

  if(!user) return;

  const isOwner = id === ownerId;

  const buttons = [

    ["👤","Profile","User profile"],
    ["❤️","Follow","Follow this user"],
    ["💬","Chat","Private chat"],
    ["🎁","Gift","Send gift"],
    ["🎯","Mission","View mission"],
    ["📋","Copy ID","Copy user ID"],
    ["🚫","Block","Block user"],
    ["⚠️","Report","Report user"]

  ];

  if(myId === ownerId && !isOwner){

    buttons.push(
      ["🔇","Mute","Mute user"],
      ["🚪","Kick","Remove from room"],
      ["🔒","Lock Seat","Lock seat"],
      ["🛡️","Make Admin","Give admin permission"]
    );

  }

  let html = `
    <div class="overlay show" id="dynamicUserPanel"
         onclick="if(event.target===this)this.remove()">

      <div class="panel">

        <div class="panelHead">
          <h3>👤 ${escapeHtml(user.name || "Guest")}</h3>
          <button class="close"
                  onclick="document.getElementById('dynamicUserPanel').remove()">
            ×
          </button>
        </div>
  `;

  buttons.forEach(item=>{

    html += `
      <button class="option"
        onclick="userAction('${item[1]}','${escapeHtml(id)}')">

        <div class="optionIcon">${item[0]}</div>

        <div class="optionText">
          <b>${item[1]}</b>
          <span>${item[2]}</span>
        </div>

        <div class="arrow">›</div>

      </button>
    `;

  });

  html += `
      </div>
    </div>
  `;

  document.body.insertAdjacentHTML("beforeend",html);

}

async function userAction(action,id){

  const user = usersData[id];

  if(!user) return;

  if(action === "Copy ID"){

    copyText(id);

  }else if(action === "Kick"){

    if(myId !== ownerId){
      showToast("Only owner can kick users");
      return;
    }

    await db.ref("rooms/" + roomId + "/users/" + id).remove();

    showToast("User removed");

  }else if(action === "Mute"){

    await db.ref(
      "rooms/" + roomId + "/users/" + id + "/mic"
    ).set(false);

    showToast("User muted");

  }else if(action === "Follow"){

    showToast("Follow request sent");

  }else if(action === "Gift"){

    openGifts();

  }else{

    showToast(action + " selected");

  }

  const p = $("dynamicUserPanel");

  if(p) p.remove();

}

/* =========================
   ROOM DP
========================= */

function openRoomDp(){

  const dp =
    roomData.settings &&
    roomData.settings.dp
      ? roomData.settings.dp
      : "";

  if(dp){

    $("bigRoomDp").src = dp;
    $("bigRoomDp").style.display = "block";
    $("bigRoomDpIcon").style.display = "none";

  }else{

    $("bigRoomDp").style.display = "none";
    $("bigRoomDpIcon").style.display = "block";

  }

  $("ownerDpOptions").style.display =
    myId === ownerId ? "block":"none";

  $("dpOverlay").classList.add("show");

}

function changeRoomDp(event){

  if(myId !== ownerId){
    showToast("Only room owner can change DP");
    return;
  }

  const file = event.target.files[0];

  if(!file) return;

  if(file.size > 700000){
    showToast("Image 700KB se chhoti rakhein");
    event.target.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(){

    const data = reader.result;

    await db.ref(
      "rooms/" + roomId + "/settings/dp"
    ).set(data);

    showToast("Room DP updated");

    updateRoomDp(data);

  };

  reader.readAsDataURL(file);

}

async function removeRoomDp(){

  if(myId !== ownerId){
    showToast("Only owner can remove DP");
    return;
  }

  await db.ref(
    "rooms/" + roomId + "/settings/dp"
  ).remove();

  updateRoomDp("");

  showToast("Room DP removed");

}

function viewRoomDp(){

  const dp =
    roomData.settings &&
    roomData.settings.dp;

  if(dp){
    window.open(dp,"_blank");
  }else{
    showToast("Room DP available nahi hai");
  }

}

function updateRoomDp(dp){

  if(dp){

    $("headerRoomDp").src = dp;
    $("headerRoomDp").style.display = "block";
    $("headerRoomDpIcon").style.display = "none";

    $("miniRoomDp").src = dp;
    $("miniRoomDp").style.display = "block";
    $("miniRoomIcon").style.display = "none";

    $("bigRoomDp").src = dp;
    $("bigRoomDp").style.display = "block";
    $("bigRoomDpIcon").style.display = "none";

  }else{

    $("headerRoomDp").style.display = "none";
    $("headerRoomDpIcon").style.display = "block";

    $("miniRoomDp").style.display = "none";
    $("miniRoomIcon").style.display = "block";

    $("bigRoomDp").style.display = "none";
    $("bigRoomDpIcon").style.display = "block";

  }

}

async function saveBasicSettings(){

  if(myId !== ownerId){
    showToast("Only owner can change settings");
    return;
  }

  const data = {
    name:$("setRoomName").value.trim() || "PawanVoice Room",
    description:$("setDescription").value.trim(),
    category:$("setCategory").value,
    tags:$("setTags").value.trim()
  };

  await db.ref("rooms/" + roomId).update(data);

  showToast("Room settings saved");

  closePanel("settingDetailOverlay");

}

async function savePrivacySettings(){

  if(myId !== ownerId){
    showToast("Only owner can change settings");
    return;
  }

  const privacy = $("setPrivacy").value;

  let maxMembers =
    parseInt($("setMaxMembers").value,10);

  if(!Number.isFinite(maxMembers)){
    maxMembers = 9;
  }

  maxMembers = Math.max(1,Math.min(9,maxMembers));

  await db.ref("rooms/" + roomId).update({

    privacy:privacy,

    password:$("setPassword").value,

    maxMembers:maxMembers

  });

  showToast("Privacy settings saved");

  closePanel("settingDetailOverlay");

}

async function saveAnnouncement(){

  if(myId !== ownerId){
    showToast("Only owner can change announcement");
    return;
  }

  const announcement =
    $("setAnnouncement").value.trim();

  await db.ref(
    "rooms/" + roomId + "/announcement"
  ).set(announcement);

  showToast("Announcement updated");

  closePanel("settingDetailOverlay");

}

function listenRoomSettings(){

  db.ref("rooms/" + roomId)
    .on("value",snap=>{

      roomData = snap.val() || {};

      renderRoomSettings();

    });

}

function renderRoomSettings(){

  $("roomName").textContent =
    roomData.name || "PawanVoice Room";

  $("ownerName").textContent =
    roomData.ownerName || myName;

  $("announcement").textContent =
    roomData.announcement ||
    "📢 Welcome to PawanVoice Room";

  $("miniRoomName").textContent =
    roomData.name || "PawanVoice";

  updateRoomDp(
    roomData.settings &&
    roomData.settings.dp
      ? roomData.settings.dp
      : ""
  );

}

/* =========================
   CHAT
========================= */

function listenChat(){

  db.ref("rooms/" + roomId + "/chat")
    .limitToLast(100)
    .on("value",snap=>{

      const data = snap.val() || {};

      const arr = Object.keys(data)
        .map(k=>data[k])
        .sort((a,b)=>
          (a.time||0)-(b.time||0)
        );

      $("messages").innerHTML = arr.map(m=>`

        <div class="msg">

          <b>${escapeHtml(m.name || "Guest")}:</b>

          <span>
            ${escapeHtml(m.text || "")}
          </span>

        </div>

      `).join("");

      const box = $("messages");

      box.scrollTop = box.scrollHeight;

    });

}

async function sendMessage(){

  const input = $("chatInput");

  const text = input.value.trim();

  if(!text) return;

  await db.ref(
    "rooms/" + roomId + "/chat"
  ).push({

    name:myName,
    id:myId,
    text:text,
    time:Date.now()

  });

  input.value = "";

}

$("chatInput").addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      sendMessage();
    }

  }
);

/* =========================
   LIKE
========================= */

async function sendLike(){

  const ref =
    db.ref("rooms/" + roomId + "/likes");

  await ref.transaction(v=>
    (Number(v)||0)+1
  );

  showToast("❤️ Like sent");

}

db.ref("rooms/" + roomId + "/likes")
  .on("value",snap=>{

    $("likeCount").textContent =
      snap.val() || 0;

  });

/* =========================
   GIFTS
========================= */

async function sendGift(icon,name,price){

  await db.ref(
    "rooms/" + roomId + "/gifts"
  ).push({

    icon:icon,
    name:name,
    price:price,
    sender:myName,
    senderId:myId,
    time:Date.now()

  });

  await db.ref(
    "rooms/" + roomId + "/giftCount"
  ).transaction(v=>
    (Number(v)||0)+1
  );

  showToast(icon + " " + name + " sent");

  closePanel("giftOverlay");

}

db.ref("rooms/" + roomId + "/giftCount")
  .on("value",snap=>{

    $("giftCount").textContent =
      snap.val() || 0;

  });

/* =========================
   MIC
========================= */

async function startMicrophone(){

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    localStream.getAudioTracks()
      .forEach(track=>{
        track.enabled = micOn;
      });

    updateMicUI();

  }catch(error){

    console.log(error);

    micOn = false;

    updateMicUI();

    showToast(
      "Mic permission allow karein"
    );

  }

}

async function toggleMic(){

  if(!localStream){

    await startMicrophone();

    return;

  }

  micOn = !micOn;

  localStream.getAudioTracks()
    .forEach(track=>{
      track.enabled = micOn;
    });

  await db.ref(
    "rooms/" + roomId +
    "/users/" + myId + "/mic"
  ).set(micOn);

  updateMicUI();

}

function updateMicUI(){

  const btn = $("micButton");

  btn.innerHTML =
    (micOn ? "🎙️":"🔇") +
    `<small>${micOn ? "Mic ON":"Mic OFF"}</small>`;

}

/* =========================
   PEERJS
========================= */

function startPeer(){

  try{

    peer = new Peer();

    peer.on("open",async id=>{

      await db.ref(
        "rooms/" + roomId +
        "/users/" + myId +
        "/peerId"
      ).set(id);

      connectToUsers();

    });

    peer.on("call",call=>{

      if(!localStream){

        call.answer();

        return;

      }

      call.answer(localStream);

      call.on("stream",remoteStream=>{

        addAudio(
          call.peer,
          remoteStream
        );

      });

    });

    peer.on("error",error=>{

      console.log("Peer error",error);

    });

  }catch(e){

    console.log(e);

  }

}

function connectToUsers(){

  if(!peer || !localStream) return;

  Object.keys(usersData)
    .forEach(id=>{

      if(id === myId) return;

      const user = usersData[id];

      if(!user || !user.peerId) return;

      if(calls[id]) return;

      try{

        const call =
          peer.call(
            user.peerId,
            localStream
          );

        calls[id] = call;

        call.on("stream",remoteStream=>{

          addAudio(
            id,
            remoteStream
          );

        });

        call.on("close",()=>{

          delete calls[id];

          const a =
            document.getElementById(
              "audio-" + safeId(id)
            );

          if(a) a.remove();

        });

      }catch(e){

        console.log(e);

      }

    });

}

function safeId(id){

  return String(id)
    .replace(/[^a-zA-Z0-9_-]/g,"_");

}

function addAudio(id,stream){

  const audioId =
    "audio-" + safeId(id);

  let audio =
    document.getElementById(audioId);

  if(!audio){

    audio = document.createElement("audio");

    audio.id = audioId;

    audio.autoplay = true;

    audio.playsInline = true;

    audio.controls = false;

    document.body.appendChild(audio);

  }

  audio.srcObject = stream;

  audio.muted = !speakerOn;

}

/* =========================
   SHARE
========================= */

async function shareRoom(){

  const url =
    location.origin +
    location.pathname +
    "?room=" +
    encodeURIComponent(roomId);

  if(navigator.share){

    try{

      await navigator.share({
        title:roomData.name || "PawanVoice Room",
        text:"Join my PawanVoice room",
        url:url
      });

    }catch(e){}

  }else{

    copyText(url);

    showToast("Room link copied");

  }

}

/* =========================
   COPY
========================= */

function copyRoomId(){

  copyText(roomId);

  showToast("Room ID copied");

}

function copyText(text){

  if(navigator.clipboard){

    navigator.clipboard.writeText(text)
      .catch(()=>fallbackCopy(text));

  }else{

    fallbackCopy(text);

  }

}

function fallbackCopy(text){

  const area =
    document.createElement("textarea");

  area.value = text;

  document.body.appendChild(area);

  area.select();

  document.execCommand("copy");

  area.remove();

}

========================= */

async function leaveRoom(){

  const ok =
    confirm("Room se leave karna hai?");

  if(!ok) return;

  try{

    await db.ref(
      "rooms/" + roomId +
      "/users/" + myId
    ).remove();

  }catch(e){}

  if(localStream){

    localStream.getTracks()
      .forEach(t=>t.stop());

  }

  if(peer){

    peer.destroy();

  }

  location.href = "index.html";

}
