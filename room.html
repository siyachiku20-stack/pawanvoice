<script>

const firebaseConfig={
 apiKey:"AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"148446327241",
 appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const params=new URLSearchParams(location.search);
const roomId=params.get("room");

const uid=localStorage.getItem("pawanUid")||
 ("PV"+Date.now());

localStorage.setItem("pawanUid",uid);

const myName=localStorage.getItem("pawanName")||"Guest";
const myDP=localStorage.getItem("pawanDP")||"";

let roomData=null;
let members={};
let localStream=null;
let micOn=true;
let speakerOn=true;

const peers={};
const pendingCandidates={};

if(!roomId){

 alert("Room ID नहीं मिला");
 location.href="index.html";
}

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

/* ---------------- ROOM ---------------- */

function loadRoom(){

 db.ref("rooms/"+roomId).on("value",snap=>{

  roomData=snap.val();

  if(!roomData){
   alert("Room मौजूद नहीं है");
   location.href="index.html";
   return;
  }

  document.getElementById("roomName").textContent=
   roomData.name||"PawanVoice Room";

  document.getElementById("hostName").textContent=
   roomData.ownerName||"Guest";

  document.getElementById("category").textContent=
   roomData.category||"General";

  document.getElementById("roomNumber").textContent=
   "#"+roomId.slice(-7);

  document.getElementById("top1").textContent=
   roomData.top1||"---";

  document.getElementById("top2").textContent=
   roomData.top2||"---";

  document.getElementById("top3").textContent=
   roomData.top3||"---";
 });
}

/* ---------------- JOIN ---------------- */

function joinRoom(){

 const memberRef=
  db.ref("rooms/"+roomId+"/members/"+uid);

 memberRef.set({

  uid:uid,
  name:myName,
  dp:myDP,
  role:roomData&&roomData.ownerId===uid
       ?"owner":"member",

  joinedAt:firebase.database.ServerValue.TIMESTAMP,
  mic:true

 });

 memberRef.onDisconnect().remove();

 db.ref("rooms/"+roomId+"/membersCount")
 .transaction(current=>{
  return Number(current||0)+1;
 });

 startMicrophone();

 listenMembers();
 listenChat();
 listenSignals();
}

/* ---------------- MEMBERS ---------------- */

function listenMembers(){

 db.ref("rooms/"+roomId+"/members")
 .on("value",snap=>{

  members=snap.val()||{};

  renderSeats();

  document.getElementById("memberCount").textContent=
   Object.keys(members).length;

  db.ref("rooms/"+roomId+"/membersCount")
   .set(Object.keys(members).length);
 });
}

function renderSeats(){

 const box=document.getElementById("seats");

 const arr=Object.keys(members)
 .map(id=>members[id]);

 arr.sort((a,b)=>{

  if(a.role==="owner")return -1;
  if(b.role==="owner")return 1;

  return Number(a.joinedAt||0)-
         Number(b.joinedAt||0);
 });

 let html="";

 for(let i=0;i<9;i++){

  const m=arr[i];

  if(i===0){

   if(m){

    html+=seatHTML(m,true);

   }else{

    html+=`
     <div class="seat owner">
      <div class="crown">👑 Owner</div>
      <div class="empty-seat">+</div>
     </div>`;
   }

  }else{

   if(m){

    html+=seatHTML(m,false);

   }else{

    html+=`
     <div class="seat">
      <div class="sub">Seat ${i+1}</div>
      <div class="empty-seat">+</div>
     </div>`;
   }
  }
 }

 box.innerHTML=html;
}

function seatHTML(m,owner){

 const isMe=m.uid===uid;

 let avatar=m.dp
 ?'<img src="'+m.dp+'">'
 :"👤";

 return `
 <div class="seat ${owner?"owner":""}"
      onclick="openUser('${esc(m.uid)}')">

  ${owner?'<div class="crown">👑 Owner</div>':''}

  <div class="seat-avatar">
   ${avatar}
  </div>

  <div class="seat-name">
   ${esc(m.name||"Guest")}
   ${isMe?" (You)":""}
  </div>

  ${m.mic===false
   ?'<div class="mic-dot" style="background:#d33"></div>'
   :'<div class="mic-dot"></div>'}

 </div>`;
}

/* ---------------- USER MENU ---------------- */

function openUser(id){

 const m=members[id];

 if(!m)return;

 let adminControls="";

 const owner=
  roomData && roomData.ownerId===uid;

 const current=
  members[uid];

 const isAdmin=
  current &&
  (current.role==="owner"||current.role==="admin");

 if(isAdmin && id!==uid){

  adminControls=`
   <button class="modal-option"
    onclick="makeAdmin('${esc(id)}')">
    🛡️ Make Admin
   </button>

   <button class="modal-option danger"
    onclick="kickUser('${esc(id)}')">
    🚫 Kick User
   </button>`;
 }

 openModal(`
  <h2>👤 ${esc(m.name||"Guest")}</h2>

  <div class="modal-option">
   🆔 ID: ${esc(m.uid)}
  </div>

  <div class="modal-option">
   👑 Role: ${esc(m.role||"member")}
  </div>

  ${adminControls}
 `);
}

function makeAdmin(id){

 db.ref(
  "rooms/"+roomId+"/members/"+id+"/role"
 ).set("admin")
 .then(()=>{
  closeModal();
 });
}

function kickUser(id){

 if(!confirm("इस user को room से निकालें?"))return;

 db.ref(
  "rooms/"+roomId+"/members/"+id
 ).remove()
 .then(()=>{
  closeModal();
 });
}

/* ---------------- MICROPHONE ---------------- */

async function startMicrophone(){

 try{

  localStream=await navigator.mediaDevices.getUserMedia({
   audio:true,
   video:false
  });

  localStream.getAudioTracks().forEach(t=>{
   t.enabled=micOn;
  });

  updateMicUI();

  startWebRTC();

 }catch(e){

  micOn=false;
  updateMicUI();

  alert(
   "Microphone permission allow करें।"
  );
 }
}

function toggleMic(){

 if(!localStream){
  startMicrophone();
  return;
 }

 micOn=!micOn;

 localStream.getAudioTracks()
 .forEach(track=>{
  track.enabled=micOn;
 });

 db.ref(
  "rooms/"+roomId+"/members/"+uid+"/mic"
 ).set(micOn);

 updateMicUI();
}

function updateMicUI(){

 document.getElementById("micIcon").textContent=
  micOn?"🎤":"🔇";

 document.getElementById("micText").textContent=
  micOn?"Mic ON":"Mic OFF";

 document.getElementById("bottomMic").textContent=
  micOn?"🎤":"🔇";
}

function toggleSpeaker(){

 speakerOn=!speakerOn;

 document.getElementById("speakerIcon").textContent=
  speakerOn?"🔊":"🔇";

 document.querySelectorAll("audio")
 .forEach(a=>{
  a.muted=!speakerOn;
 });
}

/* ---------------- WEBRTC ---------------- */

const rtcConfig={
 iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"}
 ]
};

function startWebRTC(){

 Object.keys(members).forEach(id=>{

  if(id===uid)return;

  if(uid>id){
   createOffer(id);
  }

 });
}

function getPeer(id){

 if(peers[id])return peers[id];

 const pc=new RTCPeerConnection(rtcConfig);

 peers[id]=pc;

 if(localStream){

  localStream.getTracks().forEach(track=>{
   pc.addTrack(track,localStream);
  });
 }

 pc.onicecandidate=e=>{

  if(!e.candidate)return;

  db.ref(
   "rooms/"+roomId+
   "/signals/"+id+"/"+uid+"/candidates"
  ).push(
   e.candidate.toJSON()
  );
 };

 pc.ontrack=e=>{

  let audio=document.getElementById("audio-"+id);

  if(!audio){

   audio=document.createElement("audio");
   audio.id="audio-"+id;
   audio.autoplay=true;
   audio.playsInline=true;

   document.getElementById(
    "audioContainer"
   ).appendChild(audio);
  }

  audio.srcObject=e.streams[0];
  audio.muted=!speakerOn;
 };

 pc.onconnectionstatechange=()=>{

  if(
   pc.connectionState==="failed"||
   pc.connectionState==="closed"
  ){

   try{pc.close()}catch(e){}

   delete peers[id];
  }
 };

 return pc;
}

async function createOffer(id){

 try{

  const pc=getPeer(id);

  const offer=await pc.createOffer();

  await pc.setLocalDescription(offer);

  await db.ref(
   "rooms/"+roomId+
   "/signals/"+id+"/"+uid+"/offer"
  ).set({
   type:offer.type,
   sdp:offer.sdp
  });

 }catch(e){
  console.log("offer",e);
 }
}

function listenSignals(){

 db.ref(
  "rooms/"+roomId+"/signals/"+uid
 ).on("value",async snap=>{

  const data=snap.val()||{};

  for(const from in data){

   if(from===uid)continue;

   const signal=data[from];

   const pc=getPeer(from);

   try{

    if(signal.offer){

     if(
      !pc.currentRemoteDescription
     ){

      await pc.setRemoteDescription(
       new RTCSessionDescription(signal.offer)
      );

      const answer=await pc.createAnswer();

      await pc.setLocalDescription(answer);

      await db.ref(
       "rooms/"+roomId+
       "/signals/"+from+"/"+uid+"/answer"
      ).set({
       type:answer.type,
       sdp:answer.sdp
      });
     }
    }

    if(signal.answer){

     if(
      !pc.currentRemoteDescription
     ){

      await pc.setRemoteDescription(
       new RTCSessionDescription(signal.answer)
      );
     }
    }

    if(signal.candidates){

     const candidates=signal.candidates;

     for(const key in candidates){

      const c=candidates[key];

      try{

       await pc.addIceCandidate(
        new RTCIceCandidate(c)
       );

      }catch(e){}
     }
    }

   }catch(e){
    console.log("signal",e);
   }
  }
 });
}

/* ---------------- CHAT ---------------- */

function listenChat(){

 db.ref("roomChats/"+roomId)
 .limitToLast(50)
 .on("value",snap=>{

  const data=snap.val()||{};

  const arr=Object.keys(data)
  .map(k=>data[k]);

  document.getElementById("chatList").innerHTML=
   arr.map(m=>`
    <div class="message">
     <b>${esc(m.name)}</b>:
     ${esc(m.text)}
    </div>
   `).join("");

  const box=document.getElementById("chatList");
  box.scrollTop=box.scrollHeight;
 });
}

function sendChat(){

 const input=document.getElementById("chatInput");

 const text=input.value.trim();

 if(!text)return;

 db.ref("roomChats/"+roomId)
 .push({

  uid:uid,
  name:myName,
  text:text,
  time:firebase.database.ServerValue.TIMESTAMP

 });

 input.value="";
}

function emoji(e){

 document.getElementById("chatInput").value+=e;
}

/* ---------------- MODAL ---------------- */

function openModal(html){

 document.getElementById("modalContent").innerHTML=html;

 document.getElementById("modal").classList.add("show");
}

function closeModal(){

 document.getElementById("modal").classList.remove("show");
}

/* ---------------- LEAVE ---------------- */

function leaveRoom(){

 if(
  !confirm("Room से बाहर निकलना है?")
 )return;

 cleanup();

 location.href="index.html";
}

function cleanup(){

 try{

  db.ref(
   "rooms/"+roomId+
   "/members/"+uid
  ).remove();

  db.ref(
   "rooms/"+roomId+
   "/membersCount"
  ).transaction(n=>{
   return Math.max(0,Number(n||0)-1);
  });

 }catch(e){}

 if(localStream){

  localStream.getTracks()
  .forEach(t=>t.stop());
 }

 Object.keys(peers).forEach(id=>{

  try{
   peers[id].close();
  }catch(e){}

 });

}

window.addEventListener("beforeunload",()=>{

 try{

  db.ref(
   "rooms/"+roomId+
   "/members/"+uid
  ).remove();

 }catch(e){}

});

/* ---------------- START ---------------- */

loadRoom();

setTimeout(()=>{

 if(roomData){
  joinRoom();
 }else{

  db.ref("rooms/"+roomId)
  .once("value")
  .then(snap=>{

   roomData=snap.val();

   if(roomData){
    joinRoom();
   }

  });
 }

},800);

</script>
