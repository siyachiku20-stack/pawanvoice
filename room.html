<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PawanVoice Room</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#080a12;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:650px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(circle at 50% -10%,#252b4c 0,#101426 30%,#080a12 65%);
  position:relative;
  overflow:hidden;
}

/* HEADER */

.header{
  height:70px;
  display:flex;
  align-items:center;
  padding:10px 12px;
  gap:10px;
  position:relative;
  z-index:5;
}

.room-dp{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ffd36a;
  background:#1b2035;
}

.room-info{
  flex:1;
  min-width:0;
}

.room-name{
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-id{
  font-size:11px;
  color:#9da4bd;
  margin-top:3px;
}

.header-actions{
  display:flex;
  gap:7px;
}

.circle-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#20253b;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* ROOM INFO BAR */

.room-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 12px;
  padding:8px 12px;
  border-radius:16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.07);
}

.room-count{
  font-size:13px;
  font-weight:700;
}

.category{
  color:#aeb5cb;
  font-size:12px;
}

/* SEATS */

.seats-area{
  padding:18px 12px 8px;
}

.host-seat{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.user-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px 7px;
}

.seat{
  min-width:0;
  text-align:center;
  position:relative;
}

.avatar-wrap{
  width:60px;
  height:60px;
  margin:auto;
  position:relative;
}

.avatar{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:50%;
  background:#171b2c;
  border:2px solid #4a506b;
}

.host-seat .avatar{
  width:74px;
  height:74px;
  border-color:#ffd76b;
}

.host-seat .avatar-wrap{
  width:74px;
  height:74px;
}

.mic-dot{
  position:absolute;
  right:-2px;
  bottom:0;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#292e44;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  border:2px solid #080a12;
}

.mic-dot.on{
  background:#1fb76a;
}

.host-crown{
  position:absolute;
  top:-13px;
  left:50%;
  transform:translateX(-50%);
  font-size:18px;
}

.seat-name{
  margin-top:6px;
  font-size:11px;
  color:#f1f3fb;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.empty-seat{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:50%;
  border:2px dashed #383e55;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#656c84;
  font-size:23px;
  background:rgba(255,255,255,.02);
}

.empty-text{
  margin-top:6px;
  font-size:10px;
  color:#60677e;
}

/* USER BADGES */

.user-badge{
  display:inline-block;
  margin-top:3px;
  padding:2px 6px;
  border-radius:8px;
  background:#2a2441;
  color:#d9b5ff;
  font-size:8px;
}

/* FEATURE BUTTONS */

.feature-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  padding:10px 10px;
}

.feature{
  min-height:65px;
  border-radius:15px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.06);
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  font-size:9px;
}

.feature-icon{
  font-size:22px;
}

/* EXP */

.exp-box{
  margin:5px 12px 10px;
  padding:10px 12px;
  border-radius:15px;
  background:rgba(255,255,255,.05);
}

.exp-top{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#aeb5cb;
  margin-bottom:7px;
}

.exp-track{
  width:100%;
  height:7px;
  border-radius:10px;
  background:#252a3d;
  overflow:hidden;
}

.exp-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#ffd45d,#ff8b67);
  border-radius:10px;
}

/* TOP 3 */

.top-box{
  margin:8px 12px;
  padding:12px;
  border-radius:17px;
  background:rgba(255,255,255,.045);
}

.top-title{
  font-weight:800;
  font-size:13px;
  margin-bottom:10px;
}

.top-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.top-card{
  text-align:center;
  background:rgba(255,255,255,.04);
  border-radius:14px;
  padding:9px 4px;
}

.top-icon{
  font-size:22px;
}

.top-name{
  font-size:10px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-exp{
  color:#8e96af;
  font-size:9px;
  margin-top:3px;
}

/* CHAT */

.chat-box{
  margin:8px 12px 105px;
  min-height:110px;
  max-height:220px;
  overflow-y:auto;
  padding:8px;
  border-radius:16px;
  background:rgba(0,0,0,.18);
}

.chat-message{
  display:flex;
  gap:7px;
  margin:7px 0;
  align-items:flex-start;
}

.chat-dp{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
  background:#22263a;
}

.chat-content{
  min-width:0;
  flex:1;
}

.chat-name{
  font-size:10px;
  color:#b8bfd3;
}

.chat-text{
  margin-top:2px;
  font-size:12px;
  color:#fff;
  word-break:break-word;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:650px;
  padding:8px 9px 10px;
  background:rgba(8,10,18,.97);
  border-top:1px solid rgba(255,255,255,.08);
  z-index:30;
}

.input-row{
  display:flex;
  align-items:center;
  gap:6px;
}

.chat-input{
  flex:1;
  min-width:0;
  height:43px;
  border-radius:22px;
  border:1px solid #30364e;
  background:#161a2a;
  color:#fff;
  padding:0 15px;
  outline:none;
}

.chat-input::placeholder{
  color:#737b94;
}

.bottom-btn{
  width:43px;
  height:43px;
  flex:none;
  border-radius:50%;
  background:#20253a;
  color:#fff;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bottom-btn.active{
  background:#d99b32;
}

.bottom-btn.mic-on{
  background:#1d9f61;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:650px;
  max-height:88vh;
  overflow-y:auto;
  background:#111525;
  border-radius:24px 24px 0 0;
  padding:16px 12px 25px;
}

.sheet-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:18px;
  font-weight:800;
  margin-bottom:12px;
}

.close-btn{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#252a40;
  color:#fff;
}

/* GIFT */

.gift-search{
  width:100%;
  height:42px;
  border-radius:14px;
  border:1px solid #30364d;
  background:#191e30;
  color:#fff;
  padding:0 13px;
  outline:none;
  margin-bottom:10px;
}

.gift-tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:9px;
}

.gift-tab{
  flex:none;
  padding:8px 12px;
  border-radius:13px;
  background:#20263a;
  color:#aeb5ca;
  font-size:11px;
}

.gift-tab.active{
  background:#d29a3a;
  color:#fff;
}

.gift-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.gift-card{
  background:#191e2e;
  border:1px solid #252b40;
  border-radius:15px;
  padding:8px 4px;
  text-align:center;
}

.gift-icon{
  font-size:30px;
  height:38px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.gift-name{
  font-size:10px;
  color:#f0f2fa;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gift-price{
  font-size:9px;
  color:#aeb5c9;
  margin:4px 0;
}

.gift-card button{
  width:100%;
  height:29px;
  border-radius:10px;
  background:#d39b3a;
  color:#fff;
  font-size:10px;
  font-weight:700;
}

/* SEND GIFT */

.receiver-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:10px 0;
}

.receiver{
  padding:8px 4px;
  border-radius:13px;
  background:#1a1f31;
  text-align:center;
  border:1px solid transparent;
}

.receiver.selected{
  border-color:#e2a443;
}

.receiver img{
  width:43px;
  height:43px;
  object-fit:cover;
  border-radius:50%;
}

.receiver-name{
  font-size:9px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.quantity{
  width:100%;
  height:42px;
  background:#191e30;
  color:#fff;
  border:1px solid #30364d;
  border-radius:13px;
  padding:0 12px;
  outline:none;
  margin-bottom:10px;
}

.send-btn{
  width:100%;
  height:46px;
  border-radius:14px;
  background:#d39b3a;
  color:#fff;
  font-weight:800;
}

/* EMOJI */

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
}

.emoji-btn{
  height:40px;
  border-radius:10px;
  background:#1c2132;
  font-size:21px;
}

/* SETTINGS */

.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 3px;
  border-bottom:1px solid #252a3d;
  font-size:13px;
}

.setting-row button{
  background:#292f45;
  color:#fff;
  padding:8px 11px;
  border-radius:10px;
  font-size:11px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  z-index:200;
  background:#252a3e;
  color:#fff;
  padding:10px 15px;
  border-radius:13px;
  font-size:12px;
  display:none;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

/* GIFT ANIMATION */

.gift-animation{
  position:fixed;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  z-index:180;
  pointer-events:none;
  display:none;
  text-align:center;
}

.gift-animation.show{
  display:block;
  animation:giftPop 1.6s ease forwards;
}

.gift-animation .big{
  font-size:80px;
}

.gift-animation .text{
  font-size:18px;
  font-weight:800;
  text-shadow:0 2px 12px #000;
}

@keyframes giftPop{
  0%{
    opacity:0;
    transform:translate(-50%,-40%) scale(.3);
  }
  20%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
  }
  70%{
    opacity:1;
    transform:translate(-50%,-55%) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-80%) scale(.8);
  }
}

.hidden-audio{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

/* MOBILE */

@media(max-width:390px){

  .avatar,
  .empty-seat{
    width:53px;
    height:53px;
  }

  .avatar-wrap{
    width:53px;
    height:53px;
  }

  .host-seat .avatar,
  .host-seat .avatar-wrap{
    width:68px;
    height:68px;
  }

  .feature{
    min-height:61px;
    font-size:8px;
  }

  .feature-icon{
    font-size:20px;
  }

  .gift-grid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <img
      id="roomDp"
      class="room-dp"
      src="https://i.pravatar.cc/200?img=12"
      alt="Room">

    <div class="room-info">

      <div
        id="roomName"
        class="room-name">
        PawanVoice Room
      </div>

      <div
        id="roomId"
        class="room-id">
        Room
      </div>

    </div>

    <div class="header-actions">

      <button
        class="circle-btn"
        id="inviteBtn"
        type="button">
        ↗
      </button>

      <button
        class="circle-btn"
        id="settingsBtn"
        type="button">
        ⚙️
      </button>

    </div>

  </div>


  <!-- ROOM BAR -->

  <div class="room-bar">

    <div
      id="roomCount"
      class="room-count">
      👥 0/9
    </div>

    <div class="category">
      General
    </div>

  </div>


  <!-- SEATS -->

  <section class="seats-area">

    <!-- HOST -->

    <div
      id="hostSeat"
      class="host-seat">
    </div>

    <!-- OTHER 8 SEATS -->

    <div
      id="userGrid"
      class="user-grid">
    </div>

  </section>


  <!-- FEATURES -->

  <div class="feature-row">

    <button
      class="feature"
      type="button"
      id="supportBtn">
      <span class="feature-icon">💖</span>
      <span>Room Support</span>
    </button>

    <button
      class="feature"
      type="button"
      id="wheelBtn">
      <span class="feature-icon">🎡</span>
      <span>Lucky Wheel</span>
    </button>

    <button
      class="feature"
      type="button"
      id="bountyBtn">
      <span class="feature-icon">🎯</span>
      <span>Bounty Hunter</span>
    </button>

    <button
      class="feature"
      type="button"
      id="rewardBtn">
      <span class="feature-icon">🎁</span>
      <span>Room Reward</span>
    </button>

    <button
      class="feature"
      type="button"
      id="benefitBtn">
      <span class="feature-icon">🎉</span>
      <span>Benefits</span>
    </button>

  </div>


  <!-- EXP -->

  <div class="exp-box">

    <div class="exp-top">

      <span>🚀 Room EXP</span>

      <span id="expText">
        0%
      </span>

    </div>

    <div class="exp-track">

      <div
        id="expFill"
        class="exp-fill">
      </div>

    </div>

  </div>


  <!-- TOP 3 -->

  <div class="top-box">

    <div class="top-title">
      🏆 Top EXP
    </div>

    <div
      id="topList"
      class="top-list">

      <div class="top-card">
        <div class="top-icon">🥇</div>
        <div class="top-name">---</div>
        <div class="top-exp">0 EXP</div>
      </div>

      <div class="top-card">
        <div class="top-icon">🥈</div>
        <div class="top-name">---</div>
        <div class="top-exp">0 EXP</div>
      </div>

      <div class="top-card">
        <div class="top-icon">🥉</div>
        <div class="top-name">---</div>
        <div class="top-exp">0 EXP</div>
      </div>

    </div>

  </div>


  <!-- CHAT -->

  <div
    id="chatBox"
    class="chat-box">
  </div>

</div>


<!-- BOTTOM -->

<div class="bottom">

  <div class="input-row">

    <input
      id="chatInput"
      class="chat-input"
      type="text"
      maxlength="500"
      placeholder="Say something...">

    <button
      id="emojiBtn"
      class="bottom-btn"
      type="button">
      😊
    </button>

    <button
      id="giftBtn"
      class="bottom-btn"
      type="button">
      🎁
    </button>

    <button
      id="speakerBtn"
      class="bottom-btn"
      type="button">
      🔊
    </button>

    <button
      id="micBtn"
      class="bottom-btn"
      type="button">
      🎙️
    </button>

    <button
      id="moreBtn"
      class="bottom-btn"
      type="button">
      ⋯
    </button>

  </div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast">
</div>


<!-- GIFT ANIMATION -->

<div
  id="giftAnimation"
  class="gift-animation">

  <div
    id="giftAnimationIcon"
    class="big">
    🎁
  </div>

  <div
    id="giftAnimationText"
    class="text">
    Gift
  </div>

</div>


<!-- GIFT MODAL -->

<div
  id="giftModal"
  class="modal">

  <div class="sheet">

    <div class="sheet-title">

      <span>🎁 Send Gift</span>

      <button
        class="close-btn"
        type="button"
        data-close="giftModal">
        ×
      </button>

    </div>

    <input
      id="giftSearch"
      class="gift-search"
      type="text"
      placeholder="Search gift...">

    <div
      id="giftTabs"
      class="gift-tabs">
    </div>

    <div
      id="giftGrid"
      class="gift-grid">
    </div>

  </div>

</div>


<!-- SEND GIFT MODAL -->

<div
  id="sendGiftModal"
  class="modal">

  <div class="sheet">

    <div class="sheet-title">

      <span id="sendGiftTitle">
        Send Gift
      </span>

      <button
        class="close-btn"
        type="button"
        data-close="sendGiftModal">
        ×
      </button>

    </div>

    <div
      id="receiverList"
      class="receiver-list">
    </div>

    <input
      id="giftQuantity"
      class="quantity"
      type="number"
      min="1"
      max="99"
      value="1"
      placeholder="Quantity">

    <button
      id="sendGiftConfirm"
      class="send-btn"
      type="button">
      Send Gift
    </button>

  </div>

</div>


<!-- EMOJI MODAL -->

<div
  id="emojiModal"
  class="modal">

  <div class="sheet">

    <div class="sheet-title">

      <span>😊 Emoji</span>

      <button
        class="close-btn"
        type="button"
        data-close="emojiModal">
        ×
      </button>

    </div>

    <div
      id="emojiGrid"
      class="emoji-grid">
    </div>

  </div>

</div>


<!-- MORE MODAL -->

<div
  id="moreModal"
  class="modal">

  <div class="sheet">

    <div class="sheet-title">

      <span>More</span>

      <button
        class="close-btn"
        type="button"
        data-close="moreModal">
        ×
      </button>

    </div>

    <div class="setting-row">
      <span>👤 Profile</span>
      <button type="button" id="profileBtn">Open</button>
    </div>

    <div class="setting-row">
      <span>🪑 Take Seat</span>
      <button type="button" id="takeSeatBtn">Choose</button>
    </div>

    <div class="setting-row">
      <span>🚪 Leave Seat</span>
      <button type="button" id="leaveSeatBtn">Leave</button>
    </div>

    <div class="setting-row">
      <span>🏠 Home</span>
      <button type="button" id="homeBtn">Open</button>
    </div>

  </div>

</div>


<!-- SETTINGS MODAL -->

<div
  id="settingsModal"
  class="modal">

  <div class="sheet">

    <div class="sheet-title">

      <span>⚙️ Room Settings</span>

      <button
        class="close-btn"
        type="button"
        data-close="settingsModal">
        ×
      </button>

    </div>

    <div class="setting-row">
      <span>Room ID</span>

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function money(value){

  const n =
    Number(value || 0);

  return n.toLocaleString(
    "en-IN"
  );
}


function safeNumber(
  value,
  fallback = 0
){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function getRoomId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("room") ||
    params.get("roomId") ||
    "main"
  );
}


function toast(message){

  el.textContent =
    message;

  el.classList.add("show");

  clearTimeout(

}

async function loadFirebaseRoom(){

  try{

    const response =
      await fetch(
        FIREBASE_DB +
        "/rooms/" +
        encodeURIComponent(
          roomId
        ) +
        ".json"
      );

    if(!response.ok) return;

    const data =
      await response.json();

    if(!data) return;

    roomState.name =
      data.name ||
      roomState.name;

    roomState.dp =
      data.dp ||
      me.dp ||
      roomState.dp;

    document.getElementById(
      "roomName"
    ).textContent =
      roomState.name;

    document.getElementById(
      "roomDp"
    ).src =
      roomState.dp ||
      me.dp;

  }catch(error){

    console.log(
      "Firebase room:",
      error
    );
  }
}


/* -----------------------------
   SAVE FIREBASE ROOM
----------------------------- */

async function saveFirebaseRoom(){

  try{

    const users =
      Object.keys(
        roomState.users ||
        {}
      ).length;

    const payload = {

      id:roomId,

      name:
        roomState.name ||
        "PawanVoice Room",

      dp:
        roomState.dp ||
        me.dp,

      owner:
        me.name,

      ownerId:
        me.userId,

      ownerDp:
        me.dp,

      category:"General",

      users,

      seats:SEAT_COUNT,

      createdAt:
        Date.now()

    };

    await fetch(
      FIREBASE_DB +
      "/rooms/" +
      encodeURIComponent(
        roomId
      ) +
      ".json",
      {
        method:"PATCH",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );

  }catch(error){

    console.log(
      "Room Firebase save:",
      error
    );
  }
}


/* ==================================================
   SOCKET
   ================================================== */

function connectSocket(){

  try{

    socket =
      io(
        SERVER_URL,
        {
          transports:[
            "websocket",
            "polling"
          ],

          reconnection:true,

          reconnectionAttempts:Infinity,

          timeout:10000
        }
      );

  }catch(error){

    console.error(
      "Socket error:",
      error
    );

    return;
  }


  socket.on(
    "connect",
    async ()=>{

      setConnectionStatus(
        "Connected"
      );

      socket.emit(
        "join-room",
        {
          roomId,

          userId:
            me.userId,

          name:
            me.name,

          dp:
            me.dp,

          level:
            me.level,

          exp:
            me.exp,

          vipLevel:
            me.vipLevel,

          vipExp:
            me.vipExp,

          avatarFrame:
            me.avatarFrame,

          badge:
            me.badge,

          entryEffect:
            me.entryEffect
        }
      );

      await loadRtcConfig();

      if(localStream){

        await connectToExistingUsers();
      }
    }
  );


  socket.on(
    "disconnect",
    ()=>{
      setConnectionStatus(
        "Disconnected"
      );
    }
  );


  socket.on(
    "connect_error",
    error=>{
      console.log(
        "Socket connect error:",
        error
      );

      setConnectionStatus(
        "Connection error"
      );
    }
  );


  socket.on(
    "room-state",
    data=>{

      applyRoomState(
        data
      );
    }
  );


  socket.on(
    "roomState",
    data=>{

      applyRoomState(
        data
      );
    }
  );


  socket.on(
    "user-entry",
    async data=>{

      if(!data) return;

      if(
        data.socketId &&
        data.socketId !==
          socket.id
      ){

        if(localStream){

          if(
            socket.id <
            data.socketId
          ){

            try{

              await createPeer(
                data.socketId,
                data.userId ||
                  "",
                true
              );

            }catch(error){

              console.log(
                "New peer:",
                error
              );
            }
          }
        }
      }
    }
  );


  socket.on(
    "user-left",
    data=>{

      if(
        data &&
        data.socketId
      ){

        cleanupPeer(
          data.socketId
        );
      }

    }
  );


  socket.on(
    "mic-status",
    data=>{

      if(!data) return;

      const user =
        roomState.users[
          data.userId
        ];

      if(user){

        user.mic =
          Boolean(
            data.mic
          );
      }

      renderSeats();
    }
  );


  socket.on(
    "chat-message",
    message=>{

      if(!message) return;

      roomState.messages.push(
        message
      );

      if(
        roomState.messages.length >
        100
      ){

        roomState.messages =
          roomState.messages.slice(
            -100
          );
      }

      renderChat();
    }
  );


  socket.on(
    "gift-received",
    gift=>{

      if(!gift) return;

      roomState.gifts.push(
        gift
      );

      if(
        roomState.gifts.length >
        50
      ){

        roomState.gifts =
          roomState.gifts.slice(
            -50
          );
      }

      showGiftAnimation(
        gift
      );
    }
  );


  socket.on(
    "giftReceived",
    gift=>{

      if(!gift) return;

      showGiftAnimation(
        gift
      );
    }
  );


  socket.on(
    "kicked",
    data=>{

      toast(
        data?.message ||
        "You were removed from the room"
      );

      setTimeout(
        ()=>{
          location.href =
            "/index.html";
        },
        1500
      );
    }
  );


  socket.on(
    "admin-error",
    data=>{

      toast(
        data?.message ||
        "Admin action failed"
      );
    }
  );


  socket.on(
    "seat-error",
    data=>{

      toast(
        data?.message ||
        "Seat unavailable"
      );
    }
  );


  socket.on(
    "new-host",
    data=>{

      toast(
        "New room host selected"
      );

      renderSeats();
    }
  );


  socket.on(
    "webrtc-offer",
    handleOffer
  );


  socket.on(
    "webrtc-answer",
    handleAnswer
  );


  socket.on(
    "ice-candidate",
    handleIce
  );


  socket.on(
    "iceCandidate",

/* -----------------------------
   APPLY ROOM STATE
----------------------------- */

function applyRoomState(
  data
){

  if(!data) return;

  roomState =
    {
      ...roomState,
      ...data
    };

  roomState.seats =
    Array.isArray(
      data.seats
    )
      ? data.seats
      : Array(SEAT_COUNT).fill(null);

  roomState.users =
    data.users &&
    typeof data.users ===
      "object"
      ? data.users
      : {};

  roomState.messages =
    Array.isArray(
      data.messages
    )
      ? data.messages
      : [];

  roomState.gifts =
    Array.isArray(
      data.gifts
    )
      ? data.gifts
      : [];

  if(roomState.name){

    document.getElementById(
      "roomName"
    ).textContent =
      roomState.name;
  }

  if(
    roomState.dp
  ){

    document.getElementById(
      "roomDp"
    ).src =
      roomState.dp;
  }

  renderSeats();

  renderChat();

  updateExp();

  updateRoomCount();

  updateTop3();

  saveFirebaseRoom();

  if(
    localStream
  ){

    connectToExistingUsers();
  }
}

  );

----------------------------- */

function openUserActions(
  userId
){

  const user =
    roomState.users[
      userId
    ];

  if(!user) return;

  const host =
    roomState.seats[0];

  const isHost =
    host &&
    host.userId ===
      me.userId;


  let message =
    user.name +
    "\nUser ID: " +
    user.userId;


  if(
    isHost &&
    user.userId !==
      me.userId
  ){

    const action =
      confirm(
        message +
        "\n\nOK = Kick\nCancel = Close"
      );

    if(action){

      socket.emit(
        "admin-kick",
        {
          userId
        }
      );

    }

    return;
  }


  alert(
    message +
    "\nLevel: " +
    (user.level || 1) +
    "\nVIP: " +
    (user.vipLevel || 0)
  );
}

/* ==================================================
   SEND GIFT
   ================================================== */

async function sendGift(){

  if(!selectedGift){

    toast(
      "Select a gift"
    );

    return;
  }


  if(!selectedReceiverId){

    toast(
      "Select receiver"
    );

    return;
  }


  let quantity =
    Number(
      document.getElementById(
        "giftQuantity"
      ).value
    );


  if(
    !Number.isFinite(
      quantity
    )
  ){

    quantity = 1;
  }


  quantity =
    Math.max(
      1,
      Math.min(
        99,
        Math.floor(
          quantity
        )
      )
    );


  const total =
    selectedGift.price *
    quantity;


  if(
    safeNumber(
      me.coins,
      0
    ) <
    total
  ){

    toast(
      "Not enough coins"
    );

    return;
  }


  try{

    /*
      NOTE:
      This client-side wallet flow is
      suitable for testing only.
      Production wallet must be
      secured by server/Cloud Functions.
    */


    const receiverResponse =
      await fetch(
        FIREBASE_DB +
        "/users/" +
        encodeURIComponent(
          selectedReceiverId
        ) +
        ".json"
      );


    if(
      !receiverResponse.ok
    ){

      throw new Error(
        "Receiver load failed"
      );
    }


    const receiver =
      await receiverResponse.json();


    if(!receiver){

      toast(
        "Receiver not found"
      );

      return;
    }


    const senderCoins =
      safeNumber(
        me.coins,
        0
      );


    const receiverCoins =
      safeNumber(
        receiver.coins,
        0
      );


    const newSenderCoins =
      senderCoins -
      total;


    const newReceiverCoins =
      receiverCoins +
      total;


    await fetch(
      FIREBASE_DB +
      "/users/" +
      encodeURIComponent(
        me.userId
      ) +
      ".json",
      {
        method:"PATCH",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            coins:
              newSenderCoins,
            updatedAt:
              Date.now()
          })
      }
    );


    await fetch(
      FIREBASE_DB +
      "/users/" +
      encodeURIComponent(
        selectedReceiverId
      ) +
      ".json",
      {
        method:"PATCH",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            coins:
              newReceiverCoins,
            updatedAt:
              Date.now()
          })
      }
    );


    me.coins =
      newSenderCoins;


    saveLocalUser();


    const transactionId =
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2);


    const transaction = {

      id:
        transactionId,

      giftId:
        selectedGift.id,

      giftName:
        selectedGift.name,

      icon:
        selectedGift.icon,

      price:
        selectedGift.price,

      quantity,

      total,

      senderId:
        me.userId,

      senderName:
        me.name,

      senderDp:
        me.dp,

      receiverId:
        selectedReceiverId,

      receiverName:
        receiver.name ||
        "Guest",

      receiverDp:
        receiver.dp ||
        "",

      time:
        Date.now()

    };


    await fetch(
      FIREBASE_DB +
      "/giftTransactions/" +
      transactionId +
      ".json",
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            transaction
          )
      }
    );


    await fetch(
      FIREBASE_DB +
      "/coinTransactions/" +
      transactionId +
      "_S.json",
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            type:"gift_sent",
            amount:-total,
            userId:
              me.userId,
            receiverId:
              selectedReceiverId,
            gift:
              selectedGift.name,
            quantity,
            time:
              Date.now()
          })
      }
    );


    await fetch(
      FIREBASE_DB +
      "/coinTransactions/" +
      transactionId +
      "_R.json",
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            type:"gift_received",
            amount:total,
            userId:
              selectedReceiverId,
            senderId:
              me.userId,
            gift:
              selectedGift.name,
            quantity,
            time:
              Date.now()
          })
      }
    );


    if(socket){

      socket.emit(
        "send-gift",
        {
          id:
            transactionId,

          giftId:
            selectedGift.id,

          giftName:
            selectedGift.name,

          icon:
            selectedGift.icon,

          price:
            selectedGift.price,

          quantity,

          receiverId:
            selectedReceiverId,

          receiverName:
            receiver.name ||
            "Guest"
        }
      );
    }


    closeModal(
      "sendGiftModal"
    );


    toast(
      selectedGift.icon +
      " " +
      selectedGift.name +
      " sent!"
    );


    showGiftAnimation({
      icon:
        selectedGift.icon,

      giftName:
        selectedGift.name,

      senderName:
        me.name,

      receiverName:
        receiver.name
    });


  }catch(error){

    console.error(
      "Gift error:",
      error
    );

    toast(
      "Gift send failed"
    );
  }
}

/* -----------------------------
   CREATE PEER
----------------------------- */

async function createPeer(
  socketId,
  userId,
  initiator
){

  if(
    !socketId ||
    !socket ||
    socketId ===
      socket.id
  ){

    return null;
  }


  if(
    peers[socketId]
  ){

    return peers[
      socketId
    ].pc;
  }


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peers[socketId] = {
    pc,
    userId,
    makingOffer:false,
    ignoreOffer:false
  };


  /*
    Add microphone tracks
  */

  if(
    localStream
  ){

    localStream
      .getTracks()
      .forEach(
        track=>{

          try{

            pc.addTrack(
              track,
              localStream
            );

          }catch(error){

            console.log(
              "addTrack:",
              error
            );
          }

        }
      );
  }


  /*
    ICE
  */

  pc.onicecandidate =
    event=>{

      if(
        !event.candidate
      ) return;


      socket.emit(
        "ice-candidate",
        {
          roomId,

          targetSocketId:
            socketId,

          candidate:
            event.candidate
        }
      );

    };


  /*
    Remote audio
  */

  pc.ontrack =
    event=>{

      if(
        !event.streams ||
        !event.streams[0]
      ){

        return;
      }


      let audio =
        document.getElementById(
          "remote-" +
          socketId
        );


      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.id =
          "remote-" +
          socketId;

        audio.autoplay =
          true;

        audio.playsInline =
          true;

        audio.className =
          "hidden-audio";

        document.body.appendChild(
          audio
        );
      }


      audio.srcObject =
        event.streams[0];


      audio.muted =
        !speakerOn;


      /*
        Browser autoplay may need
        a user gesture. We try to play.
      */

      audio.play()
        .catch(
          error=>{
            console.log(
              "Remote audio play:",
              error
            );
          }
        );
    };


  /*
    Connection state
  */

  pc.onconnectionstatechange =
    ()=>{

      console.log(
        "Peer",
        socketId,
        pc.connectionState
      );


      if(
        [
          "failed",
          "closed"
        ].includes(
          pc.connectionState
        )
      ){

        cleanupPeer(
          socketId
        );
      }

    };


  /*
    ICE connection state
  */

  pc.oniceconnectionstatechange =
    ()=>{

      console.log(
        "ICE",
        socketId,
        pc.iceConnectionState
      );

    };


  /*
    Initiator creates offer
  */

  if(
    initiator
  ){

    try{

      const offer =
        await pc.createOffer();


      await pc.setLocalDescription(
        offer
      );


      socket.emit(
        "webrtc-offer",
        {
          roomId,

          targetSocketId:
            socketId,

          offer:
            pc.localDescription
        }
      );

    }catch(error){

      console.error(
        "Create offer:",
        error
      );
    }
  }


  return pc;
}


/* -----------------------------
   OFFER
----------------------------- */

async function handleOffer(
  data
){

  try{

    if(!data) return;


    const fromSocketId =
      data.fromSocketId;


    if(
      !fromSocketId ||
      fromSocketId ===
        socket.id
    ){

      return;
    }


    let pc =
      peers[
        fromSocketId
      ]?.pc;


    if(!pc){

      pc =
        await createPeer(
          fromSocketId,
          data.fromUserId ||
            "",
          false
        );
    }


    if(
      !data.offer
    ){

      return;
    }


    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );


    /*
      Add local tracks if they became
      available after peer creation.
    */

    addLocalTracksToPeer(
      pc
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    socket.emit(
      "webrtc-answer",
      {
        roomId,

        targetSocketId:
          fromSocketId,

        answer:
          pc.localDescription
      }
    );


  }catch(error){

    console.error(
      "Handle offer:",
      error
    );
  }
}


/* -----------------------------
   ANSWER
----------------------------- */

async function handleAnswer(
  data
){

  try{

    if(!data) return;


    const fromSocketId =
      data.fromSocketId;


    const peer =
      peers[
        fromSocketId
      ];


    if(
      !peer ||
      !peer.pc ||
      !data.answer
    ){

      return;
    }


    await peer.pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );


  }catch(error){

    console.error(
      "Handle answer:",
      error
    );
  }
}


/* -----------------------------
   ICE
----------------------------- */

async function handleIce(
  data
){

  try{

    if(!data) return;


    const fromSocketId =
      data.fromSocketId;


    const peer =
      peers[
        fromSocketId
      ];


    if(
      !peer ||
      !peer.pc ||
      !data.candidate
    ){

      return;
    }


    await peer.pc.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );


  }catch(error){

    console.log(
      "ICE candidate:",
      error
    );
  }
}


/* -----------------------------
   ADD TRACKS
----------------------------- */

function addLocalTracksToPeer(
  pc
){

  if(!localStream) return;


  localStream
    .getTracks()
    .forEach(
      track=>{

        const already =
          pc.getSenders()
            .some(
              sender =>
                sender.track ===
                track
            );


        if(!already){

          try{

            pc.addTrack(
              track,
              localStream
            );

          }catch(error){

            console.log(
              "Peer track:",
              error
            );
          }
        }

      }
    );
}


function addLocalTracksToPeers(){

  if(!localStream) return;


  Object.values(
    peers
  )
  .forEach(
    peer=>{
      if(
        peer &&
        peer.pc
      ){

        addLocalTracksToPeer(
          peer.pc
        );
      }
    }
  );
}


/* -----------------------------
   CONNECT TO EXISTING USERS
----------------------------- */

async function connectToExistingUsers(){

  if(
    !socket ||
    !localStream
  ){

    return;
  }


  const users =
    roomState.users ||
    {};


  for(
    const userId of
      Object.keys(users)
  ){

    const user =
      users[
        userId
      ];


    if(!user) continue;


    if(
      user.userId ===
        me.userId
    ){

      continue;
    }


    const targetSocketId =
      user.socketId;


    if(!targetSocketId){

      continue;
    }


    /*
      Deterministic initiator:
      only lower socket ID sends offer.
    */

    if(
      socket.id <
      targetSocketId
    ){

      try{

        await createPeer(
          targetSocketId,
          userId,
          true
        );

      }catch(error){

        console.log(
          "Existing peer:",
          error
        );
      }
    }
  }
}


/* -----------------------------
   CLEANUP PEER
----------------------------- */

function cleanupPeer(
  socketId
){

  const peer =
    peers[
      socketId
    ];


  if(peer){

    try{
      peer.pc.close();
    }catch(e){}

    delete peers[
      socketId
    ];
  }


  const audio =
    document.getElementById(
      "remote-" +
      socketId
    );


  if(audio){

    try{
      audio.srcObject =
        null;
    }catch(e){}

    audio.remove();
  }
}


/* ==================================================
   MICROPHONE
   ================================================== */

async function toggleMic(){

  if(
    micOn
  ){

    stopMicrophone();

  }else{

    await startMicrophone();

  }
}


/* -----------------------------
   START MIC
----------------------------- */

async function startMicrophone(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    toast(
      "This browser does not support microphone"
    );

    return;
  }


  try{

    if(!localStream){

      localStream =
        await navigator
          .mediaDevices
          .getUserMedia({
            audio:{
              echoCancellation:true,
              noiseSuppression:true,
              autoGainControl:true
            },

            video:false
          });
    }


    localStream
      .getAudioTracks()
      .forEach(
        track=>{
          track.enabled =
            true;
        }
      );


    micOn =
      true;


    /*
      Add microphone to all
      existing peer connections.
    */

    addLocalTracksToPeers();


    /*
      Tell server.
    */

    if(socket){

      socket.emit(
        "mic-status",
        {
          mic:true
        }
      );
    }


    /*
      Create connections to
      existing room users.
    */

    await connectToExistingUsers();


    updateMicButton();


    toast(
      "Microphone ON"
    );


  }catch(error){

    console.error(
      "Microphone error:",
      error
    );


    micOn =
      false;


    updateMicButton();


    if(
      error.name ===
      "NotAllowedError"
    ){

      toast(
        "Microphone permission Allow करें"
      );

    }else{

      toast(
        "Microphone start failed"
      );
    }
  }
}


/* -----------------------------
   STOP MIC
----------------------------- */

function stopMicrophone(){

  if(
    localStream
  ){

    localStream
      .getAudioTracks()
      .forEach(
        track=>{
          track.enabled =
            false;
        }
      );
  }


  micOn =
    false;


  if(socket){

    socket.emit(
      "mic-status",
      {
        mic:false
      }
    );
  }


  updateMicButton();


  toast(
    "Microphone OFF"
  );
}


/* -----------------------------
   MIC BUTTON
----------------------------- */

function updateMicButton(){

  const button =
    document.getElementById(
      "micBtn"
    );


  const settingsButton =
    document.getElementById(
      "settingsMicBtn"
    );


  if(
    micOn
  ){

    button.textContent =
      "🎙️";

    button.classList.add(
      "mic-on"
    );


    if(settingsButton){

      settingsButton.textContent =
        "ON";
    }

  }else{

    button.textContent =
      "🔇";

    button.classList.remove(
      "mic-on"
    );


    if(settingsButton){

      settingsButton.textContent =
        "OFF";
    }
  }
}


/* ==================================================
   SPEAKER
   ================================================== */

function toggleSpeaker(){

  speakerOn =
    !speakerOn;


  document.getElementById(
    "speakerBtn"
  ).textContent =
    speakerOn
      ? "🔊"
      : "🔇";


  Object.keys(
    peers
  )
  .forEach(
    socketId=>{

      const audio =
        document.getElementById(
          "remote-" +
          socketId
        );


      if(audio){

        audio.muted =
          !speakerOn;

        if(
          speakerOn
        ){

          audio.play()
            .catch(
              ()=>{}
            );
        }
      }
    }
  );


  toast(
    speakerOn
      ? "Speaker ON"
      : "Speaker OFF"
  );
}

   ================================================== */

async function inviteRoom(){

  const link =
    window.location.href;


  /*
    Clipboard API may not be available
    in every WebView. Fallback prompt.
  */

  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        link
      );

      toast(
        "Room link copied"
      );

      return;
    }

  }catch(e){}


  window.prompt(
    "Copy room link",
    link
  );
}
