<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#10131b;
  color:#fff;
  font-family:Arial,sans-serif;
}
button{
  border:0;
  color:#fff;
  background:#202532;
  border-radius:12px;
  padding:10px 13px;
  cursor:pointer;
}
button:active{transform:scale(.97)}
#app{max-width:650px;margin:auto;min-height:100vh;position:relative}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px;
  background:#171b26;
  position:sticky;
  top:0;
  z-index:20;
}
.roomInfo{display:flex;align-items:center;gap:9px;min-width:0}
.roomDp{
  width:48px;height:48px;border-radius:50%;
  object-fit:cover;background:#343a4b;
  border:2px solid #555;
}
.roomTitle{min-width:0}
.roomTitle b{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.roomTitle small{color:#aab0bd}

.headerBtns{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.headerBtns button{
  width:38px;height:38px;padding:0;
  font-size:17px;
}

.roomArea{
  padding:15px 10px 130px;
  min-height:650px;
  background:
    radial-gradient(circle at 50% 20%,#252b42 0,#151925 35%,#10131b 70%);
}

.topActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-bottom:10px;
}
.topActions button{
  background:#252b3a;
  min-width:78px;
}

.ownerBox{
  text-align:center;
  margin:5px auto 25px;
}
.ownerSeat{
  width:82px;height:82px;
  margin:auto;
  border-radius:50%;
  background:#292f40;
  border:3px solid #d6a94a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  overflow:hidden;
}
.ownerSeat img{
  width:100%;height:100%;object-fit:cover;
}
.crown{font-size:20px;margin-top:4px}
.userName{font-weight:bold;margin-top:4px}
.userId{font-size:11px;color:#9299aa}

.seats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px 8px;
  max-width:560px;
  margin:auto;
}
.seat{
  text-align:center;
  min-width:0;
}
.seatAvatar{
  width:62px;height:62px;
  border-radius:50%;
  margin:auto;
  background:#252b39;
  border:2px solid #51596c;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}
.seatAvatar img{
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
}
.empty{
  color:#777f91;
  font-size:25px;
}
.mic{
  position:absolute;
  right:-4px;
  bottom:-3px;
  background:#161a24;
  border-radius:50%;
  padding:3px;
  font-size:12px;
}
.vip{
  position:absolute;
  left:-7px;
  top:-7px;
  background:#8d5bce;
  border-radius:7px;
  padding:2px 4px;
  font-size:9px;
}
.frame1{border-color:#f0b94b}
.frame2{border-color:#55c7ff}
.frame3{border-color:#d96cff}

.seatName{
  font-size:12px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.seatId{
  color:#858c9d;
  font-size:10px;
}

.bottomBar{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(650px,100%);
  padding:8px 10px;
  background:#171b25;
  border-top:1px solid #303646;
  display:flex;
  align-items:center;
  gap:7px;
  z-index:50;
}
.bottomBar button{
  min-width:48px;
  min-height:48px;
  padding:5px;
  font-size:12px;
}
.bottomBar .big{
  flex:1;
}
.moreBtn{
  background:#303746;
}

.panel{
  position:fixed;
  left:50%;
  bottom:72px;
  transform:translateX(-50%);
  width:min(620px,94%);
  max-height:75vh;
  overflow:auto;
  background:#1a1f2b;
  border:1px solid #343b4d;
  border-radius:18px;
  padding:15px;
  z-index:100;
  box-shadow:0 15px 45px #0008;
}
.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.panelHead b{font-size:18px}
.close{
  width:40px;height:40px;
  padding:0;
}
.optionGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.option{
  min-height:70px;
  text-align:center;
  padding:9px 5px;
  background:#242a38;
}
.option span{
  display:block;
  font-size:24px;
  margin-bottom:4px;
}
.option small{color:#c4c9d4}

.detail{
  line-height:1.5;
}
.detail button{margin-top:10px}

.chatBox{
  display:flex;
  gap:7px;
}
.chatBox input{
  flex:1;
  min-width:0;
  background:#272d3a;
  border:1px solid #3b4354;
  color:#fff;
  border-radius:12px;
  padding:12px;
  font-size:15px;
}
.chatMessages{
  max-height:300px;
  overflow:auto;
  margin-bottom:10px;
}
.msg{
  padding:7px 9px;
  background:#242a36;
  border-radius:9px;
  margin-bottom:6px;
  font-size:13px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:135px;
  transform:translateX(-50%);
  background:#000d;
  padding:10px 15px;
  border-radius:10px;
  z-index:300;
  display:none;
}

.hidden{display:none!important}

@media(max-width:420px){
  .seats{gap:15px 4px}
  .seatAvatar{width:56px;height:56px}
  .optionGrid{grid-template-columns:repeat(3,1fr)}
  .bottomBar button{min-width:44px}
}
</style>
</head>

<body>
<div id="app">

<header class="header">
  <div class="roomInfo">
    <img id="roomDp" class="roomDp" src="" alt="Room">
    <div class="roomTitle">
      <b id="roomName">PawanVoice Room</b>
      <small id="roomNumber">Room No: ----</small><br>
      <small id="ownerText">Owner: --</small>
    </div>
  </div>

  <div class="headerBtns">
    <button onclick="openPanel('settings')">⚙️</button>
    <button onclick="openPanel('users')">👥</button>
    <button onclick="shareRoom()">↗️</button>
    <button onclick="copyRoom()">📋</button>
    <button onclick="openPanel('info')">ℹ️</button>
    <button onclick="leaveRoom()">🚪</button>
  </div>
</header>

<main class="roomArea">

  <!-- PK + Ranking ऊपर RIGHT -->
  <div class="topActions">
    <button onclick="openFeature('pk')">⚔️ PK</button>
    <button onclick="openFeature('ranking')">🏆 Ranking</button>
  </div>

  <!-- OWNER -->
  <section class="ownerBox">
    <div id="ownerAvatar" class="ownerSeat">👑</div>
    <div class="crown">👑 OWNER</div>
    <div id="ownerName" class="userName">Loading...</div>
    <div id="ownerId" class="userId"></div>
  </section>

  <!-- SEATS 2-9 -->
  <section id="seatGrid" class="seats"></section>

</main>

<!-- BOTTOM -->
<nav class="bottomBar">
  <button class="big" onclick="openPanel('chat')">💬<br>Chat</button>
  <button onclick="toggleMic()" id="micButton">🎙️<br>Mic</button>
  <button onclick="toggleSpeaker()" id="speakerButton">🔊<br>Speaker</button>
  <button onclick="openPanel('inbox')">📥<br>Inbox</button>
  <button class="big" onclick="openPanel('gift')">🎁<br>Gift</button>

  <!-- Gift के ठीक आगे More -->
  <button class="moreBtn big" onclick="openPanel('more')">☰<br>More</button>
</nav>

<!-- MORE -->
<div id="morePanel" class="panel hidden">
  <div class="panelHead">
    <b>☰ More — All Options</b>
    <button class="close" onclick="closePanels()">✕</button>
  </div>

  <div id="moreGrid" class="optionGrid"></div>
</div>

<!-- DETAIL -->
<div id="detailPanel" class="panel hidden">
  <div class="panelHead">
    <b id="detailTitle">Option</b>
    <button class="close" onclick="closePanels()">✕</button>
  </div>

  <div class="detail">
    <p id="detailText"></p>
    <button id="addShortcutBtn" onclick="addShortcut()">⭐ Add to Main Room</button>
  </div>
</div>

<!-- CHAT -->
<div id="chatPanel" class="panel hidden">
  <div class="panelHead">
    <b>💬 Room Chat</b>
    <button class="close" onclick="closePanels()">✕</button>
  </div>
  <div id="chatMessages" class="chatMessages"></div>
  <div class="chatBox">
    <input id="chatInput" placeholder="Message लिखें...">
    <button onclick="sendChat()">Send</button>
  </div>
</div>

<!-- GENERIC PANEL -->
<div id="genericPanel" class="panel hidden">
  <div class="panelHead">
    <b id="genericTitle">Option</b>
    <button class="close" onclick="closePanels()">✕</button>
  </div>
  <div id="genericContent" class="detail"></div>
</div>

<div id="toast" class="toast"></div>

</div>

<script>
/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyDnlTde5G5aPHrUIV6kTYnM521GtbrrE",
  authDomain: "pawanvoice-68c5e.firebaseapp.com",
  databaseURL: "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
  projectId: "pawanvoice-68c5e",
  storageBucket: "pawanvoice-68c5e.firebasestorage.app",
  messagingSenderId: "148446327241",
  appId: "1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* Basic IDs */
const params = new URLSearchParams(location.search);
let roomId =
  params.get("room") ||
  params.get("roomId") ||
  localStorage.getItem("pawanRoomId") ||
  "";

let myId =
  localStorage.getItem("pawanNumericUserId") ||
  ("u" + Math.random().toString(36).slice(2,10));

localStorage.setItem("pawanNumericUserId",myId);

let myName =
  localStorage.getItem("pawanName") ||
  "Pawan";

let myDp =
  localStorage.getItem("pawanDp") ||
  "";

let micOn = true;
let speakerOn = true;
let selectedOption = "";
let shortcuts =
  JSON.parse(localStorage.getItem("pawanRoomShortcuts") || "[]");

/* All More options */
const moreOptions = [
  ["🎁","Gift","Gifts और gift history"],
  ["⚔️","PK","1 vs 1 / team PK"],
  ["🎮","Games","Room mini games"],
  ["🏆","Ranking","Room और user ranking"],
  ["🎯","Missions","Daily और weekly missions"],
  ["🎵","Music","Music और playlist"],
  ["🎉","Events","Room events और challenges"],
  ["🎨","Decoration","Room background और effects"],
  ["👑","VIP","VIP levels और privileges"],
  ["📊","Analytics","Room statistics"],
  ["🛡️","Safety","Report, block और moderation"],
  ["📜","History","Room activity history"],
  ["👨‍👩‍👧","Family","Family / club features"],
  ["✨","Moments","Important room moments"],
  ["📝","Captions","Live captions"],
  ["🌐","Translation","Chat translation"],
  ["📣","Announcement","Room announcement"],
  ["🎙️","Speaker Queue","Speaker waiting queue"],
  ["🔒","Seat Management","Seat lock और permissions"],
  ["👥","Online Users","Online members"],
  ["💬","Chat Settings","Chat controls"],
  ["❤️","Likes","Room likes"],
  ["🎖️","Achievements","Achievements और badges"],
  ["📅","Schedule","Scheduled room"],
  ["🎫","Tickets","Event tickets"],
  ["🔔","Notifications","Room notifications"],
  ["🚫","Ban List","Blocked users"],
  ["👑","Co-Host","Co-host management"],
  ["🔄","Reconnect","Voice reconnect"],
  ["🎤","Mic Test","Mic test"],
  ["🔊","Speaker Test","Speaker test"]
];

/* Initial render */
renderMore();
renderSeats();
loadRoom();

/* Room loading */
function loadRoom(){
  if(!roomId){
    toast("Room ID नहीं मिला");
    return;
  }

  localStorage.setItem("pawanRoomId",roomId);

  db.ref("rooms/"+roomId).on("value",snap=>{
    const data=snap.val() || {};

    document.getElementById("roomName").textContent =
      data.name || "PawanVoice Room";

    document.getElementById("roomNumber").textContent =
      "Room No: " + (data.roomNumber || "----");

    document.getElementById("ownerText").textContent =
      "Owner: " + (data.ownerName || "Pawan");

    if(data.settings && data.settings.dp){
      document.getElementById("roomDp").src=data.settings.dp;
    }else{
      document.getElementById("roomDp").src =
        makeAvatar(data.name || "P");
    }

    document.getElementById("ownerName").textContent =
      data.ownerName || "Pawan";

    document.getElementById("ownerId").textContent =
      data.ownerId ? "ID: "+data.ownerId : "";

    if(data.ownerDp){
      document.getElementById("ownerAvatar").innerHTML =
        '<img src="'+escapeAttr(data.ownerDp)+'" alt="Owner">';
    }

    renderUsers(data.users || {});
  });
}

/* Seats */
function renderSeats(users){
  const grid=document.getElementById("seatGrid");
  grid.innerHTML="";

  const arr=Object.values(users || {});
  const occupied={};

  arr.forEach(u=>{
    if(u.seat) occupied[Number(u.seat)]=u;
  });

  for(let seatNo=2;seatNo<=9;seatNo++){
    const u=occupied[seatNo];

    const seat=document.createElement("div");
    seat.className="seat";

    if(u){
      let frameClass="";
      if(u.frame==="frame1") frameClass="frame1";
      if(u.frame==="frame2") frameClass="frame2";
      if(u.frame==="frame3") frameClass="frame3";

      seat.innerHTML=`
        <div class="seatAvatar ${frameClass}"
             onclick="openUser('${escapeAttr(u.id || "")}')">
          <img src="${escapeAttr(u.dp || makeAvatar(u.name || "U"))}"
               alt="User">
          ${Number(u.vip||0)>0
            ? `<div class="vip">VIP ${Number(u.vip)}</div>`:""}
          <div class="mic">${u.mic===false?"🔇":"🎙️"}</div>
        </div>
        <div class="seatName">${escapeHtml(u.name || "User")}</div>
        <div class="seatId">ID: ${escapeHtml(u.id || "")}</div>
      `;
    }else{
      seat.innerHTML=`
        <div class="seatAvatar empty"
             onclick="requestSeat(${seatNo})">＋</div>
        <div class="seatName">Seat ${seatNo}</div>
        <div class="seatId">Empty</div>
      `;
    }

    grid.appendChild(seat);
  }
}

/* Users */
function renderUsers(users){
  renderSeats(users);
}

/* More */
function renderMore(){
  const grid=document.getElementById("moreGrid");
  grid.innerHTML="";

  moreOptions.forEach(item=>{
    const icon=item[0];
    const name=item[1];

    const b=document.createElement("button");
    b.className="option";
    b.type="button";

    b.innerHTML=
      "<span>"+icon+"</span>"+
      "<b>"+name+"</b>"+
      "<small>"+(isShortcut(icon+" "+name)?" ✓ Main":"")+"</small>";

    b.onclick=()=>openFeature(name);

    grid.appendChild(b);
  });
}

function isShortcut(label){
  return shortcuts.indexOf(label)>=0;
}

/* Feature */
function openFeature(name){
  selectedOption=name;

  if(name==="PK"){
    showGeneric(
      "⚔️ PK",
      `
      <p>PK / Battle room यहाँ खुलेगा।</p>
      <button onclick="toast('PK invite भेजने का flow यहाँ चलेगा')">
      ⚔️ Invite for PK
      </button>
      `
    );
    return;
  }

  if(name==="Ranking"){
    showGeneric(
      "🏆 Ranking",
      `
      <p>Room ranking</p>
      <button onclick="toast('Room ranking खुल गया')">🏆 Room Ranking</button>
      <button onclick="toast('Gift ranking खुल गया')">🎁 Gift Ranking</button>
      <button onclick="toast('Like ranking खुल गया')">❤️ Like Ranking</button>
      `
    );
    return;
  }

  const found=moreOptions.find(x=>x[1]===name);

  showGeneric(
    (found ? found[0]+" " : "")+name,
    `<p>${found ? found[2] : "इस feature का अपना panel यहाँ खुलेगा।"}</p>`
  );
}

/* Add option to Main Room */
function addShortcut(){
  if(!selectedOption)return;

  if(shortcuts.indexOf(selectedOption)>=0){
    toast("यह पहले से Main Room पर है");
    return;
  }

  shortcuts.push(selectedOption);
  localStorage.setItem(
    "pawanRoomShortcuts",
    JSON.stringify(shortcuts)
  );

  renderMore();
  toast(selectedOption+" Main Room पर add हो गया");
  closePanels();
}

/* Generic */
function showGeneric(title,content){
  document.getElementById("morePanel").classList.add("hidden");
  document.getElementById("detailPanel").classList.add("hidden");

  document.getElementById("genericTitle").textContent=title;
  document.getElementById("genericContent").innerHTML=content;

  document.getElementById("genericPanel").classList.remove("hidden");
}

/* Panels */
function openPanel(name){
  closePanels();

  if(name==="more"){
    renderMore();
    document.getElementById("morePanel").classList.remove("hidden");
    return;
  }

  if(name==="chat"){
    document.getElementById("chatPanel").classList.remove("hidden");
    loadChat();
    return;
  }

  if(name==="settings"){
    showGeneric(
      "⚙️ Settings",
      `
      <button onclick="changeRoomName()">✏️ Room Name</button>
      <button onclick="changeRoomDp()">🖼️ Room DP</button>
      <button onclick="toast('Room settings')">🔧 Room Settings</button>
      `
    );
    return;
  }

  if(name==="users"){
    showGeneric(
      "👥 Online Users",
      `<p>Room के सभी online users यहाँ दिखाई देंगे।</p>`
    );
    return;
  }

  if(name==="info"){
    showGeneric(
      "ℹ️ Room Info",
      `
      <p>Room: ${escapeHtml(document.getElementById("roomName").textContent)}</p>
      <p>${escapeHtml(document.getElementById("roomNumber").textContent)}</p>
      `
    );
    return;
  }

  if(name==="inbox"){
    showGeneric(
      "📥 Inbox",
      `<p>Messages, requests और notifications यहाँ दिखाई देंगी।</p>`
    );
    return;
  }

  if(name==="gift"){
    showGeneric(
      "🎁 Gifts",
      `
      <button onclick="sendGift('🌹 Rose')">🌹 Rose</button>
      <button onclick="sendGift('❤️ Heart')">❤️ Heart</button>
      <button onclick="sendGift('💎 Diamond')">💎 Diamond</button>
      <button onclick="sendGift('👑 Crown')">👑 Crown</button>
      `
    );
  }
}

function closePanels(){
  document.querySelectorAll(".panel")
    .forEach(x=>x.classList.add("hidden"));
}

/* User panel */
function openUser(id){
  showGeneric(
    "👤 User",
    `
    <p>User ID: ${escapeHtml(id)}</p>
    <button onclick="toast('Profile खुल रहा है')">👤 Profile</button>
    <button onclick="toast('Follow request भेजी')">➕ Follow</button>
    <button onclick="toast('Chat खुल रही है')">💬 Chat</button>
    <button onclick="toast('User muted')">🔇 Mute</button>
    <button onclick="toast('Report भेजी गई')">🚩 Report</button>
    `
  );
}

/* Seat request */
function requestSeat(seat){
  toast("Seat "+seat+" के लिए request भेजी गई");
}

/* Mic */
function toggleMic(){
  micOn=!micOn;
  document.getElementById("micButton").innerHTML =
    (micOn?"🎙️":"🔇")+"<br>Mic";

  if(roomId){
    db.ref("rooms/"+roomId+"/users/"+myId+"/mic")
      .set(micOn)
      .catch(()=>{});
  }
}

/* Speaker */
function toggleSpeaker(){
  speakerOn=!speakerOn;
  document.getElementById("speakerButton").innerHTML =
    (speakerOn?"🔊":"🔇")+"<br>Speaker";

  document.querySelectorAll("audio")
    .forEach(a=>a.muted=!speakerOn);
}

/* Chat */
function sendChat(){
  const input=document.getElementById("chatInput");
  const text=input.value.trim();

  if(!text)return;

  const msg={
    name:myName,
    id:myId,
    text:text,
    time:Date.now()
  };

  if(roomId){
    db.ref("rooms/"+roomId+"/chat").push(msg);
  }

  input.value="";
}

function loadChat(){
  if(!roomId)return;

  db.ref("rooms/"+roomId+"/chat")
    .limitToLast(50)
    .on("value",snap=>{
      const box=document.getElementById("chatMessages");
      box.innerHTML="";

      snap.forEach(child=>{
        const m=child.val() || {};
        const div=document.createElement("div");
        div.className="msg";
        div.innerHTML=
          "<b>"+escapeHtml(m.name||"User")+"</b>: "+
          escapeHtml(m.text||"");
        box.appendChild(div);
      });

      box.scrollTop=box.scrollHeight;
    });
}

/* Gift */
function sendGift(gift){
  toast(gift+" भेजा गया 🎁");

  if(roomId){
    db.ref("rooms/"+roomId+"/giftHistory").push({
      from:myId,
      name:myName,
      gift:gift,
      time:Date.now()
    });
  }
}

/* Room DP */
function changeRoomDp(){
  const input=document.createElement("input");
  input.type="file";
  input.accept="image/*";

  input.onchange=()=>{
    const file=input.files[0];
    if(!file)return;

    const reader=new FileReader();

    reader.onload=e=>{
      const img=new Image();

      img.onload=()=>{
        const canvas=document.createElement("canvas");
        const max=500;

        let w=img.width;
        let h=img.height;

        if(w>h){
          if(w>max){
            h=h*max/w;
            w=max;
          }
        }else{
          if(h>max){
            w=w*max/h;
            h=max;
          }
        }

        canvas.width=w;
        canvas.height=h;

        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);

        const data=canvas.toDataURL("image/jpeg",.70);

        db.ref("rooms/"+roomId+"/settings/dp")
          .set(data)
          .then(()=>{
            document.getElementById("roomDp").src=data;
            toast("Room DP बदल गई");
          })
          .catch(err=>{
            toast("DP save नहीं हुई: "+err.message);
          });
      };

      img.src=e.target.result;
    };

    reader.readAsDataURL(file);
  };

  input.click();
}

/* Room name */
function changeRoomName(){
  const oldName=document.getElementById("roomName").textContent;
  const name=prompt("New Room Name",oldName);

  if(!name || !name.trim())return;

  db.ref("rooms/"+roomId+"/name")
    .set(name.trim())
    .then(()=>toast("Room Name बदल गया"))
    .catch(err=>toast("Save error: "+err.message));
}

/* Share */
function shareRoom(){
  const url=location.href;

  if(navigator.share){
    navigator.share({
      title:"PawanVoice Room",
      text:"Join my PawanVoice Room",
      url:url
    }).catch(()=>{});
  }else{
    copyText(url);
    toast("Room link copy हो गया");
  }
}

/* Copy room */
function copyRoom(){
  const no=document.getElementById("roomNumber").textContent;
  copyText(no).then(()=>toast("Room Number copy हो गया"));
}

/* Leave */
function leaveRoom(){
  if(!confirm("Room छोड़ना है?"))return;

  if(roomId){
    db.ref("rooms/"+roomId+"/users/"+myId)
      .remove()
      .finally(()=>{
        location.href="index.html";
      });
  }else{
    location.href="index.html";
  }
}

/* Helpers */
function copyText(text){
  if(navigator.clipboard){
    return navigator.clipboard.writeText(text);
  }

  const ta=document.createElement("textarea");
  ta.value=text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();

  return Promise.resolve();
}

function makeAvatar(text){
  const letter=(text||"P").charAt(0).toUpperCase();

  const svg=
    `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
      <rect width="300" height="300" fill="#303748"/>
      <text x="150" y="190"
        text-anchor="middle"
        font-size="140"
        fill="white">${letter}</text>
    </svg>`;

  return "data:image/svg+xml;charset=UTF-8,"+
    encodeURIComponent(svg);
}

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(s){
  return escapeHtml(s);
}

function toast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.style.display="block";

  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>{
    t.style.display="none";
  },2200);
}
</script>
