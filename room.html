<style>

*{box-sizing:border-box}

html,body{
 margin:0;
 background:#080912;
 color:#fff;
 font-family:Arial,sans-serif;
 height:100%
}

button,input{
 font:inherit
}

button{
 border:0;
 color:#fff;
 cursor:pointer
}

.roomApp{
 max-width:520px;
 min-height:100vh;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:
 radial-gradient(circle at 50% 15%,#40305f,#15152a 38%,#080912 78%)
}

/* HEADER */

.roomTop{
 height:64px;
 padding:8px 10px;
 display:flex;
 align-items:center;
 gap:8px;
 background:#080914c9;
 backdrop-filter:blur(15px);
 position:relative;
 z-index:20
}

.back{
 width:42px;
 height:42px;
 border-radius:13px;
 background:#ffffff12;
 font-size:20px
}

.roomTitle{
 flex:1;
 min-width:0
}

.roomTitle b{
 display:block;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis
}

.roomTitle small{
 display:block;
 color:#9da4b9;
 margin-top:4px
}

.topBtn{
 width:42px;
 height:42px;
 border-radius:13px;
 background:#ffffff12;
 font-size:18px
}

/* ROOM HERO */

.roomInfo{
 padding:4px 14px 0;
 text-align:center
}

.roomAvatar{
 width:74px;
 height:74px;
 margin:3px auto 7px;
 border-radius:23px;
 display:grid;
 place-items:center;
 font-size:34px;
 background:linear-gradient(135deg,#7c3aed,#ec4899);
 border:3px solid #ffd75a;
 box-shadow:0 0 30px #7c3aed77
}

.roomName{
 font-size:17px;
 font-weight:900
}

.roomNumber{
 color:#9da4b9;
 font-size:11px;
 margin-top:4px
}

/* SEATS */

.seats{
 padding:13px 12px 5px
}

.seatRow{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:9px;
 margin-bottom:12px
}

.ownerRow{
 display:flex;
 justify-content:center;
 margin-bottom:14px
}

.seat{
 min-width:0;
 text-align:center;
 padding:7px 3px;
 border-radius:17px;
 background:#ffffff09;
 border:1px solid #ffffff0d
}

.ownerSeat{
 width:116px;
 background:linear-gradient(145deg,#332052,#171529);
 border-color:#ffd75a66
}

.seatAvatar{
 width:53px;
 height:53px;
 margin:auto;
 border-radius:50%;
 display:grid;
 place-items:center;
 font-size:25px;
 background:linear-gradient(135deg,#313953,#20253b);
 border:2px solid #4b5578;
 position:relative
}

.ownerSeat .seatAvatar{
 width:70px;
 height:70px;
 font-size:32px;
 border-color:#ffd75a
}

.crown{
 position:absolute;
 top:-14px;
 left:50%;
 transform:translateX(-50%);
 font-size:19px
}

.mic{
 position:absolute;
 right:-3px;
 bottom:-3px;
 width:20px;
 height:20px;
 border-radius:50%;
 display:grid;
 place-items:center;
 font-size:11px;
 background:#16a34a;
 border:2px solid #12152a
}

.mic.off{
 background:#dc2626
}

.seatName{
 margin-top:5px;
 font-size:11px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.role{
 margin-top:3px;
 font-size:9px;
 color:#b8a1ff
}

/* TOOLS */

.tools{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:7px;
 padding:6px 12px
}

.tool{
 min-height:60px;
 border-radius:15px;
 background:#171b2c;
 border:1px solid #292f4a
}

.tool strong{
 display:block;
 font-size:21px
}

.tool span{
 font-size:9px;
 color:#a4abc0
}

/* EXP */

.expBar{
 margin:8px 12px;
 padding:10px 12px;
 border-radius:16px;
 background:linear-gradient(100deg,#27174c,#12182c);
 border:1px solid #4b3372
}

.expTop{
 display:flex;
 justify-content:space-between;
 font-size:12px
}

.expLine{
 height:7px;
 margin-top:7px;
 background:#2d3044;
 border-radius:10px;
 overflow:hidden
}

.expLine i{
 display:block;
 width:42%;
 height:100%;
 background:linear-gradient(90deg,#8b5cf6,#ec4899)
}

/* CHAT */

.chat{
 height:150px;
 margin:5px 12px 0;
 padding:8px;
 overflow:auto;
 border-radius:18px;
 background:#05071155
}

.msg{
 display:flex;
 gap:7px;
 margin-bottom:7px;
 align-items:flex-start
}

.msgAvatar{
 width:27px;
 height:27px;
 flex:none;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:#2c3450;
 font-size:13px
}

.bubble{
 padding:7px 10px;
 border-radius:12px;
 background:#191d2d;
 font-size:12px
}

.bubble b{
 color:#c084fc
}

/* BOTTOM */

.roomBottom{
 padding:8px 10px 10px;
 background:#090b17ee;
 border-top:1px solid #272c45;
 position:relative;
 z-index:20
}

.chatInput{
 display:flex;
 gap:7px
}

.chatInput input{
 flex:1;
 min-width:0;
 border:1px solid #303650;
 border-radius:14px;
 padding:11px;
 outline:0;
 color:#fff;
 background:#15192a
}

.send{
 width:47px;
 border-radius:13px;
 background:#7c3aed
}

.actions{
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:7px;
 margin-top:8px
}

.actions button{
 height:48px;
 border-radius:14px;
 background:#171b2c;
 border:1px solid #292f4a;
 font-size:19px
}

.actions button span{
 display:block;
 font-size:8px;
 color:#9da4b9;
 margin-top:2px
}

/* SHEET */

.sheet{
 position:fixed;
 inset:0;
 display:none;
 align-items:flex-end;
 background:#000b;
 z-index:100
}

.sheet.show{display:flex}

.sheetBox{
 width:min(520px,100%);
 max-height:82vh;
 overflow:auto;
 padding:20px;
 background:#121528;
 border-radius:25px 25px 0 0
}

.close{
 float:right;
 padding:8px 11px;
 border-radius:10px;
 background:#292e45
}

.sheetBox h3{margin-top:0}

.sheetBtn{
 width:100%;
 padding:13px;
 margin-top:8px;
 border-radius:12px;
 background:#7c3aed
}

.giftGrid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px
}

.gift{
 padding:10px 4px;
 border-radius:14px;
 background:#1a1e31;
 border:1px solid #303650;
 text-align:center
}

.gift b{
 display:block;
 font-size:25px
}

.gift span{
 font-size:9px;
 color:#a5abc0
}

/* USER */

.userCard{
 padding:15px;
 border-radius:18px;
 background:linear-gradient(145deg,#21163b,#111426);
 border:1px solid #49336b;
 text-align:center
}

.userAvatar{
 width:70px;
 height:70px;
 margin:auto;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:#303653;
 font-size:32px;
 border:3px solid #ffd75a
}

.userCard h3{
 margin:8px 0 3px
}

.userCard small{
 color:#9da4b9
}

@media(max-width:370px){
 .seatRow{gap:5px}
 .tools{grid-template-columns:repeat(4,1fr)}
}

</style>
</head>

<script>

const firebaseConfig={

 apiKey:"AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"148446327241",
 appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

let uid="";
let roomId="";
let myMember=null;
let currentMembers={};

const params=
new URLSearchParams(location.search);

roomId=params.get("room");


firebase.auth().signInAnonymously()
.then(result=>{

 uid=result.user.uid;

 if(!roomId){

  alert("Room ID नहीं मिला");
  location.href="index.html";
  return;

 }

 loadRoom();

})
.catch(error=>{

 alert(
  "Firebase login error: "+
  error.message
 );

});


function loadRoom(){

 db.ref("rooms/"+roomId)
 .on("value",snap=>{

  const room=snap.val();

  if(!room){

   alert("Room नहीं मिला");
   location.href="index.html";
   return;

  }

  document.getElementById("headerRoomName")
  .textContent=room.name||"PawanVoice Room";

  document.getElementById("roomName")
  .textContent=room.name||"PawanVoice Room";

  document.getElementById("roomCategory")
  .textContent=room.category||"General";

  document.getElementById("roomNumber")
  .textContent=
  "Room ID: "+roomId.substring(0,12);

  document.getElementById("roomExp")
  .textContent=
  Number(room.exp||0);

  const exp=
  Number(room.exp||0);

  const level=
  Math.max(1,Math.floor(exp/100)+1);

  document.getElementById("roomLevel")
  .textContent=level;

  const percent=
  Math.min(100,exp%100);

  document.getElementById("expProgress")
  .style.width=
  percent+"%";

  if(room.status==="closed"){

   alert("Room बंद हो चुका है");
   location.href="index.html";

  }

 });

 listenMembers();
 listenChat();
 joinRoom();

}


function listenMembers(){

 db.ref("rooms/"+roomId+"/members")
 .on("value",snap=>{

  currentMembers=snap.val()||{};

  const arr=
  Object.values(currentMembers);

  document.getElementById("memberCount")
  .textContent=arr.length;

  for(let i=0;i<9;i++){

   document.getElementById("name"+i)
   .textContent="Empty";

   document.getElementById("role"+i)
   .textContent=
   i===0?"OWNER":"SEAT "+(i+1);

   document.getElementById("mic"+i)
   .classList.add("off");

  }


  arr.forEach(member=>{

   let seat=
   Number(member.seat);

   if(!Number.isInteger(seat) ||
      seat<0 ||
      seat>8){

    seat=arr.indexOf(member);

   }

   if(seat<0 || seat>8)return;

   document.getElementById("name"+seat)
   .textContent=
   member.name||
   "User";

   document.getElementById("role"+seat)
   .textContent=
   String(member.role||"USER").toUpperCase();

   const mic=
   document.getElementById("mic"+seat);

   if(member.mic===true)
   mic.classList.remove("off");
   else
   mic.classList.add("off");

  });

 });

}


function joinRoom(){

 const name=
 localStorage.getItem("pawanName")||
 "Guest";

 const memberRef=
 db.ref(
  "rooms/"+roomId+"/members/"+uid
 );

 memberRef.once("value")
 .then(snap=>{

  const old=snap.val();

  if(old){

   myMember=old;
   return;

  }


  return db.ref(
   "rooms/"+roomId+"/members"
  ).once("value")
  .then(s=>{

   const members=s.val()||{};

   const used=[];

   Object.values(members)
   .forEach(m=>{

    if(Number.isInteger(m.seat))
    used.push(m.seat);

   });

   let seat=0;

   while(used.includes(seat) &&
         seat<9){

    seat++;

   }

   if(seat>=9){

    alert("Room full");
    location.href="index.html";
    return;

   }

   const data={

    uid:uid,
    name:name,

    seat:seat,

    role:
    seat===0?"owner":"user",

    owner:
    seat===0,

    mic:false,
    speaker:true,

    joinedAt:
    firebase.database.ServerValue.TIMESTAMP

   };

   return memberRef.set(data)
   .then(()=>{

    myMember=data;

    return db.ref(
     "rooms/"+roomId+"/membersCount"
    ).transaction(v=>
     Number(v||0)+1
    );

   });

  });

 })
 .then(()=>{

  if(!myMember)return;

  const presenceRef=
  db.ref(
   "rooms/"+roomId+"/members/"+uid
  );

  presenceRef.onDisconnect().remove();

 })
 .catch(error=>{

  console.log(error);

 });

}


function listenChat(){

 db.ref("rooms/"+roomId+"/chat")
 .limitToLast(50)
 .on("value",snap=>{

  const chat=
  document.getElementById("chat");

  let html="";

  snap.forEach(child=>{

   const m=child.val()||{};

   html+=`

   <div class="msg">

    <div class="msgAvatar">
     👤
    </div>

    <div class="bubble">

     <b>${safe(m.name||"User")}</b>
     <br>

     ${safe(m.text||"")}

    </div>

   </div>

   `;

  });

  chat.innerHTML=
  html||
  `<div class="muted">No messages yet</div>`;

  chat.scrollTop=chat.scrollHeight;

 });

}


function sendMessage(){

 const input=
 document.getElementById("chatInput");

 const text=input.value.trim();

 if(!text)return;

 const name=
 localStorage.getItem("pawanName")||
 "Guest";

 db.ref("rooms/"+roomId+"/chat")
 .push({

  uid:uid,
  name:name,
  text:text,

  createdAt:
  firebase.database.ServerValue.TIMESTAMP

 })
 .then(()=>{

  input.value="";

 });

}


function toggleMic(){

 if(!uid)return;

 const ref=
 db.ref(
  "rooms/"+roomId+"/members/"+uid+"/mic"
 );

 ref.transaction(v=>!Boolean(v))
 .then(result=>{

  const value=
  result.snapshot.val();

  document.getElementById("micButton")
  .textContent=
  value?"🎤":"🔇";

 });

}


function toggleSpeaker(){

 const el=
 document.getElementById("speakerButton");

 if(el.textContent==="🔊"){

  el.textContent="🔇";

 }else{

  el.textContent="🔊";

 }

}


function seatClick(seat){

 const member=
 Object.values(currentMembers)
 .find(m=>Number(m.seat)===seat);

 if(!member){

  openSheet(
   "Seat "+(seat+1),
   `<button class="sheetBtn"
    onclick="takeSeat(${seat})">
    🎤 Take Seat
    </button>`
  );

  return;

 }

 openUser(member);

}


function takeSeat(seat){

 if(Object.values(currentMembers)
 .some(m=>Number(m.seat)===seat)){

  alert("Seat already occupied");
  return;

 }

 db.ref(
  "rooms/"+roomId+"/members/"+uid
 ).update({

  seat:seat,
  role:"user"

 })
 .then(()=>{

  closeSheet();

 });

}


function openUser(member){

 const isMe=
 member.uid===uid;

 let body=`

 <div class="userCard">

  <div class="userAvatar">👤</div>

  <h3>${safe(member.name||"User")}</h3>

  <small>
   ID: ${safe(String(member.uid||"").substring(0,12))}
  </small>

  <p>
   ${safe(String(member.role||"USER").toUpperCase())}
  </p>

 </div>

 <button class="sheetBtn"
 onclick="sendFriend('${safeAttr(member.uid)}')">
 🤝 Add Friend
 </button>

 <button class="sheetBtn"
 onclick="viewProfile('${safeAttr(member.uid)}')">
 👤 View Profile
 </button>

 `;

 if(!isMe){

  body+=`

  <button class="sheetBtn"
  onclick="sendPrivateGift('${safeAttr(member.uid)}')">
  🎁 Send Gift
  </button>

  `;

 }

 if(isRoomAdmin()){

  body+=`

  <button class="sheetBtn"
  onclick="makeAdmin('${safeAttr(member.uid)}')">
  🛡️ Make Admin
  </button>

  <button class="sheetBtn"
  onclick="kickUser('${safeAttr(member.uid)}')">
  🚫 Kick
  </button>

  `;

 }

 openSheet("👤 User",body);

}


function isRoomAdmin(){

 const me=
 currentMembers[uid];

 if(!me)return false;

 return(
  me.owner===true ||
  me.role==="owner" ||
  me.role==="admin" ||
  me.role==="super_admin" ||
  me.role==="manager"
 );

}


function makeAdmin(target){

 if(!isRoomAdmin()){

  alert("Admin permission नहीं है");
  return;

 }

function sendGift(icon,name,price,target){

 db.ref("users/"+uid+"/coins")
 .transaction(v=>{

  const coins=
  Number(v||0);

  if(coins<price){

   return;

  }

  return coins-price;

 })
 .then(result=>{

  if(!result.committed){

   alert("Coins कम हैं");
   return;

  }

  db.ref("rooms/"+roomId+"/gifts")
  .transaction(v=>
   Number(v||0)+1
  );

  db.ref("rooms/"+roomId+"/exp")
  .transaction(v=>
   Number(v||0)+price
  );

  db.ref("rooms/"+roomId+"/chat")
  .push({

   uid:uid,

   name:
   localStorage.getItem("pawanName")||
   "Guest",

   text:
   "sent "+icon+" "+name,

   createdAt:
   firebase.database.ServerValue.TIMESTAMP

  });

  alert(
   icon+" "+name+
   " sent successfully"
  );

  closeSheet();

 });

}

function openSheet(title,body){

 document.getElementById("sheetTitle")
 .innerHTML=title;

 document.getElementById("sheetBody")
 .innerHTML=body;

 document.getElementById("sheet")
 .classList.add("show");

}


function closeSheet(){

 document.getElementById("sheet")
 .classList.remove("show");

}


function safe(value){

 return String(value)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function safeAttr(value){

 return String(value)
 .replace(/\\/g,"\\\\")
 .replace(/'/g,"\\'");

}
