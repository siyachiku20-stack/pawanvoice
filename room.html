<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PawanVoice Room</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#171522;color:white;font-family:Arial,sans-serif
}
.roomApp{max-width:480px;margin:auto;min-height:100vh;background:#211e2d}
.header{
 padding:12px;display:flex;align-items:center;gap:10px;
 background:#292538
}
.back{font-size:24px;background:none;border:0;color:white}
.roomDp{
 width:48px;height:48px;border-radius:50%;object-fit:cover;background:#555
}
.roomTitle{flex:1}
.roomTitle b{display:block;font-size:16px}
.roomTitle small{color:#aaa}
.count{
 background:#363143;padding:8px 10px;border-radius:15px;font-size:12px
}
.headerBtn{
 border:0;background:#393447;color:white;padding:8px;border-radius:12px
}
.hostBox{text-align:center;padding:15px 0 8px}
.seats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:15px 7px;padding:8px 10px 12px
}
.seatWrap{text-align:center;min-width:0}
.seat{
 width:62px;height:62px;margin:auto;border-radius:50%;
 background:#393548;border:2px solid #625b73;
 display:flex;align-items:center;justify-content:center;
 position:relative;font-size:25px
}
.seat img{
 width:100%;height:100%;border-radius:50%;object-fit:cover
}
.seatNo{
 position:absolute;bottom:-7px;right:-4px;
 background:#70678b;border-radius:10px;padding:2px 6px;font-size:10px
}
.seatName{
 margin-top:8px;font-size:11px;color:#ddd;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.tools{
 display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
 padding:10px
}
.tool{
 border:0;border-radius:13px;background:#302c3d;color:white;
 padding:10px 4px;font-size:11px
}
.exp{
 margin:8px 10px;padding:14px;border-radius:16px;
 background:#302b3d;text-align:center
}
.chat{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(480px,100%);background:#252131;padding:8px;
 display:flex;gap:6px;z-index:20
}
.chat input{
 flex:1;min-width:0;border:0;border-radius:20px;padding:11px 13px;
 background:#393448;color:white;outline:0
}
.chat button{
 width:42px;border:0;border-radius:50%;background:#393448;color:white
}
.emojiPanel{
 position:fixed;bottom:64px;left:50%;transform:translateX(-50%);
 width:min(480px,100%);background:#2d293a;padding:10px;
 display:none;grid-template-columns:repeat(8,1fr);gap:5px;z-index:30
}
.emojiPanel button{
 border:0;background:none;color:white;font-size:23px;padding:5px
}
.messages{padding:5px 12px;height:90px;overflow:auto;color:#ddd;font-size:12px}
.modal{
 position:fixed;inset:0;background:#0009;display:none;
 align-items:flex-end;z-index:50
}
.modalBox{
 width:min(480px,100%);background:#292538;border-radius:20px 20px 0 0;
 padding:20px
}
.modalBox button{
 width:100%;padding:13px;margin-top:8px;border:0;border-radius:12px
}
</style>
</head>

<body>
<div class="roomApp">

  <div class="header">
    <button class="back" onclick="leave()">‹</button>

    <img id="roomDp" class="roomDp"
         src="https://placehold.co/100x100?text=PV">

    <div class="roomTitle">
      <b id="roomName">PawanVoice Room</b>
      <small>Room ID: <span id="roomIdText"></span></small>
    </div>

    <div class="count"><span id="peopleCount">0</span>/9</div>

    <button class="headerBtn" onclick="settings()">⚙️</button>
    <button class="headerBtn" onclick="invite()">↗</button>
  </div>

  <div class="hostBox">
    <div id="hostSeat"></div>
  </div>

  <div id="seats" class="seats"></div>

  <div class="tools">
    <button class="tool">🛟<br>Support</button>
    <button class="tool">🎡<br>Lucky Wheel</button>
    <button class="tool">🎯<br>Bounty</button>
    <button class="tool">🎁<br>Reward</button>
    <button class="tool">🚀<br>Exclusive</button>
  </div>

  <div class="exp">
    🚀 &nbsp; TOP EXP
    <br><br>
    🥇 1 &nbsp;&nbsp; 🥈 2 &nbsp;&nbsp; 🥉 3
  </div>

  <div id="messages" class="messages"></div>

  <div id="emojiPanel" class="emojiPanel"></div>

  <div class="chat">
    <input id="message" placeholder="Say something...">
    <button onclick="toggleEmoji()">😊</button>
    <button onclick="toggleSpeaker()">🔊</button>
    <button id="micBtn" onclick="toggleMic()">🎤</button>
    <button onclick="showInbox()">📥</button>
    <button onclick="more()">•••</button>
  </div>

</div>

<div id="modal" class="modal" onclick="closeModal()">
  <div class="modalBox" onclick="event.stopPropagation()">
    <h3 id="modalTitle">Menu</h3>
    <div id="modalContent"></div>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const SERVER="https://pawanvoice-1.onrender.com";
const socket=io(SERVER);

const params=new URLSearchParams(location.search);
const ROOM_ID=params.get("room") || "main";

let me=JSON.parse(localStorage.getItem("pv_user")||"null");
if(!me){
 me={userId:"U"+Date.now(),name:"Guest",dp:""};
 localStorage.setItem("pv_user",JSON.stringify(me));
}

let micOn=false;
let speakerOn=true;
let currentRoom=null;

roomIdText.textContent=ROOM_ID;

const emojis=[
"😡","😭","😵","🔨","😄","😘","💋","😂",
"😴","😧","😁","👻","😀","🥵","🤗","❤️",
"💰","🥳","🥺","😡","❓","🙄","🤣","😎","🤔"
];

emojiPanel.innerHTML=emojis.map(e=>
 `<button onclick="sendEmoji('${e}')">${e}</button>`
).join("");

socket.on("connect",()=>{
 socket.emit("joinRoom",{
   roomId:ROOM_ID,
   userId:me.userId,
   name:me.name
 });
});

socket.on("joinedRoom",data=>{
 currentRoom=data.room;
 renderRoom(data.room);
});

socket.on("roomUpdated",room=>{
 currentRoom=room;
 renderRoom(room);
});

socket.on("roomError",data=>{
 alert(data.message);
});

socket.on("giftReceived",gift=>{
 addMessage("🎁 "+gift.senderName+" sent "+gift.giftName);
});

function renderRoom(room){
 const users=room.users||[];

 peopleCount.textContent=users.length;

 seats.innerHTML="";

 for(let i=0;i<8;i++){
   const seatNumber=i+2;
   const userId=room.seats ? room.seats[i+1] : null;
   const user=users.find(u=>u.userId===userId);

   seats.innerHTML+=seatHTML(seatNumber,user);
 }

 const hostId=room.seats ? room.seats[0] : null;
 const host=users.find(u=>u.userId===hostId);

 hostSeat.innerHTML=seatHTML(1,host,true);
}

function seatHTML(number,user,isHost=false){
 const dp=(user && user.dp) ? user.dp :
   "https://placehold.co/120x120?text="+number;

 const name=user ? user.name : "Empty";

 return `
 <div class="seatWrap" onclick="seatClick(${number})">
   <div class="seat">
     <img src="${dp}">
     <span class="seatNo">${number}</span>
   </div>
   <div class="seatName">${name}</div>
 </div>`;
}

function seatClick(number){
 if(!currentRoom)return;

 const existingId=currentRoom.seats[number-1];

 if(existingId && existingId!==me.userId){
   const user=currentRoom.users.find(u=>u.userId===existingId);
   userMenu(user);
   return;
 }

 socket.emit("selectSeat",{seat:number});
}

function userMenu(user){
 if(!user)return;

 modalTitle.textContent=user.name;
 modalContent.innerHTML=`
   <button onclick="alert('User ID: ${user.userId}')">
     👤 View User ID
   </button>
   <button onclick="alert('Profile: ${user.name}')">
     Profile
   </button>
   <button onclick="alert('Host/Admin permission required')">
     🛡️ Admin
   </button>
   <button onclick="alert('Host permission required')">
     🚫 Kick
   </button>
 `;
 modal.style.display="flex";
}

function toggleMic(){
 micOn=!micOn;
 micBtn.textContent=micOn?"🎙️":"🎤";

 // WebRTC microphone hook
 navigator.mediaDevices?.getUserMedia({audio:true})
 .then(stream=>{
   stream.getTracks().forEach(t=>t.enabled=micOn);
 })
 .catch(()=>{
   alert("Microphone permission allow karo.");
 });
}

function toggleSpeaker(){
 speakerOn=!speakerOn;
 alert(speakerOn?"Speaker ON":"Speaker OFF");
}

function toggleEmoji(){
 emojiPanel.style.display=
 emojiPanel.style.display==="grid"?"none":"grid";
}

function sendEmoji(e){
 message.value+=e;
}

function addMessage(text){
 messages.innerHTML+=`<div>${text}</div>`;
 messages.scrollTop=messages.scrollHeight;
}

message.addEventListener("keydown",e=>{
 if(e.key==="Enter"){
   const t=message.value.trim();
   if(!t)return;

   addMessage(me.name+": "+t);
   message.value="";
 }
});

function invite(){
 navigator.clipboard?.writeText(location.href);
 alert("Room link copy ho gaya.");
}

function settings(){
 modalTitle.textContent="Room Setting";
 modalContent.innerHTML=`
   <button>🔒 Room Lock</button>
   <button>🎤 Mic Permission</button>
   <button>👑 Admin Management</button>
   <button>🚫 Kick / Mute Users</button>
 `;
 modal.style.display="flex";
}

function showInbox(){
 modalTitle.textContent="Inbox";
 modalContent.innerHTML=`
   <p>📩 Abhi koi new message nahi hai.</p>
 `;
 modal.style.display="flex";
}

function more(){
 modalTitle.textContent="More";
 modalContent.innerHTML=`
   <button>🎁 Send Gift</button>
   <button>👜 Bag</button>
   <button onclick="invite()">↗ Share Room</button>
   <button>⚠️ Report</button>
 `;
 modal.style.display="flex";
}

function closeModal(){
 modal.style.display="none";
}

function leave(){
 socket.emit("leaveRoom");
 location.href="index.html";
}

window.addEventListener("beforeunload",()=>{
 socket.emit("leaveRoom");
});
</script>
</body>
</html>
