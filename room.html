<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PawanVoice Room</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#120d20;color:#fff}
button,input{font:inherit}
button{cursor:pointer}
#app{width:100%;max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#171024,#0d0a16);position:relative;padding-bottom:82px}
.header{position:sticky;top:0;z-index:20;padding:10px;background:rgba(20,13,31,.96);display:flex;align-items:center;gap:8px;border-bottom:1px solid #332541}
.back{width:38px;height:38px;border:0;border-radius:50%;background:#281b36;color:#fff;font-size:22px}
.roomDp{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #d85cff}
.roomHead{flex:1;min-width:0}
.roomName{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomId{font-size:11px;color:#aaa;margin-top:3px}
.headBtn{width:36px;height:36px;border:0;border-radius:50%;background:#281b36;color:#fff;font-size:18px}

.stats{display:flex;gap:8px;padding:10px}
.stat{flex:1;text-align:center;background:#21162d;border-radius:12px;padding:9px}
.stat b{display:block;font-size:15px}
.stat span{font-size:10px;color:#aaa}

.seats{padding:8px 10px}
.hostSeat{display:flex;justify-content:center;margin-bottom:12px}
.seatGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seat{min-height:105px;border-radius:15px;background:#20162b;border:1px solid #352540;text-align:center;padding:8px;position:relative}
.seat.empty{border-style:dashed;color:#777}
.seat img{width:55px;height:55px;border-radius:50%;object-fit:cover;border:2px solid #774c8e}
.hostSeat .seat{width:115px}
.seat.host img{border-color:#ffd45a}
.seatNum{position:absolute;top:5px;left:6px;font-size:9px;color:#999}
.micDot{position:absolute;right:6px;top:5px;font-size:12px}
.seatName{font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.levelMini{font-size:9px;color:#e8a9ff;margin-top:2px}

.features{padding:8px 10px}
.featureGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.feature{border:0;border-radius:12px;background:#21172d;color:#fff;padding:10px 3px;min-height:65px;font-size:10px}
.feature span{display:block;font-size:22px;margin-bottom:4px}

.expBox{margin:8px 10px;padding:12px;border-radius:15px;background:linear-gradient(120deg,#29173b,#1a1525)}
.expTop{display:flex;justify-content:space-between;font-size:12px}
.progress{height:8px;background:#100c17;border-radius:20px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff5edc,#8d6bff);width:0}
.topUsers{display:flex;justify-content:space-around;text-align:center}
.topUser img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #ffcf55}
.topUser small{display:block;font-size:9px;margin-top:3px}

.chat{margin:10px;border-radius:15px;background:#17111f;min-height:160px;max-height:250px;overflow:auto;padding:10px}
.msg{margin-bottom:8px;font-size:12px}
.msg b{color:#dc91ff;margin-right:5px}
.msg.system{color:#aaa;font-size:11px}

.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#17101f;border-top:1px solid #34233e;padding:8px;z-index:50}
.controls{display:flex;gap:6px;align-items:center}
.chatInput{flex:1;border:0;background:#292035;color:#fff;border-radius:20px;padding:10px 13px;outline:none}
.ctrl{width:40px;height:40px;border:0;border-radius:50%;background:#292035;color:#fff}
.ctrl.active{background:#b43eff}
.send{background:#d94cff}

.modalBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;align-items:flex-end;justify-content:center}
.modalBg.show{display:flex}
.modal{width:100%;max-width:520px;max-height:85vh;overflow:auto;background:#1a1224;border-radius:22px 22px 0 0;padding:18px}
.modal h3{margin:0 0 15px}
.close{float:right;border:0;background:#2c2036;color:#fff;border-radius:50%;width:32px;height:32px}
.actionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actionBtn{border:0;border-radius:12px;background:#291d35;color:#fff;padding:12px 5px;font-size:11px}
.input{width:100%;padding:12px;border:1px solid #3c2b48;background:#110c17;color:#fff;border-radius:10px;margin:6px 0}
.saveBtn{width:100%;padding:13px;border:0;border-radius:12px;background:#d84cff;color:#fff;font-weight:bold;margin-top:8px}

.giftCats{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.giftCat{white-space:nowrap;border:0;background:#291d35;color:#ccc;padding:8px 12px;border-radius:18px}
.giftCat.active{background:#b43cff;color:#fff}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.gift{border:0;background:#261a32;color:#fff;border-radius:12px;padding:8px 3px;min-height:85px}
.gift .ge{font-size:28px}
.gift small{display:block;color:#ffcf63;margin-top:3px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 15px;border-radius:20px;display:none;z-index:200;font-size:12px}
.toast.show{display:block}

.loading{position:fixed;inset:0;background:#120d20;z-index:500;display:flex;align-items:center;justify-content:center;font-size:16px}
.loading.hide{display:none}

@media(max-width:380px){
 .featureGrid{grid-template-columns:repeat(4,1fr)}
 .seatGrid{gap:6px}
 .seat{min-height:100px}
 .gifts{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div class="loading" id="loading">PawanVoice Room Loading...</div>

<div id="app">

<header class="header">
<button class="back" onclick="goHome()">‹</button>
<img id="roomDp" class="roomDp" src="">
<div class="roomHead">
<div id="roomName" class="roomName">PawanVoice Room</div>
<div id="roomId" class="roomId">Room ID: --</div>
</div>
<button class="headBtn" onclick="openRoomInfo()">ⓘ</button>
<button class="headBtn" onclick="openRoomSettings()">⚙</button>
</header>

<section class="stats">
<div class="stat"><b id="onlineCount">0/9</b><span>Online</span></div>
<div class="stat"><b id="roomExp">0</b><span>Room EXP</span></div>
<div class="stat"><b id="myCoins">0</b><span>Coins</span></div>
<div class="stat"><b id="myLevel">1</b><span>Level</span></div>
</section>

<section class="seats">
<div class="hostSeat" id="hostSeat"></div>
<div class="seatGrid" id="seatGrid"></div>
</section>

<section class="features">
<div class="featureGrid">

<button class="feature" onclick="openFeature('Room Support','Support this room and increase Room EXP.')">
<span>💖</span>Support
</button>

<button class="feature" onclick="openWheel()">
<span>🎡</span>Lucky Wheel
</button>

<button class="feature" onclick="openFeature('Bounty Hunter','Complete bounty missions and earn rewards.')">
<span>🎯</span>Bounty
</button>

<button class="feature" onclick="openReward()">
<span>🎁</span>Room Reward
</button>

<button class="feature" onclick="openDaily()">
<span>📅</span>Daily Reward
</button>

<button class="feature" onclick="openGames()">
<span>🎮</span>Games
</button>

<button class="feature" onclick="openFeature('Exclusive Benefits','Exclusive room events and member benefits.')">
<span>✨</span>Exclusive
</button>

<button class="feature" onclick="openGifts()">
<span>🎁</span>Gifts
</button>

<button class="feature" onclick="inviteRoom()">
<span>📤</span>Invite
</button>

<button class="feature" onclick="openRoomInfo()">
<span>ℹ️</span>Room Info
</button>

</div>
</section>

<section class="expBox">
<div class="expTop">
<b>🚀 Room EXP</b>
<span id="expText">0 / 100000</span>
</div>
<div class="progress"><i id="expBar"></i></div>
<div class="topUsers" id="topUsers"></div>
</section>

<section class="chat" id="chat"></section>

</div>

<div class="bottom">
<div class="controls">
<input id="chatInput" class="chatInput" placeholder="Write a message..." maxlength="300">
<button class="ctrl" onclick="openEmoji()">😀</button>
<button class="ctrl" onclick="toggleSpeaker()" id="speakerBtn">🔊</button>
<button class="ctrl" onclick="toggleMic()" id="micBtn">🎤</button>
<button class="ctrl" onclick="openGifts()">🎁</button>
<button class="ctrl send" onclick="sendChat()">➤</button>
</div>
</div>

<div class="toast" id="toast"></div>

<!-- USER MODAL -->
<div class="modalBg" id="userModal">
<div class="modal">
<button class="close" onclick="closeModal('userModal')">×</button>
<h3 id="profileTitle">User Profile</h3>
<div id="profileContent"></div>
</div>
</div>

<!-- GIFT MODAL -->
<div class="modalBg" id="giftModal">
<div class="modal">
<button class="close" onclick="closeModal('giftModal')">×</button>
<h3>🎁 200 Gifts</h3>
<div class="giftCats" id="giftCats"></div>
<div class="gifts" id="giftGrid"></div>
</div>
</div>

<!-- EMOJI -->
<div class="modalBg" id="emojiModal">
<div class="modal">
<button class="close" onclick="closeModal('emojiModal')">×</button>
<h3>😀 Emoji</h3>
<div class="actionGrid" id="emojiGrid"></div>
</div>
</div>

<!-- SETTINGS -->
<div class="modalBg" id="settingsModal">
<div class="modal">
<button class="close" onclick="closeModal('settingsModal')">×</button>
<h3>⚙ Room Settings</h3>

<label>Room Name</label>
<input id="setRoomName" class="input">

<input id="setRoomDp" class="input" placeholder="https://...">

<!-- INFO -->

</div>

<button class="close" onclick="closeModal('featureModal')">×</button>

</div>

<button class="close" onclick="closeModal('wheelModal')">×</button>

</div>

</body>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script>
/* =========================================================
   PAWANVOICE ROOM
   ========================================================= */

const PV_FIREBASE_DB =
"https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const RENDER_SERVER =
"https://pawanvoice-1.onrender.com";

const DEFAULT_DP =
"https://i.pravatar.cc/200?img=12";

const params = new URLSearchParams(location.search);

const ROOM_ID =
params.get("room") ||
params.get("roomId") ||
"main";

function clean(v,f=""){
 return v===undefined || v===null ? f : String(v);
}

function number(v,f=0){
 const n=Number(v);
 return Number.isFinite(n)?n:f;
}

function escapeHtml(v){
 return clean(v)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

/* =========================================================
   USER
   ========================================================= */

function loadLocalUser(){

 let old={};

 try{
  old=JSON.parse(localStorage.getItem("pawanvoiceUser")||"{}");
 }catch(e){}

 const id =
  params.get("userid") ||
  old.userId ||
  old.id ||
  localStorage.getItem("pawanvoice_userid") ||
  "PV"+Date.now();

 const name =
  params.get("name") ||
  old.name ||
  localStorage.getItem("pawanvoice_name") ||
  "Pawan User";

 const dp =
  params.get("dp") ||
  old.dp ||
  localStorage.getItem("pawanvoice_dp") ||
  DEFAULT_DP;

 return {
  userId:id,
  id:id,
  name:name,
  dp:dp,
  gender:old.gender||localStorage.getItem("pawanvoice_gender")||"Male",
  level:number(old.level||localStorage.getItem("pawanvoice_level"),1),
  exp:number(old.exp||localStorage.getItem("pawanvoice_exp"),0),
  coins:number(
   old.coins ||
   localStorage.getItem("pawanvoice_coins"),
   100000
  ),
  diamonds:number(
   old.diamonds ||
   old.diamond ||
   localStorage.getItem("pawanvoice_diamonds") ||
   localStorage.getItem("pawanvoice_diamond"),
   0
  ),
  following:number(old.following||localStorage.getItem("pawanvoice_following"),0),
  followers:number(old.followers||localStorage.getItem("pawanvoice_followers"),0),
  visitors:number(old.visitors||localStorage.getItem("pawanvoice_visitors"),0),
  vipLevel:number(
   old.vipLevel ||
   localStorage.getItem("pawanvoice_vip"),
   0
  ),
  vipExp:number(old.vipExp||localStorage.getItem("pawanvoice_vipExp"),0)
 };
}

let currentUser=loadLocalUser();

function saveLocalUser(){

 localStorage.setItem("pawanvoiceUser",JSON.stringify(currentUser));

 localStorage.setItem("pawanvoice_userid",currentUser.userId);
 localStorage.setItem("pawanvoice_name",currentUser.name);
 localStorage.setItem("pawanvoice_dp",currentUser.dp);
 localStorage.setItem("pawanvoice_gender",currentUser.gender);
 localStorage.setItem("pawanvoice_coins",currentUser.coins);
 localStorage.setItem("pawanvoice_diamond",currentUser.diamonds);
 localStorage.setItem("pawanvoice_diamonds",currentUser.diamonds);
 localStorage.setItem("pawanvoice_level",currentUser.level);
 localStorage.setItem("pawanvoice_exp",currentUser.exp);
 localStorage.setItem("pawanvoice_following",currentUser.following);
 localStorage.setItem("pawanvoice_followers",currentUser.followers);
 localStorage.setItem("pawanvoice_visitors",currentUser.visitors);
 localStorage.setItem("pawanvoice_vip",currentUser.vipLevel);
 localStorage.setItem("pawanvoice_vipExp",currentUser.vipExp);
}

function renderBalance(){
 document.getElementById("myCoins").textContent=
  Math.floor(currentUser.coins).toLocaleString();

 document.getElementById("myLevel").textContent=
  currentUser.level;
}

async function firebaseUserLoad(){

 try{

  const r=await fetch(
   PV_FIREBASE_DB+
   "/users/"+
   encodeURIComponent(currentUser.userId)+
   ".json"
  );

  if(!r.ok)return;

  const data=await r.json();

  if(data){

   currentUser={
    ...currentUser,
    ...data,
    userId:data.userId||data.id||currentUser.userId,
    id:data.userId||data.id||currentUser.userId,
    coins:number(data.coins,currentUser.coins),
    diamonds:number(
     data.diamonds!==undefined?
     data.diamonds:data.diamond,
     currentUser.diamonds
    ),
    level:number(data.level,currentUser.level),
    exp:number(data.exp,currentUser.exp)
   };

   saveLocalUser();
   renderBalance();
  }

 }catch(e){
  console.log("Firebase user load:",e);
 }
}

async function firebaseUserSave(){

 try{

  await fetch(
   PV_FIREBASE_DB+
   "/users/"+
   encodeURIComponent(currentUser.userId)+
   ".json",
   {
    method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     userId:currentUser.userId,
     id:currentUser.userId,
     name:currentUser.name,
     dp:currentUser.dp,
     gender:currentUser.gender,
     level:currentUser.level,
     exp:currentUser.exp,
     coins:currentUser.coins,
     diamonds:currentUser.diamonds,
     diamond:currentUser.diamonds,
     following:currentUser.following,
     followers:currentUser.followers,
     visitors:currentUser.visitors,
     vipLevel:currentUser.vipLevel,
     vipExp:currentUser.vipExp,
     updatedAt:Date.now()
    })
   }
  );

 }catch(e){
  console.log("Firebase save:",e);
 }
}

/* =========================================================
   ROOM STATE
   ========================================================= */

let roomState={
 id:ROOM_ID,
 name:"PawanVoice Room",
 dp:DEFAULT_DP,
 owner:"",
 ownerId:"",
 category:"General",
 seats:Array(9).fill(null),
 members:{},
 users:{},
 roomExp:0,
 topUsers:[]
};

let mySeat=-1;
let socket=null;
let socketConnected=false;
let micEnabled=false;
let speakerEnabled=true;
let selectedTarget=null;
let selectedGiftCategory="All";

function normalizeMembers(state){

 let members={};

 if(state.members && typeof state.members==="object"){
  Object.entries(state.members).forEach(([id,u])=>{
   if(u && typeof u==="object"){
    members[id]={
     ...u,
     id:u.id||u.userId||id,
     userId:u.userId||u.id||id
    };
   }
  });
 }

 if(state.users && typeof state.users==="object"){

  Object.entries(state.users).forEach(([id,u])=>{

   if(u && typeof u==="object"){

    members[id]={
     ...members[id],
     ...u,
     id:u.id||u.userId||id,
     userId:u.userId||u.id||id
    };

   }
  });
 }

 return members;
}

function applyRoomState(state){

 if(!state)return;

 roomState={
  ...roomState,
  ...state
 };

 roomState.id=state.id||ROOM_ID;
 roomState.name=state.name||state.roomName||roomState.name;
 roomState.dp=state.dp||roomState.dp||DEFAULT_DP;
 roomState.ownerId=state.ownerId||state.owner||roomState.ownerId;
 roomState.members=normalizeMembers(state);

 if(Array.isArray(state.seats)){
  roomState.seats=Array(9).fill(null);

  state.seats.slice(0,9).forEach((u,i)=>{
   if(u)roomState.seats[i]=u;
  });
 }else{

  roomState.seats=Array(9).fill(null);

  Object.values(roomState.members).forEach(u=>{
   if(Number.isInteger(Number(u.seat)) &&
      Number(u.seat)>=0 &&
      Number(u.seat)<9){

    roomState.seats[Number(u.seat)]=u;
   }
  });
 }

 roomState.roomExp=number(state.roomExp,0);
 roomState.topUsers=Array.isArray(state.topUsers)?
  state.topUsers:[];

 renderRoom();
}

/* =========================================================
   RENDER
   ========================================================= */

function renderRoom(){

 document.getElementById("roomDp").src=
  roomState.dp||DEFAULT_DP;

 document.getElementById("roomName").textContent=
  roomState.name||"PawanVoice Room";

 document.getElementById("roomId").textContent=
  "Room ID: "+ROOM_ID;

 renderSeats();
 renderCounts();
 renderExp();
 renderTopUsers();
 renderBalance();
}

function renderCounts(){

 const members=Object.keys(roomState.members||{});

 document.getElementById("onlineCount").textContent=
  members.length+"/9";
}

function seatHtml(user,index){

 if(!user){

  return `
  <div class="seat empty" onclick="takeSeat(${index})">
   <div class="seatNum">${index+1}</div>
   <div style="font-size:30px;margin-top:12px">＋</div>
   <div class="seatName">Empty</div>
  </div>`;
 }

 const id=clean(user.userId||user.id);

 return `
 <div class="seat ${index===0?"host":""}"
      onclick="openUserProfile('${escapeHtml(id)}')">

  <div class="seatNum">${index+1}</div>

  <div class="micDot">
   ${user.micEnabled===false?"🔇":"🎤"}
  </div>

  <img src="${escapeHtml(user.dp||DEFAULT_DP)}"
       onerror="this.src='${DEFAULT_DP}'">

  <div class="seatName">${escapeHtml(user.name||"User")}</div>

  <div class="levelMini">
   LV.${number(user.level,1)}
  </div>

 </div>`;
}

function renderSeats(){

 document.getElementById("hostSeat").innerHTML=
  seatHtml(roomState.seats[0],0);

 let html="";

 for(let i=1;i<9;i++){
  html+=seatHtml(roomState.seats[i],i);
 }

 document.getElementById("seatGrid").innerHTML=html;

 mySeat=-1;

 roomState.seats.forEach((u,i)=>{

  if(u){

   const id=clean(u.userId||u.id);

   if(id===String(currentUser.userId)){
    mySeat=i;
   }
  }
 });
}

function renderExp(){

 const exp=number(roomState.roomExp,0);
 const max=100000;

 document.getElementById("roomExp").textContent=
  exp.toLocaleString();

 document.getElementById("expText").textContent=
  exp.toLocaleString()+" / "+max.toLocaleString();

 document.getElementById("expBar").style.width=
  Math.min(100,(exp/max)*100)+"%";
}

function renderTopUsers(){

 const target=document.getElementById("topUsers");

 let list=roomState.topUsers||[];

 if(!list.length){

  list=Object.values(roomState.members||{})
   .sort((a,b)=>number(b.giftValue)-number(a.giftValue))
   .slice(0,3);
 }

 while(list.length<3)list.push(null);

 target.innerHTML=list.slice(0,3).map((u,i)=>{

  if(!u){

   return `
   <div class="topUser">
    <div style="font-size:30px">🏆</div>
    <small>TOP ${i+1}</small>
   </div>`;
  }

  return `

function connectSocket(){

 try{

  socket=io(RENDER_SERVER,{
   transports:["websocket","polling"],
   reconnection:true,
   reconnectionAttempts:Infinity,
   timeout:10000
  });

  socket.on("connect",()=>{

   socketConnected=true;

   addSystem("Connected to PawanVoice server.");

   socket.emit("register-user",{
    userId:currentUser.userId,
    id:currentUser.userId,
    name:currentUser.name,
    dp:currentUser.dp,
    gender:currentUser.gender,
    level:currentUser.level,
    exp:currentUser.exp,
    coins:currentUser.coins,
    diamonds:currentUser.diamonds
   });

   socket.emit("join-room",{
    roomId:ROOM_ID,
    userId:currentUser.userId,
    id:currentUser.userId,
    name:currentUser.name,
    dp:currentUser.dp,
    level:currentUser.level
   });

  });

  socket.on("room-state",applyRoomState);
  socket.on("roomState",applyRoomState);
  socket.on("room-updated",applyRoomState);

  socket.on("user-joined",data=>{
   if(data) addSystem((data.name||"User")+" joined the room.");
  });

  socket.on("user-entry",data=>{
   if(data) addSystem((data.name||"User")+" entered.");
  });

  socket.on("user-left",data=>{
   if(data) addSystem((data.name||"User")+" left.");
  });

  socket.on("seat-update",applyRoomState);

  socket.on("mic-status",data=>{

   if(!data)return;

   const u=roomState.members[data.userId];

   if(u){
    u.micEnabled=data.enabled!==false;
    renderSeats();
   }
  });

  socket.on("speaker-status",data=>{});

  socket.on("chat",receiveChat);
  socket.on("room-chat",receiveChat);

  socket.on("emoji",data=>{

   if(!data)return;

   addMessage(
    data.name||"User",
    data.emoji||"😀"
   );
  });

  socket.on("gift-sent",handleGift);
  socket.on("gift-received",handleGift);

  socket.on("gift-error",data=>{
   toast(data?.message||"Gift failed");
  });

  socket.on("wallet-updated",data=>{

   if(!data)return;

   if(data.coins!==undefined)
    currentUser.coins=number(data.coins,currentUser.coins);

   if(data.diamonds!==undefined)
    currentUser.diamonds=number(
     data.diamonds,currentUser.diamonds
    );

   saveLocalUser();
   renderBalance();
  });

  socket.on("profile-updated",data=>{

   if(!data)return;

   if(String(data.userId)===String(currentUser.userId)){

    currentUser={
     ...currentUser,
     ...data
    };

    saveLocalUser();
    renderBalance();
   }

   loadFirebaseRoom();
  });

  socket.on("user-kicked",data=>{

   if(data?.userId===currentUser.userId){
    alert("You were removed from this room.");
    goHome();
   }
  });

  socket.on("kicked",data=>{

   if(data?.userId===currentUser.userId){
    goHome();
   }
  });

  socket.on("force-mute",data=>{

   if(data?.userId===currentUser.userId){
    stopMicrophone();
    toast("You were muted by room owner.");
   }
  });

  socket.on("connect_error",()=>{
   socketConnected=false;
  });

  socket.on("disconnect",()=>{
   socketConnected=false;
  });

 }catch(e){
  console.log(e);
 }
}

   ========================================================= */

let localStream=null;
let peers={};
let remoteAudios={};

const rtcConfig={
 iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"}
 ]
};

async function enableVoice(){

 try{

  if(localStream)return;

  localStream=await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:true
   },
   video:false
  });

  micEnabled=true;

  localStream.getAudioTracks().forEach(track=>{
   Object.values(peers).forEach(pc=>{
    const sender=pc.getSenders()
     .find(s=>s.track?.kind==="audio");

    if(sender)sender.replaceTrack(track);
    else pc.addTrack(track,localStream);
   });
  });

  updateMicButton();

  if(socketConnected){

   socket.emit("mic-status",{
    roomId:ROOM_ID,
    userId:currentUser.userId,
    enabled:true
   });

  }

  toast("Voice system ready");

  connectPeers();

 }catch(e){

  console.log(e);

  toast(
   e.name==="NotAllowedError"?
   "Microphone permission denied":
   "Microphone could not start"
  );
 }
}

function stopMicrophone(){

 if(localStream){

  localStream.getTracks().forEach(t=>t.stop());
  localStream=null;
 }

 micEnabled=false;
 updateMicButton();

 if(socketConnected){

  socket.emit("mic-status",{
   roomId:ROOM_ID,
   userId:currentUser.userId,
   enabled:false
  });
 }
}

async function toggleMic(){

 if(micEnabled){
  stopMicrophone();
 }else{
  await enableVoice();
 }
}

function updateMicButton(){

 const b=document.getElementById("micBtn");

 b.textContent=micEnabled?"🎤":"🔇";
 b.classList.toggle("active",micEnabled);
}

function toggleSpeaker(){

 speakerEnabled=!speakerEnabled;

 document.querySelectorAll("audio").forEach(a=>{
  a.muted=!speakerEnabled;
 });

 const b=document.getElementById("speakerBtn");

 b.textContent=speakerEnabled?"🔊":"🔇";

function connectPeers(){

 Object.values(roomState.members||{}).forEach(u=>{

  const id=String(u.userId||u.id);

  if(id===String(currentUser.userId))return;

  createPeer(id,u);
 });
}

function createPeer(id,user){

 if(peers[id])return peers[id];

 const pc=new RTCPeerConnection(rtcConfig);

 peers[id]=pc;

 if(localStream){

  localStream.getTracks().forEach(track=>{
   pc.addTrack(track,localStream);
  });
 }

 pc.ontrack=e=>{

  let audio=remoteAudios[id];

  if(!audio){

   audio=document.createElement("audio");
   audio.autoplay=true;
   audio.playsInline=true;
   document.body.appendChild(audio);

   remoteAudios[id]=audio;
  }

  audio.srcObject=e.streams[0];
  audio.muted=!speakerEnabled;
 };

 pc.onicecandidate=e=>{

  if(!e.candidate||!socketConnected)return;

  socket.emit("ice-candidate",{
   roomId:ROOM_ID,
   from:currentUser.userId,
   to:id,
   candidate:e.candidate
  });
 };

 const my=String(currentUser.userId);

 if(my<id){

  pc.createOffer()
   .then(o=>pc.setLocalDescription(o))
   .then(()=>{
    socket.emit("offer",{
     roomId:ROOM_ID,
     from:currentUser.userId,
     to:id,
     offer:pc.localDescription
    });
   });
 }

 return pc;
}

if(typeof io!=="undefined"){

 /* WebRTC signaling */
 setTimeout(()=>{

  if(!socket)return;

  socket.on("offer",async data=>{

   if(data.to!==currentUser.userId)return;

   const pc=createPeer(
    String(data.from),
    {}
   );

   await pc.setRemoteDescription(
    new RTCSessionDescription(data.offer)
   );

   const answer=await pc.createAnswer();

   await pc.setLocalDescription(answer);

   socket.emit("answer",{
    roomId:ROOM_ID,
    from:currentUser.userId,
    to:data.from,
    answer:pc.localDescription
   });
  });

  socket.on("answer",async data=>{

   if(data.to!==currentUser.userId)return;

   const pc=peers[String(data.from)];

   if(pc){

    await pc.setRemoteDescription(
     new RTCSessionDescription(data.answer)
    );
   }
  });

  socket.on("ice-candidate",async data=>{

   if(data.to!==currentUser.userId)return;

   const pc=peers[String(data.from)];

   if(pc && data.candidate){

    try{
     await pc.addIceCandidate(
      new RTCIceCandidate(data.candidate)
     );
    }catch(e){}
   }
  });

 },1000);
}

 if(!socketConnected){

  return;
 }

 socket.emit("gift",{

 });

function handleGift(data){

 if(!data)return;

 const total=
  number(data.totalPrice,
   number(data.price,0)*
   number(data.quantity,1)
  );

 if(
  String(data.userId||data.senderId)===
  String(currentUser.userId)
 ){

  if(data.remainingCoins!==undefined){

   currentUser.coins=
    number(data.remainingCoins,currentUser.coins);

  }else{

   currentUser.coins=
    Math.max(0,currentUser.coins-total);
  }

  saveLocalUser();
  firebaseUserSave();
  renderBalance();
 }

 const receiver=
  data.receiverName||
  data.targetName||
  "User";

 addMessage(
  "🎁 Gift",
  (data.senderName||currentUser.name)+
  " sent "+(data.giftEmoji||"🎁")+
  " to "+receiver
 );

 roomState.roomExp=
  number(roomState.roomExp,0)+
  Math.floor(total/100);

 renderExp();

 if(navigator.vibrate){
  navigator.vibrate(80);
 }
}

function openReward(){

 <div style="line-height:1.8">

 🪙 2,000 Coins<br>
 ✨ 500 EXP

 </div>
 `;

async function claimRoomReward(){

 const key=
  "pv_room_reward_"+ROOM_ID+"_"+currentUser.userId;

 if(localStorage.getItem(key)===new Date().toDateString()){

  toast("Today's room reward already claimed");
  return;
 }

 localStorage.setItem(key,new Date().toDateString());

 currentUser.coins+=2000;
 currentUser.exp+=500;

 saveLocalUser();
 await firebaseUserSave();

 renderBalance();

 closeModal("rewardModal");

 toast("🎁 Room reward claimed");
}

/* =========================================================
   GAMES
   ========================================================= */

const games=[
 "🎲 Dice","🎯 Lucky Shot","🃏 Cards",
 "🎰 Lucky Spin","🏆 Quiz","🎳 Bowling",
 "⚽ Football","🏀 Basketball","🎱 Pool",
 "🐎 Race","🧩 Puzzle","✊ Rock Paper Scissors"
];

function openGames(){

 document.getElementById("gamesGrid").innerHTML=
 games.map(g=>`
 <button class="actionBtn"
 onclick="startGame('${escapeHtml(g)}')">
 ${g}
 </button>
 `).join("");

 openModal("gamesModal");
}

function startGame(game){

 closeModal("gamesModal");

 if(socketConnected){

  socket.emit("game-start",{
   roomId:ROOM_ID,
   userId:currentUser.userId,
   game
  });
 }

 toast(game+" started");
}

/* =========================================================
   INVITE
   ========================================================= */

async function inviteRoom(){

 const base=
  RENDER_SERVER+
  "/room.html";

 const link=
  base+
  "?room="+encodeURIComponent(ROOM_ID)+
  "&userid="+encodeURIComponent(currentUser.userId)+
  "&name="+encodeURIComponent(currentUser.name)+
  "&dp="+encodeURIComponent(currentUser.dp);

 try{

  await navigator.clipboard.writeText(link);
  toast("Room link copied");

 }catch(e){

  prompt("Copy room link:",link);
 }
}

/* =========================================================
   MODALS
   ========================================================= */

function openModal(id){
 document.getElementById(id).classList.add("show");
}

function closeModal(id){
 document.getElementById(id).classList.remove("show");
}

document.querySelectorAll(".modalBg").forEach(bg=>{

 bg.addEventListener("click",e=>{

  if(e.target===bg){
   bg.classList.remove("show");
  }
 });
});

/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function toast(message){

 const el=document.getElementById("toast");

 el.textContent=message;
 el.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
  el.classList.remove("show");
 },2200);
}

/* =========================================================
   HOME / LEAVE
   ========================================================= */

function leaveRoom(){

 if(socketConnected){

  socket.emit("leave-room",{
   roomId:ROOM_ID,
   userId:currentUser.userId
  });
 }

 stopMicrophone();

 Object.values(peers).forEach(pc=>{
  try{pc.close()}catch(e){}
 });

 peers={};

 location.href=
  location.origin+
  "/index.html";
}

function goHome(){
 leaveRoom();
}

/* =========================================================
   INIT
   ========================================================= */

async function init(){

 saveLocalUser();

 renderBalance();

 await firebaseUserLoad();

 await loadFirebaseRoom();

 connectSocket();

 setTimeout(()=>{
  document.getElementById("loading")
   .classList.add("hide");
 },1800);

 /* refresh Firebase fallback */
 setInterval(()=>{
  if(!socketConnected){
   loadFirebaseRoom();
  }
 },5000);
}

window.addEventListener("beforeunload",()=>{
 try{
  if(socket){
   socket.emit("leave-room",{
    roomId:ROOM_ID,
    userId:currentUser.userId
   });
  }
 }catch(e){}
});

init();

</script>
