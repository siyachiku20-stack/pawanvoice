<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PawanVoice Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#171329;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

.header{
  height:70px;
  padding:10px 12px;
  background:#241b46;
  display:flex;
  align-items:center;
  gap:10px;
}

.room-dp{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#555;
}

.room-info{
  flex:1;
}

.room-name{
  font-size:17px;
  font-weight:bold;
}

.room-id{
  font-size:12px;
  opacity:.7;
  margin-top:4px;
}

.room-count{
  font-size:13px;
  background:#3a2c64;
  padding:8px 10px;
  border-radius:15px;
}

.icon-btn{
  border:0;
  color:white;
  background:#3a2c64;
  border-radius:18px;
  padding:8px 10px;
}

.host-line{
  text-align:center;
  padding:8px;
  background:#21183d;
  font-size:13px;
}

.seats{
  padding:15px 12px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px 8px;
}

.seat{
  min-height:95px;
  text-align:center;
}

.seat.host{
  grid-column:1 / 5;
}

.avatar-wrap{
  width:58px;
  height:58px;
  margin:auto;
  position:relative;
}

.seat.host .avatar-wrap{
  width:70px;
  height:70px;
}

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#40395d;
  border:2px solid #8f7bea;
}

.empty{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  color:#aaa;
  border:2px dashed #60577b;
}

.mic-dot{
  position:absolute;
  right:-2px;
  bottom:-2px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#ef4444;
  border:2px solid #171329;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mic-on{
  background:#22c55e;
}

.user-name{
  margin-top:5px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.features{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  padding:10px;
}

.feature{
  background:#292044;
  border-radius:10px;
  padding:10px 4px;
  text-align:center;
  font-size:11px;
}

.exp{
  margin:10px;
  background:#251b40;
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.exp-title{
  font-weight:bold;
  margin-bottom:10px;
}

.top3{
  display:flex;
  justify-content:space-around;
  font-size:12px;
}

.chat{
  margin:10px;
  display:flex;
  gap:6px;
}

.chat input{
  flex:1;
  border:0;
  outline:none;
  border-radius:20px;
  padding:11px 14px;
  background:#2b2346;
  color:white;
}

.chat button{
  width:42px;
  border:0;
  border-radius:50%;
  background:#3a2c64;
  color:white;
  font-size:18px;
}

.controls{
  position:sticky;
  bottom:0;
  background:#21183d;
  padding:10px 7px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.control{
  border:0;
  background:#342957;
  color:white;
  padding:10px 4px;
  border-radius:10px;
  font-size:11px;
}

.control.active{
  background:#1f9d55;
}

.control.off{
  background:#b93838;
}

.messages{
  padding:8px 12px;
  max-height:130px;
  overflow:auto;
}

.msg{
  background:#292044;
  border-radius:10px;
  padding:7px 10px;
  margin-bottom:5px;
  font-size:12px;
}

.emoji-panel{
  display:none;
  padding:10px;
  background:#241b46;
  grid-template-columns:repeat(8,1fr);
  gap:8px;
}

.emoji-panel button{
  border:0;
  background:none;
  font-size:22px;
}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  align-items:center;
  justify-content:center;
  z-index:100;
}

.modal{
  width:90%;
  max-width:360px;
  background:#281f49;
  border-radius:15px;
  padding:18px;
}

.modal h3{
  margin-bottom:14px;
}

.modal button{
  width:100%;
  border:0;
  padding:11px;
  margin-top:8px;
  border-radius:10px;
  background:#45356f;
  color:white;
}

.modal input{
  width:100%;
  padding:11px;
  border:0;
  border-radius:8px;
  margin-bottom:8px;
}

.status{
  text-align:center;
  font-size:12px;
  padding:6px;
  color:#b9b0d7;
}

.hidden-audio{
  display:none;
}
</style>
</head>

<body>

<div class="header">

  <img id="roomDp"
       class="room-dp"
       src="https://via.placeholder.com/100">

  <div class="room-info">
    <div id="roomName" class="room-name">
      PawanVoice Room
    </div>

    <div id="roomId" class="room-id">
      Room
    </div>
  </div>

  <div id="roomCount" class="room-count">
    0/9
  </div>

  <button class="icon-btn" onclick="openSettings()">⚙️</button>
  <button class="icon-btn" onclick="inviteRoom()">↗</button>

</div>

<div id="hostLine" class="host-line">
  Host: —
</div>

<div id="status" class="status">
  Connecting...
</div>

<div id="seats" class="seats"></div>

<div class="features">
  <div class="feature">🛟<br>Room Support</div>
  <div class="feature">🎡<br>Lucky Wheel</div>
  <div class="feature">🚀<br>Bounty Hunter</div>
  <div class="feature">🎁<br>Room Reward</div>
  <div class="feature">✨<br>Exclusive</div>
</div>

<div class="exp">
  <div class="exp-title">🚀 Room EXP</div>

  <div class="top3">
    <div>🥇 Top 1<br>EXP 0</div>
    <div>🥈 Top 2<br>EXP 0</div>
    <div>🥉 Top 3<br>EXP 0</div>
  </div>
</div>

<div id="messages" class="messages"></div>

<div id="emojiPanel" class="emoji-panel">

  <button onclick="addEmoji('😡')">😡</button>
  <button onclick="addEmoji('😭')">😭</button>
  <button onclick="addEmoji('😵')">😵</button>
  <button onclick="addEmoji('🔨')">🔨</button>
  <button onclick="addEmoji('😊')">😊</button>
  <button onclick="addEmoji('😘')">😘</button>
  <button onclick="addEmoji('😆')">😆</button>
  <button onclick="addEmoji('😴')">😴</button>

  <button onclick="addEmoji('😧')">😧</button>
  <button onclick="addEmoji('😁')">😁</button>
  <button onclick="addEmoji('👻')">👻</button>
  <button onclick="addEmoji('😀')">😀</button>
  <button onclick="addEmoji('🥵')">🥵</button>
  <button onclick="addEmoji('🤗')">🤗</button>
  <button onclick="addEmoji('❤️')">❤️</button>
  <button onclick="addEmoji('💰')">💰</button>

  <button onclick="addEmoji('🥳')">🥳</button>
  <button onclick="addEmoji('🥺')">🥺</button>
  <button onclick="addEmoji('😤')">😤</button>
  <button onclick="addEmoji('❓')">❓</button>
  <button onclick="addEmoji('🙄')">🙄</button>
  <button onclick="addEmoji('🤣')">🤣</button>
  <button onclick="addEmoji('😎')">😎</button>
  <button onclick="addEmoji('🤔')">🤔</button>

</div>

<div class="chat">

  <input id="messageInput"
         placeholder="Type a message..."
         onkeydown="if(event.key==='Enter')sendMessage()">

  <button onclick="toggleEmoji()">😊</button>

  <button onclick="sendMessage()">➤</button>

</div>

<div class="controls">

  <button id="voiceBtn"
          class="control"
          onclick="toggleMic()">
    🎙️ Join Voice
  </button>

  <button id="speakerBtn"
          class="control active"
          onclick="toggleSpeaker()">
    🔊 Speaker
  </button>

  <button class="control"
          onclick="inviteRoom()">
    ↗ Invite
  </button>

  <button class="control"
          onclick="openBag()">
    🎒 Bag
  </button>

  <button class="control off"
          onclick="leaveRoom()">
    🚪 Leave
  </button>

</div>

<div id="userModalBg" class="modal-bg">

  <div class="modal">

    <h3 id="userModalTitle">
      User
    </h3>

    <button onclick="makeSelectedAdmin()">
      👑 Make Admin
    </button>

    <button onclick="muteSelected()">
      🔇 Mute
    </button>

    <button onclick="kickSelected()">
      🚫 Kick
    </button>

    <button onclick="closeUserModal()">
      Close
    </button>

  </div>

</div>

<div id="settingsBg" class="modal-bg">

  <div class="modal">

    <h3>Room Settings</h3>

    <input id="newRoomName"
           placeholder="Room name">

    <button onclick="changeRoomName()">
      Save Room Name
    </button>

    <button onclick="closeSettings()">
      Close
    </button>

  </div>

</div>

<div id="audioContainer"></div>

<script>

const SERVER = "https://pawanvoice-1.onrender.com";

const socket = io(SERVER, {
  transports:["websocket","polling"]
});

const params = new URLSearchParams(location.search);

const roomId =
  params.get("room") || "main";

let myUserId =
  localStorage.getItem("pawanvoice_user_id");

if(!myUserId){
  myUserId =
    "u_" +
    Math.random().toString(36).slice(2) +
    Date.now();

  localStorage.setItem(
    "pawanvoice_user_id",
    myUserId
  );
}

let myName =
  localStorage.getItem("pawanvoice_name") ||
  "Pawan";

let myDp =
  localStorage.getItem("pawanvoice_dp") ||
  "https://via.placeholder.com/100";

let currentRoom = null;

let localStream = null;

let micOn = false;

let speakerOn = true;

let selectedUserId = null;

const peers = new Map();

const remoteAudios = new Map();


/* =====================================
   SOCKET CONNECT
===================================== */

socket.on("connect", () => {

  setStatus("Server connected");

  socket.emit("joinRoom", {
    roomId: roomId,

    user:{
      userId:myUserId,
      name:myName,
      dp:myDp
    }
  });

});


socket.on("connect_error", () => {

  setStatus(
    "Server connection failed"
  );

});


/* =====================================
   JOINED ROOM
===================================== */

socket.on("joinedRoom", room => {

  currentRoom = room;

  renderRoom();

  setStatus(
    "Room joined • Voice button dabao"
  );

});


/* =====================================
   ROOM UPDATE
===================================== */

socket.on("roomUpdated", room => {

  currentRoom = room;

  renderRoom();

});


socket.on("roomError", msg => {

  setStatus("❌ " + msg);

  alert(msg);

});


/* =====================================
   RENDER ROOM
===================================== */

function renderRoom(){

  if(!currentRoom) return;

  document.getElementById("roomName")
    .textContent =
    currentRoom.roomName;

  document.getElementById("roomId")
    .textContent =
    "ID: " + currentRoom.roomId;

  document.getElementById("roomCount")
    .textContent =
    currentRoom.users.length + "/9";

  const host =
    currentRoom.users.find(
      u => u.isHost
    );

  document.getElementById("hostLine")
    .textContent =
    "Host: " +
    (host ? host.name : "—");

  if(host && host.dp){

    document.getElementById("roomDp")
      .src = host.dp;

  }

  const seats =
    document.getElementById("seats");

  seats.innerHTML = "";

  for(let seatNo=1; seatNo<=9; seatNo++){

    const user =
      currentRoom.users.find(
        u => u.seatNo === seatNo
      );

    const seat =
      document.createElement("div");

    seat.className =
      "seat" +
      (seatNo===1 ? " host" : "");

    if(user){

      const safeDp =
        user.dp ||
        "https://via.placeholder.com/100";

      seat.innerHTML = `

        <div class="avatar-wrap">

          <img
            class="avatar"
            src="${safeDp}"
            alt=""
          >

          <div class="mic-dot ${
            user.micOn ? "mic-on" : ""
          }">
            ${user.micOn ? "🎙️" : "🔇"}
          </div>

        </div>

        <div class="user-name">
          ${escapeHtml(user.name)}
        </div>

      `;

      seat.onclick = () =>
        openUser(user);

    }else{

      seat.innerHTML = `

        <div class="avatar-wrap">

          <div class="avatar empty">
            +
          </div>

        </div>

        <div class="user-name">
          Seat ${seatNo}
        </div>

      `;

      seat.onclick = () =>
        takeSeat(seatNo);

    }

    seats.appendChild(seat);
  }

  const me =
    currentRoom.users.find(
      u => u.userId === myUserId
    );

  if(me){

    micOn = !!me.micOn;

    updateVoiceButton();

  }

}


/* =====================================
   TAKE SEAT
===================================== */

function takeSeat(seatNo){

  socket.emit("selectSeat", {
    seatNo
  });

}


/* =====================================
   REAL MICROPHONE
===================================== */

async function startVoice(){

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });

    micOn = true;

    socket.emit("micToggle", {
      micOn:true
    });

    updateVoiceButton();

    // Existing users
    if(currentRoom){

      for(const user of currentRoom.users){

        if(user.userId === myUserId)
          continue;

        await createOfferForUser(
          user.userId
        );

      }

    }

    setStatus(
      "🎙️ Microphone ON • Voice connected"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Microphone permission nahi mili"
    );

    alert(
      "Microphone permission Allow karo."
    );

  }

}


function stopVoice(){

  micOn = false;

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {
        track.stop();
      });

    localStream = null;

  }

  for(const pc of peers.values()){

    pc.close();

  }

  peers.clear();

  for(const audio of remoteAudios.values()){

    audio.remove();

  }

  remoteAudios.clear();

  socket.emit("micToggle", {
    micOn:false
  });

  updateVoiceButton();

  setStatus(
    "Microphone OFF"
  );

}


/* =====================================
   MIC BUTTON
===================================== */

async function toggleMic(){

  if(!micOn){

    await startVoice();

  }else{

    stopVoice();

  }

}


function updateVoiceButton(){

  const btn =
    document.getElementById("voiceBtn");

  if(micOn){

    btn.textContent =
      "🎙️ Mic ON";

    btn.classList.add("active");
    btn.classList.remove("off");

  }else{

    btn.textContent =
      "🔇 Join Voice";

    btn.classList.remove("active");

  }

}


/* =====================================
   WEBRTC
===================================== */

function createPeer(userId){

  if(peers.has(userId)){

    return peers.get(userId);

  }

  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
          "stun:stun.l.google.com:19302"
        },
        {
          urls:
          "stun:stun1.l.google.com:19302"
        }
      ]

    });


  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }


  pc.onicecandidate = event => {

    if(event.candidate){

      socket.emit(
        "webrtc-ice-candidate",
        {
          targetUserId:userId,
          candidate:event.candidate
        }
      );

    }

  };


  pc.ontrack = event => {

    const stream =
      event.streams[0];

    playRemoteAudio(
      userId,
      stream
    );

  };


  pc.onconnectionstatechange = () => {

    if(
      pc.connectionState === "failed" ||
      pc.connectionState === "closed"
    ){

      peers.delete(userId);

    }

  };


  peers.set(userId, pc);

  return pc;

}


async function createOfferForUser(userId){

  if(!localStream)
    return;

  const pc =
    createPeer(userId);

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  socket.emit(
    "webrtc-offer",
    {
      targetUserId:userId,
      offer:pc.localDescription
    }
  );

}


socket.on(
  "webrtc-peer-joined",
  async data => {

    if(!micOn)
      return;

    await createOfferForUser(
      data.userId
    );

  }
);


socket.on(
  "webrtc-offer",
  async data => {

    if(!localStream){

      try{

        localStream =
          await navigator.mediaDevices
            .getUserMedia({
              audio:true
            });

        micOn = true;

        socket.emit(
          "micToggle",
          {micOn:true}
        );

        updateVoiceButton();

      }catch(e){

        console.error(e);
        return;

      }

    }

    const pc =
      createPeer(
        data.fromUserId
      );

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    socket.emit(
      "webrtc-answer",
      {
        targetUserId:
          data.fromUserId,

        answer:
          pc.localDescription
      }
    );

  }
);


socket.on(
  "webrtc-answer",
  async data => {

    const pc =
      peers.get(
        data.fromUserId
      );

    if(!pc)
      return;

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

  }
);


socket.on(
  "webrtc-ice-candidate",
  async data => {

    const pc =
      peers.get(
        data.fromUserId
      );

    if(!pc)
      return;

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(
          data.candidate
        )
      );

    }catch(error){

      console.error(
        "ICE error",
        error
      );

    }

  }
);


/* =====================================
   REMOTE AUDIO
===================================== */

function playRemoteAudio(
  userId,
  stream
){

  let audio =
    remoteAudios.get(userId);

  if(!audio){

    audio =
      document.createElement("audio");

    audio.autoplay = true;
    audio.playsInline = true;
    audio.className =
      "hidden-audio";

    document
      .getElementById("audioContainer")
      .appendChild(audio);

    remoteAudios.set(
      userId,
      audio
    );

  }

  audio.srcObject =
    stream;

  audio.muted =
    !speakerOn;

  audio.play().catch(
    console.log
  );

}


/* =====================================
   SPEAKER
===================================== */

function toggleSpeaker(){

  speakerOn =
    !speakerOn;

  for(
    const audio of
    remoteAudios.values()
  ){

    audio.muted =
      !speakerOn;

  }

  socket.emit(
    "speakerToggle",
    {
      speakerOn
    }
  );

  const btn =
    document.getElementById(
      "speakerBtn"
    );

  btn.textContent =
    speakerOn
      ? "🔊 Speaker"
      : "🔇 Speaker OFF";

}


/* =====================================
   CHAT
===================================== */

function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    input.value.trim();

  if(!message)
    return;

  socket.emit(
    "sendMessage",
    {message}
  );

  input.value = "";

}


socket.on(
  "messageReceived",
  data => {

    const box =
      document.getElementById(
        "messages"
      );

    const div =
      document.createElement("div");

    div.className = "msg";

    div.innerHTML =
      "<b>" +
      escapeHtml(data.name) +
      ":</b> " +
      escapeHtml(data.message);

    box.appendChild(div);

    box.scrollTop =
      box.scrollHeight;

  }
);


/* =====================================
   EMOJI
===================================== */

function toggleEmoji(){

  const panel =
    document.getElementById(
      "emojiPanel"
    );

  panel.style.display =
    panel.style.display === "grid"
      ? "none"
      : "grid";

}


function addEmoji(emoji){

  const input =
    document.getElementById(
      "messageInput"
    );

  input.value += emoji;

  input.focus();

}


/* =====================================
   USER MODAL
===================================== */

function openUser(user){

  selectedUserId =
    user.userId;

  document.getElementById(
    "userModalTitle"
  ).textContent =
    user.name +
    "\nID: " +
    user.userId;

  document.getElementById(
    "userModalBg"
  ).style.display =
    "flex";

}


function closeUserModal(){

  document.getElementById(
    "userModalBg"
  ).style.display =
    "none";

}


function myUser(){

  return currentRoom?.users.find(
    u => u.userId === myUserId
  );

}


function makeSelectedAdmin(){

  if(!selectedUserId)
    return;

  socket.emit(
    "makeAdmin",
    {
      targetUserId:
        selectedUserId
    }
  );

  closeUserModal();

}


function muteSelected(){

  if(!selectedUserId)
    return;

  // Current server doesn't force mute audio.
  // This button is reserved for admin moderation.
  alert(
    "Mute moderation server side add ki ja sakti hai."
  );

}


function kickSelected(){

  if(!selectedUserId)
    return;

  socket.emit(
    "kickUser",
    {
      targetUserId:
        selectedUserId
    }
  );

  closeUserModal();

}


/* =====================================
   SETTINGS
===================================== */

function openSettings(){

  const me = myUser();

  if(!me)
    return;

  if(!me.isHost && !me.isAdmin){

    alert(
      "Only Host/Admin can change settings."
    );

    return;

  }

  document.getElementById(
    "newRoomName"
  ).value =
    currentRoom.roomName;

  document.getElementById(
    "settingsBg"
  ).style.display =
    "flex";

}


function closeSettings(){

  document.getElementById(
    "settingsBg"
  ).style.display =
    "none";

}


function changeRoomName(){

  const name =
    document.getElementById(
      "newRoomName"
    ).value.trim();

  if(!name)
    return;

  socket.emit(
    "changeRoomName",
    {
      roomName:name
    }
  );

  closeSettings();

}


/* =====================================
   INVITE
===================================== */

function inviteRoom(){

  const link =
    location.origin +
    location.pathname +
    "?room=" +
    encodeURIComponent(roomId);

  if(navigator.share){

    navigator.share({
      title:"PawanVoice Room",
      text:"Join my PawanVoice room",
      url:link
    }).catch(()=>{});

  }else{

    navigator.clipboard
      ?.writeText(link);

    alert(
      "Room link copy ho gaya:\n\n" +
      link
    );

  }

}


/* =====================================
   BAG
===================================== */

function openBag(){

  alert(
    "🎒 Bag feature next step me connect karenge."
  );

}


/* =====================================
   LEAVE
===================================== */

function leaveRoom(){

  stopVoice();

  location.href =
    "./index.html";

}


/* =====================================
   HELPERS
===================================== */

function setStatus(text){

  document.getElementById(
    "status"
  ).textContent = text;

}


function escapeHtml(text){

  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

   KICK / BAN
===================================== */

socket.on(

    alert(

    location.href =

);


socket.on(

    );

    location.href =

  }
);


/* =====================================
   PAGE CLOSE
===================================== */

window.addEventListener(
  "beforeunload",
  () => {

    if(localStream){

      localStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

  }
);
