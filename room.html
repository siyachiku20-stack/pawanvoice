<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PawanVoice Room</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:#090911;color:#fff;
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{border:0;cursor:pointer}
.app{
  max-width:520px;margin:auto;min-height:100vh;
  background:linear-gradient(#17132b,#0a0a12 45%);
  padding-bottom:78px;
}
.header{
  display:flex;align-items:center;gap:9px;
  padding:10px 12px;
  background:#17132b;
  border-bottom:1px solid #302b42;
}
.roomDp{
  width:45px;height:45px;border-radius:50%;
  object-fit:cover;border:2px solid #8065ff;
}
.roomInfo{flex:1;min-width:0}
.roomName{
  font-size:15px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.roomId{font-size:10px;color:#aaa4b7;margin-top:3px}
.headerBtn{
  width:38px;height:38px;border-radius:50%;
  background:#272238;color:white;
}
.count{
  background:#29233d;border-radius:20px;
  padding:8px 10px;font-size:11px;
}
.hero{
  text-align:center;padding:15px 10px 8px;
}
.heroTitle{font-size:12px;color:#bcb4ca}
.heroRoom{font-size:19px;font-weight:900;margin-top:3px}
.seats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px 7px;
  padding:14px 10px 5px;
}
.seat{
  text-align:center;min-width:0;
}
.avatarWrap{
  position:relative;
  width:64px;height:64px;margin:auto;
}
.avatar{
  width:64px;height:64px;border-radius:50%;
  object-fit:cover;
  border:2px solid #393444;
  background:#23222d;
}
.seat.host .avatar{
  border-color:#ffd35b;
}
.seat.empty .avatar{
  padding:17px;
  object-fit:contain;
  opacity:.7;
}
.seatNo{
  position:absolute;right:-2px;bottom:-2px;
  min-width:20px;height:20px;
  padding:2px 5px;border-radius:10px;
  background:#2d293a;font-size:10px;
}
.mic{
  position:absolute;left:-2px;bottom:-2px;
  width:20px;height:20px;border-radius:50%;
  background:#272331;font-size:10px;
}
.userName{
  margin-top:7px;
  font-size:11px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.userLevel{font-size:9px;color:#aaa4b4;margin-top:3px}
.features{
  padding:12px 10px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
.feature{
  min-height:66px;
  border-radius:13px;
  background:#191824;
  border:1px solid #292638;
  color:#fff;
  font-size:10px;
  padding:7px 3px;
}
.featureIcon{font-size:22px;display:block;margin-bottom:5px}
.expBox{
  margin:6px 10px 10px;
  padding:12px;
  border-radius:16px;
  background:#171620;
  border:1px solid #292735;
}
.expTitle{
  font-size:12px;color:#aaa5b6;
  margin-bottom:10px;
}
.topUsers{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
}
.top{
  text-align:center;background:#211e2b;
  border-radius:12px;padding:8px 3px;
}
.topEmoji{font-size:22px}
.topName{font-size:10px;margin-top:3px}
.chat{
  padding:8px 10px;
}
.chatList{
  height:145px;overflow-y:auto;
  padding:6px 4px;
}
.msg{
  display:flex;gap:7px;margin-bottom:7px;
}
.msgDp{
  width:27px;height:27px;border-radius:50%;
  object-fit:cover;
}
.msgText{
  background:#211e2c;
  border-radius:10px;padding:7px 9px;
  font-size:11px;max-width:78%;
}
.msgName{color:#a990ff;font-weight:700;margin-right:4px}
.bottom{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;gap:7px;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:#12111a;
  border-top:1px solid #2a2835;
  z-index:50;
}
.chatInput{
  flex:1;min-width:0;
  background:#24222e;color:#fff;
  border:1px solid #363342;
  border-radius:22px;
  padding:10px 13px;
  outline:none;
}
.tool{
  width:40px;height:40px;border-radius:50%;
  background:#262330;color:#fff;
}
.tool.on{background:#6547cc}
.emojiPanel{
  display:none;
  position:fixed;left:50%;
  bottom:64px;transform:translateX(-50%);
  width:min(500px,96%);
  padding:12px;
  background:#181722;
  border:1px solid #363344;
  border-radius:18px;
  z-index:60;
}
.emojiPanel.show{display:block}
.emojis{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:7px;
}
.emojis button{
  background:#24222f;border-radius:9px;
  min-height:36px;font-size:21px;
}
.giftOverlay{
  position:fixed;inset:0;
  background:#0009;
  z-index:100;
  display:none;align-items:flex-end;
}
.giftOverlay.show{display:flex}
.sheet{
  width:min(520px,100%);
  max-height:84vh;overflow:auto;
  background:#15141e;
  border-radius:22px 22px 0 0;
  padding:15px;
}
.sheetHead{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:13px;
}
.sheetTitle{font-size:18px;font-weight:900}
.close{
  width:38px;height:38px;border-radius:50%;
  background:#282632;color:white;
}
.walletLine{
  padding:11px;border-radius:12px;
  background:#211f2b;color:#bbb4c7;
  font-size:12px;margin-bottom:12px;
}
.receiverGrid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;margin-bottom:15px;
}
.receiver{
  padding:7px 3px;
  background:#211f2b;
  border:1px solid #302d3b;
  border-radius:12px;
  color:white;text-align:center;
}
.receiver.selected{
  border-color:#8d6dff;
  background:#302652;
}
.receiver img{
  width:42px;height:42px;border-radius:50%;
  object-fit:cover;
}
.receiverName{
  font-size:9px;margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
}
.giftGrid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.gift{
  background:#211f2b;
  border:1px solid #302d3b;
  border-radius:13px;
  color:white;padding:9px 3px;
  text-align:center;
}
.gift.selected{
  border-color:#9a7aff;
  background:#302653;
}
.giftEmoji{font-size:30px}
.giftName{font-size:10px;margin-top:4px}
.giftPrice{
  color:#ffd34d;font-size:9px;
  margin-top:3px;
}
.sendGift{
  width:100%;margin-top:13px;
  padding:13px;border-radius:13px;
  background:#7652ed;color:#fff;
  font-weight:900;
}
.sendGift:disabled{
  opacity:.45;cursor:not-allowed;
}
.toast{
  position:fixed;left:50%;bottom:78px;
  transform:translateX(-50%);
  z-index:200;background:#292633;
  padding:11px 15px;border-radius:12px;
  font-size:12px;display:none;
}
.toast.show{display:block}
.giftFloat{
  position:fixed;left:50%;top:42%;
  transform:translate(-50%,-50%);
  z-index:190;text-align:center;
  display:none;
  animation:pop .8s ease;
}
.giftFloat.show{display:block}
.giftFloatEmoji{font-size:90px}
.giftFloatText{
  margin-top:5px;
  padding:7px 12px;
  border-radius:15px;
  background:#241d3c;
  font-weight:800;
}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  55%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.modal{
  position:fixed;inset:0;z-index:120;
  background:#0009;display:none;
  align-items:center;justify-content:center;
}
.modal.show{display:flex}
.modalBox{
  width:min(400px,92%);
  background:#181720;
  border:1px solid #363341;
  border-radius:18px;padding:18px;
}
.modalBox h3{margin-top:0}
.modalBtn{
  width:100%;padding:12px;margin-top:8px;
  border-radius:11px;background:#282532;color:#fff;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <!-- 9 SEATS -->
  <div class="seats" id="seats"></div>

  <!-- FEATURES -->

<!-- BOTTOM CONTROLS -->
<div class="bottom">

  <input

    placeholder="Say something..."

  >

  <button class="tool" id="emojiBtn">😊</button>

  <button class="tool" id="micBtn">🎙️</button>

  <button class="tool" id="giftBtn">🎁</button>

  <button class="tool" id="moreBtn">•••</button>

</div>

<!-- EMOJI -->
<div class="emojiPanel" id="emojiPanel">
  <div class="emojis" id="emojis"></div>
</div>

<!-- GIFT SHEET -->
<div class="giftOverlay" id="giftOverlay">

  <div class="sheet">

    <div class="sheetHead">

      <div class="sheetTitle">

</div>

<!-- SETTINGS -->

<!-- INVITE -->
<div class="modal" id="inviteModal">

    <h3>Room Invite</h3>

    <p id="inviteText" style="font-size:12px;color:#aaa">

    Gift sent!
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="user.js"></script>

<script>

const DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const params =
  new URLSearchParams(location.search);

const ROOM_ID =
  params.get("room") || "PVMAIN";

let currentUser = null;

let socket = null;

let roomState = {
  seats: Array(9).fill(null),
  users: []
};

let selectedReceiver = null;
let selectedGift = null;

let walletCoins = 0;

const gifts = [

  {
    id:"rose",
    name:"Rose",
    emoji:"🌹",
    price:10
  },

  {
    id:"heart",
    name:"Heart",
    emoji:"❤️",
    price:50
  },

  {
    id:"teddy",
    name:"Teddy",
    emoji:"🧸",
    price:100
  },

  {
    id:"cake",
    name:"Cake",
    emoji:"🎂",
    price:150
  },

  {
    id:"love",
    name:"Love Box",
    emoji:"💝",
    price:300
  },

  {
    id:"crown",
    name:"Crown",
    emoji:"👑",
    price:500
  },

  {
    id:"diamond",
    name:"Diamond",
    emoji:"💎",
    price:1000
  },

  {
    id:"ring",
    name:"Royal Ring",
    emoji:"💍",
    price:1500
  },

  {
    id:"rocket",
    name:"Rocket",
    emoji:"🚀",
    price:2500
  },

  {
    id:"fireworks",
    name:"Fireworks",
    emoji:"🎆",
    price:5000
  },

  {
    id:"castle",
    name:"Castle",
    emoji:"🏰",
    price:10000
  },

  {
    id:"unicorn",
    name:"Unicorn",
    emoji:"🦄",
    price:20000
  }

];

function safe(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatNumber(value){
  return Number(value || 0)
    .toLocaleString("en-IN");
}

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.pvToast);

  window.pvToast =
    setTimeout(
      () => el.classList.remove("show"),
      2500
    );
}

async function firebaseGet(path){

  const response =
    await fetch(
      DB + path + ".json"
    );

  if(!response.ok){
    throw new Error(
      "Firebase GET " + response.status
    );
  }

  return response.json();
}

async function firebasePut(path,data){

  const response =
    await fetch(
      DB + path + ".json",
      {
        method:"PUT",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
      }
    );

  if(!response.ok){
    throw new Error(
      "Firebase PUT " + response.status
    );
  }

  return response.json();
}

async function firebasePatch(path,data){

  const response =
    await fetch(
      DB + path + ".json",
      {
        method:"PATCH",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
      }
    );

  if(!response.ok){
    throw new Error(
      "Firebase PATCH " + response.status
    );
  }

  return response.json();
}

/* ---------------- USER ---------------- */

async function loadCurrentUser(){

  try{
    currentUser =
      await pvLoadUser();
  }catch(error){
    console.error(error);
    currentUser =
      pvGetLocalUser();
  }

  if(!currentUser){
    currentUser = {
      userId:"pawan",
      name:"Pawan User",
      dp:"https://i.pravatar.cc/200?img=12",
      level:1,
      exp:0,
      coins:0
    };
  }

  await loadWallet();

  connectSocket();
}

/* ---------------- WALLET ---------------- */

async function loadWallet(){

  try{

    const data =
      await firebaseGet(
        "/wallets/" +
        encodeURIComponent(
          currentUser.userId
        )
      );

    if(data){

      walletCoins =
        Number(
          data.coins ??
          currentUser.coins ??
          0
        );

    }else{

      walletCoins =
        Number(
          currentUser.coins || 0
        );

      await firebasePut(
        "/wallets/" +
        encodeURIComponent(
          currentUser.userId
        ),
        {
          coins:walletCoins,
          diamonds:Number(
            currentUser.diamonds || 0
          ),
          updatedAt:Date.now()
        }
      );

    }

  }catch(error){

    console.error(
      "Wallet:",
      error
    );

    walletCoins =
      Number(
        currentUser.coins || 0
      );

  }

}

/* ---------------- SOCKET ---------------- */

function connectSocket(){

  socket =
    io(
      location.origin,
      {
        transports:["websocket","polling"]
      }
    );

  socket.on(
    "connect",
    () => {

      socket.emit(
        "join-room",
        {
          roomId:ROOM_ID,

          userId:
            currentUser.userId,

          name:
            currentUser.name,

          dp:
            currentUser.dp,

          level:
            currentUser.level || 1,

          exp:
            currentUser.exp || 0
        }
      );

    }
  );

  socket.on(
    "joined-room",
    data => {

      console.log(
        "Joined:",
        data
      );

    }
  );

  socket.on(
    "room-state",
    state => {

      roomState =
        state || {
          seats:Array(9).fill(null),
          users:[]
        };

      renderRoom();

    }
  );

  socket.on(
    "chat-message",
    message => {

      addMessage(
        message
      );

    }
  );

  socket.on(
    "gift",
    gift => {

      showGiftAnimation(
        gift
      );

      addMessage({
        name:
          gift.name || "User",

        dp:
          gift.dp ||
          "https://i.pravatar.cc/100?img=12",

        text:
          "sent 🎁 " +
          (gift.gift || "Gift")
      });

    }
  );

  socket.on(
    "forced-mute",
    () => {

      micEnabled = false;
      updateMicButton();

      toast(
        "Admin muted your microphone."
      );

    }
  );

  socket.on(
    "kicked",
    data => {

      toast(
        data?.message ||
        "You were removed."
      );

      setTimeout(
        () => {
          location.href =
            "index.html";
        },
        1200
      );

    }
  );

  socket.on(
    "seat-error",
    data => {

      toast(
        data?.message ||
        "Seat unavailable."
      );

    }
  );

}

/* ---------------- ROOM ---------------- */

function renderRoom(){

  document.getElementById(
    "roomName"
  ).textContent =
    roomState.name ||
    "PawanVoice Room";

  document.getElementById(
    "heroRoom"
  ).textContent =
    roomState.name ||
    "PawanVoice";

  document.getElementById(
    "roomId"
  ).textContent =
    "Room ID: " +
    ROOM_ID;

  if(roomState.dp){

    document.getElementById(
      "roomDp"
    ).src =
      roomState.dp;

  }

  const seats =
    Array.isArray(
      roomState.seats
    )
      ? roomState.seats
      : Array(9).fill(null);

  const users =
    Array.isArray(
      roomState.users
    )
      ? roomState.users
      : [];

  const occupied =
    seats.filter(Boolean).length;

  document.getElementById(
    "userCount"
  ).textContent =
    occupied + "/9";

  const container =
    document.getElementById(
      "seats"
    );

  container.innerHTML = "";

  for(
    let i=0;
    i<9;
    i++
  ){

    const user =
      seats[i];

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "seat " +
      (i === 0 ? "host " : "") +
      (!user ? "empty" : "");

    if(user){

      div.innerHTML = `

        <div class="avatarWrap">

          <img
            class="avatar"
            src="${safe(
              user.dp ||
              "https://i.pravatar.cc/100?img=12"
            )}"
            alt=""
          >

          <span class="seatNo">
            ${i+1}
          </span>

          <span class="mic">
            ${user.mic ? "🎙️" : "🔇"}
          </span>

/* ---------------- GIFT SHEET ---------------- */

function openGiftSheet(){

  document
    .getElementById(
      "giftOverlay"
    )
    .classList.add("show");

  document.getElementById(
    "giftCoins"
  ).textContent =
    formatNumber(
      walletCoins
    );

  renderGiftReceivers();
  renderGiftCatalog();
  updateGiftButton();

}

function closeGiftSheet(){

  document
    .getElementById(
      "giftOverlay"
    )
    .classList.remove("show");

}

function normalizeUser(user){

  return {
    userId:
      user.userId ||
      user.socketId ||
      "",

    socketId:
      user.socketId ||
      "",

    name:
      user.name ||
      "Pawan User",

    dp:
      user.dp ||
      "https://i.pravatar.cc/100?img=12",

    level:
      Number(user.level || 1)
  };

}

function getRoomUsers(){

  const map =
    new Map();

  if(
    Array.isArray(
      roomState.users
    )
  ){

    roomState.users.forEach(
      user => {

        const u =
          normalizeUser(user);

        if(u.userId){
          map.set(
            u.userId,
            u
          );
        }

      }
    );

  }

  if(
    Array.isArray(
      roomState.seats
    )
  ){

    roomState.seats
      .filter(Boolean)
      .forEach(
        user => {

          const u =
            normalizeUser(user);

          if(u.userId){
            map.set(
              u.userId,
              u
            );
          }

        }
      );

  }

  return Array.from(
    map.values()
  );

}

function renderGiftReceivers(){

  const container =
    document.getElementById(
      "receiverGrid"
    );

  container.innerHTML = "";

  const users =
    getRoomUsers()
      .filter(
        user =>
          user.userId !==
          currentUser.userId
      );

  if(!users.length){

    container.innerHTML = `
      <div style="
        grid-column:1/-1;
        padding:18px;
        color:#999;
        text-align:center;
        font-size:12px;
      ">
        अभी room में कोई दूसरा user नहीं है.
      </div>
    `;

    return;

  }

  users.forEach(
    user => {

      const btn =
        document.createElement(
          "button"
        );

      btn.className =
        "receiver";

      if(
        selectedReceiver &&
        selectedReceiver.userId ===
        user.userId
      ){
        btn.classList.add(
          "selected"
        );
      }

      btn.innerHTML = `

        <img
          src="${safe(user.dp)}"
          alt=""
        >

        <div class="receiverName">
          ${safe(user.name)}
        </div>

      `;

      btn.addEventListener(
        "click",
        () => {

          selectedReceiver =
            user;

          renderGiftReceivers();
          updateGiftButton();

        }
      );

      container.appendChild(
        btn
      );

    }
  );

}

function renderGiftCatalog(){

    document.getElementById(
      "giftGrid"
    );

  container.innerHTML = "";

        </div>

function updateGiftButton(){

  const btn =
    document.getElementById(
      "sendGiftBtn"
    );

  if(
    !selectedReceiver ||
    !selectedGift
  ){

    btn.disabled = true;

    btn.textContent =
      "🎁 Select receiver & gift";

    return;

  }

  if(
    walletCoins <
    selectedGift.price
  ){

    btn.disabled = true;

    btn.textContent =
      "🪙 Coins कम हैं";

    return;

  }

  btn.disabled = false;

  btn.textContent =
    "🎁 Send " +
    selectedGift.name +
    " • 🪙 " +
    formatNumber(
      selectedGift.price
    );

}

/* ---------------- SEND GIFT ---------------- */

async function sendGiftFromRoom(){

  if(
    !selectedReceiver ||
    !selectedGift
  ){
    return;
  }

  const total =
    Number(
      selectedGift.price
    );

  if(walletCoins < total){

    toast(
      "Coins कम हैं."
    );

    return;

  }

  const button =
    document.getElementById(
      "sendGiftBtn"
    );

  button.disabled = true;
  button.textContent =
    "Sending...";

  try{

    /*
      Receiver Firebase profile.
    */

    const receiver =
      await firebaseGet(
        "/users/" +
        encodeURIComponent(
          selectedReceiver.userId
        )
      );

    if(!receiver){

      toast(
        "Receiver profile नहीं मिला."
      );

      return;

    }

    const senderId =
      currentUser.userId;

    const receiverId =
      selectedReceiver.userId;

    const now =
      Date.now();

    const transactionId =
      now +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,10);

    /*
      Current sender wallet.
    */

    const senderWallet =
      await firebaseGet(
        "/wallets/" +
        encodeURIComponent(
          senderId
        )
      );

    const latestSenderCoins =
      Number(
        senderWallet?.coins ??
        walletCoins ??
        0
      );

    if(
      latestSenderCoins <
      total
    ){

      walletCoins =
        latestSenderCoins;

      document.getElementById(
        "giftCoins"
      ).textContent =
        formatNumber(
          walletCoins
        );

      toast(
        "Coins कम हैं."
      );

      return;

    }

    /*
      Receiver wallet.
    */

    const receiverWallet =
      await firebaseGet(
        "/wallets/" +
        encodeURIComponent(
          receiverId
        )
      );

    const receiverCoins =
      Number(
        receiverWallet?.coins ??
        receiver?.coins ??
        0
      );

    const newSenderCoins =
      latestSenderCoins -
      total;

    const newReceiverCoins =
      receiverCoins +
      total;

    /*
      Update sender wallet.
    */

    await firebasePatch(
      "/wallets/" +
      encodeURIComponent(
        senderId
      ),
      {
        coins:
          newSenderCoins,

        updatedAt:
          now
      }
    );

    /*
      Update receiver wallet.
    */

    await firebasePatch(
      "/wallets/" +
      encodeURIComponent(
        receiverId
      ),
      {
        coins:
          newReceiverCoins,

        diamonds:
          Number(
            receiverWallet?.diamonds ??
            receiver?.diamonds ??
            0
          ),

        updatedAt:
          now
      }
    );

    /*
      Gift transaction.
    */

    await firebasePut(
      "/giftTransactions/" +
      transactionId,
      {

        transactionId,

        senderId,

        senderName:
          currentUser.name ||
          "Pawan User",

        senderDp:
          currentUser.dp ||
          "",

        receiverId,

        receiverName:
          receiver.name ||
          selectedReceiver.name ||
          "Pawan User",

        receiverDp:
          receiver.dp ||
          selectedReceiver.dp ||
          "",

        giftId:
          selectedGift.id,

        giftName:
          selectedGift.name,

        giftEmoji:
          selectedGift.emoji,

        quantity:1,

        coinAmount:
          total,

        roomId:
          ROOM_ID,

        createdAt:
          now

      }
    );

    /*
      Sender transaction.
    */

    await firebasePut(
      "/coinTransactions/" +
      transactionId +
      "_sender",
      {

        transactionId,

        userId:
          senderId,

        type:
          "gift_sent",

        amount:
          -total,

        reason:
          "Gift sent: " +
          selectedGift.name,

        giftId:
          selectedGift.id,

        receiverId,

        roomId:
          ROOM_ID,

        createdAt:
          now

      }
    );

    /*
      Receiver transaction.
    */

    await firebasePut(
      "/coinTransactions/" +
      transactionId +
      "_receiver",
      {

        transactionId,

        userId:
          receiverId,

        type:
          "gift_received",

        amount:
          total,

        reason:
          "Gift received: " +
          selectedGift.name,

        giftId:
          selectedGift.id,

        senderId,

        roomId:
          ROOM_ID,

        createdAt:
          now

      }
    );

    /*
      Receiver notification.
    */

    await firebasePut(
      "/giftNotifications/" +
      encodeURIComponent(
        receiverId
      ) +
      "/" +
      transactionId,
      {

        transactionId,

        senderId,

        senderName:
          currentUser.name ||
          "Pawan User",

        senderDp:
          currentUser.dp ||
          "",

        giftName:
          selectedGift.name,

        giftEmoji:
          selectedGift.emoji,

        quantity:1,

        coinAmount:
          total,

        roomId:
          ROOM_ID,

        createdAt:
          now,

        read:false

      }
    );

    /*
      Local wallet update.
    */

    walletCoins =
      newSenderCoins;

    currentUser.coins =
      newSenderCoins;

    try{
      pvSaveLocalUser(
        currentUser
      );
    }catch(e){
      console.warn(e);
    }

    document.getElementById(
      "giftCoins"
    ).textContent =
      formatNumber(
        walletCoins
      );

    /*
      Live room gift event.
    */

    if(socket){

      socket.emit(
        "send-gift",
        {
          roomId:
            ROOM_ID,

          gift:
            selectedGift.name,

          receiverId,

          transactionId
        }
      );

    }

    /*
      Show immediately for sender.
    */

    showGiftAnimation({

      name:
        currentUser.name,

      dp:
        currentUser.dp,

      gift:
        selectedGift.name,

      giftEmoji:
        selectedGift.emoji,

      receiverName:
        receiver.name ||
        selectedReceiver.name

    });

    addMessage({

      name:
        currentUser.name,

      dp:
        currentUser.dp,

      text:
        "sent " +
        selectedGift.emoji +
        " " +
        selectedGift.name +
        " to " +
        (
          receiver.name ||
          selectedReceiver.name
        )

    });

    toast(
      "🎁 Gift successfully sent!"
    );

    selectedGift =
      null;

    selectedReceiver =
      null;

    setTimeout(
      closeGiftSheet,
      700
    );

  }catch(error){

    console.error(
      "Room gift error:",
      error
    );

    toast(
      "Gift send नहीं हुआ. Firebase check करें."
    );

  }finally{

    button.disabled = false;

    updateGiftButton();

  }

}

/* ---------------- CHAT ---------------- */

function addMessage(message){

  const list =
    document.getElementById(
      "chatList"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "msg";

  div.innerHTML = `

    <img
      class="msgDp"
      src="${safe(
        message.dp ||
        "https://i.pravatar.cc/100?img=12"
      )}"
      alt=""
    >

    <div class="msgText">

      <span class="msgName">
        ${safe(
          message.name ||
          "User"
        )}
      </span>

      ${safe(
        message.text ||
        ""
      )}

    </div>

  `;

  list.appendChild(
    div
  );

  while(
    list.children.length > 50
  ){
    list.removeChild(
      list.firstChild
    );
  }

  list.scrollTop =
    list.scrollHeight;

}

/* ---------------- MIC ---------------- */

let micEnabled = false;

function updateMicButton(){

  const btn =
    document.getElementById(
      "micBtn"
    );

  btn.textContent =
    micEnabled
      ? "🎙️"
      : "🔇";

  btn.classList.toggle(
    "on",
    micEnabled
  );

}

async function toggleMic(){

  if(!micEnabled){

    try{

      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });

      micEnabled = true;

      if(socket){

        socket.emit(
          "mic-status",
          {
            enabled:true
          }
        );

      }

      toast(
        "Microphone ON"
      );

    }catch(error){

      console.error(error);

      toast(
        "Microphone permission नहीं मिली."
      );

      micEnabled = false;

    }

  }else{

    micEnabled = false;

    if(socket){

      socket.emit(
        "mic-status",
        {
          enabled:false
        }
      );

    }

    toast(
      "Microphone OFF"
    );

  }

  updateMicButton();

}

function showGiftAnimation(gift){

    gift.giftEmoji ||
    (
      gifts.find(
        g =>
          g.name ===
          gift.gift
      )?.emoji ||
      "🎁"
    );

  document.getElementById(
    "giftFloatEmoji"
  ).textContent =
    emoji;

  document.getElementById(
    "giftFloatText"
  ).textContent =
    (
      gift.name ||
      "User"
    ) +
    " sent " +
    (
      gift.gift ||
      "Gift"
    );

  const box =
    document.getElementById(
      "giftFloat"
    );

  box.classList.remove(
    "show"
  );

  void box.offsetWidth;

  box.classList.add(
    "show"
  );

  clearTimeout(
    window.pvGiftTimer
  );

  window.pvGiftTimer =
    setTimeout(
      () => {
        box.classList.remove(
          "show"

      1800
    );
