<script>

/* =========================================================
   FIREBASE
   ========================================================= */

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

let db = null;
let firebaseReady = false;

try{

  if(
    firebaseConfig.apiKey !==
    "YOUR_API_KEY"
  ){

    firebase.initializeApp(firebaseConfig);

    db = firebase.database();

    firebaseReady = true;

  }

}catch(error){

  console.error(error);

}


/* =========================================================
   USER
   ========================================================= */

let myId =
  localStorage.getItem(
    "pawanUserId"
  );

if(!myId){

  myId =
    "PV" +
    Date.now()
      .toString()
      .slice(-8);

  localStorage.setItem(
    "pawanUserId",
    myId
  );

}

let myName =
  localStorage.getItem(
    "pawanName"
  ) || "Guest";

let myGender =
  localStorage.getItem(
    "pawanGender"
  ) || "Male";


/* =========================================================
   ROOM ID
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

let currentRoomId =
  params.get("room");


if(!currentRoomId){

  currentRoomId =
    localStorage.getItem(
      "pawanCurrentRoom"
    );

}


if(currentRoomId){

  localStorage.setItem(
    "pawanCurrentRoom",
    currentRoomId
  );

}


/* =========================================================
   ROOM VARIABLES
   ========================================================= */

let roomData = null;
let roomUsers = {};

let localStream = null;

let micOn = true;
let speakerOn = true;

let peerConnections = {};

let isHost = false;


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(!currentRoomId){

      showToast(
        "Room ID नहीं मिला."
      );

      return;

    }

    if(!firebaseReady){

      showToast(
        "Firebase config डालना जरूरी है."
      );

      return;

    }

    loadRoom();

  }
);


/* =========================================================
   LOAD ROOM
   ========================================================= */

function loadRoom(){

  db.ref(
    "rooms/" +
    currentRoomId
  ).on(
    "value",
    function(snapshot){

      if(!snapshot.exists()){

        showToast(
          "Room मौजूद नहीं है."
        );

        return;

      }

      roomData =
        snapshot.val();

      isHost =
        roomData.hostId === myId;

      updateRoomHeader();

      loadUsers();

    }
  );

}


/* =========================================================
   HEADER
   ========================================================= */

function updateRoomHeader(){

  document
    .getElementById("roomName")
    .textContent =
      roomData.name ||
      "PawanVoice Room";


  document
    .getElementById("roomNumber")
    .textContent =
      "Room #" +
      currentRoomId;


  document
    .getElementById("hostName")
    .textContent =
      "👑 Host: " +
      (
        roomData.hostName ||
        "Host"
      );


  document
    .getElementById("roomMeta")
    .textContent =
      getUserCount() +
      "/9 · " +
      (
        roomData.category ||
        "General"
      );

}


/* =========================================================
   USERS
   ========================================================= */

function loadUsers(){

  db.ref(
    "rooms/" +
    currentRoomId +
    "/users"
  ).on(
    "value",
    function(snapshot){

      roomUsers =
        snapshot.val() || {};

      renderSeats();

      renderExp();

    }
  );

}


function getUserCount(){

  return Object.keys(
    roomUsers
  ).length;

}


/* =========================================================
   SEATS
   ========================================================= */

function renderSeats(){

  const box =
    document.getElementById(
      "seats"
    );

  let html = "";


  for(
    let seat=1;
    seat<=9;
    seat++
  ){

    let user = null;


    Object.keys(roomUsers)
      .some(function(uid){

        const u =
          roomUsers[uid];

        if(
          u &&
          Number(u.seat) === seat
        ){

          user = u;

          return true;

        }

        return false;

      });


    if(user){

      const owner =
        user.isHost === true ||
        seat === 1;


      const icon =
        owner
        ? "👑"
        : (
          user.gender === "Female"
          ? "👩"
          : "👤"
        );


      html += `

        <div
          class="seat ${
            owner ? "owner" : ""
          }"
          onclick="userClicked('${attr(user.id)}')">

          <div class="seat-circle">
            ${icon}
          </div>

          <div class="seat-name">
            ${safe(
              user.name ||
              "Guest"
            )}
          </div>

          <div class="seat-id">
            ID:
            ${safe(
              String(
                user.id || ""
              ).slice(-6)
            )}
          </div>

        </div>

      `;

    }else{

      html += `

        <div class="seat">

          <div class="seat-circle empty-seat">
            +
          </div>

          <div class="seat-name">
            Seat ${seat}
          </div>

        </div>

      `;

    }

  }


  box.innerHTML =
    html;

}


/* =========================================================
   USER MENU
   ========================================================= */

function userClicked(uid){

  const user =
    roomUsers[uid];

  if(!user) return;


  let content = `

    <div style="
      background:#101016;
      border-radius:12px;
      padding:12px;
      margin-bottom:10px;
    ">

      <div style="
        font-size:15px;
        font-weight:bold;
      ">
        👤 ${safe(user.name || "Guest")}
      </div>

      <div style="
        color:#999;
        font-size:11px;
        margin-top:5px;
      ">
        User ID: ${safe(user.id)}
      </div>

      <div style="
        color:#999;
        font-size:11px;
        margin-top:4px;
      ">
        Seat: ${user.seat || "-"}
      </div>

    </div>

  `;


  if(isHost && uid !== myId){

    content += `

      <div class="modal-grid">

        <button
          class="modal-btn"
          onclick="makeAdmin('${attr(uid)}')">
          🛡️ Make Admin
        </button>

        <button
          class="modal-btn red"
          onclick="kickUser('${attr(uid)}')">
          🚫 Kick User
        </button>

      </div>

    `;

  }


  openModal(
    "👤 User Profile",
    content
  );

}


/* =========================================================
   ADMIN
   ========================================================= */

function makeAdmin(uid){

  if(!isHost){

    showToast(
      "Only Owner can make Admin."
    );

    return;

  }


  db.ref(
    "rooms/" +
    currentRoomId +
    "/users/" +
    uid
  )
  .update({
    isAdmin:true
  })
  .then(function(){

    closeModal();

    showToast(
      "User को Admin बना दिया."
    );

  });

}


function kickUser(uid){

  if(!isHost){

    showToast(
      "Only Owner can kick."
    );

    return;

  }


  if(uid === myId){

    return;

  }


  db.ref(
    "rooms/" +
    currentRoomId +
    "/users/" +
    uid
  )
  .remove()
  .then(function(){

    closeModal();

    showToast(
      "User room से remove हो गया."
    );

  });

}


/* =========================================================
   CHAT
   ========================================================= */

function listenChat(){

  db.ref(
    "rooms/" +
    currentRoomId +
    "/chat"
  )
  .limitToLast(80)
  .on(
    "value",
    function(snapshot){

      const data =
        snapshot.val() || {};

      const box =
        document.getElementById(
          "chatBox"
        );


      let html = "";


      Object.keys(data)
        .forEach(function(key){

          const msg =
            data[key];


          html += `

            <div class="chat-message">

              <b>
                ${safe(
                  msg.name ||
                  "Guest"
                )}:
              </b>

              ${safe(
                msg.text ||
                ""
              )}

            </div>

          `;

        });


      box.innerHTML =
        html ||
        `
          <div class="chat-message">
            <b>System:</b>
            No messages yet.
          </div>
        `;


      box.scrollTop =
        box.scrollHeight;

    }
  );

}


function sendChat(){

  const input =
    document.getElementById(
      "chatInput"
    );

  const text =
    input.value.trim();


  if(!text) return;


  db.ref(
    "rooms/" +
    currentRoomId +
    "/chat"
  )
  .push({

    uid:myId,

    name:myName,

    text:text,

    time:
      firebase.database.ServerValue.TIMESTAMP

  });


  input.value = "";

}


function chatEnter(event){

  if(
    event.key === "Enter"
  ){

    sendChat();

  }

}

/* =========================================================

   ========================================================= */

function renderExp(){

  const users =
    Object.keys(roomUsers)
      .map(function(uid){

        return roomUsers[uid];

      });


  users.sort(function(a,b){

    return (
      Number(b.exp || 0) -
      Number(a.exp || 0)
    );

  });


  for(
    let i=0;
    i<3;
    i++
  ){

    const name =
      document.getElementById(
        "exp" +
        (i+1) +
        "Name"
      );

    const value =
      document.getElementById(
        "exp" +
        (i+1) +
        "Value"
      );


    if(users[i]){

      name.textContent =
        users[i].name ||
        "Guest";

      value.textContent =
        Number(
          users[i].exp || 0
        ) +
        " EXP";

    }else{

      name.textContent =
        "---";

      value.textContent =
        "0 EXP";

    }

  }

}

async function startMicrophone(){

  try{

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true,
          video:false
        });


    localStream
      .getAudioTracks()
      .forEach(function(track){

        track.enabled =
          micOn;

      });


    showToast(
      "Microphone connected."
    );

  }catch(error){

    console.error(error);

    showToast(
      "Microphone permission Allow करें."
    );

  }

}


function toggleMic(){

  micOn =
    !micOn;


  if(localStream){

    localStream
      .getAudioTracks()
      .forEach(function(track){

        track.enabled =
          micOn;

      });

  }


  const button =
    document.getElementById(
      "micBtn"
    );


  button.textContent =
    micOn
    ? "🎤"
    : "🔇";


  button.classList.toggle(
    "active",
    micOn
  );


  if(
    firebaseReady &&
    currentRoomId
  ){

    db.ref(
      "rooms/" +
      currentRoomId +
      "/users/" +
      myId +
      "/micOn"
    ).set(micOn);

  }

}

function inviteRoom(){

    "🎙️ Join my PawanVoice room\n" +

    navigator.share({
      title:"PawanVoice Room",

      .writeText(text)

  }else{

async function leaveRoom(){

  try{

    if(
      firebaseReady &&
      currentRoomId
    ){

      await db.ref(
        "rooms/" +
        currentRoomId +
        "/users/" +
        myId
      ).remove();

    }


    if(localStream){

      localStream
        .getTracks()
        .forEach(function(track){

          track.stop();

        });

    }


    Object.keys(
      peerConnections
    ).forEach(function(uid){

      try{

        peerConnections[uid]
          .close();

      }catch(e){}

    });


    peerConnections = {};

  }catch(error){

    console.error(error);

  }


  goHome();

}


function goHome(){

  window.location.href =
    "index.html";

}

function safe(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function attr(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}
