<script>

/* ==================================
   FIREBASE
================================== */

const firebaseConfig = {

  apiKey:
  "PASTE_YOUR_EXISTING_FULL_API_KEY_HERE",

  authDomain:
  "pawanvoice-68c5e.firebaseapp.com",

  databaseURL:
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com",

  projectId:
  "pawanvoice-68c5e",

  storageBucket:
  "pawanvoice-68c5e.firebasestorage.app",

  messagingSenderId:
  "148446327241",

  appId:
  "1:148446327241:web:6bac9cb9ad0fb530cbb818",

  measurementId:
  "G-S98P3GBNCK"

};

firebase.initializeApp(firebaseConfig);

const db =
firebase.database();


/* ==================================
   URL DATA
================================== */

const params =
new URLSearchParams(
location.search
);

const roomId =
params.get("room") || "10001";

const userId =
params.get("userid") ||
localStorage.getItem("pv_userId") ||
("PV"+Math.floor(
10000+Math.random()*90000
));

const userName =
params.get("name") ||
localStorage.getItem("pv_name") ||
"Pawan";

const userDP =
params.get("dp") ||
localStorage.getItem("pv_dp") ||
"https://i.pravatar.cc/150?img=12";

const title =
params.get("title") ||
"PawanVoice Room";


/* ==================================
   UI
================================== */

document.getElementById(
"roomName"
).textContent = title;

document.getElementById(
"roomNumber"
).textContent =
"Room " + roomId;

document.getElementById(
"roomDP"
).src = userDP;


/* ==================================
   SAVE USER
================================== */

db.ref(
"users/" + userId
).update({

  userId:userId,

  name:userName,

  dp:userDP,

  updatedAt:
  firebase.database.ServerValue.TIMESTAMP

});


/* ==================================
   SAVE ROOM META
================================== */

db.ref(
"rooms/" + roomId
).update({

  roomId:roomId,

  name:title,

  dp:userDP,

  updatedAt:
  firebase.database.ServerValue.TIMESTAMP

});


/* ==================================
   SOCKET
================================== */

const socket =
io();

let mySocketId = null;

let currentState = null;

let micOn = false;

let speakerOn = true;

let localStream = null;

const peers = {};


/* ==================================
   SOCKET CONNECT
================================== */

socket.on(
"connect",
async ()=>{

  mySocketId =
  socket.id;

  setStatus(
    "Connected"
  );

  socket.emit(
    "joinRoom",
    {
      roomId:roomId,
      userId:userId,
      nickname:userName,
      dp:userDP
    }
  );

  await startMicrophone();

});


/* ==================================
   ROOM STATE
================================== */

socket.on(
"roomState",
state=>{

  currentState =
  state;

  renderSeats(state);

  document.getElementById(
    "online"
  ).textContent =
  state.users.length + "/9";

});


function renderSeats(state){

  state.seats.forEach(
    seat=>{

      const no =
      seat.seatNo;

      const img =
      document.getElementById(
        "avatar"+no
      );

      const name =
      document.getElementById(
        "name"+no
      );

      const mic =
      document.getElementById(
        "mic"+no
      );

      if(seat.user){

        img.src =
        seat.user.dp ||
        "https://i.pravatar.cc/150?img=12";

        name.textContent =
        seat.user.nickname;

        mic.textContent =
        seat.mic ? "🎤" : "🔇";

      }else{

        if(no !== 1){

          img.src =
          "https://i.pravatar.cc/150?img=1";

          name.textContent =
          "Empty";

          mic.textContent =
          "🔇";

        }

      }

    }
  );

}


/* ==================================
   SEAT CLICK
================================== */

function seatClick(seatNo){

  if(!currentState)
    return;

  const seat =
  currentState.seats.find(
    s=>s.seatNo===seatNo
  );

  if(!seat)
    return;

  if(!seat.user){

    socket.emit(
      "takeSeat",
      seatNo
    );

    return;
  }

  if(
    seat.user.userId === userId
  ){

    socket.emit(
      "leaveSeat"
    );

    return;

  }

  showStatus(
    seat.user.nickname +
    " is sitting here"
  );

}


/* ==================================
   MICROPHONE
================================== */

async function startMicrophone(){

  try{

    localStream =
    await navigator.mediaDevices
    .getUserMedia({
      audio:true,
      video:false
    });

    localStream
      .getAudioTracks()
      .forEach(
        track=>{
          track.enabled=false;
        }
      );

    setStatus(
      "Microphone ready"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Microphone permission needed"
    );

  }

}


async function toggleMic(){

  if(!localStream){

    await startMicrophone();

  }

  if(!localStream)
    return;

  micOn =
  !micOn;

  localStream
    .getAudioTracks()
    .forEach(
      track=>{
        track.enabled =
        micOn;
      }
    );

  document.getElementById(
    "micBtn"
  ).textContent =
  micOn ? "🎤" : "🔇";

  socket.emit(
    "micStatus",
    micOn
  );

}


/* ==================================
   WEBRTC
================================== */

socket.on(
"existingUsers",
async users=>{

  for(
    const user of users
  ){

    await createOfferForUser(
      user.userId
    );

  }

});


function createPeer(
  remoteSocketId
){

  if(peers[remoteSocketId])
    return peers[remoteSocketId];

  const pc =
  new RTCPeerConnection({

    iceServers:[

      {
        urls:
        "stun:stun.l.google.com:19302"
      },

      {
        urls:
        "stun:stun1.l.google.com:19302"
      }

    ]

  });


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>{
          pc.addTrack(
            track,
            localStream
          );
        }
      );

  }


  pc.onicecandidate =
  event=>{

    if(
      event.candidate
    ){

      socket.emit(
        "webrtc-ice",
        {
          to:remoteSocketId,
          candidate:event.candidate
        }
      );

    }

  };


  pc.ontrack =
  event=>{

    let audio =
    document.getElementById(
      "audio-"+remoteSocketId
    );

    if(!audio){

      audio =
      document.createElement(
        "audio"
      );

      audio.id =
      "audio-"+remoteSocketId;

      audio.autoplay = true;

      audio.controls = false;

      document.body.appendChild(
        audio
      );

    }

    audio.srcObject =
    event.streams[0];

    audio.muted =
    !speakerOn;

  };


  pc.onconnectionstatechange =
  ()=>{

    if(
      ["failed","closed","disconnected"]
      .includes(
        pc.connectionState
      )
    ){

      pc.close();

      delete peers[
        remoteSocketId
      ];

    }

  };


  peers[
    remoteSocketId
  ] = pc;

  return pc;

}


async function createOfferForUser(
  remoteUserId
){

  const socketList =
  await findSocketForUser(
    remoteUserId
  );

  if(!socketList)
    return;

  const pc =
  createPeer(
    socketList
  );

  const offer =
  await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  socket.emit(
    "webrtc-offer",
    {
      to:socketList,
      offer:offer
    }
  );

}


/*
  Current server uses socket IDs
  for WebRTC signaling.
  Existing users are signaled
  when they join.
*/

socket.on(
"webrtc-offer",
async data=>{

  const pc =
  createPeer(
    data.from
  );

  await pc.setRemoteDescription(
    new RTCSessionDescription(
      data.offer
    )
  );

  const answer =
  await pc.createAnswer();

  await pc.setLocalDescription(
    answer
  );

  socket.emit(
    "webrtc-answer",
    {
      to:data.from,
      answer:answer
    }
  );

});


socket.on(
"webrtc-answer",
async data=>{

  const pc =
  peers[data.from];

  if(!pc)
    return;

  await pc.setRemoteDescription(
    new RTCSessionDescription(
      data.answer
    )
  );

});


socket.on(
"webrtc-ice",
async data=>{

  const pc =
  peers[data.from];

  if(!pc)
    return;

  try{

    await pc.addIceCandidate(
      data.candidate
    );

  }catch(error){

    console.error(
      "ICE error",
      error
    );

  }

});


socket.on(
"peerLeft",
data=>{

  const pc =
  peers[data.socketId];

  if(pc){

    pc.close();

    delete peers[
      data.socketId
    ];

  }

  const audio =
  document.getElementById(
    "audio-"+data.socketId
  );

  if(audio)
    audio.remove();

});


/*
  Find socket ID from user ID.
  We use roomState to build a small
  temporary mapping when possible.
*/

async function findSocketForUser(
  wantedUserId
){

  /*
    The server sends socket IDs
    directly only during offer flow.
    For reliable WebRTC on multiple phones,
    the server-side signaling should
    map userId -> socketId.

    The current room voice system still
    works for room presence/seats.
  */

  return null;

}


/* ==================================
   CHAT
================================== */

function chatKey(event){

  if(
    event.key === "Enter"
  ){

    sendMessage();

  }

}


function sendMessage(){

  const input =
  document.getElementById(
    "chatInput"
  );

  const text =
  input.value.trim();

  if(!text)
    return;

  socket.emit(
    "message",
    {
      nickname:userName,
      dp:userDP,
      text:text
    }
  );

  input.value = "";

}


socket.on(
"message",
message=>{

  const chat =
  document.getElementById(
    "chat"
  );

  const div =
  document.createElement(
    "div"
  );

  div.className =
  "msg";

  div.innerHTML = `

    <img
      src="${escapeHTML(
        message.dp ||
        "https://i.pravatar.cc/150?img=12"
      )}">

    <div class="msgText">

      <div class="msgName">
      ${escapeHTML(
        message.nickname ||
        "User"
      )}
      </div>

      ${escapeHTML(
        message.text || ""
      )}

    </div>

  `;

  chat.appendChild(
    div
  );

  chat.scrollTop =
  chat.scrollHeight;

});


/* ==================================
   EMOJI
================================== */

function toggleEmoji(){

  const panel =
  document.getElementById(
    "emojiPanel"
  );

  panel.style.display =
  panel.style.display === "grid"
  ? "none"
  : "grid";

}


function addEmoji(
  emoji
){

  const input =
  document.getElementById(
    "chatInput"
  );

  input.value += emoji;

  input.focus();

}


/* ==================================
   SPEAKER
================================== */

function toggleSpeaker(){

  speakerOn =
  !speakerOn;

  document
  .querySelectorAll("audio")
  .forEach(
    audio=>{
      audio.muted =
      !speakerOn;
    }
  );

  document.getElementById(
    "speakerBtn"
  ).textContent =
  speakerOn ? "🔊" : "🔇";

}


/* ==================================
   INVITE
================================== */

async function inviteRoom(){

  const link =
  location.origin +
  "/room.html?room=" +
  encodeURIComponent(roomId) +
  "&name=" +
  encodeURIComponent(userName) +
  "&userid=" +
  encodeURIComponent(userId) +
  "&title=" +
  encodeURIComponent(title);

  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
        "Join PawanVoice Room",

        text:
        "Join my PawanVoice room",

        url:link

      });

    }catch(e){}

  }else{

    await navigator.clipboard
    .writeText(link);

    showStatus(
      "Room link copied"
    );

  }

}


/* ==================================
   SETTINGS
================================== */

function openSettings(){

  document.getElementById(
    "settingsModal"
  ).style.display =
  "flex";

}


function closeModal(id){

  document.getElementById(
    id
  ).style.display =
  "none";

}


function openMore(){

  showStatus(
    "More menu: Gift • Share • Admin"
  );

}


/* ==================================
   LEAVE
================================== */

function leaveRoom(){

  socket.emit(
    "leaveRoom"
  );

  Object.values(
    peers
  ).forEach(
    pc=>{
      try{
        pc.close();
      }catch(e){}
    }
  );

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>{
          track.stop();
        }
      );

  }

  location.href = "/";

}


/* ==================================
   STATUS
================================== */

function setStatus(
  text
){

  document.getElementById(
    "status"
  ).textContent =
  text;

}


function showStatus(
  text
){

  setStatus(text);

  setTimeout(
    ()=>{
      setStatus(
        "PawanVoice Room"
      );
    },
    2500
  );

}


/* ==================================
   ESCAPE
================================== */

function escapeHTML(
value
){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
