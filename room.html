<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PawanVoice Room</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#090611;
  color:#fff;
}
body{
  overflow-x:hidden;
}
button,input{
  font:inherit;
}
button{
  border:0;
  cursor:pointer;
}
.hidden{
  display:none!important;
}

#app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(circle at 50% -10%,#52206d 0,#1b1028 34%,#090611 75%);
  position:relative;
  overflow:hidden;
}

/* HEADER */
.room-header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:9px;
  min-height:62px;
  padding:8px 10px;
  background:rgba(14,7,23,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.back-btn,
.header-action{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:50%;
  color:#fff;
  background:rgba(255,255,255,.09);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}
.room-head-info{
  min-width:0;
  flex:1;
  display:flex;
  align-items:center;
  gap:9px;
}
.room-head-dp{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #d76cff;
}
.room-head-text{
  min-width:0;
}
.room-head-name{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.room-head-id{
  margin-top:3px;
  color:#b9a9c4;
  font-size:11px;
}
.header-actions{
  display:flex;
  gap:6px;
}

/* CONTENT */
.content{
  padding-bottom:96px;
}
.room-banner{
  margin:10px;
  padding:11px 13px;
  border-radius:17px;
  background:linear-gradient(135deg,rgba(132,45,177,.35),rgba(255,68,158,.14));
  border:1px solid rgba(255,255,255,.08);
}
.room-banner-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.live-pill{
  padding:5px 9px;
  border-radius:20px;
  background:rgba(255,69,119,.17);
  color:#ff8caf;
  font-size:11px;
  font-weight:700;
}
.room-stats{
  display:flex;
  gap:15px;
  color:#cdbed5;
  font-size:12px;
}
.room-stats b{
  color:#fff;
}
.room-category{
  margin-top:8px;
  font-size:12px;
  color:#d8c9df;
}

/* SEATS */
.seats-area{
  padding:7px 10px 0;
}
.seats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  align-items:start;
}
.seat.host{
  grid-column:1 / 5;
  margin-bottom:5px;
}
.seat{
  min-width:0;
  min-height:112px;
  border-radius:18px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.07);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:7px 3px;
  transition:.18s;
}
.seat:active{
  transform:scale(.96);
}
.seat.host .avatar-wrap{
  width:72px;
  height:72px;
}
.avatar-wrap{
  width:55px;
  height:55px;
  border-radius:50%;
  padding:2px;
  background:linear-gradient(135deg,#ff4fa3,#8b5cff,#39d5ff);
  position:relative;
}
.seat-empty .avatar-wrap{
  background:rgba(255,255,255,.08);
  border:1px dashed rgba(255,255,255,.2);
}
.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#211529;
}
.seat-plus{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  color:#bca8c7;
}
.mic-badge{
  position:absolute;
  right:-1px;
  bottom:-1px;
  min-width:20px;
  height:20px;
  padding:0 4px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  background:#28182e;
  border:1px solid rgba(255,255,255,.15);
}
.mic-badge.on{
  background:#24b875;
}
.mic-badge.off{
  background:#9a2948;
}
.seat-name{
  max-width:100%;
  margin-top:7px;
  padding:0 3px;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:11px;
  color:#e9deed;
}
.seat-number{
  position:absolute;
  left:7px;
  top:6px;
  color:#87778f;
  font-size:10px;
}

/* FEATURES */
.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:13px 10px 4px;
}
.feature-btn{
  min-height:69px;
  border-radius:16px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.07);
  color:#fff;
  padding:8px 4px;
}
.feature-icon{
  font-size:24px;
}
.feature-name{
  margin-top:5px;
  font-size:10px;
  color:#d7cadb;
}

/* EXP */
.exp-card{
  margin:10px;
  padding:13px;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(255,191,52,.11),rgba(255,81,151,.09));
  border:1px solid rgba(255,255,255,.07);
}
.exp-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.exp-title{
  font-weight:800;
  font-size:13px;
}
.exp-value{
  color:#ffd66c;
  font-size:11px;
}
.exp-bar{
  margin-top:10px;
  height:8px;
  border-radius:8px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
}
.exp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffb52e,#ff5e9d);
  border-radius:8px;
  transition:.3s;
}
.top-users{
  display:flex;
  gap:12px;
  margin-top:12px;
}
.top-user{
  flex:1;
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}
.top-user img{
  width:31px;
  height:31px;
  border-radius:50%;
  object-fit:cover;
}
.top-user span{
  min-width:0;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#d6cadb;
}

/* CHAT */
.chat-box{
  margin:10px;
  border-radius:18px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.06);
  overflow:hidden;
}
.chat-title{
  padding:10px 12px;
  color:#bfaec7;
  font-size:11px;
}
.messages{
  max-height:235px;
  min-height:80px;
  overflow-y:auto;
  padding:3px 10px 10px;
}
.message{
  padding:5px 0;
  font-size:12px;
  line-height:1.35;
}
.message .msg-name{
  color:#df78ff;
  font-weight:700;
  margin-right:5px;
}
.message.system{
  color:#a99bae;
}
.chat-compose{
  display:flex;
  gap:6px;
  padding:8px;
  border-top:1px solid rgba(255,255,255,.06);
}
.chat-input{
  flex:1;
  min-width:0;
  height:40px;
  border:0;
  outline:0;
  border-radius:20px;
  background:#1a1121;
  color:#fff;
  padding:0 14px;
}
.chat-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#28182f;
  color:#fff;
}
.send-btn{
  background:linear-gradient(135deg,#ff4caa,#7c55ff);
}

/* BOTTOM */
.bottom-bar{
  position:fixed;
  z-index:30;
  bottom:0;
  width:min(520px,100%);
  padding:9px 9px calc(9px + env(safe-area-inset-bottom));
  background:rgba(10,6,16,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid rgba(255,255,255,.08);
}
.bottom-controls{
  display:flex;
  gap:7px;
}
.bottom-control{
  flex:1;
  min-width:0;
  height:45px;
  border-radius:15px;
  background:#1b1222;
  color:#fff;
  font-size:18px;
}
.bottom-control span{
  display:block;
  font-size:8px;
  color:#a99caf;
  margin-top:2px;
}
.bottom-control.active{
  background:linear-gradient(135deg,#a43cf0,#ff4e9d);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.72);
}
.modal.show{
  display:flex;
}
.modal-card{
  width:min(520px,100%);
  max-height:88vh;
  overflow:auto;
  background:#15101b;
  border-radius:24px 24px 0 0;
  border:1px solid rgba(255,255,255,.08);
  padding:16px;
  animation:up .2s ease;
}
@keyframes up{
  from{transform:translateY(30px);opacity:0}
  to{transform:translateY(0);opacity:1}
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}
.modal-title{
  font-weight:800;
  font-size:16px;
}
.close-btn{
  width:32px;
  height:32px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  color:#fff;
}
.action-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}
.action-btn{
  min-height:45px;
  border-radius:13px;
  background:#24182b;
  color:#fff;
  border:1px solid rgba(255,255,255,.06);
}
.action-btn.primary{
  background:linear-gradient(135deg,#a03ff1,#ff4d9e);
}
.action-btn.danger{
  background:#572039;
}
.field{
  margin:9px 0;
}
.field label{
  display:block;
  margin-bottom:6px;
  font-size:11px;
  color:#b7a9be;
}
.field input,
.field select{
  width:100%;
  height:43px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  outline:0;
  background:#211627;
  color:#fff;
  padding:0 12px;
}

/* PROFILE */
.profile-top{
  display:flex;
  gap:12px;
  align-items:center;
  padding:5px 0 15px;
}
.profile-top img{
  width:67px;
  height:67px;
  border-radius:50%;
  object-fit:cover;
}
.profile-name{
  font-weight:800;
}
.profile-sub{
  color:#a99caf;
  font-size:11px;
  margin-top:4px;
}
.profile-balance{
  margin:8px 0 13px;
  padding:12px;
  border-radius:14px;
  background:#211626;
  display:flex;
  justify-content:space-around;
  font-size:12px;
}

/* GIFTS */
.gift-tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:9px;
}
.gift-tab{
  white-space:nowrap;
  padding:8px 12px;
  border-radius:18px;
  background:#24182b;
  color:#c8bacd;
  font-size:11px;
}
.gift-tab.active{
  background:linear-gradient(135deg,#a53ff2,#ff4b9e);
  color:#fff;
}
.gift-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.gift{
  min-height:103px;
  border-radius:14px;
  background:#201527;
  border:1px solid rgba(255,255,255,.06);
  color:#fff;
  padding:7px 3px;
}
.gift-emoji{
  font-size:28px;
}
.gift-name{
  font-size:9px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.gift-price{
  color:#ffd05d;
  font-size:9px;
  margin-top:4px;
}
.gift-size{
  color:#9f91a7;
  font-size:8px;
  margin-top:2px;
}

/* EMOJI */
.emoji-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
}
.emoji-btn{
  height:38px;
  border-radius:9px;
  background:#211627;
  font-size:21px;
}

/* USER */
.user-profile{
  text-align:center;
}
.user-profile img{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #a84cff;
}
.user-level{
  color:#bbaac3;
  font-size:11px;
  margin:6px 0 13px;
}
.user-id{
  color:#8f8196;
  font-size:10px;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(15px);
  z-index:200;
  padding:10px 14px;
  border-radius:20px;
  background:#fff;
  color:#171019;
  font-size:12px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADING */
.loading{
  position:fixed;
  inset:0;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#090611;
}
.loader{
  text-align:center;
}
.loader-logo{
  font-size:34px;
  font-weight:900;
  background:linear-gradient(90deg,#ff52a5,#9b5cff);
  -webkit-background-clip:text;
  color:transparent;
}
.loader-text{
  margin-top:10px;
  color:#9d8ca6;
  font-size:12px;
}

/* GIFT POP */
.gift-pop{
  position:fixed;
  left:50%;
  top:42%;
  z-index:180;
  transform:translate(-50%,-50%) scale(.5);
  opacity:0;
  pointer-events:none;
  text-align:center;
}
.gift-pop.show{
  animation:giftpop 1.2s ease forwards;
}
.gift-pop-emoji{
  font-size:78px;
}
.gift-pop-name{
  margin-top:5px;
  font-size:14px;
  font-weight:900;
}
@keyframes giftpop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  70%{opacity:1;transform:translate(-50%,-55%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-65%) scale(.9)}
}

@media(max-width:370px){
  .features{
    grid-template-columns:repeat(4,1fr);
  }
  .feature-name{
    font-size:8px;
  }
  .seat{
    min-height:103px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="loading" id="loading">
    <div class="loader">
      <div class="loader-logo">PawanVoice</div>
      <div class="loader-text">Connecting to room...</div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="room-header">
    <button class="back-btn" id="backBtn">‹</button>

    <div class="room-head-info">
      <img id="roomDp" class="room-head-dp"
           src="https://i.pravatar.cc/200?img=12"
           onerror="this.src='https://i.pravatar.cc/200?img=12'">

      <div class="room-head-text">
        <div id="roomName" class="room-head-name">PawanVoice Room</div>
        <div id="roomIdText" class="room-head-id">Room: PV100</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="header-action" id="inviteBtn">↗</button>
      <button class="header-action" id="infoBtn">ⓘ</button>
      <button class="header-action" id="settingsBtn">⚙</button>
    </div>
  </header>

  <main class="content">

    <!-- ROOM STATUS -->
    <section class="room-banner">
      <div class="room-banner-row">
        <div class="live-pill">● LIVE</div>
        <div class="room-stats">
          <span>Viewers <b id="viewerCount">0</b></span>
          <span>Seats <b id="seatCount">0/9</b></span>
        </div>
      </div>
      <div id="roomCategory" class="room-category">General</div>
    </section>

    <!-- SEATS -->
    <section class="seats-area">
      <div class="seats-grid" id="seatsGrid"></div>
    </section>

    <!-- FEATURES -->
    <section class="features">

      <button class="feature-btn" data-feature="support">
        <div class="feature-icon">💜</div>
        <div class="feature-name">Room Support</div>
      </button>

      <button class="feature-btn" data-feature="wheel">
        <div class="feature-icon">🎡</div>
        <div class="feature-name">Lucky Wheel</div>
      </button>

      <button class="feature-btn" data-feature="bounty">
        <div class="feature-icon">🎯</div>
        <div class="feature-name">Bounty Hunter</div>
      </button>

      <button class="feature-btn" data-feature="reward">
        <div class="feature-icon">🎁</div>
        <div class="feature-name">Room Reward</div>
      </button>

      <button class="feature-btn" data-feature="daily">
        <div class="feature-icon">📅</div>
        <div class="feature-name">Daily Reward</div>
      </button>

      <button class="feature-btn" data-feature="games">
        <div class="feature-icon">🎮</div>
        <div class="feature-name">Games</div>
      </button>

      <button class="feature-btn" data-feature="exclusive">
        <div class="feature-icon">👑</div>
        <div class="feature-name">Exclusive</div>
      </button>

      <button class="feature-btn" data-feature="gifts">
        <div class="feature-icon">🎀</div>
        <div class="feature-name">Gifts</div>
      </button>

      <button class="feature-btn" data-feature="invite">
        <div class="feature-icon">📨</div>
        <div class="feature-name">Invite</div>
      </button>

      <button class="feature-btn" data-feature="roominfo">
        <div class="feature-icon">ℹ️</div>
        <div class="feature-name">Room Info</div>
      </button>

    </section>

    <!-- ROOM EXP -->
    <section class="exp-card">
      <div class="exp-head">
        <div class="exp-title">🚀 Room EXP</div>
        <div id="roomExpValue" class="exp-value">0 EXP</div>
      </div>

      <div class="exp-bar">
        <div id="roomExpFill" class="exp-fill"></div>
      </div>

      <div class="top-users" id="topUsers"></div>
    </section>

    <!-- CHAT -->
    <section class="chat-box">
      <div class="chat-title">Room Chat</div>
      <div class="messages" id="messages"></div>

      <div class="chat-compose">
        <input
          id="chatInput"
          class="chat-input"
          maxlength="300"
          placeholder="Say something..."
          autocomplete="off"
        >
        <button class="chat-btn" id="emojiBtn">😊</button>
        <button class="chat-btn send-btn" id="sendBtn">➤</button>
      </div>
    </section>

  </main>

  <!-- BOTTOM CONTROLS -->
  <div class="bottom-bar">
    <div class="bottom-controls">

      <button class="bottom-control" id="speakerBtn">
        🔊
        <span>Speaker</span>
      </button>

      <button class="bottom-control" id="micBtn">
        🎙️
        <span>Mic</span>
      </button>

      <button class="bottom-control" id="giftBtn">
        🎁
        <span>Gift</span>
      </button>

      <button class="bottom-control" id="moreBtn">
        ⋮
        <span>More</span>
      </button>

    </div>
  </div>

</div>

<!-- USER MODAL -->
<div class="modal" id="userModal">
  <div class="modal-card">

    <div class="modal-head">
      <div class="modal-title">User Profile</div>
      <button class="close-btn" data-close="userModal">×</button>
    </div>

    <div class="user-profile">
      <img id="profileModalDp" src="https://i.pravatar.cc/200?img=12">
      <div id="profileModalName" class="profile-name">User</div>
      <div id="profileModalLevel" class="user-level">Level 1</div>
      <div id="profileModalId" class="user-id">ID: 0</div>
    </div>

    <div style="height:12px"></div>

    <div class="action-grid">
      <button class="action-btn primary" id="followBtn">❤️ Follow</button>
      <button class="action-btn" id="cpBtn">💞 CP Request</button>
      <button class="action-btn" id="profileGiftBtn">🎁 Send Gift</button>
      <button class="action-btn danger hidden" id="kickBtn">🚫 Kick</button>
      <button class="action-btn danger hidden" id="muteBtn">🔇 Mute</button>
    </div>

  </div>
</div>

<!-- GIFT MODAL -->
<div class="modal" id="giftModal">
  <div class="modal-card">

    <div class="modal-head">
      <div class="modal-title">🎁 200 Gifts</div>
      <button class="close-btn" data-close="giftModal">×</button>
    </div>

    <div class="profile-balance">
      <span>🪙 Coins <b id="giftCoins">0</b></span>
      <span>💎 Diamonds <b id="giftDiamonds">0</b></span>
    </div>

    <div class="gift-tabs" id="giftTabs"></div>

/* =========================================================
   HELPERS
========================================================= */

function safeNumber(value, fallback = 0){
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function safeObject(value, fallback = {}){
  return value && typeof value === "object"
    ? value
    : fallback;
}

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function imgSafe(url){
  return url || PV_DEFAULT_DP;
}

function money(n){
  return Number(n || 0).toLocaleString("en-IN");
}

function getParam(name){
  return new URLSearchParams(location.search).get(name);
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

function showModal(id){
  document.getElementById(id)?.classList.add("show");
}

function hideModal(id){
  document.getElementById(id)?.classList.remove("show");
}

document.querySelectorAll("[data-close]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    hideModal(btn.dataset.close);

/* =========================================================
   FIREBASE REST
========================================================= */

async function firebaseGet(path){

  try{
    const res = await fetch(
      PV_FIREBASE_DB + "/" + path + ".json"
    );

    if(!res.ok) return null;

    return await res.json();

  }catch(e){
    console.warn("Firebase GET failed",e);
    return null;
  }
}

async function firebasePatch(path,data){

  try{
    const res = await fetch(
      PV_FIREBASE_DB + "/" + path + ".json",
      {
        method:"PATCH",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
      }
    );

    return res.ok;

  }catch(e){
    console.warn("Firebase PATCH failed",e);
    return false;
  }
}

async function firebasePut(path,data){

  try{
    const res = await fetch(
      PV_FIREBASE_DB + "/" + path + ".json",
      {
        method:"PUT",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
      }
    );

    return res.ok;

  }catch(e){
    console.warn("Firebase PUT failed",e);
    return false;
  }
}

/* =========================================================
   ROOM
========================================================= */

const ROOM_ID =
  getParam("room") ||
  getParam("roomId") ||
  "PV100";

let roomState = {
  id:ROOM_ID,
  name:"PawanVoice Room",
  roomName:"PawanVoice Room",
  dp:PV_DEFAULT_DP,
  owner:"",
  ownerId:"",
  ownerDp:PV_DEFAULT_DP,
  category:"General",
  users:0,
  seats:Array(9).fill(null),
  members:{},
  gifts:[],
  roomExp:0,
  topUsers:[]
};

let socket = null;
let socketConnected = false;
let joinedRoom = false;

let localStream = null;
let micEnabled = false;
let speakerEnabled = true;

const peers = new Map();
const pendingCandidates = new Map();


/* =========================================================
   ROOM HEADER
========================================================= */

function renderRoomHeader(){

  const name =
    roomState.roomName ||
    roomState.name ||
    "PawanVoice Room";

  document.getElementById("roomName").textContent = name;

  document.getElementById("roomDp").src =
    imgSafe(roomState.dp);

    "Room: " + ROOM_ID;

  document.getElementById("roomCategory").textContent =
    roomState.category || "General";
}


/* =========================================================
   ROOM COUNTS
========================================================= */

function getMembers(){

  if(roomState.members &&
     typeof roomState.members === "object"){
    return Object.values(roomState.members);
  }

  if(roomState.users &&
     typeof roomState.users === "object"){
    return Object.values(roomState.users);
  }

  return [];
}

function getSeats(){

  let seats =
    Array.isArray(roomState.seats)
      ? roomState.seats.slice(0,9)
      : Array(9).fill(null);

  while(seats.length < 9){
    seats.push(null);
  }

  return seats;
}

function renderCounts(){

  const members = getMembers();
  const seats = getSeats();

  const occupied =
    seats.filter(Boolean).length;

  const viewerCount =
    typeof roomState.users === "number"
      ? roomState.users
      : members.length;

  document.getElementById("viewerCount").textContent =
    viewerCount;

  document.getElementById("seatCount").textContent =
    occupied + "/9";
}


/* =========================================================
   SEATS
========================================================= */

function findMember(id){

  const members = getMembers();

  return members.find(u=>
    String(
      u.id ??
      u.userId
    ) === String(id)
  ) || null;
}

function renderSeats(){

  const grid =
    document.getElementById("seatsGrid");

  grid.innerHTML = "";

  const seats = getSeats();

  seats.forEach((seat,index)=>{

    const el =
      document.createElement("div");

    el.className =
      "seat " +
      (index === 0 ? "host " : "") +
      (!seat ? "seat-empty" : "");

    el.dataset.seat = index;

    const user =
      seat
      ? (
          seat.user ||
          seat
        )
      : null;

    const avatarWrap =
      document.createElement("div");

    avatarWrap.className =
      "avatar-wrap";

    if(user){

      const img =
        document.createElement("img");

      img.className = "avatar";

      img.src =
        imgSafe(user.dp);

      img.onerror = function(){
        this.src = PV_DEFAULT_DP;
      };

      avatarWrap.appendChild(img);

      const mic =
        document.createElement("div");

      mic.className =
        "mic-badge " +
        (user.micEnabled === false ? "off" : "on");

      mic.textContent =
        user.micEnabled === false
          ? "🔇"
          : "🎙";

      avatarWrap.appendChild(mic);

    }else{

      const plus =
        document.createElement("div");

      plus.className =
        "seat-plus";

      plus.textContent = "+";

      avatarWrap.appendChild(plus);
    }

    const number =
      document.createElement("div");

    number.className =
      "seat-number";

    number.textContent =
      index === 0
        ? "HOST"
        : String(index + 1);

    el.appendChild(number);
    el.appendChild(avatarWrap);

    const name =
      document.createElement("div");

    name.className =
      "seat-name";

    name.textContent =
      user
        ? user.name || "User"
        : "Empty";

    el.appendChild(name);

    el.addEventListener("click",()=>{

      if(user){
        openUserProfile(
          user.id ||
          user.userId
        );
      }else{
        takeSeat(index);
      }

    });

    grid.appendChild(el);
  });

  renderCounts();
}


/* =========================================================
   APPLY ROOM STATE
========================================================= */

function applyRoomState(data){

  if(!data) return;

  roomState = {
    ...roomState,
    ...data
  };

  if(!Array.isArray(roomState.seats)){
    roomState.seats =
      Array(9).fill(null);
  }

  if(!roomState.members){
    roomState.members = {};
  }

  renderRoomHeader();
  renderSeats();
  renderRoomExp();
  renderInfo();

  /*
    Owner automatically uses host seat.
  */
  const ownerId =
    roomState.ownerId ||
    roomState.owner;

  if(
    ownerId &&
    String(ownerId) === String(currentUser.userId) &&
    !roomState.seats[0]
  ){
    setTimeout(()=>{
      takeSeat(0,true);
    },500);
  }
}


/* =========================================================
   SOCKET CONNECTION
========================================================= */

function connectSocket(){

  try{

    socket =
      io(socketOrigin,{
        transports:["websocket","polling"],
        reconnection:true,
        reconnectionAttempts:Infinity,
        reconnectionDelay:1000,
        timeout:10000
      });

    socket.on("connect",()=>{

      socketConnected = true;

      addSystemMessage(
        "Connected to PawanVoice server."
      );

      socket.emit(
        "register-user",
        {
          userId:currentUser.userId,
          id:currentUser.userId,
          name:currentUser.name,
          dp:currentUser.dp,
          gender:currentUser.gender,
          level:currentUser.level,
          exp:currentUser.exp,
          coins:currentUser.coins,
          diamonds:currentUser.diamonds
        }
      );

      setTimeout(()=>{
        joinRoom();
      },200);

    });

    socket.on("disconnect",()=>{

      socketConnected = false;

      addSystemMessage(
        "Connection lost. Reconnecting..."
      );
    });

    socket.on("connect_error",err=>{
      console.warn("Socket error",err);
    });

    socket.on("registered-user",data=>{

      if(data?.user){
        mergeUser(data.user);
      }

      joinRoom();
    });

    socket.on("user-registered",data=>{

      if(data?.user){
        mergeUser(data.user);
      }

      joinRoom();
    });


    /* ROOM EVENTS */

    socket.on("room-joined",data=>{

      joinedRoom = true;

      if(data?.room){
        applyRoomState(data.room);
      }else if(data){
        applyRoomState(data);
      }

    });

    socket.on("room-state",data=>{
      applyRoomState(data);
      joinedRoom = true;
    });

    socket.on("roomState",data=>{
      applyRoomState(data);
      joinedRoom = true;
    });

    socket.on("room-updated",data=>{
      applyRoomState(data);
    });

    socket.on("user-entry",data=>{

      if(data?.user){
        addSystemMessage(
          (data.user.name || "Someone") +
          " joined the room."
        );
      }
    });

    socket.on("user-joined",data=>{

      if(data?.user){
        addSystemMessage(
          (data.user.name || "Someone") +
          " joined the room."
        );
      }

    });

    socket.on("user-left",data=>{

      if(data?.user){
        addSystemMessage(
          (data.user.name || "Someone") +
          " left the room."
        );
      }
    });

    socket.on("seat-update",data=>{
      if(data?.room){
        applyRoomState(data.room);
      }else{
        refreshRoomFromFirebase();
      }
    });

    socket.on("seat-taken",data=>{
      toast(data?.message || "Seat already occupied.");
    });

    socket.on("seat-error",data=>{
      toast(data?.message || "Unable to take seat.");
    });

    socket.on("mic-status",data=>{

      if(data?.room){
        applyRoomState(data.room);
      }

    });

    socket.on("profile-updated",data=>{

      if(data?.user){
        updateMemberLocally(data.user);
      }

      if(
        String(data?.user?.id || "") ===
        String(currentUser.userId)
      ){
        mergeUser(data.user);
      }

    });


    /* CHAT */

    socket.on("chat",data=>{
      renderIncomingMessage(data);
    });

    socket.on("room-chat",data=>{
      renderIncomingMessage(data);
    });

    socket.on("emoji",data=>{

      if(data?.emoji){
        renderIncomingMessage({
          name:data.name || "User",
          message:data.emoji
        });
      }

    });


    /* GIFTS */

    socket.on("gift",data=>{
      handleGiftReceived(data);
    });

    socket.on("gift-received",data=>{
      handleGiftReceived(data);
    });

    socket.on("gift-sent",data=>{

      if(data?.remainingCoins !== undefined){
        currentUser.coins =
          safeNumber(
            data.remainingCoins,
            currentUser.coins
          );

        saveLocalUser();
        updateBalanceUI();
      }

      if(data?.room){
        applyRoomState(data.room);
      }

    });

    socket.on("gift-error",data=>{
      toast(
        data?.message ||
        "Gift could not be sent."
      );
    });


    /* ADMIN */

    socket.on("force-mute",data=>{

      if(
        String(data?.userId) ===
        String(currentUser.userId)
      ){
        micEnabled = false;
        stopMicrophone();
        updateMicButton();

        toast("You have been muted by room owner.");
      }

    });

    socket.on("user-kicked",data=>{

      if(
        String(data?.userId) ===
        String(currentUser.userId)
      ){
        toast("You were removed from the room.");

        setTimeout(goHome,1000);
      }

    });

    socket.on("kicked",()=>{
      toast("You were removed from the room.");
      setTimeout(goHome,1000);
    });


    /* WALLET */

    socket.on("wallet-updated",data=>{

      if(data?.user){
        mergeUser(data.user);
      }

      if(data?.coins !== undefined){
        currentUser.coins =
          safeNumber(
            data.coins,
            currentUser.coins
          );
      }

      if(data?.diamonds !== undefined){
        currentUser.diamonds =
          safeNumber(
            data.diamonds,
            currentUser.diamonds
          );
      }

      saveLocalUser();
      updateBalanceUI();
    });


    /* WEBRTC */

    socket.on("offer",handleOffer);
    socket.on("rtc-offer",handleOffer);

    socket.on("answer",handleAnswer);
    socket.on("rtc-answer",handleAnswer);

    socket.on("ice-candidate",handleIceCandidate);
    socket.on("rtc-ice-candidate",handleIceCandidate);

  }catch(e){

    console.error(e);

    toast("Room server connection failed.");
  }
}


/* =========================================================
   REGISTER / JOIN

function joinRoom(){

  if(!socketConnected || !socket) return;

  socket.emit(
    "join-room",

      roomId:ROOM_ID,
      id:ROOM_ID,
      userId:currentUser.userId,
      name:currentUser.name,
      dp:currentUser.dp,
      gender:currentUser.gender,
      level:currentUser.level,
      exp:currentUser.exp,
      coins:currentUser.coins,
      diamonds:currentUser.diamonds
    }
  );

}


/* =========================================================
   FIREBASE ROOM FALLBACK
========================================================= */

async function refreshRoomFromFirebase(){

  const remote =
    await firebaseGet(
      "rooms/" + encodeURIComponent(ROOM_ID)
    );

  if(!remote) return;

  /*
    Firebase-created rooms may have users but not seats.
    Convert users into seats without deleting server seats.
  */

  let seats =
    Array.isArray(remote.seats)
      ? remote.seats.slice(0,9)
      : Array(9).fill(null);

  while(seats.length < 9){
    seats.push(null);
  }

  const users =
    safeObject(
      remote.users ||
      remote.members,
      {}
    );

  Object.values(users).forEach(user=>{

    if(
      seats.some(s=>
        s &&
        String(
          s.id ||
          s.userId ||
          s.user?.id
        ) === String(user.id || user.userId)
      )
    ){
      return;
    }

    const requestedSeat =
      safeNumber(user.seat,-1);

    if(
      requestedSeat >= 0 &&
      requestedSeat < 9 &&
      !seats[requestedSeat]
    ){
      seats[requestedSeat] = user;
    }

  });

  applyRoomState({
    ...remote,
    id:remote.id || ROOM_ID,
    roomName:
      remote.roomName ||
      remote.name ||
      "PawanVoice Room",
    name:
      remote.name ||
      remote.roomName ||
      "PawanVoice Room",
    seats,
    members:
      remote.members ||
      users
  });
}

      data.id ||
      currentUser.userId
    ),

      data.coins,
      currentUser.coins
    ),
    diamonds:safeNumber(
      data.diamonds ?? data.diamond,
      currentUser.diamonds
    )
  };

  currentUser.diamond =
    currentUser.diamonds;

  saveLocalUser();
  updateBalanceUI();
}

function updateMemberLocally(user){

  if(!user) return;

  const id =
    String(user.id || user.userId);

  if(roomState.members?.[id]){
    roomState.members[id] = {
      ...roomState.members[id],
      ...user
    };
  }

  const seats =
    getSeats();

  seats.forEach((seat,index)=>{

    if(!seat) return;

    const seatUser =
      seat.user || seat;

    if(
      String(
        seatUser.id ||
        seatUser.userId
      ) === id
    ){

      const updated =
        {
          ...seatUser,
          ...user
        };

      roomState.seats[index] =
        seat.user
          ? {...seat,user:updated}
          : updated;
    }
  });

  renderSeats();
}

function takeSeat(seatIndex,automatic=false){

  if(!socketConnected || !socket){

    toast("Connecting to room server...");
    return;
  }

  const index =
    safeNumber(seatIndex,-1);

  if(index < 0 || index > 8){
    return;
  }

  const seats =
    getSeats();

  const occupant =
    seats[index];

  if(occupant){

    const u =
      occupant.user ||
      occupant;

    if(
      String(
        u.id ||
        u.userId
      ) !== String(currentUser.userId)
    ){
      toast("This seat is already occupied.");
      return;
    }
  }

  socket.emit(
    "take-seat",
    {
      roomId:ROOM_ID,
      seat:index,
      seatIndex:index,
      userId:currentUser.userId,
      id:currentUser.userId
    }
  );

  /*
    User requested voice system to wait 500ms
    after seat/microphone action.
  */
  if(!automatic){
    setTimeout(()=>{
      enableVoice();
    },500);
  }else{
    setTimeout(()=>{
      enableVoice();
    },500);
  }
}

function leaveSeat(){

  if(!socketConnected || !socket) return;

  socket.emit(
    "leave-seat",
    {
      roomId:ROOM_ID,
      userId:currentUser.userId,
      id:currentUser.userId
    }
  );

  stopMicrophone();
}

const rtcConfig = {
  iceServers:[
    {
      urls:[
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302"
      ]
    }

};

async function enableVoice(){

  if(localStream){
    micEnabled = true;
    updateMicButton();
    return;
  }

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },
        video:false
      });

    localStream
      .getAudioTracks()
      .forEach(track=>{
        track.enabled = true;
      });

    micEnabled = true;

    updateMicButton();

    if(socket){

      socket.emit(
        "mic",
        {
          roomId:ROOM_ID,
          userId:currentUser.userId,
          enabled:true
        }
      );

    }

    toast("Voice system ready");

    connectPeers();

  }catch(e){

    console.error("Microphone error",e);

    micEnabled = false;
    updateMicButton();

    toast(
      "Microphone permission allow करें."
    );
  }
}

function stopMicrophone(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        try{
          track.stop();
        }catch(e){}
      });

    localStream = null;
  }

  micEnabled = false;
  updateMicButton();

  if(socketConnected){

    socket.emit(
      "mic",
      {
        roomId:ROOM_ID,
        userId:currentUser.userId,
        enabled:false
      }
    );
  }
}

function toggleMic(){

  if(!localStream){

  micEnabled =
    !micEnabled;

  localStream
    .getAudioTracks()
    .forEach(track=>{

    socket.emit(
      "mic",

/* =========================================================
   WEBRTC PEERS
========================================================= */

function getOtherUsers(){

  return getMembers().filter(user=>
    String(
      user.id ||
      user.userId
    ) !== String(currentUser.userId)
  );
}

function shouldOffer(otherId){

  return String(currentUser.userId)
    .localeCompare(
      String(otherId)
    ) < 0;
}

function createPeer(otherId){

  const id =
    String(otherId);

  if(peers.has(id)){
    return peers.get(id);
  }

  const pc =
    new RTCPeerConnection(rtcConfig);

  peers.set(id,pc);

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        pc.addTrack(
          track,
          localStream
        );
      });
  }

  pc.onicecandidate = event=>{

    if(event.candidate){

      socket?.emit(
        "ice-candidate",
        {
          roomId:ROOM_ID,
          fromUserId:currentUser.userId,
          toUserId:id,
          candidate:event.candidate
        }
      );
    }
  };

  pc.ontrack = event=>{

    let audio =
      document.getElementById(
        "audio-" + id
      );

    if(!audio){

      audio =
        document.createElement("audio");

      audio.id =
        "audio-" + id;

      audio.autoplay = true;
      audio.playsInline = true;

      document.body.appendChild(audio);
    }

    audio.srcObject =
      event.streams[0];

    audio.muted =
      !speakerEnabled;

    audio.play().catch(()=>{});
  };

  pc.onconnectionstatechange = ()=>{

    if(
      ["failed","closed","disconnected"]
        .includes(pc.connectionState)
    ){

      try{
        pc.close();
      }catch(e){}

      peers.delete(id);
    }
  };

  return pc;
}

async function connectPeers(){

  if(!localStream) return;

  const others =
    getOtherUsers();

  for(const user of others){

    const id =
      user.id ||
      user.userId;

    if(!id) continue;

    const pc =
      createPeer(id);

    if(shouldOffer(id)){

      try{

        const offer =
          await pc.createOffer();

        await pc.setLocalDescription(
          offer
        );

        socket?.emit(
          "offer",
          {
            roomId:ROOM_ID,
            fromUserId:currentUser.userId,
            toUserId:String(id),
            offer
          }
        );

      }catch(e){
        console.warn("Offer error",e);
      }
    }
  }
}

async function handleOffer(data){

  if(
    !data ||
    String(data.toUserId || data.targetUserId) !==
    String(currentUser.userId)
  ){
    return;
  }

  const fromId =
    String(
      data.fromUserId ||
      data.userId
    );

  if(!fromId) return;

  const pc =
    createPeer(fromId);

  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );

    const candidates =
      pendingCandidates.get(fromId) || [];

    for(const c of candidates){

      try{
        await pc.addIceCandidate(c);
      }catch(e){}
    }

    pendingCandidates.delete(fromId);

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    socket?.emit(
      "answer",
      {
        roomId:ROOM_ID,
        fromUserId:currentUser.userId,
        toUserId:fromId,
        answer
      }
    );

  }catch(e){
    console.warn("Handle offer error",e);
  }
}

async function handleAnswer(data){

  if(
    !data ||
    String(data.toUserId || data.targetUserId) !==
    String(currentUser.userId)
  ){
    return;
  }

  const fromId =
    String(
      data.fromUserId ||
      data.userId
    );

  const pc =
    peers.get(fromId);

  if(!pc) return;

  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

    const candidates =
      pendingCandidates.get(fromId) || [];

    for(const c of candidates){

      try{
        await pc.addIceCandidate(c);
      }catch(e){}
    }

    pendingCandidates.delete(fromId);

  }catch(e){
    console.warn("Answer error",e);
  }
}

async function handleIceCandidate(data){

  if(
    !data ||
    String(data.toUserId || data.targetUserId) !==
    String(currentUser.userId)
  ){
    return;
  }

  const fromId =
    String(
      data.fromUserId ||
      data.userId
    );

  const candidate =
    data.candidate;

  if(!fromId || !candidate) return;

  const pc =
    peers.get(fromId);

  if(!pc || !pc.remoteDescription){

    if(!pendingCandidates.has(fromId)){
      pendingCandidates.set(fromId,[]);
    }

    pendingCandidates
      .get(fromId)
      .push(candidate);

    return;
  }

  try{
    await pc.addIceCandidate(candidate);
  }catch(e){}
}

    selectedGiftUser =
      members.find(u=>
        String(
          u.id ||
          u.userId
        ) !==
        String(currentUser.userId)
      ) || null;
  }

  if(!selectedGiftUser){

    toast("Room में कोई दूसरा user नहीं है.");
    return;
  }

  updateBalanceUI();

  selectedGiftCategory =
    "Love";

  renderGiftTabs();
  renderGiftGrid();

  showModal("giftModal");
}

function sendGift(gift){

  if(!gift) return;

  const target =
    selectedGiftUser;

  if(!target){

    toast("Gift receiver select करें.");
    return;
  }

  const receiverId =
    String(
      target.id ||
      target.userId
    );

  if(
    receiverId ===
    String(currentUser.userId)
  ){

    toast("आप खुद को gift नहीं भेज सकते.");
    return;
  }

  const price =
    safeNumber(gift.price,0);

  /*
    Important:
    Client only requests gift.
    Actual balance deduction is done
    by server-side validation.
  */

  if(currentUser.coins < price){

    toast(
      "Coins कम हैं. Need " +
      money(price) +
      " coins."
    );

    return;
  }

  if(!socketConnected){

    toast("Gift server connected नहीं है.");
    return;
  }

  socket.emit(
    "gift",
    {
      roomId:ROOM_ID,

      userId:currentUser.userId,
      senderId:currentUser.userId,

      targetUserId:receiverId,
      receiverUserId:receiverId,

      receiverName:
        target.name || "User",

      giftId:gift.id,
      giftName:gift.name,
      giftEmoji:gift.emoji,

      price,
      quantity:1
    }
  );

  hideModal("giftModal");

  toast(
    "Gift sending..."
  );
}

========================================================= */

function handleGiftReceived(data){

  if(!data) return;

  const gift =
    data.gift || data;

  const emoji =
    gift.giftEmoji ||
    gift.emoji ||
    "🎁";

  const name =
    gift.giftName ||
    gift.name ||
    "Gift";

  showGiftAnimation(
    emoji,
    name
  );

  addSystemMessage(
    (data.senderName ||
      data.name ||
      "Someone") +
    " sent " +
    name +
    " " +
    emoji
  );

  if(data.room){
    applyRoomState(data.room);
  }else{
    refreshRoomFromFirebase();
  }
}

/* =========================================================

========================================================= */

function renderRoomExp(){

  const exp =
    safeNumber(
      roomState.roomExp,
      0
    );

  document.getElementById(
    "roomExpValue"
  ).textContent =
    money(exp) + " EXP";

  const max =
    1000000;

  const percent =
    Math.min(
      100,
      Math.round(
        (exp / max) * 100
      )
    );

  document.getElementById(
    "roomExpFill"
  ).style.width =
    percent + "%";

  renderTopUsers();
}

function renderTopUsers(){

  const box =
    document.getElementById("topUsers");

  box.innerHTML = "";

  let users =
    Array.isArray(roomState.topUsers)
      ? roomState.topUsers
      : [];

  if(!users.length){

    users =
      getMembers()
        .slice()
        .sort(
          (a,b)=>
            safeNumber(b.giftSent,0) -
            safeNumber(a.giftSent,0)
        )
        .slice(0,3);
  }

  for(let i=0;i<3;i++){

    const user =
      users[i];

    const div =
      document.createElement("div");

    div.className =
      "top-user";

    if(user){

      div.innerHTML =
        '<img src="' +
        esc(imgSafe(user.dp)) +
        '">' +
        '<span>' +
        (i+1) +
        ". " +
        esc(user.name || "User") +
        '</span>';

    }else{

      div.innerHTML =
        '<img src="' +
        PV_DEFAULT_DP +
        '">' +
        '<span>' +
        (i+1) +
        ". Empty</span>";
    }

    box.appendChild(div);
  }
}

async function saveRoomSettings(){

  if(!isRoomOwner()){

    toast("Only room owner can edit this room.");
    return;
  }

  const name =
    document.getElementById(
      "settingRoomName"
    ).value.trim();

  const dp =
    document.getElementById(
      "settingRoomDp"
    ).value.trim();

  const category =
    document.getElementById(
      "settingCategory"
    ).value;

  if(!name){

    toast("Room name required.");
    return;
  }

  const data = {
    name,
    roomName:name,
    dp:dp || PV_DEFAULT_DP,
    category
  };

  /*
    Socket server updates live room.
  */

  if(socketConnected){

    socket.emit(
      "room-update",
      {
        roomId:ROOM_ID,
        userId:currentUser.userId,
        ...data
      }
    );
  }

  /*
    Firebase permanent copy.
  */

  await firebasePatch(
    "rooms/" + encodeURIComponent(ROOM_ID),
    {
      name,
      roomName:name,
      dp:data.dp,
      category,
      owner:
        roomState.owner ||
        currentUser.userId,
      ownerId:
        roomState.ownerId ||
        currentUser.userId,
      updatedAt:Date.now()
    }
  );

  roomState = {
    ...roomState,
    ...data
  };

  renderRoomHeader();

  hideModal("settingsModal");

  toast("Room settings saved.");
}

/* =========================================================
   INVITE / SHARE
========================================================= */

function getRoomLink(){

  /*
    Stable PawanVoice room URL.
    When room.html is hosted from same website,
    location.origin keeps it working.
  */

  const base =
    location.origin +
    location.pathname;

  return (
    base +
    "?room=" +
    encodeURIComponent(ROOM_ID)
  );
}

async function inviteRoom(){

  const link =
    getRoomLink();

  const text =
    "Join my PawanVoice room " +
    ROOM_ID +
    "\n" +
    link;

  if(
    navigator.share
  ){

    try{

      await navigator.share({
        title:"PawanVoice Room",
        text,
        url:link
      });

      return;

    }catch(e){}
  }

  try{

    await navigator.clipboard.writeText(
      link
    );

    toast("Room link copied.");

  }catch(e){

    prompt(
      "Copy room link:",
      link
    );
  }
}

  try{

    socket?.emit(
      "leave-room",
      {
        roomId:ROOM_ID,
        userId:currentUser.userId
      }
    );

  }catch(e){}

  stopMicrophone();

  peers.forEach(pc=>{

      pc.close();

  });

  peers.clear();

  setTimeout(()=>{

    location.href =

}

async function init(){

  renderGiftTabs();

  renderEmojis();

  updateBalanceUI();

  renderRoomHeader();
  renderSeats();
  renderRoomExp();
  renderInfo();

  /*
    Firebase first gives room info even if Socket
    needs a moment to connect.
  */

  await Promise.allSettled([
    loadFirebaseUser(),
    refreshRoomFromFirebase()
  ]);

  updateBalanceUI();

  connectSocket();

  /*
    Second Firebase refresh helps rooms that are
    created immediately before entering.
  */

  setTimeout(
    refreshRoomFromFirebase,
    1500
  );

  setTimeout(
    refreshRoomFromFirebase,
    5000
  );

  setTimeout(()=>{

    document
      .getElementById("loading")
      .classList.add("hidden");

  },1800);
}
