async function joinRoom(){

 const roomSnap=
  await db.ref("rooms/"+roomId).once("value");

 if(!roomSnap.exists()){
  alert("Room nahi mila");
  location.href="index.html";
  return;

  "rooms/"+roomId+"/members/"+uid
 ).set({

  name:myData.name||"Guest",
  role:"member",
  mic:false,
  joinedAt:firebase.database.ServerValue.TIMESTAMP
 });


 listenMembers();
 listenChat();

/* =========================
   MEMBERS
========================= */

function listenMembers(){

 db.ref("rooms/"+roomId+"/members")
 .on("value",snap=>{

  members=snap.val()||{};

  renderSeats();

  document.getElementById("memberCount").textContent=
   Object.keys(members).length;

 });

}


function renderSeats(){

 const list=Object.values(members)
   .sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0))
   .slice(0,9);

 for(let i=0;i<9;i++){

  const seat=document.getElementById("seat"+i);

  const circle=seat.querySelector(".seatCircle");
  const name=seat.querySelector(".seatName");

  if(i<list.length){

   const u=list[i];

   circle.innerHTML=
    (i===0?'<span class="crown">👑</span>':'')+
    '👤';

   name.textContent=
    (u.name||"Guest")+
    (u.uid===uid?" (You)":"");

   let old=seat.querySelector(".micDot");

   if(old)old.remove();

   const dot=document.createElement("span");

   dot.className=
    "micDot "+(u.mic===false?"off":"");

   dot.textContent=
    u.mic===false?"":"🎤";

   circle.appendChild(dot);

   seat.onclick=()=>openUser(u);

  }else{

   circle.innerHTML="🎙️";
   name.textContent=
    i===0?"Owner":"Seat "+(i+1);

   seat.onclick=null;

   const old=seat.querySelector(".micDot");

   if(old)old.remove();

  }

 }

}


/* =========================
   MICROPHONE
========================= */

async function startMicrophone(){

 try{

  localStream=
   await navigator.mediaDevices.getUserMedia({
    audio:{
     echoCancellation:true,
     noiseSuppression:true,
     autoGainControl:true
    },
    video:false
   });

  localStream.getAudioTracks()
   .forEach(t=>t.enabled=false);

  micOn=false;

  await db.ref(
   "rooms/"+roomId+"/members/"+uid+"/mic"
  ).set(false);

  updateMicUI();

 }catch(err){

  console.error(err);

  alert(
   "Microphone permission nahi mili.\n\n"+
   "Browser me microphone permission Allow karein."
  );

 }

}


async function toggleMic(){

 if(!localStream){

  await startMicrophone();

  if(!localStream)return;

 }

 micOn=!micOn;

 localStream.getAudioTracks()
  .forEach(track=>{
   track.enabled=micOn;
  });

 await db.ref(
  "rooms/"+roomId+"/members/"+uid+"/mic"
 ).set(micOn);

 updateMicUI();

}


function updateMicUI(){

 document.getElementById("micIcon").textContent=
  micOn?"🎤":"🔇";

 document.getElementById("micText").textContent=
  micOn?"Mic ON":"Mic OFF";

}


/* =========================
   SPEAKER
========================= */

function toggleSpeaker(){

 speakerOn=!speakerOn;

 document.getElementById("speakerIcon")
 .textContent=speakerOn?"🔊":"🔇";

 document.querySelectorAll("#audioContainer audio")
 .forEach(a=>{
  a.muted=!speakerOn;
 });

}


/* =========================
   WEBRTC SIGNALING
========================= */

function signalRef(){

 return db.ref(
  "rooms/"+roomId+"/signals"
 );

}


function listenSignals(){

 signalRef()
 .child(uid)
 .on("child_added",async snap=>{

  const signal=snap.val();

  if(!signal)return;

  try{

   if(signal.type==="offer"){

    const pc=
     await getPeer(signal.from);

    await pc.setRemoteDescription(
     new RTCSessionDescription(signal.offer)
    );

    const answer=
     await pc.createAnswer();

    await pc.setLocalDescription(answer);

    await sendSignal(
     signal.from,
     {
      type:"answer",
      answer:{
       type:answer.type,
       sdp:answer.sdp
      }
     }
    );

   }

   else if(signal.type==="answer"){

    const pc=peers[signal.from];

    if(pc){

     await pc.setRemoteDescription(
      new RTCSessionDescription(signal.answer)
     );

    }

   }

   else if(signal.type==="candidate"){

    const pc=
     await getPeer(signal.from);

    if(pc.remoteDescription){

     await pc.addIceCandidate(
      new RTCIceCandidate(signal.candidate)
     );

    }else{

     if(!pendingCandidates[signal.from]){
      pendingCandidates[signal.from]=[];
     }

     pendingCandidates[signal.from]
     .push(signal.candidate);

    }

   }

  }catch(e){

   console.error("Signal error",e);

  }

  snap.ref.remove();

 });

}


async function getPeer(remoteUid){

 if(peers[remoteUid]){
  return peers[remoteUid];
 }

 const pc=
  new RTCPeerConnection(rtcConfig);

 peers[remoteUid]=pc;

 if(localStream){

  localStream.getTracks()
   .forEach(track=>{
    pc.addTrack(track,localStream);
   });

 }

 pc.onicecandidate=e=>{

  if(e.candidate){

   sendSignal(
    remoteUid,
    {
     type:"candidate",
     candidate:e.candidate.toJSON()
    }
   );

  }

 };


 pc.ontrack=e=>{

  let audio=
   document.getElementById(
    "audio_"+remoteUid
   );

  if(!audio){

   audio=document.createElement("audio");

   audio.id="audio_"+remoteUid;

   audio.autoplay=true;
   audio.playsInline=true;
   audio.controls=false;
   audio.muted=!speakerOn;

   document
    .getElementById("audioContainer")
    .appendChild(audio);

  }

  audio.srcObject=e.streams[0];

 };


 pc.onconnectionstatechange=()=>{

  if(
   pc.connectionState==="failed"||
   pc.connectionState==="closed"||
   pc.connectionState==="disconnected"
  ){

   try{
    pc.close();
   }catch(e){}

   delete peers[remoteUid];

  }

 };

 if(pendingCandidates[remoteUid]){

  for(const candidate of
      pendingCandidates[remoteUid]){

   try{

    await pc.addIceCandidate(
     new RTCIceCandidate(candidate)
    );

   }catch(e){}

  }

  delete pendingCandidates[remoteUid];

 }

 return pc;

}


async function createOffer(remoteUid){

 const pc=
  await getPeer(remoteUid);

 const offer=
  await pc.createOffer();

 await pc.setLocalDescription(offer);

 await sendSignal(
  remoteUid,
  {
   type:"offer",
   offer:{
    type:offer.type,
    sdp:offer.sdp
   }
  }
 );

}


async function sendSignal(targetUid,data){

 const key=
  signalRef()
  .child(targetUid)
  .push().key;

 await signalRef()
  .child(targetUid)
  .child(key)
  .set({
   ...data,
   from:uid,
   createdAt:firebase.database.ServerValue.TIMESTAMP
  });

}


/*
 New members get offers from existing members.
 This is intentionally a small-room mesh architecture.
 For large production rooms, use an SFU/media server.
*/

function watchForNewMembers(){

 db.ref("rooms/"+roomId+"/members")
 .on("child_added",async snap=>{

  const id=snap.key;

  if(id!==uid){

   try{
    await createOffer(id);
   }catch(e){
    console.error(e);
   }

  }

 });

}

watchForNewMembers();


/* =========================
   CHAT
========================= */

function listenChat(){

 db.ref("rooms/"+roomId+"/chat")
 .limitToLast(100)
 .on("value",snap=>{

  const box=
   document.getElementById("messages");

  box.innerHTML="";

  if(!snap.exists()){

   box.innerHTML=
    '<div class="empty">No messages yet</div>';

   return;

  }

  snap.forEach(child=>{

   const m=child.val()||{};

   const div=
    document.createElement("div");

   div.className="msg";

   const b=
    document.createElement("b");

   b.textContent=(m.name||"Guest")+": ";

   const text=
    document.createElement("span");

   text.textContent=m.text||"";

   div.appendChild(b);
   div.appendChild(text);

   box.appendChild(div);

  });

  box.scrollTop=box.scrollHeight;

 });

}


async function sendChat(){

 const input=
  document.getElementById("chatText");

 const text=input.value.trim();

 if(!text)return;

 if(text.length>250){

  alert("Message maximum 250 characters");

  return;

 }

 const key=
  db.ref("rooms/"+roomId+"/chat")
  .push().key;

 await db.ref(
  "rooms/"+roomId+"/chat/"+key
 ).set({
  uid:uid,
  name:myData.name||"Guest",
  text:text,
  createdAt:firebase.database.ServerValue.TIMESTAMP
 });

 input.value="";

}

function isPrivileged(){

 const me=members[uid];

 if(!me)return false;

 return(
  me.role==="owner"||
  me.role==="admin"||
  me.role==="superadmin"||
  me.role==="manager"
 );

async function addRoomExp(amount){

 const ref=
  db.ref("rooms/"+roomId);

 await ref.transaction(room=>{

  if(!room)return room;

  room.exp=
   (Number(room.exp)||0)+amount;

  room.level=
   Math.max(
    1,
    Math.floor((room.exp||0)/100)+1
   );

  return room;

 });

}

  }).catch(()=>{});

}


/* =========================
   LEAVE
========================= */

async function leaveRoom(){

 if(!uid||!roomId){

  location.href="index.html";
  return;

 }

 try{

  if(localStream){

   localStream.getTracks()
    .forEach(t=>t.stop());

  }

  Object.values(peers)
   .forEach(pc=>{
    try{
     pc.close();
    }catch(e){}
   });

  await db.ref(
   "rooms/"+roomId+"/members/"+uid
  ).remove();

 }catch(e){

  console.error(e);

 }

 location.href="index.html";

}


/* =========================
   MODAL
========================= */

function showModal(html){

 document.getElementById(
  "modalContent"
 ).innerHTML=html;

 document.getElementById(
  "modal"
 ).classList.add("show");

}


function hideModal(){

 document.getElementById(
  "modal"
 ).classList.remove("show");

}


function closeModal(e){

 if(e.target.id==="modal"){
  hideModal();
 }

}


function showRoomMessage(text){

 hideModal();

 alert(text);

}


function escapeHtml(text){

 return String(text||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}

========================= */
