<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>PawanVoice Room</title>

<style>

*{box-sizing:border-box}

body{
 margin:0;
 background:#08080d;
 color:#fff;
 font-family:Arial,sans-serif
}

.app{
 max-width:520px;
 margin:auto;
 min-height:100vh;
 background:
 radial-gradient(
  circle at 50% 10%,
  #35194f,
  #11111a 45%,
  #09090e 85%
 );
 padding-bottom:80px
}

.top{
 padding:11px;
 display:flex;
 align-items:center;
 gap:9px
}

.back,.icon{
 background:#25252f;
 color:#fff;
 padding:8px 10px;
 border-radius:9px
}

.roomDP{
 width:49px;
 height:49px;
 border-radius:13px;
 object-fit:cover;
 background:#292933
}

.info{
 flex:1;
 min-width:0
}

.info b{
 font-size:16px
}

.muted{
 color:#9999a5;
 font-size:10px
}


/* OWNER */

.seats{
 padding:5px 12px
}

.owner{
 text-align:center;
 margin-bottom:15px
}

.circle{
 width:61px;
 height:61px;
 border-radius:50%;
 object-fit:cover;
 background:#20202a;
 border:2px solid #575762;
 margin:auto;
 display:block
}

.name{
 font-size:11px;
 margin-top:5px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.id{
 font-size:9px;
 color:#777
}

.badge{
 display:inline-block;
 background:#3c205d;
 border-radius:7px;
 padding:2px 5px;
 font-size:9px;
 margin-top:2px
}


/* 8 OTHER SEATS */

.seatGrid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}

.seat{
 text-align:center;
 min-width:0;
 cursor:pointer
}


/* ROOM FEATURES */

.tools{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
 padding:15px 12px
}

.tool{
 background:#1b1b25;
 border:1px solid #2c2c36;
 border-radius:12px;
 padding:8px 2px;
 text-align:center;
 font-size:9px
}

.tool div{
 font-size:21px;
 margin-bottom:3px
}


/* TOP AREA */

.rank{
 margin:0 12px 10px;
 padding:11px;
 background:#181220;
 border:1px solid #3a2251;
 border-radius:13px;
 text-align:center;
 font-size:11px
}


/* CHAT */

.chat{
 height:210px;
 margin:0 12px;
 background:#101017;
 border:1px solid #292934;
 border-radius:14px;
 padding:10px;
 overflow:auto
}

.msg{
 padding:4px 0;
 font-size:12px
}

.msg b{
 color:#c8a4ff
}


/* BOTTOM */

.bar{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(520px,100%);
 background:#16161f;
 border-top:1px solid #2b2b35;
 padding:8px;
 display:flex;
 gap:6px;
 z-index:10
}

.bar input{
 flex:1;
 background:#24242e;
 border:0;
 color:#fff;
 border-radius:20px;
 padding:10px
}

.bar button{
 background:#7c3aed;
 color:#fff;
 border-radius:20px;
 padding:8px 12px
}


/* MODAL */

.modal{
 position:fixed;
 inset:0;
 background:#000b;
 display:none;
 align-items:flex-end;
 z-index:30
}

.modal.show{
 display:flex
}

.sheet{
 width:min(520px,100%);
 max-height:80vh;
 overflow:auto;
 background:#18181f;
 border-radius:20px 20px 0 0;
 padding:16px
}

.sheet input,
.sheet select{
 width:100%;
 padding:11px;
 background:#101017;
 border:1px solid #333;
 color:#fff;
 border-radius:9px;
 margin:5px 0
}

.sheet button{
 padding:10px;
 border:0;
 border-radius:9px;
 background:#7c3aed;
 color:#fff;
 margin:4px
}

.close{
 float:right;
 background:#292933!important
}

</style>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

</head>


<body>

<div class="app">


<!-- TOP -->

<div class="top">

<button class="back"
 onclick="location.href='index.html'">
 ←
</button>

<img id="roomDP"
     class="roomDP">

<div class="info">

<b id="roomName">
 Loading...
</b>

<div class="muted"
     id="roomMeta">
 #- · General · 0/9
</div>

<div class="muted">
 Host:
 <span id="hostName">-</span>
</div>

</div>

<button class="icon"
 onclick="shareRoom()">
 ↗
</button>

<button class="icon"
 onclick="openSettings()">
 ⚙️
</button>

</div>


<!-- OWNER -->

<div class="seats">

<div class="owner">

<img id="ownerDP"
     class="circle">

<div id="ownerName"
     class="name">
 👑 Owner
</div>

<div id="ownerID"
     class="id">
 -
</div>

<div class="badge">
 👑 Owner
</div>

</div>


<!-- SEAT 2-9 -->

<div id="seatGrid"
     class="seatGrid">
</div>

</div>


<!-- ROOM FEATURES -->

<div class="tools">

<div class="tool"
 onclick="toast('🛟 Room Support')">
 <div>🛟</div>
 Support
</div>

<div class="tool"
 onclick="toast('🎡 Lucky Wheel')">
 <div>🎡</div>
 Lucky
</div>

<div class="tool"
 onclick="toast('🎯 Bounty Hunter')">
 <div>🎯</div>
 Bounty
</div>

<div class="tool"
 onclick="toast('🎁 Room Reward')">
 <div>🎁</div>
 Reward
</div>

<div class="tool"
 onclick="toast('🚀 New App Benefits')">
 <div>🚀</div>
 Benefits
</div>

</div>


<!-- TOP EXP -->

<div class="rank">

🚀 <b>TOP EXP</b>

<br>

Family · CP Ranking · Rich King Ranking

</div>


<!-- CHAT -->

<div id="chat"
     class="chat">

<div class="muted">
 Room chat started.
</div>

</div>

</div>


<!-- BOTTOM BAR -->

<div class="bar">

<button id="micButton"
 onclick="toggleMic()">
 🎙️
</button>

<input id="message"
       placeholder="Message...">

<button onclick="sendMessage()">
 ➤
</button>

<button onclick="toast('🎁 Gifts')">
 🎁
</button>

<button onclick="toast('😊 Emoji')">
 😊
</button>

</div>


<!-- SETTINGS -->

<div id="settingsModal"
     class="modal"
     onclick="if(event.target===this)closeModal()">

<div class="sheet">

<button class="close"
 onclick="closeModal()">
 ✕
</button>

<h3>
 ⚙️ Room Settings
</h3>

<input id="editName"
       placeholder="Room Name">

<input id="editDP"
       placeholder="Room DP image URL">

<select id="editCategory">

<option>General</option>
<option>Music</option>
<option>Chat</option>
<option>Games</option>
<option>Family</option>

</select>

<button onclick="saveRoomSettings()">
 Save Room
</button>

</div>

</div>


<!-- USER -->

<div id="userModal"
     class="modal"
     onclick="if(event.target===this)closeModal()">

<div class="sheet">

<button class="close"
 onclick="closeModal()">
 ✕
</button>

<h3 id="userTitle">
 User
</h3>

<div id="userInfo">
</div>

<button onclick="makeAdmin()">
 🛡️ Make Admin
</button>

<button onclick="kickUser()">
 🚫 Kick
</button>

</div>

</div>


<script>

/* ==================================================
   FIREBASE CONFIG
   Same Firebase project as index.html
================================================== */

const firebaseConfig={

 apiKey:"YOUR_FIREBASE_API_KEY",

 authDomain:
 "YOUR_PROJECT.firebaseapp.com",

 databaseURL:
 "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

 projectId:
 "YOUR_PROJECT",

 storageBucket:
 "YOUR_PROJECT.appspot.com",

 messagingSenderId:
 "YOUR_SENDER_ID",

 appId:
 "YOUR_APP_ID"

};


/* ROOM ID */

const roomId=
 new URLSearchParams(location.search)
 .get("room");


/* USER */

const uid=
 localStorage.getItem("pawanUid") ||
 ("PV"+Date.now());

let me=
 JSON.parse(
  localStorage.getItem("pawanProfile") ||
  '{"name":"Guest","level":1,"dp":"","gender":"Male"}'
 );

me.uid=uid;


/* VARIABLES */

let db=null;

let room=null;

let members={};

let selectedUser=null;

let micOn=false;

let audioStream=null;


/* HELPERS */

function toast(x){

 alert(x);

}


function esc(s){

 return String(s||"")
 .replace(/[&<>"']/g,m=>({

  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"

 }[m]));

}


/* RENDER SEATS */

function renderSeats(){

 const list=
 Object.values(members)
 .sort(
  (a,b)=>
  (a.seat||99)-
  (b.seat||99)
 );

 let owner=
 list.find(x=>
  x.uid===room.hostId
 );

 if(!owner)
 owner=
 list.find(x=>
  x.seat===1
 );


 if(owner){

  ownerDP.src=
   owner.dp||"";

  ownerName.textContent=
   owner.name||"Owner";

  ownerID.textContent=
   "ID: "+owner.uid+
   (owner.uid===uid?
   " · You":"");

 }


 let others=
 list.filter(
  x=>x.uid!==owner?.uid
 );


 let html="";


 for(let i=0;i<8;i++){

  const x=others[i];

  if(x){

   html+=`

   <div class="seat"
        onclick="openUser('${x.uid}')">

    <img class="circle"
         src="${esc(x.dp||"")}">

    <div class="name">
     ${esc(x.name||"User")}
    </div>

    <div class="id">
     ID: ${esc(x.uid)}
    </div>

    <div class="badge">
     ⭐ Lv.${x.level||1}
    </div>

   </div>

   `;

  }else{

   html+=`

   <div class="seat">

    <div class="circle"
         style="
         display:flex;
         align-items:center;
         justify-content:center;
         ">

     ＋

    </div>

    <div class="name">
     Seat ${i+2}
    </div>

    <div class="id">
     Empty
    </div>

   </div>

   `;

  }

 }

 seatGrid.innerHTML=html;

}


/* USER CLICK */

function openUser(id){

 selectedUser=id;

 const x=
 members[id];

 if(!x)return;

 userTitle.textContent=
  x.name||"User";

 userInfo.innerHTML=`

 <p>
 <b>Name:</b>
 ${esc(x.name)}
 </p>

 <p>
 <b>ID:</b>
 ${esc(x.uid)}
 </p>

 <p>
 <b>Level:</b>
 ${x.level||1}
 </p>

 <p>
 <b>Gender:</b>
 ${esc(x.gender||"-")}
 </p>

 <p>
 <b>Admin:</b>
 ${x.admin?"Yes":"No"}
 </p>

 `;

 userModal.classList.add(
  "show"
 );

}


/* CLOSE */

function closeModal(){

 document
 .querySelectorAll(".modal")
 .forEach(x=>
  x.classList.remove("show")
 );

}


/* SETTINGS */

function openSettings(){

 if(!room)return;

 editName.value=
  room.name||"";

 editDP.value=
  room.dp||"";

 editCategory.value=
  room.category||
  "General";

 settingsModal.classList.add(
  "show"
 );

}


/* SAVE ROOM SETTINGS */

async function saveRoomSettings(){

 if(room.hostId!==uid){

  alert(
   "Only room owner can change settings."
  );

  return;
 }

 await db
 .ref("rooms/"+roomId)
 .update({

  name:
   editName.value.trim(),

  dp:
   editDP.value.trim(),

  category:
   editCategory.value

 });

 closeModal();

}


/* ADMIN */

async function makeAdmin(){

 if(room.hostId!==uid){

  alert(
   "Only room owner can make admin."
  );

  return;
 }

 await db
 .ref(
  "rooms/"+roomId+
  "/members/"+selectedUser
 )
 .update({
  admin:true
 });

 closeModal();

}


/* KICK */

async function kickUser(){

 if(room.hostId!==uid){

  alert(
   "Only room owner can kick."
  );

  return;
 }

 await db
 .ref(
  "rooms/"+roomId+
  "/members/"+selectedUser
 )
 .remove();

 closeModal();

}


/* SHARE */

function shareRoom(){

 if(navigator.share){

  navigator.share({

   title:room.name,

   text:
   "Join my PawanVoice room",

   url:
   location.href

  });

 }else{

  navigator.clipboard?.writeText(
   location.href
  );

  alert(
   "Room link copied"
  );

 }

}


/* CHAT */

async function sendMessage(){

 const text=
 document
 .getElementById("message")
 .value.trim();

 if(!text)return;

 await db
 .ref(
  "rooms/"+roomId+
  "/messages"
 )
 .push({

  uid:uid,

  name:
   me.name||"Guest",

  text:text,

  createdAt:
   Date.now()

 });

 message.value="";

}


function renderChat(snapshot){

 let html="";

 snapshot.forEach(c=>{

  const x=c.val();

  html+=`

  <div class="msg">

   <b>
    ${esc(x.name)}
   </b>:

   ${esc(x.text)}

  </div>

  `;

 });

 chat.innerHTML=
  html||
  "<div class='muted'>Room chat started.</div>";

 chat.scrollTop=
  chat.scrollHeight;

}


/* MICROPHONE */

async function toggleMic(){

 if(micOn){

  if(audioStream){

   audioStream
   .getTracks()
   .forEach(
    t=>t.stop()
   );

  }

  audioStream=null;

  micOn=false;

  micButton.textContent=
   "🎙️";

  return;

 }

 try{

  audioStream=
   await navigator.mediaDevices
   .getUserMedia({
    audio:true
   });

  micOn=true;

  micButton.textContent=
   "🔴";

 }catch(e){

  alert(
   "Microphone permission denied."
  );

 }

}


/* JOIN */

async function joinRoom(){

 if(!room)return;

 let arr=
  Object.values(members)
  .filter(
   x=>x.uid!==uid
  );

 let taken=
  new Set(
   arr.map(x=>x.seat)
  );

 let seat=2;

 while(
  taken.has(seat)&&
  seat<=9
 ){
  seat++;
 }

 if(room.hostId===uid)
  seat=1;

 if(seat>9){

  alert("Room full");

  return;
 }

 await db
 .ref(
  "rooms/"+roomId+
  "/members/"+uid
 )
 .set({

  uid:uid,

  name:
   me.name||"Guest",

  dp:
   me.dp||"",

  gender:
   me.gender||"Male",

  level:
   me.level||1,

  seat:seat,

  admin:
   room.hostId===uid,

  joinedAt:
   Date.now()

 });

 await db
 .ref("rooms/"+roomId)
 .update({

  online:
   Object.keys(members)
   .length+1

 });

}


/* INIT */

async function init(){

 if(!roomId){

  alert(
   "Room ID नहीं मिला."
  );

  return;

 }

 if(
  firebaseConfig.apiKey===
  "YOUR_FIREBASE_API_KEY"
 ){

  alert(
   "Firebase config अभी भरना बाकी है."
  );

  return;

 }

 firebase.initializeApp(
  firebaseConfig
 );

 db=
  firebase.database();

 firebase.auth()
 .signInAnonymously()
 .catch(console.log);


 /* ROOM */

 db.ref(
  "rooms/"+roomId
 )
 .on("value",s=>{

  room=s.val();

  if(!room){

   alert(
    "Room नहीं मिला."
   );

   location.href=
    "index.html";

   return;

  }

  roomName.textContent=
   room.name||
   "Voice Room";

  roomMeta.textContent=
   "#"+
   (room.roomNo||roomId)+
   " · "+
   (room.category||
    "General")+
   " · "+
   (room.online||0)+
   "/9";

  hostName.textContent=
   room.hostName||
   "-";

  roomDP.src=
   room.dp||"";

 });


 /* MEMBERS */

 db.ref(
  "rooms/"+roomId+
  "/members"
 )
 .on("value",s=>{

  members={};

  s.forEach(c=>{

   members[c.key]=
    c.val();

  });

  renderSeats();

 });


 /* CHAT */

 db.ref(
  "rooms/"+roomId+
  "/messages"
 )
 .limitToLast(50)
 .on(
  "value",
  renderChat
 );


 setTimeout(
  joinRoom,
  800
 );

}


init();

</script>

</body>
</html>
