<script>

/* =========================
   PAWANVOICE ROOM
========================= */

const SERVER_URL =
  window.location.origin;

let currentUser = null;
let roomId = "";
let roomState = null;
let socket = null;

let mySeat = -1;
let micEnabled = false;
let speakerEnabled = true;

let localStream = null;
const peerConnections = {};

const DEFAULT_DP =
  "https://i.pravatar.cc/200?img=12";

/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function getRoomId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("room") ||
    "PVMAIN"
  );

}

function safeText(value,fallback){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){
    return fallback || "";
  }

  return String(value);

}

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================
   USER
========================= */

async function loadCurrentUser(){

  try{

    if(
      typeof pvLoadUser ===
      "function"
    ){

      currentUser =
        await pvLoadUser();

    }

  }catch(error){

    console.error(error);

  }

  if(!currentUser){

    if(
      typeof pvGetLocalUser ===
      "function"
    ){

      currentUser =
        pvGetLocalUser();

    }else{

      currentUser = {

        userId:
          localStorage.getItem(
            "pv_userId"
          ) || "pawan",

        name:
          localStorage.getItem(
            "pv_name"
          ) || "Pawan User",

        dp:
          localStorage.getItem(
            "pv_dp"
          ) || DEFAULT_DP,

        level:1,
        exp:0,
        coins:0

      };

    }

  }

}

/* =========================
   ROOM INIT
========================= */

async function init(){

  roomId =
    getRoomId();

  await loadCurrentUser();

  updateHeader();

  createEmptySeats();

  createEmojiList();

  connectSocket();

}

/* =========================
   HEADER
========================= */

function updateHeader(){

  $("roomId").textContent =
    "ID: " + roomId;

  $("settingRoomId").textContent =
    roomId;

  $("inviteRoomId").textContent =
    roomId;

  $("settingUserId").textContent =
    currentUser.userId;

  $("roomDP").src =
    currentUser.dp ||
    DEFAULT_DP;

}

/* =========================
   SEATS
========================= */

function createEmptySeats(){

  $("seat-0").innerHTML =
    renderSeat(null,0,true);

  let html = "";

  for(
    let i = 1;
    i < 9;
    i++
  ){

    html +=
      renderSeat(null,i,false);

  }

  $("seatsGrid").innerHTML =
    html;

}

function renderSeat(
  user,
  seatIndex,
  isHost
){

  if(!user){

    return `

      <div
        class="seat"
        data-seat="${seatIndex}"
        onclick="takeSeat(${seatIndex})">

        <div class="seat-empty">
          +
        </div>

        <div class="seat-name">
          Empty
        </div>

        <div class="seat-role">
          Tap to join
        </div>

      </div>

    `;

  }

  const micClass =
    user.mic
      ? "on"
      : "off";

  const micIcon =
    user.mic
      ? "🎤"
      : "🔇";

  return `

    <div
      class="seat"
      data-seat="${seatIndex}"
      onclick="openUser('${escapeHTML(user.userId)}')">

      <div class="avatar-wrap">

        ${
          isHost
            ? `<div class="crown">👑</div>`
            : ""
        }

        <img
          class="avatar"
          src="${
            escapeHTML(
              user.dp || DEFAULT_DP
            )
          }"
          alt="User">

        <div class="seat-number">
          ${seatIndex + 1}
        </div>

        <div
          class="mic ${micClass}">
          ${micIcon}
        </div>

      </div>

      <div class="seat-name">
        ${escapeHTML(
          user.name || "User"
        )}
      </div>

      <div class="seat-role">
        ${
          isHost
            ? "Host"
            : "Speaker"
        }
      </div>

    </div>

  `;

}

function renderRoom(){

  if(!roomState){
    return;
  }

  const seats =
    Array.isArray(
      roomState.seats
    )
      ? roomState.seats
      : Array(9).fill(null);

  $("seat-0").innerHTML =
    renderSeat(
      seats[0],
      0,
      true
    );

  let html = "";

  for(
    let i = 1;
    i < 9;
    i++
  ){

    html +=
      renderSeat(
        seats[i],
        i,
        false
      );

  }

  $("seatsGrid").innerHTML =
    html;

  const users =
    seats.filter(Boolean);

  $("roomCount").textContent =
    users.length + "/9";

  if(roomState.name){

    $("roomName").textContent =
      roomState.name;

  }

  if(roomState.dp){

    $("roomDP").src =
      roomState.dp;

  }

  if(roomState.notice){

    $("roomNotice").textContent =
      roomState.notice;

  }

  updateEXP(users);

}

/* =========================
   SOCKET
========================= */

function connectSocket(){

  try{

    socket =
      io(
        SERVER_URL,
        {
          transports:[
            "websocket",
            "polling"
          ]
        }
      );

  }catch(error){

    console.error(error);

    showToast(
      "Socket connection failed"
    );

    return;

  }

  socket.on(
    "connect",
    function(){

      showToast(
        "Room connected ✅"
      );

      socket.emit(
        "join-room",
        {
          roomId:
            roomId,

          userId:
            currentUser.userId,

          name:
            currentUser.name,

          dp:
            currentUser.dp,

          level:
            Number(
              currentUser.level || 1
            ),

          exp:
            Number(
              currentUser.exp || 0
            )
        }
      );

    }
  );

  socket.on(
    "room-state",
    function(state){

      roomState =
        state;

      findMySeat();

      renderRoom();

    }
  );

  socket.on(
    "room-update",
    function(state){

      roomState =
        state;

      findMySeat();

      renderRoom();

    }
  );

  socket.on(
    "chat-message",
    function(message){

      addChatMessage(
        message
      );

    }
  );

  socket.on(
    "gift",
    function(data){

      addSystemMessage(
        "🎁 " +
        safeText(
          data.name,
          "Someone"
        ) +
        " sent " +
        safeText(
          data.gift,
          "Gift"
        )
      );

    }
  );

  socket.on(
    "connect_error",
    function(error){

      console.error(
        "Socket:",
        error
      );

      showToast(
        "Server connection problem"
      );

    }
  );

  socket.on(
    "disconnect",
    function(){

      showToast(
        "Room disconnected"
      );

    }
  );

}

   SEAT
========================= */

function findMySeat(){

  mySeat = -1;

  if(
    !roomState ||
    !Array.isArray(
      roomState.seats
    )
  ){
    return;
  }

  for(
    let i = 0;
    i < roomState.seats.length;
    i++
  ){

    const user =
      roomState.seats[i];

    if(
      user &&
      String(user.userId) ===
      String(currentUser.userId)
    ){

      mySeat = i;
      break;

    }

  }

}
