<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PawanVoice Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#18122d;
 color:white;
}

.room{
 max-width:480px;
 margin:auto;
 min-height:100vh;
 position:relative;
 overflow:hidden;
 background:
 radial-gradient(circle at 50% 10%,#61349b 0,#29154c 35%,#100b1f 100%);
}

.header{
 padding:13px;
 display:flex;
 align-items:center;
 gap:10px;
 background:#00000030;
}

.back{
 width:38px;
 height:38px;
 border:0;
 border-radius:50%;
 background:#ffffff18;
 color:white;
 font-size:20px;
}

.roomdp{
 width:45px;
 height:45px;
 border-radius:50%;
 background:linear-gradient(135deg,#ff4d9d,#7b2cff);
 display:flex;
 justify-content:center;
 align-items:center;
 font-weight:bold;
}

.roomtitle{flex:1}
.roomtitle b{font-size:16px}
.roomtitle small{display:block;color:#cfc7e7;margin-top:3px}

.headbtn{
 border:0;
 color:white;
 background:#ffffff15;
 border-radius:12px;
 padding:9px;
 font-size:16px;
}

.count{
 padding:5px 10px;
 background:#00000030;
 border-radius:14px;
 font-size:12px;
}

.seats{
 padding:22px 14px 5px;
}

.host{
 display:flex;
 justify-content:center;
 margin-bottom:28px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:22px 9px;
}

.seatBox{
 text-align:center;
 min-width:0;
}

.avatar{
 width:57px;
 height:57px;
 margin:auto;
 border-radius:50%;
 border:3px solid #8d64ff;
 background:#33234d;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:21px;
 font-weight:bold;
 overflow:hidden;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.name{
 margin-top:6px;
 font-size:12px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.empty{
 border:2px dashed #ffffff35;
 color:#ffffff60;
}

.tools{
 padding:14px;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:7px;
}

.tool{
 border:0;
 color:white;
 background:#ffffff12;
 border-radius:12px;
 padding:10px 4px;
 font-size:11px;
}

.tool span{
 display:block;
 font-size:21px;
 margin-bottom:4px;
}

.exp{
 margin:10px 14px;
 padding:12px;
 border-radius:17px;
 background:linear-gradient(90deg,#52218b,#9a326f);
}

.expTop{
 display:flex;
 justify-content:space-between;
 font-size:12px;
}

.rocket{
 font-size:28px;
 margin:4px 0;
}

.chat{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(480px,100%);
 padding:8px;
 background:#0d0918eF;
 display:flex;
 gap:5px;
 align-items:center;
}

.chat input{
 flex:1;
 min-width:0;
 border:0;
 outline:0;
 border-radius:20px;
 padding:11px 14px;
 background:#ffffff15;
 color:white;
}

.chat button{
 width:39px;
 height:39px;
 border:0;
 border-radius:50%;
 background:#ffffff15;
 color:white;
 font-size:18px;
}

.messages{
 height:115px;
 overflow-y:auto;
 padding:0 14px 75px;
}

.msg{
 margin:5px 0;
 font-size:13px;
 color:#ddd;
}

.status{
 text-align:center;
 font-size:12px;
 color:#c8bde1;
 padding:5px;
}
</style>
</head>

<body>

<div class="room">

<div class="header">
<button class="back" onclick="leaveRoom()">‹</button>

<div class="roomdp">PV</div>

<div class="roomtitle">
<b id="roomName">PawanVoice Room</b>
<small id="roomId">Room #10001</small>
</div>

<div class="count" id="count">0/9</div>

<button class="headbtn" onclick="roomSettings()">⚙️</button>
<button class="headbtn" onclick="invite()">↗️</button>
</div>

<div class="status" id="status">Connecting...</div>

<div class="seats">

<div class="host">
<div class="seatBox">
<div class="avatar" id="seat0"></div>
<div class="name" id="name0">Host</div>
</div>
</div>

<div class="grid">

<div class="seatBox"><div class="avatar empty" id="seat1">+</div><div class="name" id="name1"></div></div>
<div class="seatBox"><div class="avatar empty" id="seat2">+</div><div class="name" id="name2"></div></div>
<div class="seatBox"><div class="avatar empty" id="seat3">+</div><div class="name" id="name3"></div></div>
<div class="seatBox"><div class="avatar empty" id="seat4">+</div><div class="name" id="name4"></div></div>

<div class="seatBox"><div class="avatar empty" id="seat5">+</div><div class="name" id="name5"></div></div>
<div class="seatBox"><div class="avatar empty" id="seat6">+</div><div class="name" id="name6"></div></div>
<div class="seatBox"><div class="avatar empty" id="seat7">+</div><div class="name" id="name7"></div></div>
<div class="seatBox"><div class="avatar empty" id="seat8">+</div><div class="name" id="name8"></div></div>

</div>
</div>

<div class="tools">
<button class="tool" onclick="support()"><span>🛟</span>Support</button>
<button class="tool" onclick="wheel()"><span>🎡</span>Wheel</button>
<button class="tool" onclick="bounty()"><span>🎯</span>Bounty</button>
<button class="tool" onclick="reward()"><span>🎁</span>Reward</button>
<button class="tool" onclick="benefits()"><span>⭐</span>Benefits</button>
</div>

<div class="exp">
<div class="expTop">
<span>🚀 EXP</span>
<span>Top 1 / Top 2 / Top 3</span>
</div>
<div class="rocket">🚀 ━━━━━━━━━━━</div>
</div>

<div class="messages" id="messages"></div>

<div class="chat">

<input id="message" placeholder="Say something..."
       onkeydown="if(event.key==='Enter')sendMessage()">

<button onclick="emoji()">😊</button>
<button onclick="toggleSpeaker()">🔊</button>
<button id="micBtn" onclick="toggleMic()">🎙️</button>
<button onclick="showInbox()">💌</button>
<button onclick="more()">•••</button>

</div>

</div>

<script>
const SERVER="https://pawanvoice-1.onrender.com";

const params=new URLSearchParams(location.search);

const ROOM_ID=params.get("room")||"10001";
const ROOM_NAME=params.get("name")||"PawanVoice Room";

const USER_NAME=
 localStorage.getItem("pv_name")||"Pawan";

const USER_DP=
 localStorage.getItem("pv_dp")||"";

let socket;
let mic=false;
let speaker=true;

document.getElementById("roomName").textContent=ROOM_NAME;
document.getElementById("roomId").textContent="Room #"+ROOM_ID;

function connect(){

 socket=io(SERVER,{
   transports:["websocket","polling"]
 });

 socket.on("connect",()=>{
   document.getElementById("status").textContent="Connected";

   socket.emit("joinRoom",{
     roomId:ROOM_ID,
     name:USER_NAME,
     dp:USER_DP
   });
 });

 socket.on("connect_error",()=>{
   document.getElementById("status").textContent="Server connection failed";
 });

 socket.on("roomUsers",users=>{
   renderUsers(users);
 });

 socket.on("users",users=>{
   renderUsers(users);
 });

 socket.on("userJoined",user=>{
   addMessage("🟢 "+user.name+" joined the room");
 });

 socket.on("userLeft",user=>{
   addMessage("🔴 "+(user.name||"User")+" left the room");
 });

 socket.on("message",data=>{
   addMessage(
     "<b>"+escapeHtml(data.name)+":</b> "+
     escapeHtml(data.message)
   );
 });
}

function renderUsers(users){

 users=Array.isArray(users)?users:[];

 document.getElementById("count").textContent=
   users.length+"/9";

 for(let i=0;i<9;i++){

   const seat=document.getElementById("seat"+i);
   const name=document.getElementById("name"+i);

   seat.innerHTML="+";
   seat.classList.add("empty");
   name.textContent="";
 }

 users.slice(0,9).forEach((u,i)=>{

   const seat=document.getElementById("seat"+i);
   const name=document.getElementById("name"+i);

   seat.classList.remove("empty");

   if(u.dp){
     seat.innerHTML=
       '<img src="'+escapeAttr(u.dp)+'" alt="">';
   }else{
     seat.textContent=
       (u.name||"U").substring(0,2).toUpperCase();
   }

   name.textContent=u.name||"User";
 });
}

function sendMessage(){

 const input=document.getElementById("message");
 const message=input.value.trim();

 if(!message||!socket)return;

 socket.emit("message",{
   roomId:ROOM_ID,
   name:USER_NAME,
   message:message
 });

 input.value="";
}

function addMessage(text){

 const box=document.getElementById("messages");

 const div=document.createElement("div");
 div.className="msg";
 div.innerHTML=text;

 box.appendChild(div);
 box.scrollTop=box.scrollHeight;
}

function toggleMic(){

 mic=!mic;

 document.getElementById("micBtn").textContent=
   mic?"🎙️":"🔇";

 if(socket){
   socket.emit("micStatus",{
     roomId:ROOM_ID,
     name:USER_NAME,
     mic:mic
   });
 }

 addMessage(mic?"🎙️ Mic ON":"🔇 Mic OFF");
}

function toggleSpeaker(){

 speaker=!speaker;

 addMessage(
   speaker?"🔊 Speaker ON":"🔇 Speaker OFF"
 );
}

function emoji(){

 const e=prompt(
 "Emoji: 😀 😂 😍 😘 😭 😡 😴 👻 😎 🤔 🥳 🤑 ❤️"
 );

 if(e){
   document.getElementById("message").value+=e;
 }
}

function invite(){

 const link=location.href;

 if(navigator.clipboard){
   navigator.clipboard.writeText(link);
   alert("Room invite link copied!");
 }else{
   alert(link);
 }
}

function leaveRoom(){

 if(socket){
   socket.emit("leaveRoom",{
     roomId:ROOM_ID,
     name:USER_NAME
   });

   socket.disconnect();
 }

 location.href="index.html";
}

function roomSettings(){
 alert("Room Settings\n\nHost controls will be added here.");
}

function support(){alert("Room Support")}
function wheel(){alert("Lucky Wheel")}
function bounty(){alert("Bounty Hunter")}
function reward(){alert("Room Reward")}
function benefits(){alert("Exclusive Benefits")}
function showInbox(){alert("Inbox")}
function more(){alert("Share • Bag • Report • Admin")}

function escapeHtml(str){
 return String(str).replace(/[&<>"']/g,m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
 }[m]));
}

function escapeAttr(str){
 return String(str).replace(/"/g,"&quot;");
}

connect();
</script>

</body>
</html>
