<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PawanVoice Room</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#05060d;
 color:#fff;
}
.roomApp{
 max-width:520px;
 margin:auto;
 min-height:100vh;
 background:
 radial-gradient(circle at 50% 20%,#30205c 0,#111329 30%,#05060d 70%);
 padding-bottom:95px;
}
.header{
 padding:14px;
 display:flex;
 align-items:center;
 gap:10px;
 background:linear-gradient(180deg,rgba(5,6,13,.95),rgba(5,6,13,.45));
}
.back{
 width:40px;height:40px;
 border-radius:14px;
 background:#ffffff13;
 color:white;
 font-size:20px;
}
.roomDp{
 width:48px;height:48px;
 border-radius:15px;
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,#7c3aed,#ec4899);
 font-size:24px;
}
.title{flex:1}
.title b{display:block;font-size:16px}
.title small{color:#a5abc2}
.headBtn{
 background:#ffffff12;
 color:white;
 width:40px;height:40px;
 border-radius:13px;
}
.owner{
 text-align:center;
 padding:14px 0 8px;
}
.ownerAvatar{
 width:90px;
 height:90px;
 margin:auto;
 border-radius:50%;
 background:linear-gradient(135deg,#9333ea,#ec4899);
 border:4px solid #ffd75a;
 display:grid;
 place-items:center;
 font-size:40px;
}
.owner .crown{
 color:#ffd75a;
 font-size:25px;
}
.owner b{display:block;margin-top:5px}
.owner small{color:#9ea4bd}
.seats{
 padding:10px 12px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px 8px;
}
.seat{
 text-align:center;
 min-width:0;
}
.seatAvatar{
 width:58px;
 height:58px;
 margin:auto;
 border-radius:50%;
 background:#1a1d31;
 border:2px solid #3b405b;
 display:grid;
 place-items:center;
 font-size:25px;
 position:relative;
}
.seatAvatar.online{border-color:#22c55e}
.seatAvatar.ownerSeat{border-color:#facc15}
.mic{
 position:absolute;
 right:-3px;
 bottom:-3px;
 width:21px;
 height:21px;
 display:grid;
 place-items:center;
 background:#16a34a;
 border-radius:50%;
 font-size:11px;
}
.seatName{
 display:block;
 margin-top:5px;
 font-size:11px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 color:#d7d9e5;
}
.tools{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 padding:12px;
}
.tool{
 background:#171a2c;
 border:1px solid #292e4b;
 border-radius:16px;
 padding:11px 4px;
 text-align:center;
 color:#fff;
 font-size:11px;
}
.tool strong{
 display:block;
 font-size:23px;
 margin-bottom:4px;
}
.exp{
 margin:4px 12px 10px;
 padding:13px;
 border-radius:17px;
 background:linear-gradient(100deg,#211b45,#13172a);
 border:1px solid #38325d;
}
.expTop{
 display:flex;
 justify-content:space-between;
 font-size:12px;
 color:#c6c9da;
}
.expBar{
 height:8px;
 background:#292d42;
 border-radius:20px;
 margin-top:9px;
 overflow:hidden;
}
.expBar i{
 display:block;
 width:68%;
 height:100%;
 background:linear-gradient(90deg,#7c3aed,#ec4899);
}
.chat{
 margin:12px;
 padding:12px;
 height:130px;
 overflow:auto;
 background:rgba(8,10,20,.58);
 border-radius:17px;
}
.msg{
 margin-bottom:8px;
 font-size:13px;
}
.msg b{color:#c084fc}
.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(520px,100%);
 padding:9px;
 background:rgba(8,9,18,.97);
 border-top:1px solid #282d45;
 z-index:20;
}
.chatRow{
 display:flex;
 gap:7px;
}
.chatRow input{
 flex:1;
 padding:12px;
 background:#171a2c;
 color:white;
 border:1px solid #303650;
 border-radius:15px;
 outline:0;
}
.chatRow button{
 width:45px;
 border-radius:14px;
 background:#252a42;
 color:white;
}
.chatRow button.gift{background:#7c3aed}
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.72);
 display:none;
 align-items:flex-end;
 z-index:100;
}
.modal.show{display:flex}
.sheet{
 width:min(520px,100%);
 margin:auto auto 0;
 padding:20px;
 border-radius:25px 25px 0 0;
 background:#121528;
 max-height:80vh;
 overflow:auto;
}
.sheet button{
 width:100%;
 margin-top:8px;
 padding:13px;
 border-radius:13px;
 background:#252a42;
 color:white;
}
.gifts{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
}
.gift{
 padding:12px 4px;
 border-radius:14px;
 background:#1b1f35;
 text-align:center;
 cursor:pointer;
}
</style>
</head>

<body>

<div class="roomApp">

<div class="header">
 <button class="back" onclick="goHome()">←</button>

 <div class="roomDp">🎙️</div>

 <div class="title">
  <b id="roomTitle">PawanVoice Room</b>
  <small id="roomMeta">General • 0/9</small>
 </div>

 <button class="headBtn" onclick="openSheet('settings')">⚙️</button>
 <button class="headBtn" onclick="openSheet('invite')">📤</button>
</div>

<div class="owner">
 <div class="crown">👑</div>
 <div class="ownerAvatar">👤</div>
 <b id="ownerName">HOST</b>
 <small>Room Owner</small>
</div>

<div class="seats" id="seats"></div>

<div class="tools">

<button class="tool" onclick="openSheet('support')">
 <strong>❤️</strong>Support
</button>

<button class="tool" onclick="openSheet('lucky')">
 <strong>🎡</strong>Lucky
</button>

<button class="tool" onclick="openSheet('bounty')">
 <strong>🎯</strong>Bounty
</button>

<button class="tool" onclick="openSheet('reward')">
 <strong>🎁</strong>Reward
</button>

<button class="tool" onclick="openSheet('family')">
 <strong>👑</strong>Family
</button>

<button class="tool" onclick="openSheet('ranking')">
 <strong>🏆</strong>Ranking
</button>

<button class="tool" onclick="openSheet('gift')">
 <strong>🎁</strong>Gift
</button>

<button class="tool" onclick="openSheet('more')">
 <strong>•••</strong>More
</button>

</div>

<div class="exp">
 <div class="expTop">
  <span>🚀 Room EXP</span>
  <span id="expText">680 / 1000</span>
 </div>
 <div class="expBar"><i></i></div>
</div>

<div class="chat" id="chat">
 <div class="msg"><b>System:</b> Welcome to PawanVoice Room 🎙️</div>
</div>

<div class="bottom">
 <div class="chatRow">
  <input id="message" placeholder="Message..." onkeydown="enterSend(event)">
  <button onclick="toggleMic()" id="micBtn">🎤</button>
  <button onclick="toggleSpeaker()" id="speakerBtn">🔊</button>
  <button class="gift" onclick="openSheet('gift')">🎁</button>
  <button onclick="sendMessage()">➤</button>
 </div>
</div>

</div>

<div class="modal" id="modal">
 <div class="sheet">
  <button onclick="closeSheet()">✕ Close</button>
  <h3 id="sheetTitle">PawanVoice</h3>
  <div id="sheetContent"></div>
 </div>
</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"148446327241",
 appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let uid="";
let roomId=new URLSearchParams(location.search).get("room");
let micOn=true;
let speakerOn=true;

firebase.auth().signInAnonymously().then(result=>{
 uid=result.user.uid;
 startRoom();
}).catch(()=>{
 uid=localStorage.getItem("pawanUid")||("guest_"+Date.now());
 localStorage.setItem("pawanUid",uid);
 startRoom();
});

function startRoom(){

 if(!roomId){
  alert("Room ID नहीं मिला");
  goHome();
  return;
 }

 db.ref("rooms/"+roomId).once("value").then(snap=>{
  if(!snap.exists()){
   alert("Room नहीं मिला");
   goHome();
   return;
  }

  const room=snap.val();

  document.getElementById("roomTitle").innerText=room.name||"PawanVoice Room";
  document.getElementById("ownerName").innerText=room.ownerName||"HOST";

  joinRoom(room);
  listenMembers();
  listenChat();
 });
}

function joinRoom(room){

 const name=localStorage.getItem("pawanName")||"PAWAN";

 db.ref("rooms/"+roomId+"/members/"+uid).set({
  uid:uid,
  name:name,
  owner:room.ownerUid===uid,
  mic:true,
  joinedAt:firebase.database.ServerValue.TIMESTAMP
 });

 db.ref("rooms/"+roomId+"/members/"+uid).onDisconnect().remove();
}

function listenMembers(){

 db.ref("rooms/"+roomId+"/members").on("value",snap=>{

  const members=[];

  snap.forEach(child=>{
   members.push(child.val());
  });

  document.getElementById("roomMeta").innerText=
   "General • "+members.length+"/9";

  const seats=document.getElementById("seats");
  seats.innerHTML="";

  for(let i=0;i<8;i++){
   const m=members[i+1];

   if(m){
    seats.innerHTML+=`
     <div class="seat" onclick="userMenu('${escapeAttr(m.uid)}','${escapeAttr(m.name||"User")}')">
      <div class="seatAvatar ${m.mic?'online':''}">
       👤
       <span class="mic">${m.mic?'🎤':'🔇'}</span>
      </div>
      <span class="seatName">${escapeHtml(m.name||"User")}</span>
     </div>
    `;
   }else{
    seats.innerHTML+=`
     <div class="seat">
      <div class="seatAvatar">＋</div>
      <span class="seatName">Empty</span>
     </div>
    `;
   }
  }

  updateMembersCount(members.length);
 });
}

function updateMembersCount(count){
 db.ref("rooms/"+roomId+"/membersCount").set(count);
}

function listenChat(){

 db.ref("rooms/"+roomId+"/chat")
 .limitToLast(30)
 .on("value",snap=>{

  const chat=document.getElementById("chat");
  chat.innerHTML="";

  snap.forEach(child=>{
   const m=child.val();

   chat.innerHTML+=`
    <div class="msg">
     <b>${escapeHtml(m.name||"User")}:</b>
     ${escapeHtml(m.text||"")}
    </div>
   `;
  });

  chat.scrollTop=chat.scrollHeight;
 });
}

function sendMessage(){

 const input=document.getElementById("message");
 const text=input.value.trim();

 if(!text)return;

 const name=localStorage.getItem("pawanName")||"PAWAN";

 db.ref("rooms/"+roomId+"/chat").push({
  uid:uid,
  name:name,
  text:text,
  time:firebase.database.ServerValue.TIMESTAMP
 });

 input.value="";
}

function enterSend(e){
 if(e.key==="Enter"){
  sendMessage();
 }
}

function toggleMic(){

 micOn=!micOn;

 document.getElementById("micBtn").innerText=
  micOn?"🎤":"🔇";

 db.ref("rooms/"+roomId+"/members/"+uid+"/mic").set(micOn);
}

function toggleSpeaker(){

 speakerOn=!speakerOn;

 document.getElementById("speakerBtn").innerText=
  speakerOn?"🔊":"🔇";
}

function userMenu(targetUid,name){

 openCustomSheet(
  "👤 "+name,
  `
  <p>User ID: ${escapeHtml(targetUid)}</p>
  <button onclick="userAction('Profile','${escapeAttr(targetUid)}')">👤 View Profile</button>
  <button onclick="userAction('Follow','${escapeAttr(targetUid)}')">➕ Follow</button>
  <button onclick="userAction('Message','${escapeAttr(targetUid)}')">💬 Message</button>
  <button onclick="userAction('Make Admin','${escapeAttr(targetUid)}')">🛡️ Make Admin</button>
  <button onclick="userAction('Kick','${escapeAttr(targetUid)}')">🚫 Kick</button>
  `
 );
}

function userAction(action,target){

 closeSheet();

 if(action==="Kick"){
  if(confirm("इस user को room से remove करना है?")){
   db.ref("rooms/"+roomId+"/members/"+target).remove();
  }
  return;
 }

 alert(action+" selected for "+target);
}

function openSheet(type){

 let title="";
 let content="";

 if(type==="settings"){
  title="⚙️ Room Settings";
  content=`
   <button onclick="alert('Room settings')">Room Name</button>
   <button onclick="alert('Room category')">Category</button>
   <button onclick="alert('Room password')">Password</button>
   <button onclick="alert('Room announcement')">Announcement</button>
  `;
 }

 if(type==="invite"){
  title="📤 Invite Friends";
  content=`
   <p>Room ID</p>
   <button onclick="copyRoomId()">📋 Copy Room ID</button>
   <button onclick="alert('Friend invite screen')">👥 Invite Friends</button>
  `;
 }

 if(type==="support"){
  title="❤️ Room Support";
  content=`
   <p>Support this room with gifts and activity.</p>
   <button onclick="openSheet('gift')">🎁 Send Gift</button>
  `;
 }

 if(type==="lucky"){
  title="🎡 Lucky Wheel";
  content=`
   <p>Lucky Wheel</p>
   <button onclick="alert('Lucky Wheel feature')">🎡 SPIN</button>
  `;
 }

 if(type==="bounty"){
  title="🎯 Bounty Hunter";
  content=`
   <p>Complete room missions and earn rewards.</p>
   <button onclick="alert('Bounty started')">START BOUNTY</button>
  `;
 }

 if(type==="reward"){
  title="🎁 Room Reward";
  content=`
   <p>Room EXP reward system</p>
   <button onclick="alert('Reward claimed')">CLAIM</button>
  `;
 }

 if(type==="family"){
  title="👑 Family";
  content=`
   <p>Family members, level and ranking.</p>
   <button onclick="alert('Family')">OPEN FAMILY</button>
  `;
 }

 if(type==="ranking"){
  title="🏆 Room Ranking";
  content=`
   <button>🏆 Host Ranking</button>
   <button>💎 Rich Ranking</button>
   <button>💜 CP Ranking</button>
   <button>👑 Family Ranking</button>
  `;
 }

 if(type==="gift"){
  title="🎁 Gifts";

  content=`
   <div class="gifts">
    <div class="gift" onclick="sendGift('Rose')">🌹<br>Rose</div>
    <div class="gift" onclick="sendGift('Heart')">❤️<br>Heart</div>
    <div class="gift" onclick="sendGift('Crown')">👑<br>Crown</div>
    <div class="gift" onclick="sendGift('Diamond')">💎<br>Diamond</div>
    <div class="gift" onclick="sendGift('Rocket')">🚀<br>Rocket</div>
    <div class="gift" onclick="sendGift('Car')">🚗<br>Car</div>
    <div class="gift" onclick="sendGift('Castle')">🏰<br>Castle</div>
    <div class="gift" onclick="sendGift('Dragon')">🐉<br>Dragon</div>
   </div>
  `;
 }

 if(type==="more"){
  title="••• More";
  content=`
   <button>🎵 Music</button>
   <button>🎤 Karaoke</button>
   <button>📊 Room Stats</button>
   <button>🚨 Report Room</button>
   <button>⭐ Favorite Room</button>
  `;
 }

 openCustomSheet(title,content);
}

function sendGift(gift){

 const name=localStorage.getItem("pawanName")||"PAWAN";

 db.ref("rooms/"+roomId+"/gifts").push({
  gift:gift,
  sender:uid,
  senderName:name,
  time:firebase.database.ServerValue.TIMESTAMP
 });

 alert(gift+" gift sent 🎁");
}

function copyRoomId(){
 alert("Room ID: "+roomId);
}

function openCustomSheet(title,content){
 document.getElementById("sheetTitle").innerText=title;
 document.getElementById("sheetContent").innerHTML=content;
 document.getElementById("modal").classList.add("show");
}

function closeSheet(){
 document.getElementById("modal").classList.remove("show");
}

function goHome(){
 location.href="index.html";
}

function escapeHtml(text){
 return String(text)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function escapeAttr(text){
 return String(text).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
</script>

</body>
</html>
