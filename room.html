<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PawanVoice Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 18%,rgba(112,72,190,.35),transparent 35%),
    linear-gradient(180deg,#160d2d 0%,#0d1029 55%,#08091a 100%);
  color:#fff;
  min-height:100vh;
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:white;
  cursor:pointer;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

/* HEADER */
.header{
  height:76px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:9px;
  background:rgba(18,12,40,.72);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  flex-shrink:0;
}

.back{
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  font-size:23px;
}

.room-dp{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #a778ff;
  background:#302050;
}

.room-info{
  flex:1;
  min-width:0;
}

.room-name{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-id{
  margin-top:4px;
  color:#b8afd0;
  font-size:11px;
}

.header-actions{
  display:flex;
  gap:6px;
}

.header-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(255,255,255,.09);
  font-size:18px;
}

.count{
  font-size:11px;
  color:#d8cef0;
  text-align:center;
  min-width:30px;
}

/* MAIN */
.main{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:8px 10px 90px;
}

/* TOP INFO */
.room-title{
  text-align:center;
  color:#cfc2ed;
  font-size:12px;
  margin:3px 0 8px;
}

/* SEATS */
.seats{
  width:100%;
}

.host-row{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px 6px;
}

.seat-wrap{
  min-width:0;
  text-align:center;
}

.seat{
  position:relative;
  width:62px;
  height:62px;
  margin:auto;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,#9e67ff,#4c82ff);
  box-shadow:0 4px 20px rgba(103,79,255,.22);
}

.host-seat .seat{
  width:82px;
  height:82px;
  background:linear-gradient(135deg,#ffd86b,#b66cff,#6e8cff);
}

.seat.empty{
  background:rgba(255,255,255,.08);
  border:2px dashed rgba(255,255,255,.18);
  padding:0;
}

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#21163d;
}

.mic-status{
  position:absolute;
  right:-2px;
  bottom:0;
  width:21px;
  height:21px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:11px;
  background:#30264b;
  border:1px solid rgba(255,255,255,.25);
}

.seat-number{
  position:absolute;
  left:-2px;
  top:1px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:10px;
  background:rgba(0,0,0,.55);
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.user-name{
  margin-top:5px;
  color:#eee8fa;
  font-size:11px;
  line-height:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.host-label{
  margin-top:3px;
  font-size:10px;
  color:#ffd66f;
}

/* FEATURES */
.features{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:18px;
}

.feature{
  min-height:53px;
  border-radius:13px;
  background:linear-gradient(180deg,rgba(113,75,176,.32),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.07);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  font-size:9px;
  color:#ddd5ee;
}

.feature-icon{
  font-size:19px;
}

/* EXP */
.exp-box{
  margin-top:13px;
  border-radius:16px;
  padding:9px 12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.06);
}

.exp-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  color:#ddd3ef;
}

.exp-bar{
  height:7px;
  margin-top:7px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.1);
}

.exp-fill{
  width:22%;
  height:100%;
  border-radius:10px;
  background:linear-gradient(90deg,#9d61ff,#ff75ce);
}

.exp-ranks{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:10px;
  color:#bcb1d4;
}

/* CHAT */
.chat-area{
  margin-top:12px;
  min-height:45px;
  max-height:125px;
  overflow-y:auto;
}

.message{
  display:flex;
  gap:7px;
  margin:5px 0;
  align-items:flex-start;
}

.message-avatar{
  width:25px;
  height:25px;
  border-radius:50%;
  object-fit:cover;
}

.message-bubble{
  max-width:75%;
  padding:7px 10px;
  border-radius:11px;
  background:rgba(255,255,255,.09);
  font-size:11px;
  line-height:15px;
}

.message-name{
  color:#b887ff;
  font-size:10px;
  margin-bottom:2px;
}

/* BOTTOM */
.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(11,9,27,.94);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(15px);
  z-index:20;
}

.bottom-row{
  display:flex;
  gap:7px;
  align-items:center;
}

.chat-input{
  flex:1;
  height:42px;
  min-width:0;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  border-radius:22px;
  padding:0 14px;
  color:white;
  background:rgba(255,255,255,.08);
}

.chat-input::placeholder{
  color:#958ca8;
}

.control{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  font-size:18px;
}

.control.active{
  background:linear-gradient(135deg,#8655ff,#c15fff);
}

.control.off{
  background:#4b2735;
}

/* EMOJI */
.emoji-panel{
  display:none;
  position:absolute;
  left:8px;
  right:8px;
  bottom:63px;
  padding:10px;
  border-radius:16px;
  background:#18132c;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  grid-template-columns:repeat(8,1fr);
  gap:7px;
  z-index:30;
}

.emoji-panel.show{
  display:grid;
}

.emoji{
  height:35px;
  border-radius:9px;
  background:rgba(255,255,255,.06);
  font-size:20px;
}

/* MODAL */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.65);
  align-items:flex-end;
  justify-content:center;
}

.overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:520px;
  max-height:82vh;
  overflow-y:auto;
  border-radius:22px 22px 0 0;
  background:#18132c;
  padding:18px;
  border-top:1px solid rgba(255,255,255,.12);
}

.modal-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:14px;
}

.modal-close{
  float:right;
  width:30px;
  height:30px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
}

.user-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
}

.user-card img{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
}

.user-card-info{
  flex:1;
}

.user-card-name{
  font-weight:bold;
}

.user-card-id{
  color:#aaa0ba;
  font-size:11px;
  margin-top:4px;
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:14px;
}

.action{
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  text-align:center;
}

.action.danger{
  background:rgba(255,60,90,.18);
}

.setting{
  margin:9px 0;
}

.setting label{
  display:block;
  font-size:12px;
  color:#bbb1ca;
  margin-bottom:6px;
}

.setting input{
  width:100%;
  height:42px;
  border:0;
  outline:none;
  border-radius:11px;
  background:rgba(255,255,255,.08);
  color:#fff;
  padding:0 12px;
}

.primary{
  width:100%;
  height:44px;
  margin-top:10px;
  border-radius:12px;
  background:linear-gradient(90deg,#7652ff,#b75fff);
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  z-index:300;
  padding:10px 16px;
  border-radius:20px;
  background:rgba(0,0,0,.82);
  font-size:12px;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADING */
.loading{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0c0920;
  flex-direction:column;
  gap:12px;
}

.spinner{
  width:38px;
  height:38px;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:#a36aff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* RESPONSIVE */
@media(max-width:360px){
  .seat{
    width:55px;
    height:55px;
  }

  .host-seat .seat{
    width:74px;
    height:74px;
  }

  .features{
    gap:4px;
  }

  .feature{
    font-size:8px;
  }

  .control{
    width:39px;
    height:39px;
  }
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>Connecting to PawanVoice...</div>
</div>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <button class="back" onclick="goHome()">‹</button>

    <img id="roomDP" class="room-dp" src="" alt="Room">

    <div class="room-info">
      <div class="room-name" id="roomName">PawanVoice Room</div>
      <div class="room-id" id="roomIdText">Room: PV824991</div>
    </div>

    <div class="count" id="count">0/9</div>

    <div class="header-actions">
      <button class="header-btn" onclick="openSettings()">⚙️</button>
      <button class="header-btn" onclick="inviteRoom()">↗️</button>
    </div>

  </header>

  <main class="main">

    <div class="room-title" id="hostText">
      PawanVoice • 9 Seat Room
    </div>

    <!-- HOST -->
    <div class="host-row">
      <div class="seat-wrap host-seat" id="seatWrap1">
      </div>
    </div>

    <!-- SEATS 2-9 -->
    <div class="grid" id="seatGrid"></div>

    <!-- FEATURES -->
    <div class="features">

      <button class="feature" onclick="featureMessage('Room Support')">
        <span class="feature-icon">🛟</span>
        <span>Support</span>
      </button>

      <button class="feature" onclick="featureMessage('Lucky Wheel')">
        <span class="feature-icon">🎡</span>
        <span>Lucky Wheel</span>
      </button>

      <button class="feature" onclick="featureMessage('Bounty Hunter')">
        <span class="feature-icon">🎯</span>
        <span>Bounty</span>
      </button>

      <button class="feature" onclick="featureMessage('Room Reward')">
        <span class="feature-icon">🎁</span>
        <span>Reward</span>
      </button>

      <button class="feature" onclick="featureMessage('Exclusive Benefits')">
        <span class="feature-icon">🚀</span>
        <span>Benefits</span>
      </button>

    </div>

    <!-- EXP -->
    <div class="exp-box">

      <div class="exp-top">
        <span>🚀 Room EXP</span>
        <span id="levelText">LV.1</span>
      </div>

      <div class="exp-bar">
        <div class="exp-fill" id="expFill"></div>
      </div>

      <div class="exp-ranks">
        <span>🏆 Top 1</span>
        <span>🥈 Top 2</span>
        <span>🥉 Top 3</span>
      </div>

    </div>

    <!-- CHAT -->
    <div class="chat-area" id="chatArea"></div>

  </main>

  <!-- EMOJI -->
  <div class="emoji-panel" id="emojiPanel">

    <button class="emoji" onclick="sendEmoji('😡')">😡</button>
    <button class="emoji" onclick="sendEmoji('😭')">😭</button>
    <button class="emoji" onclick="sendEmoji('😵')">😵</button>
    <button class="emoji" onclick="sendEmoji('🔨')">🔨</button>
    <button class="emoji" onclick="sendEmoji('😊')">😊</button>
    <button class="emoji" onclick="sendEmoji('😘')">😘</button>
    <button class="emoji" onclick="sendEmoji('😂')">😂</button>
    <button class="emoji" onclick="sendEmoji('😴')">😴</button>

    <button class="emoji" onclick="sendEmoji('😧')">😧</button>
    <button class="emoji" onclick="sendEmoji('😁')">😁</button>
    <button class="emoji" onclick="sendEmoji('👻')">👻</button>
    <button class="emoji" onclick="sendEmoji('😎')">😎</button>
    <button class="emoji" onclick="sendEmoji('🥵')">🥵</button>
    <button class="emoji" onclick="sendEmoji('🤗')">🤗</button>
    <button class="emoji" onclick="sendEmoji('❤️')">❤️</button>
    <button class="emoji" onclick="sendEmoji('💰')">💰</button>

    <button class="emoji" onclick="sendEmoji('🥳')">🥳</button>
    <button class="emoji" onclick="sendEmoji('🥺')">🥺</button>
    <button class="emoji" onclick="sendEmoji('😤')">😤</button>
    <button class="emoji" onclick="sendEmoji('❓')">❓</button>
    <button class="emoji" onclick="sendEmoji('🙄')">🙄</button>
    <button class="emoji" onclick="sendEmoji('🤣')">🤣</button>
    <button class="emoji" onclick="sendEmoji('🕶️')">🕶️</button>
    <button class="emoji" onclick="sendEmoji('🤔')">🤔</button>

  </div>

  <!-- BOTTOM CONTROLS -->
  <div class="bottom">

    <div class="bottom-row">

      <input
        id="messageInput"
        class="chat-input"
        placeholder="Say something..."
        maxlength="300"
        onkeydown="handleChatKey(event)"
      >

      <button class="control" onclick="toggleEmoji()">😊</button>

      <button
        id="speakerBtn"
        class="control active"
        onclick="toggleSpeaker()"
      >🔊</button>

      <button
        id="micBtn"
        class="control off"
        onclick="toggleMic()"
      >🎙️</button>

      <button
        class="control"
        onclick="openInbox()"
      >💌</button>

      <button
        class="control"
        onclick="openMore()"
      >•••</button>

    </div>

  </div>

</div>

<!-- USER MODAL -->
<div class="overlay" id="userOverlay" onclick="closeOverlay(event,'userOverlay')">

  <div class="modal">

    <button class="modal-close" onclick="hide('userOverlay')">×</button>

    <div class="modal-title">User Profile</div>

    <div class="user-card">

      <img id="modalUserDP" src="" alt="DP">

      <div class="user-card-info">
        <div class="user-card-name" id="modalUserName">User</div>
        <div class="user-card-id" id="modalUserId">ID: -</div>
      </div>

    </div>

    <div class="action-grid" id="userActions">

      <button class="action" onclick="viewUser()">👤 View Profile</button>
      <button class="action" onclick="giftUser()">🎁 Gift</button>
      <button class="action" onclick="makeAdmin()">🛡️ Make Admin</button>
      <button class="action" onclick="removeAdmin()">🔓 Remove Admin</button>
      <button class="action" onclick="kickUser()">🚪 Kick</button>
      <button class="action danger" onclick="banUser()">🚫 Ban</button>

    </div>

  </div>

</div>

<!-- SETTINGS -->
<div class="overlay" id="settingsOverlay" onclick="closeOverlay(event,'settingsOverlay')">

  <div class="modal">

    <button class="modal-close" onclick="hide('settingsOverlay')">×</button>

    <div class="modal-title">Room Settings</div>

    <div class="setting">
      <label>Room Name</label>
      <input id="newRoomName" maxlength="40" placeholder="Room name">
    </div>

    <button class="primary" onclick="changeRoomName()">
      Save Room Name
    </button>

    <button class="primary" onclick="leaveRoom()">
      Leave Room
    </button>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   PAWANVOICE SERVER
========================================================= */

const SERVER = "https://pawanvoice-1.onrender.com";

const socket = io(SERVER,{
  transports:["websocket","polling"],
  reconnection:true,
  reconnectionAttempts:Infinity,
  reconnectionDelay:1000
});


/* =========================================================
   LOCAL USER
========================================================= */

let userId =
  localStorage.getItem("pawanvoice_user_id") ||
  ("PVU" + Date.now() + Math.random().toString(36).slice(2,7));

let userName =
  localStorage.getItem("pawanvoice_name") ||
  "Pawan";

let userDP =
  localStorage.getItem("pawanvoice_dp") ||
  createAvatar(userName);

localStorage.setItem("pawanvoice_user_id",userId);
localStorage.setItem("pawanvoice_name",userName);
localStorage.setItem("pawanvoice_dp",userDP);


/* =========================================================
   ROOM ID
========================================================= */

const params = new URLSearchParams(location.search);

const roomId =
  params.get("room") ||
  localStorage.getItem("pawanvoice_room") ||
  "PV824991";

localStorage.setItem("pawanvoice_room",roomId);

document.getElementById("roomIdText").textContent =
  "Room: " + roomId;


/* =========================================================
   STATE
========================================================= */

let roomState = null;
let selectedUser = null;

let micOn = false;
let speakerOn = true;

let localStream = null;

const peers = {};

let joined = false;


/* =========================================================
   AVATAR
========================================================= */

function createAvatar(name){

  const letter =
    String(name || "P")
      .trim()
      .charAt(0)
      .toUpperCase() || "P";

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="200"
       height="200">
    <rect width="200" height="200" rx="100" fill="#39235f"/>
    <text x="100"
          y="120"
          text-anchor="middle"
          font-size="95"
          font-family="Arial"
          fill="white">${letter}</text>
  </svg>`;

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg);
}


/* =========================================================
   ROOM DP
========================================================= */

document.getElementById("roomDP").src =
  createAvatar("P");


/* =========================================================
   SOCKET CONNECT
========================================================= */

socket.on("connect",()=>{

  console.log("Connected:",socket.id);

  hideLoading();

  socket.emit("join-room",{
    roomId:roomId,
    userId:userId,
    name:userName,
    dp:userDP
  });

});


socket.on("connect_error",(error)=>{

  console.error(error);

  showToast("Server connection error");

  hideLoading();

});


socket.on("disconnect",()=>{

  showToast("Disconnected. Reconnecting...");

});


socket.on("room-state",(room)=>{

  roomState = room;

  joined = true;

  hideLoading();

  renderRoom(room);

});


socket.on("room-created",(room)=>{

  roomState = room;

  renderRoom(room);

});


socket.on("error-message",(message)=>{

  showToast(message || "Something went wrong");

});


socket.on("kicked",()=>{

  alert("You were removed from this room.");

  goHome();

});


socket.on("banned",()=>{

  alert("You are banned from this room.");

  goHome();

});


socket.on("user-left",(user)=>{

  if(user && user.userId){

    closePeer(user.userId);

  }

});


/* =========================================================
   ROOM RENDER
========================================================= */

function renderRoom(room){

  if(!room) return;

  const users =
    Array.isArray(room.users)
      ? room.users
      : [];

  document.getElementById("count").textContent =
    users.length + "/9";

  document.getElementById("roomName").textContent =
    room.roomName || "PawanVoice Room";

  document.getElementById("newRoomName").value =
    room.roomName || "PawanVoice Room";

  const host =
    users.find(u=>u.isHost) || null;

  document.getElementById("hostText").textContent =
    host
      ? "Host: " + host.name
      : "PawanVoice • 9 Seat Room";

  renderSeat(1,host,true);

  const grid =
    document.getElementById("seatGrid");

  grid.innerHTML = "";

  for(let i=2;i<=9;i++){

    const user =
      users.find(u=>Number(u.seatNo) === i) || null;

    const wrap =
      document.createElement("div");

    wrap.className = "seat-wrap";

    wrap.id = "seatWrap" + i;

    grid.appendChild(wrap);

    renderSeat(i,user,false);

  }

  /*
    Update room DP using host DP if available.
  */

  if(host && host.dp){

    document.getElementById("roomDP").src =
      host.dp;

  }

  /*
    Keep current mic button synchronized.
  */

  const me =
    users.find(u=>u.userId === userId);

  if(me){

    micOn = !!me.micOn;

    speakerOn =
      me.speakerOn !== false;

    updateControls();

  }

}


/* =========================================================
   RENDER SINGLE SEAT
========================================================= */

function renderSeat(number,user,isHost){

  const wrap =
    document.getElementById("seatWrap" + number);

  if(!wrap) return;

  wrap.innerHTML = "";

  const seat =
    document.createElement("div");

  seat.className =
    "seat" + (!user ? " empty" : "");

  if(isHost){

    seat.classList.add("host-seat");

  }

  if(user){

    seat.innerHTML = `

      <img
        class="avatar"
        src="${safeImage(user.dp,user.name)}"
        alt=""
      >

      <div class="seat-number">
        ${number}
      </div>

      <div class="mic-status">
        ${user.micOn ? "🎙️" : "🔇"}
      </div>

    `;

    seat.onclick = ()=>openUser(user);

  }else{

    seat.innerHTML = `

      <div
        style="
          width:100%;
          height:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:24px;
          color:#716986;
        "
      >
        +
      </div>

      <div class="seat-number">
        ${number}
      </div>

    `;

    seat.onclick = ()=>takeSeat(number);

  }

  wrap.appendChild(seat);

  const name =
    document.createElement("div");

  name.className = "user-name";

  name.textContent =
    user
      ? user.name
      : "Seat " + number;

  wrap.appendChild(name);

  if(isHost && user){

    const label =
      document.createElement("div");

    label.className = "host-label";

    label.textContent =
      user.isAdmin ? "HOST • ADMIN" : "HOST";

    wrap.appendChild(label);

  }

}


/* =========================================================
   SAFE IMAGE
========================================================= */

function safeImage(src,name){

  if(
    typeof src === "string" &&
    (
      src.startsWith("http://") ||
      src.startsWith("https://") ||
      src.startsWith("data:image/")
    )
  ){

    return src;

  }

  return createAvatar(name);

}

/* =========================================================
   MIC
========================================================= */

async function toggleMic(){

  try{

    if(!micOn){

      await startMic();

    }else{

      stopMic();

    }

    micOn = !micOn;

    socket.emit("mic-toggle",{
      roomId:roomId,
      userId:userId,
      micOn:micOn
    });

    updateControls();

  }catch(error){

    console.error(error);

    showToast(
      "Microphone permission allow karein"
    );

  }

}


/* =========================================================
   START MIC
========================================================= */

async function startMic(){

  if(localStream){

    localStream.getTracks()
      .forEach(track=>{
        track.enabled = true;
      });

    return localStream;

  }

  localStream =
    await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      },
      video:false
    });

  /*
    Existing peers receive our audio.
  */

  for(const id in peers){

    const pc = peers[id];

    localStream.getTracks()
      .forEach(track=>{

        try{

          pc.addTrack(
            track,
            localStream
          );

        }catch(e){}

      });

  }

  return localStream;

}


/* =========================================================
   STOP MIC
========================================================= */

function stopMic(){

  if(localStream){

    localStream.getTracks()
      .forEach(track=>{
        track.enabled = false;
      });

  }

}


/* =========================================================
   SPEAKER
========================================================= */

function toggleSpeaker(){

  speakerOn = !speakerOn;

  socket.emit("speaker-toggle",{
    roomId:roomId,
    userId:userId,
    speakerOn:speakerOn
  });

  document
    .querySelectorAll("audio")
    .forEach(audio=>{
      audio.muted = !speakerOn;

}


/* =========================================================
   CONTROL UI
========================================================= */

function updateControls(){

    document.getElementById("micBtn");

  const speaker =
    document.getElementById("speakerBtn");

  );

}


/* =========================================================
   WEBRTC
========================================================= */

const rtcConfig = {

  iceServers:[
    {
      urls:"stun:stun.l.google.com:19302"
    },
    {
      urls:"stun:stun1.l.google.com:19302"
    }
  ]

};


/* =========================================================
   CREATE PEER
========================================================= */

function createPeer(otherUserId){

  if(peers[otherUserId]){

    return peers[otherUserId];

  }

  const pc =
    new RTCPeerConnection(rtcConfig);

  peers[otherUserId] = pc;

  if(localStream){

    localStream.getTracks()
      .forEach(track=>{

        try{

          pc.addTrack(
            track,
            localStream
          );

        }catch(e){}

      });

  }

  pc.onicecandidate = event=>{

    if(event.candidate){

      socket.emit(
        "webrtc-ice-candidate",
        {
          roomId:roomId,
          to:otherUserId,
          candidate:event.candidate
        }
      );

    }

  };

  pc.ontrack = event=>{

    const stream =
      event.streams &&
      event.streams[0];

    if(!stream) return;

    let audio =
      document.getElementById(
        "audio-" + otherUserId
      );

    if(!audio){

      audio =
        document.createElement("audio");

      audio.id =
        "audio-" + otherUserId;

      audio.autoplay = true;

      audio.playsInline = true;

      document.body.appendChild(audio);

    }

    audio.srcObject = stream;

    audio.muted = !speakerOn;

    audio.play().catch(()=>{});

  };

  pc.onconnectionstatechange = ()=>{

    if(
      pc.connectionState === "failed" ||
      pc.connectionState === "closed"
    ){

      closePeer(otherUserId);

    }

  };

  return pc;

}


/* =========================================================
   MAKE OFFERS
========================================================= */

async function connectToUsers(){

  if(!roomState) return;

  const users =
    roomState.users || [];

  for(const user of users){

    if(!user || user.userId === userId)
      continue;

    /*
      Prevent both sides from continuously
      creating offers.
    */

    if(user.userId < userId){

      continue;

    }

    try{

      const pc =
        createPeer(user.userId);

      const offer =
        await pc.createOffer();

      await pc.setLocalDescription(
        offer
      );

      socket.emit(
        "webrtc-offer",
        {
          roomId:roomId,
          to:user.userId,
          offer:offer
        }
      );

    }catch(error){

      console.error(
        "Offer error",
        error
      );

    }

  }

}


/* =========================================================
   WEBRTC OFFER
========================================================= */

socket.on(
  "webrtc-offer",
  async data=>{

    try{

      if(!data || !data.from)
        return;

      /*
        For receiving audio we don't strictly
        need microphone permission.
      */

      const pc =
        createPeer(data.from);

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      if(localStream){

        localStream.getTracks()
          .forEach(track=>{

            const exists =
              pc.getSenders()
                .some(sender=>
                  sender.track === track
                );

            if(!exists){

              pc.addTrack(
                track,
                localStream
              );

            }

          });

      }

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      socket.emit(
        "webrtc-answer",
        {
          roomId:roomId,
          to:data.from,
          answer:answer
        }
      );

    }catch(error){

      console.error(
        "Offer handling error",
        error
      );

    }

  }
);


/* =========================================================
   WEBRTC ANSWER
========================================================= */

socket.on(
  "webrtc-answer",
  async data=>{

    try{

      const pc =
        peers[data.from];

      if(!pc) return;

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

    }catch(error){

      console.error(
        "Answer error",
        error
      );

    }

  }
);


/* =========================================================
   ICE
========================================================= */

socket.on(
  "webrtc-ice-candidate",
  async data=>{

    try{

      const pc =
        peers[data.from];

      if(!pc || !data.candidate)
        return;

      await pc.addIceCandidate(
        new RTCIceCandidate(
          data.candidate
        )
      );

    }catch(error){

      console.error(
        "ICE error",
        error
      );

    }

  }
);


/* =========================================================
   CLOSE PEER
========================================================= */

function closePeer(id){

  const pc =
    peers[id];

  if(pc){

    try{
      pc.close();
    }catch(e){}

    delete peers[id];

  }

  const audio =
    document.getElementById(
      "audio-" + id
    );

  if(audio){

    audio.remove();

  }

}


/* =========================================================
   ROOM STATE -> CONNECT AUDIO
========================================================= */

let connectTimer = null;

socket.on("room-state",()=>{

  clearTimeout(connectTimer);

  connectTimer =
    setTimeout(
      connectToUsers,
      700
    );

});


/* =========================================================
   CHAT
========================================================= */

function handleChatKey(event){

  if(event.key !== "Enter")
    return;

  event.preventDefault();

  sendMessage();

}


function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    input.value.trim();

  if(!message)
    return;

  socket.emit("send-message",{
    roomId:roomId,
    userId:userId,
    message:message
  });

  input.value = "";

}


socket.on("message",(data)=>{

  addMessage(data);

});


socket.on("chat-message",(data)=>{

  addMessage(data);

});


function addMessage(data){

  if(!data) return;

  const area =
    document.getElementById(
      "chatArea"
    );

  const div =
    document.createElement("div");

  div.className =
    "message";

  const avatar =
    safeImage(
      data.dp,
      data.name
    );

  div.innerHTML = `

    <img
      class="message-avatar"
      src="${avatar}"
    >

    <div class="message-bubble">

      <div class="message-name">
        ${escapeHTML(data.name || "User")}
      </div>

      ${escapeHTML(data.message || "")}

    </div>

  `;

  area.appendChild(div);

  while(area.children.length > 25){

    area.removeChild(
      area.firstChild
    );

  }

  area.scrollTop =
    area.scrollHeight;

}

/* =========================================================
   INVITE
========================================================= */

async function inviteRoom(){

  const url =
    location.origin +
    location.pathname +
    "?room=" +
    encodeURIComponent(roomId);

  try{

    if(navigator.share){

      await navigator.share({
        title:"PawanVoice Room",
        text:"Join my PawanVoice room",
        url:url
      });

    }else{

      await navigator.clipboard.writeText(
        url
      );

      showToast(
        "Room link copied"
      );

    }

  }catch(error){

    try{

      await navigator.clipboard.writeText(
        url
      );

      showToast(
        "Room link copied"
      );

    }catch(e){

      showToast(url);

    }

  }

}

/* =========================================================
   UI HELPERS
========================================================= */

function hide(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


function closeOverlay(event,id){

  if(event.target.id === id){

    hide(id);

  }

}


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(()=>{

      toast.classList.remove(
        "show"
      );

    },2200);

}


function hideLoading(){

  const loading =
    document.getElementById(
      "loading"
    );

  loading.style.display =
    "none";

}


function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

   PAGE EXIT
