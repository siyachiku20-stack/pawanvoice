<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PawanVoice Room</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;padding:0;width:100%;height:100%;
 font-family:Arial,sans-serif;
 background:#160b2d;color:#fff
}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{border:0;cursor:pointer}

.app{
 width:100%;max-width:520px;margin:auto;min-height:100vh;
 position:relative;
 background:linear-gradient(180deg,#28104c,#120820);
 overflow:hidden
}

/* HEADER */
.header{
 height:70px;padding:8px 10px;display:flex;align-items:center;gap:9px;
 background:linear-gradient(90deg,#40136d,#7b1fa2);
 position:sticky;top:0;z-index:20
}
.back{
 width:38px;height:38px;border-radius:50%;
 background:#ffffff22;color:white;font-size:22px
}
.room-dp{
 width:46px;height:46px;border-radius:50%;object-fit:cover;
 border:2px solid #ffd54f
}
.room-title{flex:1;min-width:0}
.room-title b{
 display:block;font-size:16px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.room-title small{font-size:11px;color:#ddd}
.head-btn{
 width:38px;height:38px;border-radius:50%;
 background:#ffffff20;color:#fff;font-size:18px
}

/* ROOM TOP */
.top-info{padding:10px}
.stats{
 display:flex;justify-content:space-between;align-items:center;
 background:#ffffff10;border:1px solid #ffffff15;
 border-radius:14px;padding:9px 12px
}
.stats span{font-size:12px;color:#ddd}
.stats b{color:#fff}

/* BANNER */
.room-banner{
 margin:0 10px;height:72px;border-radius:17px;padding:12px;
 background:linear-gradient(135deg,#7927b8,#ef3b83);
 display:flex;align-items:center;
 box-shadow:0 8px 25px #0005
}
.room-banner b{font-size:18px}
.room-banner small{
 display:block;margin-top:5px;color:#f5dfff
}

/* SEATS */
.seats{padding:14px 10px 5px}
.host-wrap{
 display:flex;justify-content:center;margin-bottom:14px
}
.seat{
 width:70px;text-align:center;position:relative;cursor:pointer
}
.avatar{
 width:58px;height:58px;border-radius:50%;object-fit:cover;
 border:2px solid #8e6cff;background:#27133c
}
.seat.host .avatar{
 width:72px;height:72px;border-color:#ffd54f
}
.seat-name{
 margin-top:4px;font-size:11px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.seat-num{
 position:absolute;top:-3px;left:3px;background:#0009;
 border-radius:10px;padding:2px 6px;font-size:9px
}
.mic-dot{
 position:absolute;right:2px;bottom:20px;width:18px;height:18px;
 border-radius:50%;background:#25d366;font-size:11px;
 display:flex;align-items:center;justify-content:center
}
.seat-row{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:8px;margin-top:8px
}
.empty .avatar{opacity:.45}

/* ROOM FEATURES */
.features-box{
 padding:10px 10px 12px
}
.features-button{
 width:100%;
 min-height:54px;
 border-radius:16px;
 background:linear-gradient(135deg,#8e24aa,#e91e63);
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 box-shadow:0 7px 20px #0005;
 font-weight:bold;
}
.features-button .left{
 display:flex;
 align-items:center;
 gap:10px;
}
.features-button .main-icon{
 font-size:25px
}
.features-button .arrow{
 font-size:20px;
 transition:.2s
}
.features-button.open .arrow{
 transform:rotate(180deg)
}
.features-panel{
 display:none;
 margin-top:8px;
 padding:9px;
 border-radius:16px;
 background:#ffffff09;
 border:1px solid #ffffff12;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
}
.features-panel.show{
 display:grid
}
.feature-item{
 min-height:70px;
 border-radius:13px;
 background:#ffffff0d;
 border:1px solid #ffffff10;
 color:#fff;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
}
.feature-item:active{
 transform:scale(.94);
 background:#ffffff20
}
.feature-item .ico{
 font-size:24px;
 margin-bottom:4px
}
.feature-item span{
 font-size:9px;
 color:#eee;
 text-align:center
}

/* EXP */
.exp-card{
 margin:5px 10px 12px;padding:12px;border-radius:16px;
 background:linear-gradient(135deg,#3a175c,#1f1233);
 border:1px solid #ffffff15
}
.exp-head{
 display:flex;justify-content:space-between;font-size:12px
}
.exp-bar{
 height:8px;border-radius:10px;background:#ffffff15;
 margin:9px 0;overflow:hidden
}
.exp-fill{
 height:100%;width:20%;
 background:linear-gradient(90deg,#ffcc33,#ff4d8d);
 border-radius:10px
}
.tops{
 display:flex;justify-content:center;gap:30px;margin-top:10px
}
.top-user{text-align:center;font-size:9px}
.top-user img{
 width:38px;height:38px;border-radius:50%;
 object-fit:cover;border:2px solid #ffd54f;
 display:block;margin:auto
}

/* CHAT */
.chat-area{margin:0 10px 75px}
.chat-list{
 height:190px;overflow-y:auto;background:#0003;
 border-radius:15px;padding:9px
}
.msg{
 font-size:12px;padding:5px 3px;color:#eee
}
.msg b{color:#ffd54f}
.system{color:#bda9ff}

/* BOTTOM */
.bottom{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:100%;max-width:520px;padding:8px;background:#170b29ee;
 backdrop-filter:blur(12px);display:flex;gap:6px;z-index:30
}
.chat-input{flex:1;min-width:0}
.chat-input input{
 width:100%;height:43px;border-radius:22px;
 border:1px solid #ffffff18;background:#ffffff12;
 color:#fff;padding:0 14px;outline:none
}
.control{
 width:43px;height:43px;border-radius:50%;
 background:#ffffff12;color:#fff;font-size:18px
}
.control.active{background:#8e24aa}
.send{background:#e91e63}

/* MODALS */
.modal{
 position:fixed;inset:0;background:#0009;display:none;
 align-items:flex-end;justify-content:center;z-index:100
}
.modal.show{display:flex}
.sheet{
 width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
 background:linear-gradient(180deg,#32104e,#16091f);
 border-radius:22px 22px 0 0;padding:16px
}
.sheet-head{
 display:flex;align-items:center;justify-content:space-between;
 margin-bottom:12px
}
.close{
 background:#ffffff15;color:#fff;width:34px;height:34px;
 border-radius:50%
}
.field{margin:9px 0}
.field label{
 display:block;font-size:12px;color:#bbb;margin-bottom:5px
}
.field input,.field select{
 width:100%;height:44px;border-radius:11px;
 border:1px solid #ffffff18;background:#ffffff10;
 color:#fff;padding:0 12px;outline:none
}
.field input[type="file"]{
 padding:10px;
}
.primary{
 width:100%;height:44px;border-radius:12px;
 background:#e91e63;color:#fff;font-weight:bold
}
.secondary{
 width:100%;height:42px;border-radius:12px;
 background:#ffffff12;color:#fff;margin-top:7px
}

/* GIFTS */
.gifts-grid{
 display:grid;grid-template-columns:repeat(4,1fr);gap:7px
}
.gift{
 background:#ffffff0d;border-radius:12px;padding:8px;
 text-align:center;border:1px solid #ffffff10
}
.gift-icon{font-size:27px}
.gift-name{font-size:9px;margin-top:3px}
.gift-price{font-size:9px;color:#ffd54f;margin-top:3px}

/* OPTIONS */
.option-grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:9px
}
.option{
 padding:13px 5px;border-radius:13px;
 background:#ffffff0d;text-align:center;font-size:11px
}
.option div{
 font-size:25px;margin-bottom:5px
}

/* PROFILE */
.profile-card{text-align:center;padding:10px}
.profile-card img{
 width:85px;height:85px;border-radius:50%;
 object-fit:cover;border:3px solid #ffd54f
}
.profile-id{color:#bbb;font-size:11px;margin-top:5px}
.profile-actions{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:7px;margin-top:13px
}
.profile-actions button{
 height:38px;border-radius:10px;
 background:#ffffff12;color:#fff;font-size:11px
}

/* ROOM DP PREVIEW */
.dp-upload{
 display:flex;
 align-items:center;
 justify-content:center;
 margin:8px 0 12px;
}
.dp-preview{
 width:100px;height:100px;border-radius:50%;
 object-fit:cover;border:3px solid #ffd54f;
 background:#ffffff10
}

/* TOAST */
.toast{
 position:fixed;left:50%;bottom:75px;
 transform:translateX(-50%);
 background:#000d;padding:10px 15px;
 border-radius:20px;font-size:12px;
 display:none;z-index:200
}
.toast.show{display:block}
</style>
</head>

<script type="module">

/* =========================================================
   PAWANVOICE ROOM SYSTEM
   Firebase + Render + Socket.IO
   ========================================================= */

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase,
 ref,
 get,
 set,
 update,
 onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
 getStorage,
 ref as storageRef,
 uploadBytes,
 getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {
 apiKey:"YOUR_API_KEY",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
 appId:"YOUR_APP_ID"
};

const firebaseApp=initializeApp(firebaseConfig);
const db=getDatabase(firebaseApp);
const storage=getStorage(firebaseApp);


/* ================= SERVER ================= */

const SERVER_URL="https://pawanvoice-1.onrender.com";


/* ================= ROOM PARAM ================= */

const params=new URLSearchParams(location.search);

const ROOM_ID=
 params.get("room") ||
 params.get("roomid") ||
 "200001";


/* ================= LOCAL USER ================= */

function safeNumber(v,f=0){
 const n=Number(v);
 return Number.isFinite(n)?n:f;
}

function localGet(key,fallback=""){
 return localStorage.getItem(key) || fallback;
}

function getUser(){

 let oldId=
  localGet("pawanvoice_userid") ||
  localGet("pv_userId");

 let id=
  params.get("userid") ||
  oldId ||
  "100052";

 let name=
  params.get("name") ||
  localGet("pawanvoice_name") ||
  localGet("pv_name") ||
  "Pawan User";

 let dp=
  params.get("dp") ||
  localGet("pawanvoice_dp") ||
  localGet("pv_dp") ||
  "https://i.pravatar.cc/150?img=12";

 return {
  id:String(id),
  userId:String(id),
  name:String(name),
  dp:String(dp),
  gender:localGet("pawanvoice_gender","Male"),
  level:safeNumber(localGet("pawanvoice_level","1"),1),
  exp:safeNumber(localGet("pawanvoice_exp","0"),0),
  coins:safeNumber(
   localGet(
    "pawanvoice_coins",
    localGet("pv_coins","100000")
   ),100000
  ),

async function loadRoomFromServer(){

 try{

  const res=
   await fetch(
    SERVER_URL+
    "/api/room/"+
    encodeURIComponent(ROOM_ID)
   );

  if(!res.ok){
   throw new Error(
    "room not found"
   );
  }

  const data=await res.json();

  ROOM=
   normalizeRoom(
    data.room||data
   );

  renderRoom();

 }catch(e){

  ROOM={
   id:ROOM_ID,
   name:"PawanVoice Room",
   roomName:"PawanVoice Room",
   dp:DEFAULT_ROOM_DP,

   owner:USER.id,
   ownerId:USER.id,

   ownerName:USER.name,
   ownerDp:USER.dp,

   category:"General",
   maxSeats:9,

   seats:Array(9).fill(null),

   users:{},
   members:{},

   roomExp:0,
   topUsers:[]
  };

  if(ROOM.owner===USER.id){

   ROOM.seats[0]={
    userId:USER.id,
    id:USER.id,
    name:USER.name,
    dp:USER.dp,
    level:USER.level,
    mic:false
   };
  }

  renderRoom();
 }
}

function normalizeRoom(r){

 r=r||{};

 let seats=
  Array.isArray(r.seats)
   ? r.seats.slice(0,9)
   : Array(9).fill(null);

 while(seats.length<9)
  seats.push(null);

 let users=r.users||{};
 let members=r.members||{};

 if(Array.isArray(users)){

  const obj={};

  users.forEach(u=>{

   if(u&&u.userId)
    obj[u.userId]=u;
  });

  users=obj;
 }

 if(Array.isArray(members)){

  const obj={};

  members.forEach(u=>{

   if(u&&u.userId)
    obj[u.userId]=u;
  });

  members=obj;
 }

 return {

  ...r,

  id:String(
   r.id||ROOM_ID
  ),

  name:
   r.name||
   r.roomName||
   "PawanVoice Room",

  roomName:
   r.roomName||
   r.name||
   "PawanVoice Room",

  dp:
   r.dp||
   DEFAULT_ROOM_DP,

  owner:String(
   r.owner||
   r.ownerId||
   ""
  ),

  ownerId:String(
   r.ownerId||
   r.owner||
   ""
  ),

  ownerName:r.ownerName||"",
  ownerDp:r.ownerDp||"",

  category:
   r.category||
   "General",

  maxSeats:9,

  seats,

  users,
  members,

  roomExp:
   safeNumber(
    r.roomExp,
    0
   ),

  topUsers:
   Array.isArray(r.topUsers)
    ? r.topUsers
    : [],

  admins:
   Array.isArray(r.admins)
    ? r.admins
    : [],

  mutedUsers:
   r.mutedUsers||{},

  messages:
   Array.isArray(r.messages)
    ? r.messages
    : []
 };
}

function connectSocket(){

 if(SOCKET)return;

 try{

  SOCKET=io(
   SERVER_URL,
   {
    transports:[
     "websocket",
     "polling"
    ],
    reconnection:true,
    timeout:10000
   }
  );

  SOCKET.on(
   "connect",
   ()=>{

    console.log(
     "Socket connected"
    );

    SOCKET.emit(
     "register-user",
     {
      userId:USER.id,
      id:USER.id,
      name:USER.name,
      dp:USER.dp,
      level:USER.level
     }
    );

    SOCKET.emit(
     "join-room",
     {
      roomId:ROOM_ID,
      userId:USER.id,
      id:USER.id,
      name:USER.name,
      dp:USER.dp,
      level:USER.level
     }
    );

    joined=true;

    document.getElementById(
     "voiceStatus"
    ).textContent=
     "Connected";
   }
  );

  SOCKET.on(
   "disconnect",
   ()=>{

    document.getElementById(
     "voiceStatus"
    ).textContent=
     "Reconnecting";
   }
  );

  SOCKET.on(
   "room-state",
   (data)=>{

    if(data){

     ROOM=
      normalizeRoom(
       data.room||data
      );

     renderRoom();
    }
   }
  );

  SOCKET.on(
   "room-joined",
   (data)=>{

    toast(
     "💜 Room joined"
    );

    if(data.room){

     ROOM=
      normalizeRoom(
       data.room
      );

     renderRoom();
    }
   }
  );

  SOCKET.on(
   "user-joined",
   (user)=>{

    if(user){

     addSystem(
      "👋 "+
      (user.name||"User")+
      " joined the room"
     );
    }
   }
  );

  SOCKET.on(
   "user-left",
   (user)=>{

    if(user){

     addSystem(
      "👋 "+
      (user.name||"User")+
      " left the room"
     );
    }
   }
  );

  SOCKET.on(
   "chat",
   (msg)=>{
    addChatMessage(msg);
   }
  );

  SOCKET.on(
   "room-chat",
   (msg)=>{
    addChatMessage(msg);
   }
  );

  SOCKET.on(
   "emoji",
   (data)=>{

    if(data){

     addSystem(
      "😊 "+
      (data.name||"User")+
      " sent "+
      (data.emoji||"")
     );
    }
   }
  );

  SOCKET.on(
   "gift-sent",
   (data)=>{

    if(data){

     addSystem(
      "🎁 "+
      (data.senderName||"User")+
      " sent "+
      (data.giftName||"Gift")
     );
    }

    if(data.wallet){

     USER.coins=
      safeNumber(
       data.wallet.coins,
       USER.coins
      );

     USER.diamonds=
      safeNumber(
       data.wallet.diamonds,
       USER.diamonds
      );

     saveLocalUser();
    }
   }
  );

  SOCKET.on(
   "gift-received",
   (data)=>{

    if(data){

     addSystem(
      "🎉 "+
      (data.receiverName||"User")+
      " received "+
      (data.giftName||"Gift")
     );
    }
   }
  );

  SOCKET.on(
   "wallet",
   (wallet)=>{

    if(wallet){

     USER.coins=
      safeNumber(
       wallet.coins,
       USER.coins
      );

     USER.diamonds=
      safeNumber(
       wallet.diamonds,
       USER.diamonds
      );

     saveLocalUser();
    }
   }
  );

  SOCKET.on(
   "follow-result",
   (data)=>{

    toast(
     data?.message||
     "Follow updated"
    );
   }
  );

  SOCKET.on(
   "cp-result",
   (data)=>{

    toast(
     data?.message||
     "CP request sent"
    );
   }
  );

  SOCKET.on(
   "user-entry",
   (data)=>{

    if(data?.name){

     addSystem(
      "✨ "+
      data.name+
      " entered"
     );
    }
   }
  );

  SOCKET.on(
   "room-updated",
   (data)=>{

    if(data?.room){

     ROOM=
      normalizeRoom(
       data.room
      );

    }else if(data){

     ROOM=
      normalizeRoom(data);
    }

    renderRoom();
   }
  );

  /* WEBRTC SIGNALS */

  SOCKET.on(
   "offer",
   handleOffer
  );

  SOCKET.on(
   "webrtc-offer",
   handleOffer
  );

  SOCKET.on(
   "answer",
   handleAnswer
  );

  SOCKET.on(
   "webrtc-answer",
   handleAnswer
  );

  SOCKET.on(
   "ice-candidate",
   handleIce
  );

  SOCKET.on(
   "webrtc-ice",
   handleIce
  );

 }catch(e){

  console.error(e);

  toast(
   "Socket connection failed"
  );
 }
}

async function startMicrophone(){

 if(
  !navigator.mediaDevices||
  !navigator.mediaDevices.getUserMedia
 ){

  throw new Error(
   "Microphone not supported"
  );
 }

 localStream=
  await navigator.mediaDevices
   .getUserMedia({
    audio:{
     echoCancellation:true,
     noiseSuppression:true,
     autoGainControl:true
    },
    video:false
   });

 localStream
  .getTracks()
  .forEach(
   track=>track.enabled=true
  );
}

/* ================= WEBRTC ================= */

const rtcConfig={
 iceServers:[
  {
   urls:[
    "stun:stun.l.google.com:19302",
    "stun:stun1.l.google.com:19302"
   ]
  }
 ]
};

async function createPeer(targetId){

 if(rtcPeers[targetId])
  return rtcPeers[targetId];

 const pc=
  new RTCPeerConnection(
   rtcConfig
  );

 rtcPeers[targetId]=pc;

 if(localStream){

  localStream
   .getTracks()
   .forEach(
    track=>
     pc.addTrack(
      track,
      localStream
     )
   );
 }

 pc.onicecandidate=e=>{

  if(
   e.candidate&&
   SOCKET
  ){

   SOCKET.emit(
    "ice-candidate",
    {
     roomId:ROOM_ID,
     from:USER.id,
     to:targetId,
     candidate:e.candidate
    }
   );
  }
 };

 pc.ontrack=e=>{

  let audio=
   document.getElementById(
    "audio-"+targetId
   );

  if(!audio){

   audio=
    document.createElement(
     "audio"
    );

   audio.id=
    "audio-"+targetId;

   audio.autoplay=true;
   audio.playsInline=true;

   document.body.appendChild(
    audio
   );
  }

  audio.srcObject=
   e.streams[0];

  audio.muted=
   !speakerOn;
 };

 return pc;
}

async function handleOffer(data){

 if(!data)return;

 const from=
  data.from||
  data.userId||
  data.sender;

 if(
  !from||
  from===USER.id
 )return;

 const pc=
  await createPeer(from);

 await pc.setRemoteDescription(
  new RTCSessionDescription(
   data.offer||data
  )
 );

 const answer=
  await pc.createAnswer();

 await pc.setLocalDescription(
  answer
 );

 if(SOCKET){

  SOCKET.emit(
   "answer",
   {
    roomId:ROOM_ID,
    from:USER.id,
    to:from,
    answer
   }
  );
 }
}

 await pc.setRemoteDescription(
  new RTCSessionDescription(
   data.answer||data
  )
 );
}

}

  ROOM?.seats?.find(

 if(!target){

/* ================= UPLOAD ROOM DP ================= */

async function uploadRoomDp(file){

 if(!file)return null;

 if(!file.type.startsWith("image/")){

  throw new Error(
   "Invalid image"
  );
 }

 const path=
  "rooms/"+
  ROOM_ID+
  "/room-dp-"+
  Date.now()+
  "-"+
  file.name
   .replace(
    /[^a-zA-Z0-9._-]/g,
    "_"
   );

 const fileRef=
  storageRef(
   storage,
   path
  );

 await uploadBytes(
  fileRef,
  file,
  {
   contentType:file.type
  }
 );

 return await getDownloadURL(
  fileRef
 );
}

  ).value;

  ).value;

 const changes={

 };

 try{

  await update(
   ref(db,"rooms/"+ROOM_ID),
   changes
  );

 }catch(e){

  console.log(
   "Firebase room update:",
   e
  );
 }

 try{

  await fetch(
   SERVER_URL+
   "/api/room/"+
   encodeURIComponent(
    ROOM_ID
   ),
   {
    method:"PATCH",
    headers:{

     ...changes,
     userId:USER.id,
     ownerId:ROOM.ownerId
    })
   }
  );

 }catch(e){}

 if(SOCKET){

  SOCKET.emit(
   "room-update",
   {
    roomId:ROOM_ID,
    userId:USER.id,
    ...changes
   }
  );
 }

 ROOM={

 renderRoom();

 closeModal(

 );

 toast(

/* ================= ROOM EXP ================= */

function calculateRoomLevel(exp){

 let level=1;
 let need=10000;
 let left=
  safeNumber(
   exp,
   0
  );

 while(
  left>=need&&
  level<1000
 ){

  left-=need;
  level++;
  need=level*10000;
 }

 return level;
}

function renderRoomExp(){

 const exp=
  safeNumber(
   ROOM.roomExp,
   0
  );

 document.getElementById(
  "roomExpText"
 ).textContent=
  exp.toLocaleString(
   "en-IN"
  )+
  " EXP";

 const level=
  calculateRoomLevel(
   exp
  );

 document.getElementById(
  "roomLevel"
 ).textContent=
  level;

 const next=
  level*10000;

 const percent=
  Math.min(
   100,
   (exp%next)/
   next*
   100
  );

 document.getElementById(
  "roomExpFill"
 ).style.width=
  Math.max(
   2,
   percent
  )+
  "%";
}

function renderTopUsers(){

 let tops=
  ROOM.topUsers||
  [];

 if(!tops.length){

  tops=
   (ROOM.seats||[])
    .filter(Boolean)
    .slice(0,3);
 }

 for(let i=0;i<3;i++){

  const u=
   tops[i];

  const dp=
   document.getElementById(
    "top"+(i+1)+"dp"
   );

  const name=
   document.getElementById(
    "top"+(i+1)+"name"
   );

  if(u){

   dp.src=
    u.dp||
    DEFAULT_ROOM_DP;

   name.textContent=
    u.name||
    "User";

  }else{

   name.textContent=
    "TOP "+(i+1);
  }
 }
}


/* ================= ROOM JOIN ================= */

async function joinFirebaseRoom(){

 try{

  const roomRef=
   ref(
    db,
    "rooms/"+ROOM_ID
   );

  const snap=
   await get(roomRef);

  if(!snap.exists())
   return;

  const room=
   normalizeRoom(
    snap.val()
   );

  room.members=
   room.members||
   {};

  room.members[USER.id]={
   userId:USER.id,
   id:USER.id,
   name:USER.name,
   dp:USER.dp,
   level:USER.level,
   joinedAt:Date.now()
  };

  room.users=
   room.users||
   {};

  room.users[USER.id]={
   userId:USER.id,
   id:USER.id,
   name:USER.name,
   dp:USER.dp,
   level:USER.level,
   joinedAt:Date.now()
  };

  await update(
   roomRef,
   {
    members:room.members,
    users:room.users,
    updatedAt:Date.now()
   }
  );

 }catch(e){

  console.log(
   "Firebase room join:",
   e
  );
 }
}

/* ================= HELPERS ================= */

function escapeHtml(value){

 return String(
  value??""
 )
  .replaceAll(
   "&",
   "&amp;"
  )
  .replaceAll(
   "<",
   "&lt;"
  )
  .replaceAll(
   ">",
   "&gt;"
  )
  .replaceAll(
   '"',
   "&quot;"
  )
  .replaceAll(
   "'",
   "&#039;"
  );
}

function escapeAttr(value){
 return escapeHtml(value);
}


/* ================= PROFILE UPDATE ================= */

async function syncUserToRoom(){

 try{

  const snap=
   await get(
    ref(
     db,
     "rooms/"+ROOM_ID
    )
   );

  if(!snap.exists())
   return;

  const room=
   normalizeRoom(
    snap.val()
   );

  let changed=false;

  if(
   room.users?.[USER.id]
  ){

   room.users[
    USER.id
   ].name=
    USER.name;

   room.users[
    USER.id
   ].dp=
    USER.dp;

   room.users[
    USER.id
   ].level=
    USER.level;

   changed=true;
  }

  if(
   room.members?.[USER.id]
  ){

   room.members[
    USER.id
   ].name=
    USER.name;

   room.members[
    USER.id
   ].dp=
    USER.dp;

   room.members[
    USER.id
   ].level=
    USER.level;

   changed=true;
  }

  room.seats=
   room.seats||
   Array(9).fill(null);

  room.seats=
   room.seats.map(u=>{

    if(
     u&&
     String(u.userId)===
     String(USER.id)
    ){

     changed=true;

     return {
      ...u,
      name:USER.name,
      dp:USER.dp,
      level:USER.level
     };
    }

    return u;
   });

  if(changed){

   await update(
    ref(
     db,
     "rooms/"+ROOM_ID
    ),
    {
     users:
      room.users||{},

     members:
      room.members||{},

     seats:
      room.seats,

     updatedAt:
      Date.now()
    }
   );
  }

 }catch(e){}
}
