<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PawanVoice Room</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:Arial,sans-serif;
  background:#08070c;
  color:#fff;
}
button,input{font:inherit}

.app{
  width:100%;
  max-width:500px;
  height:100dvh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% -10%,#7435a0 0,#29143e 35%,#100b18 70%,#08070c 100%);
}

/* HEADER */

.header{
  height:64px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(0,0,0,.30);
}

.circleBtn{
  width:37px;
  height:37px;
  border:0;
  border-radius:50%;
  color:white;
  background:rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.roomDp{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#69348d;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
  border:2px solid rgba(255,255,255,.25);
}

.roomDp img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.roomInfo{
  flex:1;
  min-width:0;
}

.roomName{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomId{
  margin-top:4px;
  color:#c8bdcf;
  font-size:11px;
}

.online{
  font-size:11px;
  color:#eee;
  background:rgba(0,0,0,.25);
  padding:7px 9px;
  border-radius:16px;
}

/* ROOM BAR */

.roomBar{
  padding:7px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.roomBarButtons{
  display:flex;
  gap:5px;
}

.smallBtn{
  border:0;
  background:rgba(255,255,255,.11);
  color:#fff;
  padding:7px 9px;
  border-radius:15px;
  font-size:10px;
  cursor:pointer;
}

/* MAIN */

.main{
  height:calc(100dvh - 64px);
  overflow-y:auto;
  padding-bottom:85px;
}

/* SEATS */

.seats{
  padding:7px 12px 8px;
}

.host{
  display:flex;
  justify-content:center;
  margin-bottom:17px;
}

.seatRows{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px 5px;
}

.seat{
  text-align:center;
  min-width:0;
}

.avatar{
  width:57px;
  height:57px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#432056,#a64bc8);
  border:2px solid rgba(255,255,255,.28);
  position:relative;
  overflow:hidden;
  cursor:pointer;
  font-size:23px;
}

.host .avatar{
  width:68px;
  height:68px;
  border-color:#ffd04c;
}

.avatar.empty{
  background:rgba(255,255,255,.07);
  border:1px dashed rgba(255,255,255,.35);
  color:#aaa;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.seatNo{
  position:absolute;
  right:0;
  bottom:0;
  padding:2px 5px;
  background:rgba(0,0,0,.75);
  border-radius:8px 0 0 0;
  font-size:9px;
}

.micState{
  position:absolute;
  left:0;
  bottom:0;
  width:19px;
  height:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#27bd60;
  border-radius:50%;
  font-size:9px;
}

.userName{
  margin-top:5px;
  font-size:10px;
  color:#eee;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* TOOLS */

.tools{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:11px 6px;
  border-top:1px solid rgba(255,255,255,.07);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.tool{
  background:none;
  border:0;
  color:#fff;
  text-align:center;
  cursor:pointer;
  font-size:10px;
}

.toolIcon{
  width:35px;
  height:35px;
  margin:0 auto 4px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* EXP */

.exp{
  padding:9px 12px;
}

.expTitle{
  color:#ffd44d;
  font-size:11px;
  margin-bottom:8px;
}

.expList{
  display:flex;
  justify-content:space-around;
}

.expItem{
  text-align:center;
  font-size:9px;
  color:#ddd;
}

.expAvatar{
  width:34px;
  height:34px;
  margin:auto auto 3px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#51256e;
  font-size:17px;
}

/* CHAT */

.chat{
  min-height:110px;
  max-height:170px;
  overflow-y:auto;
  padding:7px 10px;
}

.message{
  margin:4px 0;
  max-width:90%;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(0,0,0,.40);
  font-size:11px;
  line-height:1.35;
}

.message b{
  color:#ffd452;
}

.system{
  margin:5px 0;
  color:#aaa;
  font-size:10px;
}

/* BOTTOM */

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  min-height:70px;
  padding:8px 7px;
  display:flex;
  align-items:center;
  gap:5px;
  background:rgba(10,8,15,.97);
  border-top:1px solid rgba(255,255,255,.08);
  z-index:20;
}

.input{
  flex:1;
  min-width:0;
  height:43px;
  border-radius:23px;
  background:#29232f;
  display:flex;
  align-items:center;
  padding-left:12px;
}

.input input{
  flex:1;
  min-width:0;
  background:none;
  border:0;
  outline:none;
  color:white;
  font-size:12px;
}

.input button{
  width:39px;
  height:39px;
  border:0;
  background:none;
  color:white;
  cursor:pointer;
}

.bottomBtn{
  width:41px;
  height:41px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  color:#fff;
  background:#29232f;
  cursor:pointer;
}

/* MODAL */

.modal{
  position:absolute;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.68);
  display:none;
  align-items:flex-end;
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:78%;
  overflow-y:auto;
  background:#211b2a;
  border-radius:22px 22px 0 0;
  padding:17px;
}

.sheetHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.sheetHeader h3{
  font-size:17px;
}

.closeBtn{
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  color:#fff;
  background:#382d42;
  font-size:20px;
  cursor:pointer;
}

.action{
  width:100%;
  border:0;
  color:white;
  background:#30273a;
  margin:5px 0;
  padding:13px;
  border-radius:11px;
  text-align:left;
  cursor:pointer;
}

.emojiGrid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
}

.emojiGrid button{
  border:0;
  background:#30273a;
  color:white;
  border-radius:8px;
  padding:7px 2px;
  font-size:20px;
  cursor:pointer;
}

.giftGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.gift{
  border:0;
  background:#30273a;
  color:white;
  border-radius:12px;
  padding:11px 3px;
  cursor:pointer;
  font-size:10px;
}

.gift span{
  display:block;
  font-size:27px;
  margin-bottom:5px;
}

/* TOAST */

.toast{
  position:absolute;
  z-index:300;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  display:none;
  background:#050505;
  color:white;
  padding:10px 15px;
  border-radius:20px;
  font-size:11px;
  white-space:nowrap;
}

/* CONNECTION */

.connection{
  position:absolute;
  top:67px;
  left:50%;
  transform:translateX(-50%);
  z-index:40;
  font-size:9px;
  padding:4px 9px;
  border-radius:12px;
  background:#b42b36;
  display:none;
}

.connection.ok{
  background:#20894b;
}
</style>
</head>

<body>

        <div class="seat">

        <div class="seat">
          <div class="avatar empty" id="seat8" onclick="seatClick(8)">

<script>
"use strict";

/* ================================
   USER / ROOM
================================ */

const params = new URLSearchParams(location.search);

const roomId =
  params.get("room") ||
  localStorage.getItem("pv_room") ||
  "10001";

const myUserId =
  params.get("userid") ||
  localStorage.getItem("pv_userId") ||
  "guest_" + Math.random().toString(36).slice(2,9);

const myName =
  params.get("name") ||
  localStorage.getItem("pv_name") ||
  "Guest";

const myDp =
  localStorage.getItem("pv_dp") || "";

document.getElementById("roomIdText").textContent = roomId;

document.getElementById("roomName").textContent =
  params.get("roomName") || "PawanVoice Room";

if(myDp){
  document.getElementById("roomDp").innerHTML =
    "<img src='"+safe(myDp)+"'>";
}

/* ================================
   SOCKET
================================ */

let socket = null;
let users = [];
let hostSocketId = null;
let mySeat = null;

try{

  socket = io({
    transports:["polling","websocket"],
    reconnection:true
  });

}catch(error){

  console.log(error);

  showToast("Server connection error");

}

/* ================================
   CONNECTION
================================ */

if(socket){

  socket.on("connect",function(){

    setConnection(true);

    addSystem("Connected");

    socket.emit("join-room",{
      roomId:roomId,
      userId:myUserId,
      name:myName,
      dp:myDp
    });

  });

  socket.on("disconnect",function(){

    setConnection(false);

    addSystem("Disconnected from server");

  });

  socket.on("connect_error",function(error){

    console.log("Socket error:",error);

    setConnection(false);

    showToast("Server connect नहीं हुआ");

  });

}

/* ================================
   ROOM STATE
================================ */

if(socket){

  socket.on("room-state",function(data){

    users = data.users || [];

    hostSocketId = data.hostSocketId || null;

    document.getElementById("onlineCount").textContent =
      data.count || 0;

    renderSeats();
    renderAdmin();

  });

  socket.on("joined-room",function(data){

    hostSocketId =
      data.hostSocketId || null;

    addSystem("Room joined");

  });

}

/* ================================
   SEAT
================================ */

function seatClick(seat){

  if(!socket || !socket.connected){

    showToast("Server से connection नहीं है");

    return;
  }

  const existing =
    users.find(function(u){
      return Number(u.seat) === Number(seat);
    });

  if(existing){

    if(existing.socketId === socket.id){

      socket.emit("leave-seat");
      stopMic();

    }else{

      showToast("यह seat already occupied है");

    }

    return;
  }

  socket.emit("take-seat",Number(seat));

}

function renderSeats(){

  for(let i=1;i<=9;i++){

    const avatar =
      document.getElementById("seat"+i);

    const name =
      document.getElementById("name"+i);

    if(!avatar || !name) continue;

    const user =
      users.find(function(u){
        return Number(u.seat) === i;
      });

    if(user){

      avatar.classList.remove("empty");

      let inside =
        user.dp
        ? "<img src='"+safe(user.dp)+"'>"
        : safe(
            user.name
            ? user.name.charAt(0).toUpperCase()
            : "👤"
          );

      inside +=
        '<span class="seatNo">'+i+'</span>';

      inside +=
        '<span class="micState">'+
        (user.mic ? "🎙️" : "🔇")+
        '</span>';

      avatar.innerHTML = inside;

      name.textContent =
        user.name +
        (user.socketId === hostSocketId ? " 👑" : "");

    }else{

      avatar.classList.add("empty");

      avatar.innerHTML =
        "+"+
        '<span class="seatNo">'+i+'</span>';

      name.textContent =
        i === 1 ? "Host Seat" : "Seat "+i;

    }

  }

  const me =
    users.find(function(u){
      return u.socketId === socket.id;
    });

  mySeat =
    me ? Number(me.seat) : null;

}

/* ================================
   MIC
================================ */

let localStream = null;
let micOn = false;

async function toggleMic(){

  if(!mySeat){

    showToast("पहले खाली seat पर click करें");

    return;
  }

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    showToast("इस browser में microphone उपलब्ध नहीं है");

    return;
  }

  if(!localStream){

    try{

      localStream =
        await navigator.mediaDevices.getUserMedia({
          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          },
          video:false
        });

    }catch(error){

      console.log(error);

      showToast("Microphone permission Allow करें");

      return;
    }

  }

  micOn = !micOn;

  localStream.getAudioTracks()
    .forEach(function(track){
      track.enabled = micOn;
    });

  document.getElementById("micBtn").textContent =
    micOn ? "🎙️" : "🔇";

  if(socket && socket.connected){

    socket.emit(
      "mic-status",
      micOn
    );

  }

  showToast(
    micOn
    ? "Mic ON"
    : "Mic OFF"
  );

}

function stopMic(){

  micOn = false;

  if(localStream){

    localStream.getAudioTracks()
      .forEach(function(track){
        track.enabled = false;
      });

  }

  const btn =
    document.getElementById("micBtn");

  if(btn) btn.textContent = "🔇";

  if(socket && socket.connected){

    socket.emit(
      "mic-status",
      false
    );

  }

}

/* ================================
   ADMIN
================================ */

function openAdmin(){

  renderAdmin();

  document
    .getElementById("adminModal")
    .classList.add("open");

}

function renderAdmin(){

  const box =
    document.getElementById("adminList");

  if(!box) return;

  box.innerHTML = "";

  if(!socket){

    box.innerHTML =
      '<div class="system">Server unavailable</div>';

    return;
  }

  if(hostSocketId !== socket.id){

    box.innerHTML =
      '<div class="system">Only room host can use admin controls.</div>';

    return;
  }

  const others =
    users.filter(function(user){
      return user.socketId !== socket.id;
    });

  if(others.length === 0){

    box.innerHTML =
      '<div class="system">No other users in room.</div>';

    return;

  }

  others.forEach(function(user){

    const div =
      document.createElement("div");

    div.innerHTML =
      '<button class="action" onclick="kickUser(\''+
      safeAttr(user.socketId)+
      '\')">👢 Kick '+
      safe(user.name)+
      '</button>'+
      '<button class="action" onclick="muteUser(\''+
      safeAttr(user.socketId)+
      '\')">🔇 Mute '+
      safe(user.name)+
      '</button>';

    box.appendChild(div);

  });

}

function kickUser(id){

  if(socket){

    socket.emit("admin-kick",id);

  }

  closeModal("adminModal");

}

function muteUser(id){

  if(socket){

    socket.emit("admin-mute",id);

  }

  closeModal("adminModal");

}

if(socket){

  socket.on("kicked-from-room",function(data){

    alert(data.message || "Removed from room");

    location.href = "/";

  });

  socket.on("forced-mute",function(data){

    stopMic();

    showToast(
      data.message || "You were muted"
    );

  });

  socket.on("room-error",function(data){

    showToast(
      data.message || "Room error"
    );

  });

  socket.on("seat-error",function(data){

    showToast(
      data.message || "Seat error"
    );

  });

}

async function inviteRoom(){

async function shareRoom(){

  const url =
    location.origin+
    "/room.html?room="+
    encodeURIComponent(roomId)+
    "&userid="+
    encodeURIComponent(myUserId)+
    "&name="+
    encodeURIComponent(myName);

  if(navigator.share){

    try{

      await navigator.share({
        title:"PawanVoice Room",
        text:"Join my PawanVoice room",
        url:url
      });

      return;

    }catch(e){}

  }

  try{

    await navigator.clipboard.writeText(url);

    showToast("Room link copied");

  }catch(e){

    prompt("Copy room link:",url);

  }

}

/* ================================

================================ */

function leaveRoom(){

  stopMic();

  if(localStream){

    localStream.getTracks()
      .forEach(function(track){
        track.stop();
      });

    localStream = null;

  }

  if(socket){

    socket.disconnect();

  }

  location.href = "/";

}

function closeModal(id){

  if(el){

    el.classList.remove("open");

  }

}

document.querySelectorAll(".modal")
.forEach(function(modal){

    }

/* ================================
   MESSAGE UI
================================ */

function addMessage(name,message){

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className = "message";

  const bold =
    document.createElement("b");

  bold.textContent =
    name+": ";

  div.appendChild(bold);

  div.appendChild(
    document.createTextNode(message)
  );

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}

function addSystem(message){

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className = "system";

  div.textContent =
    message;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}

/* ================================
   CONNECTION UI
================================ */

function setConnection(ok){

  const box =
    document.getElementById("connection");

  if(ok){

    box.textContent =
      "● Connected";

    box.classList.add("ok");

    box.style.display =
      "block";

    setTimeout(function(){

      box.style.display =
        "none";

    },1500);

  }else{

    box.textContent =
      "● Reconnecting...";

    box.classList.remove("ok");

    box.style.display =
      "block";

  }

}

/* ================================
   TOAST
================================ */

let toastTimer = null;

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(function(){

      toast.style.display =
        "none";

    },2200);

}

/* ================================
   SAFE TEXT
================================ */

function safe(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function safeAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}
