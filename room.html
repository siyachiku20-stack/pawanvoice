<script>
const emojiPanel = document.getElementById("emojiPanel");
const giftPanel = document.getElementById("giftPanel");
const morePanel = document.getElementById("morePanel");
const settings = document.getElementById("settings");
const userMenu = document.getElementById("userMenu");

function closePanels(){
  emojiPanel.style.display="none";
  giftPanel.style.display="none";
  morePanel.style.display="none";
}

document.getElementById("emojiBtn").addEventListener("click",()=>{
  closePanels();
  emojiPanel.style.display =
    emojiPanel.style.display==="grid" ? "none" : "grid";
});

document.getElementById("giftBtn").addEventListener("click",()=>{
  closePanels();
  giftPanel.style.display =
    giftPanel.style.display==="grid" ? "none" : "grid";
});

document.getElementById("moreBtn").addEventListener("click",()=>{
  closePanels();
  morePanel.style.display =
    morePanel.style.display==="block" ? "none" : "block";
});

document.getElementById("speakerBtn").addEventListener("click",e=>{
  e.currentTarget.textContent =
    e.currentTarget.textContent==="🔊" ? "🔇" : "🔊";
});

document.getElementById("micBtn").addEventListener("click",e=>{
  e.currentTarget.textContent =
    e.currentTarget.textContent==="🎙️" ? "🔇" : "🎙️";
});


/* USER CLICK = ADMIN/KICK */
document.querySelectorAll(".seat").forEach(seat=>{

    document.getElementById("selectedUser").textContent =

    document.getElementById("selectedId").textContent =
      "🆔 ID: "+seat.dataset.id;

    userMenu.style.display="block";
    settings.style.display="none";
    closePanels();
  });
});

document.getElementById("closeUser").addEventListener("click",()=>{
  userMenu.style.display="none";
});

document.getElementById("adminBtn").addEventListener("click",()=>{
  alert(
    document.getElementById("selectedUser").textContent+

  );
  userMenu.style.display="none";
});

document.getElementById("muteBtn").addEventListener("click",()=>{
  alert(
    document.getElementById("selectedUser").textContent+
    " mute kiya gaya."
  );
});

document.getElementById("kickBtn").addEventListener("click",()=>{
  alert(
    document.getElementById("selectedUser").textContent+
    " ko room se Kick kiya gaya."
  );
  userMenu.style.display="none";
});


/* ROOM SETTING */
document.getElementById("settingBtn").addEventListener("click",()=>{
  closePanels();
  userMenu.style.display="none";

  settings.style.display =
    settings.style.display==="block" ? "none" : "block";
});

document.getElementById("changeName").addEventListener("click",()=>{
  const name=prompt(
    "New Room Name",
    document.getElementById("roomName").textContent.trim()
  );

  if(name && name.trim()){
    document.getElementById("roomName").textContent=name.trim();
  }
});

document.getElementById("changeNumber").addEventListener("click",()=>{
  const number=prompt("New Room Number");

  if(number && number.trim()){
    document.getElementById("roomNumber").textContent =
      "🆔 "+number.trim();
  }
});

document.getElementById("adminManage").addEventListener("click",()=>{
  alert("Admin Management: user select karke Make Admin / Remove Admin.");
});


/* INVITE */
document.getElementById("inviteBtn").addEventListener("click",()=>{
  alert("Room Invite link yahan share hoga.");
});


/* INBOX */
document.getElementById("inboxBtn").addEventListener("click",()=>{
  alert("Inbox opened.");
});


/* EMOJI */
document.querySelectorAll(".emoji-panel button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const emoji=btn.textContent;
    const input=document.getElementById("message");

    input.value += emoji;
    input.focus();

    emojiPanel.style.display="none";
  });
});


/* MESSAGE */
document.getElementById("message").addEventListener("keydown",e=>{
  if(e.key==="Enter"){

    const text=e.currentTarget.value.trim();

    if(!text) return;

    alert("Message sent: "+text);

    e.currentTarget.value="";
  }
});
</script>
