<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PawanVoice Room</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:#09051b;
}

body{
  background:
    radial-gradient(circle at 50% 20%,#352078 0%,#171044 35%,#09051b 78%);
}

button{
  border:0;
  color:#fff;
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

/* HEADER */
.header{
  height:76px;
  min-height:76px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(18,10,47,.82);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  z-index:5;
}

.back{
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.roomDp{
  width:46px;
  height:46px;
  border-radius:14px;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.2);
}

.roomInfo{
  min-width:0;
  flex:1;
}

.roomName{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomId{
  font-size:11px;
  opacity:.65;
  margin-top:4px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:6px;
}

.count{
  padding:7px 9px;
  border-radius:14px;
  background:rgba(255,255,255,.10);
  font-size:11px;
}

.hBtn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  font-size:17px;
}

/* ROOM CONTENT */
.content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px 10px 92px;
}

.content::-webkit-scrollbar{
  display:none;
}

/* HOST */
.hostArea{
  display:flex;
  justify-content:center;
  margin:3px 0 15px;
}

.seat{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:70px;
}

.hostSeat .avatarWrap{
  width:82px;
  height:82px;
}

.avatarWrap{
  width:64px;
  height:64px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,#ffd76a,#b56cff,#5c8dff);
  position:relative;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:#292044;
}

.micState{
  position:absolute;
  right:-2px;
  bottom:1px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#21183f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  border:2px solid #100b27;
}

.hostCrown{
  position:absolute;
  top:-13px;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
}

.userName{
  margin-top:7px;
  max-width:85px;
  font-size:12px;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.seatNo{
  margin-top:3px;
  font-size:9px;
  opacity:.45;
}

.emptySeat .avatarWrap{
  background:rgba(255,255,255,.08);
  border:2px dashed rgba(255,255,255,.15);
  padding:2px;
}

.emptyIcon{
  width:100%;
  height:100%;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  color:rgba(255,255,255,.35);
  background:rgba(255,255,255,.04);
}

/* 4 + 4 SEATS */
.seatGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px 4px;
  max-width:430px;
  margin:auto;
}

.seatGrid .seat{
  min-width:0;
}

/* FEATURE BUTTONS */
.features{
  margin-top:22px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:3px 2px 7px;
}

.features::-webkit-scrollbar{
  display:none;
}

.feature{
  flex:0 0 auto;
  padding:9px 12px;
  border-radius:18px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.07);
  font-size:11px;
  white-space:nowrap;
}

/* EXP */
.expBox{
  margin-top:9px;
  padding:11px;
  border-radius:18px;
  background:linear-gradient(90deg,rgba(102,55,198,.35),rgba(34,99,198,.18));
  border:1px solid rgba(255,255,255,.07);
}

.expTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:11px;
}

.expTitle{
  font-weight:bold;
}

.expRocket{
  font-size:19px;
}

.expBar{
  height:7px;
  border-radius:8px;
  background:rgba(255,255,255,.09);
  overflow:hidden;
  margin-top:8px;
}

.expFill{
  width:35%;
  height:100%;
  background:linear-gradient(90deg,#ffca4a,#b76cff);
  border-radius:8px;
}

.expRanks{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-size:10px;
  opacity:.72;
}

/* CHAT */
.chatMessages{
  margin-top:13px;
  min-height:20px;
  max-height:125px;
  overflow-y:auto;
}

.chatMessages::-webkit-scrollbar{
  display:none;
}

.message{
  display:flex;
  margin:5px 0;
}

.messageBubble{
  max-width:82%;
  padding:7px 10px;
  border-radius:13px;
  background:rgba(0,0,0,.25);
  font-size:12px;
}

.messageBubble b{
  color:#e0b6ff;
  margin-right:4px;
}

/* BOTTOM */
.bottomBar{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  min-height:72px;
  padding:9px 9px calc(9px + env(safe-area-inset-bottom));
  background:rgba(10,6,29,.94);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(15px);
  z-index:10;
  display:flex;
  align-items:center;
  gap:6px;
}

.chatInputWrap{
  flex:1;
  height:42px;
  min-width:0;
  display:flex;
  align-items:center;
  border-radius:22px;
  background:rgba(255,255,255,.09);
}

.chatInput{
  width:100%;
  height:100%;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  padding:0 14px;
  font-size:13px;
}

.chatInput::placeholder{
  color:rgba(255,255,255,.48);
}

.iconBtn{
  flex:0 0 40px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* EMOJI */
.emojiPanel{
  position:absolute;
  left:8px;
  right:8px;
  bottom:79px;
  padding:12px;
  border-radius:20px;
  background:#17102f;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 10px 40px rgba(0,0,0,.45);
  display:none;
  z-index:20;
}

.emojiPanel.show{
  display:block;
}

.emojiGrid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:8px;
  max-height:210px;
  overflow-y:auto;
}

.emoji{
  background:rgba(255,255,255,.06);
  border-radius:10px;
  height:38px;
  font-size:21px;
}

/* MODALS */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:500px;
  background:#18102f;
  border-radius:25px 25px 0 0;
  padding:18px;
  max-height:82vh;
  overflow-y:auto;
}

.modalTitle{
  font-size:18px;
  font-weight:700;
  margin-bottom:15px;
}

.close{
  float:right;
  width:32px;
  height:32px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
}

.userProfile{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0 16px;
}

.userProfile img{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
}

.profileName{
  font-weight:bold;
}

.profileId{
  font-size:11px;
  opacity:.55;
  margin-top:4px;
}

.actionBtn{
  width:100%;
  padding:13px;
  margin-top:8px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  text-align:left;
  font-size:13px;
}

.actionBtn.danger{
  background:rgba(255,60,80,.13);
}

.input{
  width:100%;
  height:44px;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  border-radius:13px;
  background:rgba(255,255,255,.07);
  color:#fff;
  padding:0 12px;
  margin-bottom:10px;
}

.primary{
  width:100%;
  height:44px;
  border-radius:14px;
  background:linear-gradient(90deg,#7044e7,#9d56dc);
  font-weight:bold;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%) translateY(20px);
  background:rgba(20,15,35,.94);
  padding:10px 15px;
  border-radius:20px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADING */
.loading{
  position:fixed;
  inset:0;
  background:#09051b;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:200;
}

.loadingLogo{
  font-size:28px;
  font-weight:800;
  margin-bottom:10px;
}

.loadingText{
  font-size:12px;
  opacity:.6;
}

.hidden{
  display:none!important;
}

@media(max-width:360px){
  .seatGrid{
    gap:17px 0;
  }

  .avatarWrap{
    width:57px;
    height:57px;
  }

  .hostSeat .avatarWrap{
    width:74px;
    height:74px;
  }

  .userName{
    max-width:72px;
    font-size:11px;
  }

  .bottomBar{
    gap:4px;
  }

  .iconBtn{
    width:36px;
    height:36px;
    flex-basis:36px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <button class="back" onclick="goHome()">‹</button>

    <img id="roomDp"
         class="roomDp"
         src=""
         alt="Room">

    <div class="roomInfo">
      <div id="roomName" class="roomName">PawanVoice Room</div>
      <div id="roomId" class="roomId">Room: PV824991</div>
    </div>

    <div class="headerRight">
      <div id="userCount" class="count">0/9</div>

      <button class="hBtn"
              onclick="openSettings()">⚙️</button>

      <button class="hBtn"
              onclick="inviteRoom()">↗️</button>
    </div>
  </div>


  <!-- CONTENT -->
  <div class="content">

    <!-- HOST -->
    <div class="hostArea">
      <div id="seat1"></div>
    </div>

    <!-- OTHER 8 SEATS -->
    <div id="seatGrid" class="seatGrid"></div>

    <!-- FEATURES -->
    <div class="features">

      <button class="feature"
              onclick="featureClick('Room Support')">
        🛟 Room Support
      </button>

      <button class="feature"
              onclick="featureClick('Lucky Wheel')">
        🎡 Lucky Wheel
      </button>

      <button class="feature"
              onclick="featureClick('Bounty Hunter')">
        🎯 Bounty Hunter
      </button>

      <button class="feature"
              onclick="featureClick('Room Reward')">
        🎁 Room Reward
      </button>

      <button class="feature"
              onclick="featureClick('Exclusive Benefits')">
        ⭐ Exclusive Benefits
      </button>

    </div>


    <!-- EXP -->
    <div class="expBox">

      <div class="expTop">
        <div>
          <span class="expRocket">🚀</span>
          <span class="expTitle">Room EXP</span>
        </div>

        <div>Top Room</div>
      </div>

      <div class="expBar">
        <div class="expFill"></div>
      </div>

      <div class="expRanks">
        <span>🥇 Top 1</span>
        <span>🥈 Top 2</span>
        <span>🥉 Top 3</span>
      </div>

    </div>


    <!-- CHAT -->
    <div id="chatMessages" class="chatMessages"></div>

  </div>


  <!-- EMOJI -->
  <div id="emojiPanel" class="emojiPanel">
    <div id="emojiGrid" class="emojiGrid"></div>
  </div>


  <!-- BOTTOM BAR -->
  <div class="bottomBar">

    <div class="chatInputWrap">
      <input
        id="chatInput"
        class="chatInput"
        type="text"
        maxlength="300"
        placeholder="Say something..."
        onkeydown="chatKey(event)">
    </div>

    <button class="iconBtn"
            onclick="toggleEmoji()">😊</button>

    <button id="speakerBtn"
            class="iconBtn"
            onclick="toggleSpeaker()">🔊</button>

    <button id="micBtn"
            class="iconBtn"
            onclick="toggleMic()">🎙️</button>

    <button class="iconBtn"
            onclick="openInbox()">💌</button>

    <button class="iconBtn"
            onclick="openMore()">•••</button>

  </div>

</div>


<!-- USER MODAL -->
<div id="userModal" class="modal">
  <div class="modalBox">

    <button class="close"
            onclick="closeModal('userModal')">✕</button>

    <div class="modalTitle">User Profile</div>

    <div class="userProfile">

      <img id="selectedUserDp" src="" alt="DP">

      <div>
        <div id="selectedUserName" class="profileName">
          User
        </div>

        <div id="selectedUserId" class="profileId">
          ID:
        </div>
      </div>

    </div>

    <button class="actionBtn"
            onclick="sendPrivateMessage()">
      💬 Message
    </button>

    <button id="adminBtn"
            class="actionBtn"
            onclick="makeSelectedAdmin()">
      👑 Make Admin
    </button>

    <button id="removeAdminBtn"
            class="actionBtn"
            onclick="removeSelectedAdmin()">
      👤 Remove Admin
    </button>

    <button id="kickBtn"
            class="actionBtn danger"
            onclick="kickSelectedUser()">
      🚪 Kick User
    </button>

    <button id="banBtn"
            class="actionBtn danger"
            onclick="banSelectedUser()">
      🚫 Ban User
    </button>

  </div>
</div>


<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal">
  <div class="modalBox">

    <button class="close"
            onclick="closeModal('settingsModal')">✕</button>

    <div class="modalTitle">Room Settings</div>

    <input
      id="newRoomName"
      class="input"
      maxlength="50"
      placeholder="Room name">

    <button class="primary"
            onclick="saveRoomName()">
      Save Room Name
    </button>

    <button class="actionBtn"
            onclick="copyRoomLink()">
      🔗 Copy Room Link
    </button>

    <button class="actionBtn"
            onclick="goHome()">
      🏠 Minimize / Home
    </button>

  </div>
</div>


<!-- MORE MODAL -->
<div id="moreModal" class="modal">
  <div class="modalBox">

    <button class="close"
            onclick="closeModal('moreModal')">✕</button>

    <div class="modalTitle">More</div>

    <button class="actionBtn"
            onclick="inviteRoom()">
      📤 Invite Friends
    </button>

    <button class="actionBtn"
            onclick="featureClick('Bag')">
      🎒 Bag
    </button>

    <button class="actionBtn"
            onclick="featureClick('Gifts')">
      🎁 Gifts
    </button>

    <button class="actionBtn"
            onclick="featureClick('Share')">
      🔗 Share Room
    </button>

    <button class="actionBtn danger"
            onclick="leaveRoom()">
      🚪 Leave Room
    </button>

  </div>
</div>


<div id="toast" class="toast"></div>

<div id="loading" class="loading">
  <div class="loadingLogo">PawanVoice</div>
  <div class="loadingText">Connecting to room...</div>
</div>


<script>
/* =========================================================
   PAWANVOICE ROOM
   ========================================================= */

const SERVER = "https://pawanvoice-1.onrender.com";

const params = new URLSearchParams(location.search);

const ROOM_ID =
  params.get("room") ||
  localStorage.getItem("pawanvoice_room") ||
  "PV824991";


/* USER DATA */

let USER_ID =
  localStorage.getItem("pawanvoice_user_id");

if(!USER_ID){
  USER_ID =
    "PVU_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,7);

  localStorage.setItem(
    "pawanvoice_user_id",
    USER_ID
  );
}

let USER_NAME =
  localStorage.getItem("pawanvoice_name") ||
  "Pawan";

let USER_DP =
  localStorage.getItem("pawanvoice_dp") ||
  createAvatar(USER_NAME);


/* STATE */

let socket = null;

let roomState = null;

let localStream = null;

let selectedUser = null;

let micOn = false;

let speakerOn = true;

const peers = {};

const remoteAudios = {};


/* EMOJIS */

const emojis = [
  "😀","😃","😄","😁","😆","😅","😂","🤣",
  "😊","😇","🙂","🙃","😉","😌","😍","🥰",
  "😘","😗","😙","😚","😋","😛","😝","😜",
  "🤪","🤨","🧐","🤓","😎","🥳","🤩","🥺",
  "😭","😢","😥","😓","😞","😔","😟","😕",
  "🙁","☹️","😣","😖","😫","😩","🥺","😢",
  "😡","😠","🤬","😤","😱","😨","😰","😳",
  "😴","🥱","🤗","🤔","🤭","🤫","🤐","🤥",
  "👻","💀","👽","🤖","👑","💎","🔥","❤️",
  "💔","💕","💖","💗","💘","💝","💰","💵",
  "🎁","🎉","🎊","🚀","⭐","🌟","✨","🏆",
  "👏","👍","👎","🙏","💪","👌","✌️","🤝",
  "😘","😂","😭","😡","🤪","😎","🥰","😍"
];

const emojiGrid =
  document.getElementById("emojiGrid");

emojis.forEach(e => {
  const b = document.createElement("button");

  b.className = "emoji";
  b.textContent = e;

  b.onclick = () => {
    insertEmoji(e);
  };

  emojiGrid.appendChild(b);
});


/* ROOM DP */

document.getElementById("roomDp").src =
  USER_DP;


/* HEADER */

document.getElementById("roomId").textContent =
  "Room: " + ROOM_ID;


/* SOCKET */

connectSocket();


function connectSocket(){

  try{

    socket = io(SERVER,{
      transports:["websocket","polling"],
      reconnection:true,
      reconnectionAttempts:10,
      timeout:15000
    });

    socket.on("connect",()=>{

      console.log(
        "Connected:",
        socket.id
      );

      hideLoading();

      socket.emit("join-room",{
        roomId:ROOM_ID,
        userId:USER_ID,
        name:USER_NAME,
        dp:USER_DP
      });

    });


    socket.on("connect_error",(err)=>{

      console.error(err);

      showToast(
        "Room server connection problem"
      );

      document.querySelector(".loadingText")
        .textContent =
        "Connecting...";

    });


    socket.on("room-state",(state)=>{

      roomState = state;

      renderRoom(state);

      hideLoading();

      /*
       * Start WebRTC after room users are available.
       */
      setTimeout(()=>{
        createConnections();
      },500);

    });


    socket.on("room-updated",(state)=>{

      roomState = state;

      renderRoom(state);

      createConnections();

    });


    socket.on("user-joined",(user)=>{

      showToast(
        user.name + " joined the room"
      );

      createConnections();

    });


    socket.on("user-left",(user)=>{

      if(user){
        showToast(
          user.name + " left the room"
        );
      }

    });


    socket.on("message",(message)=>{

      addMessage(
        message.name,
        message.text
      );

    });


    socket.on("gift",(gift)=>{

      if(gift){

        addMessage(
          gift.fromName || "User",
          "🎁 sent " +
          (gift.giftName || "Gift")
        );

      }

    });


    socket.on("kicked",()=>{

      alert(
        "You were removed from the room."
      );

      goHome();

    });


    socket.on("banned",()=>{

      alert(
        "You are banned from this room."
      );

      goHome();

    });


    socket.on("error-message",(msg)=>{

      showToast(
        msg || "Something went wrong"
      );

    });


    /* WEBRTC */

    socket.on(
      "webrtc-offer",
      async(data)=>{
        await handleOffer(data);
      }
    );


    socket.on(
      "webrtc-answer",
      async(data)=>{
        await handleAnswer(data);
      }
    );


    socket.on(
      "webrtc-ice-candidate",
      async(data)=>{
        await handleIce(data);
      }
    );


  }catch(err){

    console.error(err);

    hideLoading();

    showToast(
      "Unable to connect"
    );

  }

}


/* RENDER ROOM */

function renderRoom(state){

  if(!state) return;

  document.getElementById("roomName")
    .textContent =
    state.roomName ||
    "PawanVoice Room";

  document.getElementById("newRoomName")
    .value =
    state.roomName ||
    "PawanVoice Room";


  const users =
    Array.isArray(state.users)
      ? state.users
      : Object.values(state.users || {});


  document.getElementById("userCount")
    .textContent =
    users.length + "/9";


  /*
   * Seats may be an array.
   */
  let seats =
    Array.isArray(state.seats)
      ? state.seats
      : [];


  /*
   * If server doesn't return seats,
   * create 9 empty seats.
   */
  if(seats.length < 9){

    const fixed = [];

    for(let i=0;i<9;i++){

      fixed.push(
        seats[i] || {
          seatNo:i+1,
          user:null
        }
      );

    }

    seats = fixed;

  }


  /*
   * Seat 1
   */
  const seat1 =
    seats.find(s =>
      Number(s.seatNo) === 1
    ) || {
      seatNo:1,
      user:null
    };


  document.getElementById("seat1")
    .innerHTML =
    seatHTML(
      seat1,
      true
    );


  /*
   * Seats 2-9
   */
  const grid =
    document.getElementById("seatGrid");

  grid.innerHTML = "";

  for(let i=2;i<=9;i++){

    const seat =
      seats.find(s =>
        Number(s.seatNo) === i
      ) || {
        seatNo:i,
        user:null
      };

    const div =
      document.createElement("div");

    div.innerHTML =
      seatHTML(
        seat,
        false
      );

    grid.appendChild(
      div.firstElementChild
    );

  }


  /*
   * Update current mic state.
   */
  const me =
    users.find(u =>
      String(u.userId) ===
      String(USER_ID)
    );

  if(me){

    micOn =
      !!me.micOn;

    speakerOn =
      me.speakerOn !== false;

    updateButtons();

  }


  /*
   * Room DP can come from server.
   */
  if(state.dp){

    document.getElementById("roomDp")
      .src =
      state.dp;

  }

}


/* SEAT HTML */

function seatHTML(
  seat,
  isHostSeat
){

  const user =
    seat &&
    seat.user
      ? seat.user
      : null;


  if(!user){

    return `
      <div class="seat emptySeat"
           onclick="takeSeat(${Number(seat.seatNo)})">

        <div class="avatarWrap">
          <div class="emptyIcon">+</div>
        </div>

        <div class="userName">
          Empty
        </div>

        <div class="seatNo">
          Seat ${Number(seat.seatNo)}
        </div>

      </div>
    `;

  }


  const dp =
    user.dp ||
    createAvatar(
      user.name || "User"
    );


  const crown =
    isHostSeat || user.isHost
      ? `<div class="hostCrown">👑</div>`
      : "";


  const micIcon =
    user.micOn
      ? "🎙️"
      : "🔇";


  return `
    <div class="seat"
         onclick="openUser('${escapeAttr(user.userId)}')">

      <div class="avatarWrap">

        ${crown}

        <img
          class="avatar"
          src="${escapeAttr(dp)}"
          alt="DP">

        <div class="micState">
          ${micIcon}
        </div>

      </div>

      <div class="userName">
        ${escapeHTML(user.name || "User")}
      </div>

      <div class="seatNo">
        Seat ${Number(seat.seatNo)}
      </div>

    </div>
  `;

}

/* MIC */

async function toggleMic(){

  if(!micOn){

    const ok =
      await startMic();

    if(!ok) return;

  }


  micOn = !micOn;


  if(localStream){

    localStream
      .getAudioTracks()
      .forEach(track=>{
        track.enabled =
          micOn;
      });

  }


  if(socket){

    socket.emit(
      "mic-toggle",
      {
        roomId:ROOM_ID,
        userId:USER_ID,
        micOn:micOn
      }
    );

  }


  updateButtons();

}


/* START MIC */

async function startMic(){

  if(localStream)
    return true;


  try{

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          },
          video:false
        });


    localStream
      .getAudioTracks()
      .forEach(track=>{
        track.enabled =
          micOn;
      });


    return true;

  }catch(err){

    console.error(err);

    showToast(
      "Microphone permission required"
    );

    return false;

  }

}

function createAvatar(name){

  const svg =
    `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="200"

          x2="1"
          y1="0"

            offset="0"
            stop-color="#7c4dff"/>

/* ESCAPE */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(value){

  return escapeHTML(value);

}


/* =========================================================
   WEBRTC VOICE
   ========================================================= */

const rtcConfig = {

  iceServers:[
    {
      urls:
        "stun:stun.l.google.com:19302"
    },
    {
      urls:
        "stun:stun1.l.google.com:19302"
    }
  ]

};


async function createConnections(){

  if(!socket || !socket.connected)
    return;

  if(!roomState)
    return;


  const users =
    Array.isArray(roomState.users)
      ? roomState.users
      : Object.values(
          roomState.users || {}
        );


  for(const user of users){

    if(
      !user ||
      String(user.userId) ===
      String(USER_ID)
    ){
      continue;
    }


    /*
     * Only create one outgoing connection
     * based on user ID ordering.
     */
    if(
      String(USER_ID) <
      String(user.userId)
    ){

      if(
        peers[user.userId]
      ){
        continue;
      }


      await makeOffer(
        user.userId
      );

    }

  }

}


async function makeOffer(targetUserId){

  try{

    await startMic();


    const pc =
      createPeer(
        targetUserId
      );


    if(!localStream){

      showToast(
        "Enable microphone for voice"
      );

      return;

    }


    localStream
      .getTracks()
      .forEach(track=>{
        pc.addTrack(
          track,
          localStream
        );
      });


    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    socket.emit(
      "webrtc-offer",
      {
        roomId:ROOM_ID,
        fromUserId:USER_ID,
        toUserId:targetUserId,
        offer:offer
      }
    );

  }catch(err){

    console.error(
      "Offer error",
      err
    );

  }

}


function createPeer(userId){

  if(peers[userId])
    return peers[userId];


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peers[userId] =
    pc;


  pc.onicecandidate =
    event=>{

      if(
        event.candidate
      ){

        socket.emit(
          "webrtc-ice-candidate",
          {
            roomId:ROOM_ID,
            fromUserId:USER_ID,
            toUserId:userId,
            candidate:
              event.candidate
          }
        );

      }

    };


  pc.ontrack =
    event=>{

      let audio =
        remoteAudios[userId];


      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.autoplay =
          true;

        audio.playsInline =
          true;

        audio.controls =
          false;

        audio.muted =
          !speakerOn;

        audio.style.display =
          "none";


        document.body
          .appendChild(audio);


        remoteAudios[userId] =
          audio;

      }


      if(
        event.streams &&
        event.streams[0]
      ){

        audio.srcObject =
          event.streams[0];

        audio.play()
          .catch(()=>{});

      }

    };


  pc.onconnectionstatechange =
    ()=>{

      if(
        [
          "failed",
          "closed",
          "disconnected"
        ].includes(
          pc.connectionState
        )
      ){

        try{
          pc.close();
        }catch(e){}

        delete peers[userId];

      }

    };


  return pc;

}


async function handleOffer(data){

  if(!data) return;


  if(
    String(data.toUserId) !==
    String(USER_ID)
  ){
    return;
  }


  try{

    /*
     * We need an audio track to send.
     * It starts disabled until mic is turned on.
     */
    await startMic();


    const pc =
      createPeer(
        data.fromUserId
      );


    if(
      localStream &&
      pc.getSenders().length === 0
    ){

      localStream
        .getTracks()
        .forEach(track=>{
          pc.addTrack(
            track,
            localStream
          );
        });

    }


    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    socket.emit(
      "webrtc-answer",
      {
        roomId:ROOM_ID,
        fromUserId:USER_ID,
        toUserId:data.fromUserId,
        answer:answer
      }
    );

  }catch(err){

    console.error(
      "Offer handling error",
      err
    );

  }

}


async function handleAnswer(data){

  if(!data) return;


  if(
    String(data.toUserId) !==
    String(USER_ID)
  ){
    return;
  }


  const pc =
    peers[data.fromUserId];


  if(!pc) return;


  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

  }catch(err){

    console.error(
      "Answer error",
      err
    );

  }

}


async function handleIce(data){

  if(!data) return;


  if(
    String(data.toUserId) !==
    String(USER_ID)
  ){
    return;
  }


  const pc =
    peers[data.fromUserId];


  if(!pc) return;


  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );

  }catch(err){

    console.error(
      "ICE error",
      err
    );

  }

}
