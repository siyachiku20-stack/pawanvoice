<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawanVoice</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
#join{
  padding-top:80px;
}
input{
  padding:15px;
  width:80%;
  max-width:300px;
  border:0;
  border-radius:10px;
  margin:15px;
}
button{
  padding:13px 20px;
  border:0;
  border-radius:25px;
  background:#2563eb;
  color:white;
  font-size:16px;
}
#room{
  display:none;
}
audio{
  width:90%;
  margin:10px;
}
</style>
</head>

<body>

<div id="join">
  <h1>🎙️ PawanVoice</h1>
  <p>Free Voice Group</p>

  <input id="name" placeholder="Apna naam likho">

  <br>

  <button onclick="start()">Join Voice Room</button>
</div>

<div id="room">

  <h2>🎙️ PawanVoice</h2>

  <p id="status">Connecting...</p>

  <button onclick="toggleMic()">🎤 Mic ON/OFF</button>

  <button onclick="location.reload()">🚪 Leave</button>

  <div id="audios"></div>

</div>

<script>

let peer;
let localStream;
let calls = [];

async function start(){

  const name =
    document.getElementById("name").value.trim();

  if(!name){
    alert("Apna naam likho");
    return;
  }

  document.getElementById("join").style.display="none";
  document.getElementById("room").style.display="block";

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:false
      });

    peer = new Peer();

    peer.on("open", function(id){

      document.getElementById("status").innerText =
        "Voice Room connected";

      console.log("My Peer ID:", id);

      /*
       Demo room:
       Sab users ko ek hi room host ID se connect
       karna hoga.
      */

      const hostId = "PAWANVOICE_HOST";

      if(id !== hostId){

        const call =
          peer.call(hostId, localStream);

        if(call){
          setupCall(call);
        }

      }

    });

    peer.on("call", function(call){

      call.answer(localStream);

      setupCall(call);

    });

    peer.on("error", function(error){

      document.getElementById("status").innerText =
        "Connection error";

      console.log(error);

    });

  }catch(error){

    alert(
      "Microphone permission allow karo."
    );

    console.log(error);

  }

}

function setupCall(call){

  calls.push(call);

  call.on("stream", function(remoteStream){

    const audio =
      document.createElement("audio");

    audio.autoplay = true;
    audio.controls = false;

    audio.srcObject = remoteStream;

    document.getElementById("audios")
      .appendChild(audio);

  });

}

function toggleMic(){

  if(!localStream) return;

  const track =
    localStream.getAudioTracks()[0];

  track.enabled = !track.enabled;

}

</script>

</body>
</html>
