<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PawanVoice</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#080810;
  color:#fff;
}

body{
  padding-bottom:78px;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}


/* ================================
   APP
================================ */

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% -10%,
      #282044 0,
      #10101c 35%,
      #080810 75%
    );
}


/* ================================
   HEADER
================================ */

.header{
  position:sticky;
  top:0;
  z-index:50;

  display:flex;
  align-items:center;
  gap:12px;

  padding:12px 14px;

  background:rgba(8,8,16,.94);
  backdrop-filter:blur(14px);

  border-bottom:1px solid #262634;
}

.header-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #8d69ff;
}

.header-info{
  min-width:0;
  flex:1;
}

.header-name{
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-id{
  margin-top:3px;
  color:#9e9eaf;
  font-size:11px;
}

.wallet-mini{
  display:flex;
  align-items:center;
  gap:5px;

  background:#191925;
  border:1px solid #302f42;
  border-radius:20px;

  padding:8px 11px;

  font-size:12px;
  white-space:nowrap;
}


/* ================================
   SEARCH
================================ */

.search-box{
  padding:13px 14px 4px;
}

.search{
  width:100%;

  padding:13px 16px;

  border-radius:24px;

  border:1px solid #2e2d3c;

  outline:none;

  background:#15151f;

  color:#fff;

  font-size:14px;
}

.search:focus{
  border-color:#7654ff;
}

.search::placeholder{
  color:#777788;
}


/* ================================
   BANNERS
================================ */

.banner-section{
  padding:12px 14px 5px;
}

.banner-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scrollbar-width:none;
}

.banner-scroll::-webkit-scrollbar{
  display:none;
}

.banner{
  min-width:230px;
  height:90px;

  border-radius:18px;

  padding:15px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  border:1px solid #393447;

  background:
    linear-gradient(
      135deg,
      #30254e,
      #171522
    );

  overflow:hidden;
}

.banner:nth-child(2){
  background:
    linear-gradient(
      135deg,
      #49342c,
      #1b1717
    );
}

.banner:nth-child(3){
  background:
    linear-gradient(
      135deg,
      #263b48,
      #151a21
    );
}

.banner-title{
  font-size:17px;
  font-weight:900;
}

.banner-sub{
  color:#c4c1d0;
  font-size:11px;
  margin-top:5px;
}


/* ================================
   SECTION
================================ */

.section{
  padding:14px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:11px;
}

.section-title{
  font-size:17px;
  font-weight:900;
}

.section-more{
  color:#a997ff;
  font-size:12px;
}


/* ================================
   TABS
================================ */

.tabs{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding:0 14px 8px;

  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:none;

  padding:9px 16px;

  border-radius:20px;

  background:#161620;

  color:#a5a4b4;

  border:1px solid #292936;

  font-size:13px;
}

.tab.active{
  background:#7655ff;
  color:#fff;
  border-color:#7655ff;
}


/* ================================
   ROOM GRID
================================ */

.room-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.room-card{
  position:relative;

  overflow:hidden;

  border-radius:17px;

  background:#14141e;

  border:1px solid #292937;

  min-width:0;

  transition:.15s;
}

.room-card:active{
  transform:scale(.98);
}

.room-cover{
  width:100%;
  aspect-ratio:1.45/1;

  object-fit:cover;

  display:block;

  background:#242433;
}

.room-content{
  padding:10px;
}

.room-name{
  font-size:14px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-owner{
  display:flex;
  align-items:center;
  gap:7px;

  margin-top:7px;

  color:#aaa9b7;

  font-size:11px;
}

.owner-dp{
  width:23px;
  height:23px;

  border-radius:50%;

  object-fit:cover;
}

.room-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-top:8px;
}

.room-count{
  color:#a99aff;
  font-size:11px;
  font-weight:700;
}

.room-category{
  color:#777789;
  font-size:10px;
}

.live-dot{
  position:absolute;
  top:9px;
  left:9px;

  padding:4px 7px;

  border-radius:9px;

  background:rgba(0,0,0,.62);

  color:#fff;

  font-size:9px;
  font-weight:800;
}


/* ================================
   EMPTY
================================ */

.empty{
  padding:35px 15px;

  text-align:center;

  color:#8f8e9d;

  border:1px dashed #302f3b;

  border-radius:17px;

  background:#101019;
}

.empty-icon{
  font-size:34px;
  margin-bottom:8px;
}

.empty-text{
  font-size:13px;
}


/* ================================
   QUICK BUTTONS
================================ */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.quick{
  min-height:76px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px;

  border-radius:15px;

  background:#15151f;

  border:1px solid #292936;

  color:#ddd;

  font-size:11px;
}

.quick-icon{
  font-size:23px;
}


/* ================================
   CREATE ROOM
================================ */

.create-card{
  margin:0 14px 15px;

  padding:16px;

  border-radius:18px;

  background:#14141e;

  border:1px solid #302e3e;
}

.input-label{
  display:block;

  color:#aaa9b7;

  font-size:11px;

  margin-bottom:6px;
}

.input{
  width:100%;

  padding:12px 13px;

  margin-bottom:11px;

  background:#0d0d15;

  border:1px solid #302f3c;

  color:#fff;

  outline:none;

  border-radius:12px;
}

.input:focus{
  border-color:#7655ff;
}

.create-button{
  width:100%;

  padding:13px;

  border-radius:13px;

  background:#7655ff;

  color:#fff;

  font-weight:800;
}

.create-button:active{
  transform:scale(.99);
}


/* ================================
   LOADING
================================ */

.loading{
  text-align:center;

  padding:30px;

  color:#8f8e9c;

  font-size:13px;
}


/* ================================
   BOTTOM NAV
================================ */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);

  z-index:100;

  width:100%;
  max-width:520px;

  height:72px;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  background:rgba(11,11,18,.97);

  border-top:1px solid #292936;

  backdrop-filter:blur(15px);
}

.nav-btn{
  background:transparent;

  color:#777786;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  gap:4px;

  font-size:10px;
}

.nav-icon{
  font-size:22px;
}

.nav-btn.active{
  color:#a48fff;
}


/* ================================
   TOAST
================================ */

.toast{
  position:fixed;

  left:50%;

  bottom:90px;

  transform:translateX(-50%) translateY(15px);

  z-index:200;

  opacity:0;
  pointer-events:none;

  background:#262433;

  border:1px solid #403c55;

  color:#fff;

  padding:10px 15px;

  border-radius:12px;

  font-size:12px;

  transition:.25s;

  max-width:90%;

  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}


/* ================================
   RESPONSIVE
================================ */

@media(max-width:360px){

  .room-list{
    grid-template-columns:1fr;
  }

  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }

}
</style>
</head>

<body>

  <div class="search-box">

  <!-- ============================

<script>

/* =========================================
   CONFIG
========================================= */

const PV_FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const PV_SERVER =
  "https://pawanvoice-1.onrender.com";


/* =========================================
   DEFAULT USER
========================================= */

const DEFAULT_DP =
  "https://i.pravatar.cc/200?img=12";


/* =========================================
   LOCAL USER
========================================= */

function getUser(){

  return {

    userId:
      localStorage.getItem("pv_userId") ||
      "pawan",

    name:
      localStorage.getItem("pv_name") ||
      "Pawan User",

    dp:
      localStorage.getItem("pv_dp") ||
      DEFAULT_DP,

    coins:
      Number(
        localStorage.getItem("pv_coins") ||
        0
      ),

    level:
      Number(
        localStorage.getItem("pv_level") ||
        1
      ),

    vipLevel:
      Number(
        localStorage.getItem("pv_vipLevel") ||
        0
      )

  };

}


let currentUser =
  getUser();


/* =========================================
   STATE
========================================= */

let allRooms = [];

let activeTab =
  "Popular";

let refreshTimer =
  null;


/* =========================================
   ELEMENTS
========================================= */

const roomList =
  document.getElementById(
    "roomList"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const roomTotal =
  document.getElementById(
    "roomTotal"
  );

const createCard =
  document.getElementById(
    "createCard"
  );


/* =========================================
   TOAST
========================================= */

function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    message;

  el.classList.add(
    "show"
  );

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () => {

        el.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================
   HEADER
========================================= */

function updateHeader(){

  currentUser =
    getUser();


  document.getElementById(
    "headerDp"
  ).src =
    currentUser.dp ||
    DEFAULT_DP;


  document.getElementById(
    "headerName"
  ).textContent =
    currentUser.name ||
    "Pawan User";


  document.getElementById(
    "headerId"
  ).textContent =
    "ID: " +
    (
      currentUser.userId ||
      "pawan"
    );


  document.getElementById(
    "walletMini"
  ).textContent =
    "🪙 " +
    (
      Number(
        currentUser.coins
      ) || 0
    ).toLocaleString();

}


updateHeader();


/* =========================================
   LOAD ROOMS FROM FIREBASE
========================================= */

async function loadRooms(){

  try{

    const response =
      await fetch(
        PV_FIREBASE_DB +
        "/rooms.json?ts=" +
        Date.now()
      );


    if(
      !response.ok
    ){

      throw new Error(
        "Firebase " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data ||
      typeof data !== "object"
    ){

      allRooms = [];

    }else{

      allRooms =
        Object.entries(
          data
        ).map(
          ([key,room]) => {

            return {

              id:
                room?.id ||
                key,

              name:
                room?.name ||
                "PawanVoice Room",

              dp:
                room?.dp ||
                room?.ownerDp ||
                DEFAULT_DP,

              owner:
                room?.owner ||
                "Guest",

              ownerId:
                room?.ownerId ||
                "",

              ownerDp:
                room?.ownerDp ||
                DEFAULT_DP,

              category:
                room?.category ||
                "General",

              users:
                Number(
                  room?.users
                ) || 0,

              seats:
                Number(
                  room?.seats
                ) || 9,

              createdAt:
                Number(
                  room?.createdAt
                ) || 0

            };

          }
        );

    }


    /*
      Latest first
    */

    allRooms.sort(
      (
        a,
        b
      ) =>
        b.createdAt -
        a.createdAt
    );


    roomTotal.textContent =
      allRooms.length +
      (
        allRooms.length === 1
          ? " room"
          : " rooms"
      );


    renderRooms();


  }catch(error){

    console.error(
      "Room load error:",
      error
    );


    /*
      Firebase unavailable होने पर
      खाली screen की जगह message.
    */

    roomList.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;">

        <div class="empty-icon">
          📡
        </div>

        <div class="empty-text">
          Rooms load नहीं हो सके।<br>
          Internet check करके फिर try करें।
        </div>

      </div>

    `;

  }

}


/* =========================================
   FILTER ROOMS
========================================= */

function getFilteredRooms(){

  let rooms =
    [...allRooms];


  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  if(
    query
  ){

    rooms =
      rooms.filter(
        room =>

          String(
            room.name
          )
          .toLowerCase()
          .includes(
            query
          )

          ||

          String(
            room.owner
          )
          .toLowerCase()
          .includes(
            query
          )

          ||

          String(
            room.ownerId
          )
          .toLowerCase()
          .includes(
            query
          )

          ||

          String(
            room.id
          )
          .toLowerCase()
          .includes(
            query
          )

      );

  }


  if(
    activeTab ===
    "New"
  ){

    rooms =
      rooms.sort(
        (
          a,
          b
        ) =>
          b.createdAt -
          a.createdAt
      );

  }


  if(
    activeTab ===
    "Popular"
  ){

    rooms =
      rooms.sort(
        (
          a,
          b
        ) =>
          (
            Number(b.users) || 0
          )
          -
          (
            Number(a.users) || 0
          )
      );

  }


  return rooms;

}


/* =========================================
   RENDER ROOMS
========================================= */

function renderRooms(){

  const rooms =
    getFilteredRooms();


  if(
    rooms.length === 0
  ){

    roomList.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;">

        <div class="empty-icon">
          🎙️
        </div>

        <div class="empty-text">
          कोई voice room नहीं मिला।
        </div>

      </div>

    `;

    return;

  }


  roomList.innerHTML =
    rooms
      .map(
        room =>
          createRoomCard(
            room
          )
      )
      .join("");


  document
    .querySelectorAll(
      "[data-room-id]"
    )
    .forEach(
      card => {

        card.addEventListener(
          "click",
          () => {

            const roomId =
              card.dataset.roomId;


            if(
              !roomId
            ){

              toast(
                "Room ID नहीं मिला"
              );

              return;

            }


            window.location.href =
              "room.html?room=" +
              encodeURIComponent(
                roomId
              );

          }
        );

      }
    );

}


/* =========================================
   ROOM CARD
========================================= */

function createRoomCard(
  room
){

  const users =
    Math.max(
      0,
      Number(
        room.users
      ) || 0
    );


  const seats =
    Math.max(
      1,
      Number(
        room.seats
      ) || 9
    );


  const safeRoomName =
    escapeHtml(
      room.name
    );


  const safeOwner =
    escapeHtml(
      room.owner
    );


  const safeCategory =
    escapeHtml(
      room.category
    );


  return `

    <div
      class="room-card"
      data-room-id="${escapeAttr(room.id)}">


      <span class="live-dot">
        🔴 LIVE
      </span>


      <img
        class="room-cover"
        src="${escapeAttr(room.dp || DEFAULT_DP)}"
        alt="Room">


      <div class="room-content">


        <div class="room-name">
          ${safeRoomName}
        </div>


        <div class="room-owner">

          <img
            class="owner-dp"
            src="${escapeAttr(
              room.ownerDp ||
              DEFAULT_DP
            )}"
            alt="Owner">


          <span>
            ${safeOwner}
          </span>

        </div>


        <div class="room-bottom">

          <span class="room-count">
            👥 ${users}/${seats}
          </span>


          <span class="room-category">
            ${safeCategory}
          </span>

        </div>

      </div>

    </div>

  `;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(
  value
){

  return escapeHtml(
    value
  );

}


/* =========================================
   CREATE ROOM ID
========================================= */

function generateRoomId(){

  return (
    "PV" +
    Math.floor(
      100000 +
      Math.random() *
      900000
    )
  );

}


/* =========================================
   CREATE ROOM
========================================= */

async function createRoom(){

  currentUser =
    getUser();


  const name =
    document
      .getElementById(
        "roomName"
      )
      .value
      .trim();


  const dp =
    document
      .getElementById(
        "roomDp"
      )
      .value
      .trim();


  const category =
    document
      .getElementById(
        "roomCategory"
      )
      .value;


  if(
    !name
  ){

    toast(
      "Room name डालिए"
    );

    return;

  }


  const roomId =
    generateRoomId();


  const room = {

    id:
      roomId,

    name:
      name,

    dp:
      dp ||
      currentUser.dp ||
      DEFAULT_DP,

    owner:
      currentUser.name ||
      "Pawan User",

    ownerId:
      currentUser.userId ||
      "pawan",

    ownerDp:
      currentUser.dp ||
      DEFAULT_DP,

    category:
      category ||
      "General",

    users:
      1,

    seats:
      9,

    createdAt:
      Date.now()

  };


  const button =
    document
      .getElementById(
        "createRoomButton"
      );


  const oldText =
    button.textContent;


  button.disabled =
    true;

  button.textContent =
    "Creating...";


  try{

    /*
      Firebase में room save.
    */

    const response =
      await fetch(

        PV_FIREBASE_DB +
        "/rooms/" +
        encodeURIComponent(
          roomId
        ) +
        ".json",

        {

          method:
            "PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              room
            )

        }

      );


    if(
      !response.ok
    ){

      throw new Error(
        "Room create failed: " +
        response.status
      );

    }


    toast(
      "Room create हो गई"
    );


    /*
      Server room खोलने पर
      Socket.IO room तैयार करेगा.
    */

    setTimeout(
      () => {

        window.location.href =
          "room.html?room=" +
          encodeURIComponent(
            roomId
          );

      },
      400
    );


  }catch(error){

    console.error(
      error
    );

    toast(
      "Room create नहीं हुई"
    );

    button.disabled =
      false;

    button.textContent =
      oldText;

  }

}
