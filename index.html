<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>PawanVoice</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#09051b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:
    radial-gradient(
      circle at 50% 0%,
      #392277 0,
      #171044 35%,
      #09051b 75%
    );
}

button{
  border:0;
  color:#fff;
  cursor:pointer;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  padding-bottom:80px;
}

/* HEADER */

.header{
  height:70px;
  display:flex;
  align-items:center;
  padding:10px 13px;
  gap:10px;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(12,7,32,.82);
  backdrop-filter:blur(15px);
}

.logo{
  font-size:20px;
  font-weight:800;
  flex:1;
}

.headerBtn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  font-size:18px;
}

.myDp{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

/* BANNERS */

.bannerRow{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:13px;
}

.bannerRow::-webkit-scrollbar{
  display:none;
}

.banner{
  flex:0 0 31%;
  min-height:88px;
  padding:12px;
  border-radius:18px;
  background:
    linear-gradient(
      135deg,
      rgba(111,68,222,.7),
      rgba(38,104,190,.35)
    );
  border:1px solid rgba(255,255,255,.08);
}

.bannerIcon{
  font-size:24px;
}

.bannerTitle{
  margin-top:7px;
  font-size:12px;
  font-weight:bold;
}

.bannerSub{
  margin-top:3px;
  font-size:9px;
  opacity:.65;
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding:0 13px 12px;
}

.action{
  padding:13px;
  border-radius:17px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.06);
  font-size:13px;
  text-align:left;
}

.action strong{
  display:block;
  font-size:14px;
}

.action span{
  display:block;
  margin-top:4px;
  opacity:.55;
  font-size:10px;
}

/* SECTION */

.section{
  padding:8px 13px;
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.sectionTitle{
  font-size:17px;
  font-weight:700;
}

.sectionMore{
  font-size:11px;
  opacity:.55;
}

/* SEARCH */

.search{
  margin:0 13px 10px;
  height:43px;
  border-radius:22px;
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  padding:0 14px;
}

.search input{
  flex:1;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:13px;
}

.search input::placeholder{
  color:rgba(255,255,255,.45);
}

/* ROOM LIST */

.rooms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.roomCard{
  min-height:150px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(
      145deg,
      #31205e,
      #171039
    );
  border:1px solid rgba(255,255,255,.07);
}

.roomCardTop{
  height:86px;
  position:relative;
  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(151,103,255,.5),
      transparent 65%
    );
}

.roomCardDp{
  width:54px;
  height:54px;
  border-radius:15px;
  object-fit:cover;
  position:absolute;
  left:12px;
  bottom:-8px;
  border:2px solid rgba(255,255,255,.2);
}

.live{
  position:absolute;
  top:9px;
  right:9px;
  padding:4px 7px;
  border-radius:10px;
  background:#e74b68;
  font-size:9px;
}

.roomCount{
  position:absolute;
  bottom:9px;
  right:9px;
  padding:4px 7px;
  border-radius:10px;
  background:rgba(0,0,0,.35);
  font-size:9px;
}

.roomBody{
  padding:15px 10px 10px;
}

.roomTitle{
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomNumber{
  font-size:9px;
  opacity:.45;
  margin-top:4px;
}

.joinBtn{
  width:100%;
  height:32px;
  border-radius:13px;
  margin-top:8px;
  background:linear-gradient(
    90deg,
    #7448e8,
    #a457dc
  );
  font-size:11px;
  font-weight:bold;
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 15px;
  opacity:.55;
  font-size:12px;
}

/* PROFILE */

.profilePanel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:flex-end;
  z-index:50;
}

.profilePanel.show{
  display:flex;
}

.profileBox{
  width:100%;
  max-width:600px;
  margin:auto;
  background:#18102f;
  border-radius:25px 25px 0 0;
  padding:20px;
}

.profileTop{
  display:flex;
  align-items:center;
  gap:13px;
}

.profileTop img{
  width:68px;
  height:68px;
  border-radius:50%;
  object-fit:cover;
}

.profileName{
  font-size:18px;
  font-weight:bold;
}

.profileId{
  font-size:10px;
  opacity:.5;
  margin-top:5px;
}

.profileAction{
  width:100%;
  height:44px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  margin-top:9px;
  text-align:left;
  padding:0 13px;
}

.close{
  float:right;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
}

/* CREATE */

.createPanel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:flex-end;
  z-index:60;
}

.createPanel.show{
  display:flex;
}

.createBox{
  width:100%;
  max-width:600px;
  margin:auto;
  background:#18102f;
  border-radius:25px 25px 0 0;
  padding:20px;
}

.input{
  width:100%;
  height:44px;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  border-radius:13px;
  background:rgba(255,255,255,.07);
  color:#fff;
  padding:0 12px;
  margin:5px 0;
}

.primary{
  width:100%;
  height:45px;
  border-radius:14px;
  margin-top:9px;
  background:linear-gradient(
    90deg,
    #7145e8,
    #a257df
  );
  font-weight:bold;
}

/* NAV */

.bottomNav{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:100%;
  max-width:600px;
  height:67px;
  display:flex;
  background:rgba(11,7,29,.96);
  border-top:1px solid rgba(255,255,255,.08);
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}

.navItem{
  flex:1;
  background:transparent;
  font-size:10px;
  opacity:.65;
}

.navItem.active{
  opacity:1;
}

.navIcon{
  font-size:20px;
  display:block;
  margin-bottom:3px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  padding:10px 15px;
  background:rgba(20,15,35,.95);
  border-radius:20px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
}

.toast.show{
  opacity:1;
}

/* RESPONSIVE */

@media(max-width:380px){
  .banner{
    flex-basis:34%;
  }

  .rooms{
    gap:8px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      PawanVoice
    </div>

    <button
      class="headerBtn"
      onclick="openInbox()">
      💌
    </button>

    <img
      id="headerDp"
      class="myDp"
      onclick="openProfile()"
      src=""
      alt="Profile">

  </div>


  <!-- BANNERS -->

  <div class="bannerRow">

    <div
      class="banner"
      onclick="showToast('Family')">

      <div class="bannerIcon">
        👨‍👩‍👧
      </div>

      <div class="bannerTitle">
        Family
      </div>

      <div class="bannerSub">
        Family Ranking
      </div>

    </div>


    <div
      class="banner"
      onclick="showToast('CP Ranking')">

      <div class="bannerIcon">
        💕
      </div>

      <div class="bannerTitle">
        CP Ranking
      </div>

      <div class="bannerSub">
        Couple Ranking
      </div>

    </div>


    <div
      class="banner"
      onclick="showToast('Rich King')">

      <div class="bannerIcon">
        👑
      </div>

      <div class="bannerTitle">
        Rich King
      </div>

      <div class="bannerSub">
        Rich Ranking
      </div>

    </div>

  </div>


  <!-- ACTIONS -->

  <div class="actions">

    <button
      class="action"
      onclick="openCreate()">

      <strong>
        🎙️ Create Room
      </strong>

      <span>
        Start your voice room
      </span>

    </button>


    <button
      class="action"
      onclick="joinRoom()">

      <strong>
        🚪 Join Room
      </strong>

      <span>
        Enter room ID
      </span>

    </button>

  </div>


  <!-- SEARCH -->

  <div class="search">

    🔎

    <input
      id="searchInput"
      placeholder="Search rooms..."
      oninput="filterRooms()">

  </div>


  <!-- POPULAR -->

  <div class="section">

    <div class="sectionHead">

      <div class="sectionTitle">
        🔥 Popular Rooms
      </div>

      <div
        class="sectionMore"
        onclick="loadRooms()">
        Refresh
      </div>

    </div>

    <div
      id="roomList"
      class="rooms">

      <div class="empty">
        Loading rooms...
      </div>

    </div>

  </div>

</div>


<!-- PROFILE PANEL -->

<div
  id="profilePanel"
  class="profilePanel"
  onclick="backdropClose(event)">

  <div class="profileBox">

    <button
      class="close"
      onclick="closeProfile()">
      ✕
    </button>

    <div class="profileTop">

      <img
        id="profileDp"
        src=""
        alt="DP">

      <div>

        <div
          id="profileName"
          class="profileName">
          Pawan
        </div>

        <div
          id="profileId"
          class="profileId">
          ID:
        </div>

      </div>

    </div>


    <button
      class="profileAction"
      onclick="editProfile()">
      ✏️ Edit Name / DP
    </button>


    <button
      class="profileAction"
      onclick="showToast('Level system')">
      ⭐ Level 1–100
    </button>


    <button
      class="profileAction"
      onclick="showToast('Coins')">
      🪙 Coins
    </button>


    <button
      class="profileAction"
      onclick="showToast('VIP')">
      💎 VIP
    </button>


    <button
      class="profileAction"
      onclick="showToast('CP Space')">
      💕 CP Space
    </button>


    <button
      class="profileAction"
      onclick="showToast('Bag')">
      🎒 Bag
    </button>

  </div>

</div>


<!-- CREATE PANEL -->

<div
  id="createPanel"
  class="createPanel"
  onclick="createBackdrop(event)">

  <div class="createBox">

    <button
      class="close"
      onclick="closeCreate()">
      ✕
    </button>

    <h2>
      Create Room
    </h2>

    <input
      id="createRoomName"
      class="input"
      maxlength="50"
      placeholder="Room name"
      value="PawanVoice Room">


    <input
      id="createRoomId"
      class="input"
      maxlength="20"
      placeholder="Room ID (optional)">


    <button
      class="primary"
      onclick="createRoom()">
      Create Room
    </button>

  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottomNav">

  <button
    class="navItem active"
    onclick="goHome()">

    <span class="navIcon">
      🏠
    </span>

    Home

  </button>


  <button
    class="navItem"
    onclick="showToast('Popular')">

    <span class="navIcon">
      🔥
    </span>

    Popular

  </button>


  <button
    class="navItem"
    onclick="openInbox()">

    <span class="navIcon">
      💌
    </span>

    Inbox

  </button>


  <button
    class="navItem"
    onclick="openProfile()">

    <span class="navIcon">
      👤
    </span>

    Profile

  </button>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
   PAWANVOICE HOME
   ========================================================= */

const SERVER =
  "https://pawanvoice-1.onrender.com";


/* USER */

let USER_ID =
  localStorage.getItem(
    "pawanvoice_user_id"
  );

if(!USER_ID){

  USER_ID =
    "PVU" +
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,6);

  localStorage.setItem(
    "pawanvoice_user_id",
    USER_ID
  );

}


let USER_NAME =
  localStorage.getItem(
    "pawanvoice_name"
  ) ||
  "Pawan";


let USER_DP =
  localStorage.getItem(
    "pawanvoice_dp"
  ) ||
  createAvatar(USER_NAME);


/* ROOM DATA */

let allRooms = [];


/* INIT */

document.getElementById(
  "headerDp"
).src = USER_DP;


loadRooms();


/* LOAD ROOMS */

async function loadRooms(){

  const list =
    document.getElementById(
      "roomList"
    );

  list.innerHTML =
    `<div class="empty">
      Loading rooms...
    </div>`;


  try{

    const response =
      await fetch(
        SERVER +
        "/api/rooms",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){
      throw new Error(
        "Room API error"
      );
    }


    allRooms =
      await response.json();


    renderRooms(
      allRooms
    );


  }catch(error){

    console.error(error);

    list.innerHTML =
      `<div class="empty">
        Unable to load rooms.<br>
        Please refresh.
      </div>`;

  }

}


/* RENDER */

function renderRooms(
  rooms
){

  const list =
    document.getElementById(
      "roomList"
    );


  if(!rooms.length){

    list.innerHTML =
      `<div class="empty">
        No rooms yet.<br>
        Create the first PawanVoice room.
      </div>`;

    return;

  }


  list.innerHTML = "";


  rooms.forEach(room=>{

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "roomCard";


    const dp =
      room.roomDp ||
      createAvatar(
        room.roomName ||
        "P"
      );


    card.innerHTML = `

      <div class="roomCardTop">

        <img
          class="roomCardDp"
          src="${escapeAttr(dp)}">

        ${
          room.online
            ? `<div class="live">
                 LIVE
               </div>`
            : ""
        }

        <div class="roomCount">
          👥 ${Number(
            room.onlineCount || 0
          )}/9
        </div>

      </div>


      <div class="roomBody">

        <div class="roomTitle">
          ${escapeHTML(
            room.roomName ||
            "PawanVoice Room"
          )}
        </div>

        <div class="roomNumber">
          ID: ${escapeHTML(
            room.roomId
          )}
        </div>

        <button
          class="joinBtn"
          onclick="openRoom(
            '${escapeAttr(
              room.roomId
            )}'
          )">

          JOIN ROOM

        </button>

      </div>
    `;


    list.appendChild(card);

  });

}


/* SEARCH */

function filterRooms(){

  const q =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  if(!q){

    renderRooms(
      allRooms
    );

    return;

  }


  renderRooms(
    allRooms.filter(room =>
      String(
        room.roomName || ""
      )
      .toLowerCase()
      .includes(q) ||

      String(
        room.roomId || ""
      )
      .toLowerCase()
      .includes(q)
    )
  );

}


/* OPEN ROOM */

function openRoom(
  roomId
){

  localStorage.setItem(
    "pawanvoice_room",
    roomId
  );


  location.href =
    "room.html?room=" +
    encodeURIComponent(
      roomId
    );

}


/* JOIN MANUALLY */

function joinRoom(){

  const id =
    prompt(
      "Enter Room ID"
    );


  if(!id) return;


  openRoom(
    id.trim()
  );

}


/* CREATE PANEL */

function openCreate(){

  document
    .getElementById(
      "createPanel"
    )
    .classList.add(
      "show"
    );

}


function closeCreate(){

  document
    .getElementById(
      "createPanel"
    )
    .classList.remove(
      "show"
    );

}


async function createRoom(){

  const roomName =
    document.getElementById(
      "createRoomName"
    )
    .value
    .trim();


  let roomId =
    document.getElementById(
      "createRoomId"
    )
    .value
    .trim();


  if(!roomName){

    showToast(
      "Enter room name"
    );

    return;

  }


  if(!roomId){

    roomId =
      "PV" +
      Math.floor(
        100000 +
        Math.random() *
        900000
      );

  }


  try{

    const response =
      await fetch(
        SERVER +
        "/api/create-room",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              roomId,
              roomName,
              userId:
                USER_ID,
              name:
                USER_NAME,
              dp:
                USER_DP
            })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      showToast(
        data.error ||
        "Room create failed"
      );

      return;

    }


    closeCreate();


    openRoom(
      data.room.roomId
    );


  }catch(error){

    console.error(error);

    showToast(
      "Server connection error"
    );

  }

}


/* PROFILE */

function openProfile(){

  document.getElementById(
    "profileDp"
  ).src =
    USER_DP;


  document.getElementById(
    "profileName"
  ).textContent =
    USER_NAME;


  document.getElementById(
    "profileId"
  ).textContent =
    "ID: " +
    USER_ID;


  document
    .getElementById(
      "profilePanel"
    )
    .classList.add(
      "show"
    );

}


function closeProfile(){

  document
    .getElementById(
      "profilePanel"
    )
    .classList.remove(
      "show"
    );

}


/* EDIT PROFILE */

async function editProfile(){

  const name =
    prompt(
      "Enter your name",
      USER_NAME
    );


  if(!name) return;


  const newName =
    name.trim();


  if(!newName) return;


  const dp =
    prompt(
      "Paste DP image URL",
      USER_DP.startsWith(
        "data:"
      )
        ? ""
        : USER_DP
    );


  USER_NAME =
    newName.slice(
      0,
      40
    );


  if(dp !== null){

    if(
      dp.trim()
    ){

      USER_DP =
        dp.trim();

    }else{

      USER_DP =
        createAvatar(
          USER_NAME
        );

    }

  }


  localStorage.setItem(
    "pawanvoice_name",
    USER_NAME
  );

  localStorage.setItem(
    "pawanvoice_dp",
    USER_DP
  );


  document.getElementById(
    "headerDp"
  ).src =
    USER_DP;


  document.getElementById(
    "profileDp"
  ).src =
    USER_DP;


  document.getElementById(
    "profileName"
  ).textContent =
    USER_NAME;


  try{

    await fetch(
      SERVER +
      "/api/user/" +
      encodeURIComponent(
        USER_ID
      ),
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            name:
              USER_NAME,
            dp:
              USER_DP
          })
      }
    );

  }catch(e){

    console.log(
      "Profile save:",
      e
    );

  }


  showToast(
    "Profile updated"
  );

}


/* INBOX */

function openInbox(){

  showToast(
    "Inbox system connected next"
  );

}


/* HOME */

function goHome(){
  window.scrollTo(
    0,
    0
  );
}


/* BACKDROP */

function backdropClose(e){

  if(
    e.target ===
    document.getElementById(
      "profilePanel"
    )
  ){

    closeProfile();

  }

}


function createBackdrop(e){

  if(
    e.target ===
    document.getElementById(
      "createPanel"
    )
  ){

    closeCreate();

  }

}


/* TOAST */

let toastTimer;

function showToast(
  text
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    text;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(()=>{
      toast.classList.remove(
        "show"
      );
    },2200);

}


/* AVATAR */

function createAvatar(
  name
){

  const letter =
    String(
      name || "P"
    )
    .trim()
    .charAt(0)
    .toUpperCase();


  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="200"
         height="200">

      <defs>

        <linearGradient
          id="g"
          x1="0"
          x2="1"
          y1="0"
          y2="1">

          <stop
            offset="0"
            stop-color="#7047e8"/>

          <stop
            offset="1"
            stop-color="#d258dc"/>

        </linearGradient>

      </defs>

      <rect
        width="200"
        height="200"
        rx="100"
        fill="url(#g)"/>

      <text
        x="100"
        y="128"
        text-anchor="middle"
        font-family="Arial"
        font-size="90"
        fill="white">
        ${letter}
      </text>

    </svg>
  `;


  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
      svg
    )
  );

}


/* ESCAPE */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}
