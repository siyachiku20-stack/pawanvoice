<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>PawanVoice</title>

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      padding:0;
      background:#090b12;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      padding-bottom:78px;
    }

    button,input,select{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
    }

    .app{
      width:100%;
      max-width:720px;
      margin:auto;
    }

    .top{
      padding:14px 14px 10px;
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(9,11,18,.96);
      backdrop-filter:blur(12px);
      border-bottom:1px solid #191d29;
    }

    .top-row{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .dp{
      width:48px;
      height:48px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid #ffca3a;
      background:#222;
    }

    .user-info{
      flex:1;
      min-width:0;
    }

    .user-name{
      font-size:16px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .user-id{
      margin-top:3px;
      font-size:11px;
      color:#8e95a8;
    }

    .wallet{
      display:flex;
      gap:6px;
    }

    .wallet-box{
      min-width:64px;
      padding:7px 8px;
      border-radius:12px;
      background:#141823;
      border:1px solid #242a39;
      text-align:center;
      font-size:11px;
    }

    .wallet-box b{
      display:block;
      margin-top:2px;
      color:#ffd166;
    }

    .search{
      margin-top:12px;
      display:flex;
      align-items:center;
      gap:8px;
      background:#141823;
      border:1px solid #242a39;
      border-radius:14px;
      padding:0 12px;
    }

    .search span{
      color:#737b8e;
    }

    .search input{
      width:100%;
      height:44px;
      border:0;
      outline:0;
      background:transparent;
      color:#fff;
    }

    .search input::placeholder{
      color:#70788b;
    }

    main{
      padding:12px;
    }

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:12px 2px 9px;
    }

    .section-title h2{
      margin:0;
      font-size:17px;
    }

    .section-title span{
      color:#7f8799;
      font-size:11px;
    }

    /* BANNERS */

    .banner-wrap{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .banner{
      min-height:94px;
      border-radius:16px;
      padding:12px 10px;
      position:relative;
      overflow:hidden;
      border:1px solid #292e3d;
      background:linear-gradient(145deg,#171b28,#10131c);
    }

    .banner:nth-child(1){
      background:linear-gradient(145deg,#38230f,#17120c);
    }

    .banner:nth-child(2){
      background:linear-gradient(145deg,#21183c,#11121d);
    }

    .banner:nth-child(3){
      background:linear-gradient(145deg,#11322c,#10181a);
    }

    .banner-icon{
      font-size:24px;
    }

    .banner strong{
      display:block;
      margin-top:6px;
      font-size:12px;
    }

    .banner small{
      display:block;
      margin-top:4px;
      color:#9ba2b3;
      font-size:9px;
      line-height:1.3;
    }

    /* TABS */

    .tabs{
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding:4px 0 8px;
      scrollbar-width:none;
    }

    .tabs::-webkit-scrollbar{
      display:none;
    }

    .tab{
      flex:0 0 auto;
      padding:9px 16px;
      border-radius:20px;
      background:#141823;
      border:1px solid #242a39;
      color:#9ca4b6;
      font-size:12px;
    }

    .tab.active{
      background:#ffd166;
      color:#111;
      border-color:#ffd166;
      font-weight:700;
    }

    /* ROOMS */

    #rooms{
      display:grid;
      gap:10px;
    }

    .room-card{
      background:#11151f;
      border:1px solid #242a39;
      border-radius:17px;
      padding:12px;
      display:flex;
      gap:11px;
      align-items:center;
    }

    .room-dp{
      width:62px;
      height:62px;
      border-radius:15px;
      object-fit:cover;
      background:#222;
      border:1px solid #343b4e;
      flex:0 0 auto;
    }

    .room-main{
      min-width:0;
      flex:1;
    }

    .room-name{
      font-size:14px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .room-host{
      color:#b0b6c5;
      font-size:11px;
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .room-meta{
      display:flex;
      flex-wrap:wrap;
      gap:5px;
      margin-top:7px;
    }

    .pill{
      padding:4px 7px;
      border-radius:7px;
      background:#1a1f2b;
      color:#9ea6b8;
      font-size:9px;
    }

    .live{
      color:#73e6a3;
    }

    .join{
      min-width:64px;
      padding:10px 11px;
      border-radius:12px;
      background:#ffd166;
      color:#111;
      font-size:11px;
      font-weight:700;
    }

    .empty{
      text-align:center;
      padding:38px 20px;
      border:1px dashed #303747;
      border-radius:16px;
      color:#858da0;
    }

    .empty-icon{
      font-size:34px;
      margin-bottom:8px;
    }

    /* QUICK */

    .quick-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .quick{
      background:#121722;
      border:1px solid #252b3a;
      border-radius:14px;
      min-height:76px;
      color:#fff;
      padding:8px 4px;
    }

    .quick-icon{
      font-size:22px;
      display:block;
    }

    .quick span:last-child{
      display:block;
      margin-top:5px;
      font-size:10px;
      color:#a4abbc;
    }

    /* CREATE */

    .create-box{
      background:#11151f;
      border:1px solid #242a39;
      border-radius:17px;
      padding:13px;
    }

    .field{
      margin-bottom:10px;
    }

    .field label{
      display:block;
      color:#9aa2b5;
      font-size:11px;
      margin-bottom:6px;
    }

    .field input,
    .field select{
      width:100%;
      height:44px;
      border-radius:11px;
      border:1px solid #2b3141;
      outline:0;
      background:#0c1018;
      color:#fff;
      padding:0 12px;
    }

    .create-btn{
      width:100%;
      height:45px;
      border-radius:12px;
      background:#ffd166;
      color:#111;
      font-weight:700;
    }

    /* PROFILE MODAL */

    .modal{
      display:none;
      position:fixed;
      inset:0;
      z-index:100;
      background:rgba(0,0,0,.75);
      align-items:flex-end;
      justify-content:center;
    }

    .modal.show{
      display:flex;
    }

    .modal-box{
      width:100%;
      max-width:720px;
      max-height:85vh;
      overflow:auto;
      background:#11151f;
      border:1px solid #292f3e;
      border-radius:24px 24px 0 0;
      padding:18px;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }

    .modal-head h3{
      margin:0;
    }

    .close{
      width:36px;
      height:36px;
      border-radius:50%;
      background:#202532;
      color:#fff;
    }

    .profile-big{
      display:flex;
      align-items:center;
      gap:12px;
      background:#171c27;
      padding:12px;
      border-radius:15px;
    }

    .profile-big img{
      width:64px;
      height:64px;
      border-radius:50%;
      object-fit:cover;
    }

    .profile-stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:7px;
      margin-top:10px;
    }

    .stat{
      background:#171c27;
      border-radius:12px;
      padding:10px 5px;
      text-align:center;
    }

    .stat b{
      display:block;
      font-size:13px;
    }

    .stat small{
      display:block;
      margin-top:3px;
      color:#7f8799;
      font-size:9px;
    }

    .profile-actions{
      display:grid;
      gap:8px;
      margin-top:12px;
    }

    .profile-action{
      height:44px;
      border-radius:12px;
      background:#1a1f2b;
      color:#fff;
      text-align:left;
      padding:0 13px;
    }

    /* BOTTOM */

    .bottom{
      position:fixed;
      z-index:50;
      left:0;
      right:0;
      bottom:0;
      background:rgba(12,15,23,.97);
      border-top:1px solid #252b39;
      display:flex;
      justify-content:center;
      backdrop-filter:blur(10px);
    }

    .bottom-inner{
      width:100%;
      max-width:720px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
    }

    .nav{
      height:68px;
      background:transparent;
      color:#7f8799;
    }

    .nav.active{
      color:#ffd166;
    }

    .nav-icon{
      display:block;
      font-size:21px;
    }

    .nav-text{
      display:block;
      margin-top:4px;
      font-size:10px;
    }

    .toast{
      position:fixed;
      z-index:200;
      left:50%;
      bottom:85px;
      transform:translateX(-50%);
      background:#f5f5f5;
      color:#111;
      padding:10px 15px;
      border-radius:12px;
      font-size:12px;
      display:none;
      max-width:90%;
    }

    .toast.show{
      display:block;
    }

    @media(max-width:420px){
      .banner-wrap{
        grid-template-columns:repeat(3,1fr);
      }

      .banner{
        min-height:88px;
        padding:9px 7px;
      }

      .banner-icon{
        font-size:21px;
      }

      .banner strong{
        font-size:10px;
      }

      .banner small{
        font-size:8px;
      }

      .room-dp{
        width:56px;
        height:56px;
      }

      .join{
        min-width:58px;
        padding:9px 7px;
      }
    }
  </style>
</head>

<body>

<script src="user.js"></script>

<script>
  "use strict";

  const FIREBASE_DB =
    "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

  const SERVER_URL =
    window.location.origin;

  let currentUser = null;
  let allRooms = [];
  let currentTab = "popular";
  let refreshTimer = null;

  const DEFAULT_DP =
    "https://i.pravatar.cc/200?img=12";


  /* =========================
     HELPERS
  ========================= */

  function safeNumber(value, fallback = 0){
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  }

  function escapeHtml(value){
    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function showToast(message){
    const toast =
      document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
      setTimeout(() => {
        toast.classList.remove("show");
      },2200);
  }

  function getRoomId(){
    return (
      "PV" +
      Math.floor(
        100000 +
        Math.random() * 900000
      )
    );
  }


  /* =========================
     USER
  ========================= */

  async function loadCurrentUser(){

    try{

      if(typeof pvLoadUser === "function"){
        currentUser =
          await pvLoadUser();
      }

    }catch(error){
      console.error(error);
    }

    if(!currentUser){

      currentUser = {
        userId:
          localStorage.getItem("pv_userId") ||
          "pawan",

        name:
          localStorage.getItem("pv_name") ||
          "Pawan User",

        dp:
          localStorage.getItem("pv_dp") ||
          DEFAULT_DP,

        level:
          safeNumber(
            localStorage.getItem("pv_level"),
            1
          ),

        exp:
          safeNumber(
            localStorage.getItem("pv_exp"),
            0
          ),

        coins:
          safeNumber(
            localStorage.getItem("pv_coins"),
            0
          ),

        diamonds:
          safeNumber(
            localStorage.getItem("pv_diamonds"),
            0
          ),

        following:
          safeNumber(
            localStorage.getItem("pv_following"),
            0
          ),

        followers:
          safeNumber(
            localStorage.getItem("pv_followers"),
            0
          ),

        vipLevel:
          safeNumber(
            localStorage.getItem("pv_vipLevel"),
            0
          )
      };
    }

    renderUser();
  }


  function renderUser(){

    if(!currentUser) return;

    const dp =
      currentUser.dp ||
      DEFAULT_DP;

    document.getElementById("headerDp").src = dp;

    document.getElementById("headerName")
      .textContent =
      currentUser.name ||
      "Pawan User";

    document.getElementById("headerId")
      .textContent =
      "ID: " +
      (currentUser.userId || "pawan");

    document.getElementById("coins")
      .textContent =
      safeNumber(currentUser.coins,0)
      .toLocaleString();

    document.getElementById("diamonds")
      .textContent =
      safeNumber(currentUser.diamonds,0)
      .toLocaleString();
  }


  /* =========================
     FIREBASE
  ========================= */

  async function firebaseGet(path){

    const response =
      await fetch(
        FIREBASE_DB +
        "/" +
        path +
        ".json"
      );

    if(!response.ok){
      throw new Error(
        "Firebase GET " +
        response.status
      );
    }

    return await response.json();
  }


  async function firebasePatch(path,data){

    const response =
      await fetch(
        FIREBASE_DB +
        "/" +
        path +
        ".json",
        {
          method:"PATCH",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify(data)
        }
      );

    if(!response.ok){
      throw new Error(
        "Firebase PATCH " +
        response.status
      );
    }

    return await response.json();
  }


  /* =========================
     ROOMS
  ========================= */

  async function loadRooms(){

    const status =
      document.getElementById("roomStatus");

    status.textContent =
      "Updating...";

    try{

      const data =
        await firebaseGet("rooms");

      const list = [];

      if(data && typeof data === "object"){

        Object.keys(data).forEach(key => {

          const room =
            data[key];

          if(!room || typeof room !== "object"){
            return;
          }

          const roomId =
            room.id ||
            key;

          list.push({
            ...room,
            id: roomId,
            users:
              safeNumber(
                room.users,
                0
              ),
            seats:
              safeNumber(
                room.seats,
                9
              )
          });

        });
      }

      allRooms = list;

      renderRooms();

      status.textContent =
        allRooms.length +
        " rooms";

    }catch(error){

      console.error(
        "Rooms load:",
        error
      );

      status.textContent =
        "Offline";

      renderRooms();
    }
  }


  function getFilteredRooms(){

    let rooms =
      [...allRooms];

    const search =
      document.getElementById(
        "searchInput"
      ).value
      .trim()
      .toLowerCase();

    if(search){

      rooms =
        rooms.filter(room => {

          const text = [
            room.name,
            room.owner,
            room.ownerName,
            room.category,
            room.id
          ]
          .join(" ")
          .toLowerCase();

          return text.includes(search);
        });
    }


    if(currentTab === "new"){

      rooms.sort(
        (a,b) =>
          safeNumber(b.createdAt,0) -
          safeNumber(a.createdAt,0)
      );

    }else if(currentTab === "popular"){

      rooms.sort(
        (a,b) =>
          safeNumber(b.users,0) -
          safeNumber(a.users,0)
      );

    }else{

      rooms.sort(
        (a,b) =>
          safeNumber(b.lastActiveAt,b.createdAt || 0) -
          safeNumber(a.lastActiveAt,a.createdAt || 0)
      );
    }

    return rooms;
  }


  function renderRooms(){

    const container =
      document.getElementById("rooms");

    const rooms =
      getFilteredRooms();

    if(!rooms.length){

      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🎙️</div>
          <div>No live rooms found</div>
          <small>Create a room and become the first host.</small>
        </div>
      `;

      return;
    }

    container.innerHTML =
      rooms.map(room => {

        const users =
          Math.max(
            0,
            safeNumber(room.users,0)
          );

        const seats =
          Math.max(
            1,
            safeNumber(room.seats,9)
          );

        const dp =
          room.dp ||
          room.ownerDp ||
          DEFAULT_DP;

        const owner =
          room.owner ||
          room.ownerName ||
          "Host";

        const category =
          room.category ||
          "General";

        const roomName =
          room.name ||
          "PawanVoice Room";

        return `
          <article class="room-card">

            <img
              class="room-dp"
              src="${escapeHtml(dp)}"
              alt="Room"
              onerror="this.src='${DEFAULT_DP}'"
            >

            <div class="room-main">

              <div class="room-name">
                ${escapeHtml(roomName)}
              </div>

              <div class="room-host">
                👑 ${escapeHtml(owner)}
              </div>

              <div class="room-meta">

                <span class="pill live">
                  🟢 LIVE
                </span>

                <span class="pill">
                  👥 ${users}/${seats}
                </span>

                <span class="pill">
                  🎙️ ${escapeHtml(category)}
                </span>

                <span class="pill">
                  #${escapeHtml(room.id)}
                </span>

              </div>

            </div>

            <button
              class="join"
              type="button"
              onclick="joinRoom('${escapeHtml(room.id)}')"
            >
              JOIN
            </button>

          </article>
        `;

      }).join("");
  }


  /* =========================
     TAB
  ========================= */

  function changeTab(tab){

    currentTab =
      tab;

    document
      .querySelectorAll(".tab")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.tab === tab
        );

      });

    renderRooms();
  }


  /* =========================
     JOIN
  ========================= */

  function joinRoom(roomId){

    if(!roomId){
      showToast("Room ID missing");
      return;
    }

    location.href =
      "room.html?room=" +
      encodeURIComponent(roomId);
  }


  /* =========================
     CREATE ROOM
  ========================= */

  function showCreateRoom(){

    const section =
      document.getElementById(
        "createSection"
      );

    if(section.style.display === "none"){

      section.style.display =
        "block";

      section.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    }else{

      section.style.display =
        "none";
    }
  }


  async function createRoom(){

    if(!currentUser){

      showToast(
        "User is loading..."
      );

      return;
    }

    const input =
      document.getElementById(
        "roomName"
      );

    const category =
      document.getElementById(
        "roomCategory"
      ).value;

    const name =
      input.value.trim();

    if(!name){

      showToast(
        "Room name enter karo"
      );

      input.focus();

      return;
    }

    const roomId =
      getRoomId();

    const room = {

      id: roomId,

      name: name,

      dp:
        currentUser.dp ||
        DEFAULT_DP,

      owner:
        currentUser.name ||
        "Host",

      ownerId:
        currentUser.userId ||
        "pawan",

      ownerDp:
        currentUser.dp ||
        DEFAULT_DP,

      category:
        category ||
        "General",

      users: 0,

      seats: 9,

      live: true,

      createdAt:
        Date.now(),

      lastActiveAt:
        Date.now()

    };

    try{

      await firebasePatch(
        "rooms/" +
        encodeURIComponent(roomId),
        room
      );

      input.value = "";

      showToast(
        "Room created!"
      );

      await loadRooms();

      setTimeout(() => {
        joinRoom(roomId);
      },500);

    }catch(error){

      console.error(
        "Create room:",
        error
      );

      showToast(
        "Room create nahi hua"
      );
    }
  }


  /* =========================
     PROFILE
  ========================= */

  function openProfile(){

    if(!currentUser){
      return;
    }

    document.getElementById(
      "modalDp"
    ).src =
      currentUser.dp ||
      DEFAULT_DP;

    document.getElementById(
      "modalName"
    ).textContent =
      currentUser.name ||
      "Pawan User";

    document.getElementById(
      "modalId"
    ).textContent =
      "ID: " +
      (currentUser.userId || "pawan");

    document.getElementById(
      "modalLevel"
    ).textContent =
      safeNumber(
        currentUser.level,
        1
      );

    document.getElementById(
      "modalVip"
    ).textContent =
      safeNumber(
        currentUser.vipLevel,
        0
      );

    document.getElementById(
      "modalFollowing"
    ).textContent =
      safeNumber(
        currentUser.following,
        0
      );

    document.getElementById(
      "modalFollowers"
    ).textContent =
      safeNumber(
        currentUser.followers,
        0
      );

    document.getElementById(
      "modalCoins"
    ).textContent =
      safeNumber(
        currentUser.coins,
        0
      ).toLocaleString();

    document.getElementById(
      "modalDiamonds"
    ).textContent =
      safeNumber(
        currentUser.diamonds,
        0
      ).toLocaleString();

    document.getElementById(
      "modalExp"
    ).textContent =
      safeNumber(
        currentUser.exp,
        0
      ).toLocaleString();

    document.getElementById(
      "modalRoomCount"
    ).textContent =
      allRooms.filter(
        room =>
          room.ownerId ===
          currentUser.userId
      ).length;

    document.getElementById(
      "profileModal"
    ).classList.add("show");
  }


  function closeProfile(){

    document.getElementById(
      "profileModal"
    ).classList.remove("show");
  }


  function closeProfileOutside(event){

    if(
      event.target.id ===
      "profileModal"
    ){
      closeProfile();
    }
  }


  /* =========================
     RANKING
  ========================= */

  function openRanking(type){

    if(type === "rich"){
      location.href =
        "ranking.html?type=rich";
      return;
    }

    if(type === "cp"){
      location.href =
        "ranking.html?type=cp";
      return;
    }

    if(type === "family"){
      location.href =
        "ranking.html?type=family";
      return;
    }

    location.href =
      "ranking.html";
  }


  function goHome(){

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }


  /* =========================
     SEARCH
  ========================= */

  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      renderRooms
    );


  /* =========================
     INIT
  ========================= */

  async function init(){

    await loadCurrentUser();

    await loadRooms();

    /*
      Firebase REST polling.
      Server.js will keep the room
      summary updated as users join
      and leave.
    */

    clearInterval(
      refreshTimer
    );

    refreshTimer =
      setInterval(
        loadRooms,
        4000
      );
  }


  init();

</script>

</body>
</html>
