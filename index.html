<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawanVoice</title>
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    html, body, #meet {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
  </style>
</head>

<body>
  <div id="meet"></div>

  <script>
    const roomName = "PawanVoiceRoom2026";

    const api = new JitsiMeetExternalAPI("meet.jit.si", {
      roomName: roomName,
      parentNode: document.querySelector("#meet"),
      width: "100%",
      height: "100%",
      userInfo: {
        displayName: "Pawan"
      },
      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: true
      }
    });
  </script>
</body>
</html>
