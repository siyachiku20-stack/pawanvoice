<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PawanVoice</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
  margin:0;
  padding:18px;
  padding-bottom:80px;
  background:#111;
  color:white;
  font-family:Arial;
}

h1{text-align:center}

.box{
  background:#222;
  padding:16px;
  margin:12px 0;
  border-radius:12px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:6px 0;
  border:0;
  border-radius:8px;
  font-size:16px;
}

button{
  padding:11px 16px;
  margin:5px;
  border:0;
  border-radius:8px;
  font-size:15px;
}

.room{
  background:#333;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#222;
  display:flex;
  justify-content:space-around;
  padding:9px 0;
  z-index:999;
}

.bottom-nav button{
  background:none;
  color:white;
  margin:0;
}

.page{
  display:none;
}

.page.active{
  display:block;
}
</style>

</head>

<body>

<h1>🎙️ PawanVoice</h1>

<div id="roomPage" class="page active">

<div class="box">

<h3>👤 आपका Profile</h3>

<input id="userName" placeholder="अपना नाम लिखो">

<button onclick="saveProfile()">Save Profile</button>

<p>🆔 ID: <span id="myId"></span></p>
<p>⭐ Level: 1</p>
<p>🏅 Medal: None</p>
<p>🚻 Gender: <span id="myGender">Not Selected</span></p>

<button onclick="selectGender('Male')">👨 Male</button>
<button onclick="selectGender('Female')">👩 Female</button>

</div>

<div class="box">

<h3>➕ Create Room</h3>

<input id="roomName" placeholder="Room ka naam">

<button onclick="createRoom()">🎙️ Create Room</button>

</div>

<div class="box">

<h3>🏠 Voice Rooms</h3>

<div id="rooms">
Rooms load ho rahe hain...
</div>

</div>

</div>


<div id="inboxPage" class="page">

  <div class="box">

    <h2>💬 Inbox</h2>

    <div id="inboxMessages">
  <p>कोई message नहीं है।</p>
</div>

<div id="privateChatBox" style="display:none;">
  <h3 id="chatWithUser"></h3>
  <div id="chatMessages"></div>
  <input id="chatText" placeholder="Message लिखो">
  <button onclick="sendChatMessage()">Send</button>
</div>

  </div>

</div>


<div id="mePage" class="page">

<div class="box">

<h2>👤 My Profile</h2>
<button onclick="showFollow()">➕ Follow</button>
<h3>Follow Requests</h3>
<div id="followRequests"></div>
<h3>My Friends</h3>
<div id="friendsList"></div>
<p>👤 Name: <span id="profileName"></span></p>
<p>🆔 ID: <span id="profileId"></span></p>
<p>⭐ Level: 1</p>
<p>🏅 Medal: None</p>
<p>🚻 Gender: <span id="profileGender"></span></p>

</div>

</div>


<div class="bottom-nav">

<button onclick="showPage('room')">
🏠<br>Room
</button>

<button onclick="showPage('inbox')">
💬<br>Inbox
</button>

<button onclick="showPage('me')">
👤<br>Me
</button>

</div>


<script>

const firebaseConfig={

apiKey:"AIzaSyDnlTdeqG5aPHrUIV6kTYnM521GtbrrE",

authDomain:"pawanvoice-68c5e.firebaseapp.com",

databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com",

projectId:"pawanvoice-68c5e",

storageBucket:"pawanvoice-68c5e.firebasestorage.app",

messagingSenderId:"148446327241",

appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();


let myId=localStorage.getItem("pawanId");

function createUserId(){

  return db.ref("system/nextUserId").transaction(function(current){

    if(current===null){
      return 1000031;
    }

    return Number(current)+1;

  }).then(function(result){

    if(result.committed){

      myId=String(result.snapshot.val());

      localStorage.setItem("pawanId",myId);

      document.getElementById("myId").innerText=myId;
      document.getElementById("profileId").innerText=myId;

    }

  });

}

if(!myId){

  createUserId();

}else{

  document.getElementById("myId").innerText=myId;
  document.getElementById("profileId").innerText=myId;

}

document.getElementById("myId").innerText=myId;

document.getElementById("profileId").innerText=myId;


let savedName=localStorage.getItem("pawanName") || "";

document.getElementById("userName").value=savedName;

document.getElementById("profileName").innerText=savedName;


let savedGender=localStorage.getItem("pawanGender") || "Not Selected";

document.getElementById("myGender").innerText=savedGender;

document.getElementById("profileGender").innerText=savedGender;


function saveProfile(){

let name=document.getElementById("userName").value.trim();

if(!name){

alert("Apna naam likho");

return;

}

localStorage.setItem("pawanName",name);

document.getElementById("profileName").innerText=name;

alert("Profile save ho gaya");

}


function selectGender(gender){

localStorage.setItem("pawanGender",gender);

document.getElementById("myGender").innerText=gender;

document.getElementById("profileGender").innerText=gender;

alert("Gender selected: "+gender);

}


function createRoom(){

let name=document.getElementById("roomName").value.trim();

let userName=document.getElementById("userName").value.trim();

if(!userName){

alert("Pehle apna naam likho");

return;

}

if(!name){

alert("Room ka naam likho");

return;

}

localStorage.setItem("pawanName",userName);

let id=Date.now().toString();

db.ref("rooms/"+id).set({

name:name,

owner:userName,

ownerId:myId,

users:0,

createdAt:Date.now()

}).then(function(){

location.href="room.html?id="+id;

}).catch(function(error){

alert("Room create nahi hua: "+error.message);

});

}


function loadRooms(){

const box=document.getElementById("rooms");

db.ref("rooms").on("value",function(snapshot){

box.innerHTML="";

if(!snapshot.exists()){

box.innerHTML="Abhi koi room nahi hai.";

return;

}

snapshot.forEach(function(child){

let id=child.key;

let room=child.val();

let div=document.createElement("div");

div.className="room";

div.innerHTML=

"<h3>🎙️ "+(room.name||"Room")+"</h3>"+

"<p>👤 Owner: "+(room.owner||"User")+"</p>"+

"<p>👥 Members: "+(room.users||0)+"/9</p>"+

"<button onclick=\"joinRoom('"+id+"')\">🚪 Join Room</button>";

box.appendChild(div);

});

});

}


function joinRoom(id){

let name=document.getElementById("userName").value.trim();

if(!name){

alert("Pehle apna naam likho");

return;

}

localStorage.setItem("pawanName",name);

location.href="room.html?id="+id;

}


function showPage(page){

document.getElementById("roomPage").classList.remove("active");

document.getElementById("inboxPage").classList.remove("active");

document.getElementById("mePage").classList.remove("active");

if(page==="room"){

document.getElementById("roomPage").classList.add("active");

}

if(page==="inbox"){

document.getElementById("inboxPage").classList.add("active");

}

if(page==="me"){

document.getElementById("mePage").classList.add("active");

}

}


loadRooms();
loadFollowRequests();
function showFollow(){

  let userId=prompt("जिस User को Follow करना है उसकी ID डालो");

  if(!userId){
    return;
  }

  if(userId===myId){
    alert("खुद को Follow नहीं कर सकते");
    return;
  }

  db.ref("follows/"+userId+"/"+myId).set({
    userId:myId,
    time:Date.now()
  }).then(function(){

    alert("Follow request भेज दी गई");

  }).catch(function(error){

    alert("Follow नहीं हुआ: "+error.message);

  });

}
  function acceptFollow(userId){

  db.ref("friends/"+myId+"/"+userId).set(true);
  db.ref("friends/"+userId+"/"+myId).set(true);

  alert("Friend बन गया ✅");
  }
  function loadFollowRequests(){

  db.ref("follows/"+myId).on("value",function(snapshot){

    let box=document.getElementById("followRequests");

    box.innerHTML="";

    if(!snapshot.exists()){
      box.innerHTML="<p>कोई Follow Request नहीं है</p>";
      return;
    }

    snapshot.forEach(function(child){

      let userId=child.key;

      box.innerHTML+=
        "<p>User ID: "+userId+
        ' <button onclick="acceptFollow(\''+userId+'\')">Accept</button></p>';

    });

  });

  }
function loadFriends(){

  db.ref("friends/"+myId).on("value",function(snapshot){

    let box=document.getElementById("friendsList");
    box.innerHTML="";

    snapshot.forEach(function(child){

      box.innerHTML +=
        "<p>Friend ID: "+child.key+"</p>";

    });

  });

  }
</script>
<div class="box">
  <h2>💬 Private Chat</h2>

  <input id="chatUserId" placeholder="जिस User से chat करनी है उसकी ID">

  <input id="privateMessage" placeholder="Message लिखो">

  <button onclick="sendPrivateMessage()">Send</button>

  <div id="privateMessages"></div>
</div>

<script>
function sendPrivateMessage(){

  let to=document.getElementById("chatUserId").value.trim();
  let text=document.getElementById("privateMessage").value.trim();

  if(!to || !text){
    alert("User ID और message लिखो");
    return;
  }

  db.ref("privateChats/"+myId+"/"+to).once("value").then(function(snapshot){

    let messages=snapshot.val() || {};
    let sentCount=Object.keys(messages).length;

    return db.ref("privateReplies/"+myId+"/"+to).once("value").then(function(replySnap){

      if(sentCount >= 2 && !replySnap.exists()){
        alert("पहले सामने वाला User reply करे");
        return;
      }

      let data={
        from:myId,
        to:to,
        text:text,
        time:Date.now()
      };

      db.ref("privateChats/"+myId+"/"+to).push(data);
      db.ref("privateChats/"+to+"/"+myId).push(data);

      document.getElementById("privateMessage").value="";

      alert("Message sent ✅");

    });

  });

}


function openPrivateChat(userId){

  document.getElementById("privateChatBox").style.display="block";

  document.getElementById("chatWithUser").innerText=
    "Chat with: "+userId;

  document.getElementById("privateChatBox").setAttribute(
    "data-user",userId
  );

  loadPrivateMessages(userId);

}


function loadPrivateMessages(userId){

  db.ref("privateChats/"+myId+"/"+userId).on("value",function(snapshot){

    let box=document.getElementById("chatMessages");

    box.innerHTML="";

    snapshot.forEach(function(message){

      let data=message.val();

      if(data.from===myId){

        box.innerHTML +=
          "<p style='text-align:right'><b>You:</b> "+
          data.text+"</p>";

      }else{

        box.innerHTML +=
          "<p><b>"+data.from+":</b> "+
          data.text+"</p>";

      }

    });

  });

}


function sendChatMessage(){

  let box=document.getElementById("privateChatBox");

  let to=box.getAttribute("data-user");

  let input=document.getElementById("chatText");

  let text=input.value.trim();

  if(!to || !text){
    alert("Message लिखो");
    return;
  }

  db.ref("privateChats/"+myId+"/"+to).once("value").then(function(snapshot){

    let messages=snapshot.val() || {};
    let sentCount=Object.keys(messages).length;

    return db.ref("privateReplies/"+myId+"/"+to).once("value").then(function(replySnap){

      if(sentCount >= 2 && !replySnap.exists()){
        alert("पहले सामने वाला User reply करे");
        return;
      }

      let data={
        from:myId,
        to:to,
        text:text,
        time:Date.now()
      };

      db.ref("privateChats/"+myId+"/"+to).push(data);
      db.ref("privateChats/"+to+"/"+myId).push(data);

      input.value="";

    });

  });

}


function loadInbox(){

  db.ref("privateChats/"+myId).on("value",function(snapshot){

    let box=document.getElementById("inboxMessages");

    box.innerHTML="";

    snapshot.forEach(function(chat){

      let userId=chat.key;

      let lastMessage=null;

      chat.forEach(function(message){

        let data=message.val();

        if(data.from!==myId){
          lastMessage=data;
        }

      });

      if(lastMessage){

        db.ref("users/"+lastMessage.from+"/name").once("value").then(function(nameSnap){

          let userName=nameSnap.val() || lastMessage.from;

          box.innerHTML +=
            "<p><b>"+userName+"</b>: "+
            lastMessage.text+
            " <button onclick=\"openPrivateChat('"+
            lastMessage.from+
            "')\">Chat</button></p>";

        });

      }

    });

  });

}


function replyUser(userId){

  let text=prompt("Reply लिखो");

  if(!text){
    return;
  }

  let data={
    from:myId,
    to:userId,
    text:text,
    time:Date.now()
  };

  db.ref("privateChats/"+myId+"/"+userId).push(data);
  db.ref("privateChats/"+userId+"/"+myId).push(data);

  db.ref("privateReplies/"+userId+"/"+myId).set({
    repliedBy:myId,
    time:Date.now()
  });

  alert("Reply sent ✅");

}


loadInbox();
      
</script>
</body>
</html>
