<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PawanVoice</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

body{
  margin:0;
  padding:15px;
  padding-bottom:80px;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
}

.box{
  background:#222;
  padding:15px;
  margin:12px 0;
  border-radius:14px;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:6px 0;
  border:0;
  border-radius:8px;
  font-size:16px;
}

button{
  padding:11px 15px;
  margin:5px;
  border:0;
  border-radius:9px;
  font-size:15px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* HOME */

.liveRoomsBox{
  background:#181818;
  border-radius:16px;
  padding:14px;
}

.liveTitle{
  margin:0 0 12px;
  font-size:20px;
}

.homeTabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.homeTab{
  background:#292929;
  color:#ddd;
  border-radius:20px;
  padding:9px 18px;
}

.homeTab.active{
  background:#ff9800;
  color:#111;
  font-weight:bold;
}

.roomTabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:14px;
}

.roomTab{
  background:#292929;
  color:#ddd;
  border-radius:20px;
  white-space:nowrap;
}

.roomTab.active{
  background:#ff9800;
  color:#111;
}

.roomCards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.room{
  background:#242424;
  border-radius:15px;
  padding:10px;
  border:1px solid #363636;
}

.roomCover{
  height:80px;
  border-radius:12px;
  background:linear-gradient(135deg,#ff9800,#ff5722);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  margin-bottom:8px;
}

.room h3{
  margin:5px 0;
  font-size:15px;
}

.room p{
  margin:4px 0;
  color:#aaa;
  font-size:12px;
}

.room button{
  width:100%;
  background:#ff9800;
  color:#111;
  font-weight:bold;
}

/* INBOX */

.inboxChat{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin:8px 0;
  background:#292929;
  border-radius:12px;
}

.inboxAvatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#444;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.inboxInfo{
  flex:1;
  min-width:0;
}

.inboxInfo b{
  font-size:15px;
}

.inboxInfo p{
  margin:5px 0 0;
  color:#aaa;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* CHAT */

.chatMessage{
  padding:9px;
  margin:6px 0;
  border-radius:10px;
  background:#292929;
}

.myMessage{
  text-align:right;
  background:#ff9800;
  color:#111;
}

/* PROFILE */

.profileTop{
  text-align:center;
}

.profileAvatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  margin:15px auto;
}

.profileRow{
  background:#292929;
  padding:12px;
  margin:7px 0;
  border-radius:10px;
}

/* BOTTOM */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#222;
  display:flex;
  justify-content:space-around;
  padding:9px 0;
  z-index:999;
}

.bottom-nav button{
  background:none;
  color:white;
  font-size:25px;
  margin:0;
}

@media(max-width:500px){

  .roomCards{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>

</head>

<body>

<h1>🎙️ PawanVoice</h1>


<!-- ================= HOME ================= -->

<div id="roomPage" class="page active">

  <div class="box">

    <h2>🎙️ PawanVoice</h2>

    <input id="userName" placeholder="अपना नाम लिखो">

    <button onclick="saveProfile()">Save Profile</button>

    <p>🆔 ID: <span id="myId"></span></p>

    <p>⭐ Level: 1</p>

    <p>🏅 Medal: None</p>

    <p>🚻 Gender: <span id="myGender">Not Selected</span></p>

    <button onclick="selectGender('Male')">👨 Male</button>

    <button onclick="selectGender('Female')">👩 Female</button>

  </div>


  <div class="box">

    <input id="roomSearch" placeholder="🔍 Room search...">

    <select id="categoryFilter">

      <option value="All">📂 All</option>

      <option value="General">🎙️ General</option>

      <option value="Music">🎵 Music</option>

      <option value="Chat">💬 Chat</option>

      <option value="Games">🎮 Games</option>

    </select>

  </div>


  <div class="box liveRoomsBox">

    <h3 class="liveTitle">🔥 Live Voice Rooms</h3>


    <div class="homeTabs">

      <button
        id="popularTab"
        class="homeTab active"
        onclick="showHomeTab('popular')">

        🔥 Popular

      </button>


      <button
        id="meTab"
        class="homeTab"
        onclick="showHomeTab('me')">

        👤 Me

      </button>

    </div>


    <div class="roomTabs">

      <button class="roomTab active">
        🔥 Hot
      </button>

      <button class="roomTab">
        ✨ New
      </button>

      <button class="roomTab">
        👥 Friends
      </button>

      <button class="roomTab">
        🎤 Voice
      </button>

    </div>


    <div id="rooms" class="roomCards">

      Rooms load ho rahe hain...

    </div>

  </div>


  <!-- CREATE ROOM -->

  <div class="box">

    <h3>➕ Create Voice Room</h3>

    <input
      id="roomName"
      placeholder="Room ka naam">

    <select id="roomCategory">

      <option value="General">
        🎙️ General
      </option>

      <option value="Music">
        🎵 Music
      </option>

      <option value="Chat">
        💬 Chat
      </option>

      <option value="Games">
        🎮 Games
      </option>

    </select>


    <button onclick="createRoom()">
      🎙️ Create Room
    </button>

  </div>

</div>


<!-- ================= INBOX ================= -->

<div id="inboxPage" class="page">

  <div class="box">

    <h2>💬 Inbox</h2>

    <div id="inboxMessages">

      <p>💬 अभी कोई chat नहीं है।</p>

    </div>

  </div>


  <div
    id="privateChatBox"
    class="box"
    style="display:none;">

    <h3 id="chatWithUser">
      Private Chat
    </h3>

    <button onclick="closePrivateChat()">
      ← Back
    </button>

    <div id="chatMessages"></div>

    <input
      id="chatText"
      placeholder="Message लिखो">

    <button onclick="sendChatMessage()">
      Send
    </button>

  </div>

</div>


<!-- ================= PROFILE ================= -->

<div id="mePage" class="page">

  <div class="box profileTop">

    <h2>👤 My Profile</h2>

    <div class="profileAvatar">
      👤
    </div>

    <h3 id="profileName">
      User
    </h3>

  </div>


  <div class="box">

    <div class="profileRow">
      🆔 ID:
      <span id="profileId"></span>
    </div>

    <div class="profileRow">
      🚻 Gender:
      <span id="profileGender"></span>
    </div>

    <div class="profileRow">
      ⭐ Level:
      <span id="profileLevel">1</span>
    </div>

    <div class="profileRow">
      📈 EXP:
      <span id="profileExp">0</span>
    </div>

    <div class="profileRow">
      🏅 Medal:
      <span id="profileMedal">None</span>
    </div>

    <div class="profileRow">
      🪙 Coins:
      <span id="profileCoins">0</span>
    </div>

  </div>

</div>


<!-- ================= BOTTOM NAV ================= -->

<div class="bottom-nav">

  <button onclick="showPage('room')">
    🏠
  </button>

  <button onclick="showPage('inbox')">
    💬
  </button>

  <button onclick="showPage('me')">
    👤
  </button>

</div>


<script>

/* ================= FIREBASE ================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyDnlTdeq5G5aPHrUIV6kTYnM521GtbrrE",

  authDomain:
  "pawanvoice-68c5e.firebaseapp.com",

  databaseURL:
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",

  projectId:
  "pawanvoice-68c5e",

  storageBucket:
  "pawanvoice-68c5e.firebasestorage.app",

  messagingSenderId:
  "148446327241",

  appId:
  "1:148446327241:web:6bac9cb9ad0fb530cbb818"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* ================= USER ID ================= */

let myId =
localStorage.getItem("pawanId");


function createUserId(){

  return db.ref("system/nextUserId")
  .transaction(function(current){

    if(current === null){

      return 1000031;

    }

    return Number(current) + 1;

  })
  .then(function(result){

    if(result.committed){

      myId =
      String(result.snapshot.val());

      localStorage.setItem(
        "pawanId",
        myId
      );

      updateProfile();

    }

  });

}


if(!myId || !/^\d+$/.test(myId)){

  localStorage.removeItem("pawanId");

  createUserId();

}


/* ================= PROFILE ================= */

function updateProfile(){

  let name =
  localStorage.getItem("pawanName") || "";

  let gender =
  localStorage.getItem("pawanGender")
  || "Not Selected";


  document.getElementById(
    "myId"
  ).innerText = myId || "";


  document.getElementById(
    "profileId"
  ).innerText = myId || "";


  document.getElementById(
    "userName"
  ).value = name;


  document.getElementById(
    "profileName"
  ).innerText =
  name || "User";


  document.getElementById(
    "myGender"
  ).innerText = gender;


  document.getElementById(
    "profileGender"
  ).innerText = gender;

}


function saveProfile(){

  let name =
  document.getElementById(
    "userName"
  ).value.trim();


  if(!name){

    alert("Apna naam likho");

    return;

  }


  localStorage.setItem(
    "pawanName",
    name
  );


  db.ref(
    "users/" + myId
  ).update({

    name:name,
    userId:myId

  });


  updateProfile();


  alert("Profile save ho gaya ✅");

}


function selectGender(gender){

  localStorage.setItem(
    "pawanGender",
    gender
  );


  db.ref(
    "users/" + myId + "/gender"
  ).set(gender);


  updateProfile();


  alert(
    "Gender selected: " + gender
  );

}


/* ================= HOME TABS ================= */

function showHomeTab(tab){

  document
  .getElementById("popularTab")
  .classList.remove("active");

  document
  .getElementById("meTab")
  .classList.remove("active");


  if(tab === "popular"){

    document
    .getElementById("popularTab")
    .classList.add("active");

    loadRooms();

  }


  if(tab === "me"){

    document
    .getElementById("meTab")
    .classList.add("active");

    loadRooms();

  }

}


/* ================= PAGE NAVIGATION ================= */

function showPage(page){

  document
  .getElementById("roomPage")
  .classList.remove("active");

  document
  .getElementById("inboxPage")
  .classList.remove("active");

  document
  .getElementById("mePage")
  .classList.remove("active");


  if(page === "room"){

    document
    .getElementById("roomPage")
    .classList.add("active");

  }


  if(page === "inbox"){

    document
    .getElementById("inboxPage")
    .classList.add("active");

  }


  if(page === "me"){

    document
    .getElementById("mePage")
    .classList.add("active");

  }

}


/* ================= CREATE ROOM ================= */

function createRoom(){

  let name =
  document
  .getElementById("roomName")
  .value
  .trim();


  let category =
  document
  .getElementById("roomCategory")
  .value;


  let userName =
  document
  .getElementById("userName")
  .value
  .trim();


  if(!userName){

    alert("Pehle apna naam likho");

    return;

  }


  if(!name){

    alert("Room ka naam likho");

    return;

  }


  localStorage.setItem(
    "pawanName",
    userName
  );


  let id =
  Date.now().toString();


  db.ref(
    "rooms/" + id
  )
  .set({

    name:name,

    owner:userName,

    ownerId:myId,

    category:category,

    users:0,

    createdAt:Date.now()

  })
  .then(function(){

    location.href =
    "room.html?id=" + id;

  })
  .catch(function(error){

    alert(
      "Room create nahi hua: "
      + error.message
    );

  });

}


/* ================= LOAD ROOMS ================= */

function loadRooms(){

  let box =
  document.getElementById("rooms");


  if(!box){

    return;

  }


  db.ref("rooms")
  .on("value",function(snapshot){

    box.innerHTML = "";


    if(!snapshot.exists()){

      box.innerHTML =
      "<p>Abhi koi room nahi hai.</p>";

      return;

    }


    snapshot.forEach(function(child){

      let id =
      child.key;


      let room =
      child.val();


      let div =
      document.createElement("div");


      div.className =
      "room";


      div.innerHTML =

      "<div class='roomCover'>🎙️</div>" +

      "<h3>🎙️ " +
      (room.name || "Room") +
      "</h3>" +

      "<p>👑 Owner: " +
      (room.owner || "User") +
      "</p>" +

      "<p>👥 " +
      (room.users || 0) +
      "/9 Members</p>" +

      "<p>🟢 Live Now</p>" +

      "<p>📂 " +
      (room.category || "General") +
      "</p>" +

      "<button onclick=\"joinRoom('" +
      id +
      "')\">🚪 Join Room</button>";


      box.appendChild(div);

    });


    filterRooms();

  });

}


/* ================= ROOM SEARCH ================= */

function filterRooms(){

  let search =
  document
  .getElementById("roomSearch")
  .value
  .toLowerCase()
  .trim();


  let category =
  document
  .getElementById("categoryFilter")
  .value;


  document
  .querySelectorAll(".room")
  .forEach(function(room){

    let text =
    room.innerText.toLowerCase();


    let searchOK =
    text.includes(search);


    let categoryOK =
    category === "All"
    ||
    text.includes(
      category.toLowerCase()
    );


    room.style.display =
    searchOK && categoryOK
    ? "block"
    : "none";

  });

}


document
.getElementById("roomSearch")
.addEventListener(
  "input",
  filterRooms
);


document
.getElementById("categoryFilter")
.addEventListener(
  "change",
  filterRooms
);


/* ================= JOIN ROOM ================= */

function joinRoom(id){

  let name =
  document
  .getElementById("userName")
  .value
  .trim();


  if(!name){

    alert(
      "Pehle apna naam likho"
    );

    return;

  }


  localStorage.setItem(
    "pawanName",
    name
  );


  location.href =
  "room.html?id=" + id;

}


/* ================= PRIVATE CHAT ================= */

function openPrivateChat(userId){

  let chat =
  document.getElementById(
    "privateChatBox"
  );


  chat.style.display =
  "block";


  chat.setAttribute(
    "data-user",
    userId
  );


  document.getElementById(
    "chatWithUser"
  ).innerText =
  "Chat with: " + userId;


  loadPrivateMessages(
    userId
  );

}


function closePrivateChat(){

  document.getElementById(
    "privateChatBox"
  ).style.display =
  "none";

}


function sendChatMessage(){

  let box =
  document.getElementById(
    "privateChatBox"
  );


  let to =
  box.getAttribute(
    "data-user"
  );


  let input =
  document.getElementById(
    "chatText"
  );


  let text =
  input.value.trim();


  if(!to || !text){

    alert("Message लिखो");

    return;

  }


  let data = {

    from:myId,

    to:to,

    text:text,

    time:Date.now()

  };


  db.ref(
    "privateChats/"
    + myId +
    "/" +
    to
  ).push(data);


  db.ref(
    "privateChats/"
    + to +
    "/" +
    myId
  ).push(data);


  input.value = "";

}


function loadPrivateMessages(userId){

  db.ref(
    "privateChats/"
    + myId +
    "/" +
    userId
  )
  .on("value",function(snapshot){

    let box =
    document.getElementById(
      "chatMessages"
    );


    box.innerHTML = "";


    snapshot.forEach(
      function(child){

        let data =
        child.val();


        let div =
        document.createElement(
          "div"
        );


        div.className =
        "chatMessage";


        if(data.from === myId){

          div.className +=
          " myMessage";

          div.innerText =
          "You: " + data.text;

        }else{

          div.innerText =
          data.from +
          ": " +
          data.text;

        }


        box.appendChild(div);

      }
    );

  });

}


/* ================= INBOX ================= */

function loadInbox(){

  let box =
  document.getElementById(
    "inboxMessages"
  );


  if(!box || !myId){

    return;

  }


  db.ref(
    "privateChats/" + myId
  )
  .on("value",function(snapshot){

    box.innerHTML = "";


    if(!snapshot.exists()){

      box.innerHTML =
      "<p>💬 अभी कोई chat नहीं है।</p>";

      return;

    }


    snapshot.forEach(
      function(chat){

        let userId =
        chat.key;


        let lastMessage =
        null;


        chat.forEach(
          function(message){

            let data =
            message.val();


            if(
              !lastMessage
              ||
              data.time >
              lastMessage.time
            ){

              lastMessage =
              data;

            }

          }
        );


        if(!lastMessage){

          return;

        }


        let div =
        document.createElement(
          "div"
        );


        div.className =
        "inboxChat";


        div.innerHTML =

        "<div class='inboxAvatar'>👤</div>" +

        "<div class='inboxInfo'>" +

        "<b>User " +
        userId +
        "</b>" +

        "<p>" +
        lastMessage.text +
        "</p>" +

        "</div>";


        div.onclick =
        function(){

          openPrivateChat(
            userId
          );

        };


        box.appendChild(div);

      }
    );

  });

}


/* ================= START ================= */

updateProfile();

loadRooms();

loadInbox();

</script>

</body>
</html>
