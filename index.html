<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0d0d12;color:#fff;

button,input,textarea,select{font:inherit}

input,textarea,select{

.green{background:#16a34a}

.profileHead .avatar{

.profileOptions button{

.optionIcon{width:32px;display:inline-block}
.stat{

.bottom{

.bottom button{

.modalBg{

.modalBg.show{display:flex}
.modal{

.close{

.grid3{

.grid3 button{

.item{

.notice{

.search{

}
.search input{margin:0}
.search button{width:50px;background:#7c3aed;color:white;border-radius:11px}
@media(min-width:700px){
 .page{max-width:720px;margin:auto}
}
</style>

<script>
/* ================================
   FIREBASE
================================ */

const firebaseConfig={
 apiKey:"AIzaSyDnlTde5Gg5aPHrUIV6kTYnM521GtbrrE",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"148446327241",
 appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();

let currentUser=null;
let myProfile={
  name:"Pawan",
  gender:"Male",
  bio:"",
  photo:"",
  coins:0
};
let allRooms={};
let roomFilter="popular";

/* ================================
   AUTH
================================ */

auth.onAuthStateChanged(async user=>{
  if(!user){
    try{
      await auth.signInAnonymously();
    }catch(e){
      console.error(e);
      loadLocalProfile();
      renderProfile();
    }
    return;
  }

  currentUser=user;
  await loadProfile();
  loadRooms();
  renderProfile();
});

/* ================================
   PROFILE
================================ */

async function loadProfile(){
  if(!currentUser)return;

  try{
    const snap=await db.ref("users/"+currentUser.uid).once("value");
    const data=snap.val();

    if(data){
      myProfile={
        ...myProfile,
        ...data
      };
    }else{
      await db.ref("users/"+currentUser.uid).update({
        name:"Pawan",
        gender:"Male",
        bio:"",
        photo:"",
        createdAt:firebase.database.ServerValue.TIMESTAMP
      });
    }
  }catch(e){
    console.log("Firebase profile error",e);
    loadLocalProfile();
  }

  localStorage.setItem("pawanProfile",JSON.stringify(myProfile));
}

function loadLocalProfile(){
  try{
    const x=JSON.parse(localStorage.getItem("pawanProfile")||"{}");
    myProfile={...myProfile,...x};
  }catch(e){}
}

function renderProfile(){
  const name=myProfile.name||"Pawan";

  document.getElementById("profileName").textContent=name;
  document.getElementById("profileId").textContent=
    "ID: "+(currentUser?currentUser.uid.substring(0,10):"LOCAL");

  const box=document.getElementById("profileAvatar");

  if(myProfile.photo){
    box.innerHTML='<img src="'+myProfile.photo+'" alt="DP">';
  }else{
    box.innerHTML="👤";
  }
}

async function saveProfile(){
  const name=document.getElementById("editName").value.trim();
  const gender=document.getElementById("editGender").value;
  const bio=document.getElementById("editBio").value.trim();

  if(!name){
    alert("Name डालिए");
    return;
  }

  myProfile.name=name;
  myProfile.gender=gender;
  myProfile.bio=bio;

  localStorage.setItem("pawanProfile",JSON.stringify(myProfile));

  if(currentUser){
    try{
      await db.ref("users/"+currentUser.uid).update({
        name:name,
        gender:gender,
        bio:bio
      });
    }catch(e){
      alert("Firebase save नहीं हुआ: "+e.message);
      return;
    }
  }

  renderProfile();
  closeModal();
  alert("Profile save हो गई");
}

function changeDP(){
  document.getElementById("dpFile").click();
}

function readDP(input){
  const file=input.files[0];
  if(!file)return;

  if(file.size>1500000){
    alert("Photo 1.5MB से छोटी रखें");
    return;
  }

  const reader=new FileReader();

  reader.onload=async function(){
    myProfile.photo=reader.result;

    localStorage.setItem(
      "pawanProfile",
      JSON.stringify(myProfile)
    );

    if(currentUser){
      try{
        await db.ref("users/"+currentUser.uid).update({
          photo:reader.result
        });
      }catch(e){
        console.log(e);
      }
    }

    renderProfile();
    closeModal();
    alert("DP बदल गई");
  };

  reader.readAsDataURL(file);
}

/* ================================
   ROOMS
================================ */

function loadRooms(){
  db.ref("rooms").on("value",snap=>{
    allRooms=snap.val()||{};
    renderRooms();
    renderMyRoom();
  },err=>{
    console.log(err);
    document.getElementById("roomList").innerHTML=
      '<div class="empty">Rooms load नहीं हो पाए</div>';
  });
}

function showRooms(type){
  roomFilter=type;

  document.querySelectorAll(".tabs button")
    .forEach(x=>x.classList.remove("on"));

  const map={
    popular:"tabPopular",
    new:"tabNew"
  };

  if(map[type]){
    document.getElementById(map[type]).classList.add("on");
  }

  renderRooms();
}

function renderMyRoom(){
  const box=document.getElementById("myRoomSection");

  if(!currentUser){
    box.innerHTML="";
    return;
  }

  let mine=null;

  Object.keys(allRooms).forEach(id=>{
    const r=allRooms[id];

    if(r && r.hostUid===currentUser.uid){
      mine={id,...r};
    }
  });

  if(!mine){
    box.innerHTML="";
    return;
  }

  box.innerHTML=`
    <div class="sectionTitle">
      <h3>⭐ My Room</h3>
    </div>

    <div class="room myRoom">
      <div class="avatar">${roomAvatar(mine)}</div>

      <div class="roomInfo">
        <div class="roomName">🔥 ${escapeHtml(mine.name||"My Room")}</div>
        <div class="roomMeta">
          👑 ${escapeHtml(mine.hostName||myProfile.name)}
          · 👥 ${mine.memberCount||0}/9
        </div>
      </div>

      <button class="join" onclick="openRoom('${mine.id}')">
        OPEN
      </button>
    </div>
  `;
}

function renderRooms(){
  const box=document.getElementById("roomList");
  const q=(document.getElementById("roomSearch")?.value||"")
    .toLowerCase();

  let arr=Object.keys(allRooms).map(id=>({
    id,
    ...allRooms[id]
  })).filter(r=>r);

  if(q){
    arr=arr.filter(r=>
      String(r.name||"").toLowerCase().includes(q)
    );
  }

  if(roomFilter==="new"){
    arr.sort((a,b)=>
      (b.createdAt||0)-(a.createdAt||0)
    );
  }else{
    arr.sort((a,b)=>
      (b.memberCount||0)-(a.memberCount||0)
    );
  }

  if(roomFilter==="family"){
    arr=arr.filter(r=>
      String(r.category||"").toLowerCase()==="family"
    );
  }

  if(roomFilter==="music"){
    arr=arr.filter(r=>
      ["music","singing"].includes(
        String(r.category||"").toLowerCase()
      )
    );
  }

  if(roomFilter==="games"){
    arr=arr.filter(r=>
      String(r.category||"").toLowerCase()==="games"
    );
  }

  if(!arr.length){
    box.innerHTML=
      '<div class="empty">🎙️ अभी कोई room नहीं मिला</div>';
    return;
  }

  box.innerHTML=arr.map(r=>`
    <div class="room">
      <div class="avatar">${roomAvatar(r)}</div>

      <div class="roomInfo">
        <div class="roomName">${escapeHtml(r.name||"Voice Room")}</div>

        <div class="roomMeta">
          👑 ${escapeHtml(r.hostName||"Host")}
          · ${escapeHtml(r.category||"General")}
          · 👥 ${r.memberCount||0}/9
        </div>
      </div>

      <button class="join"
        onclick="openRoom('${r.id}')">
        JOIN
      </button>
    </div>
  `).join("");
}

function roomAvatar(r){
  if(r.photo){
    return `<img src="${r.photo}" alt="room">`;
  }

  return "🎙️";
}

function openRoom(id){
  location.href="room.html?roomId="+encodeURIComponent(id);
}

async function createRoom(){
  if(!currentUser){
    alert("Login हो रहा है, थोड़ी देर बाद try करें");
    return;
  }

  const name=document.getElementById("roomNameInput")
    .value.trim();

  const category=document.getElementById("roomCategory")
    .value;

  if(!name){
    alert("Room Name डालिए");
    return;
  }

  const roomRef=db.ref("rooms").push();

  const room={
    name:name,
    category:category,
    hostUid:currentUser.uid,
    hostName:myProfile.name||"Pawan",
    photo:myProfile.photo||"",
    memberCount:1,
    createdAt:firebase.database.ServerValue.TIMESTAMP,
    level:1,
    exp:0,
    private:false,
    locked:false
  };

  try{
    await roomRef.set(room);

    await db.ref(
      "rooms/"+roomRef.key+"/members/"+currentUser.uid
    ).set({
      uid:currentUser.uid,
      name:myProfile.name||"Pawan",
      photo:myProfile.photo||"",
      role:"owner",
      mic:true,
      joinedAt:firebase.database.ServerValue.TIMESTAMP
    });

    closeModal();
    openRoom(roomRef.key);

  }catch(e){
    alert("Room create नहीं हुआ:\n"+e.message);
  }
}

/* ================================
   NAVIGATION
================================ */

function goPage(page){
  document.querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document.querySelectorAll(".bottom button")
    .forEach(x=>x.classList.remove("on"));

  if(page==="home"){
    document.getElementById("homePage").classList.add("active");
    document.getElementById("navHome").classList.add("on");
  }

  if(page==="inbox"){
    document.getElementById("inboxPage").classList.add("active");
    document.getElementById("navInbox").classList.add("on");
  }

  if(page==="me"){
    document.getElementById("mePage").classList.add("active");
    document.getElementById("navMe").classList.add("on");
  }

  window.scrollTo(0,0);
}

/* ================================

function shareApp(){
  const url=location.origin+location.pathname;

  if(navigator.share){
    navigator.share({
      title:"PawanVoice",
      text:"Join me on PawanVoice 🎙️",
      url:url
    }).catch(()=>{});
  }else{
    prompt("इस link को copy करें:",url);
  }
}

/* ================================
   HELPERS
================================ */

function escapeHtml(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(v){
  return escapeHtml(v);
}
