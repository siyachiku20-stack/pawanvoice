<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawanVoice</title>
<script src="https://meet.jit.si/external_api.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#0f172a;
  color:white;
  font-family:Arial;
  overflow:hidden;
}

#login{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.logo{
  font-size:32px;
  font-weight:bold;
  margin-bottom:10px;
}

input{
  width:80%;
  max-width:320px;
  padding:15px;
  border:0;
  border-radius:12px;
  margin:15px 0;
  font-size:16px;
}

button{
  border:0;
  border-radius:25px;
  padding:13px 22px;
  font-size:16px;
  color:white;
  background:#2563eb;
}

#app{
  display:none;
  height:100vh;
}

#header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1e3a8a;
  font-size:21px;
  font-weight:bold;
}

#meet{
  height:calc(100vh - 130px);
}

#controls{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:#1e3a8a;
}

.control{
  padding:12px 18px;
}

.leave{
  background:#dc2626;
}
</style>
</head>

<body>

<div id="login">
  <div class="logo">🎙️ PawanVoice</div>
  <div>Free Voice Group</div>

  <input id="name" placeholder="Apna naam likho">

  <button onclick="joinRoom()">Join Voice Room</button>
</div>

<div id="app">

  <div id="header">
    🎙️ PawanVoice
  </div>

  <div id="meet"></div>

  <div id="controls">
    <button class="control" onclick="mic()">🎤 Mic</button>
    <button class="control" onclick="share()">🔗 Share</button>
    <button class="control leave" onclick="leave()">🚪 Leave</button>
  </div>

</div>

<script>

let api;

const room = "PawanVoiceRoom2026";

function joinRoom(){

  const name =
    document.getElementById("name").value.trim();

  if(!name){
    alert("Apna naam likho");
    return;
  }

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";

  api = new JitsiMeetExternalAPI("meet.jit.si",{

    roomName:room,

    parentNode:document.getElementById("meet"),

    width:"100%",
    height:"100%",

    userInfo:{
      displayName:name
    },

    configOverwrite:{
      startWithAudioMuted:false,
      startWithVideoMuted:true
    },

    interfaceConfigOverwrite:{
      SHOW_JITSI_WATERMARK:false,
      SHOW_WATERMARK_FOR_GUESTS:false,
      SHOW_BRAND_WATERMARK:false,
      MOBILE_APP_PROMO:false
    }

  });

}

function mic(){

  if(api){
    api.executeCommand("toggleAudio");
  }

}

function leave(){

  if(api){
    api.executeCommand("hangup");
  }

  location.reload();

}

function share(){

  const link =
    window.location.origin +
    window.location.pathname;

  if(navigator.share){

    navigator.share({
      title:"PawanVoice",
      text:"PawanVoice Voice Group join karo",
      url:link
    });

  }else{

    navigator.clipboard.writeText(link);
    alert("PawanVoice link copy ho gaya");

  }

}

</script>

</body>
</html>
