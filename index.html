<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawanVoice</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    input {
      width: 85%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      padding: 13px 20px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    #status {
      margin-top: 25px;
      color: #bbb;
    }

    #users {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>🎙️ PawanVoice</h1>

<input id="name" type="text" placeholder="Apna naam likho">

<br>

<button onclick="joinRoom()">Join Room</button>
<button onclick="toggleMic()">Mic ON/OFF</button>
<button onclick="leaveRoom()">Leave</button>

<div id="status">Room join nahi hua</div>

<div id="users"></div>

<div id="audios"></div>


<script>

const firebaseConfig = {
  apiKey: "AIzaSyDnlTdeqGyG5aPHrUIV6kTYnM521GtbrrE",
  authDomain: "pawanvoice-68c5e.firebaseapp.com",
  databaseURL: "https://pawanvoice-68c5e-default-rtdb.firebaseio.com",
  projectId: "pawanvoice-68c5e",
  storageBucket: "pawanvoice-68c5e.firebasestorage.app",
  messagingSenderId: "148446327241",
  appId: "1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const ROOM = "PawanVoiceRoom2026";

let peer = null;
let myStream = null;
let myPeerId = "";
let myName = "";
let micOn = true;
let connectedPeers = {};


async function joinRoom() {

  myName = document.getElementById("name").value.trim();

  if (!myName) {
    alert("Pehle apna naam likho");
    return;
  }

  document.getElementById("status").innerText =
    "Microphone permission mang raha hai...";

  try {

    myStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

  } catch (error) {

    console.log(error);

    alert("Microphone permission nahi mili");

    document.getElementById("status").innerText =
      "Microphone permission required";

    return;
  }


  peer = new Peer();


  peer.on("open", function(id) {

    myPeerId = id;

    db.ref("voiceRooms/" + ROOM + "/" + myPeerId).set({
      name: myName,
      peerId: myPeerId
    });

    document.getElementById("status").innerText =
      "✅ Room Joined";

    document.getElementById("users").innerText =
      "Naam: " + myName;

    listenForUsers();

  });


  peer.on("call", function(call) {

    call.answer(myStream);

    call.on("stream", function(remoteStream) {

      addRemoteAudio(call.peer, remoteStream);

    });

  });


  peer.on("error", function(error) {

    console.log("Peer error:", error);

    document.getElementById("status").innerText =
      "Connection error";

  });

}


function listenForUsers() {

  db.ref("voiceRooms/" + ROOM).on("child_added", function(snapshot) {

    const user = snapshot.val();

    if (!user) return;

    if (user.peerId === myPeerId) return;

    if (connectedPeers[user.peerId]) return;

    connectedPeers[user.peerId] = true;


    const call = peer.call(
      user.peerId,
      myStream
    );


    if (!call) return;


    call.on("stream", function(remoteStream) {

      addRemoteAudio(
        user.peerId,
        remoteStream
      );

    });

  });

}


function addRemoteAudio(id, stream) {

  const oldAudio =
    document.getElementById("audio-" + id);

  if (oldAudio) return;


  const audio =
    document.createElement("audio");

  audio.id = "audio-" + id;

  audio.autoplay = true;

  audio.playsInline = true;

  audio.srcObject = stream;

  document
    .getElementById("audios")
    .appendChild(audio);

}


function toggleMic() {

  if (!myStream) {

    alert("Pehle Join Room karo");

    return;
  }


  micOn = !micOn;


  myStream
    .getAudioTracks()
    .forEach(function(track) {

      track.enabled = micOn;

    });


  document.getElementById("status").innerText =
    micOn ? "🎙️ Mic ON" : "🔇 Mic OFF";

}


function leaveRoom() {

  if (myPeerId) {

    db.ref(
      "voiceRooms/" +
      ROOM +
      "/" +
      myPeerId
    ).remove();

  }


  if (myStream) {

    myStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

  }


  if (peer) {

    peer.destroy();

  }


  document.getElementById("status").innerText =
    "Room se bahar aa gaye";

  document.getElementById("users").innerText = "";

  document.getElementById("audios").innerHTML = "";

  myPeerId = "";

}


window.addEventListener("beforeunload", function() {

  if (myPeerId) {

    db.ref(
      "voiceRooms/" +
      ROOM +
      "/" +
      myPeerId
    ).remove();

  }

});

</script>

</body>
</html>
