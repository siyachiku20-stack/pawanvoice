<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>PawanVoice</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f3fb;
  font-family:Arial,sans-serif;
  color:#222;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  padding-bottom:75px;
}

.header{
  padding:16px;
  background:linear-gradient(135deg,#7254ff,#b044ff);
  color:white;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:24px;
  font-weight:bold;
}

.icons{
  font-size:22px;
}

.banner{
  margin:15px;
  height:150px;
  border-radius:20px;
  background:linear-gradient(135deg,#29175f,#ad3f92);
  color:white;
  padding:22px;
  position:relative;
  overflow:hidden;
}

.banner h2{
  margin:0 0 10px;
}

.banner p{
  color:#ddd;
}

.section{
  padding:0 15px;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 12px;
}

.sectionTitle h3{
  margin:0;
}

.see{
  color:#7858ff;
}

.rooms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.room{
  border-radius:16px;
  background:#f5f2fc;
  padding:12px;
  cursor:pointer;
}

.roomDp{
  height:100px;
  border-radius:14px;
  background:linear-gradient(135deg,#8666ff,#ff66a8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  color:white;
  font-weight:bold;
}

.roomName{
  font-weight:bold;
  margin-top:8px;
}

.roomInfo{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

.profileBar{
  display:flex;
  align-items:center;
  padding:15px;
  margin:15px;
  border-radius:18px;
  background:#f7f4ff;
  cursor:pointer;
}

.userDp{
  width:50px;
  height:50px;
  border-radius:50%;
  background:linear-gradient(135deg,#7657ff,#ff55a4);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:20px;
  overflow:hidden;
}

.userDp img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.userText{
  margin-left:12px;
}

.userName{
  font-weight:bold;
}

.userId{
  color:#888;
  font-size:12px;
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:65px;
  background:white;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.navItem{
  text-align:center;
  font-size:12px;
  color:#777;
  cursor:pointer;
}

.navItem.active{
  color:#7355ff;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="app">

  <div class="header">

    <div class="top">

      <div class="brand">
        PawanVoice
      </div>

      <div class="icons">
        🔍　💌
      </div>

    </div>

  </div>


  <div class="profileBar" onclick="openProfile()">

    <div class="userDp" id="homeDp">
      PV
    </div>

    <div class="userText">

      <div class="userName" id="homeName">
        Pawan
      </div>

      <div class="userId" id="homeId">
        ID: -
      </div>

    </div>

  </div>


  <div class="banner">

    <h2>
      PawanVoice Party
    </h2>

    <p>
      Meet friends and join voice rooms
    </p>

  </div>


  <div class="section">

    <div class="sectionTitle">

      <h3>
        Popular Rooms
      </h3>

      <div class="see">
        See all
      </div>

    </div>


    <div class="rooms">

      <div class="room" onclick="openRoom('100001')">

        <div class="roomDp">
          PV
        </div>

        <div class="roomName">
          PawanVoice Party
        </div>

        <div class="roomInfo">
          👥 1/9
        </div>

      </div>


      <div class="room" onclick="openRoom('100002')">

        <div class="roomDp">
          🎤
        </div>

        <div class="roomName">
          Friends Room
        </div>

        <div class="roomInfo">
          👥 0/9
        </div>

      </div>


      <div class="room" onclick="openRoom('100003')">

        <div class="roomDp">
          🎵
        </div>

        <div class="roomName">
          Music Room
        </div>

        <div class="roomInfo">
          👥 0/9
        </div>

      </div>


      <div class="room" onclick="openRoom('100004')">

        <div class="roomDp">
          👑
        </div>

        <div class="roomName">
          VIP Room
        </div>

        <div class="roomInfo">
          👥 0/9
        </div>

      </div>

    </div>

  </div>

</div>


<div class="nav">

  <div class="navItem active">
    🏠<br>
    Home
  </div>

  <div class="navItem">
    🔥<br>
    Popular
  </div>

  <div class="navItem">
    👥<br>
    Friends
  </div>

  <div class="navItem" onclick="openProfile()">
    👤<br>
    Profile
  </div>

</div>


<script>

const userId =
  localStorage.getItem("pv_userId");

const savedName =
  localStorage.getItem("pv_name");

const savedDp =
  localStorage.getItem("pv_dp");


if(!userId){

  window.location.href =
    "login.html";

}


document.getElementById("homeName")
  .textContent =
  savedName || "Pawan";


document.getElementById("homeId")
  .textContent =
  "ID: " + (userId || "-");


if(savedDp){

  document.getElementById("homeDp")
    .innerHTML =
    `<img src="${savedDp}">`;

}else{

  document.getElementById("homeDp")
    .textContent =
    (savedName || "P").charAt(0)
      .toUpperCase();

}


function openProfile(){

  window.location.href =
    "profile.html";

}


function openRoom(roomId){

  const name =
    encodeURIComponent(
      savedName || "Pawan"
    );

  window.location.href =
    "room.html?room=" +
    roomId +
    "&userid=" +
    encodeURIComponent(userId) +
    "&name=" +
    name;

}

</script>

</body>
</html>
