<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>PawanVoice</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#442477 0%,transparent 38%),
    linear-gradient(180deg,#120b28,#08091a 75%);
  color:#fff;
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:#fff;
}

.app{
  min-height:100vh;
  padding-bottom:70px;
}

/* ================= HEADER ================= */

.header{
  height:62px;
  display:flex;
  align-items:center;
  padding:8px 12px;
  background:rgba(18,10,40,.78);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
  font-size:21px;
  font-weight:800;
  background:linear-gradient(90deg,#b77cff,#ff72cf);
  -webkit-background-clip:text;
  color:transparent;
}

.header-user{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

.header-user img{
  width:39px;
  height:39px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #9b68ff;
}

/* ================= PAGES ================= */

.page{
  display:none;
  padding:12px;
}

.page.active{
  display:block;
}

/* ================= HOME ================= */

.welcome{
  padding:14px 4px;
}

.welcome h2{
  font-size:22px;
}

.welcome p{
  color:#aaa0bd;
  font-size:12px;
  margin-top:5px;
}

/* BANNERS */

.banners{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:15px;
}

.banner{
  min-height:88px;
  padding:12px 8px;
  border-radius:17px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    linear-gradient(135deg,rgba(129,77,220,.55),rgba(61,47,147,.25));
  border:1px solid rgba(255,255,255,.08);
}

.banner-icon{
  font-size:25px;
}

.banner-title{
  font-size:11px;
  font-weight:bold;
  margin-top:5px;
}

.banner-sub{
  font-size:9px;
  color:#bcb2cf;
  margin-top:3px;
}

/* ROOM SEARCH */

.search{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.search input{
  flex:1;
  height:43px;
  border:0;
  outline:0;
  border-radius:22px;
  padding:0 15px;
  color:#fff;
  background:rgba(255,255,255,.08);
}

.search button{
  width:43px;
  height:43px;
  border-radius:50%;
  background:linear-gradient(135deg,#8054ff,#bc5dff);
}

/* SECTION */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 3px 9px;
}

.section-title h3{
  font-size:15px;
}

.section-title span{
  font-size:10px;
  color:#a89bbd;
}

/* ROOMS */

.rooms{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.room-card{
  padding:11px;
  border-radius:16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.07);
}

.room-top{
  display:flex;
  align-items:center;
  gap:8px;
}

.room-card img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.room-card-info{
  min-width:0;
  flex:1;
}

.room-card-name{
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-card-id{
  color:#9e94ae;
  font-size:9px;
  margin-top:3px;
}

.room-count{
  font-size:9px;
  color:#bcb1cd;
  margin-top:9px;
}

.join-room{
  width:100%;
  height:31px;
  margin-top:8px;
  border-radius:10px;
  background:linear-gradient(90deg,#7751ef,#a95aff);
  font-size:10px;
}

/* ================= PROFILE ================= */

.profile-head{
  text-align:center;
  padding:12px 0 17px;
}

.profile-dp-wrap{
  position:relative;
  display:inline-block;
}

.profile-dp{
  width:92px;
  height:92px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid #9c69ff;
  background:#25163e;
}

.change-dp{
  position:absolute;
  right:0;
  bottom:2px;
  width:29px;
  height:29px;
  border-radius:50%;
  background:#8152f3;
}

.profile-name{
  font-size:20px;
  font-weight:bold;
  margin-top:8px;
}

.profile-id{
  color:#a69bb7;
  font-size:11px;
  margin-top:4px;
}

/* LEVEL */

.level-card{
  padding:14px;
  border-radius:18px;
  background:
    linear-gradient(135deg,rgba(127,75,224,.32),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.07);
}

.level-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.level-number{
  font-size:22px;
  font-weight:bold;
}

.exp-text{
  color:#c4b8d5;
  font-size:10px;
}

.exp-bar{
  height:8px;
  margin-top:10px;
  border-radius:10px;
  background:rgba(255,255,255,.1);
  overflow:hidden;
}

.exp-fill{
  height:100%;
  width:0%;
  border-radius:10px;
  background:linear-gradient(90deg,#9a5dff,#ff6ccf);
}

.level-button{
  width:100%;
  height:38px;
  margin-top:10px;
  border-radius:11px;
  background:rgba(255,255,255,.09);
}

/* COINS */

.wallet{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px;
}

.wallet-card{
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,.06);
}

.wallet-icon{
  font-size:23px;
}

.wallet-label{
  color:#a79bb8;
  font-size:10px;
  margin-top:5px;
}

.wallet-value{
  font-size:17px;
  font-weight:bold;
  margin-top:3px;
}

/* PROFILE MENU */

.profile-menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.menu-item{
  min-height:75px;
  border-radius:15px;
  background:rgba(255,255,255,.06);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:10px;
}

.menu-icon{
  font-size:23px;
}

/* ================= MODAL ================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.7);
  align-items:flex-end;
}

.overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-height:85vh;
  overflow:auto;
  padding:19px;
  border-radius:23px 23px 0 0;
  background:#171129;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.modal-title{
  font-size:17px;
  font-weight:bold;
}

.close{
  width:31px;
  height:31px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
}

.field{
  margin-top:11px;
}

.field label{
  display:block;
  color:#aaa0b7;
  font-size:11px;
  margin-bottom:6px;
}

.field input{
  width:100%;
  height:44px;
  border:0;
  outline:0;
  border-radius:12px;
  padding:0 13px;
  color:#fff;
  background:rgba(255,255,255,.08);
}

.primary{
  width:100%;
  height:44px;
  margin-top:13px;
  border-radius:12px;
  background:linear-gradient(90deg,#7950f3,#b45cff);
}

.file-input{
  display:none;
}

/* ================= LEVEL MODAL ================= */

.level-list{
  display:grid;
  gap:7px;
}

.level-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
}

.level-badge{
  width:37px;
  height:37px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#7951ed,#bd60ff);
  font-size:11px;
  font-weight:bold;
}

.level-info{
  flex:1;
}

.level-info b{
  font-size:11px;
}

.level-info small{
  display:block;
  color:#9990aa;
  font-size:9px;
  margin-top:3px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;
  height:67px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:rgba(12,9,27,.96);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(15px);
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  background:transparent;
  color:#81778f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
}

.nav-btn span{
  font-size:22px;
}

.nav-btn.active{
  color:#bd83ff;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:83px;
  transform:translate(-50%,20px);
  opacity:0;
  z-index:300;
  padding:10px 16px;
  border-radius:20px;
  background:rgba(0,0,0,.85);
  font-size:11px;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= LOADING ================= */

.loading{
  position:fixed;
  inset:0;
  z-index:500;
  background:#0d0920;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
}

.spinner{
  width:37px;
  height:37px;
  border:3px solid rgba(255,255,255,.12);
  border-top-color:#a66aff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:360px){
  .banners{
    gap:5px;
  }

  .banner{
    padding:8px 4px;
  }

  .profile-menu{
    gap:5px;
  }
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <b>PawanVoice</b>

</div>

<div class="app">

<!-- =====================================================
     HOME
===================================================== -->

<section id="homePage" class="page active">

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  onValue
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";


/*
=========================================================
PAWANVOICE FIREBASE CONFIG

IMPORTANT:
apiKey को अपने Firebase Web App की EXACT API key से replace करें.
बाकी details आपके existing project की हैं.
=========================================================
*/

const firebaseConfig = {

  apiKey:
    "PASTE_YOUR_API_KEY_HERE",

  authDomain:
    "pawanvoice-68c5e.firebaseapp.com",

  databaseURL:
    "https://pawanvoice-68c5e-default-rtdb.firebaseio.com",

  projectId:
    "pawanvoice-68c5e",

  storageBucket:
    "pawanvoice-68c5e.firebasestorage.app",

  messagingSenderId:
    "148446327241",

  appId:
    "1:148446327241:web:6bac9cb9ad0fb530cbb818",

  measurementId:
    "G-S98P3GBNCK"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


/* =====================================================
   LOCAL USER
===================================================== */

let userId =
  localStorage.getItem(
    "pawanvoice_user_id"
  );

if(!userId){

  userId =
    "PV" +
    Date.now().toString(36).toUpperCase() +
    Math.random()
      .toString(36)
      .slice(2,7)
      .toUpperCase();

  localStorage.setItem(
    "pawanvoice_user_id",
    userId
  );

}


let localName =
  localStorage.getItem(
    "pawanvoice_name"
  ) || "Pawan";


let localDP =
  localStorage.getItem(
    "pawanvoice_dp"
  ) || createAvatar(localName);


/* =====================================================
   USER DATA
===================================================== */

let userData = {

  userId:userId,

  name:localName,

  dp:localDP,

  level:1,

  exp:0,

  coins:0,

  diamonds:0,

  vip:0,

  cpLevel:0,

  createdAt:Date.now()

};


/* =====================================================
   CREATE USER
===================================================== */

async function loadUser(){

  try{

    const userRef =
      ref(
        db,
        "users/" + userId
      );

    const snapshot =
      await get(userRef);

    if(snapshot.exists()){

      userData = {
        ...userData,
        ...snapshot.val()
      };

    }else{

      await set(
        userRef,
        userData
      );

    }

    localName =
      userData.name || localName;

    localDP =
      userData.dp || localDP;

    localStorage.setItem(
      "pawanvoice_name",
      localName
    );

    localStorage.setItem(
      "pawanvoice_dp",
      localDP
    );

    renderUser();

  }catch(error){

    console.error(
      "Firebase user error:",
      error
    );

    showToast(
      "Firebase connection check karein"
    );

    renderUser();

  }

}


/* =====================================================
   RENDER USER
===================================================== */

function renderUser(){

  document.getElementById(
    "headerName"
  ).textContent =
    userData.name;

  document.getElementById(
    "welcomeName"
  ).textContent =
    "Welcome, " +
    userData.name +
    " 👋";

  document.getElementById(
    "profileName"
  ).textContent =
    userData.name;

  document.getElementById(
    "profileId"
  ).textContent =
    "ID: " +
    userData.userId;

  document.getElementById(
    "headerDP"
  ).src =
    safeImage(
      userData.dp,
      userData.name
    );

  document.getElementById(
    "profileDP"
  ).src =
    safeImage(
      userData.dp,
      userData.name
    );

  document.getElementById(
    "coinValue"
  ).textContent =
    Number(userData.coins || 0)
      .toLocaleString();

  document.getElementById(
    "diamondValue"
  ).textContent =
    Number(userData.diamonds || 0)
      .toLocaleString();

  renderLevel();

}


/* =====================================================
   LEVEL
===================================================== */

function renderLevel(){

  const level =
    Math.max(
      1,
      Math.min(
        100,
        Number(userData.level || 1)
      )
    );

  const exp =
    Math.max(
      0,
      Number(userData.exp || 0)
    );

  const required =
    getRequiredEXP(level);

  const percent =
    Math.min(
      100,
      (exp / required) * 100
    );

  document.getElementById(
    "levelNumber"
  ).textContent =
    "LV." + level;

  document.getElementById(
    "expText"
  ).textContent =
    exp +
    " / " +
    required +
    " EXP";

  document.getElementById(
    "expFill"
  ).style.width =
    percent + "%";

}


function getRequiredEXP(level){

  /*
    Simple foundation:
    Level 1 -> 100 EXP
    Level 2 -> 200 EXP
    ...
    Level 100 -> 10000 EXP

    Later this can be replaced with
    the final PawanVoice level table.
  */

  return level * 100;

}


/* =====================================================
   ALL LEVELS
===================================================== */

function buildLevelList(){

  const list =
    document.getElementById(
      "levelList"
    );

  list.innerHTML = "";

  for(let level=1;level<=100;level++){

    const required =
      getRequiredEXP(level);

    const row =
      document.createElement("div");

    row.className =
      "level-row";

    row.innerHTML = `

      <div class="level-badge">
        LV.${level}
      </div>

      <div class="level-info">

        <b>
          Level ${level}
        </b>

        <small>
          Required EXP: ${required}
        </small>

      </div>

      <span>
        ${getLevelReward(level)}
      </span>

    `;

    list.appendChild(row);

  }

}


function getLevelReward(level){

  if(level === 1)
    return "⭐";

  if(level % 10 === 0)
    return "🎁🏅";

  if(level % 5 === 0)
    return "🎁";

  return "⭐";

}


/* =====================================================
   OPEN LEVEL
===================================================== */

window.openLevel = function(){

  buildLevelList();

  document
    .getElementById("levelOverlay")
    .classList.add("show");

};

/* =====================================================
   SAVE PROFILE
===================================================== */

window.saveProfile = async function(){

  const name =
    document.getElementById(
      "editName"
    ).value.trim();

  if(!name){

    showToast(
      "Name enter karein"
    );

    return;

  }

  if(name.length < 2){

    showToast(
      "Name bahut chhota hai"
    );

    return;

  }

  try{

    const changes = {

      name:name,

      updatedAt:Date.now()

    };

    await update(
      ref(
        db,
        "users/" + userId
      ),
      changes
    );

    userData.name =
      name;

    localStorage.setItem(
      "pawanvoice_name",
      name
    );

    renderUser();

    hide("editOverlay");

    showToast(
      "Profile name updated"
    );

  }catch(error){

    console.error(error);

    showToast(
      "Profile save nahi hua"
    );

  }

};


/* =====================================================
   CHANGE DP
===================================================== */

window.changeDP = function(event){

  const file =
    event.target.files[0];

  if(!file)
    return;

  if(file.size > 1024 * 1024){

    showToast(
      "DP 1MB se chhoti rakhein"
    );

    return;

  }

  const reader =
    new FileReader();

  reader.onload = async function(){

    const image =
      reader.result;

    try{

      await update(
        ref(
          db,
          "users/" + userId
        ),
        {
          dp:image,
          updatedAt:Date.now()
        }
      );

      userData.dp =
        image;

      localStorage.setItem(
        "pawanvoice_dp",
        image
      );

      renderUser();

      showToast(
        "DP updated"
      );

    }catch(error){

      console.error(error);

      showToast(
        "DP save nahi hui"
      );

    }

  };

  reader.readAsDataURL(file);

};


/* =====================================================
   HOME ROOMS
===================================================== */

let allRooms = [];


/*
  Firebase rooms listener.
  Future room.html इसी database structure
  के साथ connect किया जा सकता है.
*/

function listenRooms(){

  const roomsRef =
    ref(db,"rooms");

  onValue(
    roomsRef,
    snapshot=>{

      const value =
        snapshot.val() || {};

      allRooms = [];

      Object.keys(value)
        .forEach(roomId=>{

          const room =
            value[roomId];

          allRooms.push({

            roomId:roomId,

            roomName:
              room.roomName ||
              "PawanVoice Room",

            dp:
              room.dp ||
              createAvatar(
                room.roomName ||
                "P"
              ),

            users:
              Number(
                room.userCount || 0
              )

          });

        });

      renderRooms(
        allRooms
      );

    },
    error=>{

      console.error(
        "Rooms listener:",
        error
      );

    }
  );

}


/* =====================================================
   RENDER ROOMS
===================================================== */

function renderRooms(rooms){

  const container =
    document.getElementById(
      "roomsList"
    );

  container.innerHTML = "";

  if(!rooms.length){

    /*
      Demo room दिखाई जाएगी ताकि
      Home खाली न रहे.
    */

    rooms = [

      {
        roomId:"PV824991",
        roomName:"PawanVoice Room",
        dp:createAvatar("P"),
        users:0
      }

    ];

  }

  rooms.forEach(room=>{

    const card =
      document.createElement("div");

    card.className =
      "room-card";

    card.innerHTML = `

      <div class="room-top">

        <img
          src="${safeImage(
            room.dp,
            room.roomName
          )}"
          alt=""
        >

        <div class="room-card-info">

          <div class="room-card-name">
            ${escapeHTML(
              room.roomName
            )}
          </div>

          <div class="room-card-id">
            ${escapeHTML(
              room.roomId
            )}
          </div>

        </div>

      </div>

      <div class="room-count">
        🎙️ ${room.users}/9 users
      </div>

      <button
        class="join-room"
        data-room="${escapeHTML(
          room.roomId
        )}"
      >
        Join Room
      </button>

    `;

    const button =
      card.querySelector(
        ".join-room"
      );

    button.onclick = function(){

      joinRoom(
        room.roomId
      );

    };

    container.appendChild(
      card
    );

  });

}


/* =====================================================
   JOIN ROOM
===================================================== */

window.joinRoom = function(roomId){

  if(!roomId)
    return;

  localStorage.setItem(
    "pawanvoice_room",
    roomId
  );

  location.href =
    "room.html?room=" +
    encodeURIComponent(roomId);

};


/* =====================================================
   SEARCH ROOM
===================================================== */

window.searchRoom = function(){

  const value =
    document.getElementById(
      "roomSearch"
    ).value.trim();

  if(!value){

    showToast(
      "Room ID enter karein"
    );

    return;

  }

  joinRoom(value);

};


/* =====================================================
   FILTER ROOMS
===================================================== */

window.filterRooms = function(){

  const value =
    document.getElementById(
      "roomSearch"
    ).value
      .trim()
      .toLowerCase();

  if(!value){

    renderRooms(
      allRooms
    );

    return;

  }

  const filtered =
    allRooms.filter(room=>

      room.roomId
        .toLowerCase()
        .includes(value)

      ||

      room.roomName
        .toLowerCase()
        .includes(value)

    );

  renderRooms(
    filtered
  );

};

/* =====================================================
   HELPERS
===================================================== */

function createAvatar(name){

  const letter =
    String(name || "P")
      .trim()
      .charAt(0)
      .toUpperCase() || "P";

  const svg = `
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="200"
      height="200"
    >

      <rect
        width="200"
        height="200"
        rx="100"
        fill="#39235f"
      />

      <text
        x="100"
        y="122"
        text-anchor="middle"
        font-size="92"
        font-family="Arial"
        fill="white"
      >
        ${letter}
      </text>

    </svg>
  `;

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg)
  );

}


function safeImage(src,name){

  if(
    typeof src === "string" &&
    (
      src.startsWith("data:image/") ||
      src.startsWith("https://") ||
      src.startsWith("http://")
    )
  ){

    return src;

  }

  return createAvatar(name);

}


function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


window.hide = function(id){

  document
    .getElementById(id)
    .classList.remove("show");

};


window.closeOverlay = function(
  event,
  id
){

  if(
    event.target.id === id
  ){

    hide(id);

  }

};


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    window.pawanToast
  );

  window.pawanToast =
    setTimeout(()=>{

      toast.classList.remove(
        "show"
      );

    },2200);

}

window.showToast =
  showToast;

   FIREBASE START

async function start(){

  try{

    listenRooms();

    document.getElementById(

    ).style.display =
      "none";

  }catch(error){

    console.error(error);

    document.getElementById(
      "loading"
    ).style.display =

    showToast(

    );

  }

}

start();
