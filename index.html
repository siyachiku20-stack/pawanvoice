<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawanVoice</title>
  <script src="https://meet.jit.si/external_api.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101828;
      color: white;
    }

    #top {
      height: 60px;
      background: #172554;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    #title {
      font-size: 22px;
      font-weight: bold;
    }

    #roomName {
      font-size: 13px;
      color: #cbd5e1;
    }

    #meet {
      height: calc(100vh - 130px);
      width: 100%;
    }

    #controls {
      height: 70px;
      background: #172554;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    button {
      border: none;
      border-radius: 25px;
      padding: 12px 18px;
      font-size: 15px;
      color: white;
      background: #2563eb;
    }

    #leave {
      background: #dc2626;
    }

    #join {
      background: #16a34a;
    }

    #nameBox {
      position: fixed;
      inset: 0;
      background: #101828;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    #nameBox h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      max-width: 350px;
      padding: 15px;
      border-radius: 10px;
      border: none;
      margin: 10px 0;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="nameBox">
  <h1>🎙️ PawanVoice</h1>
  <p>Voice Group me join karein</p>

  <input id="nameInput" placeholder="Apna naam likho">

  <button id="join" onclick="joinRoom()">Join Voice Room</button>
</div>

<div id="top">
  <div id="title">🎙️ PawanVoice</div>
  <div id="roomName">Voice Room</div>
</div>

<div id="meet"></div>

<div id="controls">
  <button onclick="toggleMic()">🎤 Mic</button>
  <button onclick="shareRoom()">🔗 Share</button>
  <button id="leave" onclick="leaveRoom()">🚪 Leave</button>
</div>

<script>

let api = null;

const roomName = "PawanVoiceRoom2026";

function joinRoom() {

  let name = document.getElementById("nameInput").value.trim();

  if (name === "") {
    alert("Pehle apna naam likho");
    return;
  }

  document.getElementById("nameBox").style.display = "none";

  api = new JitsiMeetExternalAPI("meet.jit.si", {

    roomName: roomName,

    parentNode: document.querySelector("#meet"),

    width: "100%",
    height: "100%",

    userInfo: {
      displayName: name
    },

    configOverwrite: {
      startWithAudioMuted: false,
      startWithVideoMuted: true
    },

    interfaceConfigOverwrite: {
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false
    }
  });

}

function toggleMic() {

  if (api) {
    api.executeCommand("toggleAudio");
  }

}

function leaveRoom() {

  if (api) {
    api.executeCommand("hangup");
  }

  document.getElementById("nameBox").style.display = "flex";

}

function shareRoom() {

  let link =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    roomName;

  if (navigator.share) {

    navigator.share({
      title: "PawanVoice",
      text: "PawanVoice Voice Room me join karo",
      url: link
    });

  } else {

    navigator.clipboard.writeText(link);
    alert("Room link copy ho gaya");

  }

}

</script>

</body>
</html>
