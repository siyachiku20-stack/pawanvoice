<style>
*{

}

body{

  color:#fff;

}

.header{

.back{

.title{

  font-weight:bold;
}

.refresh{

  width:38px;
  height:38px;
  border-radius:50%;

  background:#17182b;
  color:#fff;

}

.profile{

  padding:13px;

.profile img{

  border-radius:50%;

}

.profile-name{
  font-size:16px;
  font-weight:bold;
}

.profile-id{
  margin-top:4px;
  color:#969ab2;
  font-size:12px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(2,1fr);

.tab{

  background:#141528;
  color:#9da1b8;
  padding:11px 5px;
  border-radius:10px;

  text-align:center;
}

.tab.active{

  color:#fff;

}

.section{

}

.section-title{

  margin:10px 2px;
}

.empty{
  padding:45px 15px;
  text-align:center;
  color:#8589a2;
  background:#111222;
  border:1px solid #292b42;
  border-radius:15px;
}

.empty-icon{
  font-size:42px;
  margin-bottom:10px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  margin-bottom:9px;
  border-radius:14px;
  background:#141528;
  border:1px solid #292b45;
}

.item-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#272940;
}

.item-content{
  flex:1;
  min-width:0;
}

.item-name{
  font-size:14px;
  font-weight:bold;
}

.item-text{
  margin-top:5px;
  color:#969ab1;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.item-time{
  margin-top:4px;
  color:#6f738c;
  font-size:10px;
}

.actions{
  display:flex;
  gap:6px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:8px 10px;
  color:#fff;
  font-size:11px;
  cursor:pointer;
}

.accept{
  background:#765cff;
}

.reject{
  background:#292b40;
}

.chat-btn{
  background:#765cff;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:#111222;
  border-top:1px solid #292b42;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:20;
}

.nav{

  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#8f93ab;
  font-size:11px;
  cursor:pointer;
}

.nav span{
  font-size:22px;
  margin-bottom:3px;
}

.nav.active{

}

.toast{

  left:50%;
  bottom:82px;
  transform:translateX(-50%);

  border:1px solid #444664;
  padding:11px 18px;
  border-radius:25px;
  display:none;
  z-index:50;

  white-space:nowrap;
}

.loading{
  text-align:center;
  color:#8e92aa;
  padding:30px;
}

.dot{
  width:7px;
  height:7px;
  background:#48df91;
  display:inline-block;
  border-radius:50%;
  margin-right:5px;
}
</style>
</head>

<body>

<div class="section">

  </div>

    </div>

  </div>


  <div
    id="requestsSection"
    style="display:none;"
  >

      Friend Requests
    </div>

  </div>


  <div

  >

      CP Requests
    </div>

  </div>

<div id="toast" class="toast"></div>


<div class="bottom">

    Home
  </div>

  >

    Inbox
  </div>

    onclick="goProfile()"

    Profile
  </div>

</div>


<script>

const FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";


let currentUser = null;

let currentTab = "messages";


/* =========================================
   LOCAL USER
========================================= */

function getLocalUser(){

  return {

    userId:
      localStorage.getItem("pv_userId") ||
      "pawan",

    name:
      localStorage.getItem("pv_name") ||
      "Pawan User",

    dp:
      localStorage.getItem("pv_dp") ||
      "https://i.pravatar.cc/150?img=12"

  };

}


/* =========================================
   LOAD CURRENT USER
========================================= */

async function loadCurrentUser(){

  const local =
    getLocalUser();

  currentUser = local;

  renderUser(local);


  try{

    const response =
      await fetch(
        FIREBASE_DB +
        "/users/" +
        encodeURIComponent(
          local.userId
        ) +
        ".json"
      );

    if(!response.ok){
      throw new Error(
        "HTTP " +
        response.status
      );
    }

    const data =
      await response.json();

    if(data){

      currentUser = {

        userId:
          data.userId ||
          local.userId,

        name:
          data.name ||
          local.name,

        dp:
          data.dp ||
          local.dp

      };

      localStorage.setItem(
        "pv_userId",
        currentUser.userId
      );

      localStorage.setItem(
        "pv_name",
        currentUser.name
      );

      localStorage.setItem(
        "pv_dp",
        currentUser.dp
      );

      renderUser(
        currentUser
      );

    }

  }
  catch(error){

    console.error(
      "User load error:",
      error
    );

  }

}


/* =========================================
   RENDER USER
========================================= */

function renderUser(user){

  document.getElementById(
    "myDP"
  ).src =
    user.dp;

  document.getElementById(
    "myName"
  ).textContent =
    user.name;

  document.getElementById(
    "myID"
  ).textContent =
    "ID: " +
    user.userId;

}


/* =========================================
   FIREBASE GET
========================================= */

async function firebaseGet(path){

  const response =
    await fetch(
      FIREBASE_DB +
      path +
      ".json"
    );

  if(!response.ok){

    throw new Error(
      "Firebase HTTP " +
      response.status
    );

  }

  return await response.json();

}


/* =========================================
   LOAD INBOX
========================================= */

async function loadInbox(){

  showLoading();

  await loadCurrentUser();

  try{

    const uid =
      encodeURIComponent(
        currentUser.userId
      );


    /*
      Firebase paths:

      messages/<userId>
      friendRequests/<userId>
      cpRequests/<userId>
      familyInvites/<userId>
    */

    const results =
      await Promise.all([

        firebaseGet(
          "/messages/" + uid
        ),

        firebaseGet(
          "/friendRequests/" + uid
        ),

        firebaseGet(
          "/cpRequests/" + uid
        ),

        firebaseGet(
          "/familyInvites/" + uid
        )

      ]);


    renderMessages(
      results[0]
    );

    renderRequests(
      results[1]
    );

    renderCP(
      results[2]
    );

    renderFamily(
      results[3]
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    showTab(
      currentTab
    );

  }
  catch(error){

    console.error(
      "Inbox error:",
      error
    );

    document.getElementById(
      "loading"
    ).innerHTML =
      "Inbox load nahi hua.<br><br>" +
      "Firebase Database Rules check karo.";

  }

}


/* =========================================
   MESSAGES
========================================= */

function renderMessages(data){

  const list =
    document.getElementById(
      "messagesList"
    );

  list.innerHTML = "";


  if(!data){

    list.innerHTML =
      emptyBox(
        "💬",
        "No messages yet"
      );

    return;

  }


  const items =
    Object.entries(data);


  if(items.length === 0){

    list.innerHTML =
      emptyBox(
        "💬",
        "No messages yet"
      );

    return;

  }


  items.reverse();


  items.forEach(
    ([id,message]) => {

      const name =
        escapeHTML(
          message.name ||
          "User"
        );

      const text =
        escapeHTML(
          message.text ||
          "New message"
        );

      const dp =
        message.dp ||
        "https://i.pravatar.cc/100?img=12";

      const time =
        formatTime(
          message.createdAt
        );


      list.innerHTML += `

        <div class="item">

          <img
            class="item-avatar"
            src="${escapeAttr(dp)}"
          >

          <div class="item-content">

            <div class="item-name">
              ${name}
            </div>

            <div class="item-text">
              ${text}
            </div>

            <div class="item-time">
              ${time}
            </div>

          </div>

          <button
            class="btn chat-btn"
            onclick="openChat('${escapeAttr(message.userId || '')}')"
          >
            Chat
          </button>

        </div>

      `;

    }
  );

}


/* =========================================
   FRIEND REQUESTS
========================================= */

      );

    return;

  }


  items.forEach(
    ([id,request]) => {

      const name =
        escapeHTML(
          request.name ||
          "User"
        );

      const dp =
        request.dp ||
        "https://i.pravatar.cc/100?img=12";

      const uid =
        request.userId ||
        id;


      list.innerHTML += `

        <div class="item">

          <img
            class="item-avatar"
            src="${escapeAttr(dp)}"
          >

          <div class="item-content">

            <div class="item-name">
              ${name}
            </div>

            <div class="item-text">
              ID: ${escapeHTML(uid)}
            </div>

          </div>

          <div class="actions">

            <button
              class="btn accept"
              onclick="acceptFriend('${escapeAttr(id)}')"
            >
              Accept
            </button>

            <button
              class="btn reject"
              onclick="rejectFriend('${escapeAttr(id)}')"
            >
              Reject
            </button>

          </div>

        </div>

      `;

    }
  );

}

            </button>

========================================= */

function renderFamily(data){

    );

  if(!data){

    list.innerHTML =

      );

      const familyName =

        );

      list.innerHTML += `

        <div class="item">

          <img
            class="item-avatar"
            src="${escapeAttr(dp)}"
          >

          <div class="item-content">

            <div class="item-name">
              ${familyName}
            </div>

            <div class="item-text">
              You have been invited to join this family

            <button

      `;

/* =========================================
   TAB
========================================= */

function showTab(tab){

  currentTab =
    tab;


  const sections = {

    messages:
      document.getElementById(
        "messagesSection"
      ),

    requests:
      document.getElementById(
        "requestsSection"
      ),

    cp:
      document.getElementById(
        "cpSection"
      ),

    family:
      document.getElementById(
        "familySection"
      )

  };


  Object.values(
    sections
  ).forEach(
    section => {
      section.style.display =
        "none";
    }
  );


  sections[tab].style.display =
    "block";


  document.querySelectorAll(
    ".tab"
  ).forEach(
    button => {
      button.classList.remove(
        "active"
      );
    }
  );


  if(tab === "messages"){

    document.getElementById(
      "tabMessages"
    ).classList.add(
      "active"
    );

  }

  if(tab === "requests"){

    document.getElementById(
      "tabRequests"
    ).classList.add(
      "active"
    );

  }

  if(tab === "cp"){

    document.getElementById(
      "tabCP"
    ).classList.add(
      "active"
    );

  }

  if(tab === "family"){

    document.getElementById(
      "tabFamily"
    ).classList.add(
      "active"
    );

  }

}


/* =========================================
   ACCEPT FRIEND
========================================= */

async function acceptFriend(id){

  if(!currentUser) return;

  try{

    const request =
      await firebaseGet(
        "/friendRequests/" +
        encodeURIComponent(
          currentUser.userId
        ) +
        "/" +
        encodeURIComponent(id)
      );


    if(!request){

      showToast(
        "Request nahi mili"
      );

      return;

    }


    const friendId =
      request.userId ||
      id;


    await fetch(
      FIREBASE_DB +
      "/friends/" +
      encodeURIComponent(
        currentUser.userId
      ) +
      "/" +
      encodeURIComponent(friendId) +
      ".json",
      {

        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          userId:friendId,
          name:request.name || "",
          dp:request.dp || "",
          createdAt:Date.now()
        })

      }
    );


    await deleteFirebase(
      "/friendRequests/" +
      encodeURIComponent(
        currentUser.userId
      ) +
      "/" +
      encodeURIComponent(id)
    );


    showToast(
      "Friend request accepted ✅"
    );

    loadInbox();

  }
  catch(error){

    console.error(error);

    showToast(
      "Request accept nahi hui"
    );

  }

}


/* =========================================
   REJECT FRIEND
========================================= */

async function rejectFriend(id){

  try{

    await deleteFirebase(
      "/friendRequests/" +
      encodeURIComponent(
        currentUser.userId
      ) +
      "/" +
      encodeURIComponent(id)
    );

    showToast(
      "Request rejected"
    );

    loadInbox();

  }
  catch(error){

    showToast(
      "Request remove nahi hui"
    );

  }

}

    );

  }
  catch(error){

    console.error(error);

    showToast(
      "Family join nahi hui"
    );

  }

}


/* =========================================
   FAMILY REJECT
========================================= */

async function rejectFamily(id){

  try{

    await deleteFirebase(
      "/familyInvites/" +
      encodeURIComponent(
        currentUser.userId
      ) +
      "/" +
      encodeURIComponent(id)
    );

    showToast(
      "Invitation ignored"
    );

    loadInbox();

  }
  catch(error){

    showToast(
      "Invitation remove nahi hui"
    );

  }

}


/* =========================================
   DELETE
========================================= */

async function deleteFirebase(path){

  const response =
    await fetch(
      FIREBASE_DB +
      path +
      ".json",
      {
        method:"DELETE"
      }
    );

  if(!response.ok){

    throw new Error(
      "Delete failed"
    );

  }

}


/* =========================================
   OPEN CHAT
========================================= */

function openChat(userId){

  if(!userId){

    showToast(
      "User ID nahi mili"
    );

    return;

  }

  window.location.href =
    "/chat.html?user=" +
    encodeURIComponent(
      userId
    );

}

function emptyBox(
  icon,
  text
){

    <div class="empty">

        ${icon}
      </div>

        ${text}

/* =========================================
   TIME
========================================= */

function formatTime(timestamp){

  if(!timestamp){
    return "";
  }

  const date =
    new Date(
      Number(timestamp)
    );

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }

  return date.toLocaleString();

}


/* =========================================
   HTML SAFETY
========================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}

   NAVIGATION

    "/index.html";

}


function goProfile(){

/* =========================================
   TOAST
========================================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.style.display =
    "block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      function(){

        toast.style.display =
          "none";

      },
      2500
    );

}
