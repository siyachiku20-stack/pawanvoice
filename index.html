<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PawanVoice</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#090b16;
  color:#fff;
}

button,input{
  font:inherit;
}

.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(circle at top,#24265a 0,#111326 35%,#090b16 75%);
  padding-bottom:75px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 15px 10px;
}

.profile{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ffcf4a;
}

.profile-name{
  font-weight:700;
  font-size:16px;
}

.profile-id{
  font-size:11px;
  color:#aeb2c8;
  margin-top:3px;
}

.header-icons{
  display:flex;
  gap:9px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#ffffff12;
  color:white;
  font-size:18px;
}

/* SEARCH */

.search{
  margin:8px 15px 14px;
  background:#ffffff12;
  border:1px solid #ffffff10;
  border-radius:14px;
  padding:12px 15px;
  display:flex;
  align-items:center;
  gap:9px;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
}

.search input::placeholder{
  color:#8d91aa;
}

/* BANNER */

.banner{
  margin:0 15px 15px;
  min-height:120px;
  border-radius:20px;
  padding:18px;
  background:
    linear-gradient(135deg,#4934a5,#b42d82);
  position:relative;
  overflow:hidden;
}

.banner:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:#ffffff15;
  right:-35px;
  top:-30px;
}

.banner-title{
  font-size:21px;
  font-weight:800;
}

.banner-text{
  color:#eee;
  font-size:13px;
  margin-top:7px;
  max-width:240px;
}

.banner-buttons{
  display:flex;
  gap:7px;
  margin-top:14px;
}

.banner-btn{
  border:0;
  border-radius:20px;
  padding:7px 12px;
  background:#ffffff25;
  color:white;
  font-size:11px;
}

/* QUICK */

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:0 15px 16px;
}

.quick-card{
  background:#ffffff0d;
  border:1px solid #ffffff08;
  border-radius:15px;
  padding:12px 5px;
  text-align:center;
}

.quick-icon{
  font-size:23px;
}

.quick-title{
  margin-top:6px;
  font-size:11px;
  color:#ddd;
}

/* SECTION */

.section{
  padding:0 15px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:5px 0 12px;
}

.section-title{
  font-size:18px;
  font-weight:800;
}

.section-more{
  color:#aeb4ff;
  font-size:12px;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.tab{
  border:0;
  background:#ffffff0d;
  color:#aeb2c8;
  padding:8px 16px;
  border-radius:20px;
}

.tab.active{
  background:#6d5dfc;
  color:white;
}

/* ROOMS */

.rooms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.room-card{
  background:#15182b;
  border:1px solid #ffffff0a;
  border-radius:17px;
  padding:10px;
  cursor:pointer;
  overflow:hidden;
}

.room-cover{
  width:100%;
  aspect-ratio:1.55;
  border-radius:13px;
  object-fit:cover;
  background:#24273d;
}

.room-name{
  font-size:14px;
  font-weight:700;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-id{
  font-size:10px;
  color:#858ba7;
  margin-top:4px;
}

.room-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
}

.host{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
}

.host img{
  width:22px;
  height:22px;
  border-radius:50%;
  object-fit:cover;
}

.host span{
  font-size:10px;
  color:#bfc2d3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.online{
  font-size:10px;
  color:#6effb1;
}

/* EMPTY */

.empty{
  padding:35px 15px;
  text-align:center;
  color:#8e93ac;
  background:#ffffff08;
  border-radius:17px;
}

/* CREATE */

.create{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  width:58px;
  height:58px;
  border-radius:50%;
  border:0;
  background:linear-gradient(135deg,#ff5d9e,#7c5cff);
  color:white;
  font-size:30px;
  box-shadow:0 8px 30px #0008;
  z-index:20;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:67px;
  background:#0e1020f5;
  backdrop-filter:blur(15px);
  border-top:1px solid #ffffff0c;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:15;
}

.nav{
  border:0;
  background:transparent;
  color:#777d9c;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.nav.active{
  color:#fff;
}

.nav-icon{
  font-size:20px;
}

.nav-text{
  font-size:10px;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:flex-end;
  z-index:100;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  background:#171a2d;
  border-radius:25px 25px 0 0;
  padding:20px;
  max-height:85vh;
  overflow:auto;
}

.modal h2{
  margin-bottom:15px;
}

.form-input{
  width:100%;
  border:1px solid #ffffff12;
  background:#ffffff09;
  color:white;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
  outline:0;
}

.select{
  width:100%;
  border:1px solid #ffffff12;
  background:#20243a;
  color:white;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
}

.primary{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  background:#6d5dfc;
  color:white;
  font-weight:700;
}

.cancel{
  width:100%;
  border:0;
  background:#ffffff0d;
  color:#ccc;
  padding:12px;
  border-radius:13px;
  margin-top:8px;
}

.loading{
  text-align:center;
  color:#8d92aa;
  padding:30px;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="profile">

      <img
        id="myDp"
        class="avatar"
        src="https://i.pravatar.cc/150?img=12"
      >

      <div>
        <div id="myName" class="profile-name">
          Pawan
        </div>

        <div id="myId" class="profile-id">
          ID: pawan
        </div>
      </div>

    </div>

    <div class="header-icons">

      <button class="icon-btn" onclick="openInbox()">
        💌
      </button>

      <button class="icon-btn" onclick="openProfile()">
        👤
      </button>

    </div>

  </header>


  <!-- SEARCH -->

  <div class="search">

    🔍

    <input
      id="search"
      placeholder="Search rooms..."
      oninput="renderRooms()"
    >

  </div>


  <!-- BANNER -->

  <div class="banner">

    <div class="banner-title">
      Welcome to PawanVoice
    </div>

    <div class="banner-text">
      Talk, make friends and enjoy live voice rooms.
    </div>

    <div class="banner-buttons">

      <button
        class="banner-btn"
        onclick="showInfo('Family Ranking')">
        👨‍👩‍👧 Family
      </button>

      <button
        class="banner-btn"
        onclick="showInfo('CP Ranking')">
        ❤️ CP
      </button>

      <button
        class="banner-btn"
        onclick="showInfo('Rich King')">
        💎 Rich King
      </button>

    </div>

  </div>


  <!-- QUICK -->

  <div class="quick">

    <div class="quick-card"
         onclick="showInfo('Family')">
      <div class="quick-icon">👨‍👩‍👧</div>
      <div class="quick-title">Family</div>
    </div>

    <div class="quick-card"
         onclick="showInfo('CP Ranking')">
      <div class="quick-icon">❤️</div>
      <div class="quick-title">CP Ranking</div>
    </div>

    <div class="quick-card"
         onclick="showInfo('Rich King')">
      <div class="quick-icon">💎</div>
      <div class="quick-title">Rich King</div>
    </div>

    <div class="quick-card"
         onclick="showInfo('Level')">
      <div class="quick-icon">🏆</div>
      <div class="quick-title">Level</div>
    </div>

  </div>


  <!-- ROOMS -->

  <section class="section">

    <div class="section-head">

      <div class="section-title">
        Voice Rooms
      </div>

      <div class="section-more">
        9 Seats
      </div>

    </div>

    <div class="tabs">

      <button
        id="popularTab"
        class="tab active"
        onclick="setTab('popular')">
        Popular
      </button>

      <button
        id="allTab"
        class="tab"
        onclick="setTab('all')">
        All Rooms
      </button>

    </div>

    <div id="rooms" class="rooms">

      <div class="loading">
        Loading rooms...
      </div>

    </div>

  </section>

</div>


<!-- CREATE ROOM -->

<button
  class="create"
  onclick="openCreate()">
  +
</button>


<!-- BOTTOM -->

<nav class="bottom">

  <button
    class="nav active"
    onclick="location.href='/'">

    <div class="nav-icon">🏠</div>
    <div class="nav-text">Home</div>

  </button>

  <button
    class="nav"
    onclick="scrollToRooms()">

    <div class="nav-icon">🎙️</div>
    <div class="nav-text">Rooms</div>

  </button>

  <button
    class="nav"
    onclick="openInbox()">

    <div class="nav-icon">💌</div>
    <div class="nav-text">Inbox</div>

  </button>

  <button
    class="nav"
    onclick="openProfile()">

    <div class="nav-icon">👤</div>
    <div class="nav-text">Profile</div>

  </button>

</nav>


<!-- CREATE MODAL -->

<div
  id="createModal"
  class="modal-bg"
  onclick="outsideClose(event)">

  <div class="modal">

    <h2>Create Voice Room</h2>

    <input
      id="roomName"
      class="form-input"
      placeholder="Room name"
      maxlength="40"
    >

    <input
      id="roomDp"
      class="form-input"
      placeholder="Room DP URL"
    >

    <select
      id="category"
      class="select">

      <option>General</option>
      <option>Music</option>
      <option>Friends</option>
      <option>Gaming</option>
      <option>Chat</option>

    </select>

    <button
      class="primary"
      onclick="createRoom()">
      Create Room
    </button>

    <button
      class="cancel"
      onclick="closeCreate()">
      Cancel
    </button>

  </div>

</div>


<script>

const SERVER = window.location.origin;

let rooms = [];

let currentTab = "popular";

let socket = null;


/* USER */

const userId =
  localStorage.getItem("pv_userId") ||
  "pawan";

const userName =
  localStorage.getItem("pv_name") ||
  "Pawan";

const userDp =
  localStorage.getItem("pv_dp") ||
  "https://i.pravatar.cc/150?img=12";


document.getElementById("myName").textContent =
  userName;

document.getElementById("myId").textContent =
  "ID: " + userId;

document.getElementById("myDp").src =
  userDp;


/* LOAD ROOMS */

async function loadRooms(){

  try{

    /*
      This uses the Firebase REST database.
      Firebase API key is NOT needed here.
    */

    const url =
      "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/rooms.json";

    const response =
      await fetch(url);

    if(!response.ok){
      throw new Error("Rooms request failed");
    }

    const data =
      await response.json();

    rooms = [];

    if(data){

      Object.keys(data).forEach(key => {

        const room = data[key];

        if(room){

          rooms.push({
            roomId:
              room.roomId ||
              key,

            roomName:
              room.roomName ||
              room.name ||
              "PawanVoice Room",

            roomDp:
              room.roomDp ||
              "https://i.pravatar.cc/400?img=20",

            category:
              room.category ||
              "General",

            hostName:
              room.hostName ||
              "Host",

            hostDp:
              room.hostDp ||
              "https://i.pravatar.cc/100?img=12",

            onlineCount:
              Number(room.onlineCount || 0),

            maxSeats:
              Number(room.maxSeats || 9),

            updatedAt:
              Number(room.updatedAt || 0)
          });

        }

      });

    }

    renderRooms();

  }catch(error){

    console.log(error);

    rooms = [];

    renderRooms();

  }

}


/* RENDER */

function renderRooms(){

  const box =
    document.getElementById("rooms");

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  let list =
    rooms.filter(room => {

      const text =
        (
          room.roomName +
          " " +
          room.roomId +
          " " +
          room.category +
          " " +
          room.hostName
        ).toLowerCase();

      return text.includes(search);

    });


  if(currentTab === "popular"){

    list.sort(
      (a,b) =>
        b.onlineCount - a.onlineCount
    );

  }else{

    list.sort(
      (a,b) =>
        b.updatedAt - a.updatedAt
    );

  }


  if(!list.length){

    box.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        🎙️<br><br>
        No voice rooms found.<br>
        Create your first room.
      </div>
    `;

    return;

  }


  box.innerHTML =
    list.map(room => `

      <div
        class="room-card"
        onclick="openRoom('${escapeAttr(room.roomId)}')">

        <img
          class="room-cover"
          src="${escapeAttr(room.roomDp)}"
          onerror="this.src='https://i.pravatar.cc/400?img=20'"
        >

        <div class="room-name">
          ${escapeHtml(room.roomName)}
        </div>

        <div class="room-id">
          ID: ${escapeHtml(room.roomId)}
        </div>

        <div class="room-bottom">

          <div class="host">

            <img
              src="${escapeAttr(room.hostDp)}"
              onerror="this.src='https://i.pravatar.cc/100?img=12'"
            >

            <span>
              ${escapeHtml(room.hostName)}
            </span>

          </div>

          <div class="online">
            🟢 ${room.onlineCount}/${room.maxSeats}
          </div>

        </div>

      </div>

    `).join("");

}


/* TAB */

function setTab(tab){

  currentTab = tab;

  document
    .getElementById("popularTab")
    .classList.toggle(
      "active",
      tab === "popular"
    );

  document
    .getElementById("allTab")
    .classList.toggle(
      "active",
      tab === "all"
    );

  renderRooms();

}


/* OPEN ROOM */

function openRoom(roomId){

  const url =
    "/room.html" +
    "?room=" +
    encodeURIComponent(roomId) +
    "&userid=" +
    encodeURIComponent(userId) +
    "&name=" +
    encodeURIComponent(userName) +
    "&dp=" +
    encodeURIComponent(userDp);

  location.href = url;

}


/* CREATE ROOM */

async function createRoom(){

  const name =
    document
      .getElementById("roomName")
      .value
      .trim();

  const dp =
    document
      .getElementById("roomDp")
      .value
      .trim();

  const category =
    document
      .getElementById("category")
      .value;


  if(!name){

    alert("Room name enter karein");

    return;

  }


  const roomId =
    generateRoomId();


  const room = {

    roomId,

    name,

    roomName:name,

    roomDp:
      dp ||
      "https://i.pravatar.cc/400?img=20",

    category,

    hostUserId:userId,

    hostName:userName,

    hostDp:userDp,

    online:true,

    onlineCount:1,

    maxSeats:9,

    createdAt:Date.now(),

    updatedAt:Date.now()

  };


  try{

    const response =
      await fetch(
        "https://pawanvoice-68c5e-default-rtdb.firebaseio.com/rooms/" +
        encodeURIComponent(roomId) +
        ".json",
        {
          method:"PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify(room)
        }
      );


    if(!response.ok){

      throw new Error(
        "Room save failed"
      );

    }


    closeCreate();

    openRoom(roomId);

  }catch(error){

    console.log(error);

    alert(
      "Room create nahi hua. Firebase database rules check karein."
    );

  }

}


/* ID */

function generateRoomId(){

  let id;

  do{

    id =
      Math.floor(
        100000 +
        Math.random() * 900000
      ).toString();

  }while(
    rooms.some(
      room => room.roomId === id
    )
  );

  return id;

}


/* CREATE MODAL */

function openCreate(){

  document
    .getElementById("createModal")
    .classList.add("show");

}

function closeCreate(){

  document
    .getElementById("createModal")
    .classList.remove("show");

}

function outsideClose(event){

  if(
    event.target.id ===
    "createModal"
  ){

    closeCreate();

  }

}


/* NAV */

function scrollToRooms(){

  window.scrollTo({
    top:250,
    behavior:"smooth"
  });

}

function openInbox(){

  alert(
    "Inbox next step me connect hoga."
  );

}

function openProfile(){

  location.href =
    "/profile.html";

}

function showInfo(title){

  alert(
    title +
    " section PawanVoice ke next social phase me connect hoga."
  );

}


/* ESCAPE */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttr(value){

  return escapeHtml(value);

}


/* INITIAL */

loadRooms();


/*
  Room list ko periodically refresh karenge.
  Isse new rooms/online count Home par
  kuch seconds me update ho jayega.
*/

setInterval(
  loadRooms,
  3000
);

</script>

</body>
</html>
