```html
<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PawanVoice</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

body{
  margin:0;
  padding:20px;
  padding-bottom:80px;
  background:#111;
  color:white;
  font-family:Arial;
}

h1{
  text-align:center;
}

.box{
  background:#222;
  padding:18px;
  margin:15px 0;
  border-radius:12px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border:0;
  border-radius:8px;
  margin:7px 0;
  font-size:16px;
}

button{
  padding:12px 18px;
  margin:5px 2px;
  border:0;
  border-radius:8px;
  font-size:15px;
}

.room{
  background:#333;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

.join{
  display:inline-block;
  background:white;
  color:black;
  padding:10px 15px;
  border-radius:8px;
  text-decoration:none;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#222;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  z-index:9999;
}

.bottom-nav button{
  background:none;
  color:white;
  font-size:15px;
  margin:0;
}

</style>

</head>

<body>

<h1>🎙️ PawanVoice</h1>


<div class="box">

<h3>👤 Apna Naam</h3>

<input id="userName" placeholder="Apna naam likho">

</div>


<div class="box" id="genderBox">

<h3>🚻 Select Gender</h3>

<button onclick="selectGender('Male')">
👨 Male
</button>

<button onclick="selectGender('Female')">
👩 Female
</button>

<p id="selectedGender">
Gender: Not Selected
</p>

</div>


<div class="box">

<h3>➕ Create Room</h3>

<input id="roomName" placeholder="Room ka naam">

<button onclick="createRoom()">
Create Room
</button>

</div>


<div class="box">

<h3>🏠 Voice Rooms</h3>

<div id="rooms">
Rooms load ho rahe hain...
</div>

</div>


<script>

const firebaseConfig = {

  apiKey: "AIzaSyDnlTdeqG5aPHrUIV6kTYnM521GtbrrE",

  authDomain: "pawanvoice-68c5e.firebaseapp.com",

  databaseURL: "https://pawanvoice-68c5e-default-rtdb.firebaseio.com",

  projectId: "pawanvoice-68c5e",

  storageBucket: "pawanvoice-68c5e.firebasestorage.app",

  messagingSenderId: "148446327241",

  appId: "1:148446327241:web:6bac9cb9ad0fb530cbb818"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.database();


function selectGender(gender){

  localStorage.setItem("pawanGender", gender);

  document.getElementById("selectedGender").innerText =
    "Gender: " + gender;

}


function createRoom(){

  let name = document
    .getElementById("roomName")
    .value
    .trim();

  let userName = document
    .getElementById("userName")
    .value
    .trim();


  if(!userName){

    alert("Pehle apna naam likho");

    return;

  }


  if(!name){

    alert("Room ka naam likho");

    return;

  }


  localStorage.setItem("pawanName", userName);


  let id = Date.now().toString();


  db.ref("rooms/" + id).set({

    name: name,

    owner: userName,

    users: 0,

    createdAt: Date.now()

  })
  .then(function(){

    document.getElementById("roomName").value = "";

    alert("Room create ho gaya");

    location.href = "room.html?id=" + id;

  })
  .catch(function(error){

    alert("Room create nahi hua: " + error.message);

  });

}


function joinRoom(id){

  let userName = document
    .getElementById("userName")
    .value
    .trim();


  if(!userName){

    alert("Pehle apna naam likho");

    return;

  }


  localStorage.setItem("pawanName", userName);

  location.href = "room.html?id=" + id;

}


function loadRooms(){

  const box = document.getElementById("rooms");


  db.ref("rooms").on("value", function(snapshot){

    box.innerHTML = "";


    if(!snapshot.exists()){

      box.innerHTML = "Abhi koi room nahi hai.";

      return;

    }


    snapshot.forEach(function(child){

      let id = child.key;

      let room = child.val();


      let div = document.createElement("div");

      div.className = "room";


      div.innerHTML =
        "<b>🎙️ " + room.name + "</b>" +
        "<br>" +
        "👤 Owner: " + (room.owner || "User") +
        "<br><br>" +
        "<button onclick=\"joinRoom('" + id + "')\">" +
        "Join Room" +
        "</button>";


      box.appendChild(div);

    });

  });

}


function showPage(page){

  if(page === "room"){

    alert("🏠 Room");

  }


  if(page === "inbox"){

    alert("💬 Inbox");

  }


  if(page === "me"){

    alert("👤 My Profile");

  }

}


loadRooms();

</script>


<div class="bottom-nav">

  <button onclick="showPage('room')">
    🏠<br>Room
  </button>

  <button onclick="showPage('inbox')">
    💬<br>Inbox
  </button>

  <button onclick="showPage('me')">
    👤<br>Me
  </button>

</div>


</body>

</html>
```
