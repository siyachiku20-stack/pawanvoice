<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PawanVoice</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center}
#join{padding-top:80px}
input{padding:15px;width:80%;max-width:320px;border:0;border-radius:10px;margin:15px}
button{padding:13px 20px;border:0;border-radius:25px;background:#2563eb;color:white;font-size:16px;margin:5px}
#room{display:none}
#status{color:#94a3b8}
</style>
</head>

<body>

<div id="join">
<h1>🎙️ PawanVoice</h1>
<p>Free Voice Group</p>
<input id="name" placeholder="Apna naam likho">
<br>
<button onclick="start()">Join Voice Room</button>
</div>

<div id="room">
<h2>🎙️ PawanVoice</h2>
<p id="status">Connecting...</p>
<button onclick="toggleMic()">🎤 Mic ON/OFF</button>
<button onclick="location.reload()">🚪 Leave</button>
<div id="audios"></div>
</div>

<script>

const firebaseConfig={
  apiKey:"AIzaSyDnlTdeqGyG5aPHrUIV6kTYnM521GtbrrE",
  authDomain:"pawanvoice-68c5e.firebaseapp.com",
  databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com",
  projectId:"pawanvoice-68c5e",
  storageBucket:"pawanvoice-68c5e.firebasestorage.app",
  messagingSenderId:"148446327241"
  appId: "1:148446327241:web:6bac9cb9ad0fb530cbb818",
  measurementId: "G-S98P3GBNCK"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let peer;
let stream;
let myId;
const roomId="PawanVoiceRoom2026";

async function start(){

 const name=document.getElementById("name").value.trim();

 if(!name){
   alert("Apna naam likho");
   return;
 }

 document.getElementById("join").style.display="none";
 document.getElementById("room").style.display="block";

 try{

  stream=await navigator.mediaDevices.getUserMedia({audio:true});

  peer=new Peer();

  peer.on("open",async id=>{

   myId=id;

   document.getElementById("status").innerText=
     "Voice Room connected";

   await db.ref("voiceRooms/"+roomId+"/"+id).set({
     name:name,
     peerId:id
   });

   db.ref("voiceRooms/"+roomId).on("child_added",snap=>{

     const user=snap.val();

     if(user.peerId!==myId){
       callUser(user.peerId);
     }

   });

  });

  peer.on("call",call=>{

   call.answer(stream);
   receiveCall(call);

  });

  peer.on("error",err=>{
   document.getElementById("status").innerText=
     "Connection error";
   console.log(err);
  });

 }catch(e){

  alert("Microphone permission Allow karo.");
  console.log(e);

 }

}

function callUser(id){

 const call=peer.call(id,stream);

 if(call){
   receiveCall(call);
 }

}

function receiveCall(call){

 call.on("stream",remoteStream=>{

   const audio=document.createElement("audio");

   audio.autoplay=true;
   audio.srcObject=remoteStream;

   document.getElementById("audios").appendChild(audio);

 });

}

function toggleMic(){

 if(!stream)return;

 const track=stream.getAudioTracks()[0];

 track.enabled=!track.enabled;

}

window.addEventListener("beforeunload",()=>{

 if(myId){
   db.ref("voiceRooms/"+roomId+"/"+myId).remove();
 }

});

</script>

</body>
</html>
