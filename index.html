<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PawanVoice</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080912;
 color:white;
}
button{
 border:0;
 cursor:pointer;
}
.page{display:none;min-height:100vh}
.page.active{display:block}

.top{
 height:62px;
 padding:12px 16px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:linear-gradient(135deg,#17132c,#11182c);
 border-bottom:1px solid #292743;
}
.logo{
 font-size:21px;
 font-weight:bold;
}
.coins{
 background:#211c36;
 border:1px solid #51458a;
 border-radius:20px;
 padding:8px 13px;
 color:#ffd86b;
}

.profileHero{
 padding:25px 18px 20px;
 text-align:center;
 background:
 radial-gradient(circle at 50% 0,#5d3fa8 0,#17132c 35%,#080912 75%);
}
.avatarWrap{
 width:108px;
 height:108px;
 margin:auto;
 padding:5px;
 border-radius:50%;
 background:linear-gradient(135deg,#ffd66b,#ff6ec7,#8c6bff);
 box-shadow:0 0 28px #7f55ff;
}
.avatar{
 width:100%;
 height:100%;
 border-radius:50%;
 object-fit:cover;
 background:#242438;
}
.name{
 margin-top:12px;
 font-size:23px;
 font-weight:bold;
}
.uid{
 margin-top:5px;
 color:#bcb8d4;
 font-size:13px;
}
.editBtn{
 margin-top:12px;
 background:#30264d;
 color:white;
 padding:9px 18px;
 border-radius:20px;
}
.levelBox{
 margin:20px auto 0;
 max-width:420px;
 text-align:left;
}
.levelText{
 display:flex;
 justify-content:space-between;
 font-size:13px;
 color:#ddd8ed;
}
.progress{
 height:8px;
 background:#292638;
 border-radius:10px;
 margin-top:7px;
 overflow:hidden;
}
.progress i{
 display:block;
 height:100%;
 width:42%;
 background:linear-gradient(90deg,#ffbc61,#ff5fbc);
 border-radius:10px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 padding:15px 10px;
 background:#11121d;
 border-bottom:1px solid #242535;
}
.stat{
 text-align:center;
 border-right:1px solid #292a3a;
}
.stat:last-child{border:0}
.stat b{display:block;font-size:16px}
.stat span{font-size:11px;color:#9f9caf}

.sectionTitle{
 padding:18px 16px 8px;
 color:#9f96c9;
 font-size:13px;
 text-transform:uppercase;
}

.menu{
 padding:5px 12px 30px;
}
.menuItem{
 display:flex;
 align-items:center;
 width:100%;
 margin:8px 0;
 padding:15px;
 border-radius:15px;
 background:linear-gradient(100deg,#151625,#11121e);
 border:1px solid #27283a;
 color:white;
 text-align:left;
}
.menuItem:active{transform:scale(.98)}
.icon{
 width:42px;
 height:42px;
 border-radius:13px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#25203c;
 font-size:22px;
 margin-right:13px;
}
.menuText{
 flex:1;
}
.menuText b{
 display:block;
 font-size:15px;
}
.menuText span{
 display:block;
 color:#8f8ca0;
 font-size:11px;
 margin-top:4px;
}
.arrow{
 color:#77748a;
 font-size:20px;
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:64px;
 display:flex;
 background:#10111b;
 border-top:1px solid #292a3b;
}
.bottom button{
 flex:1;
 background:none;
 color:#898798;
}
.bottom button.active{
 color:#ff77bd;
}
.bottomIcon{font-size:21px;display:block}
.bottomText{font-size:10px}

.detail{
 padding-bottom:85px;
}
.detailTop{
 height:62px;
 display:flex;
 align-items:center;
 padding:0 15px;
 background:#141523;
 border-bottom:1px solid #28293a;
}
.back{
 background:none;
 color:white;
 font-size:27px;
 width:40px;
}
.detailTop h2{
 margin:0;
 font-size:19px;
}
.detailBody{padding:18px 14px}

.card{
 background:linear-gradient(135deg,#171827,#11121e);
 border:1px solid #292b40;
 border-radius:18px;
 padding:16px;
 margin-bottom:12px;
}
.card h3{margin:0 0 8px}
.small{font-size:12px;color:#9693a6}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.item{
 background:#1a1b2a;
 border:1px solid #2c2d42;
 border-radius:15px;
 padding:15px 10px;
 text-align:center;
}
.itemIcon{
 font-size:34px;
 margin-bottom:8px;
}
.item b{font-size:13px}
.item small{
 display:block;
 color:#9c98aa;
 margin-top:5px;
}
.selectBtn{
 margin-top:10px;
 width:100%;
 padding:9px;
 border-radius:10px;
 background:#31254f;
 color:white;
}
.selectBtn.equipped{
 background:linear-gradient(90deg,#ad4d98,#6247b9);
}

.vip{
 position:relative;
 overflow:hidden;
}
.vip::after{
 content:"VIP";
 position:absolute;
 right:-18px;
 top:9px;
 transform:rotate(35deg);
 color:#ffd66b;
 font-weight:bold;
 opacity:.18;
 font-size:35px;
}
.vip b{color:#ffd66b}
.buyVip{
 width:100%;
 padding:12px;
 border-radius:12px;
 background:linear-gradient(90deg,#ffb23e,#ff5f91);
 color:white;
 font-weight:bold;
 margin-top:10px;
}

input,select,textarea{
 width:100%;
 padding:13px;
 border-radius:12px;
 border:1px solid #34354a;
 background:#0e0f19;
 color:white;
 outline:none;
 margin:7px 0;
}
.save{
 width:100%;
 padding:13px;
 border-radius:12px;
 background:linear-gradient(90deg,#714cff,#d94eaa);
 color:white;
 font-weight:bold;
}

.visitor{
 display:flex;
 align-items:center;
 padding:13px;
 border-bottom:1px solid #282938;
}
.visitorAvatar{
 width:43px;
 height:43px;
 border-radius:50%;
 object-fit:cover;
 margin-right:11px;
 background:#292a3b;
}
.visitorInfo{flex:1}
.visitorInfo b{display:block}
.visitorInfo span{
 color:#8e8b9c;
 font-size:11px;
}

.toast{
 position:fixed;
 left:50%;
 bottom:80px;
 transform:translateX(-50%);
 background:#29243c;
 padding:11px 17px;
 border-radius:20px;
 display:none;
 z-index:999;
}
</style>
</head>

<body>

<!-- PROFILE -->
<div id="profilePage" class="page active">

<div class="top">
 <div class="logo">🎙️ PawanVoice</div>
 <div class="coins">🪙 <span id="coinTop">1000000</span></div>
</div>

<div class="profileHero">

 <div class="avatarWrap">
  <img id="profileDP" class="avatar"
       src="https://i.imgur.com/6VBx3io.png">
 </div>

 <div id="profileName" class="name">Pawan</div>
 <div class="uid">ID: <span id="profileID">Loading...</span></div>

 <button class="editBtn" onclick="openDetail('edit')">
 ✏️ Edit Profile

 <div class="levelBox">
  <div class="levelText">
   <span>⭐ User Level 1</span>
   <span>42 / 100 EXP</span>
  </div>
  <div class="progress"><i></i></div>

</div>

<div class="stats">
 <div class="stat">
  <b>0</b>
  <span>Following</span>

 <div class="stat">
  <b>0</b>
  <span>Followers</span>

 <div class="stat">
  <b id="visitorCount">0</b>
  <span>Visitors</span>
 </div>

  <b>⭐ 1</b>

<div class="sectionTitle">My Collection & Features</div>

<div class="menu">

<button class="menuItem" onclick="openDetail('bag')">

  <b>Bag</b>
  <span>आपके सभी items</span>

</button>

<button class="menuItem" onclick="openDetail('dress')">
 <div class="icon">👗</div>

  <b>Dress</b>
  <span>Dress select और equip करें</span>
 </div>
 <div class="arrow">›</div>
</button>

<button class="menuItem" onclick="openDetail('frame')">
 <div class="icon">🖼️</div>
 <div class="menuText">
  <b>Avatar Frame</b>
  <span>Profile frame लगाएं</span>
 </div>
 <div class="arrow">›</div>
</button>

<button class="menuItem" onclick="openDetail('entry')">
 <div class="icon">🚪</div>
 <div class="menuText">
  <b>Entry Effect</b>
  <span>Room entry effect</span>
 </div>
 <div class="arrow">›</div>
</button>

<button class="menuItem" onclick="openDetail('vip')">
 <div class="icon">👑</div>
 <div class="menuText">
  <b>VIP</b>

 <div class="arrow">›</div>
</button>

<button class="menuItem" onclick="openDetail('badge')">
 <div class="icon">🏅</div>

 </div>

</button>

<button class="menuItem" onclick="openDetail('vehicle')">

  <b>Vehicle</b>

</button>

<button class="menuItem" onclick="openDetail('gift')">
 <div class="icon">🎁</div>

  <b>Gifts</b>
  <span>Gifts और received gifts</span>
 </div>

</button>

<button class="menuItem" onclick="openDetail('visitors')">
 <div class="icon">👀</div>

<button class="menuItem" onclick="openDetail('level')">
 <div class="icon">⭐</div>

  <b>User Level Rewards</b>
  <span>Level rewards claim करें</span>
 </div>

</button>

<button class="menuItem" onclick="openDetail('cp')">
 <div class="icon">💎</div>
 <div class="menuText">
  <b>CP Level</b>
  <span>CP rewards अलग से claim करें</span>
 </div>

</button>

<button class="menuItem" onclick="openDetail('invite')">
 <div class="icon">👥</div>
 <div class="menuText">
  <b>Invite Friend</b>
  <span>Friends को invite करें</span>
 </div>

</button>

<button class="menuItem" onclick="openDetail('language')">

  <b>Language</b>

<button class="menuItem" onclick="openDetail('service')">

</button>

<button class="menuItem" onclick="openDetail('settings')">
 <div class="icon">⚙️</div>
 <div class="menuText">
  <b>Settings</b>

 </div>
 <div class="arrow">›</div>
</button>

</div>

<div class="bottom">
 <button onclick="showHome()">
  <span class="bottomIcon">🏠</span>
  <span class="bottomText">Home</span>
 </button>
 <button onclick="showRooms()">
  <span class="bottomIcon">🎙️</span>
  <span class="bottomText">Rooms</span>
 </button>
 <button class="active">
  <span class="bottomIcon">👤</span>
  <span class="bottomText">Profile</span>
 </button>
</div>

</div>


<!-- DETAIL -->
<div id="detailPage" class="page detail">

<div class="detailTop">
 <button class="back" onclick="backProfile()">‹</button>
 <h2 id="detailTitle">Profile</h2>
</div>

<div id="detailBody" class="detailBody"></div>

</div>

<div id="toast" class="toast"></div>


<script>
/* ================= FIREBASE ================= */

const firebaseConfig={
 apiKey:"AIzaSyDnlTde5qG5aPHrUIV6kTYnM521GtbrrE",
 authDomain:"pawanvoice-68c5e.firebaseapp.com",
 databaseURL:"https://pawanvoice-68c5e-default-rtdb.firebaseio.com/",
 projectId:"pawanvoice-68c5e",
 storageBucket:"pawanvoice-68c5e.firebasestorage.app",
 messagingSenderId:"148446327241",
 appId:"1:148446327241:web:6bac9cb9ad0fb530cbb818"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();


/* ================= USER ================= */

let myId=localStorage.getItem("pawanUserId");

if(!myId){
 myId="PW"+Date.now().toString().slice(-8);
 localStorage.setItem("pawanUserId",myId);
}

let myName=localStorage.getItem("pawanName") || "Pawan";
let myCoins=parseInt(localStorage.getItem("pawanCoins") || "1000000");

document.getElementById("profileID").innerText=myId;
document.getElementById("profileName").innerText=myName;
document.getElementById("coinTop").innerText=myCoins.toLocaleString();


/* ================= DEFAULT ITEMS ================= */

const defaultItems={
 frames:[
  {id:"welcomeFrame",name:"Welcome Frame",icon:"🖼️"},
  {id:"goldFrame",name:"Golden Frame",icon:"🌟"},
  {id:"diamondFrame",name:"Diamond Frame",icon:"💎"},
  {id:"loveFrame",name:"Love Frame",icon:"💖"}
 ],
 entries:[
  {id:"welcomeEntry",name:"Welcome Entry",icon:"✨"},
  {id:"fireEntry",name:"Fire Entry",icon:"🔥"},
  {id:"starEntry",name:"Star Entry",icon:"🌟"},
  {id:"royalEntry",name:"Royal Entry",icon:"👑"}
 ],
 dresses:[
  {id:"classic",name:"Classic",icon:"👕"},
  {id:"royal",name:"Royal Dress",icon:"🤵"},
  {id:"party",name:"Party Dress",icon:"🥻"},
  {id:"gold",name:"Golden Dress",icon:"👑"}
 ],
 badges:[
  {id:"new",name:"New User",icon:"🆕"},
  {id:"star",name:"Star",icon:"⭐"},
  {id:"vip",name:"VIP Badge",icon:"🏆"}
 ],
 vehicles:[
  {id:"car",name:"Sport Car",icon:"🏎️"},
  {id:"bike",name:"Super Bike",icon:"🏍️"},
  {id:"royalcar",name:"Royal Car",icon:"🚘"}
 ],
 gifts:[
  {id:"rose",name:"Rose",icon:"🌹"},
  {id:"heart",name:"Heart",icon:"❤️"},
  {id:"diamond",name:"Diamond",icon:"💎"},
  {id:"crown",name:"Crown",icon:"👑"}
 ]
};


/* ================= SAVE PROFILE ================= */

function saveProfile(){
 const name=document.getElementById("editName").value.trim();

 if(!name){
  showToast("नाम डालें");
  return;
 }

 myName=name;
 localStorage.setItem("pawanName",name);

 db.ref("users/"+myId).update({
  id:myId,
  name:name,
  updatedAt:Date.now()
 });

 document.getElementById("profileName").innerText=name;
 showToast("Profile save हो गई ✅");
}


/* ================= DP ================= */

function changeDP(input){

 if(!input.files || !input.files[0])return;

 const reader=new FileReader();

 reader.onload=function(e){

  const img=e.target.result;

  /*
   Phone-only demo:
   image localStorage में save.
   Firebase Storage लगाने पर इसे permanent online DP बनाया जा सकता है.
  */

  localStorage.setItem("pawanDP",img);
  document.getElementById("profileDP").src=img;

  showToast("DP change हो गई ✅");
 };

 reader.readAsDataURL(input.files[0]);
}

const savedDP=localStorage.getItem("pawanDP");
if(savedDP){
 document.getElementById("profileDP").src=savedDP;
}


/* ================= NEW USER REWARD ================= */

async function giveWelcomeReward(){

 const ref=db.ref("users/"+myId+"/welcomeReward");

 const snap=await ref.once("value");

 if(snap.exists() && snap.val()===true){
  return;
 }

 myCoins=1000000;
 localStorage.setItem("pawanCoins",myCoins);

 await db.ref("users/"+myId).update({
  id:myId,
  name:myName,
  coins:myCoins
 });

 await ref.set(true);

 showToast("🎁 Welcome Reward: 10,00,000 Coins + Frame + Entry Effect");
}

giveWelcomeReward();


/* ================= DETAIL ================= */

function openDetail(type){

 document.getElementById("profilePage").classList.remove("active");
 document.getElementById("detailPage").classList.add("active");

 const title={
  edit:"Edit Profile",
  bag:"Bag",
  dress:"Dress",
  frame:"Avatar Frame",
  entry:"Entry Effect",
  vip:"VIP",
  badge:"Badge",
  vehicle:"Vehicle",
  gift:"Gifts",
  visitors:"ID Visitors",
  level:"User Level Rewards",
  cp:"CP Level",
  invite:"Invite Friend",
  language:"Language",
  service:"Customer Service",
  help:"Help & Feedback",
  settings:"Settings"
 };

 document.getElementById("detailTitle").innerText=title[type] || "Profile";

 const body=document.getElementById("detailBody");

 if(type==="edit") editPage(body);
 if(type==="bag") bagPage(body);
 if(type==="dress") collectionPage(body,"Dress","dresses");
 if(type==="frame") collectionPage(body,"Avatar Frame","frames");
 if(type==="entry") collectionPage(body,"Entry Effect","entries");
 if(type==="vip") vipPage(body);
 if(type==="badge") collectionPage(body,"Badge","badges");
 if(type==="vehicle") collectionPage(body,"Vehicle","vehicles");
 if(type==="gift") collectionPage(body,"Gifts","gifts");
 if(type==="visitors") visitorsPage(body);
 if(type==="level") levelPage(body,false);
 if(type==="cp") levelPage(body,true);
 if(type==="invite") invitePage(body);
 if(type==="language") languagePage(body);
 if(type==="service") servicePage(body);
 if(type==="help") helpPage(body);
 if(type==="settings") settingsPage(body);
}


/* ================= EDIT PAGE ================= */

function editPage(body){

 body.innerHTML=`

 <div class="card">
  <h3>👤 Profile Information</h3>
  <div class="small">नाम और profile photo बदलें</div>

  <input id="editName" value="${escapeHtml(myName)}">

  <label class="small">Profile Photo</label>
  <input type="file" accept="image/*" onchange="changeDP(this)">

  <button class="save" onclick="saveProfile()">💾 Save Profile</button>
 </div>

 <div class="card">
  <b>🆔 User ID</b>
  <p>${myId}</p>
  <div class="small">User ID automatically generated है।</div>
 </div>
 `;
}


/* ================= BAG ================= */

function bagPage(body){

 body.innerHTML=`

 <div class="card">
  <h3>🎒 My Bag</h3>
  <div class="small">आपके सभी collected items यहां दिखाई देंगे।</div>
 </div>

 <div class="grid">

  <div class="item">
   <div class="itemIcon">🖼️</div>
   <b>Frames</b>
   <small>4 Items</small>
  </div>

  <div class="item">
   <div class="itemIcon">🚪</div>
   <b>Entry Effects</b>
   <small>4 Items</small>
  </div>

  <div class="item">
   <div class="itemIcon">👗</div>
   <b>Dresses</b>
   <small>4 Items</small>
  </div>

  <div class="item">
   <div class="itemIcon">🎁</div>
   <b>Gifts</b>
   <small>4 Items</small>
  </div>

 </div>
 `;
}


/* ================= COLLECTION ================= */

function collectionPage(body,title,key){

 const items=defaultItems[key] || [];

 let html=`
 <div class="card">
  <h3>✨ ${title}</h3>
  <div class="small">Item पर click करके equip करें।</div>
 </div>
 <div class="grid">
 `;

 items.forEach(item=>{

  const storageKey="pawanEquipped_"+key;
  const equipped=localStorage.getItem(storageKey)===item.id;

  html+=`
  <div class="item">
   <div class="itemIcon">${item.icon}</div>
   <b>${item.name}</b>
   <button
    class="selectBtn ${equipped?"equipped":""}"
    onclick="equipItem('${key}','${item.id}','${item.name}')">
    ${equipped?"✓ Equipped":"Equip"}
   </button>
  </div>
  `;
 });

 html+="</div>";

 body.innerHTML=html;
}


function equipItem(key,id,name){

 localStorage.setItem("pawanEquipped_"+key,id);

 showToast("✅ "+name+" equipped");

 if(key==="frames"){
  applyFrame(id);
 }

 if(key==="entries"){
  showToast("✨ "+name+" selected");
 }

 setTimeout(()=>openDetail(
  key==="frames"?"frame":
  key==="entries"?"entry":
  key==="dresses"?"dress":
  key==="badges"?"badge":
  key==="vehicles"?"vehicle":
  "gift"
 ),300);
}


/* ================= FRAME ================= */

function applyFrame(id){

 const avatarWrap=document.querySelector(".avatarWrap");

 if(id==="goldFrame"){
  avatarWrap.style.background="linear-gradient(135deg,#ffe082,#ff9d00,#fff2a0)";
  avatarWrap.style.boxShadow="0 0 30px #ffd45a";
 }

 else if(id==="diamondFrame"){
  avatarWrap.style.background="linear-gradient(135deg,#65e8ff,#5b7cff,#c9f8ff)";
  avatarWrap.style.boxShadow="0 0 30px #58dfff";
 }

 else if(id==="loveFrame"){
  avatarWrap.style.background="linear-gradient(135deg,#ff5e9c,#ff3b6f,#ff9ac0)";
  avatarWrap.style.boxShadow="0 0 30px #ff4c91";
 }

 else{
  avatarWrap.style.background="linear-gradient(135deg,#ffd66b,#ff6ec7,#8c6bff)";

/* ================= VIP 1-10 ================= */

function vipPage(body){

 let html=`
 <div class="card vip">
  <h3>👑 PawanVoice VIP</h3>
  <div class="small">
   VIP 1 से VIP 10 तक अलग-अलग levels.
   Coins से VIP activate किया जा सकता है।
  </div>
 </div>

 <div class="grid">
 `;

 for(let i=1;i<=10;i++){

  let price=i===1?1500000:i*1500000;

  html+=`
  <div class="item vip">
   <div class="itemIcon">👑</div>
   <b>VIP ${i}</b>
   <small>🪙 ${price.toLocaleString()} Coins</small>
   <button class="buyVip" onclick="buyVIP(${i},${price})">
    ${getVip()===i?"✓ Active":"Activate"}
   </button>
  </div>
  `;
 }

 html+="</div>";

 body.innerHTML=html;
}


function getVip(){
 return parseInt(localStorage.getItem("pawanVIP") || "0");
}


function buyVIP(level,price){

 const current=getVip();

 if(current>=level){
  showToast("VIP "+level+" already active");
  return;
 }

 if(myCoins<price){
  showToast("❌ Coins कम हैं");
  return;
 }

 myCoins-=price;

 localStorage.setItem("pawanCoins",myCoins);
 localStorage.setItem("pawanVIP",level);

 document.getElementById("coinTop").innerText=myCoins.toLocaleString();

 db.ref("users/"+myId).update({
  coins:myCoins,
  vip:level
 });

 showToast("👑 VIP "+level+" Active!");

 setTimeout(()=>openDetail("vip"),400);
}

 snap.forEach(child=>{

 list.reverse();

 if(list.length===0){
  box.innerHTML=`
   <div style="text-align:center;padding:25px;color:#8e8b9c">

 `).join("");
}

function backProfile(){

function showToast(message){

 const t=document.getElementById("toast");

 t.innerText=message;
 t.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  t.style.display="none";
 },2200);
}


function copyText(text){

 navigator.clipboard.writeText(text)
 .then(()=>showToast("Copied ✅"))
 .catch(()=>showToast("Copy नहीं हुआ"));
}


function formatTime(time){

 if(!time)return "";

 const d=new Date(time);

 return d.toLocaleDateString("hi-IN")+" "+
        d.toLocaleTimeString("hi-IN",{
         hour:"2-digit",
         minute:"2-digit"
        });
}


function escapeHtml(str){

 return String(str)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}
