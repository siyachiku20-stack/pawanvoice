<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PawanVoice</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#090b12;
  color:#fff;
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:50;
  height:70px;
  padding:10px 14px;
  background:#10131d;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #242838;
}

.profile-mini{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.profile-mini img{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ffcc55;
  background:#222;
}

.profile-mini-info{
  min-width:0;
}

.profile-mini-info .name{
  font-weight:bold;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-mini-info .uid{
  color:#9da3b8;
  font-size:11px;
  margin-top:3px;
}

.wallet{
  display:flex;
  gap:7px;
}

.wallet-box{
  background:#191d29;
  border:1px solid #2c3142;
  border-radius:18px;
  padding:7px 10px;
  font-size:12px;
  white-space:nowrap;
}

.coin{
  color:#ffd54a;
}

.diamond{
  color:#6edcff;
}

/* ================= MAIN ================= */

.main{
  padding:12px 12px 90px;
  max-width:700px;
  margin:auto;
}

.search{
  display:flex;
  align-items:center;
  background:#171a25;
  border:1px solid #292e3e;
  border-radius:24px;
  padding:0 14px;
  height:44px;
  margin-bottom:12px;
}

.search span{
  color:#8e95a9;
  margin-right:8px;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
}

.search input::placeholder{
  color:#777d91;
}

/* ================= BANNERS ================= */

.banner-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-bottom:14px;
}

.banner-scroll::-webkit-scrollbar{
  display:none;
}

.banner{
  flex:0 0 220px;
  height:92px;
  border-radius:16px;
  padding:14px;
  position:relative;
  overflow:hidden;
  border:1px solid #34394c;
}

.banner.family{
  background:linear-gradient(135deg,#4b207b,#b23a91);
}

.banner.cp{
  background:linear-gradient(135deg,#183f78,#237cc7);
}

.banner.rich{
  background:linear-gradient(135deg,#735019,#c88b26);
}

.banner-title{
  font-size:17px;
  font-weight:bold;
}

.banner-sub{
  font-size:11px;
  color:#eee;
  margin-top:7px;
}

/* ================= QUICK ACCESS ================= */

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:15px;
}

.quick-btn{
  background:#151924;
  border:1px solid #292e3e;
  border-radius:14px;
  padding:12px 4px;
  color:#fff;
  text-align:center;
}

.quick-btn .icon{
  font-size:23px;
  margin-bottom:5px;
}

.quick-btn span:last-child{
  font-size:11px;
  color:#c9ccda;
}

/* ================= SECTION ================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:14px 2px 10px;
}

.section-title h2{
  font-size:17px;
}

.section-title button{
  background:none;
  color:#aeb5ca;
  font-size:12px;
}

/* ================= ROOM TABS ================= */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.tab{
  padding:8px 18px;
  background:#171b27;
  border:1px solid #2a3040;
  color:#9fa6ba;
  border-radius:18px;
  font-size:13px;
}

.tab.active{
  color:#fff;
  background:#6846e8;
  border-color:#7655f2;
}

/* ================= ROOMS ================= */

.room-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.room-card{
  background:#151923;
  border:1px solid #292e3d;
  border-radius:16px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:11px;
}

.room-dp{
  width:58px;
  height:58px;
  border-radius:14px;
  object-fit:cover;
  background:#252a38;
  flex:none;
}

.room-info{
  flex:1;
  min-width:0;
}

.room-name{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-owner{
  font-size:11px;
  color:#969daf;
  margin-top:5px;
}

.room-meta{
  display:flex;
  gap:8px;
  margin-top:6px;
  flex-wrap:wrap;
}

.badge{
  background:#202534;
  color:#c4c9d8;
  border-radius:10px;
  padding:3px 7px;
  font-size:10px;
}

.live{
  color:#63f19b;
}

.enter-btn{
  background:#6846e8;
  color:white;
  border-radius:18px;
  padding:9px 13px;
  font-size:12px;
}

/* ================= CREATE ROOM ================= */

.create-box{
  background:#151923;
  border:1px solid #292e3d;
  border-radius:16px;
  padding:14px;
  margin-top:14px;
}

.input{
  width:100%;
  height:44px;
  border-radius:11px;
  border:1px solid #303647;
  background:#0e1119;
  color:#fff;
  padding:0 12px;
  outline:none;
  margin-bottom:10px;
}

.select{
  width:100%;
  height:44px;
  border-radius:11px;
  border:1px solid #303647;
  background:#0e1119;
  color:#fff;
  padding:0 12px;
  outline:none;
  margin-bottom:10px;
}

.primary{
  width:100%;
  height:45px;
  border-radius:12px;
  background:#6846e8;
  color:white;
  font-weight:bold;
}

.secondary{
  width:100%;
  height:43px;
  border-radius:12px;
  background:#202534;
  color:white;
}

/* ================= PROFILE MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal-card{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow:auto;
  background:#11141e;
  border-radius:22px 22px 0 0;
  padding:18px 15px 25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#252a38;
  color:white;
}

.profile-big{
  text-align:center;
  margin-bottom:18px;
}

.profile-big img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ffcc55;
}

.profile-big h2{
  margin-top:8px;
  font-size:19px;
}

.profile-big p{
  color:#9299aa;
  font-size:12px;
  margin-top:4px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.stat{
  background:#1a1e2a;
  border-radius:12px;
  padding:12px 4px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:16px;
}

.stat span{
  color:#8f96a8;
  font-size:10px;
  margin-top:4px;
  display:block;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.menu-item{
  background:#191d28;
  border:1px solid #292e3d;
  border-radius:12px;
  padding:13px 5px;
  text-align:center;
  color:#dce0ec;
  font-size:11px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  z-index:60;
  left:0;
  right:0;
  bottom:0;
  height:66px;
  background:#10131d;
  border-top:1px solid #282d3c;
  display:flex;
  justify-content:center;
}

.bottom-inner{
  width:100%;
  max-width:700px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
}

.nav-btn{
  background:none;
  color:#858ca0;
  text-align:center;
  padding-top:8px;
}

.nav-btn .nav-icon{
  font-size:21px;
}

.nav-btn div:last-child{
  font-size:10px;
  margin-top:3px;
}

.nav-btn.active{
  color:#8e6bff;
}

/* ================= EMPTY ================= */

.empty{
  padding:35px 10px;
  text-align:center;
  color:#777e91;
  font-size:13px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#272c3a;
  color:white;
  padding:10px 15px;
  border-radius:20px;
  font-size:12px;
  display:none;
  max-width:85%;
  text-align:center;
}

.toast.show{
  display:block;
}

/* ================= RESPONSIVE ================= */

@media(max-width:360px){
  .quick{
    grid-template-columns:repeat(2,1fr);
  }

  .wallet-box{
    padding:6px 7px;
    font-size:10px;
  }

  .profile-mini-info{
    max-width:90px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="profile-mini" onclick="openProfile()">

    <img id="headerDP"
         src="https://i.pravatar.cc/150?img=12"
         alt="DP">

    <div class="profile-mini-info">
      <div class="name" id="headerName">Pawan</div>
      <div class="uid">ID: <span id="headerUID">100052</span></div>
    </div>

  </div>

  <div class="wallet">
    <div class="wallet-box coin">

<!-- ================= MAIN ================= -->

<main class="main">

  </div>


  <!-- BANNERS -->

  <div class="banner-scroll">

    <div class="banner family">
      <div class="banner-title">👨‍👩‍👧 Family</div>
      <div class="banner-sub">
        Join family and enjoy special rewards
      </div>
    </div>

    <div class="banner cp">
      <div class="banner-title">💞 CP Ranking</div>
      <div class="banner-sub">
        Check top CP couples
      </div>
    </div>

    <div class="banner rich">
      <div class="banner-title">👑 Rich King</div>
      <div class="banner-sub">
        Top wealth ranking

    </div>

  </div>


  <!-- QUICK ACCESS -->

  <div class="quick">

    <button class="quick-btn" onclick="openProfile()">
      <div class="icon">👤</div>

    </button>

    <button class="quick-btn" onclick="openInbox()">

    </button>

    </button>

</main>

    <div class="profile-stats">

      <div class="stat">

<!-- ================= TOAST ================= -->

      class="nav-btn active"

      onclick="openInbox()">

      onclick="openProfile()">

      <div class="nav-icon">👤</div>
      <div>Profile</div>

    </button>

<script>
/* =========================================================
   PAWANVOICE CONFIG
========================================================= */

const FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const RENDER_SERVER =
  "https://pawanvoice-1.onrender.com";


/* =========================================================
   USER
========================================================= */

const DEFAULT_DP =
  "https://i.pravatar.cc/150?img=12";

let currentUser = {
  userId: "100052",
  name: "Pawan",
  gender: "Male",
  dp: DEFAULT_DP,
  level: 1,
  exp: 0,
  coins: 0,
  diamonds: 0,
  followers: 0,
  following: 0,
  visitors: 0,
  vip: 0
};


let rooms = [];

let activeRoomTab = "popular";


/* =========================================================
   LOCAL USER LOAD
========================================================= */

function loadLocalUser(){

  try{

    const saved =
      localStorage.getItem("pawanvoice_user");

    if(saved){

      const data =
        JSON.parse(saved);

      currentUser = {
        ...currentUser,
        ...data
      };

    }

  }catch(e){

    console.log(
      "Local user load error",
      e
    );

  }


  /*
   * IMPORTANT:
   * Old random PV IDs are no longer used.
   * User IDs start from 100052.
   */

  if(
    !currentUser.userId ||
    String(currentUser.userId)
      .startsWith("PV")
  ){

    currentUser.userId =
      "100052";

  }

  saveLocalUser();

}


/* =========================================================
   SAVE LOCAL USER
========================================================= */

function saveLocalUser(){

  try{

    localStorage.setItem(
      "pawanvoice_user",
      JSON.stringify(currentUser)
    );

  }catch(e){

    console.log(
      "Local user save error",
      e
    );

  }

}


/* =========================================================
   USER ID
========================================================= */

function getUserId(){

  return String(
    currentUser.userId || "100052"
  );

}


/* =========================================================
   FIREBASE HELPERS
========================================================= */

async function firebaseGet(path){

  try{

    const response =
      await fetch(
        FIREBASE_DB +
        path +
        ".json"
      );

    if(!response.ok){
      return null;
    }

    return await response.json();

  }catch(e){

    console.log(
      "Firebase GET error",
      e
    );

    return null;

  }

}


async function firebasePut(path,data){

  try{

    const response =
      await fetch(
        FIREBASE_DB +
        path +
        ".json",
        {
          method:"PUT",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify(data)
        }
      );

    return response.ok;

  }catch(e){

    console.log(
      "Firebase PUT error",
      e
    );

    return false;

  }

}


async function firebasePatch(path,data){

  try{

    const response =
      await fetch(
        FIREBASE_DB +
        path +
        ".json",
        {
          method:"PATCH",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify(data)
        }
      );

    return response.ok;

  }catch(e){

    console.log(
      "Firebase PATCH error",
      e
    );

    return false;

  }

}


/* =========================================================
   SYNC USER TO FIREBASE
========================================================= */

async function syncUser(){

  const id =
    getUserId();

  const userData = {

    userId:id,

    name:currentUser.name,

    gender:currentUser.gender,

    dp:currentUser.dp,

    level:Number(
      currentUser.level || 1
    ),

    exp:Number(
      currentUser.exp || 0
    ),

    coins:Number(
      currentUser.coins || 0
    ),

    diamonds:Number(
      currentUser.diamonds || 0
    ),

    followers:Number(
      currentUser.followers || 0
    ),

    following:Number(
      currentUser.following || 0
    ),

    visitors:Number(
      currentUser.visitors || 0
    ),

    vip:Number(
      currentUser.vip || 0
    ),

    updatedAt:
      Date.now()

  };


  await firebasePut(
    "/users/" + encodeURIComponent(id),
    userData
  );

}


/* =========================================================
   LOAD USER FROM FIREBASE
========================================================= */

async function loadUser(){

  const id =
    getUserId();

  const remote =
    await firebaseGet(
      "/users/" +
      encodeURIComponent(id)
    );


  if(remote){

    currentUser = {
      ...currentUser,
      ...remote,
      userId:id
    };

    saveLocalUser();

  }


  renderUser();

}


/* =========================================================
   RENDER USER
========================================================= */

function renderUser(){

  const name =
    currentUser.name ||
    "Pawan";

  const dp =
    currentUser.dp ||
    DEFAULT_DP;

  const uid =
    getUserId();


  document.getElementById(
    "headerName"
  ).textContent = name;

  document.getElementById(
    "headerUID"
  ).textContent = uid;

  document.getElementById(
    "headerDP"
  ).src = dp;


  document.getElementById(
    "coinValue"
  ).textContent =
    Number(
      currentUser.coins || 0
    ).toLocaleString();


  document.getElementById(
    "diamondValue"
  ).textContent =
    Number(

/* =========================================================
   SYNC OWNER ROOM
========================================================= */

async function syncOwnerRoom(){

  const id =
    getUserId();


  const roomPath =
    "/rooms/" +
    encodeURIComponent(id);


  const room =
    await firebaseGet(
      roomPath
    );


  if(room){

    room.ownerId =
      id;

    room.ownerName =
      currentUser.name;

    room.ownerDp =
      currentUser.dp;

    room.name =
      currentUser.name;

    room.dp =
      currentUser.dp;

    room.updatedAt =
      Date.now();


    await firebasePut(
      roomPath,
      room
    );

  }


  /*
   * Tell Render server too.
   */

  try{

    await fetch(
      RENDER_SERVER +
      "/api/rooms/" +
      encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({

          ownerId:id,

          ownerName:
            currentUser.name,

          ownerDp:
            currentUser.dp,

          name:
            currentUser.name,

          dp:
            currentUser.dp

        })
      }
    );

  }catch(e){

    console.log(
      "Render owner sync skipped",
      e
    );

  }

}


/* =========================================================
   ROOM DATA NORMALIZER
========================================================= */

function normalizeRoom(room){

  if(!room){
    return null;
  }


  const id =
    String(
      room.id ||
      room.roomId ||
      room.ownerId ||
      ""
    );


  if(!id){
    return null;
  }


  const ownerId =
    String(
      room.ownerId ||
      room.userId ||
      id
    );


  const ownerName =
    room.ownerName ||
    room.name ||
    "Guest";


  const ownerDp =
    room.ownerDp ||
    room.dp ||
    DEFAULT_DP;


  return {

    ...room,

    id:id,

    roomId:id,

    ownerId:ownerId,

    ownerName:ownerName,

    ownerDp:ownerDp,

    name:
      room.name ||
      ownerName,

    dp:
      room.dp ||
      ownerDp,

    category:
      room.category ||
      "General",

    seats:
      Number(
        room.seatCount ||
        room.seatsCount ||
        9
      ),

    users:
      room.users ||
      {},

    createdAt:
      Number(
        room.createdAt ||
        Date.now()
      ),

    updatedAt:
      Number(
        room.updatedAt ||
        room.createdAt ||
        Date.now()
      )

  };

}


/* =========================================================
   FIREBASE ROOMS
========================================================= */

async function loadFirebaseRooms(){

  const data =
    await firebaseGet(
      "/rooms"
    );


  const list = [];


  if(
    data &&
    typeof data === "object"
  ){

    Object.keys(data)
      .forEach(key => {

        const room =
          normalizeRoom({
            ...data[key],
            id:
              data[key]?.id ||
              key
          });


        if(room){

          list.push(room);

        }

      });

  }


  return list;

}


/* =========================================================
   RENDER ROOMS
========================================================= */

async function loadRenderRooms(){

  try{

    const response =
      await fetch(
        RENDER_SERVER +
        "/api/rooms",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      return [];

    }


    const data =
      await response.json();


    let raw =
      Array.isArray(data)
        ? data
        : (
            data.rooms ||
            data.data ||
            []
          );


    return raw
      .map(normalizeRoom)
      .filter(Boolean);


  }catch(e){

    console.log(
      "Render rooms unavailable",
      e
    );

    return [];

  }

}


/* =========================================================
   MERGE ALL ROOMS
========================================================= */

function mergeRooms(
  firebaseRooms,
  renderRooms
){

  const map =
    new Map();


  /*
   * Firebase first
   */

  firebaseRooms.forEach(room => {

    map.set(
      String(room.id),
      room
    );

  });


  /*
   * Render live room data
   * overrides Firebase.
   */

  renderRooms.forEach(room => {

    const key =
      String(room.id);


    if(map.has(key)){

      const old =
        map.get(key);


      map.set(
        key,
        {
          ...old,
          ...room,

          /*
           * Owner profile must remain
           * available.
           */

          ownerId:
            room.ownerId ||
            old.ownerId,

          ownerName:
            room.ownerName ||
            old.ownerName,

          ownerDp:
            room.ownerDp ||
            old.ownerDp

        }
      );

    }else{

      map.set(
        key,
        room
      );

    }

  });


  return Array.from(
    map.values()
  );

}


/* =========================================================
   LOAD ROOMS
========================================================= */

async function loadRooms(showToastMessage=false){

  const old =
    document.getElementById(
      "roomList"
    );


  if(!rooms.length){

    old.innerHTML =
      '<div class="empty">Loading rooms...</div>';

  }


  const [
    firebaseRooms,
    renderRooms
  ] =
    await Promise.all([
      loadFirebaseRooms(),
      loadRenderRooms()
    ]);


  rooms =
    mergeRooms(
      firebaseRooms,
      renderRooms
    );


  renderRoomsList();


  if(showToastMessage){

    showToast(
      "Rooms refreshed"
    );

  }

}


/* =========================================================
   ROOM MEMBER COUNT
========================================================= */

function getRoomMemberCount(room){

  if(
    typeof room.memberCount ===
    "number"
  ){

    return room.memberCount;

  }


  if(
    typeof room.count ===
    "number"
  ){

    return room.count;

  }


  if(
    room.users &&
    typeof room.users ===
    "object"
  ){

    return Object.keys(
      room.users
    ).length;

  }


  if(
    Array.isArray(room.seats)
  ){

    return room.seats.filter(
      Boolean
    ).length;

  }


  return 0;

}

/* =========================================================
   RENDER ROOM LIST
========================================================= */

function renderRoomsList(){

  const list =
    document.getElementById(
      "roomList"
    );


  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  let result =
    rooms.slice();


  /*
   * Search
   */

  if(search){

    result =
      result.filter(room => {

        const text =
          (
            room.name +
            " " +
            room.ownerName +
            " " +
            room.ownerId +
            " " +
            room.id
          )
          .toLowerCase();


        return text.includes(
          search
        );

      });

  }


  /*
   * Tabs
   */

  if(
    activeRoomTab ===
    "new"
  ){

    result.sort(
      (a,b) =>
        Number(b.createdAt || 0) -
        Number(a.createdAt || 0)
    );

  }else if(
    activeRoomTab ===
    "popular"
  ){

    result.sort(
      (a,b) =>
        getRoomMemberCount(b) -
        getRoomMemberCount(a)
    );

  }else{

    result.sort(
      (a,b) =>
        Number(b.updatedAt || 0) -
        Number(a.updatedAt || 0)
    );

  }


  if(!result.length){

    list.innerHTML =
      `
      <div class="empty">
        No rooms found.<br><br>
        Create your first PawanVoice room.
      </div>
      `;

    return;

  }


  list.innerHTML =
    result
      .map(roomCardHTML)
      .join("");

}


/* =========================================================

function roomCardHTML(room){

  const count =

  const id =

      )
    );


  const name =
    escapeHTML(
      String(
        room.name ||
        room.ownerName ||
        "Voice Room"
      )
    );


  const ownerName =
    escapeHTML(
      String(
        room.ownerName ||
        "Guest"
      )
    );


  const ownerId =
    escapeHTML(
      String(
        room.ownerId ||
        room.id
      )
    );


  const dp =
    escapeAttribute(
      room.dp ||
      room.ownerDp ||
      DEFAULT_DP
    );


  const category =
    escapeHTML(
      String(
        room.category ||
        "General"
      )
    );


  return `
    <div class="room-card">

      <img
        class="room-dp"
        src="${dp}"
        alt="room"
        onerror="this.src='${DEFAULT_DP}'">

      <div class="room-info">

        <div class="room-name">
          ${name}
        </div>

        <div class="room-owner">
          👤 ${ownerName}

        </div>

        <div class="room-meta">

          <span class="badge">
            ${category}
          </span>

          <span class="badge live">
            🟢 ${count}/9
          </span>

          <span class="badge">
            Room ${id}
          </span>

        </div>

      </div>

      <button
        class="enter-btn"
        onclick="enterRoom('${escapeJS(id)}')">

  `;

}

/* =========================================================

async function createRoom(){

  const roomName =
    document.getElementById(
      "roomNameInput"
    ).value.trim();


  const category =
    document.getElementById(
      "roomCategory"
    ).value;


  if(!roomName){

    showToast(
      "Please enter room name"
    );

    return;

  }


  const ownerId =
    getUserId();


  /*
   * IMPORTANT:
   *
   * Room ID = User ID
   *
   * Example:
   * User ID 100052
   * Room ID 100052
   */

  const roomId =
    ownerId;


  const roomData = {

    id:roomId,

    roomId:roomId,

    name:roomName,

    dp:
      currentUser.dp ||
      DEFAULT_DP,

    ownerId:ownerId,

    ownerName:
      currentUser.name,

    ownerDp:
      currentUser.dp ||
      DEFAULT_DP,

    gender:
      currentUser.gender ||
      "Male",

    category:
      category,

    seatCount:9,

    memberCount:0,

    seats:Array(9).fill(null),

    users:{},

    gifts:[],

    chat:[],

    exp:0,

    createdAt:
      Date.now(),

    updatedAt:
      Date.now()

  };


  /*
   * Firebase room.
   */

  const firebaseOK =
    await firebasePut(
      "/rooms/" +
      encodeURIComponent(roomId),
      roomData
    );


  /*
   * Tell Render server.
   *
   * If endpoint is available,
   * server creates/updates room.
   */

  try{

    await fetch(
      RENDER_SERVER +
      "/api/rooms",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify(
          roomData
        )
      }
    );

  }catch(e){

    console.log(
      "Render room create skipped",
      e
    );

  }


  if(firebaseOK){

    showToast(
      "Room created. Opening room..."
    );

  }else{

    showToast(
      "Opening room..."
    );

  }


  /*
   * Owner's room opens with
   * owner's User ID.
   */

  setTimeout(() => {

    window.location.href =
      "room.html?room=" +
      encodeURIComponent(
        roomId
      );

  },500);

}

/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


function escapeJS(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n","\\n")
    .replaceAll("\r","\\r");

}
