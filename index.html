<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>PawanVoice</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#090b12;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
}

.hidden{
  display:none!important;
}

/* HEADER */

.header{
  height:70px;
  background:#11141d;
  border-bottom:1px solid #272c3a;
  padding:10px 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:50;
}

.profile-mini{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.profile-mini img{
  width:46px;
  height:46px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid #ffc84d;
}

.user-info{
  min-width:0;
}

.user-name{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-id{
  color:#9299aa;
  font-size:11px;
  margin-top:3px;
}

.wallet{
  display:flex;
  gap:5px;
}

.wallet-box{
  padding:7px 9px;
  background:#1b1f2b;
  border:1px solid #2d3343;
  border-radius:17px;
  font-size:11px;
}

.coin{
  color:#ffd34f;
}

.diamond{
  color:#66dcff;
}

/* MAIN */

.main{
  max-width:700px;
  margin:auto;
  padding:12px 12px 90px;
}

/* SEARCH */

.search{
  height:44px;
  background:#171b26;
  border:1px solid #2b3040;
  border-radius:23px;
  display:flex;
  align-items:center;
  padding:0 13px;
  margin-bottom:13px;
}

.search span{
  margin-right:8px;
}

.search input{
  width:100%;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
}

.search input::placeholder{
  color:#777e91;
}

/* BANNERS */

.banner-scroll{
  display:flex;
  gap:9px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-bottom:14px;
}

.banner-scroll::-webkit-scrollbar{
  display:none;
}

.banner{
  flex:0 0 225px;
  height:92px;
  border-radius:16px;
  padding:14px;
  border:1px solid #34394b;
}

.family{
  background:linear-gradient(135deg,#4d217d,#a9368b);
}

.cp{
  background:linear-gradient(135deg,#16467c,#237fc6);
}

.rich{
  background:linear-gradient(135deg,#684817,#c78c29);
}

.banner-title{
  font-size:17px;
  font-weight:bold;
}

.banner-sub{
  font-size:11px;
  margin-top:7px;
  color:#eee;
}

/* QUICK */

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:15px;
}

.quick-btn{
  background:#151923;
  border:1px solid #2a3040;
  color:#fff;
  border-radius:14px;
  padding:11px 3px;
}

.quick-icon{
  font-size:22px;
  margin-bottom:5px;
}

.quick-text{
  font-size:11px;
  color:#c7cbd8;
}

/* SECTION */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:13px 2px 10px;
}

.section-title h2{
  font-size:17px;
}

.refresh{
  background:transparent;
  color:#a7aec1;
  font-size:12px;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:11px;
}

.tab{
  color:#9ca3b5;
  background:#171b26;
  border:1px solid #2b3040;
  border-radius:18px;
  padding:8px 18px;
  font-size:12px;
}

.tab.active{
  color:#fff;
  background:#6847e8;
  border-color:#7659ef;
}

/* ROOM */

.room-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.room-card{
  display:flex;
  align-items:center;
  gap:10px;
  background:#151923;
  border:1px solid #292e3d;
  border-radius:16px;
  padding:10px;
}

.room-dp{
  width:58px;
  height:58px;
  border-radius:14px;
  object-fit:cover;
  flex:none;
  background:#242936;
}

.room-info{
  min-width:0;
  flex:1;
}

.room-name{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-owner{
  color:#969daf;
  font-size:10px;
  margin-top:5px;
}

.room-meta{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:6px;
}

.badge{
  padding:3px 7px;
  border-radius:10px;
  background:#202533;
  color:#bfc5d5;
  font-size:9px;
}

.live{
  color:#65ef99;
}

.enter{
  background:#6847e8;
  color:#fff;
  border-radius:18px;
  padding:9px 12px;
  font-size:11px;
}

/* CREATE */

.create-box{
  background:#151923;
  border:1px solid #292e3d;
  border-radius:16px;
  padding:14px;
  margin-top:15px;
}

.input,
.select{
  width:100%;
  height:44px;
  background:#0e1119;
  border:1px solid #303647;
  border-radius:11px;
  color:#fff;
  padding:0 12px;
  outline:0;
  margin-bottom:10px;
}

.primary{
  width:100%;
  height:45px;
  background:#6847e8;
  color:#fff;
  border-radius:12px;
  font-weight:bold;
}

/* PROFILE */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.74);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal-card{
  width:100%;
  max-width:700px;
  max-height:92vh;
  overflow:auto;
  background:#11141e;
  border-radius:22px 22px 0 0;
  padding:17px 14px 25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#252a38;
  color:#fff;
}

.profile-big{
  text-align:center;
  margin-bottom:16px;
}

.profile-big img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ffca4e;
}

.profile-big h2{
  margin-top:8px;
  font-size:19px;
}

.profile-big p{
  color:#9299aa;
  font-size:11px;
  margin-top:4px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:13px;
}

.stat{
  background:#1a1e29;
  border-radius:12px;
  padding:11px 3px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:16px;
}

.stat span{
  display:block;
  color:#8e95a8;
  font-size:10px;
  margin-top:4px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.menu{
  background:#191d28;
  border:1px solid #292e3d;
  color:#dfe2ed;
  border-radius:12px;
  padding:13px 4px;
  font-size:11px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:66px;
  background:#10131d;
  border-top:1px solid #282d3b;
  z-index:60;
}

.bottom-inner{
  max-width:700px;
  margin:auto;
  height:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
}

.nav{
  background:transparent;
  color:#858c9f;
  text-align:center;
  padding-top:8px;
}

.nav.active{
  color:#9070ff;
}

.nav-icon{
  font-size:21px;
}

.nav-text{
  font-size:10px;
  margin-top:3px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px 10px;
  color:#777e91;
  font-size:13px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#292e3b;
  padding:10px 15px;
  border-radius:20px;
  font-size:12px;
  z-index:200;
  display:none;
}

.toast.show{
  display:block;
}

@media(max-width:360px){
  .quick{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="profile-mini" onclick="openProfile()">

    <img
      id="headerDP"
      src="https://i.pravatar.cc/150?img=12"
      onerror="this.src='https://i.pravatar.cc/150?img=12'">

    <div class="user-info">
      <div class="user-name" id="headerName">Pawan</div>
      <div class="user-id">
        ID: <span id="headerUID">100052</span>
      </div>
    </div>

  </div>

  <div class="wallet">

    <div class="wallet-box coin">
      🪙 <span id="coins">0</span>
    </div>

    <div class="wallet-box diamond">
      💎 <span id="diamonds">0</span>
    </div>

  </div>

</header>


<main class="main">

  <div class="search">
    🔍
    <input
      id="search"
      placeholder="Search rooms or users..."
      oninput="renderRooms()">
  </div>


  <div class="banner-scroll">

    <div class="banner family">
      <div class="banner-title">👨‍👩‍👧 Family</div>
      <div class="banner-sub">
        Join family and get special rewards
      </div>
    </div>

    <div class="banner cp">
      <div class="banner-title">💞 CP Ranking</div>
      <div class="banner-sub">
        Top CP couples
      </div>
    </div>

    <div class="banner rich">
      <div class="banner-title">👑 Rich King</div>
      <div class="banner-sub">
        Top wealth ranking
      </div>
    </div>

  </div>


  <div class="quick">

    <button class="quick-btn" onclick="openProfile()">
      <div class="quick-icon">👤</div>
      <div class="quick-text">Profile</div>
    </button>

    <button class="quick-btn" onclick="openInbox()">
      <div class="quick-icon">💬</div>
      <div class="quick-text">Inbox</div>
    </button>

    <button class="quick-btn" onclick="openRanking()">
      <div class="quick-icon">🏆</div>
      <div class="quick-text">Ranking</div>
    </button>

    <button class="quick-btn" onclick="scrollCreate()">
      <div class="quick-icon">🎙️</div>
      <div class="quick-text">Create Room</div>
    </button>

  </div>


  <div class="section-title">
    <h2>🎙️ Voice Rooms</h2>
    <button class="refresh" onclick="loadRooms()">
      Refresh
    </button>
  </div>


  <div class="tabs">

    <button
      class="tab active"
      onclick="setTab('popular',this)">
      Popular
    </button>

    <button
      class="tab"
      onclick="setTab('new',this)">
      New
    </button>

    <button
      class="tab"
      onclick="setTab('all',this)">
      All
    </button>

  </div>


  <div id="roomList" class="room-list">
    <div class="empty">
      Loading rooms...
    </div>
  </div>


  <div id="createSection" class="create-box">

    <div class="section-title" style="margin-top:0">
      <h2>🎙️ Create Voice Room</h2>
    </div>

    <input
      id="roomName"
      class="input"
      maxlength="40"
      placeholder="Room name">

    <select id="category" class="select">

      <option>General</option>
      <option>Music</option>
      <option>Friends</option>
      <option>Gaming</option>
      <option>Chat</option>

    </select>

    <button class="primary" onclick="createRoom()">
      🎙️ Create My Room
    </button>

  </div>

</main>


<!-- PROFILE -->

<div id="profileModal" class="modal hidden">

  <div class="modal-card">

    <div class="modal-head">
      <h2>My Profile</h2>

      <button class="close" onclick="closeProfile()">
        ✕
      </button>
    </div>


    <div class="profile-big">

      <img
        id="profileDP"
        src="https://i.pravatar.cc/150?img=12">

      <h2 id="profileName">
        Pawan
      </h2>

      <p>
        ID:
        <span id="profileID">
          100052
        </span>
      </p>

    </div>


    <div class="stats">

      <div class="stat">
        <strong id="level">1</strong>
        <span>Level</span>
      </div>

      <div class="stat">
        <strong id="followers">0</strong>
        <span>Followers</span>
      </div>

      <div class="stat">
        <strong id="following">0</strong>
        <span>Following</span>
      </div>

    </div>


    <input
      id="editName"
      class="input"
      placeholder="Name">

    <select
      id="editGender"
      class="select">

      <option>Male</option>
      <option>Female</option>
      <option>Other</option>

    </select>


    <input
      id="editDP"
      class="input"
      placeholder="DP image URL">


    <button class="primary" onclick="saveProfile()">
      💾 Save Profile
    </button>


    <div style="height:14px"></div>


    <div class="menu-grid">

      <button class="menu" onclick="openRanking()">🏆 Ranking</button>
      <button class="menu" onclick="showLevel()">🏅 Level</button>
      <button class="menu" onclick="showVIP()">👑 VIP</button>

      <button class="menu" onclick="showCP()">💞 CP Space</button>
      <button class="menu">🛍️ Store</button>
      <button class="menu" onclick="showInvite()">🎁 Invite Friend</button>

      <button class="menu">🎨 My Dress</button>
      <button class="menu">🏅 Medal</button>
      <button class="menu">🖼️ Avatar Frame</button>

      <button class="menu">🎖️ Personal Badge</button>
      <button class="menu">💎 Coins</button>
      <button class="menu">⚙️ Settings</button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<!-- BOTTOM -->

<div class="bottom">

  <div class="bottom-inner">

    <button class="nav active" onclick="goHome()">
      <div class="nav-icon">🏠</div>
      <div class="nav-text">Home</div>
    </button>

    <button class="nav" onclick="openInbox()">
      <div class="nav-icon">💬</div>
      <div class="nav-text">Inbox</div>
    </button>

    <button class="nav" onclick="openProfile()">
      <div class="nav-icon">👤</div>
      <div class="nav-text">Profile</div>
    </button>

  </div>

</div>


<script>
const FIREBASE =
"https://pawanvoice-68c5e-default-rtdb.firebaseio.com";

const SERVER =
"https://pawanvoice-1.onrender.com";

const DEFAULT_DP =
"https://i.pravatar.cc/150?img=12";


let currentUser={
  userId:"100052",
  name:"Pawan",
  gender:"Male",
  dp:DEFAULT_DP,
  level:1,
  exp:0,
  coins:0,
  diamonds:0,
  followers:0,
  following:0,
  visitors:0,
  vip:0
};

let rooms=[];
let roomTab="popular";


function userID(){
  return String(currentUser.userId || "100052");
}


function saveLocal(){
  localStorage.setItem(
    "pawanvoice_user",
    JSON.stringify(currentUser)
  );
}


function loadLocal(){

  try{

    const x=
      JSON.parse(
        localStorage.getItem("pawanvoice_user")
      );

    if(x){
      currentUser={
        ...currentUser,
        ...x
      };
    }

  }catch(e){}

  /*
   * Old PV random IDs are not used.
   */
  if(
    !currentUser.userId ||
    String(currentUser.userId).startsWith("PV")
  ){
    currentUser.userId="100052";
  }

  saveLocal();

}


async function fbGet(path){

  try{

    const r=
      await fetch(
        FIREBASE+path+".json"
      );

    if(!r.ok)return null;

    return await r.json();

  }catch(e){
    return null;
  }

}


async function fbPut(path,data){

  try{

    const r=
      await fetch(
        FIREBASE+path+".json",
        {
          method:"PUT",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify(data)
        }
      );

    return r.ok;

  }catch(e){
    return false;
  }

}


async function loadUser(){

  const id=userID();

  const remote=
    await fbGet(
      "/users/"+encodeURIComponent(id)
    );

  if(remote){

    currentUser={
      ...currentUser,
      ...remote,
      userId:id
    };

    saveLocal();

  }

  renderUser();

}


function renderUser(){

  const dp=
    currentUser.dp ||
    DEFAULT_DP;

  document.getElementById("headerDP").src=dp;

  document.getElementById("headerName")
    .textContent=
    currentUser.name || "Pawan";

  document.getElementById("headerUID")
    .textContent=userID();

  document.getElementById("coins")
    .textContent=
    Number(currentUser.coins||0).toLocaleString();

  document.getElementById("diamonds")
    .textContent=
    Number(currentUser.diamonds||0).toLocaleString();

  document.getElementById("profileDP").src=dp;

  document.getElementById("profileName")
    .textContent=
    currentUser.name || "Pawan";

  document.getElementById("profileID")
    .textContent=userID();

  document.getElementById("level")
    .textContent=currentUser.level||1;

  document.getElementById("followers")
    .textContent=currentUser.followers||0;

  document.getElementById("following")
    .textContent=currentUser.following||0;

}


function openProfile(){

  document.getElementById("profileModal")
    .classList.remove("hidden");

  document.getElementById("editName").value=
    currentUser.name||"";

  document.getElementById("editGender").value=
    currentUser.gender||"Male";

  document.getElementById("editDP").value=
    currentUser.dp||"";

}


function closeProfile(){

  document.getElementById("profileModal")
    .classList.add("hidden");

}


async function saveProfile(){

  const name=
    document.getElementById("editName")
      .value.trim();

  const gender=
    document.getElementById("editGender")
      .value;

  const dp=
    document.getElementById("editDP")
      .value.trim();

  if(!name){

    toast("Name enter karo");
    return;

  }

  currentUser.name=name;
  currentUser.gender=gender;
  currentUser.dp=dp||DEFAULT_DP;

  saveLocal();
  renderUser();

  await fbPut(
    "/users/"+encodeURIComponent(userID()),
    {
      ...currentUser,
      updatedAt:Date.now()
    }
  );

  /*
   * Owner room name + DP sync
   */
  await fbPut(
    "/rooms/"+encodeURIComponent(userID()),
    {
      id:userID(),
      roomId:userID(),
      ownerId:userID(),
      ownerName:currentUser.name,
      ownerDp:currentUser.dp,
      name:currentUser.name,
      dp:currentUser.dp,
      gender:currentUser.gender,
      updatedAt:Date.now()
    }
  );

  /*
   * Render server sync
   */
  try{

    await fetch(
      SERVER+
      "/api/rooms/"+
      encodeURIComponent(userID()),
      {
        method:"PATCH",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          ownerId:userID(),
          ownerName:currentUser.name,
          ownerDp:currentUser.dp,
          name:currentUser.name,
          dp:currentUser.dp
        })
      }
    );

  }catch(e){}

  toast("Profile saved");

  setTimeout(
    closeProfile,
    500
  );

}


async function firebaseRooms(){

  const data=
    await fbGet("/rooms");

  const list=[];

  if(data){

    Object.keys(data).forEach(key=>{

      const x=data[key];

      if(!x)return;

      const id=
        String(
          x.id ||
          x.roomId ||
          x.ownerId ||
          key
        );

      list.push({
        ...x,
        id:id,
        roomId:id
      });

    });

  }

  return list;

}


async function serverRooms(){

  try{

    const r=
      await fetch(
        SERVER+"/api/rooms",
        {
          cache:"no-store"
        }
      );

    if(!r.ok)return [];

    const data=
      await r.json();

    const list=
      Array.isArray(data)
        ? data
        : (
          data.rooms ||
          data.data ||
          []
        );

    return list.map(x=>({
      ...x,
      id:String(
        x.id ||
        x.roomId ||
        x.ownerId ||
        ""
      )
    })).filter(x=>x.id);

  }catch(e){

    return [];

  }

}


async function loadRooms(){

  const box=
    document.getElementById("roomList");

  if(!rooms.length){

    box.innerHTML=
      `<div class="empty">Loading rooms...</div>`;

  }

  const [a,b]=
    await Promise.all([
      firebaseRooms(),
      serverRooms()
    ]);

  const map=new Map();

  a.forEach(x=>{
    map.set(String(x.id),x);
  });

  b.forEach(x=>{

    const old=
      map.get(String(x.id));

    map.set(
      String(x.id),
      old
        ? {...old,...x}
        : x
    );

  });

  rooms=
    Array.from(map.values());

  renderRooms();

}


function roomCount(room){

  if(typeof room.memberCount==="number"){
    return room.memberCount;
  }

  if(typeof room.count==="number"){
    return room.count;
  }

  if(room.users){
    return Object.keys(room.users).length;
  }

  if(Array.isArray(room.seats)){
    return room.seats.filter(Boolean).length;
  }

  return 0;

}


function renderRooms(){

  const box=
    document.getElementById("roomList");

  const search=
    document.getElementById("search")
      .value.trim().toLowerCase();

  let data=[...rooms];

  if(search){

    data=
      data.filter(r=>{

        const text=
          (
            r.name||""
          )+" "+
          (
            r.ownerName||""
          )+" "+
          (
            r.ownerId||r.id||""
          );

        return text.toLowerCase()
          .includes(search);

      });

  }

  if(roomTab==="popular"){

    data.sort(
      (a,b)=>
        roomCount(b)-roomCount(a)
    );

  }else if(roomTab==="new"){

    data.sort(
      (a,b)=>
        Number(b.createdAt||0)-
        Number(a.createdAt||0)
    );

  }else{

    data.sort(
      (a,b)=>
        Number(b.updatedAt||0)-
        Number(a.updatedAt||0)
    );

  }

  if(!data.length){

    box.innerHTML=
      `<div class="empty">
        No rooms found.<br><br>
        Create your first room.
      </div>`;

    return;

  }

  box.innerHTML=
    data.map(r=>{

      const id=
        String(
          r.id||
          r.roomId||
          r.ownerId
        );

      const name=
        r.name||
        r.ownerName||
        "Voice Room";

      const owner=
        r.ownerName||
        "Guest";

      const dp=
        r.dp||
        r.ownerDp||
        DEFAULT_DP;

      const category=
        r.category||
        "General";

      const count=
        roomCount(r);

      return `
      <div class="room-card">

        <img
          class="room-dp"
          src="${safeAttr(dp)}"
          onerror="this.src='${DEFAULT_DP}'">

        <div class="room-info">

          <div class="room-name">
            ${safe(name)}
          </div>

          <div class="room-owner">
            👤 ${safe(owner)}
            · ID ${safe(r.ownerId||id)}
          </div>

          <div class="room-meta">

            <span class="badge">
              ${safe(category)}
            </span>

            <span class="badge live">
              🟢 ${count}/9
            </span>

            <span class="badge">
              Room ${safe(id)}
            </span>

          </div>

        </div>

        <button
          class="enter"
          onclick="enterRoom('${jsSafe(id)}')">
          Enter
        </button>

      </div>
      `;

    }).join("");

}


function enterRoom(id){

  window.location.href=
    "room.html?room="+
    encodeURIComponent(id);

}


async function createRoom(){

  const name=
    document.getElementById("roomName")
      .value.trim();

  const category=
    document.getElementById("category")
      .value;

  if(!name){

    toast("Room name enter karo");
    return;

  }

  const id=userID();

  /*
   * SAME USER ID = SAME ROOM ID
   */
  const room={
    id:id,
    roomId:id,

    name:name,
    dp:currentUser.dp,

    ownerId:id,
    ownerName:currentUser.name,
    ownerDp:currentUser.dp,

    category:category,

    seatCount:9,
    memberCount:0,

    seats:Array(9).fill(null),
    users:{},
    gifts:[],
    chat:[],
    exp:0,

    createdAt:Date.now(),
    updatedAt:Date.now()
  };

  await fbPut(
    "/rooms/"+encodeURIComponent(id),
    room
  );

  /*
   * Render server.
   */
  try{

    await fetch(
      SERVER+"/api/rooms",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(room)
      }
    );

  }catch(e){}

  window.location.href=
    "room.html?room="+
    encodeURIComponent(id);

}


function setTab(tab,btn){

  roomTab=tab;

  document.querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  renderRooms();

}


function scrollCreate(){

  document.getElementById("createSection")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function openInbox(){

  toast("Inbox");

}


function openRanking(){

  toast("Ranking");

}


function showLevel(){

  toast(
    "Level "+(currentUser.level||1)
  );

}


function showVIP(){

  toast(
    "VIP "+(currentUser.vip||0)
  );

}


function showCP(){

  toast("CP Space");

}


function showInvite(){

  toast(
    "Invite Code: "+userID()
  );

}


function goHome(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function toast(message){

  const x=
    document.getElementById("toast");

  x.textContent=message;
  x.classList.add("show");

  setTimeout(
    ()=>x.classList.remove("show"),
    2200
  );

}


function safe(x){

  return String(x)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeAttr(x){

  return safe(x);

}


function jsSafe(x){

  return String(x)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}


async function init(){

  loadLocal();
  renderUser();

  await loadUser();
  await loadRooms();

  setInterval(
    loadRooms,
    5000
  );

}


document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>
