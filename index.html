<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>PawanVoice</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f8;
  font-family:Arial,sans-serif;
  color:#222;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  position:relative;
  padding-bottom:75px;
}

.header{
  background:linear-gradient(135deg,#7c35ff,#ec35a5);
  color:#fff;
  padding:18px;
  border-radius:0 0 24px 24px;
}

.headerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.profileMini{
  display:flex;
  align-items:center;
  gap:10px;
}

.profileMini img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
}

.userName{
  font-weight:bold;
}

.userId{
  font-size:11px;
  opacity:.85;
}

.coins{
  margin-top:12px;
  background:rgba(255,255,255,.18);
  padding:10px;
  border-radius:12px;
}

.banner{
  margin:15px;
  padding:18px;
  border-radius:18px;
  background:linear-gradient(135deg,#ffcf5a,#ff6f91);
  color:white;
  font-weight:bold;
  font-size:19px;
}

.section{
  padding:0 15px;
}

.sectionTitle{
  font-size:19px;
  font-weight:bold;
  margin:20px 0 12px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card{
  padding:17px;
  border-radius:17px;
  background:#f5f1ff;
  cursor:pointer;
}

.card b{
  display:block;
  margin-top:6px;
}

.room{
  border:1px solid #eee;
  border-radius:18px;
  padding:12px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.room img{
  width:58px;
  height:58px;
  border-radius:15px;
  object-fit:cover;
}

.roomInfo{
  flex:1;
}

.roomName{
  font-weight:bold;
  font-size:16px;
}

.roomId{
  font-size:12px;
  color:#888;
  margin-top:4px;
}

.joinBtn{
  background:#7138ff;
  color:white;
  border:0;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

.feature{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.feature div{
  padding:15px 5px;
  text-align:center;
  background:#fafafa;
  border-radius:14px;
  border:1px solid #eee;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  background:#fff;
  border-top:1px solid #eee;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:9px 4px;
  z-index:20;
}

.bottom button{
  border:0;
  background:none;
  font-size:11px;
}

.bottom span{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:50;
  align-items:flex-end;
}

.modalBox{
  width:100%;
  max-width:480px;
  margin:auto;
  background:#fff;
  border-radius:25px 25px 0 0;
  padding:22px;
}

.modal input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:12px;
}

.saveBtn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#7138ff;
  color:#fff;
  font-weight:bold;
  margin-top:10px;
}

.closeBtn{
  width:100%;
  padding:12px;
  border:0;
  background:#eee;
  border-radius:12px;
  margin-top:8px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:11px 16px;
  border-radius:20px;
  display:none;
  z-index:100;
}

</style>

</head>

<body>

<div class="app">

<header class="header">

<div class="headerTop">

<div>
<div class="logo">🎙️ PawanVoice</div>
<div style="font-size:12px;margin-top:4px;">
Voice • Friends • Fun
</div>
</div>

<div class="profileMini"
onclick="openProfile()">

<img id="topDP">

<div>
<div class="userName" id="topName">
Pawan
</div>

<div class="userId" id="topId">
PV00000
</div>
</div>

</div>

</div>

<div class="coins">
🪙 Coins:
<b id="coinText">1000</b>
</div>

</header>


<div class="banner">
👑 Family &nbsp; • &nbsp; 💞 CP Ranking &nbsp; • &nbsp; 💰 Rich King
</div>


<div class="section">

<div class="sectionTitle">
🔥 Popular
</div>

<div class="cards">

<div class="card"
onclick="openRoom('10001','PawanVoice Room')">
👨‍👩‍👧
<b>Family</b>
</div>

<div class="card"
onclick="openRoom('10002','Friends Room')">
💞
<b>CP Ranking</b>
</div>

<div class="card"
onclick="openRoom('10003','Music Room')">
💰
<b>Rich King</b>
</div>

<div class="card"
onclick="showToast('Store coming soon')">
🛍️
<b>Store</b>
</div>

</div>


<div class="sectionTitle">
🎙️ Voice Rooms
</div>

<div id="roomsList">
Loading rooms...
</div>


<div class="sectionTitle">
⭐ Features
</div>

<div class="feature">

<div onclick="showToast('Lucky Wheel')">
🎡<br>Lucky
</div>

<div onclick="showToast('VIP')">
👑<br>VIP
</div>

<div onclick="showToast('Medal')">
🏅<br>Medal
</div>

<div onclick="showToast('Level / EXP')">
🚀<br>Level
</div>

<div onclick="showToast('Inbox')">
📩<br>Inbox
</div>

<div onclick="openProfile()">
👤<br>Profile
</div>

</div>

</div>


<div class="bottom">

<button onclick="home()">
<span>🏠</span>
Home
</button>

<button onclick="showToast('Popular')">
<span>🔥</span>
Popular
</button>

<button onclick="showToast('Inbox')">
<span>📩</span>
Inbox
</button>

<button onclick="showToast('Store')">
<span>🛍️</span>
Store
</button>

<button onclick="openProfile()">
<span>👤</span>
Profile
</button>

</div>

</div>


<!-- PROFILE MODAL -->

<div class="modal" id="profileModal">

<div class="modalBox">

<h2>👤 My Profile</h2>

<label>Name</label>

<input
id="nameInput"
placeholder="Your Name"
maxlength="30">

<label>DP Image URL</label>

<input
id="dpInput"
placeholder="https://...">

<div style="font-size:12px;color:#777;">
User ID:
<b id="profileUserId"></b>
</div>

<button
class="saveBtn"
onclick="saveProfile()">
SAVE PROFILE
</button>

<button
class="closeBtn"
onclick="closeProfile()">
CLOSE
</button>

</div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ==================================
   FIREBASE CONFIG
================================== */

const firebaseConfig = {

  apiKey: "PASTE_YOUR_EXISTING_FULL_API_KEY_HERE",

  authDomain: "pawanvoice-68c5e.firebaseapp.com",

  databaseURL:
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com",

  projectId:
  "pawanvoice-68c5e",

  storageBucket:
  "pawanvoice-68c5e.firebasestorage.app",

  messagingSenderId:
  "148446327241",

  appId:
  "1:148446327241:web:6bac9cb9ad0fb530cbb818",

  measurementId:
  "G-S98P3GBNCK"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* ==================================
   LOCAL USER
================================== */

let userId =
localStorage.getItem("pv_userId");

if(!userId){

  userId =
  "PV" +
  Math.floor(
    10000 +
    Math.random()*90000
  );

  localStorage.setItem(
    "pv_userId",
    userId
  );
}


let userName =
localStorage.getItem("pv_name")
|| "Pawan";


let userDP =
localStorage.getItem("pv_dp")
|| "https://i.pravatar.cc/150?img=12";


let coins =
Number(
  localStorage.getItem("pv_coins")
);

if(!coins){
  coins = 1000;
  localStorage.setItem(
    "pv_coins",
    coins
  );
}


/* ==================================
   UI
================================== */

function updateUI(){

  document.getElementById(
    "topName"
  ).textContent = userName;

  document.getElementById(
    "topId"
  ).textContent = userId;

  document.getElementById(
    "topDP"
  ).src = userDP;

  document.getElementById(
    "coinText"
  ).textContent = coins;

}

updateUI();


/* ==================================
   FIREBASE USER SAVE
================================== */

function saveUserToFirebase(){

  db.ref(
    "users/" + userId
  ).update({

    userId:userId,

    name:userName,

    dp:userDP,

    coins:coins,

    updatedAt:
    firebase.database.ServerValue.TIMESTAMP

  }).catch(err=>{

    console.error(err);

    showToast(
      "Firebase save error"
    );

  });

}

saveUserToFirebase();


/* ==================================
   LOAD ROOMS
================================== */

function loadRooms(){

  db.ref("rooms").on(
    "value",
    snapshot=>{

      const data =
      snapshot.val() || {};

      const list =
      document.getElementById(
        "roomsList"
      );

      list.innerHTML = "";

      const rooms =
      Object.values(data);

      if(!rooms.length){

        createDefaultRooms();

        return;
      }

      rooms.forEach(room=>{

        list.innerHTML += roomHTML(room);

      });

    },
    error=>{

      console.error(error);

      document.getElementById(
        "roomsList"
      ).innerHTML =
      `
      <div style="padding:15px;color:#d00;">
      Firebase rooms load नहीं हो पाए।
      </div>
      `;

    }
  );

}


function roomHTML(room){

  const dp =
  room.dp ||
  "https://i.pravatar.cc/150?img=32";

  return `

  <div class="room">

    <img
    src="${escapeHTML(dp)}"
    onerror="this.src='https://i.pravatar.cc/150?img=32'">

    <div class="roomInfo">

      <div class="roomName">
      ${escapeHTML(room.name || "Voice Room")}
      </div>

      <div class="roomId">
      Room ID: ${escapeHTML(String(room.roomId || ""))}
      </div>

      <div style="font-size:11px;color:#999;">
      9 Seats • Voice Room
      </div>

    </div>

    <button
    class="joinBtn"
    onclick="openRoom(
      '${escapeHTML(String(room.roomId || ""))}',
      '${escapeHTML(room.name || "Voice Room")}'
    )">
    JOIN
    </button>

  </div>

  `;

}


/* ==================================
   DEFAULT ROOMS
================================== */

function createDefaultRooms(){

  const rooms = {

    "10001":{
      roomId:"10001",
      name:"PawanVoice Room",
      dp:"https://i.pravatar.cc/150?img=12",
      hostName:"Pawan"
    },

    "10002":{
      roomId:"10002",
      name:"Friends Room",
      dp:"https://i.pravatar.cc/150?img=33",
      hostName:"Pawan"
    },

    "10003":{
      roomId:"10003",
      name:"Music Room",
      dp:"https://i.pravatar.cc/150?img=47",
      hostName:"Pawan"
    }

  };

  db.ref("rooms")
  .update(rooms)
  .catch(err=>{
    console.error(err);
  });

}


loadRooms();


/* ==================================
   OPEN ROOM
================================== */

function openRoom(
  roomId,
  roomName
){

  if(!roomId) return;

  const url =
    "/room.html" +
    "?room=" +
    encodeURIComponent(roomId) +
    "&name=" +
    encodeURIComponent(userName) +
    "&dp=" +
    encodeURIComponent(userDP) +
    "&userid=" +
    encodeURIComponent(userId) +
    "&title=" +
    encodeURIComponent(roomName);

  location.href = url;

}


/* ==================================
   PROFILE
================================== */

function openProfile(){

  document.getElementById(
    "nameInput"
  ).value = userName;

  document.getElementById(
    "dpInput"
  ).value = userDP;

  document.getElementById(
    "profileUserId"
  ).textContent = userId;

  document.getElementById(
    "profileModal"
  ).style.display = "flex";

}


function closeProfile(){

  document.getElementById(
    "profileModal"
  ).style.display = "none";

}


function saveProfile(){

  const newName =
    document.getElementById(
      "nameInput"
    ).value.trim();

  const newDP =
    document.getElementById(
      "dpInput"
    ).value.trim();

  if(newName){

    userName = newName;

    localStorage.setItem(
      "pv_name",
      userName
    );

  }

  if(newDP){

    userDP = newDP;

    localStorage.setItem(
      "pv_dp",
      userDP
    );

  }

  updateUI();

  saveUserToFirebase();

  closeProfile();

  showToast(
    "Profile saved ✅"
  );

}


/* ==================================
   HELPERS
================================== */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showToast(message){

  const t =
  document.getElementById(
    "toast"
  );

  t.textContent = message;

  t.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
  setTimeout(()=>{
    t.style.display = "none";
  },2200);

}


function home(){
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

</script>

</body>
</html>
