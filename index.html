<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PawanVoice</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#f5f6fa;
 font-family:Arial,sans-serif;
 color:#222;
}

header{
 height:64px;
 background:linear-gradient(135deg,#ff4f81,#7b4dff);
 color:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 position:sticky;
 top:0;
 z-index:20;
}

.logo{
 font-size:23px;
 font-weight:bold;
}

.headerRight{
 display:flex;
 gap:10px;
 align-items:center;
}

.iconBtn{
 border:0;
 background:rgba(255,255,255,.2);
 color:white;
 border-radius:50%;
 width:40px;
 height:40px;
 font-size:20px;
}

.page{
 padding:14px;
 max-width:700px;
 margin:auto;
}

.banner{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-bottom:15px;
}

.banner button{
 border:0;
 padding:15px 5px;
 border-radius:14px;
 color:white;
 font-weight:bold;
 min-height:75px;
}

.family{
 background:linear-gradient(135deg,#ff6584,#ff9a5c);
}

.cp{
 background:linear-gradient(135deg,#6a5cff,#b15cff);
}

.rich{
 background:linear-gradient(135deg,#ff9d27,#ffca45);
}

.search{
 width:100%;
 border:1px solid #ddd;
 border-radius:14px;
 padding:14px;
 font-size:16px;
 margin-bottom:15px;
}

.sectionTitle{
 font-size:18px;
 font-weight:bold;
 margin:15px 0 10px;
}

.room{
 background:white;
 border-radius:17px;
 padding:13px;
 margin-bottom:10px;
 display:flex;
 align-items:center;
 gap:12px;
 box-shadow:0 2px 10px #ddd;
}

.roomDp{
 width:55px;
 height:55px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}

.roomInfo{
 flex:1;
}

.roomName{
 font-weight:bold;
 font-size:16px;
}

.roomId{
 color:#888;
 font-size:12px;
 margin-top:4px;
}

.join{
 border:0;
 background:#7b4dff;
 color:white;
 padding:10px 15px;
 border-radius:12px;
 font-weight:bold;
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:space-around;
 padding:9px 0;
 z-index:20;
}

.bottom button{
 border:0;
 background:none;
 font-size:12px;
 color:#555;
}

.bottom .active{
 color:#7b4dff;
 font-weight:bold;
}

.profile{
 display:none;
}

.profileCard{
 background:white;
 border-radius:20px;
 padding:20px;
 text-align:center;
 box-shadow:0 2px 10px #ddd;
}

.profileDp{
 width:105px;
 height:105px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}

.changeDp{
 display:block;
 margin:12px auto;
}

.input{
 width:100%;
 border:1px solid #ddd;
 border-radius:12px;
 padding:13px;
 margin:7px 0;
 font-size:16px;
}

.save{
 width:100%;
 padding:13px;
 border:0;
 border-radius:12px;
 background:#7b4dff;
 color:white;
 font-size:16px;
 font-weight:bold;
}

.info{
 margin-top:10px;
 color:#777;
 font-size:13px;
}

.levelBox{
 background:white;
 border-radius:17px;
 padding:15px;
 margin-top:12px;
}

.level{
 display:flex;
 justify-content:space-between;
 padding:9px 0;
 border-bottom:1px solid #eee;
 font-size:14px;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.55);
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modalBox{
 background:white;
 width:100%;
 max-width:430px;
 border-radius:20px;
 padding:20px;
}

.modalBox h2{
 margin-top:0;
}

.close{
 float:right;
 border:0;
 background:#eee;
 border-radius:50%;
 width:35px;
 height:35px;
}

.primary{
 width:100%;
 padding:13px;
 background:#7b4dff;
 color:white;
 border:0;
 border-radius:12px;
 margin-top:8px;
 font-weight:bold;
}

@media(max-width:500px){
 .banner button{
  font-size:11px;
 }
}
</style>
</head>

<body>

<header>

<div class="logo">
PawanVoice
</div>

<div class="headerRight">

<button class="iconBtn"
onclick="openCreateRoom()">
＋
</button>

<button class="iconBtn"
onclick="showInbox()">
✉
</button>

</div>

</header>


<!-- HOME -->

<main id="homePage" class="page">

<div class="banner">

<button class="family"
onclick="coming('Family')">
👨‍👩‍👧‍👦<br>
Family
</button>

<button class="cp"
onclick="coming('CP Ranking')">
💜<br>
CP Ranking
</button>

<button class="rich"
onclick="coming('Rich King')">
👑<br>
Rich King
</button>

</div>


<input
 id="roomSearch"
 class="search"
 placeholder="Search room..."
 oninput="renderRooms()"
>


<div class="sectionTitle">
🔥 Popular Rooms
</div>

<div id="rooms">
Loading...
</div>

</main>


<!-- PROFILE -->

<main id="profilePage"
class="page profile">

<div class="profileCard">

<img
 id="profileDp"
 class="profileDp"
 src=""
>

<input
 id="dpInput"
 class="changeDp"
 type="file"
 accept="image/*"
 onchange="changeDP(event)"
>

<input
 id="profileName"
 class="input"
 placeholder="Your name"
 maxlength="30"
>

<button
 class="save"
 onclick="saveProfile()">
Save Profile
</button>

<div class="info">
User ID
</div>

<div
 id="userId"
 style="font-weight:bold;margin-top:5px">
</div>

<div class="info">
Level
</div>

<div
 id="profileLevel"
 style="font-size:24px;font-weight:bold">
1
</div>

<div class="info">
EXP: <span id="profileExp">0</span>
</div>

</div>


<div class="levelBox">

<div class="sectionTitle">
🏆 Level 1–100
</div>

<div id="levels"></div>

</div>

</main>


<div class="bottom">

<button
 id="homeBtn"
 class="active"
 onclick="showPage('home')">
🏠<br>Home
</button>

<button onclick="coming('Friends')">
👥<br>Friends
</button>

<button onclick="showInbox()">
✉<br>Inbox
</button>

<button
 onclick="showPage('profile')">
👤<br>Profile
</button>

</div>


<!-- CREATE ROOM -->

<div id="createModal"
class="modal">

<div class="modalBox">

<button
 class="close"
 onclick="closeCreateRoom()">
×
</button>

<h2>Create Room</h2>

<input
 id="newRoomName"
 class="input"
 placeholder="Room name"
 value="PawanVoice Room"
>

<input
 id="newRoomId"
 class="input"
 placeholder="Room ID e.g. PV123456"
>

<button
 class="primary"
 onclick="createRoom()">
Create Room
</button>

</div>

</div>


<script>

const SERVER =
"https://pawanvoice-1.onrender.com";

const socketScript =
"https://cdn.socket.io/4.8.1/socket.io.min.js";

const script =
document.createElement("script");

script.src=socketScript;

document.head.appendChild(script);


let socket=null;

let rooms=[];

let userId=
localStorage.getItem(
 "pawanvoice_user_id"
);

let userName=
localStorage.getItem(
 "pawanvoice_name"
);

let userDP=
localStorage.getItem(
 "pawanvoice_dp"
);


if(!userId){

 userId=
 "PVU"+
 Math.floor(
 100000+Math.random()*900000
 );

 localStorage.setItem(
 "pawanvoice_user_id",
 userId
 );
}


if(!userName){

 userName="Pawan User";

 localStorage.setItem(
 "pawanvoice_name",
 userName
 );
}


function avatar(){

 if(userDP) return userDP;

 const svg=`
 <svg xmlns="http://www.w3.org/2000/svg"
 width="200" height="200">

 <rect width="100%" height="100%"
 fill="#7b4dff"/>

 <text x="50%" y="55%"
 text-anchor="middle"
 font-size="90"
 fill="white">
 ${userName.charAt(0).toUpperCase()}
 </text>

 </svg>
 `;

 return "data:image/svg+xml;base64,"+
 btoa(svg);
}


document.getElementById(
 "profileDp"
).src=avatar();

document.getElementById(
 "profileName"
).value=userName;

document.getElementById(
 "userId"
).innerText=userId;


function showPage(page){

 document.getElementById(
  "homePage"
 ).style.display=
 page==="home"?"block":"none";

 document.getElementById(
  "profilePage"
 ).style.display=
 page==="profile"?"block":"none";

 document.getElementById(
  "homeBtn"
 ).classList.toggle(
  "active",
  page==="home"
 );

 if(page==="profile"){
  loadProfile();
 }
}


function loadProfile(){

 document.getElementById(
  "profileDp"
 ).src=avatar();

 document.getElementById(
  "profileName"
 ).value=userName;

 document.getElementById(
  "userId"
 ).innerText=userId;

 let level=1;

 let exp=
 Number(
  localStorage.getItem(
   "pawanvoice_exp"
  )||0
 );

 for(let i=1;i<=100;i++){

  const need=i*100;

  if(exp>=need){
   level=i;
  }

 }

 document.getElementById(
  "profileLevel"
 ).innerText=
 "Level "+level;

 document.getElementById(
  "profileExp"
 ).innerText=exp;

 renderLevels(level);
}


function renderLevels(current){

 let html="";

 for(let i=1;i<=100;i++){

  html+=`
  <div class="level">

   <span>
    ⭐ Level ${i}
   </span>

   <span>
    ${i*100} EXP
   </span>

  </div>
  `;
 }

 document.getElementById(
  "levels"
 ).innerHTML=html;
}


function changeDP(event){

 const file=
 event.target.files[0];

 if(!file) return;

 const reader=
 new FileReader();

 reader.onload=()=>{

  userDP=reader.result;

  localStorage.setItem(
   "pawanvoice_dp",
   userDP
  );

  document.getElementById(
   "profileDp"
  ).src=userDP;

  if(socket){

   socket.emit(
    "update-profile",
    {
     userId,
     name:userName,
     dp:userDP
    }
   );

  }

 };

 reader.readAsDataURL(file);
}


function saveProfile(){

 const name=
 document.getElementById(
  "profileName"
 ).value.trim();

 if(name){

  userName=name;

  localStorage.setItem(
   "pawanvoice_name",
   userName
  );
 }

 if(socket){

  socket.emit(
   "update-profile",
   {
    userId,
    name:userName,
    dp:userDP
   }
  );

 }

 alert("Profile saved");

 renderRooms();
}


function connectSocket(){

 if(!window.io){

  setTimeout(
   connectSocket,
   500
  );

  return;
 }

 socket=io(SERVER);

 socket.on("connect",()=>{

  socket.emit(
   "update-profile",
   {
    userId,
    name:userName,
    dp:userDP
   }
  );

 });

}


connectSocket();


async function loadRooms(){

 try{

  const res=
   await fetch(
    SERVER+"/api/rooms"
   );

  rooms=
   await res.json();

 }catch(e){

  rooms=[];

 }

 renderRooms();
}


function renderRooms(){

 const box=
 document.getElementById(
  "rooms"
 );

 const search=
 document.getElementById(
  "roomSearch"
 ).value.toLowerCase();

 const list=
 rooms.filter(
  r=>
   r.roomName.toLowerCase()
   .includes(search) ||
   r.roomId.toLowerCase()
   .includes(search)
 );

 if(!list.length){

  box.innerHTML=`

  <div class="room">

   <img
    class="roomDp"
    src="${avatar()}"
   >

   <div class="roomInfo">

    <div class="roomName">
     No live room
    </div>

    <div class="roomId">
     Create your first room
    </div>

   </div>

  </div>

  `;

  return;
 }


 box.innerHTML=
 list.map(
  room=>`

  <div class="room">

   <img
    class="roomDp"
    src="${avatar()}"
   >

   <div class="roomInfo">

    <div class="roomName">
     ${escapeHTML(room.roomName)}
    </div>

    <div class="roomId">
     ${room.roomId}
     • ${room.count}/50 users
    </div>

   </div>

   <button
    class="join"
    onclick="joinRoom('${room.roomId}')">
    Join
   </button>

  </div>

  `
 ).join("");
}


function escapeHTML(text){

 return String(text)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;");
}


function joinRoom(id){

 window.location.href=
 "room.html?room="+
 encodeURIComponent(id);
}


function openCreateRoom(){

 document.getElementById(
  "createModal"
 ).style.display="flex";

 document.getElementById(
  "newRoomId"
 ).value=
 "PV"+
 Math.floor(
 100000+Math.random()*900000
 );
}


function closeCreateRoom(){

 document.getElementById(
  "createModal"
 ).style.display="none";
}


function createRoom(){

 const roomName=
 document.getElementById(
  "newRoomName"
 ).value.trim();

 const roomId=
 document.getElementById(
  "newRoomId"
 ).value.trim();

 if(!roomName||!roomId){

  alert("Room name aur Room ID bhariye");

  return;
 }

 if(!socket||!socket.connected){

  alert("Server connect nahi hua. Thodi der baad try karein.");

  return;
 }

 socket.emit(
  "create-room",
  {
   roomId,
   roomName,
   userId,
   name:userName,
   dp:userDP
  },
  result=>{

   if(!result?.ok){

    alert(
     result?.error||
     "Room create nahi hua"
    );

    return;
   }

   window.location.href=
    "room.html?room="+
    encodeURIComponent(
     result.roomId
    );
  }
 );
}


function showInbox(){

 alert(
  "Inbox module next stage me connect hoga."
 );
}


function coming(name){

 alert(
  name+
  " module next stage me add hoga."
 );
}


loadRooms();

setInterval(
 loadRooms,
 5000
);

loadProfile();

</script>

</body>
</html>
