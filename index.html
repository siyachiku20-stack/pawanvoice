<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PawanVoice</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#090b14;
  color:#fff;
  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:650px;
  margin:auto;
  min-height:100vh;
  padding-bottom:78px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#0d0f1a;
  padding:14px 14px 10px;
  border-bottom:1px solid #202333;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:22px;
  font-weight:800;
}

.brand span{
  color:#ff4f91;
}

.header-user{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.header-user img{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ff4f91;
}

.header-user-name{
  max-width:100px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;
}

/* SEARCH */

.search-box{
  margin-top:12px;
  display:flex;
  align-items:center;
  background:#171a28;
  border:1px solid #282c3e;
  border-radius:14px;
  padding:0 13px;
}

.search-box span{
  color:#858aa0;
  font-size:18px;
}

.search-box input{
  width:100%;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  padding:12px 10px;
}

.search-box input::placeholder{
  color:#777c91;
}

/* BANNERS */

.section-title{
  font-size:17px;
  font-weight:700;
  margin:18px 14px 10px;
}

.banner-wrap{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:0 14px;
  scrollbar-width:none;
}

.banner-wrap::-webkit-scrollbar{
  display:none;
}

.banner{
  min-width:180px;
  height:88px;
  border-radius:16px;
  padding:13px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border:1px solid #30354b;
}

.banner.family{
  background:linear-gradient(135deg,#44204b,#1d2444);
}

.banner.cp{
  background:linear-gradient(135deg,#273f5b,#222348);
}

.banner.rich{
  background:linear-gradient(135deg,#553a18,#292017);
}

.banner-title{
  font-size:15px;
  font-weight:800;
}

.banner-sub{
  color:#c7c9d5;
  font-size:11px;
}

/* TABS */

.tabs{
  display:flex;
  margin:12px 14px 0;
  background:#121522;
  border-radius:12px;
  padding:4px;
}

.tab{
  flex:1;
  padding:10px 8px;
  background:transparent;
  color:#969bad;
  border-radius:9px;
  font-weight:700;
}

.tab.active{
  background:#ff4f91;
  color:#fff;
}

/* ROOM LIST */

.room-list{
  padding:0 14px;
}

.room-card{
  background:#121522;
  border:1px solid #252a3b;
  border-radius:17px;
  padding:12px;
  margin-bottom:11px;
  cursor:pointer;
}

.room-top{
  display:flex;
  align-items:center;
  gap:11px;
}

.room-dp{
  width:58px;
  height:58px;
  border-radius:15px;
  object-fit:cover;
  border:1px solid #3b4056;
}

.room-info{
  min-width:0;
  flex:1;
}

.room-name{
  font-size:16px;
  font-weight:800;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.room-owner{
  color:#9ca1b4;
  font-size:12px;
  margin-top:5px;
}

.room-count{
  background:#222638;
  color:#dfe1ea;
  border-radius:20px;
  padding:6px 9px;
  font-size:11px;
}

.room-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.room-category{
  color:#aeb2c3;
  font-size:11px;
}

.join-btn{
  background:#ff4f91;
  color:#fff;
  border-radius:9px;
  padding:7px 13px;
  font-size:12px;
  font-weight:700;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px 20px;
  color:#777c91;
}

.empty-icon{
  font-size:38px;
  margin-bottom:8px;
}

/* CREATE */

.create-btn{
  position:fixed;
  right:18px;
  bottom:88px;
  z-index:25;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#ff4f91;
  color:#fff;
  font-size:28px;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
}

/* MODAL */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.7);
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:650px;
  background:#121522;
  border-radius:24px 24px 0 0;
  padding:20px 16px 28px;
  border-top:1px solid #30354b;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.modal-head h2{
  font-size:19px;
}

.close-btn{
  background:#252a3b;
  color:#fff;
  width:36px;
  height:36px;
  border-radius:50%;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  color:#aeb2c3;
  font-size:12px;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  background:#1a1e2c;
  border:1px solid #30354b;
  color:#fff;
  border-radius:12px;
  padding:12px;
  outline:0;
}

.create-submit{
  width:100%;
  padding:13px;
  border-radius:12px;
  background:#ff4f91;
  color:#fff;
  font-weight:800;
  margin-top:5px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  max-width:650px;
  margin:auto;
  height:68px;
  background:#10121d;
  border-top:1px solid #24283a;
  display:flex;
}

.nav-btn{
  flex:1;
  background:transparent;
  color:#777c91;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:11px;
}

.nav-icon{
  font-size:21px;
}

.nav-btn.active{
  color:#ff4f91;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#262a3b;
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-size:12px;
  display:none;
  z-index:100;
}

.toast.show{
  display:block;
}

/* RESPONSIVE */

@media(max-width:380px){
  .brand{
    font-size:19px;
  }

  .header-user-name{
    display:none;
  }

  .banner{
    min-width:165px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="header-row">

      <div class="brand">
        Pawan<span>Voice</span>
      </div>

      <div class="header-user" id="headerUser">

        <img
          id="headerDp"
          src="https://i.pravatar.cc/200?img=12"
          alt="Profile">

        <div
          class="header-user-name"
          id="headerName">
          Pawan User
        </div>

      </div>

    </div>

    <div class="search-box">

      <span>⌕</span>

      <input
        id="searchInput"
        type="text"
        placeholder="Search rooms or users">

    </div>

  </header>


  <!-- BANNERS -->

  <div class="section-title">
    Rankings & Events
  </div>

  <div class="banner-wrap">

    <div class="banner family">
      <div class="banner-title">👨‍👩‍👧 Family</div>
      <div class="banner-sub">
        Family ranking & members
      </div>
    </div>

    <div class="banner cp">
      <div class="banner-title">💞 CP Ranking</div>
      <div class="banner-sub">
        Top CP couples
      </div>
    </div>

    <div class="banner rich">
      <div class="banner-title">👑 Rich King</div>
      <div class="banner-sub">
        Wealth ranking
      </div>
    </div>

  </div>


  <!-- ROOMS -->

  <div class="section-title">
    Voice Rooms
  </div>

  <div class="tabs">

    <button
      class="tab active"
      id="popularTab">
      Popular
    </button>

    <button
      class="tab"
      id="allTab">
      All Rooms
    </button>

  </div>

  <div
    class="room-list"
    id="roomList">

    <div class="empty">

      <div class="empty-icon">🎙️</div>

      <div>
        Loading rooms...
      </div>

    </div>

  </div>

</div>


<!-- CREATE ROOM BUTTON -->

<button
  class="create-btn"
  id="createBtn"
  type="button">
  +
</button>


<!-- CREATE ROOM MODAL -->

<div
  class="modal-bg"
  id="createModal">

  <div class="modal">

    <div class="modal-head">

      <h2>Create Voice Room</h2>

      <button
        class="close-btn"
        id="closeModal"
        type="button">
        ×
      </button>

    </div>

    <div class="field">

      <label>Room Name</label>

      <input
        id="roomNameInput"
        type="text"
        maxlength="40"
        placeholder="Enter room name">

    </div>

    <div class="field">

      <label>Category</label>

      <select id="roomCategory">

        <option value="General">
          General
        </option>

        <option value="Music">
          Music
        </option>

        <option value="Friends">
          Friends
        </option>

        <option value="Gaming">
          Gaming
        </option>

        <option value="Chat">
          Chat
        </option>

      </select>

    </div>

    <div class="field">

      <label>Room DP URL</label>

      <input
        id="roomDpInput"
        type="url"
        placeholder="https://...">

    </div>

    <button
      class="create-submit"
      id="createRoomSubmit"
      type="button">

      Create Room

    </button>

  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    id="homeNav"
    type="button">

    <div class="nav-icon">⌂</div>
    <div>Home</div>

  </button>

  <button
    class="nav-btn"
    id="inboxNav"
    type="button">

    <div class="nav-icon">💬</div>
    <div>Inbox</div>

  </button>

  <button
    class="nav-btn"
    id="profileNav"
    type="button">

    <div class="nav-icon">👤</div>
    <div>Profile</div>

  </button>

</nav>


<div
  class="toast"
  id="toast">
</div>


<!-- IMPORTANT: shared user file -->

<script src="user.js"></script>


<script>

const FIREBASE_DB =
  "https://pawanvoice-68c5e-default-rtdb.firebaseio.com";


let currentUser = null;
let allRooms = [];
let currentTab = "popular";


/* ---------------- TOAST ---------------- */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2200);

}


/* ---------------- USER ---------------- */

async function loadCurrentUser(){

  try{

    if(typeof pvLoadUser === "function"){

      currentUser =
        await pvLoadUser();

    }else{

      currentUser = {
        userId:
          localStorage.getItem("pv_userId") ||
          "pawan",

        name:
          localStorage.getItem("pv_name") ||
          "Pawan User",

        dp:
          localStorage.getItem("pv_dp") ||
          "https://i.pravatar.cc/200?img=12"
      };

    }

  }catch(error){

    console.error(error);

    currentUser = {
      userId:
        localStorage.getItem("pv_userId") ||
        "pawan",

      name:
        localStorage.getItem("pv_name") ||
        "Pawan User",

      dp:
        localStorage.getItem("pv_dp") ||
        "https://i.pravatar.cc/200?img=12"
    };

  }


  document.getElementById("headerName").textContent =
    currentUser.name || "Pawan User";

  document.getElementById("headerDp").src =
    currentUser.dp ||
    "https://i.pravatar.cc/200?img=12";

}


/* ---------------- LOAD ROOMS ---------------- */

async function loadRooms(){

  const roomList =
    document.getElementById("roomList");

  try{

    const response =
      await fetch(
        FIREBASE_DB + "/rooms.json"
      );

    if(!response.ok){

      throw new Error(
        "Firebase HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    allRooms = [];

    if(data){

      Object.keys(data).forEach(id => {

        const room =
          data[id];

        if(room){

          allRooms.push({

            roomId:
              room.roomId || id,

            name:
              room.name ||
              "PawanVoice Room",

            ownerId:
              room.ownerId ||
              "",

            ownerName:
              room.ownerName ||
              "Host",

            dp:
              room.dp ||
              "https://i.pravatar.cc/200?img=12",

            category:
              room.category ||
              "General",

            online:
              Number(
                room.online ||
                room.userCount ||
                0
              ),

            maxSeats:
              Number(
                room.maxSeats ||
                9
              ),

            createdAt:
              Number(
                room.createdAt ||
                0
              )

          });

        }

      });

    }

    renderRooms();

  }catch(error){

    console.error(
      "Room loading error:",
      error
    );

    roomList.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <div>
          Rooms load nahi ho rahe.
        </div>

      </div>

    `;

  }

}


/* ---------------- RENDER ROOMS ---------------- */

function renderRooms(){

  const roomList =
    document.getElementById("roomList");

  const search =
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();


  let rooms =
    [...allRooms];


  /* SEARCH */

  if(search){

    rooms =
      rooms.filter(room =>

        String(room.name)
          .toLowerCase()
          .includes(search)

        ||

        String(room.ownerName)
          .toLowerCase()
          .includes(search)

        ||

        String(room.category)
          .toLowerCase()
          .includes(search)

      );

  }


  /* POPULAR */

  if(currentTab === "popular"){

    rooms.sort(
      (a,b) =>
        Number(b.online || 0) -
        Number(a.online || 0)
    );

  }else{

    rooms.sort(
      (a,b) =>
        Number(b.createdAt || 0) -
        Number(a.createdAt || 0)
    );

  }


  if(!rooms.length){

    roomList.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🎙️
        </div>

        <div>
          Abhi koi room nahi mila.
        </div>

        <div style="margin-top:7px;font-size:11px;">
          + button se apna room create karein.
        </div>

      </div>

    `;

    return;

  }


  roomList.innerHTML = "";


  rooms.forEach(room => {

    const card =
      document.createElement("div");

    card.className =
      "room-card";


    card.innerHTML = `

      <div class="room-top">

        <img
          class="room-dp"
          src="${escapeHtml(room.dp)}"
          alt="Room">

        <div class="room-info">

          <div class="room-name">
            ${escapeHtml(room.name)}
          </div>

          <div class="room-owner">
            👤 ${escapeHtml(room.ownerName)}
          </div>

        </div>

        <div class="room-count">
          ${room.online}/${room.maxSeats}
        </div>

      </div>

      <div class="room-bottom">

        <div class="room-category">
          🎙️ ${escapeHtml(room.category)}
        </div>

        <button
          class="join-btn"
          type="button">
          Join
        </button>

      </div>

    `;


    card.addEventListener(
      "click",
      () => {

        openRoom(
          room.roomId
        );

      }
    );


    roomList.appendChild(card);

  });

}


/* ---------------- ESCAPE HTML ---------------- */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ---------------- OPEN ROOM ---------------- */

function openRoom(roomId){

  if(!roomId){

    showToast(
      "Room ID nahi mila."
    );

    return;

  }

  window.location.href =
    "room.html?room=" +
    encodeURIComponent(roomId);

}


/* ---------------- CREATE ROOM ---------------- */

async function createRoom(){

  if(!currentUser){

    await loadCurrentUser();

  }


  const name =
    document.getElementById(
      "roomNameInput"
    ).value.trim();


  const category =
    document.getElementById(
      "roomCategory"
    ).value;


  const dp =
    document.getElementById(
      "roomDpInput"
    ).value.trim();


  if(!name){

    showToast(
      "Room name likho."
    );

    return;

  }


  const roomId =
    "PV" +
    Math.floor(
      100000 +
      Math.random() * 900000
    );


  const roomData = {

    roomId:
      roomId,

    name:
      name,

    ownerId:
      currentUser.userId,

    ownerName:
      currentUser.name,

    dp:
      dp ||
      currentUser.dp ||
      "https://i.pravatar.cc/200?img=12",

    category:
      category,

    online:
      1,

    maxSeats:
      9,

    createdAt:
      Date.now()

  };


  try{

    const response =
      await fetch(
        FIREBASE_DB +
        "/rooms/" +
        encodeURIComponent(roomId) +
        ".json",
        {

          method:"PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              roomData
            )

        }
      );


    if(!response.ok){

      throw new Error(
        "Firebase save failed " +
        response.status
      );

    }


    document
      .getElementById(
        "createModal"
      )
      .classList.remove(
        "show"
      );


    document
      .getElementById(
        "roomNameInput"
      ).value = "";


    document
      .getElementById(
        "roomDpInput"
      ).value = "";


    showToast(
      "Room create ho gaya!"
    );


    setTimeout(() => {

      openRoom(roomId);

    },700);


  }catch(error){

    console.error(error);

    showToast(
      "Room create nahi hua."
    );

  }

}


/* ---------------- EVENTS ---------------- */

document
  .getElementById("popularTab")
  .addEventListener(
    "click",
    function(){

      currentTab =
        "popular";

      this.classList.add(
        "active"
      );

      document
        .getElementById(
          "allTab"
        )
        .classList.remove(
          "active"
        );

      renderRooms();

    }
  );


document
  .getElementById("allTab")
  .addEventListener(
    "click",
    function(){

      currentTab =
        "all";

      this.classList.add(
        "active"
      );

      document
        .getElementById(
          "popularTab"
        )
        .classList.remove(
          "active"
        );

      renderRooms();

    }
  );


document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderRooms
  );


document
  .getElementById("createBtn")
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "createModal"
        )
        .classList.add(
          "show"
        );

    }
  );


document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "createModal"
        )
        .classList.remove(
          "show"
        );

    }
  );


document
  .getElementById("createRoomSubmit")
  .addEventListener(
    "click",
    createRoom
  );


document
  .getElementById("headerUser")
  .addEventListener(
    "click",
    function(){

      window.location.href =
        "profile.html";

    }
  );


document
  .getElementById("profileNav")
  .addEventListener(
    "click",
    function(){

      window.location.href =
        "profile.html";

    }
  );


document
  .getElementById("inboxNav")
  .addEventListener(
    "click",
    function(){

      window.location.href =
        "inbox.html";

    }
  );


document
  .getElementById("homeNav")
  .addEventListener(
    "click",
    function(){

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


/* ---------------- START ---------------- */

async function startHome(){

  await loadCurrentUser();

  await loadRooms();

  /*
    Firebase room list refresh.
    Live room seat count will later be
    synced from Socket.IO server.
  */

  setInterval(
    loadRooms,
    5000
  );

}


startHome();

</script>

</body>
</html>
