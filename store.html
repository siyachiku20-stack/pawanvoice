*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#090910;
  color:#fff;
}

.app{
  width:100%;
  max-width:560px;
  margin:auto;
  min-height:100vh;
  background:#101019;
  padding-bottom:80px;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:#171724;
  border-bottom:1px solid #29293a;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#282838;
  color:#fff;
  font-size:24px;
}

.titleBox{
  flex:1;
}

.title{
  font-size:19px;
  font-weight:bold;
}

.subtitle{
  color:#9292a5;
  font-size:11px;
  margin-top:3px;
}

.wallet{
  margin:12px;
  padding:15px;
  border-radius:17px;
  background:#1a1a29;
  border:1px solid #303044;
}

.walletTop{
  display:flex;
  align-items:center;
  gap:12px;
}

.walletDp{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:#29293a;
}

.walletInfo{
  flex:1;
  min-width:0;
}

.walletName{
  font-weight:bold;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.walletId{
  color:#858597;
  font-size:10px;
  margin-top:4px;
}

.balanceRow{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.balance{
  flex:1;
  padding:10px;
  text-align:center;
  border-radius:12px;
  background:#242435;
}

.balanceIcon{
  font-size:20px;
}

.balanceLabel{
  color:#9999aa;
  font-size:10px;
  margin-top:3px;
}

.balanceValue{
  margin-top:4px;
  font-size:15px;
  font-weight:bold;
}

.recharge{
  margin:12px;
  padding:13px;
  border-radius:15px;
  background:#1a1a29;
  border:1px solid #303044;
}

.sectionTitle{
  font-size:15px;
  font-weight:bold;
  margin-bottom:10px;
}

.packages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.package{
  padding:12px 5px;
  border:1px solid #303044;
  border-radius:12px;
  background:#222231;
  color:#fff;
  text-align:center;
}

.packageCoins{
  font-size:14px;
  font-weight:bold;
}

.packagePrice{
  margin-top:5px;
  font-size:11px;
  color:#aaaabd;
}

.demo{
  margin-top:8px;
  color:#777789;
  font-size:10px;
  text-align:center;
}

.searchBox{
  margin:12px;
}

.search{
  width:100%;
  border:1px solid #303044;
  outline:none;
  background:#1b1b2a;
  color:#fff;
  border-radius:22px;
  padding:12px 15px;
  font-size:14px;
}

.search:focus{
  border-color:#7357ff;
}

.categories{
  display:flex;
  gap:7px;
  padding:4px 12px 12px;
  overflow-x:auto;
}

.cat{
  flex:0 0 auto;
  border:1px solid #303044;
  background:#202030;
  color:#aaaabd;
  border-radius:20px;
  padding:8px 13px;
  font-size:12px;
}

.cat.active{
  background:#7357ff;
  color:#fff;
  border-color:#7357ff;
}

.gifts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  padding:0 12px 15px;
}

.gift{
  min-width:0;
  border:1px solid #2d2d40;
  border-radius:15px;
  background:#191923;
  padding:11px 7px;
  text-align:center;
  cursor:pointer;
}

.gift:active{
  transform:scale(.98);
}

.giftIcon{
  width:62px;
  height:62px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#242435;
  font-size:35px;
}

.giftName{
  margin-top:8px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.giftCategory{
  margin-top:3px;
  color:#777789;
  font-size:9px;
}

.giftPrice{
  margin-top:6px;
  color:#ddd;
  font-size:11px;
  font-weight:bold;
}

.noResults{
  grid-column:1/-1;
  text-align:center;
  color:#858597;
  padding:40px 10px;
}

.modalBg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.modalBg.show{
  display:flex;
}

.modal{
  width:min(560px,100%);
  background:#171724;
  border-radius:22px 22px 0 0;
  padding:20px;
  border-top:1px solid #333348;
}

.modalGift{
  text-align:center;
}

.modalIcon{
  width:82px;
  height:82px;
  margin:auto;
  border-radius:50%;
  background:#282838;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}

.modalName{
  margin-top:9px;
  font-size:18px;
  font-weight:bold;
}

.modalPrice{
  margin-top:4px;
  color:#aaaabd;
  font-size:12px;
}

.field{
  margin-top:14px;
}

.field label{
  display:block;
  color:#9999aa;
  font-size:11px;
  margin-bottom:6px;
}

.field input{
  width:100%;
  border:1px solid #343448;
  outline:none;
  background:#242435;
  color:#fff;
  border-radius:11px;
  padding:12px;
  font-size:14px;
}

.qtyRow{
  display:flex;
  gap:8px;
}

.qtyBtn{
  width:46px;
  border:0;
  border-radius:11px;
  background:#29293a;
  color:#fff;
  font-size:20px;
}

.qtyInput{
  flex:1;
  text-align:center;
}

.total{
  margin-top:13px;
  padding:11px;
  border-radius:11px;
  background:#222231;
  text-align:center;
  font-size:13px;
}

.modalActions{
  display:flex;
  gap:9px;
  margin-top:15px;
}

.cancel,
.send{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:bold;
}

.cancel{
  background:#29293a;
  color:#fff;
}

.send{
  background:#7357ff;
  color:#fff;
}

.send:disabled{
  opacity:.5;
}

.toast{
  position:fixed;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  background:#29293a;
  color:#fff;
  padding:11px 16px;
  border-radius:20px;
  font-size:12px;
  display:none;
  z-index:200;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);

  background:#171724;
  border-top:1px solid #29293a;

.nav{

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


function safeNumber(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}


function formatNumber(value){

  return safeNumber(value)
    .toLocaleString("en-IN");
}


function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    window.pvToastTimer
  );

  window.pvToastTimer =
    setTimeout(
      () => {
        toast.classList.remove(
          "show"
        );
      },
      2500
    );
}


async function firebaseGet(path){

  const response =
    await fetch(
      FIREBASE_DB +
      path +
      ".json"
    );

  if(!response.ok){

    throw new Error(
      "Firebase HTTP " +
      response.status
    );
  }

  return await response.json();
}


async function firebasePut(path,data){

  const response =
    await fetch(
      FIREBASE_DB +
      path +
      ".json",
      {
        method:"PUT",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify(data)
      }
    );

  if(!response.ok){

    throw new Error(
      "Firebase save error " +
      response.status
    );
  }

  return await response.json();
}


async function firebasePatch(path,data){

  const response =
    await fetch(
      FIREBASE_DB +
      path +
      ".json",
      {
        method:"PATCH",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify(data)
      }
    );

  if(!response.ok){

    throw new Error(
      "Firebase patch error " +
      response.status
    );
  }

  return await response.json();
}


function renderWallet(){

  if(!me) return;

  walletName.textContent =
    me.name ||
    "Pawan User";

  walletId.textContent =
    "ID: " +
    (me.userId || "");

    DEFAULT_DP;

  coinsEl.textContent =
    formatNumber(
      me.coins
    );

  diamondsEl.textContent =

      me.diamonds

}

    {
      coins:5000,

    },

    {
      coins:11000,

    },

    {

    },

    {
      coins:130000,
      price:"₹1,000"
    },

function getCategories(){

  const names = [
    "All",
    ...new Set(
      gifts.map(
        gift =>
          gift.category
      )
    )
  ];

  return names;
}


function renderCategories(){

  categoriesEl.innerHTML =
    getCategories()
      .map(
        category => `

          <button
            class="cat ${
              category === selectedCategory
                ? "active"
                : ""
            }"
            type="button"
            data-category="${esc(category)}"
          >
            ${esc(category)}
          </button>

        `
      )
      .join("");

  categoriesEl
    .querySelectorAll(
      ".cat"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function(){

            selectedCategory =
              this.dataset.category;

            renderCategories();
            renderGifts();

          }
        );

      }
    );
}


function renderGifts(){

  const search =
    searchEl.value
      .trim()
      .toLowerCase();

  const filtered =
    gifts.filter(
      gift => {

        const categoryMatch =
          selectedCategory === "All" ||
          gift.category ===
            selectedCategory;

        const searchMatch =
          !search ||
          gift.name
            .toLowerCase()
            .includes(search) ||
          gift.category
            .toLowerCase()
            .includes(search);

        return (
          categoryMatch &&
          searchMatch
        );
      }
    );

  if(!filtered.length){

    giftsEl.innerHTML = `
      <div class="noResults">
        कोई gift नहीं मिला।
      </div>
    `;

    return;
  }

  giftsEl.innerHTML =
    filtered.map(
      gift => `

        <div
          class="gift"
          data-gift-id="${esc(gift.id)}"
          role="button"
          tabindex="0"
        >

          <div class="giftIcon">
            ${esc(gift.icon)}
          </div>

          <div class="giftName">
            ${esc(gift.name)}
          </div>

          <div class="giftCategory">
            ${esc(gift.category)}
          </div>

          <div class="giftPrice">
            🪙 ${formatNumber(gift.price)}
          </div>

        </div>

      `
    ).join("");

  giftsEl
    .querySelectorAll(
      ".gift"
    )
    .forEach(
      element => {

        const open = () => {

          const gift =
            gifts.find(
              item =>
                item.id ===
                element.dataset.giftId
            );

          if(gift){

            openGiftModal(
              gift
            );

          }

        };

        element.addEventListener(
          "click",
          open
        );

        element.addEventListener(
          "keydown",
          event => {

            if(
              event.key === "Enter" ||
              event.key === " "
            ){

              event.preventDefault();
              open();

            }

          }
        );

      }
    );
}


function openGiftModal(gift){

  selectedGift =
    gift;

  modalIcon.textContent =
    gift.icon;

  modalName.textContent =
    gift.name;

  modalPrice.textContent =
    "🪙 " +
    formatNumber(
      gift.price
    ) +
    " Coins";

  quantityEl.value =
    1;

  receiverId.value =
    "";

  updateTotal();

  modalBg.classList.add(
    "show"
  );

  setTimeout(
    () => {
      receiverId.focus();
    },
    50
  );
}


function closeGiftModal(){

  modalBg.classList.remove(
    "show"
  );

  selectedGift =
    null;
}


function getQuantity(){

  let quantity =
    parseInt(
      quantityEl.value,
      10
    );

  if(!Number.isFinite(quantity)){
    quantity = 1;
  }

  quantity =
    Math.max(
      1,
      Math.min(
        99,
        quantity
      )
    );

  quantityEl.value =
    quantity;

  return quantity;
}


function updateTotal(){

  if(!selectedGift){

    totalEl.textContent =
      "Total: 0 Coins";

    return;
  }

  const quantity =
    getQuantity();

  const total =
    selectedGift.price *
    quantity;

  totalEl.textContent =
    "Total: " +
    formatNumber(total) +
    " Coins";

  sendBtn.disabled =
    !me ||
    safeNumber(me.coins) <
      total;
}


async function getReceiver(receiver){

  const data =
    await firebaseGet(
      "/users/" +
      encodeURIComponent(
        receiver
      )
    );

  return data;
}


async function sendGift(){

  if(!selectedGift){

    return;
  }

  const receiver =
    receiverId.value
      .trim();

  if(!receiver){

    showToast(
      "Receiver User ID डालें।"
    );

    receiverId.focus();

    return;
  }

  if(
    !me ||
    !me.userId
  ){

    showToast(
      "Current user नहीं मिला।"
    );

    return;
  }

  if(
    receiver ===
    me.userId
  ){

    showToast(
      "आप खुद को gift नहीं भेज सकते।"
    );

    return;
  }

  const quantity =
    getQuantity();

  const total =
    selectedGift.price *
    quantity;

  if(
    safeNumber(me.coins) <
    total
  ){

    showToast(
      "Coins कम हैं।"
    );

    return;
  }

  sendBtn.disabled =
    true;

  sendBtn.textContent =
    "Sending...";

  try{

    const target =
      await getReceiver(
        receiver
      );

    if(!target){

      throw new Error(
        "Receiver User ID नहीं मिला।"
      );
    }

    const receiverName =
      target.name ||
      "User";

    const receiverDp =
      target.dp ||
      DEFAULT_DP;

    /*
      NOTE:
      यह client-side demo wallet flow है।
      Production में coin deduction trusted
      backend/Cloud Function से होना चाहिए।
    */

    const senderCoins =
      safeNumber(me.coins) -
      total;

    const receiverCoins =
      safeNumber(
        target.coins
      ) +
      total;

    const transactionId =
      "GT_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,9);

    const transaction = {

      transactionId,

      senderId:
        me.userId,

      senderName:
        me.name ||
        "Pawan User",

      senderDp:
        me.dp ||
        DEFAULT_DP,

      receiverId:
        receiver,

      receiverName,

      receiverDp,

      giftId:
        selectedGift.id,

      giftName:
        selectedGift.name,

      giftIcon:
        selectedGift.icon,

      category:
        selectedGift.category,

      quantity,

      coinAmount:
        total,

      createdAt:
        Date.now(),

      status:
        "completed"

    };


    /*
      Save sender wallet
    */

    await firebasePatch(
      "/users/" +
      encodeURIComponent(
        me.userId
      ),
      {
        coins:
          senderCoins,

        updatedAt:
          Date.now()
      }
    );


    /*
      Save receiver wallet
    */

    await firebasePatch(
      "/users/" +
      encodeURIComponent(
        receiver
      ),
      {
        coins:
          receiverCoins,

        updatedAt:
          Date.now()
      }
    );


    /*
      Wallet records
    */

    await firebasePatch(
      "/wallets/" +
      encodeURIComponent(
        me.userId
      ),
      {
        coins:
          senderCoins,

        updatedAt:
          Date.now()
      }
    );


    await firebasePatch(
      "/wallets/" +
      encodeURIComponent(
        receiver
      ),
      {
        coins:
          receiverCoins,

        updatedAt:
          Date.now()
      }
    );


    /*
      Gift transaction
    */

    await firebasePut(
      "/giftTransactions/" +
      encodeURIComponent(
        transactionId
      ),
      transaction
    );


    /*
      Sender coin transaction
    */

    await firebasePut(
      "/coinTransactions/" +
      encodeURIComponent(
        transactionId +
        "_S"
      ),
      {
        transactionId:
          transactionId +
          "_S",

        userId:
          me.userId,

        type:
          "gift_sent",

        amount:
          -total,

        reason:
          "Gift sent: " +
          selectedGift.name,

        referenceId:
          transactionId,

        createdAt:
          Date.now()
      }
    );


    /*
      Receiver coin transaction
    */

    await firebasePut(
      "/coinTransactions/" +
      encodeURIComponent(
        transactionId +
        "_R"
      ),
      {
        transactionId:
          transactionId +
          "_R",

        userId:
          receiver,

        type:
          "gift_received",

        amount:
          total,

        reason:
          "Gift received: " +
          selectedGift.name,

        referenceId:
          transactionId,

        createdAt:
          Date.now()
      }
    );


    /*
      Notification for receiver
    */

    const notificationId =
      "NT_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8);

    await firebasePut(
      "/notifications/" +
      encodeURIComponent(
        receiver
      ) +
      "/" +
      encodeURIComponent(
        notificationId
      ),
      {
        id:
          notificationId,

        type:
          "gift",

        title:
          "🎁 New Gift",

        message:
          (
            me.name ||
            "Someone"
          ) +
          " sent you " +
          selectedGift.icon +
          " " +
          selectedGift.name,

        senderId:
          me.userId,

        senderName:
          me.name ||
          "Pawan User",

        senderDp:
          me.dp ||
          DEFAULT_DP,

        giftId:
          selectedGift.id,

        quantity,

        coinAmount:
          total,

        read:false,

        createdAt:
          Date.now()
      }
    );


    /*
      Update local user
    */

    me.coins =
      senderCoins;

    if(
      typeof pvSaveLocalUser ===
      "function"
    ){

      pvSaveLocalUser(
        me
      );

    }

    renderWallet();

    closeGiftModal();

    showToast(
      "🎁 " +
      selectedGift?.name +
      " sent successfully!"
    );

  }catch(error){

    console.error(
      "Send gift error:",
      error
    );

    showToast(
      error.message ||
      "Gift send नहीं हुआ।"
    );

  }finally{

    sendBtn.disabled =
      false;

    sendBtn.textContent =
      "🎁 Send Gift";

    updateTotal();

  }
}


document
  .getElementById(
    "minusBtn"
  )
  .addEventListener(
    "click",
    function(){

      quantityEl.value =
        getQuantity() - 1;

      updateTotal();

    }
  );


document
  .getElementById(
    "plusBtn"
  )
  .addEventListener(
    "click",
    function(){

      quantityEl.value =
        getQuantity() + 1;

      updateTotal();

    }
  );


quantityEl.addEventListener(
  "input",
  updateTotal
);


searchEl.addEventListener(
  "input",
  renderGifts
);


sendBtn.addEventListener(
  "click",
  sendGift
);


document
  .getElementById(
    "cancelBtn"
  )
  .addEventListener(
    "click",
    closeGiftModal
  );


modalBg.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      modalBg
    ){

      closeGiftModal();

    }

  }
);


document
  .getElementById(
    "backBtn"
  )
  .addEventListener(
    "click",
    function(){

      if(
        document.referrer
      ){

        history.back();

      }else{

        location.href =
          "index.html";

      }

    }
  );


async function loadUser(){

  try{

    if(
      typeof pvLoadUser !==
      "function"
    ){

      throw new Error(
        "user.js load नहीं हुआ।"
      );
    }

    me =
      await pvLoadUser();

    renderWallet();

  }catch(error){

    console.error(
      "Store user error:",
      error
    );

    walletName.textContent =
      "Pawan User";

    walletId.textContent =
      "Guest";

  }
}


async function start(){

  renderPackages();

  renderCategories();

  renderGifts();

  await loadUser();

}


start();

</script>
